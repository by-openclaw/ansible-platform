# The guards in scripts/ run on every commit and decide whether a change lands.
# A gate nobody tests is trusted without ever being shown to work — which is how
# four access groups ended up existing in the identity provider and nowhere in code.
name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    name: Guard unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run the tests
        run: python -m pytest tests/ -q
