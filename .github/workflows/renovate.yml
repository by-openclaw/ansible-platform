# Renovate — self-hosted through GitHub Actions (no service to run, no hosted app):
# opens one PR per role for pinned images / releases, a dashboard issue lists what waits.
# Runs weekly and on demand. Token = the platform's by-rune PAT (RUNE_GITHUB_TOKEN).
name: renovate
on:
  schedule:
    - cron: "17 4 * * 1"        # Monday 04:17 UTC (06:17 Brussels)
  workflow_dispatch:
    inputs:
      logLevel:
        description: Log level
        default: info
        type: choice
        options: [info, debug]
permissions:
  contents: read
jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renovate
        uses: renovatebot/github-action@v46.3.1
        with:
          configurationFile: renovate.json
          token: ${{ secrets.RUNE_GITHUB_TOKEN }}
          renovate-version: 44.103.2
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_PLATFORM: github
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          RENOVATE_GIT_AUTHOR: "svc-rune <rune@users.noreply.github.com>"
