name: pre-commit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.4.0
        with:
          fetch-depth: 2   # the inventory guard compares with the first parent (the commit this change lands on)
      - uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12.14"
      - uses: pre-commit/action@v3.0.1
