name: Task
description: Sprint task — approved work item
labels: ["task"]
body:
  - type: input
    id: needs-ref
    attributes:
      label: NEEDS.md reference
      description: Which NEEDS.md item does this implement?
      placeholder: "H11, M5, C1, etc."
    validations:
      required: true
  - type: dropdown
    id: assigned-agent
    attributes:
      label: Assigned to
      options:
        - "@by-rune"
        - "@by-opus"
        - "@yboujraf"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope of work
      description: What exactly needs to be done? Clear, no ambiguity.
    validations:
      required: true
  - type: textarea
    id: done-criteria
    attributes:
      label: Definition of Done
      description: How do we know this is complete?
    validations:
      required: true

