---
# ==============================================================================
# Harbor <-> GitLab integration (topic 2a): publish the Harbor CI robot creds as
# GitLab INSTANCE-level CI/CD variables so every pipeline can
#   docker login "$HARBOR_HOST" -u "$HARBOR_ROBOT_USER" -p "$HARBOR_ROBOT_TOKEN"
# and push private images to harbor.{{ platform_domain }}/gitlab/<image>.
#
# Consumes {env}/harbor/robot-gitlab in Vault (written by roles/harbor gitlab-ci.yml).
# Through GitLab's REST API (roles/gitlab_api), the automation's token from Vault.
# GitLab is a normal inventory host: the play uses the inventory connection (jump
# host, user, key) like every other play. It used to add the host at runtime with
# its own root login, keys and ProxyCommand, which no longer matched the inventory
# and left the host UNREACHABLE.
# ==============================================================================
- name: "Seed Harbor CI credentials into GitLab"
  hosts: gitlab
  become: true
  gather_facts: false
  tasks:
    - name: "The Harbor CI robot creds (Vault, read — the harbor role stores them)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ platform_env }}/harbor/robot-gitlab"

    - name: "Bind them"
      ansible.builtin.set_fact:
        harbor_ci_robot: "{{ vault_secret_result }}"
      no_log: true

    - name: "The reconciler program the play used to stage (retired)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/harbor-ci-vars.rb
        - "{{ gitlab_scripts_dir }}/harbor-ci-vars.rb"

    - name: "Reconcile the CI variables (GitLab API, roles/gitlab_api)"
      ansible.builtin.include_role:
        name: gitlab_api
        tasks_from: instance_variables
      vars:
        gitlab_api_instance_variables:
          - { key: "HARBOR_HOST", value: "{{ harbor_ci_robot.host }}", masked: false, protected: false, raw: false }
          - { key: "HARBOR_ROBOT_USER", value: "{{ harbor_ci_robot.username }}", masked: false, protected: false, raw: true }
          - { key: "HARBOR_ROBOT_TOKEN", value: "{{ harbor_ci_robot.token }}", masked: true, protected: false, raw: true }  # pragma: allowlist secret
