---
# ==============================================================================
# OPNsense config export → NFS (issue #13). Runs on the PVE host (has the
# Synology share mounted at /mnt/pve/poc-backup and reaches the FW over OOB).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/opnsense-config-backup.yml
# ==============================================================================
- name: "OPNsense config export (age → NFS)"
  hosts: srv-proxmox-poc-01
  become: true
  gather_facts: false
  roles:
    - role: opnsense_config_backup
