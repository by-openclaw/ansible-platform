---
# ==============================================================================
# EVS Cerebrum — what an NMOS IS-04/05 registry needs on its host (roles/cerebrum_nmos): Bonjour for
# Windows, the registry's URL reservations on port 8090, the firewall rule. The hosts are the
# `cerebrum_nmos` group, each with its registry's name. The registry itself ("Network Media Server" on
# the device service nmos-registry-<n>, port 8090) is set in Cerebrum: docs/services/cerebrum/README.md.
#
#   Dry run: ansible-playbook playbooks/cerebrum-nmos.yml --check --diff
#   Apply:   ansible-playbook playbooks/cerebrum-nmos.yml [--limit vm-x]
# ==============================================================================
- name: "Cerebrum NMOS | registry prerequisites"
  hosts: cerebrum_nmos
  gather_facts: false
  roles:
    - cerebrum_nmos
