---
# ==============================================================================
# step-ca — internal certificate authority (lxc-stepca-01, VPN-only).
# Guest = infra-terraform-proxmox svc-stepca.tf (VMID 506). Born through
# roles/service_scaffold. CA key password + root fingerprint custodied in Vault.
#   ansible-playbook -i inventories/prod playbooks/step-ca.yml
# ==============================================================================
- name: "Configure step-ca (internal CA)"
  hosts: step_ca
  become: true
  gather_facts: true
  roles:
    - step_ca
