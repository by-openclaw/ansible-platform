---
# ==============================================================================
# The automation controller itself — the machine that runs every play.
# Route to the platform's service zones through the firewall (so Vault's API needs no SSH hop)
# and the SSH agent as a lingering user service (so a desktop restart does not stop automation).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/controller.yml
# ==============================================================================
- name: "Automation controller"
  hosts: localhost
  connection: local
  gather_facts: true
  become: false
  roles:
    - controller
