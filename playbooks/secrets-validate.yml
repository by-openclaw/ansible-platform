---
# ==============================================================================
# Validate that the secrets in Vault are the REAL, working credentials — by
# authenticating against each live service with the value pulled from Vault.
# Data-driven: each check declares {name, type, ...}; the same metadata is what
# a future secrets-rotate.yml will use (generate → write Vault → update service →
# re-validate). Read-only + safe: it only opens auth connections, changes nothing.
#
#   Run:        ansible-playbook -i inventories/prod/hosts.yml playbooks/secrets-validate.yml
#   One type:   ... -e 'secret_validate_types=["postgres"]'
# ==============================================================================
- name: "Validate secrets against running services"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml     # vault_container_name, vault_kv_path, vault_secret_dir, vault_init_secret
    - vars/vault_kv_map.yml                # fabric name -> service/key mapping
  vars:
    vault_migrate_env: "{{ platform_env | default('prod') }}"
    # Where each check type runs its probe (needs the client + network path).
    secret_validate_hosts:
      postgres: "{{ groups['pgadmin'] | first }}"      # its container has psycopg
      redis: "{{ groups['redis'] | first }}"
      ldap: "{{ groups['authentik'] | first }}"        # its container has ldap3
    # Restrict to a subset of types if desired (empty = all).
    secret_validate_types: []
    # The checks. `type` picks the probe; fields are read from the secret itself
    # unless named explicitly (user_field/pass_field/url).
    secret_validate_checks:
      - { name: db-pgsql-authentik, type: postgres }
      - { name: db-pgsql-gitlab, type: postgres }
      - { name: db-pgsql-grafana, type: postgres }
      - { name: db-pgsql-netbird, type: postgres }
      - { name: db-pgsql-netbox, type: postgres }
      - { name: db-pgsql-nextcloud, type: postgres }
      - { name: db-pgsql-superuser, type: postgres }
      - { name: db-pgsql-vaultwarden, type: postgres }
      - { name: db-redis, type: redis }
      - { name: app-grafana-admin, type: http_basic, url: "http://{{ hostvars[groups['monitoring'] | first].ansible_host }}:3000/api/org", user_field: admin_user, pass_field: admin_password }
      # Not a credential — a DR artefact. The only meaningful check is whether
      # Vault still holds what the live host holds; it did not (#572).
      - { name: gitlab-secrets, type: match_file, field: gitlab_secrets,
          live_host: "{{ groups['gitlab'] | first }}", live_path: /etc/gitlab/gitlab-secrets.json }
      - { name: app-ldap-bind, type: ldap, base_dn: "dc=ldap,{{ platform_domain.split('.') | map('regex_replace', '^', 'dc=') | join(',') }}", ldaps: "{{ hostvars[groups['authentik'] | first].ansible_host }}:636" }
  tasks:
    - name: "Vault login (ansible-deploy AppRole; root fallback)"
      ansible.builtin.include_role:
        name: vault_login
    - name: "Use the deploy token"
      ansible.builtin.set_fact:
        vault_root_token: "{{ vault_deploy_token }}"
      no_log: true

    - name: "Validate | Init results"
      ansible.builtin.set_fact:
        _sv_results: []

    - name: "Validate | Run each check"
      ansible.builtin.include_tasks: tasks/secret_validate_one.yml
      loop: "{{ secret_validate_checks }}"
      loop_control:
        loop_var: check
        label: "{{ check.name }} ({{ check.type }})"
      when: secret_validate_types | length == 0 or check.type in secret_validate_types

    - name: "Validate | Summary"
      ansible.builtin.debug:
        msg: >-
          {{ _sv_results | selectattr('ok') | list | length }}/{{ _sv_results | length }} PASS.
          {% for r in _sv_results %}{{ '✓' if r.ok else '✗' }} {{ r.name }}  {% endfor %}

    - name: "Validate | Fail the run if any secret did not authenticate"
      ansible.builtin.assert:
        that: "_sv_results | rejectattr('ok') | list | length == 0"
        fail_msg: "FAILED secrets: {{ _sv_results | rejectattr('ok') | map(attribute='name') | list }}"
        success_msg: "All {{ _sv_results | length }} secrets authenticate against their live service."
