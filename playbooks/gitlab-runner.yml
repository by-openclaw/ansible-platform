---
# ==============================================================================
# GitLab CI runner (Linux + Docker + Kaniko) on vm-gitlab-runner-01.
# Mints an instance-runner auth token on lxc-gitlab-01 (delegated), stores it in
# Vault (get-or-create — no local file), installs Docker + gitlab-runner, and
# registers via a declarative config.toml.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-runner.yml
# Secrets: Vault IS the store — the role reads/writes the token to Vault directly,
# so no separate vault-kv-sync step is needed.
# ==============================================================================
- name: "GitLab CI runner (Docker + Kaniko)"
  hosts: gitlab_runner
  become: true
  gather_facts: true
  roles:
    - role: gitlab_runner
