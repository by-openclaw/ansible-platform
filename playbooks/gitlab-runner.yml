---
# ==============================================================================
# GitLab CI runner (Linux + Docker + Kaniko) on vm-gitlab-runner-01.
# Installs Docker + qemu-guest-agent + gitlab-runner, mints/reads the auth token
# from Vault, and registers via a declarative config.toml.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-runner.yml
# ==============================================================================
- name: "GitLab CI runner (Docker + Kaniko)"
  hosts: gitlab_runner
  become: true
  gather_facts: true
  roles:
    - role: gitlab_runner
