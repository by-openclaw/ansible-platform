---
# ==============================================================================
# certs-sync — refresh the shared wildcard cert on every TLS consumer.
#
# lego renews the wildcard on the Traefik host (cron); Traefik hot-reloads it.
# Backends (Postgres, Redis, …) hold COPIES distributed by the tls_cert role, so
# they must be re-synced after a renewal. This playbook re-runs each consumer's
# tls task only — tls_cert is idempotent (copies only when the cert actually
# changed → notifies the consumer's reload/restart handler):
#   - Postgres: SIGHUP reload (transparent, no dropped connections)
#   - Redis:    container restart (no live TLS reload; sub-second blip)
#   - Vault:    SIGHUP reload (no restart, so no re-seal), one member at a time
#   - etcd:     nothing to restart — it reloads the files on every new connection
#   - Sentinel: container restart, one host at a time (three Sentinels, quorum two)
# Every role that installs the wildcard has a play here (tests/test_certs_sync_covers_consumers.py):
# until 2026-11-06 Vault, the Sentinels and etcd had none and kept the August certificate, and the
# PostgreSQL and Redis plays reached one member each (groups `postgresql` / `redis`): the Redis
# replica kept it too. Each play targets the hosts of the playbook that deploys its role.
#
# Schedule weekly on the controller (well inside lego's 30-day pre-expiry window):
#   17 4 * * 1  cd <repo> && ansible-playbook -i inventories/prod/hosts.yml \
#                 playbooks/certs-sync.yml --vault-password-file .vault_pass
# ==============================================================================
- name: Sync wildcard cert to PostgreSQL (every Patroni member)
  hosts: patroni
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (postgres)"
      ansible.builtin.include_role:
        name: postgresql
        tasks_from: tls.yml

- name: Sync wildcard cert to Redis (the primary and the replica, one at a time)
  hosts: redis_cluster
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (redis)"
      ansible.builtin.include_role:
        name: redis
        tasks_from: tls.yml

- name: Sync wildcard cert to Vault (the members' own listener, :8200)
  hosts: "{{ groups['vault_cluster'] | default(groups['vault']) }}"
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (vault — SIGHUP, no re-seal)"
      ansible.builtin.include_role:
        name: vault
        tasks_from: tls.yml

- name: Sync wildcard cert to etcd (the PostgreSQL cluster's consensus store)
  hosts: patroni
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (etcd — reloaded on the next connection)"
      ansible.builtin.include_role:
        name: etcd
        tasks_from: tls.yml

- name: Sync wildcard cert to the Redis Sentinels (the members and the endpoint guest)
  hosts: redis_cluster:pg_endpoint
  serial: 1
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (redis-sentinel — restart, one at a time)"
      ansible.builtin.include_role:
        name: redis_sentinel
        tasks_from: tls.yml

- name: Sync wildcard cert to the hypervisor console (pveproxy)
  hosts: proxmox_nodes
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (Proxmox VE console)"
      ansible.builtin.include_role:
        name: pve_host
        tasks_from: tls.yml

- name: Sync wildcard cert to the backup server (proxmox-backup-proxy)
  hosts: pbs
  become: true
  gather_facts: false
  tasks:
    - name: "Refresh wildcard cert (PBS API/UI)"
      ansible.builtin.include_role:
        name: pbs
        tasks_from: tls.yml

# The Cerebrum servers (Windows) hold a copy of the dev zone wildcard: files, machine store, the
# thumbprint in Cerebrum's Security row (Cerebrum reads it at its next start).
- name: Sync the zone wildcard to the Cerebrum servers
  hosts: cerebrum_server
  gather_facts: false
  tasks:
    - name: "Refresh the zone wildcard (Cerebrum web client / RCP)"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: certificate.yml

# The SQL Server instance of Cerebrum: the same zone wildcard; a new one restarts the instance (it reads
# the certificate at start) — both Cerebrum instances lose their database for those seconds.
- name: Sync the zone wildcard to the Cerebrum SQL Server instance
  hosts: cerebrum_db
  gather_facts: false
  tasks:
    - name: "Refresh the zone wildcard (SQL Server instance)"
      ansible.builtin.include_role:
        name: cerebrum_db
        tasks_from: certificate.yml

# The hypervisor addresses the backup server by name and trusts it through its CA store (no pinned
# fingerprint — pbs-pve-storage.yml); this run converges that and the configuration-export unit.
# Until 2026-10-26 it re-pinned a fingerprint an hour after the certificate swap: the 26 guests
# backed up in between failed.
- name: "Hypervisor trusts the backup server through its CA store (storage definition)"
  ansible.builtin.import_playbook: pbs-pve-storage.yml

- name: Configuration export unit carries the current fingerprint
  hosts: proxmox_nodes
  become: true
  gather_facts: true
  tasks:
    - name: "Refresh the configuration-export job (fingerprint from the storage definition)"
      ansible.builtin.include_role:
        name: pve_host
        tasks_from: config_backup.yml
