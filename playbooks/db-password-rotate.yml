---
# ==============================================================================
# Rotate ONE service's PostgreSQL password (SVC-28 >=32 chars; SEC-09 rotation
# machinery). Order: mint 40-char -> ALTER ROLE -> Vault + fabric working copy.
# The service consumes the new credential on its NEXT play run — run the
# service's playbook right after (the driver does), so the window where the app
# still holds the old password is minutes (PG sessions already open keep
# working; only NEW connections need the new secret).
#
#   ansible-playbook playbooks/db-password-rotate.yml -e rotate_svc=grafana \
#     [-e rotate_user=grafana]      # PG role name, defaults to rotate_svc
# ==============================================================================
- name: "Rotate a service DB password"
  hosts: lxc-pgsql-01
  become: true
  gather_facts: false
  vars:
    rotate_user: "{{ rotate_svc }}"
    rotate_vault_path: "prod/{{ rotate_svc }}/db-pgsql"
    rotate_fabric: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/fabric/db-pgsql-{{ rotate_svc }}.json"
  tasks:
    - name: "Rotate | Require the service name"
      ansible.builtin.assert:
        that: rotate_svc is defined and rotate_svc | length > 0
        quiet: true

    - name: "Rotate | Mint the new password (40 chars, SVC-28)"
      ansible.builtin.set_fact:
        rotate_new: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      no_log: true

    - name: "Rotate | ALTER ROLE in PostgreSQL"
      ansible.builtin.shell: |
        set -o pipefail
        C=$(docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -i postgres | head -1)
        docker exec -e NP="$NEWPW" "$C" sh -c 'psql -U postgres -c "ALTER ROLE \"{{ rotate_user }}\" WITH PASSWORD '\''$NP'\'';"'
      args: { executable: /bin/bash }
      environment:
        NEWPW: "{{ rotate_new }}"
      register: rotate_alter
      changed_when: "'ALTER ROLE' in rotate_alter.stdout"
      no_log: true

    - name: "Rotate | Read the current Vault secret (merge base)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ rotate_vault_path }}"
        vault_secret_init: {}

    - name: "Rotate | Snapshot the current fields"
      ansible.builtin.set_fact:
        rotate_base: "{{ vault_secret_result }}"
      no_log: true

    - name: "Rotate | Write the rotated secret to Vault"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ rotate_vault_path }}"
        vault_secret_force_fields: "{{ rotate_base | combine({'password': rotate_new, 'rotated': '%Y-%m-%dT%H:%M:%SZ' | strftime}) }}"  # pragma: allowlist secret

    - name: "Rotate | Update the fabric working copy (0600)"
      ansible.builtin.copy:
        dest: "{{ rotate_fabric }}"
        mode: "0600"
        content: "{{ {'fields': (rotate_base | combine({'password': rotate_new}))} | to_nice_json }}"
      delegate_to: localhost
      become: false
      no_log: true

    - name: "Rotate | Done"
      ansible.builtin.debug:
        msg: "{{ rotate_svc }}: PG role + Vault + fabric rotated (40 chars) — now rerun the service play"
