---
# ==============================================================================
# Rotate ONE service's PostgreSQL password (SVC-28 >=32 chars; SEC-09 rotation
# machinery). Order: mint 40-char -> ALTER ROLE -> Vault.
# The service consumes the new credential on its NEXT play run — run the
# service's playbook right after (the driver does), so the window where the app
# still holds the old password is minutes (PG sessions already open keep
# working; only NEW connections need the new secret).
#
#   ansible-playbook playbooks/db-password-rotate.yml -e rotate_svc=grafana \
#     [-e rotate_user=grafana]      # PG role name, defaults to rotate_svc
# ==============================================================================
# One play host (the first member): the password is minted once, and the statement goes to the
# cluster's leader, wherever it is (roles/postgres_db tasks/leader.yml).
- name: "Rotate a service DB password"
  hosts: "{{ groups['postgresql'] | first }}"
  become: true
  gather_facts: false
  vars:
    rotate_user: "{{ rotate_svc }}"
    rotate_vault_path: "{{ platform_env }}/{{ rotate_svc }}/db-pgsql"
  tasks:
    - name: "Rotate | Require the service name"
      ansible.builtin.assert:
        that: rotate_svc is defined and rotate_svc | length > 0
        quiet: true

    - name: "Rotate | Find the cluster's leader"
      ansible.builtin.include_role:
        name: postgres_db
        tasks_from: leader
        public: true   # the tasks below use the role's settings (leader host, container, psql)

    - name: "Rotate | Mint the new password (40 chars, SVC-28)"
      ansible.builtin.set_fact:
        rotate_new: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      no_log: true

    # The statement goes to psql on standard input, on the leader: the password is on no command
    # line and in no task environment. psql stops at the first error (a role that does not exist).
    - name: "Rotate | ALTER ROLE on the leader"
      community.docker.docker_container_exec:
        container: "{{ postgres_db_container }}"
        argv: "{{ postgres_db_psql }}"
        stdin: "ALTER ROLE \"{{ rotate_user }}\" WITH PASSWORD '{{ rotate_new | replace(\"'\", \"''\") }}';"
      delegate_to: "{{ postgres_db_host }}"
      changed_when: true
      no_log: true

    - name: "Rotate | Read the current Vault secret (merge base)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ rotate_vault_path }}"
        vault_secret_init: {}

    - name: "Rotate | Snapshot the current fields"
      ansible.builtin.set_fact:
        rotate_base: "{{ vault_secret_result }}"
      no_log: true

    - name: "Rotate | Write the rotated secret to Vault"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ rotate_vault_path }}"
        vault_secret_force_fields: "{{ rotate_base | combine({'password': rotate_new, 'rotated': '%Y-%m-%dT%H:%M:%SZ' | strftime}) }}"  # pragma: allowlist secret

    - name: "Rotate | Done"
      ansible.builtin.debug:
        msg: "{{ rotate_svc }}: PG role + Vault rotated (40 chars) — now rerun the service play"
