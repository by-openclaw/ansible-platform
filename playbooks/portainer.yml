---
# ==============================================================================
# Portainer — one console for both container worlds: the k3s cluster (server runs
# in-cluster) and every Docker-in-LXC host (agent per host). Published internally
# through the platform Traefik with Authentik in front. Rerun = changed=0.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/portainer.yml
# ==============================================================================
- name: "Portainer — server (in the k3s cluster)"
  hosts: k3s
  become: true
  gather_facts: true
  roles:
    - role: portainer

# Environments can only be registered once the agents answer, so this is a third
# play rather than a step inside the server role.
- name: "Portainer — agent on every Docker host"
  hosts: cluster:mailcow:!lxc-pgsql-01:!lxc-redis-01
  become: true
  gather_facts: true
  tasks:
    - name: "Portainer | agent"
      ansible.builtin.import_role:
        name: portainer
        tasks_from: agent.yml

- name: "Portainer — register every Docker host as an environment"
  hosts: k3s
  become: true
  gather_facts: false
  tasks:
    - name: "Portainer | secrets + the host list"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ portainer_admin_vault_path }}"
        vault_secret_init: {}

    - name: "Portainer | Bind the admin password and the host list"
      ansible.builtin.set_fact:
        portainer_admin_password: "{{ vault_secret_result.password }}"
        portainer_api_base: "http://{{ k3s_node_ip | default(ansible_host) }}:{{ k3s_ingress_http_port | default(80) }}"
        portainer_docker_hosts: >-
          {{ portainer_agent_groups | map('extract', groups) | select('defined')
             | sum(start=[]) | unique | sort | map('extract', hostvars) | list }}
      no_log: true

    - name: "Portainer | Register the Docker environments (API, idempotent)"
      ansible.builtin.include_role:
        name: portainer
        tasks_from: endpoints.yml
      when: not ansible_check_mode

    - name: "Portainer | Authenticate the console against Authentik (native OIDC)"
      ansible.builtin.include_role:
        name: portainer
        tasks_from: sso.yml
      when: not ansible_check_mode
