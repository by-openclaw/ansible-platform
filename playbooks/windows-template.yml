---
# ==============================================================================
# Build a Windows template on a Proxmox node (roles/windows_template — the pipeline is in the
# role's defaults). Canary-style target like identity-baseline: name the node explicitly.
#   ansible-playbook playbooks/windows-template.yml -e target=<node>
# ==============================================================================
- name: "Windows template"
  hosts: "{{ target | default('none') }}"
  become: true
  gather_facts: false
  roles:
    - windows_template
