---
# ==============================================================================
# Shared diagram services — Kroki (+ Mermaid) + drawio on lxc-diagrams-01.
# Internal-only (VPN + FW; no public). Kroki is a server-to-server render API so
# it is NOT forwardAuth-gated (would break API callers); drawio is the editor UI.
# Used platform-wide (GitLab admin diagram settings, docs, NetBox, admin portal).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/diagrams.yml
# ==============================================================================
- name: "Diagram services (Kroki + drawio)"
  hosts: diagrams
  become: true
  gather_facts: true
  roles:
    - role: diagrams
  tasks:
    - name: "Traefik route — Kroki (render API)"
      ansible.builtin.include_role:
        name: traefik_route
      vars:
        traefik_route_name: kroki
        traefik_route_fqdn: kroki.by-research.be
        traefik_route_backend_url: "http://lxc-diagrams-01.by-research.be:8000"

    - name: "Traefik route — PlantUML (standalone render)"
      ansible.builtin.include_role:
        name: traefik_route
      vars:
        traefik_route_name: plantuml
        traefik_route_fqdn: plantuml.by-research.be
        traefik_route_backend_url: "http://lxc-diagrams-01.by-research.be:8004"

    - name: "Traefik route — drawio (editor, SSO-gated)"
      ansible.builtin.include_role:
        name: traefik_route
      vars:
        traefik_route_name: drawio
        traefik_route_fqdn: drawio.by-research.be
        traefik_route_backend_url: "http://lxc-diagrams-01.by-research.be:8080"
        # drawio is a human UI → gate behind Authentik forwardAuth (diagrams-users).
        # kroki/plantuml are server-to-server render APIs → left open (auth would
        # break machine callers); network access is already VPN + FW restricted.
        traefik_route_forward_auth: true
