---
# ==============================================================================
# k3s application platform (vm-k3s-01): pinned k3s server, registry mirrors via
# Harbor, per-namespace CI deployers (kubeconfig → Vault + GitLab CI variable),
# app routes on the platform Traefik (TLS + SSO). Rerun = changed=0.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/k3s.yml
# Bring-up of a new VM first: identity-baseline (-e ansible_user=by-systems -e ansible_port=22) → hardening → this.
# ==============================================================================
- name: "k3s — application platform"
  hosts: k3s
  become: true
  gather_facts: true
  roles:
    - role: k3s
