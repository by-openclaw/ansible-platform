---
# Provision the controller's ansible-deploy identity (policy + AppRole) — the
# root-token replacement for every deploy. Run once (idempotent thereafter).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/vault-deploy-identity.yml
- name: "Vault deploy identity (ansible-deploy)"
  hosts: vault
  become: true
  gather_facts: false
  roles:
    - vault_deploy_identity
