---
# ==============================================================================
# Package caches — devpi (PyPI) + apt-cacher-ng (Debian) on lxc-pkgcache-01 (private).
# Guest = infra-terraform-proxmox svc-ha-control.tf (VMID 519). Born through
# roles/service_scaffold (the containers, the edge route for the PyPI cache).
#   ansible-playbook -i inventories/prod playbooks/pkgcache.yml
# ==============================================================================
- name: "Configure the package caches (PyPI, Debian)"
  hosts: pkgcache
  become: true
  gather_facts: true
  roles:
    - base
    - docker
    - pkgcache
