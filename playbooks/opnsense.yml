---
# OPNsense Configuration Playbook
#
# Idempotent. Safe to run repeatedly.
# Configures: system, interfaces (VLANs), DNS, DHCP, NTP, firewall aliases+rules, WireGuard.
#
# Routing note: Rune VM cannot reach OPNsense (10.6.224.106) directly.
# This playbook opens an SSH tunnel through Proxmox (root@10.6.224.105:22222)
# binding localhost:8443 → 10.6.224.106:443. All role tasks connect to 127.0.0.1:8443.
# Tunnel is opened async (poll: 0) so Ansible doesn't wait for it to exit.
# Refs: ansible-platform#5
#
# Run:        ansible-playbook playbooks/opnsense.yml
# Tag subset: ansible-playbook playbooks/opnsense.yml --tags firewall
#             ansible-playbook playbooks/opnsense.yml --tags interfaces
# Dry run:    ansible-playbook playbooks/opnsense.yml --check --diff

- name: Open SSH tunnel to OPNsense API via Proxmox
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Tunnel | Kill any stale tunnel on port 8443
      ansible.builtin.shell:
        cmd: "fuser -k 8443/tcp 2>/dev/null || true"
        executable: /bin/bash
      failed_when: false
      changed_when: false
      check_mode: false
      when: opnsense_use_tunnel | default(false) | bool
      tags: always

    - name: Tunnel | Open SSH port-forward (async — does not block)
      ansible.builtin.command:
        argv:
          - ssh
          - -i
          - /home/by-systems/.ssh/id_ed25519_rune_automation
          - -p
          - "22222"
          - -o
          - StrictHostKeyChecking=no
          - -o
          - ExitOnForwardFailure=yes
          - -o
          - ServerAliveInterval=30
          - -N
          - -L
          - 8443:10.6.224.106:443
          - root@10.6.224.105
      async: 3600
      poll: 0
      changed_when: false
      check_mode: false
      when: opnsense_use_tunnel | default(false) | bool
      tags: always

    - name: Tunnel | Wait for port 8443 to be ready
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 8443
        delay: 1
        timeout: 20
      check_mode: false
      when: opnsense_use_tunnel | default(false) | bool
      tags: always

- name: "Auth — local user passwords from Vault (never in the catalog)"
  hosts: lxc-vault-01
  become: true
  gather_facts: false
  tags: [auth]
  tasks:
    # One read per declared user, accumulated per item (see the task file for why a looped
    # include_role with `register` cannot do this). A user with no Vault entry is declared without
    # a password — fine for an account that authenticates through LDAP; the local record exists to
    # carry group membership and privileges (#369).
    - name: "Auth | Read each user's webgui password (read-only)"
      ansible.builtin.include_tasks: tasks/opnsense_auth_vault_read.yml
      loop: "{{ hostvars[groups['opnsense'][0]].opn_auth_users | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      tags: [auth]

    - name: "Auth | Hand the passwords to the firewall hosts"
      ansible.builtin.set_fact:
        opnsense_auth_user_passwords: "{{ opnsense_auth_user_passwords | default({}) }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['opnsense'] }}"
      no_log: true
      tags: [auth]

- name: "Monit mail creds — Vault read outside the connection:local play"
  hosts: lxc-vault-01
  become: true
  gather_facts: false
  tags: [services, monit]
  tasks:
    - name: "Monit | Read the opnsense mailbox creds (read-only)"
      ansible.builtin.include_role:
        name: vault_secret
        apply:
          tags: [services, monit]
      vars:
        # The service mailbox lives where Mailcow lives (one Mailcow, on prod): `platform_mail_env`
        # / `platform_mail_domain` (inventories/<env>/group_vars/all/deployment.yml) default to the
        # deployment's own env/domain and are pinned to prod on test. No test/mail/* secret exists.
        vault_secret_path: "{{ platform_mail_env | default(platform_env | default('prod')) }}/mail/opnsense"
        vault_secret_init: {}
      tags: [services, monit]

    - name: "Monit | Hand the SMTP settings to the firewall hosts"
      ansible.builtin.set_fact:
        opnsense_monitchk_smtp:
          # Asset FQDN, not mail. (which split-DNS maps to Traefik / public IP;
          # SMTP is NOT proxied). Wildcard cert *.{domain} covers it -> TLS verify stays ON.
          smtp_host: "vm-mailcow-01.{{ platform_mail_domain | default(platform_domain | default('by-research.be')) }}"
          smtp_port: "{{ vault_secret_result.smtp_port }}"
          smtp_username: "{{ vault_secret_result.address }}"
          smtp_password: "{{ vault_secret_result.password }}"
          from_address: "{{ vault_secret_result.address }}"
          to_address: "alerts@{{ platform_mail_domain | default(platform_domain | default('by-research.be')) }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['opnsense'] }}"
      no_log: true
      tags: [services, monit]

- name: "Cloudflare zone creds — Vault read outside the connection:local play"
  hosts: lxc-vault-01
  become: true
  gather_facts: false
  tags: [acme, certs, dyndns, dns]
  vars:
    # The FW consumes the zone secret twice: ACME DNS-01 (opn_acme) and os-ddclient
    # (opnsense_dyndns_accounts). One read, one fact, both consumers.
    opnsense_cf_zone_needed: >-
      {{ (hostvars[groups['opnsense'][0]].opn_acme is defined)
         or ((hostvars[groups['opnsense'][0]].opnsense_dyndns_accounts | default([])) | length > 0) }}
  tasks:
    - name: "Cloudflare | Read the zone secret (read-only; token, account id, zone id, ACME e-mail)"
      ansible.builtin.include_role:
        name: vault_secret
        apply:
          tags: [acme, certs, dyndns, dns]
      vars:
        # One Cloudflare zone secret per DNS zone (roles/cloudflare): the FW's certificate zone
        # is the deployment's own zone unless the catalog pins another one (opn_acme.zone_secret).
        vault_secret_path: >-
          {{ (hostvars[groups['opnsense'][0]].opn_acme | default({})).zone_secret
             | default((platform_env | default('prod')) ~ '/cloudflare/'
                       ~ (platform_mail_domain | default(platform_domain | default('by-research.be')) | replace('.', '-'))) }}
        vault_secret_init: {}
      tags: [acme, certs, dyndns, dns]
      when: opnsense_cf_zone_needed | bool

    - name: "Cloudflare | Hand the zone credentials to the firewall hosts"
      ansible.builtin.set_fact:
        opnsense_cf_zone:
          api_token: "{{ vault_secret_result.api_token }}"
          account_id: "{{ vault_secret_result.account_id }}"
          zone_id: "{{ vault_secret_result.zone_id | default('') }}"
          acme_email: "{{ vault_secret_result.acme_email }}"
      delegate_to: "{{ item }}"
      delegate_facts: true
      loop: "{{ groups['opnsense'] }}"
      no_log: true
      tags: [acme, certs, dyndns, dns]
      when: opnsense_cf_zone_needed | bool

- name: Configure OPNsense
  hosts: opnsense
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # Collection (by_systems.opnsense) connection args — straight to the
    # firewall the catalog declares (opn_host), no port-forward in between.
    opnsense_firewall: "{{ opn_host }}"
    opnsense_api_port: "{{ opn_port | default(443) }}"
    # uri-module tasks connection
    opnsense_api_url: "https://{{ opn_host }}:{{ opn_port | default(443) }}"
  pre_tasks:
    # Creds must be facts ON THE FW HOST (the tunnel play above runs on localhost,
    # so its include never reaches this play's host — 401 on the first uri call).
    - name: "FW API credentials (Vault / local fast-path) on the firewall host"
      ansible.builtin.include_role:
        name: opnsense_api_creds
        apply:
          tags: [always]   # inner tasks must run under any --tags subset (e.g. --tags firewall)
      tags: always
  roles:
    - role: opnsense

- name: Close SSH tunnel
  hosts: localhost
  gather_facts: false
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
  tasks:
    - name: Tunnel | Close SSH port-forward
      ansible.builtin.shell:
        cmd: "fuser -k 8443/tcp 2>/dev/null || true"
        executable: /bin/bash
      failed_when: false
      changed_when: false
      check_mode: false
      when: opnsense_use_tunnel | default(false) | bool
      tags: always
