---
# OPNsense PROD configuration playbook — vm-opns-01 (FW 100).
#
# Direct connection: Rune (10.6.239.103) reaches the FW OOB (10.6.239.196) on the
# same OOB subnet, so NO Proxmox SSH tunnel is needed (unlike playbooks/opnsense.yml).
# All role tasks talk to the OPNsense MVC API at https://{{ opn_host }}:443.
#
# Idempotent. Safe to run repeatedly.
#   Dry run:    ansible-playbook -i inventories/prod/hosts.yml playbooks/opnsense-prod.yml --check --diff
#   Apply:      ansible-playbook -i inventories/prod/hosts.yml playbooks/opnsense-prod.yml
#   Tag subset: ... --tags interfaces

- name: Configure OPNsense (PROD, direct API)
  hosts: opnsense
  gather_facts: false
  connection: local
  become: false
  vars:
    ansible_python_interpreter: /usr/bin/python3
    # qemu-guest-agent is already installed by the seed (firmware plugins list);
    # the role's pkg-based install task assumes a shell on the FW (we use the API).
    opnsense_install_qemu_agent: false
    # Point the role + collection straight at the FW OOB API (no tunnel)
    opnsense_host: "{{ opn_host }}"
    opnsense_port: "{{ opn_port }}"
    opnsense_firewall: "{{ opn_host }}"
    opnsense_api_port: "{{ opn_port }}"
    opnsense_api_url: "https://{{ opn_host }}:{{ opn_port }}"
  pre_tasks:
    - name: "FW API credentials from Vault"
      ansible.builtin.import_role:        # static import: `always` propagates to the role's tasks
        name: opnsense_api_creds
      tags: [always]          # creds must load under ANY --tags selection
  roles:
    - role: opnsense
