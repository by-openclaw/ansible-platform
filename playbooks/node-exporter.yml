---
# node-exporter on every Linux host (fleet-wide) — Prometheus scrapes each :9100.
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/node-exporter.yml
- name: Node-exporter (fleet-wide host metrics)
  hosts: cluster:adguard:mailcow:gitlab_runner   # every guest that Prometheus scrapes (prometheus_node_groups)
  become: true
  gather_facts: false
  roles:
    - role: node_exporter
