---
# ==============================================================================
# Monitoring stack on lxc-monitoring-01 (SVC 10.1.3.230):
#   - Prometheus (metrics TSDB + scraper; small local TSDB, 15d)
#   - Loki       (logs; chunks + index in SeaweedFS S3)
#   - Grafana    (dashboards; DB on the cluster Postgres; SSO via Authentik; Traefik)
#
#   Run:  ansible-playbook -i inventories/prod/hosts.yml playbooks/monitoring.yml
#   Tags: --tags install | config | db | sso | route
#
# Order across the platform: run playbooks/node-exporter.yml (fleet agents) +
# the authentik role (writes fabric/app-oidc-grafana.json) before/with this.
# ==============================================================================
- name: Monitoring stack (Prometheus + Loki + Grafana)
  hosts: monitoring
  become: true
  gather_facts: true
  roles:
    - role: prometheus
    - role: loki
    - role: grafana
