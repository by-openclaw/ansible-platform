---
# ==============================================================================
# EVS Cerebrum — the database and the Cerebrum servers, one playbook (owner 2026-11-03).
#   1. the SQL Server instance (roles/cerebrum_db) on the `cerebrum_db` hosts: pinned media, sa
#      from Vault, static port, one database and one login per Cerebrum instance, nightly backup,
#      the firewall rule for the Cerebrum servers. Cerebrum creates its database at first start.
#      A Cerebrum server that carries its own instance is in both groups (the "local" layout).
#   2. the Cerebrum servers (`cerebrum_server`, each with its `cerebrum_instance`): the ODBC driver
#      Cerebrum's SQL tester looks for (roles/mssql_odbc); Cerebrum.ini with the instance's SQL connection
#      (created once, before the first start); the application Admin password Cerebrum asks for at its
#      first start, in Vault, and its encrypted form once set (roles/cerebrum_server ini, admin_password,
#      admin_capture).
# Runs after the guest baseline (playbooks/windows-guests.yml). SQL setup may ask for a restart of
# the database host: the role restarts it then — announce the run first.
#
#   Dry run: ansible-playbook playbooks/cerebrum.yml --check --diff
#   One step: --tags sql | sql-certificate | odbc | firewall | rcp | certificate | windows | startup | sentinel | ini | settings | admin
#   Apply:   ansible-playbook playbooks/cerebrum.yml [--limit vm-x]
# ==============================================================================
- name: "Cerebrum | the SQL Server instance"
  hosts: cerebrum_db
  gather_facts: false
  roles:
    - role: cerebrum_db
      tags: [sql]

- name: "Cerebrum | the SQL Server instance's certificate (restarts the instance when it changes)"
  hosts: cerebrum_db
  gather_facts: false
  tasks:
    - name: "Cerebrum | The tier's zone wildcard on the instance"
      ansible.builtin.include_role:
        name: cerebrum_db
        tasks_from: certificate.yml
        apply:
          tags: [sql-certificate]
      tags: [sql-certificate]

- name: "Cerebrum | the Cerebrum servers: ODBC driver, Cerebrum.ini, the application Admin in Vault"
  hosts: cerebrum_server
  gather_facts: false
  roles:
    - role: mssql_odbc
      tags: [odbc]
  tasks:
    - name: "Cerebrum | The host firewall: Cerebrum's doors, bound to the program"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: firewall.yml
        apply:
          tags: [firewall]
      tags: [firewall]
    - name: "Cerebrum | HTTP address reservations of Cerebrum's listeners (RCP)"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: http_reservations.yml
        apply:
          tags: [rcp]
      tags: [rcp]
    - name: "Cerebrum | The certificate: the tier's zone wildcard (files + machine store), the Security rows"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: certificate.yml
        apply:
          tags: [certificate]
      tags: [certificate]
    - name: "Cerebrum | EVS §3.5 on Windows: UAC, run as administrator, Defender exclusions, hosts file"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: windows.yml
        apply:
          tags: [windows]
      tags: [windows]
    - name: "Cerebrum | Start at boot: the run account signs in, Watchdog then Cerebrum, elevated"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: startup.yml
        apply:
          tags: [startup]
      tags: [startup]
    - name: "Cerebrum | Sentinel persistence (Cerebrum refuses a licence without it)"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: sentinel.yml
        apply:
          tags: [sentinel]
      tags: [sentinel]
    - name: "Cerebrum | Cerebrum.ini: the instance's SQL connection, before the first start"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: ini.yml
        apply:
          tags: [ini]
      tags: [ini]
    - name: "Cerebrum | Cerebrum's settings rows (_Config), written where they differ"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: config.yml
        apply:
          tags: [settings]
      tags: [settings]
    - name: "Cerebrum | The application Admin password (Vault)"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: admin_password.yml
        apply:
          tags: [admin]
      tags: [admin]
    - name: "Cerebrum | The Admin password's encrypted form, once Cerebrum has set it (Vault, for recovery)"
      ansible.builtin.include_role:
        name: cerebrum_server
        tasks_from: admin_capture.yml
        apply:
          tags: [admin]
      tags: [admin]
