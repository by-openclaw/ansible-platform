---
# Manage public Cloudflare DNS for by-research.be (exposure model).
# Controller-side only — no FW/host connection.
#   Apply:  ansible-playbook playbooks/cloudflare-dns.yml
- name: Cloudflare public DNS (by-research.be)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - cloudflare_dns
