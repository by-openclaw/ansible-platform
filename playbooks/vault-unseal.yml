---
# ==============================================================================
# Unseal Vault after a restart (host reboot, container restart, manual seal).
# Model A (approved): unseal material lives OFF-platform (printed kit / safe;
# encrypted NAS copy) — this play PROMPTS for the unseal key and never stores
# it (vars_prompt, no_log, not a fact cached anywhere).
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/vault-unseal.yml
#   Runbook: platform-setup tools/vault/runbooks/unseal.md
# ==============================================================================
- name: "Unseal Vault (operator-prompted share)"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml
  vars_prompt:
    - name: vault_unseal_key
      prompt: "Vault unseal key (from the printed kit — input hidden, never stored)"
      private: true
  tasks:
    - name: "Unseal | Current seal status"
      ansible.builtin.command:
        argv: ["docker", "exec", "{{ vault_container_name }}", "vault", "status", "-format=json"]
      register: unseal_status
      changed_when: false
      failed_when: false

    - name: "Unseal | Already unsealed?"
      ansible.builtin.set_fact:
        vault_sealed: "{{ (unseal_status.stdout | from_json).sealed | default(true) }}"

    - name: "Unseal | Apply the share"
      ansible.builtin.command:
        argv: ["docker", "exec", "{{ vault_container_name }}", "vault", "operator", "unseal", "{{ vault_unseal_key }}"]
      when: vault_sealed | bool
      changed_when: true
      no_log: true

    - name: "Unseal | Verify"
      ansible.builtin.command:
        argv: ["docker", "exec", "{{ vault_container_name }}", "vault", "status", "-format=json"]
      register: unseal_verify
      changed_when: false
      failed_when: (unseal_verify.stdout | from_json).sealed | default(true)

    - name: "Unseal | Result"
      ansible.builtin.debug:
        msg: "Vault is UNSEALED (was {{ 'sealed' if vault_sealed else 'already unsealed' }})."
