# ==============================================================================
# GitLab demo project — Kaniko build → registry + GitLab Pages, on the runner.
# Requires the platform group tree (playbooks/gitlab-rbac.yml) to exist first.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-demo.yml
# ==============================================================================
- name: "GitLab demo project (CI/CD + Pages)"
  hosts: gitlab
  become: true
  gather_facts: false
  roles:
    - role: gitlab_demo
