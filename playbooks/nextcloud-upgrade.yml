---
# ==============================================================================
# Playbook: nextcloud-upgrade.yml — sequential major upgrade for Nextcloud.
#
# Nextcloud refuses to skip majors, and each major applies its own database
# migrations via `occ upgrade`. Jumping 33 -> 34 directly, or moving off a major
# before its latest patch, does not fail loudly — it corrupts. So the ladder is
# explicit and every rung is verified before the next one is allowed to start.
#
#   DRY RUN (prints the ladder, changes nothing):
#     ansible-playbook -i inventories/prod/hosts.yml playbooks/nextcloud-upgrade.yml
#
#   APPLY:
#     ansible-playbook -i inventories/prod/hosts.yml playbooks/nextcloud-upgrade.yml \
#       -e upgrade_path_apply=true
#
# Backed up first: before the first rung the role snapshots the guest to PBS (roles/upgrade_path
# backup.yml); the database is the cluster's (pgBackRest, point in time). A failed major migration
# is restored, not retried.
# ==============================================================================

- name: "Nextcloud — sequential major upgrade"
  hosts: nextcloud
  become: true
  gather_facts: true
  any_errors_fatal: true

  roles:
    - role: upgrade_path
      vars:
        upgrade_path_service: nextcloud

        # Latest patch of the CURRENT major first, then the next major. This
        # ordering is Nextcloud's own requirement, not a preference.
        upgrade_path_steps:
          - version: "33.0.8"
            image: "nextcloud:33.0.8-apache"
            note: "latest 33.x — required before leaving the major"
          - version: "34.0.3"
            image: "nextcloud:34.0.3-apache"
            note: "major 33 -> 34"
          - version: "34.0.4"
            image: "nextcloud:34.0.4-apache"
            note: "34.x patch"
          - version: "34.0.5"
            image: "nextcloud:34.0.5-apache"
            note: "latest 34.x — required before leaving the major"
          - version: "35.0.2"
            image: "nextcloud:35.0.2-apache"
            note: "major 34 -> 35 — every enabled store app has a 35 release (store checked 2026-11-06)"

        upgrade_path_current:
          argv: [docker, exec, -u, www-data, nextcloud, php, occ, status, --output=json]
          regex: '"versionstring":"([^"]+)"'

        # Re-run the nextcloud role with this rung's image so the upgrade takes
        # the normal deploy path instead of a hand-rolled docker command.
        upgrade_path_role: nextcloud
        upgrade_path_image_var: nextcloud_image

        # occ upgrade MUST complete before the next major is applied: it is run, then no database
        # upgrade may be pending (a rung with nothing to migrate makes occ upgrade exit non-zero).
        upgrade_path_migrate:
          - name: "occ upgrade"
            argv: [docker, exec, -u, www-data, nextcloud, php, occ, upgrade, --no-interaction]
            tolerate_failure: true
            changes: true
          - name: "no database upgrade pending"
            argv: [docker, exec, -u, www-data, nextcloud, php, occ, status, --output=json]
            stdout_regex: ['"needsDbUpgrade":false']

        # Health gate: installed, not in maintenance, no pending DB upgrade.
        upgrade_path_verify:
          - name: "installed, not in maintenance, no database upgrade pending"
            argv: [docker, exec, -u, www-data, nextcloud, php, occ, status, --output=json]
            stdout_regex: ['"installed":true', '"maintenance":false', '"needsDbUpgrade":false']
