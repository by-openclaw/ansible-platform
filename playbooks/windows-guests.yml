---
# ==============================================================================
# The Windows guests' baseline (roles/windows_guest): the platform route via the
# firewall's OOB leg + the local Administrator password from Vault (get-or-create).
# The guests arrive from the template already reachable (key SSH as Administrator).
#
#   ansible-playbook playbooks/windows-guests.yml [-e target=vm-winapp-01]
# ==============================================================================
- name: "Windows guests | route + administrator password from Vault"
  hosts: "{{ target | default('windows_guests') }}"
  gather_facts: false
  roles:
    - windows_guest
