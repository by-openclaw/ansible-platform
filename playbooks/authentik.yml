---
# Configure PROD Authentik (lxc-authentik-01, SVC) — Docker SSO/IdP.
- name: Configure PROD Authentik
  hosts: "{{ groups['authentik_cluster'] | default(groups['authentik']) }}"   # the first instance, then the second
  serial: 1
  become: true
  gather_facts: true
  roles:
    - base
    - docker
    - authentik
