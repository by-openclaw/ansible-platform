---
# ==============================================================================
# SEC-09 — scheduled rotation of the firewalls' Ansible API token (controller-side user timers).
#   Run: ansible-playbook playbooks/opnsense-token-rotation.yml
#   Then: systemctl --user list-timers 'fw-token-rotation@*'
# See roles/opnsense_token_rotation/README.md.
# ==============================================================================
- name: OPNsense — scheduled API token rotation (SEC-09)
  hosts: localhost
  connection: local
  gather_facts: false
  become: false
  roles:
    - role: opnsense_token_rotation
