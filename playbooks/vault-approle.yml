---
# ==============================================================================
# One-time bootstrap: a minimal AppRole for the Ansible controller — the first
# R-29 closure step (no more root token for runtime reads). Scope: READ-ONLY on
# the svc SSH passphrases (naming/0002 §5.1 "ssh-agent populated via Vault").
# The role_id+secret_id land in a 0600 controller file — compromise of the
# controller then yields exactly two passphrase paths, not root.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/vault-approle.yml
# ==============================================================================
- name: "Vault AppRole bootstrap (ansible-controller)"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml
  vars:
    approle_name: ansible-controller
    approle_secret_file: "{{ (vault_secret_dir | expanduser) }}/fabric/app-vault-ansible-controller.json"
    approle_mount: "approle"
    approle_token_ttl: "15m"
    approle_token_max_ttl: "30m"
    approle_policy: |
      # read-only: svc SSH passphrases for the controller's ssh-agent
      path "secret/data/{{ platform_env }}/svc-ansible/ssh-passphrase" { capabilities = ["read"] }
      path "secret/data/{{ platform_env }}/svc-rune/ssh-passphrase"    { capabilities = ["read"] }
  tasks:
    - name: "Approle | Stat the credential file (idempotence gate)"
      ansible.builtin.stat:
        path: "{{ approle_secret_file }}"
      delegate_to: localhost
      become: false
      register: approle_stat

    - name: "Approle | Bootstrap (only when the credential file is absent)"
      when: not approle_stat.stat.exists
      block:
        - name: "Vault login (ansible-deploy AppRole; root fallback)"
          ansible.builtin.include_role:
            name: vault_login
        # Vault's HTTP API on the node: the token and the minted secret id travel in the module
        # call and its answer, never on a command line.
        - name: "Approle | Write the read-only policy"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/sys/policies/acl/{{ approle_name }}"
            method: PUT
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
            body_format: json
            body:
              policy: "{{ approle_policy }}"
            status_code: [200, 204]
          changed_when: true
          no_log: true

        - name: "Approle | Auth methods"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/sys/auth"
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
          register: approle_auth
          check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
          changed_when: false
          no_log: true

        - name: "Approle | Enable the approle auth method (when absent)"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/sys/auth/{{ approle_mount }}"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
            body_format: json
            body:
              type: approle
            status_code: [200, 204]
          when: (approle_mount ~ '/') not in approle_auth.json.data
          changed_when: true
          no_log: true

        - name: "Approle | Create the role (short-lived tokens, policy-scoped)"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/auth/{{ approle_mount }}/role/{{ approle_name }}"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
            body_format: json
            body:
              token_policies: ["{{ approle_name }}"]
              token_ttl: "{{ approle_token_ttl }}"
              token_max_ttl: "{{ approle_token_max_ttl }}"
            status_code: [200, 204]
          changed_when: true
          no_log: true

        - name: "Approle | Fetch role_id"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/auth/{{ approle_mount }}/role/{{ approle_name }}/role-id"
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
          register: approle_role_id
          check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
          changed_when: false
          no_log: true

        - name: "Approle | Mint a secret_id"
          ansible.builtin.uri:
            url: "{{ vault_api_addr }}/v1/auth/{{ approle_mount }}/role/{{ approle_name }}/secret-id"
            method: POST
            headers:
              X-Vault-Token: "{{ vault_deploy_token }}"
            timeout: "{{ vault_api_timeout }}"
            status_code: [200]
          register: approle_secret_id
          changed_when: true
          no_log: true

        - name: "Approle | Persist the credentials (controller, 0600)"
          vars:
            approle_record:
              fields:
                role_id: "{{ approle_role_id.json.data.role_id }}"
                secret_id: "{{ approle_secret_id.json.data.secret_id }}"  # pragma: allowlist secret
          ansible.builtin.copy:
            dest: "{{ approle_secret_file }}"
            mode: "0600"
            content: "{{ approle_record | to_nice_json }}"
          delegate_to: localhost
          become: false
          no_log: true
