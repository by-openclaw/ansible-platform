---
# Playbook: crowdsec.yml — PROD CrowdSec central LAPI/engine (lxc-crowdsec-01, SVC).
# Native crowdsec daemon: LAPI listens on the LAN for agents + bouncers, base +
# AppSec collections, bouncer API keys. Per-host AGENT rollout = a separate role.
- name: Configure PROD CrowdSec central LAPI/engine
  hosts: crowdsec
  become: true
  gather_facts: true
  roles:
    - crowdsec
