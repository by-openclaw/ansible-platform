---
# Playbook: crowdsec.yml — PROD CrowdSec central LAPI/engine (lxc-crowdsec-01, SVC).
# The LAPI runs as a container (roles/crowdsec): it listens on the LAN for agents +
# bouncers, base + Suricata collections, bouncer API keys. Per-host AGENT rollout = a
# separate role (crowdsec_agent).
- name: Configure PROD CrowdSec central LAPI/engine
  hosts: crowdsec
  become: true
  gather_facts: true
  roles:
    - base
    - docker
    - crowdsec
