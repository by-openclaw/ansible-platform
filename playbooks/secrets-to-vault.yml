---
# ==============================================================================
# Migrate controller fabric secret files -> Vault KV v2 (secret/fabric/<name>).
#
# Vault becomes the durable, backed-up source of truth for platform secrets; the
# fabric files stay as the working copy + bootstrap. Safe by default:
#   * a secret ABSENT in Vault is written (this is the migration);
#   * a secret PRESENT but drifted is REPORTED, not overwritten
#     (run with -e secrets_sync_overwrite=true to make the file win);
#   * secrets that exist only in Vault (not as a file) are never touched.
#
# Nested subdirs (app-oidc/, db/, …) keep their path: fabric/app-oidc/<name>.
# The stored KV data is the file's `fields` object (or the whole doc if there is
# no `fields` wrapper), so `vault kv get -field=<k> secret/fabric/<name>` works.
#
#   Run:      ansible-playbook -i inventories/prod/hosts.yml playbooks/secrets-to-vault.yml
#   One file: ... -e secrets_sync_only=pbs-encryption-key
#   Overwrite drift from files: ... -e secrets_sync_overwrite=true
# ==============================================================================
- name: "Secrets → Vault migration"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml   # vault_secret_dir, vault_init_secret, vault_container_name, vault_kv_path
  vars:
    fabric_dir: "{{ (vault_secret_dir | expanduser) }}/fabric"
    secrets_sync_only: ""            # basename without .json → sync just this one
    secrets_sync_overwrite: false    # true = file content overwrites drifted Vault entries
    # Decommissioned / test / superseded services — never migrate these (keeps Vault
    # to only what we actually run). Matched as a regex against the file basename.
    secrets_sync_exclude:
      - defguard          # decommissioned
      - minio             # decommissioned → SeaweedFS
      - pfsense           # superseded by OPNsense
      - adguard-test      # test artifact
      - yboujraf_example  # template/example
  tasks:
    - name: "secrets→vault | Load the Vault root token (controller secret)"
      ansible.builtin.set_fact:
        vault_root_token: "{{ (lookup('file', (vault_secret_dir | expanduser) + '/' + vault_init_secret) | from_json).fields.root_token }}"
      no_log: true

    - name: "secrets→vault | Enumerate fabric secret files on the controller"
      ansible.builtin.find:
        paths: "{{ fabric_dir }}"
        patterns: "*.json"
        recurse: true
      delegate_to: localhost
      become: false
      register: fabric_files

    - name: "secrets→vault | Sync each fabric secret into Vault"
      ansible.builtin.include_tasks: tasks/vault_sync_one.yml
      loop: "{{ fabric_files.files }}"
      loop_control:
        loop_var: secret_file
        label: "{{ secret_file.path | basename }}"
      when:
        - >-
          secrets_sync_only == '' or
          (secret_file.path | basename | regex_replace('\.json$', '')) == secrets_sync_only
        - (secrets_sync_exclude | length == 0) or
          (secret_file.path | basename | regex_search(secrets_sync_exclude | join('|')) is none)

    - name: "secrets→vault | Drift report (present in Vault but differs from file — NOT overwritten)"
      ansible.builtin.debug:
        msg: >-  # pragma: allowlist secret
          {{ (_vault_drift | default([])) | length }} entr(y/ies) differ between file and Vault and were left as-is:
          {{ _vault_drift | default([]) | join(', ') or 'none' }}.
          {{ 're-run with -e secrets_sync_overwrite=true to push the file version.' if (_vault_drift | default([])) else '' }}
