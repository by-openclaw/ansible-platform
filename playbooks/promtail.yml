---
# ==============================================================================
# Playbook: promtail.yml — journald + auditd shipping from every guest to the
# central Loki (lxc-monitoring-01:3100) — INCLUDING the monitoring host itself
# (INF-27: every host, no exceptions; its repo file matches the loki role). Closes the
# "external logging host" Lynis suggestion (LOGG-2154) fleet-wide.
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/promtail.yml
# ==============================================================================
- name: "Promtail log shipping on every guest"
  hosts: "{{ target | default('cluster:adguard:mailcow:gitlab_runner:proxmox_nodes') }}"
  become: true
  roles:
    - promtail
