---
# ==============================================================================
# SSH key rotation — identity/0004 §2: ED25519 only, passphrase MANDATORY,
# one key per identity, comment {username}@{domain}, private key + passphrase
# backed up in Vault (passphrase lives in Vault EXCLUSIVELY — never on disk),
# `created` metadata stored for the 365-day rotation rule (NIS2 21(2)(j)).
#
# Idempotent: a key whose file already exists is left alone (rotation = delete
# the local pair, re-run). If the Vault write fails after generation, delete
# the local pair and re-run (the passphrase exists only in that run's memory).
#
# Escrow (owner's go 2026-10-16, "escrow the 3"): a key that exists on the controller but has
# no Vault document yet is stored AS IT IS — the hypervisors' root key, the Windows guests'
# connection key, the firewalls' root key, all three from April 2026 and without a passphrase.
# Their document says so (passphrase_protected: false) and carries the file's own date as
# `created`, so the 365-day rule counts from the real birth. Giving them a passphrase is a
# rotation (every acceptor must follow): a later step, not this play's doing.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/keys-rotate.yml
# ==============================================================================
- name: "Generate rotated keys (controller)"
  hosts: localhost
  gather_facts: true
  become: false
  vars:
    platform_domain_v: "{{ platform_domain }}"
    rotate_keys:
      - { name: "svc-ansible-{{ platform_env }}", vault_svc: "svc-ansible" }
      - { name: "svc-rune-{{ platform_env }}", vault_svc: "svc-rune" }
      - { name: "{{ platform_org }}", vault_svc: "break-glass" }
      # The automation's remaining keys (identity.yml platform_pve_root_key / platform_fw_ssh_key,
      # inventory windows_guests): escrowed as they are, see the header.
      - { name: "rune_automation", vault_svc: "proxmox" }      # root on the Proxmox nodes
      - { name: "rune_nopass", vault_svc: "windows" }          # Administrator on the Windows guests
      - { name: "opnsense", vault_svc: "opnsense" }            # root on the firewalls
  tasks:
    - name: "Keys | Stat existing key files"
      ansible.builtin.stat:
        path: "{{ ansible_env.HOME }}/.ssh/id_ed25519_{{ item.name }}"
      loop: "{{ rotate_keys }}"
      loop_control: { label: "{{ item.name }}" }
      register: keys_stat

    - name: "Keys | Generate passphrases (memory only — Vault is the sole store)"
      ansible.builtin.set_fact:
        keys_pass: >-
          {{ (keys_pass | default({})) | combine({item.item.name:
              lookup('community.general.random_string', length=28, special=false)}) }}
      loop: "{{ keys_stat.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      when: not item.stat.exists
      no_log: true

    - name: "Keys | Generate the ED25519 pairs (passphrase-protected)"
      community.crypto.openssh_keypair:
        path: "{{ ansible_env.HOME }}/.ssh/id_ed25519_{{ item.item.name }}"
        type: ed25519
        passphrase: "{{ keys_pass[item.item.name] }}"
        comment: "{{ item.item.name }}@{{ platform_domain_v }}"
        mode: "0600"
      loop: "{{ keys_stat.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      when: not item.stat.exists
      no_log: true

- name: "Store passphrases + key backups in Vault (exclusive store)"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml
  tasks:
    - name: "Vault login (ansible-deploy AppRole; root fallback)"
      ansible.builtin.include_role:
        name: vault_login

    - name: "Keys | Which keys have no Vault document yet (escrow candidates)"
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/{{ vault_kv_path }}/data/{{ platform_env }}/{{ item.item.vault_svc }}/ssh-key"
        headers:
          X-Vault-Token: "{{ vault_deploy_token }}"
        timeout: "{{ vault_api_timeout }}"
        status_code: [200, 404]
      loop: "{{ hostvars['localhost'].keys_stat.results }}"
      loop_control: { label: "{{ item.item.name }}" }
      register: keystore_probe
      check_mode: false  # read-only probe: must run under --check too (the next task reads it)
      changed_when: false
      no_log: true   # a 200 carries the key document

    - name: "Keys | Names to escrow: on the controller, absent from Vault"
      ansible.builtin.set_fact:
        keystore_missing: >-
          {{ keystore_probe.results | selectattr('status', 'eq', 404)
             | map(attribute='item.item.name') | list }}

    - name: "Keys | Store passphrase + metadata + key backup (rotated this run, or escrowed)"
      ansible.builtin.include_tasks: tasks/vault_key_store_one.yml
      loop: "{{ hostvars['localhost'].keys_stat.results }}"
      loop_control:
        loop_var: keyres
        label: "{{ keyres.item.name }}"
      when: (not keyres.stat.exists) or (keyres.item.name in keystore_missing)

    - name: "Keys | What this run stored"
      ansible.builtin.debug:
        msg: >-
          KEYS_STORE rotated={{ hostvars['localhost'].keys_stat.results | rejectattr('stat.exists') | map(attribute='item.name') | list | join(',') or 'none' }}
          escrowed={{ keystore_missing | join(',') or 'none' }}
