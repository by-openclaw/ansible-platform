---
# ==============================================================================
# Per-service rx/tx mailboxes (SVC-16), via the reusable mailbox concern-role.
# Data only: every write goes through roles/mailbox, so this play holds no
# credentials and no API calls of its own. Idempotent.
#
# NOT here, and deliberately:
#   people          adm_yboujraf and every other person come from platform_people
#                   via identity_orchestrator — a person named in two places is a
#                   person whose name can differ in two places, and it did.
#   catchall@       a property of the DOMAIN (SVC-09), so it lives with the domain
#                   in roles/mailcow.
#   postmaster@/abuse@   RFC boxes the mailcow role bootstraps, and mailcow itself.
#
# gitlab@/jumpserver@/alerts@ WERE pre-existing: converged 2026-09-01 by seeding
# Vault prod/mail/{svc} with their live passwords BEFORE adding them (no re-mint).
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/mailboxes.yml
# ==============================================================================
- name: "Service mailboxes (rx/tx)"
  hosts: mailcow
  become: true
  gather_facts: false
  vars:
    mailboxes_default_delegates: "{{ platform_service_mail_delegates }}"
    mailboxes_services:
      # Pre-existing boxes, CONVERGED 2026-09-01: Vault prod/mail/{svc} was
      # seeded with their EXISTING passwords first, so nothing is re-minted —
      # the role's get-or-create reads, add/mailbox hits object_exists, and only
      # delegates/reconcile apply.
      - { svc: alerts }
      - { svc: gitlab }
      - { svc: jumpserver }
      - { svc: adguard }
      - { svc: authentik }
      - { svc: crowdsec }
      - { svc: grafana }
      - { svc: harbor }
      - { svc: netbird, aliases: [] }     # vpn.by-research.be is the app; mail stays netbird@
      - { svc: netbox }
      - { svc: nextcloud }
      - { svc: opnsense }   # FW alerts sender (Monit) — same flow as every svc
      - { svc: diagrams }
      - { svc: mailcow }     # the mail system's own notification identity
      - { svc: monitoring }
      - { svc: pbs }
      - { svc: pgadmin }
      - { svc: postgres }
      - { svc: redis }
      - { svc: seaweedfs }
      - { svc: traefik }
      - { svc: vault }
      - { svc: warden }
      - { svc: vaultwarden }
      - { svc: verdaccio }
      - { svc: step-ca }
      - { svc: portainer }
      - { svc: wazuh }
      - { svc: grc }
  tasks:
    # loop_var, not `item`: include_role re-evaluates these vars inside the role, and
    # the role loops over aliases and delegates. Inside those, `item` is the alias or
    # delegate — a string — so "{{ item.svc }}" dies on
    # "object of type 'str' has no attribute 'svc'". A named loop_var cannot be shadowed.
    - name: "Provision each service mailbox (delegates: co-delivery + send-as)"
      ansible.builtin.include_role:
        name: mailbox
      vars:
        mailbox_service: "{{ mb_svc.svc }}"
        mailbox_aliases: "{{ mb_svc.aliases | default([]) }}"
        mailbox_delegates: "{{ mb_svc.delegates | default(mailboxes_default_delegates) }}"
      loop: "{{ mailboxes_services }}"
      loop_control:
        loop_var: mb_svc
        label: "{{ mb_svc.svc }}"
