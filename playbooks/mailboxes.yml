---
# ==============================================================================
# Per-service rx/tx mailboxes (SVC-16) + the mandatory catchall@ (SVC-09), via
# the reusable mailbox concern-role. Idempotent.
#
# NOT here (pre-existing boxes with creds wired elsewhere — converging them into
# the {env}/mail/{svc} convention is a tracked follow-up, NOT a re-mint, to
# avoid the "get-or-create minted over live creds" incident class):
#   gitlab@ (gitlab role), jumpserver@ (prod/jumpserver/smtp), alerts@
#   (monitoring), postmaster@/abuse@ (RFC, mailcow role), mailcow itself.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/mailboxes.yml
# ==============================================================================
- name: "Service mailboxes (rx/tx) + catchall"
  hosts: vm-mailcow-01
  become: true
  gather_facts: false
  vars:
    mailboxes_default_delegates: ["adm_yboujraf@{{ platform_domain | default('by-research.be') }}"]
    mailboxes_services:
      - { svc: adguard }
      - { svc: authentik }
      - { svc: crowdsec }
      - { svc: grafana }
      - { svc: harbor }
      - { svc: netbird, aliases: [] }     # vpn.by-research.be is the app; mail stays netbird@
      - { svc: netbox }
      - { svc: nextcloud }
      - { svc: pbs }
      - { svc: pgadmin }
      - { svc: seaweedfs }
      - { svc: vaultwarden }
  tasks:
    # --- the ADMIN identity's mailbox (naming/0002 §2: admin duty = adm_*) -----
    # SSO-backed (authsource generic-oidc, kept by the mailcow role's SSO list);
    # the local password is random-once and never stored — login is Authentik.
    - name: "Admin mailbox | Load the Mailcow API key"
      ansible.builtin.set_fact:
        mailboxes_api: "https://{{ mailcow_listen_ip | default('10.1.2.120') }}:{{ mailcow_https_port | default(8443) }}/api/v1"
        mailboxes_api_hdr:
          X-API-Key: "{{ (lookup('file', lookup('env', 'HOME') + '/.openclaw/workspace/infra/secrets/fabric/mailcow.json') | from_json).fields.api_key }}"
          Content-Type: "application/json"
      no_log: true

    # set_fact materializes the random ONCE — a lazy `vars:` lookup re-evaluates
    # per reference and password/password2 would differ (password_mismatch).
    - name: "Admin mailbox | Mint the one-time password"
      ansible.builtin.set_fact:
        mailboxes_adm_pw: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      no_log: true

    - name: "Admin mailbox | Create adm_yboujraf (SSO; password random-once, unused)"
      ansible.builtin.uri:
        url: "{{ mailboxes_api }}/add/mailbox"
        method: POST
        headers: "{{ mailboxes_api_hdr }}"
        body_format: json
        body:
          local_part: "adm_yboujraf"
          domain: "{{ platform_domain | default('by-research.be') }}"
          name: "Yassine Boujraf (admin)"
          password: "{{ mailboxes_adm_pw }}"
          password2: "{{ mailboxes_adm_pw }}"
          quota: 5120
          active: "1"
        validate_certs: false
        status_code: [200]
      register: mailboxes_adm_add
      changed_when: "'mailbox_added' in (mailboxes_adm_add.json | default([]) | string)"
      failed_when: >-
        mailboxes_adm_add.json is defined and
        (mailboxes_adm_add.json | string is search('danger')) and
        not (mailboxes_adm_add.json | string is search('object_exists'))
      no_log: true

    - name: "Admin mailbox | Force SSO authsource (idempotent)"
      ansible.builtin.shell: |
        set -o pipefail
        C=$(docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -iE 'mysql|mariadb' | head -1)
        P=$(grep -oP 'DBROOT=\K.*' /opt/mailcow-dockerized/mailcow.conf)
        docker exec "$C" mysql -u root -p"$P" mailcow -N -e           "UPDATE mailbox SET authsource='generic-oidc'
           WHERE username='adm_yboujraf@{{ platform_domain | default('by-research.be') }}'
           AND authsource <> 'generic-oidc'; SELECT ROW_COUNT();" | tail -1
      args: { executable: /bin/bash }
      register: mailboxes_adm_sso
      changed_when: (mailboxes_adm_sso.stdout | default('0') | trim) == '1'

    - name: "Provision each service mailbox (delegates: co-delivery + send-as)"
      ansible.builtin.include_role:
        name: mailbox
      vars:
        mailbox_service: "{{ item.svc }}"
        mailbox_aliases: "{{ item.aliases | default([]) }}"
        mailbox_delegates: "{{ item.delegates | default(mailboxes_default_delegates) }}"
      loop: "{{ mailboxes_services }}"
      loop_control:
        label: "{{ item.svc }}"

    # --- catchall@ (SVC-09): a REAL delivery path for the whole domain ---------
    - name: "Catchall | Load the Mailcow API key"
      ansible.builtin.set_fact:
        mailboxes_api: "https://{{ mailcow_listen_ip | default('10.1.2.120') }}:{{ mailcow_https_port | default(8443) }}/api/v1"
        mailboxes_api_hdr:
          X-API-Key: "{{ (lookup('file', lookup('env', 'HOME') + '/.openclaw/workspace/infra/secrets/fabric/mailcow.json') | from_json).fields.api_key }}"
          Content-Type: "application/json"
      no_log: true

    - name: "Catchall | Domain catch-all alias → postmaster (SVC-09)"
      ansible.builtin.uri:
        url: "{{ mailboxes_api }}/add/alias"
        method: POST
        headers: "{{ mailboxes_api_hdr }}"
        body_format: json
        body:
          address: "@{{ platform_domain | default('by-research.be') }}"
          goto: "postmaster@{{ platform_domain | default('by-research.be') }}"
          active: "1"
        validate_certs: false
        status_code: [200]
      register: mailboxes_catchall
      changed_when: "'alias_added' in (mailboxes_catchall.json | default([]) | string)"
      failed_when: >-
        mailboxes_catchall.json is defined and
        (mailboxes_catchall.json | string is search('danger')) and
        not (mailboxes_catchall.json | string is search('object_exists|is_alias_or_mailbox'))
      no_log: true
