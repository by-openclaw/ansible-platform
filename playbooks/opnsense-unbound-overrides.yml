---
# ==============================================================================
# Apply opn_unbound.host_overrides (split-DNS: service name -> Traefik / mailcow)
# to the FW's Unbound through the collection module (lib-opnsense
# UbHostOverrideManager underneath — lib-first). Match keys hostname/domain/server
# make it idempotent: no resolve-probe, no duplicates (the previous probe-and-add
# design left 214 duplicate rows on the FW; cleaned 2026-09-04).
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/opnsense-unbound-overrides.yml
# ==============================================================================
- name: Apply Unbound host overrides (split-DNS)
  hosts: opnsense
  gather_facts: false
  connection: local
  vars:
    ansible_python_interpreter: /usr/bin/python3
  pre_tasks:
    - name: "FW API credentials from Vault"
      ansible.builtin.import_role:        # static: `always` propagates to the role tasks
        name: opnsense_api_creds
      tags: [always]          # creds must load under ANY --tags selection
  tasks:
    - name: "Overrides | Ensure each catalog host override (idempotent by hostname/domain/server)"
      by_systems.opnsense.opnsense_ub_host_override:
        host: "{{ opn_host }}"
        port: "{{ opn_port }}"
        key: "{{ opn_key }}"
        secret: "{{ opn_secret }}"
        verify_ssl: false
        hostname: "{{ item.hostname }}"
        domain: "{{ item.domain }}"
        rr: "{{ item.rr }}"
        server: "{{ item.server }}"
        description: "{{ item.description | default('split-DNS (catalog)') }}"
        enabled: true
        state: "{{ item.state | default('present') }}"   # retired names are declared absent in the catalog (never just removed)
      loop: "{{ opn_unbound.host_overrides | default([]) }}"
      loop_control:
        label: "{{ item.hostname }}.{{ item.domain }} {{ item.rr }} -> {{ item.server }}"
      register: unbound_override_ensure
      notify: Reconfigure Unbound

  handlers:
    - name: Reconfigure Unbound
      ansible.builtin.uri:
        url: "https://{{ opn_host }}:{{ opn_port }}/api/unbound/service/reconfigure"
        method: POST
        url_username: "{{ opn_key }}"
        url_password: "{{ opn_secret }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        body: {}
