---
# Provision OS accounts/groups/sudo/keys per identity/0004 + naming/0002 §5.
# Safe while connected as root — only ADDS accounts. Scope: -e target=<host|group>.
- name: "Provision OS accounts (identity/0004-os-accounts)"
  hosts: "{{ target | default('all') }}"
  become: true
  roles:
    - user-mgmt
