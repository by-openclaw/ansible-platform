---
# ==============================================================================
# SeaweedFS — S3 object-storage backend (replaces EOL MinIO).
# Play 1 (PVE host): persistent ZFS dataset tank/data/seaweedfs + bind-mount into
#   lxc-seaweedfs-01 at /data — DATA survives `terraform destroy` of the LXC.
# Play 2 (LXC): install SeaweedFS (weed server -s3) + S3 access keys + buckets.
# ==============================================================================
- name: "SeaweedFS — persistent ZFS data volume (PVE host)"
  hosts: proxmox_nodes
  gather_facts: false
  vars:
    ansible_user: "{{ platform_pve_root_user }}"
    ansible_ssh_private_key_file: "{{ platform_pve_root_key }}"
    ansible_become: false
    pve_zfs_mount_items: "{{ hostvars[groups['seaweedfs'] | first].seaweedfs_zfs_mounts | map('combine', {'guest': groups['seaweedfs'] | first}) | list }}"
  roles:
    - role: pve_zfs_mount

- name: "SeaweedFS — install + configure the S3 backend (LXC)"
  hosts: seaweedfs
  become: true
  gather_facts: true
  roles:
    - base
    - docker
    - role: seaweedfs
