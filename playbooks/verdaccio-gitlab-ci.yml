---
# ==============================================================================
# npm registry for CI (issue: Verdaccio finish → runner must use it). Seeds
# GitLab INSTANCE-level CI/CD variables so every pipeline (via the shared
# npm.gitlab-ci.yml template) resolves and authenticates against Verdaccio:
#   NPM_CONFIG_REGISTRY  https://npm.<domain>/
#   NPM_AUTH             base64(user:password) of the svc account (masked)
# Creds come from Vault prod/verdaccio/registry; the token never touches disk
# (through GitLab's REST API, roles/gitlab_api: the value travels in the module call).
#   ansible-playbook -i inventories/prod playbooks/verdaccio-gitlab-ci.yml
# ==============================================================================
- name: "Seed npm registry CI variables into GitLab"
  hosts: gitlab
  become: true
  gather_facts: false
  vars:
    verdaccio_ci_registry: "https://{{ platform_service_fqdns.verdaccio }}/"
  tasks:
    - name: "Read the svc registry account (Vault)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ platform_env }}/verdaccio/registry"

    # Bound under its own name: the role below reads another Vault document (its API token),
    # and vault_secret_result always holds the LAST document read.
    - name: "Bind the registry account"
      ansible.builtin.set_fact:
        verdaccio_ci_account: "{{ vault_secret_result }}"
      no_log: true

    - name: "The reconciler program the play used to stage (retired)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - /opt/gitlab-ci-vars.rb
        - "{{ gitlab_scripts_dir }}/verdaccio-ci-vars.rb"

    - name: "Reconcile the npm CI variables (GitLab API, roles/gitlab_api)"
      ansible.builtin.include_role:
        name: gitlab_api
        tasks_from: instance_variables
      vars:
        gitlab_api_instance_variables:
          - { key: "NPM_CONFIG_REGISTRY", value: "{{ verdaccio_ci_registry }}", masked: false, protected: false, raw: true }
          - key: "NPM_AUTH"   # pragma: allowlist secret
            value: "{{ (verdaccio_ci_account.username ~ ':' ~ verdaccio_ci_account.password) | b64encode }}"
            masked: true
            protected: false
            raw: true
