---
# ==============================================================================
# Provision a per-service Vault identity (policy + AppRole) for every service
# (SEC-04 least-privilege policy scoped to its own prefix, SEC-05 AppRole auth).
# Foundation for retiring the root token: once services authenticate as
# themselves, the controller no longer needs the root token to deploy.
# Idempotent (vault_policy writes only on drift; secret_id minted once).
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/vault-approles.yml
# ==============================================================================
- name: "Per-service Vault policy + AppRole (SEC-04/05)"
  hosts: vault
  become: true
  gather_facts: false
  vars:
    # Real services that consume their own secrets. Shared/cross-cutting paths
    # (cloudflare, resend, ci, discord, geoip, synology, backup, net, vpn, monit,
    # proxmox, break-glass) and identity accounts (svc-ansible/svc-rune) are NOT
    # given a service AppRole here.
    # Capabilities per identity when "read" is not enough: the fabric automation WRITES the
    # switches' secrets into its own prefix (owner 2026-10-25), nothing beyond it.
    vault_approle_capabilities:
      network: [create, read, update, list]
    # Identities retired (policy + AppRole removed, their credentials file deleted).
    vault_approle_retired: [dhs-lab]
    vault_approle_services:
      - adguard
      # The network fabric (owner 2026-10-25): the switches' credentials live at
      # prod/network/<switch>/{eapi,ssh,snmpv3,ospf}; the fabric automation reads them with this
      # identity. Replaces the short-lived dhs-lab (retired below).
      - network
      - authentik
      - crowdsec
      - gitlab
      - grafana
      - harbor
      - jumpserver
      - mailcow
      - netbird
      - netbox
      - nextcloud
      - pbs
      - pgadmin
      - seaweedfs
      - vaultwarden
  tasks:
    - name: "Provision {service}-{env} policy + AppRole"
      ansible.builtin.include_role:
        name: vault_policy
      vars:
        vault_policy_service: "{{ svc }}"
        vault_policy_capabilities: "{{ vault_approle_capabilities[svc] | default(['read']) }}"
      loop: "{{ vault_approle_services }}"
      loop_control:
        loop_var: svc
        label: "{{ svc }}"

    - name: "Retire {service}-{env} policy + AppRole (its credentials file goes with it)"
      ansible.builtin.include_role:
        name: vault_policy
      vars:
        vault_policy_service: "{{ svc }}"
        vault_policy_state: absent
      loop: "{{ vault_approle_retired }}"
      loop_control:
        loop_var: svc
        label: "{{ svc }}"
