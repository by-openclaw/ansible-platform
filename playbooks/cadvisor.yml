---
# ==============================================================================
# Per-container metrics on every Docker host (inventory group docker_hosts):
# cAdvisor pinned, bound to the SVC address, scraped by Prometheus (job cadvisor).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/cadvisor.yml
# ==============================================================================
- name: "cAdvisor — per-container metrics"
  hosts: docker_hosts
  become: true
  gather_facts: false
  roles:
    - role: cadvisor
