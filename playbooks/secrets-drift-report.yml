---
# ==============================================================================
# Which controller secret files disagree with Vault, and in WHICH KEYS.
#
# secrets-to-vault.yml compares whole documents, so its drift report says only
# "differs". That covers two very different things: a stale PASSWORD in the file
# (a live hazard — it is why -e secrets_sync_overwrite=true must not be run), and
# a file merely carrying extra bookkeeping keys (url/user/email, which several
# roles write alongside the secret). The report cannot tell them apart, and the
# obvious way to look — diffing the two — prints credentials to a terminal.
#
# This play reports, per path, ONLY:
#   * keys in the file but not in Vault
#   * keys in Vault but not in the file
#   * the NAMES of keys present in both whose values differ
#
# Never a value: no secret is printed, and every task touching one is no_log.
# Read-only — it writes nothing, to Vault or to disk.
#
#   Run:      ansible-playbook -i inventories/prod/hosts.yml playbooks/secrets-drift-report.yml
#   One file: ... -e secrets_drift_only=db-pgsql-netbox
# ==============================================================================
- name: "Secrets drift report (key names only, never values)"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml   # vault_secret_dir, vault_container_name, vault_kv_path
    - vars/vault_kv_map.yml              # fabric name -> service/key mapping
  vars:
    fabric_dir: "{{ (vault_secret_dir | expanduser) }}/fabric"
    vault_migrate_env: "{{ platform_env | default('prod') }}"
    secrets_drift_only: ""
    # Same exclusions as the migration: a name it never syncs cannot drift.
    secrets_drift_exclude:
      - defguard
      - minio
      - pfsense
      - adguard-test
      - yboujraf_example
      - app-vault-approle-
  tasks:
    - name: "Drift | Vault login (ansible-deploy AppRole)"
      ansible.builtin.include_role:
        name: vault_login

    - name: "Drift | Use the deploy token"
      ansible.builtin.set_fact:
        vault_root_token: "{{ vault_deploy_token }}"
      no_log: true

    - name: "Drift | Enumerate controller secret files"
      ansible.builtin.find:
        paths: "{{ item }}"
        patterns: "*.json"
        recurse: true
      delegate_to: localhost
      become: false
      loop:
        - "{{ fabric_dir }}"
        - "{{ (vault_secret_dir | expanduser) }}/shared"
      register: secrets_drift_found

    - name: "Drift | Start an empty findings list"
      ansible.builtin.set_fact:
        secrets_drift_findings: []

    - name: "Drift | Compare each secret with its Vault entry"
      ansible.builtin.include_tasks: tasks/secrets_drift_one.yml
      loop: "{{ secrets_drift_found.results | map(attribute='files') | flatten }}"
      loop_control:
        loop_var: secret_file
        label: "{{ secret_file.path | basename }}"
      when:
        - >-
          secrets_drift_only == '' or
          (secret_file.path | basename | regex_replace('\.json$', '')) == secrets_drift_only
        - secret_file.path | basename | regex_search(secrets_drift_exclude | join('|')) is none

    - name: "Drift | Report"
      ansible.builtin.debug:
        msg: >-
          {{ secrets_drift_findings | length }} of
          {{ secrets_drift_found.results | map(attribute='files') | flatten | length }}
          secrets differ.
          {% for f in secrets_drift_findings %}
          [{{ f.path }}] {{ 'SECRET KEYS DIFFER: ' ~ (f.value_differs | join(', '))
                             if f.value_differs | length > 0
                             else 'same values; file carries extra bookkeeping only' }}
          {{ ('file-only: ' ~ (f.only_in_file | join(', '))) if f.only_in_file | length > 0 else '' }}
          {{ ('vault-only: ' ~ (f.only_in_vault | join(', '))) if f.only_in_vault | length > 0 else '' }}
          {% endfor %}
