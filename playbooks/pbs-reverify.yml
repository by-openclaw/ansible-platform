---
# ==============================================================================
# Playbook: pbs-reverify.yml — verification state of every snapshot, and a re-verify of the ones
# marked `failed`.
# The verify job skips a snapshot that already carries a state (failed ones included), and the
# verify API defaults to the same: a snapshot marked failed by a transient read error (a 429 from
# the provider while the backups uploaded, an S3 or edge restart on the old on-site datastore) stays
# failed until it is verified on its own with `ignore-verified` off. That is what this play does —
# one snapshot at a time, waiting for each task: the chunks come back over the provider's line
# (Contabo: 10 MB/s, 250 requests/s), and parallel tasks would only share it and provoke the 429
# that marked them failed in the first place.
#   Report:    ansible-playbook playbooks/pbs-reverify.yml
#   Re-verify: ... -e pbs_reverify_apply=true
# Not during the backup or verify windows (docs/services/pbs.md).
# ==============================================================================
- name: "PBS — snapshot verification states, re-verify the failed ones"
  hosts: pbs
  become: true
  gather_facts: false
  vars_files:
    - ../roles/pbs/defaults/main.yml
  vars:
    pbs_reverify_apply: false
    pbs_reverify_wait_retries: 480   # × 30 s = 4 h per snapshot: a 100 GB guest at the provider's 10 MB/s takes ~3 h
  tasks:
    - name: "Verify | Snapshots of the datastore"
      ansible.builtin.command:
        argv: [proxmox-backup-debug, api, get, "/admin/datastore/{{ pbs_datastore_name }}/snapshots", --output-format, json]
      register: pbs_reverify_list
      changed_when: false
      check_mode: false   # read-only probe

    - name: "Verify | States"
      ansible.builtin.set_fact:
        pbs_reverify_failed: >-
          {{ pbs_reverify_list.stdout | from_json
             | selectattr('verification', 'defined') | selectattr('verification.state', 'equalto', 'failed') | list }}
        pbs_reverify_total: "{{ pbs_reverify_list.stdout | from_json | length }}"

    - name: "Verify | Report"
      ansible.builtin.debug:
        msg: >-
          {{ pbs_reverify_total }} snapshots, {{ pbs_reverify_failed | length }} marked failed:
          {{ pbs_reverify_failed | map(attribute='backup-type')
             | zip(pbs_reverify_failed | map(attribute='backup-id'), pbs_reverify_failed | map(attribute='backup-time'))
             | map('join', '/') | list }}

    - name: "Verify | Re-verify each failed snapshot on its own, one at a time (ignore-verified off)"
      ansible.builtin.include_tasks: tasks/pbs-verify-one.yml
      loop: "{{ pbs_reverify_failed }}"
      loop_control:
        loop_var: pbs_verify_one
        label: "{{ pbs_verify_one['backup-type'] }}/{{ pbs_verify_one['backup-id'] }}/{{ pbs_verify_one['backup-time'] }}"
      when: pbs_reverify_apply | bool

    - name: "Verify | Outcome of each re-verify"
      ansible.builtin.debug:
        msg: "{{ pbs_reverify_results | default([]) }}"
      when: pbs_reverify_apply | bool

    - name: "Verify | States after the run"
      ansible.builtin.command:
        argv: [proxmox-backup-debug, api, get, "/admin/datastore/{{ pbs_datastore_name }}/snapshots", --output-format, json]
      register: pbs_reverify_after
      changed_when: false
      check_mode: false   # read-only probe

    - name: "Verify | No snapshot is marked failed"
      ansible.builtin.assert:
        that: >-
          pbs_reverify_after.stdout | from_json
          | selectattr('verification', 'defined') | selectattr('verification.state', 'equalto', 'failed') | list | length == 0
        fail_msg: "snapshots still failed after a verify of their own — corruption is possible: read the verify task log on the server"
        quiet: true
      when: pbs_reverify_apply | bool
