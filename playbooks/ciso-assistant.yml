---
# ==============================================================================
# CISO Assistant — the compliance registry (ADR security/0002).
# Framework catalogs (ISO 27001:2022, NIS2, GDPR), applied controls, and evidence that links
# back to the ADRs. Database on the shared cluster, evidence in S3, Traefik + Authentik.
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/ciso-assistant.yml
# ==============================================================================
- name: "CISO Assistant — compliance registry"
  hosts: ciso_assistant
  become: true
  gather_facts: true
  roles:
    - docker
    - ciso_assistant
