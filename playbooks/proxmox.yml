---
# Configure Proxmox VE over the PVE API (the nodes have no SSH for us). Runs on the
# controller: connection=local, the role talks to the PVE host via HTTPS + admin
# API token. First concern: the Authentik OIDC SSO realm (#145).
#
#   ansible-playbook playbooks/proxmox.yml --tags oidc
- name: Configure Proxmox VE (PVE API)
  hosts: localhost
  connection: local
  become: false              # pure HTTPS API calls from the controller — no sudo
  gather_facts: false
  roles:
    - proxmox
