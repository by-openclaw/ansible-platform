---
# ==============================================================================
# PyPI cache for CI. Seeds the GitLab INSTANCE-level CI/CD variable PIP_INDEX_URL so
# every pipeline (via the shared runners) installs Python packages through the
# platform's cache (roles/pkgcache, devpi) instead of pypi.org directly.
# Same reconcile as the npm registry and Harbor (roles/gitlab_api, GitLab's REST API): additive, idempotent.
#   Run: ansible-playbook -i inventories/prod playbooks/pkgcache-gitlab-ci.yml
# ==============================================================================
- name: "Seed the PyPI cache CI variable into GitLab"
  hosts: gitlab
  become: true
  gather_facts: false
  vars_files:
    - ../roles/pkgcache/defaults/main.yml   # pkgcache_pypi_index_url
  tasks:
    - name: "The reconciler program the play used to stage (retired)"
      ansible.builtin.file:
        path: "{{ gitlab_scripts_dir }}/pkgcache-ci-vars.rb"
        state: absent

    - name: "Reconcile the PyPI CI variable (GitLab API, roles/gitlab_api)"
      ansible.builtin.include_role:
        name: gitlab_api
        tasks_from: instance_variables
      vars:
        gitlab_api_instance_variables:
          - {key: "PIP_INDEX_URL", value: "{{ pkgcache_pypi_index_url }}", masked: false, protected: false, raw: true}
