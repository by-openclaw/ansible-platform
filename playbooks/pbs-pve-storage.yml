---
# ==============================================================================
# Wire PBS into Proxmox VE: add it as a `pbs` storage + a SECOND backup job.
# The existing vzdump -> NFS (Synology, storage `poc-backup`) job is left ENABLED
# and untouched — every guest ends up on BOTH Synology (NFS) and SeaweedFS (S3).
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/pbs-pve-storage.yml
#
# Prereq: playbooks/pbs.yml has run (datastore pbs-datastore exists on vm-pbs-01).
# ==============================================================================
- name: "PBS side — PVE backup user, token, fingerprint"
  hosts: pbs
  become: true
  gather_facts: false
  vars_files:
    - ../roles/pbs/defaults/main.yml
  tasks:
    - name: "PVE-wire | Ensure the PVE backup user exists"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, user, create, "{{ pbs_pve_backup_user }}"]
      register: r_user
      changed_when: r_user.rc == 0
      failed_when:
        - r_user.rc != 0
        - "'already exists' not in (r_user.stderr | default(''))"

    - name: "PVE-wire | Read the current ACL (read-first idempotency)"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, list, --output-format, json]
      register: r_acl_list
      changed_when: false
      check_mode: false   # read-only probe: must run under --check too (its JSON feeds the next task)

    - name: "PVE-wire | Grant DatastoreBackup on the datastore"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, update, "/datastore/{{ pbs_datastore_name }}",
               DatastoreBackup, "--auth-id", "{{ pbs_pve_backup_user }}"]
      register: r_acl
      changed_when: r_acl.rc == 0
      when: >-
        (r_acl_list.stdout | from_json
         | selectattr('ugid', 'equalto', pbs_pve_backup_user)
         | selectattr('roleid', 'equalto', 'DatastoreBackup') | list | length) == 0
      failed_when:
        - r_acl is not skipped
        - r_acl.rc != 0
        - "'already' not in (r_acl.stderr | default(''))"

    # Vault decides whether the token is held, not a file on the controller. It
    # used to be the file, and Vault was a copy something had to remember to
    # refresh — it did not: after the 2026-09-01 rename of the backup user, Vault
    # kept pve-backup@pbs!pve, an auth-id PBS no longer has (#570).
    - name: "PVE-wire | Read the backup API token from Vault (absent is valid)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pbs_token_vault_path }}"
        vault_secret_optional: true

    - name: "PVE-wire | Is the token held, and is it the one PBS actually has?"
      ansible.builtin.set_fact:
        # A token whose auth-id no longer matches the configured user is as good
        # as absent: it cannot authenticate, and keeping it hides that.
        pbs_tok_held: >-
          {{ (vault_secret_result | default({})).value | default('') | length > 0
             and (vault_secret_result | default({})).tokenid | default('')
                 == pbs_pve_backup_user ~ '!' ~ pbs_pve_backup_token }}

    - name: "PVE-wire | (Re)generate the API token when Vault does not hold a usable one"
      when: not (pbs_tok_held | bool)
      block:
        - name: "PVE-wire | Delete any stale token (secret unknown)"
          ansible.builtin.command:
            argv: [proxmox-backup-manager, user, delete-token,
                   "{{ pbs_pve_backup_user }}", "{{ pbs_pve_backup_token }}"]
          register: r_deltok
          changed_when: r_deltok.rc == 0
          failed_when: false

        - name: "PVE-wire | Generate the backup API token (privsep off -> inherits ACL)"
          ansible.builtin.command:
            argv: [proxmox-backup-manager, user, generate-token,
                   "{{ pbs_pve_backup_user }}", "{{ pbs_pve_backup_token }}"]
          register: r_gentok
          changed_when: true
          no_log: true

        # PBS mints the value, so this is read-then-create-then-store, not
        # vault_secret's plain get-or-create: force_fields writes exactly these
        # (a new KV v2 version; the previous one is retained).
        - name: "PVE-wire | Store the minted token in Vault"
          ansible.builtin.include_role:
            name: vault_secret
          vars:
            vault_secret_path: "{{ pbs_token_vault_path }}"
            vault_secret_force_fields:
              tokenid: "{{ (r_gentok.stdout | regex_replace('^[^{]*', '') | from_json).tokenid }}"
              value: "{{ (r_gentok.stdout | regex_replace('^[^{]*', '') | from_json).value }}"
              note: "PVE->PBS backup API token ({{ pbs_pve_backup_user }}!{{ pbs_pve_backup_token }})"

    - name: "PVE-wire | Grant DatastoreBackup to the API TOKEN (privsep default)"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, update, "/datastore/{{ pbs_datastore_name }}",
               DatastoreBackup, "--auth-id", "{{ pbs_pve_backup_user }}!{{ pbs_pve_backup_token }}"]
      register: r_tokacl
      changed_when: r_tokacl.rc == 0
      when: >-
        (r_acl_list.stdout | from_json
         | selectattr('ugid', 'equalto', pbs_pve_backup_user + '!' + pbs_pve_backup_token)
         | selectattr('roleid', 'equalto', 'DatastoreBackup') | list | length) == 0
      failed_when:
        - r_tokacl is not skipped
        - r_tokacl.rc != 0
        - "'already' not in (r_tokacl.stderr | default(''))"

    - name: "PVE-wire | Read the PBS TLS fingerprint"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, cert, info]
      register: r_cert
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false

    - name: "PVE-wire | Extract the sha256 fingerprint"
      ansible.builtin.set_fact:
        pbs_fingerprint: "{{ r_cert.stdout | regex_search('([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){31})') }}"

- name: "PVE side — add PBS storage + 2nd backup job"
  hosts: proxmox_nodes
  gather_facts: false
  vars_files:
    - ../roles/pbs/defaults/main.yml
  vars:
    pbs_fp: "{{ hostvars[groups['pbs'][0]]['pbs_fingerprint'] }}"
    pbs_ip: "{{ hostvars[groups['pbs'] | first].ansible_host }}"
    pbs_svc_subnet: "{{ platform_zones.svc.cidr4 }}"     # SVC VLAN (where PBS lives)
    pbs_fw_oob_ip: "{{ hostvars[groups['opnsense'] | first].ansible_host }}"     # FW OOB IP the node routes SVC traffic through
    # Guests whose agent cannot freeze the filesystem: the agent setting they get, and how it reads in `qm config`.
    pbs_no_fsfreeze_agent: "enabled=1,type=virtio,freeze-fs-on-backup=0"
    pbs_no_fsfreeze_marker: "freeze-fs-on-backup=0"
  tasks:
    - name: "PVE-wire | Read the backup API token from Vault"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pbs_token_vault_path }}"

    - name: "PVE-wire | Bind the token"
      ansible.builtin.set_fact:
        pbs_tok: "{{ vault_secret_result }}"
      no_log: true

    # The node sits on OOB (10.6.224.105); PBS is on the SVC VLAN behind the FW.
    # The node reaches the FW's OOB IP (10.6.239.196), and the FW routes+permits
    # OOB->SVC, so a static route via the FW makes PBS:8007 reachable. Persist it
    # via a systemd oneshot (no risky /etc/network/interfaces edits on the node).
    - name: "PVE-wire | Persistent route unit: node -> SVC VLAN via the FW"
      ansible.builtin.copy:
        dest: /etc/systemd/system/pbs-svc-route.service
        mode: "0644"
        content: |
          [Unit]
          Description=Static route to the SVC VLAN via the FW (PVE -> PBS backups)
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/sbin/ip route replace {{ pbs_svc_subnet }} via {{ pbs_fw_oob_ip }}
          ExecStop=/sbin/ip route del {{ pbs_svc_subnet }} via {{ pbs_fw_oob_ip }}
          [Install]
          WantedBy=multi-user.target
      register: pbs_route_unit

    - name: "PVE-wire | Enable + start the SVC route (node can reach PBS:8007)"
      ansible.builtin.systemd_service:
        name: pbs-svc-route.service
        enabled: true
        state: started
        daemon_reload: "{{ pbs_route_unit is changed }}"

    - name: "PVE-wire | Existing PVE storages"
      ansible.builtin.command:
        argv: [pvesm, status]
      register: r_pvesm
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false

    - name: "PVE-wire | Add the PBS storage (content=backup)"
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - pbs
          - "{{ pbs_pve_storage_id }}"
          - "--server"
          - "{{ pbs_ip }}"
          - "--datastore"
          - "{{ pbs_datastore_name }}"
          - "--username"
          - "{{ pbs_tok.tokenid }}"
          - "--password"
          - "{{ pbs_tok.value }}"
          - "--fingerprint"
          - "{{ pbs_fp }}"
          - "--content"
          - backup
      no_log: true
      register: r_add
      changed_when: r_add.rc == 0
      failed_when:
        - r_add.rc != 0
        - "'already defined' not in (r_add.stderr | default(''))"
      when: pbs_pve_storage_id not in r_pvesm.stdout

    # Converge the pinned fingerprint on an EXISTING storage: `pvesm add` only sets it at creation.
    # When the server's certificate changes (the wildcard, each renewal) the storage would stay
    # pinned to the old one and go inactive ("fingerprint … not verified") — found 2026-10-03.
    - name: "PVE-wire | The storage as PVE holds it (fingerprint, username)"
      ansible.builtin.command:
        argv: [pvesh, get, "/storage/{{ pbs_pve_storage_id }}", --output-format, json]
      register: r_storage_now
      check_mode: false  # read-only probe: must run under --check too (later tasks read its result)
      changed_when: false
      failed_when: false   # absent on a first run under --check: the comparisons below then see nothing

    - name: "PVE-wire | The storage pins the certificate the server presents now"
      ansible.builtin.command:
        argv: [pvesm, set, "{{ pbs_pve_storage_id }}", --fingerprint, "{{ pbs_fp }}"]
      when:
        - pbs_fp | length > 0
        - ((r_storage_now.stdout | default('{}', true) | from_json).fingerprint | default('') | lower) != (pbs_fp | lower)
      changed_when: true

    # Converge credentials on an EXISTING storage (e.g. the backup-user rename):
    # pvesm add can't update; compare the configured username and set on drift.
    - name: "PVE-wire | Converge storage credentials (username/token drift)"
      ansible.builtin.command:
        argv:
          - pvesm
          - set
          - "{{ pbs_pve_storage_id }}"
          - "--username"
          - "{{ pbs_tok.tokenid }}"
          - "--password"
          - "{{ pbs_tok.value }}"
      no_log: true
      when:
        - pbs_pve_storage_id in r_pvesm.stdout
        - ((r_storage_now.stdout | default('{}', true) | from_json).username | default('')) != pbs_tok.tokenid
      register: r_set
      changed_when: r_set is not skipped

    - name: "PVE-wire | Stat the storage encryption key"
      ansible.builtin.stat:
        path: "/etc/pve/priv/storage/{{ pbs_pve_storage_id }}.enc"
      register: pbs_enc_stat

    - name: "PVE-wire | Enable client-side encryption (autogen key, once)"
      ansible.builtin.command:
        argv: [pvesm, set, "{{ pbs_pve_storage_id }}", "--encryption-key", autogen]
      register: r_enc
      changed_when: r_enc.rc == 0
      when:
        - pbs_encryption_enabled | bool
        - not pbs_enc_stat.stat.exists

    - name: "PVE-wire | Read the encryption key (to back up off-node)"
      ansible.builtin.slurp:
        src: "/etc/pve/priv/storage/{{ pbs_pve_storage_id }}.enc"
      register: pbs_enc_key
      when: pbs_encryption_enabled | bool
      no_log: true

    # LOSS OF THIS KEY = UNRECOVERABLE BACKUPS. Vault holds the off-node copy (and
    # its KV history); it is written only when it differs from the node's key.
    - name: "PVE-wire | The off-node copy of the encryption key (Vault, optional)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pbs_encryption_vault_path }}"
        vault_secret_optional: true
      when: pbs_encryption_enabled | bool

    - name: "PVE-wire | Back up the encryption key to Vault (only when it differs)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pbs_encryption_vault_path }}"
        vault_secret_init: "{{ _pbs_key_doc }}"
        vault_secret_force_fields: "{{ _pbs_key_doc }}"
        _pbs_key_doc:
          encryption_key: "{{ pbs_enc_key.content | b64decode }}"
          note: "PVE->PBS client-side encryption key. LOSS = UNRECOVERABLE BACKUPS."
      when:
        - pbs_encryption_enabled | bool
        - pbs_enc_key.content is defined
        - (vault_secret_result.encryption_key | default('')) != (pbs_enc_key.content | b64decode)

    - name: "PVE-wire | Existing backup jobs"
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/backup, "--output-format", json]
      register: r_jobs
      changed_when: false
      check_mode: false   # read-only probe: must run under --check too (its JSON feeds the next task)

    - name: "PVE-wire | Create the 2nd backup job -> PBS (keeps the NFS job)"
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/backup
          - "--schedule"
          - "{{ pbs_backup_schedule }}"
          - "--storage"
          - "{{ pbs_pve_storage_id }}"
          - "--mode"
          - snapshot
          - "--all"
          - "1"
          - "--compress"
          - zstd
          - "--enabled"
          - "1"
          - "--notes-template"
          - "PBS S3 copy (SeaweedFS) — {{ '{{guestname}}' }} (VMID {{ '{{vmid}}' }})"
          - "--comment"
          - "PBS S3 second copy (managed by ansible pbs role)"
      register: r_job
      changed_when: r_job.rc == 0
      when: pbs_pve_storage_id not in (r_jobs.stdout | from_json | map(attribute='storage') | list)

    # --- PBS must NOT back itself up into its own datastore (circular) ----------
    # The all-guests S3 job would include the PBS VM; backing the backup server up
    # into the datastore it serves deadlocks ("http upgrade request timed out").
    # PBS's real DR copy is the NFS/vzdump job — so exclude PBS by its own VMID.
    - name: "PVE-wire | Guests of the cluster (id by name)"
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/resources, --type, vm, --output-format, json]
      register: r_guests
      check_mode: false  # read-only probe: must run under --check too (later tasks read its result)
      changed_when: false

    - name: "PVE-wire | Backup jobs now (the PBS job and what it excludes)"
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/backup, --output-format, json]
      register: r_jobs_now
      check_mode: false  # read-only probe: must run under --check too (later tasks read its result)
      changed_when: false

    - name: "PVE-wire | The PBS VM, the PBS job and its exclusions"
      ansible.builtin.set_fact:
        pbs_self_vmid: "{{ r_guests.stdout | from_json | selectattr('name', 'defined') | selectattr('name', 'eq', pbs_self_vm_name) | map(attribute='vmid') | map('string') | list | default([''], true) | first }}"
        pbs_job_id: "{{ r_jobs_now.stdout | from_json | selectattr('storage', 'defined') | selectattr('storage', 'eq', pbs_pve_storage_id) | map(attribute='id') | list | default([''], true) | first }}"
        pbs_job_excluded: >-
          {{ (r_jobs_now.stdout | from_json | selectattr('storage', 'defined') | selectattr('storage', 'eq', pbs_pve_storage_id)
              | map(attribute='exclude', default='') | list | default([''], true) | first | string).split(',') | map('trim') | select() | list }}

    # The exclusions already on the job are kept; the PBS VM is added to them.
    - name: "PVE-wire | Exclude the PBS VM from its own S3 job (idempotent)"
      ansible.builtin.command:
        argv: [pvesh, set, "/cluster/backup/{{ pbs_job_id }}", --exclude, "{{ (pbs_job_excluded + [pbs_self_vmid]) | join(',') }}"]
      when:
        - pbs_self_vmid | length > 0
        - pbs_job_id | length > 0
        - pbs_self_vmid not in pbs_job_excluded
      changed_when: true

    # --- Guests whose agent can't fs-freeze (FreeBSD/OPNsense) ------------------
    # fs-freeze fails ("Resource deadlock avoided") and errors the whole job, even
    # though the backup itself succeeds (crash-consistent — fine for a firewall).
    # Disable freeze-on-backup for them. Telmate 2.9.x can't express this and the
    # OPNsense TF module ignores agent drift, so Ansible owns it. NOTE: it takes
    # effect on the guest's next `qm reboot` (a guest-OS reboot does NOT cycle QEMU).
    - name: "PVE-wire | Agent setting of the FreeBSD/OPNsense guests"
      ansible.builtin.command:
        argv: [qm, config, "{{ pbs_guest_ids[item] }}"]
      loop: "{{ pbs_no_fsfreeze_vms | select('in', pbs_guest_ids.keys()) | list }}"
      register: r_agent
      check_mode: false  # read-only probe: must run under --check too (the next task reads its result)
      changed_when: false
      vars: &pbs_guest_ids
        pbs_guest_ids: "{{ dict(r_guests.stdout | from_json | selectattr('name', 'defined') | map(attribute='name') | zip(r_guests.stdout | from_json | selectattr('name', 'defined') | map(attribute='vmid') | map('string'))) }}"

    - name: "PVE-wire | Disable fs-freeze on backup for FreeBSD/OPNsense guests (applies on the next qm reboot)"
      ansible.builtin.command:
        argv: [qm, set, "{{ pbs_guest_ids[item.item] }}", --agent, "{{ pbs_no_fsfreeze_agent }}"]
      loop: "{{ r_agent.results }}"
      loop_control:
        label: "{{ item.item }}"
      when: pbs_no_fsfreeze_marker not in item.stdout
      changed_when: true
      vars: *pbs_guest_ids

    # The backup signal reads the storage of every job: written again now that the PBS
    # job exists, so the Backup* alerts cover this copy from the first night.
    - name: "PVE-wire | Backup liveness signal covers the PBS job (roles/pve_host)"
      ansible.builtin.include_role:
        name: pve_host
        tasks_from: backup_signal
