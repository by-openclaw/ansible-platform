---
# ==============================================================================
# Wire PBS into Proxmox VE: add it as a `pbs` storage + a SECOND backup job.
# The existing vzdump -> NFS (Synology, storage `poc-backup`) job is left ENABLED
# and untouched — every guest ends up on BOTH Synology (NFS) and SeaweedFS (S3).
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/pbs-pve-storage.yml
#
# Prereq: playbooks/pbs.yml has run (datastore pbs-datastore exists on vm-pbs-01).
# ==============================================================================
- name: "PBS side — PVE backup user, token, fingerprint"
  hosts: pbs
  become: true
  gather_facts: false
  vars_files:
    - ../roles/pbs/defaults/main.yml
  tasks:
    - name: "PVE-wire | Ensure the PVE backup user exists"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, user, create, "{{ pbs_pve_backup_user }}"]
      register: r_user
      changed_when: r_user.rc == 0
      failed_when:
        - r_user.rc != 0
        - "'already exists' not in (r_user.stderr | default(''))"

    - name: "PVE-wire | Read the current ACL (read-first idempotency)"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, list, --output-format, json]
      register: r_acl_list
      changed_when: false
      check_mode: false   # read-only probe: must run under --check too (its JSON feeds the next task)

    - name: "PVE-wire | Grant DatastoreBackup on the datastore"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, update, "/datastore/{{ pbs_datastore_name }}",
               DatastoreBackup, "--auth-id", "{{ pbs_pve_backup_user }}"]
      register: r_acl
      changed_when: r_acl.rc == 0
      when: >-
        (r_acl_list.stdout | from_json
         | selectattr('ugid', 'equalto', pbs_pve_backup_user)
         | selectattr('roleid', 'equalto', 'DatastoreBackup') | list | length) == 0
      failed_when:
        - r_acl is not skipped
        - r_acl.rc != 0
        - "'already' not in (r_acl.stderr | default(''))"

    - name: "PVE-wire | Stat the controller-side token secret"
      ansible.builtin.stat:
        path: "{{ pbs_secret_dir | expanduser }}/fabric/pbs-pve-backup-token.json"
      delegate_to: localhost
      become: false
      register: pbs_tok_stat

    - name: "PVE-wire | (Re)generate the API token when its secret is not held"
      when: not pbs_tok_stat.stat.exists
      block:
        - name: "PVE-wire | Delete any stale token (secret unknown)"
          ansible.builtin.command:
            argv: [proxmox-backup-manager, user, delete-token,
                   "{{ pbs_pve_backup_user }}", "{{ pbs_pve_backup_token }}"]
          register: r_deltok
          changed_when: r_deltok.rc == 0
          failed_when: false

        - name: "PVE-wire | Generate the backup API token (privsep off -> inherits ACL)"
          ansible.builtin.command:
            argv: [proxmox-backup-manager, user, generate-token,
                   "{{ pbs_pve_backup_user }}", "{{ pbs_pve_backup_token }}"]
          register: r_gentok
          changed_when: true
          no_log: true

        - name: "PVE-wire | Persist the token secret on the controller (0600)"
          ansible.builtin.copy:
            dest: "{{ pbs_secret_dir | expanduser }}/fabric/pbs-pve-backup-token.json"
            mode: "0600"
            content: |
              {{ {'fields': {
                   'tokenid': (r_gentok.stdout | regex_replace('^[^{]*', '') | from_json).tokenid,
                   'value': (r_gentok.stdout | regex_replace('^[^{]*', '') | from_json).value,
                   'note': 'PVE->PBS backup API token (pve-backup@pbs!pve)'
                 }} | to_nice_json }}
          delegate_to: localhost
          become: false
          no_log: true

    - name: "PVE-wire | Grant DatastoreBackup to the API TOKEN (privsep default)"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, acl, update, "/datastore/{{ pbs_datastore_name }}",
               DatastoreBackup, "--auth-id", "{{ pbs_pve_backup_user }}!{{ pbs_pve_backup_token }}"]
      register: r_tokacl
      changed_when: r_tokacl.rc == 0
      when: >-
        (r_acl_list.stdout | from_json
         | selectattr('ugid', 'equalto', pbs_pve_backup_user + '!' + pbs_pve_backup_token)
         | selectattr('roleid', 'equalto', 'DatastoreBackup') | list | length) == 0
      failed_when:
        - r_tokacl is not skipped
        - r_tokacl.rc != 0
        - "'already' not in (r_tokacl.stderr | default(''))"

    - name: "PVE-wire | Read the PBS TLS fingerprint"
      ansible.builtin.command:
        argv: [proxmox-backup-manager, cert, info]
      register: r_cert
      changed_when: false

    - name: "PVE-wire | Extract the sha256 fingerprint"
      ansible.builtin.set_fact:
        pbs_fingerprint: "{{ r_cert.stdout | regex_search('([0-9A-Fa-f]{2}(?::[0-9A-Fa-f]{2}){31})') }}"

- name: "PVE side — add PBS storage + 2nd backup job"
  hosts: proxmox_nodes
  gather_facts: false
  vars_files:
    - ../roles/pbs/defaults/main.yml
  vars:
    pbs_tok: "{{ (lookup('file', (pbs_secret_dir | expanduser) + '/fabric/pbs-pve-backup-token.json') | from_json).fields }}"
    pbs_fp: "{{ hostvars[groups['pbs'][0]]['pbs_fingerprint'] }}"
    pbs_ip: "10.1.3.222"
    pbs_svc_subnet: "10.1.3.0/24"     # SVC VLAN (where PBS lives)
    pbs_fw_oob_ip: "10.6.239.196"     # FW OOB IP the node routes SVC traffic through
  tasks:
    # The node sits on OOB (10.6.224.105); PBS is on the SVC VLAN behind the FW.
    # The node reaches the FW's OOB IP (10.6.239.196), and the FW routes+permits
    # OOB->SVC, so a static route via the FW makes PBS:8007 reachable. Persist it
    # via a systemd oneshot (no risky /etc/network/interfaces edits on the node).
    - name: "PVE-wire | Persistent route unit: node -> SVC VLAN via the FW"
      ansible.builtin.copy:
        dest: /etc/systemd/system/pbs-svc-route.service
        mode: "0644"
        content: |
          [Unit]
          Description=Static route to the SVC VLAN via the FW (PVE -> PBS backups)
          After=network-online.target
          Wants=network-online.target
          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/sbin/ip route replace {{ pbs_svc_subnet }} via {{ pbs_fw_oob_ip }}
          ExecStop=/sbin/ip route del {{ pbs_svc_subnet }} via {{ pbs_fw_oob_ip }}
          [Install]
          WantedBy=multi-user.target
      register: pbs_route_unit

    - name: "PVE-wire | Enable + start the SVC route (node can reach PBS:8007)"
      ansible.builtin.systemd_service:
        name: pbs-svc-route.service
        enabled: true
        state: started
        daemon_reload: "{{ pbs_route_unit is changed }}"

    - name: "PVE-wire | Existing PVE storages"
      ansible.builtin.command:
        argv: [pvesm, status]
      register: r_pvesm
      changed_when: false

    - name: "PVE-wire | Add the PBS storage (content=backup)"
      ansible.builtin.command:
        argv:
          - pvesm
          - add
          - pbs
          - "{{ pbs_pve_storage_id }}"
          - "--server"
          - "{{ pbs_ip }}"
          - "--datastore"
          - "{{ pbs_datastore_name }}"
          - "--username"
          - "{{ pbs_tok.tokenid }}"
          - "--password"
          - "{{ pbs_tok.value }}"
          - "--fingerprint"
          - "{{ pbs_fp }}"
          - "--content"
          - backup
      no_log: true
      register: r_add
      changed_when: r_add.rc == 0
      failed_when:
        - r_add.rc != 0
        - "'already defined' not in (r_add.stderr | default(''))"
      when: pbs_pve_storage_id not in r_pvesm.stdout

    # Converge credentials on an EXISTING storage (e.g. the backup-user rename):
    # pvesm add can't update; compare the configured username and set on drift.
    - name: "PVE-wire | Current storage username"
      ansible.builtin.shell: |
        set -o pipefail
        awk '/^pbs: {{ pbs_pve_storage_id }}$/{f=1} f&&/username/{print $2; exit}' /etc/pve/storage.cfg
      args: { executable: /bin/bash }
      register: r_user
      changed_when: false

    - name: "PVE-wire | Converge storage credentials (username/token drift)"
      ansible.builtin.command:
        argv:
          - pvesm
          - set
          - "{{ pbs_pve_storage_id }}"
          - "--username"
          - "{{ pbs_tok.tokenid }}"
          - "--password"
          - "{{ pbs_tok.value }}"
      no_log: true
      when:
        - pbs_pve_storage_id in r_pvesm.stdout
        - (r_user.stdout | trim) != pbs_tok.tokenid
      register: r_set
      changed_when: r_set is not skipped

    - name: "PVE-wire | Stat the storage encryption key"
      ansible.builtin.stat:
        path: "/etc/pve/priv/storage/{{ pbs_pve_storage_id }}.enc"
      register: pbs_enc_stat

    - name: "PVE-wire | Enable client-side encryption (autogen key, once)"
      ansible.builtin.command:
        argv: [pvesm, set, "{{ pbs_pve_storage_id }}", "--encryption-key", autogen]
      register: r_enc
      changed_when: r_enc.rc == 0
      when:
        - pbs_encryption_enabled | bool
        - not pbs_enc_stat.stat.exists

    - name: "PVE-wire | Read the encryption key (to back up off-node)"
      ansible.builtin.slurp:
        src: "/etc/pve/priv/storage/{{ pbs_pve_storage_id }}.enc"
      register: pbs_enc_key
      when: pbs_encryption_enabled | bool
      no_log: true

    - name: "PVE-wire | Back up the encryption key to the controller secret store (0600)"
      ansible.builtin.copy:
        dest: "{{ (pbs_secret_dir | expanduser) }}/fabric/pbs-encryption-key.json"
        mode: "0600"
        content: |
          {{ {'fields': {
               'encryption_key': (pbs_enc_key.content | b64decode),
               'note': 'PVE->PBS client-side encryption key. LOSS = UNRECOVERABLE BACKUPS. Mirror to Vault ({{ pbs_encryption_vault_path }}).'
             }} | to_nice_json }}
      delegate_to: localhost
      become: false
      when: pbs_encryption_enabled | bool
      no_log: true

    - name: "PVE-wire | Existing backup jobs"
      ansible.builtin.command:
        argv: [pvesh, get, /cluster/backup, "--output-format", json]
      register: r_jobs
      changed_when: false
      check_mode: false   # read-only probe: must run under --check too (its JSON feeds the next task)

    - name: "PVE-wire | Create the 2nd backup job -> PBS (keeps the NFS job)"
      ansible.builtin.command:
        argv:
          - pvesh
          - create
          - /cluster/backup
          - "--schedule"
          - "{{ pbs_backup_schedule }}"
          - "--storage"
          - "{{ pbs_pve_storage_id }}"
          - "--mode"
          - snapshot
          - "--all"
          - "1"
          - "--compress"
          - zstd
          - "--enabled"
          - "1"
          - "--notes-template"
          - "PBS S3 copy (SeaweedFS) — {{ '{{guestname}}' }} (VMID {{ '{{vmid}}' }})"
          - "--comment"
          - "PBS S3 second copy (managed by ansible pbs role)"
      register: r_job
      changed_when: r_job.rc == 0
      when: pbs_pve_storage_id not in (r_jobs.stdout | from_json | map(attribute='storage') | list)

    # --- PBS must NOT back itself up into its own datastore (circular) ----------
    # The all-guests S3 job would include the PBS VM; backing the backup server up
    # into the datastore it serves deadlocks ("http upgrade request timed out").
    # PBS's real DR copy is the NFS/vzdump job — so exclude PBS by its own VMID.
    - name: "PVE-wire | Exclude the PBS VM from its own S3 job (idempotent)"
      ansible.builtin.shell:
        cmd: |
          set -e
          vmid=$(qm list | awk -v n='{{ pbs_self_vm_name }}' '$2==n {print $1}')
          jid=$(pvesh get /cluster/backup --output-format json \
                | python3 -c "import sys,json; print(next((j['id'] for j in json.load(sys.stdin) if j.get('storage')=='{{ pbs_pve_storage_id }}'), ''))")
          [ -z "$vmid" ] || [ -z "$jid" ] && { echo "SKIP (vmid=$vmid jid=$jid)"; exit 0; }
          cur=$(pvesh get /cluster/backup/$jid --output-format json \
                | python3 -c "import sys,json; print(json.load(sys.stdin).get('exclude',''))")
          if echo ",$cur," | grep -q ",$vmid,"; then echo "NOCHANGE ($vmid already excluded)";
          else pvesh set /cluster/backup/$jid --exclude "$vmid" && echo "EXCLUDED $vmid"; fi
      register: r_excl
      changed_when: "'EXCLUDED' in r_excl.stdout"

    # --- Guests whose agent can't fs-freeze (FreeBSD/OPNsense) ------------------
    # fs-freeze fails ("Resource deadlock avoided") and errors the whole job, even
    # though the backup itself succeeds (crash-consistent — fine for a firewall).
    # Disable freeze-on-backup for them. Telmate 2.9.x can't express this and the
    # OPNsense TF module ignores agent drift, so Ansible owns it. NOTE: it takes
    # effect on the guest's next `qm reboot` (a guest-OS reboot does NOT cycle QEMU).
    - name: "PVE-wire | Disable fs-freeze on backup for FreeBSD/OPNsense guests"
      ansible.builtin.shell:
        cmd: |
          set -e
          vmid=$(qm list | awk -v n='{{ item }}' '$2==n {print $1}')
          [ -z "$vmid" ] && { echo "NOTFOUND ({{ item }})"; exit 0; }
          if qm config "$vmid" | grep -q 'freeze-fs-on-backup=0'; then echo "NOCHANGE ($vmid)";
          else qm set "$vmid" --agent enabled=1,type=virtio,freeze-fs-on-backup=0 && echo "SET $vmid (applies on next qm reboot)"; fi
      register: r_freeze
      changed_when: "'SET' in r_freeze.stdout"
      loop: "{{ pbs_no_fsfreeze_vms }}"
