---
# Configure PROD NetBird CE (lxc-netbird-01, SVC) — official COMBINED model:
# netbird-server (mgmt+signal+relay+STUN+embedded Dex) + dashboard, behind our
# Traefik, Authentik as external OIDC IdP. Ansible-only (no .sh installer).
# Requires infra-terraform-proxmox#46 (the LXC) applied.
- name: Configure PROD NetBird CE (combined model)
  hosts: netbird
  become: true
  gather_facts: true
  roles:
    - netbird
