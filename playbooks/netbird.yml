---
# Configure PROD NetBird CE (lxc-netbird-01, SVC) — official MULTI-CONTAINER model:
# dashboard + management + signal + relay + coturn, behind our Traefik, with
# NetBird's login = Authentik DIRECT (OIDC, no Dex) per the goauthentik.io guide.
# Ansible-only (no .sh installer). Requires infra-terraform-proxmox#46 (the LXC).
- name: Configure PROD NetBird CE (multi-container, Authentik-direct)
  hosts: netbird
  become: true
  gather_facts: true
  roles:
    - netbird
