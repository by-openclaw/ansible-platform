---
# Wait for a PVE task (UPID) to end and require it to have ended well. Caller sets:
#   pve_task_upid   the UPID a pvesh create/delete printed
#   pve_task_what   a few words for the messages
#   pve_task_timeout seconds (default 1800)
- name: "PVE task | {{ pve_task_what }}: wait for the task to end"
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ inventory_hostname }}/tasks/{{ pve_task_upid | trim }}/status", --output-format, json]
  register: pve_task_status
  until: (pve_task_status.stdout | from_json).status == 'stopped'
  retries: "{{ ((pve_task_timeout | default(1800)) / 5) | int }}"
  delay: 5
  changed_when: false

- name: "PVE task | {{ pve_task_what }}: its log (kept for the report)"
  ansible.builtin.command:
    argv: [pvesh, get, "/nodes/{{ inventory_hostname }}/tasks/{{ pve_task_upid | trim }}/log", --limit, "200", --output-format, json]
  register: pve_task_log
  changed_when: false

- name: "PVE task | {{ pve_task_what }}: ended well"
  ansible.builtin.assert:
    that: (pve_task_status.stdout | from_json).exitstatus == 'OK'
    fail_msg: "{{ pve_task_what }} failed: {{ (pve_task_log.stdout | from_json) | map(attribute='t') | select('search', 'ERROR|Error|error') | list | join(' | ') | truncate(600) }}"
    quiet: true
