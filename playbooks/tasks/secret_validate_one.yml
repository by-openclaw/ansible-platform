---
# Validate ONE secret against its live service. Reads the value from Vault, runs a
# type-specific probe (creds passed via ENV, never argv/logs; whole task no_log),
# and records only {name, type, ok} — never the secret. Included per check.
- name: "Check | Resolve the KV path ({{ check.name }})"
  ansible.builtin.include_tasks: vault_kv_path.yml
  vars:
    _kv_base: "{{ check.name }}"

- name: "Check | Read {{ check.name }} from Vault"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-e"
      - "VAULT_TOKEN={{ vault_root_token }}"
      - "{{ vault_container_name }}"
      - vault
      - kv
      - get
      - "-mount={{ vault_kv_path }}"
      - "-format=json"
      - "{{ vault_migrate_env }}/{{ _kv_rel }}"
  register: _sec
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true

- name: "Check | Parse {{ check.name }}"
  ansible.builtin.set_fact:
    _d: "{{ (_sec.stdout | from_json).data.data if _sec.rc == 0 else {} }}"
  no_log: true

# --- postgres: connect with psycopg inside the pgadmin container ---------------
- name: "Check | postgres {{ check.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-e"
      - PGHOST
      - "-e"
      - PGPORT
      - "-e"
      - PGUSER
      - "-e"
      - PGPASSWORD
      - "-e"
      - PGDATABASE
      - pgadmin
      - /venv/bin/python3
      - "-c"
      - "import os,psycopg; psycopg.connect(host=os.environ['PGHOST'],port=int(os.environ['PGPORT']),user=os.environ['PGUSER'],password=os.environ['PGPASSWORD'],dbname=os.environ['PGDATABASE'],sslmode='require',connect_timeout=6).close()"
  environment:
    PGHOST: "{{ _d.host | default('') }}"
    PGPORT: "{{ _d.port | default(5432) }}"
    PGUSER: "{{ _d.user | default('') }}"
    PGPASSWORD: "{{ _d.password | default('') }}"
    PGDATABASE: "{{ _d.database | default('postgres') }}"
  delegate_to: "{{ secret_validate_hosts.postgres }}"
  register: _pg
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true
  when: check.type == 'postgres' and _sec.rc == 0

# --- redis: AUTH via REDISCLI_AUTH inside the redis container ------------------
- name: "Check | redis {{ check.name }}"
  ansible.builtin.shell:
    cmd: >-
      docker exec -e REDISCLI_AUTH {{ secret_validate_redis_container | default('redis') }}
      redis-cli {{ '--tls --insecure' if (_d.tls | default(false) | bool) else '' }}
      --no-auth-warning ping
  environment:
    REDISCLI_AUTH: "{{ _d.password | default('') }}"
  delegate_to: "{{ secret_validate_hosts.redis }}"
  register: _redis
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true
  when: check.type == 'redis' and _sec.rc == 0

# --- http_basic: authenticate to an API endpoint (runs on the vault host) ------
- name: "Check | http_basic {{ check.name }}"
  ansible.builtin.uri:
    url: "{{ check.url }}"
    user: "{{ _d[check.user_field] | default('') }}"
    password: "{{ _d[check.pass_field] | default('') }}"
    force_basic_auth: true
    status_code: [200]
    validate_certs: false
    timeout: 10
  register: _http
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  failed_when: false
  no_log: true
  when: check.type == 'http_basic' and _sec.rc == 0

# --- ldap: simple bind against the outpost inside the authentik container ------
- name: "Check | ldap {{ check.name }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-e"
      - LPW
      - authentik-server
      - python3
      - "-c"
      - "import os,ssl; from ldap3 import Server,Connection,Tls,ALL; s=Server('{{ check.ldaps.split(':')[0] }}',port={{ check.ldaps.split(':')[1] }},use_ssl=True,tls=Tls(validate=ssl.CERT_NONE),get_info=ALL); Connection(s,user='cn={{ _d.user | default('svc-ldap-prod') }},ou=users,{{ check.base_dn }}',password=os.environ['LPW'],auto_bind=True)"
  environment:
    LPW: "{{ _d.password | default('') }}"
  delegate_to: "{{ secret_validate_hosts.ldap }}"
  register: _ldap
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true
  when: check.type == 'ldap' and _sec.rc == 0

# --- record result (return codes / status only — no secret material) ----------
- name: "Check | Record {{ check.name }}"
  ansible.builtin.set_fact:
    _sv_results: >-
      {{ _sv_results + [{
        'name': check.name, 'type': check.type,
        'ok': (_sec.rc == 0) and {
          'postgres':   (_pg.rc | default(1)) == 0,
          'redis':      (_redis.rc | default(1)) == 0 and ('PONG' in (_redis.stdout | default(''))),
          'http_basic': (_http.status | default(0)) == 200,
          'ldap':       (_ldap.rc | default(1)) == 0
        }[check.type] }] }}
