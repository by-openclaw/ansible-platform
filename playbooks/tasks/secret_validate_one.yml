---
# Validate ONE secret against its live service. Reads the value from Vault, runs a
# type-specific probe (credentials as module arguments or on standard input — never in argv nor in
# the task environment, which is a prefix of the remote command line; whole task no_log),
# and records only {name, type, ok} — never the secret. Included per check.
- name: "Check | Resolve the KV path ({{ check.name }})"
  ansible.builtin.include_tasks: vault_kv_path.yml
  vars:
    _kv_base: "{{ check.name }}"

# Vault's HTTP API on this member: the token travels in the module call, never on a command line.
- name: "Check | Read {{ check.name }} from Vault"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/{{ vault_kv_path }}/data/{{ vault_migrate_env }}/{{ _kv_rel }}"
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    timeout: "{{ vault_api_timeout }}"
    status_code: [200, 403, 404]   # found · not readable · absent
  register: _sec
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true

- name: "Check | Parse {{ check.name }}"
  ansible.builtin.set_fact:
    _d: "{{ _sec.json.data.data if _sec.status == 200 else {} }}"
  no_log: true

# --- postgres: a connection from the probe host (module arguments, not a command) ----
- name: "Check | postgres {{ check.name }}"
  community.postgresql.postgresql_ping:
    login_host: "{{ _d.host | default('') }}"
    login_port: "{{ _d.port | default(5432) }}"
    login_user: "{{ _d.user | default('') }}"
    login_password: "{{ _d.password | default('') }}"
    login_db: "{{ _d.database | default('postgres') }}"
    ssl_mode: require
    connect_params:
      connect_timeout: "{{ secret_validate_connect_timeout }}"
  delegate_to: "{{ secret_validate_hosts.postgres }}"
  register: _pg
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  failed_when: false
  no_log: true
  when: check.type == 'postgres' and _sec.status == 200

# --- redis: AUTH then PING on redis-cli's standard input (no password on a command line) --
- name: "Check | redis {{ check.name }}"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'exec', '-i', secret_validate_redis_container | default('redis'), 'redis-cli']
         + (['--tls', '--insecure'] if (_d.tls | default(false) | bool) else []) + ['--no-auth-warning'] }}
    stdin: |-
      AUTH "{{ _d.password | default('') | replace('\\', '\\\\') | replace('"', '\\"') }}"
      PING
  delegate_to: "{{ secret_validate_hosts.redis }}"
  register: _redis
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true
  when: check.type == 'redis' and _sec.status == 200

# --- http_basic: authenticate to an API endpoint (runs on the vault host) ------
- name: "Check | http_basic {{ check.name }}"
  ansible.builtin.uri:
    url: "{{ check.url }}"
    user: "{{ _d[check.user_field] | default('') }}"
    password: "{{ _d[check.pass_field] | default('') }}"
    force_basic_auth: true
    status_code: [200]
    validate_certs: false
    timeout: 10
  register: _http
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  failed_when: false
  no_log: true
  when: check.type == 'http_basic' and _sec.status == 200

# --- ldap: a simple bind against the outpost (module arguments, not a command) --------
- name: "Check | ldap {{ check.name }}"
  community.general.ldap_search:
    server_uri: "ldaps://{{ check.ldaps | default('') }}"
    validate_certs: false   # the outpost is addressed by its inventory address, as before
    bind_dn: "cn={{ _d.user | default('svc-ldap-' ~ platform_env) }},ou=users,{{ check.base_dn | default('') }}"
    bind_pw: "{{ _d.password | default('') }}"
    dn: "{{ check.base_dn | default('') }}"
    scope: base
  delegate_to: "{{ secret_validate_hosts.ldap }}"
  register: _ldap
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  failed_when: false
  no_log: true
  when: check.type == 'ldap' and _sec.status == 200

# --- match_file: the stored copy MUST equal a live file on a host -------------
# GitLab's gitlab-secrets.json is the case this exists for: nothing can
# "authenticate" with it, so the only meaningful check is whether Vault still
# holds what the live host holds. It drifted silently for weeks (#572), because a
# copy that is never used is never found to be wrong.
# The defaults are load-bearing: delegate_to is templated during task setup, BEFORE
# `when` is evaluated, so every OTHER check type — which carries no live_host —
# fails here on an undefined variable. Same family as a loop being built before
# its when: the guard does not protect what Ansible resolves first.
- name: "Check | match_file — digest of the live file for {{ check.name }}"
  ansible.builtin.slurp:
    src: "{{ check.live_path | default('/dev/null') }}"
  delegate_to: "{{ check.live_host | default(inventory_hostname) }}"
  become: true
  register: _mf_live
  check_mode: false  # read-only; the comparison below reads its result
  failed_when: false
  no_log: true
  when: check.type == 'match_file' and _sec.status == 200

# Digests only, over CANONICAL json: sort_keys is what makes this a comparison of
# documents rather than of serialisations. Without it, Vault returning the same
# document with different key order reads as drift — which it did on the first
# attempt at this check.
- name: "Check | match_file — compare digests for {{ check.name }}"
  ansible.builtin.set_fact:
    _mf_same: >-
      {{ ((_mf_live.content | default('') | b64decode | from_json)
           | to_json(sort_keys=true) | hash('sha256'))
         == ((_d[check.field] | default({}))
           | to_json(sort_keys=true) | hash('sha256')) }}
  no_log: true
  when: check.type == 'match_file' and _sec.status == 200

# --- record result (return codes / status only — no secret material) ----------
- name: "Check | Record {{ check.name }}"
  ansible.builtin.set_fact:
    _sv_results: >-
      {{ _sv_results + [{
        'name': check.name, 'type': check.type,
        'ok': (_sec.status == 200) and {
          'postgres':   (_pg.is_available | default(false)) | bool,
          'redis':      (_redis.rc | default(1)) == 0 and ('PONG' in (_redis.stdout | default(''))),
          'http_basic': (_http.status | default(0)) == 200,
          'ldap':       (_ldap.results is defined) and not (_ldap.failed | default(false)),
          'match_file':  (_mf_live.content is defined) and (_mf_same | default(false) | bool)
        }[check.type] }] }}
