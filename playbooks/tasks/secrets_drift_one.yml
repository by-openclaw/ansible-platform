---
# Compare ONE controller secret file with its Vault entry and append a finding
# holding KEY NAMES only. Every task that can see a value is no_log.
- name: "Drift | Resolve the KV path ({{ secret_file.path | basename }})"
  ansible.builtin.include_tasks: vault_kv_path.yml
  vars:
    _kv_base: "{{ secret_file.path | basename | regex_replace('\\.json$', '') }}"

- name: "Drift | Load the file ({{ secret_file.path | basename }})"
  ansible.builtin.set_fact:
    _dr_path: "{{ vault_migrate_env }}/{{ _kv_rel }}"
    _dr_file: "{{ (lookup('file', secret_file.path) | from_json).fields
                  | default(lookup('file', secret_file.path) | from_json, true) }}"
  no_log: true

- name: "Drift | Read the Vault entry (rc!=0 = absent)"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-e"
      - "VAULT_TOKEN={{ vault_root_token }}"
      - "{{ vault_container_name }}"
      - vault
      - kv
      - get
      - "-mount={{ vault_kv_path }}"
      - "-format=json"
      - "{{ _dr_path }}"
  register: _dr_cur
  check_mode: false   # read-only probe; the comparison below reads its result
  changed_when: false
  failed_when: false
  no_log: true

- name: "Drift | Bind the Vault document"
  ansible.builtin.set_fact:
    _dr_vault: "{{ (_dr_cur.stdout | from_json).data.data if _dr_cur.rc == 0 else {} }}"
  no_log: true

# The Jinja here reads values in order to compare them, but everything it EMITS
# is a key name. no_log keeps the rendered result out of the log regardless.
- name: "Drift | Diff the key sets ({{ secret_file.path | basename }})"
  ansible.builtin.set_fact:
    _dr_finding: >-
      {%- set differs = [] -%}
      {%- for k in (_dr_file.keys() | list | intersect(_dr_vault.keys() | list) | sort) -%}
      {%- if _dr_file[k] != _dr_vault[k] -%}{{- differs.append(k) or '' -}}{%- endif -%}
      {%- endfor -%}
      {{ {'path': _dr_path,
          'only_in_file': (_dr_file.keys() | list) | difference(_dr_vault.keys() | list) | sort,
          'only_in_vault': (_dr_vault.keys() | list) | difference(_dr_file.keys() | list) | sort,
          'value_differs': differs} | to_json }}
  no_log: true
  when: _dr_cur.rc == 0

- name: "Drift | Keep it only if something actually differs"
  ansible.builtin.set_fact:
    secrets_drift_findings: "{{ secrets_drift_findings + [_dr_finding | from_json] }}"
  when:
    - _dr_cur.rc == 0
    - (_dr_finding | from_json).only_in_file | length > 0
      or (_dr_finding | from_json).only_in_vault | length > 0
      or (_dr_finding | from_json).value_differs | length > 0
