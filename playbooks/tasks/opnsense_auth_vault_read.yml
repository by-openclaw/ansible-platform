---
# One user's webgui password, read from Vault and merged into the mapping handed to the firewall
# hosts. Separate file because include_role cannot accumulate inside a loop: the role publishes
# vault_secret_result as a fact, so `register` on the loop carries nothing per item — the zip in
# the first version of this pre-play produced an EMPTY password for every user, and the API
# refused the create (#369). Same failure mode roles/opnsense_provision hit with the seed secrets.

- name: "Auth | Read this user's webgui password from Vault: {{ item.name }}"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [auth]
  vars:
    # A person's own account names its path (`vault_path`): the password sits in that person's
    # area of Vault, read by them alone (security/0001). The other accounts are the firewall's.
    vault_secret_path: "{{ item.vault_path | default(platform_env ~ '/opnsense/' ~ (item.name | replace('_', '-'))) }}"
    # A user declared with `password_generate: true` gets a password generated in Vault the
    # first time (an account no human signs in with); the others must already have theirs.
    vault_secret_init: >-
      {{ {'webgui_password': lookup('community.general.random_string', length=opnsense_auth_generated_password_length | default(40), special=false),
          '_note': 'OPNsense local account ' ~ item.name ~ ' (generated; nobody signs in with it)'}
         if (item.password_generate | default(false) | bool) else {} }}

- name: "Auth | Keep it when Vault returned one: {{ item.name }}"
  ansible.builtin.set_fact:
    opnsense_auth_user_passwords: >-
      {{ opnsense_auth_user_passwords | default({})
         | combine({item.name: vault_secret_result.webgui_password}) }}
  when: (vault_secret_result | default({})).webgui_password | default('') | length > 0
  no_log: true
