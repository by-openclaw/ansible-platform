---
# ==============================================================================
# Load the svc SSH keys into the controller's ssh-agent — naming/0002 §5.1:
# "Ansible runtime — ssh-agent populated via Vault lookup". Ansible-ONLY, no
# shell scripts:
#   * passphrases come from Vault EXCLUSIVELY, read with the ansible-controller
#     AppRole (playbooks/vault-approle.yml) — never the root token, never disk;
#   * the agent binds a FIXED socket (~/.ssh/rune-agent.sock) and ~/.ssh/config
#     gets `IdentityAgent` pointing at it, so every later ansible-playbook run
#     uses the unlocked keys with no environment exporting.
#
#   Run at session start: ansible-playbook -i inventories/prod/hosts.yml playbooks/ssh-agent.yml
#
#   Bootstrap (the agent is gone and Vault sits behind the hop the agent unlocks — the
#   2026-09-22 desktop restart): the same command with -e agent_bootstrap=true loads the
#   break-glass key from the local print kit first, reaches the Vault host as the OOB local
#   admin, loads the svc keys, then drops the break-glass key from the agent again.
# ==============================================================================
- name: "Bootstrap | Break-glass key into the agent when the platform is unreachable"
  hosts: localhost
  gather_facts: true
  become: false
  vars:
    agent_sock: "{{ ansible_env.HOME }}/.ssh/rune-agent.sock"
    agent_print_kit: "{{ ansible_env.HOME }}/.openclaw/workspace/infra/secrets/print-kit"
  tasks:
    - name: "Bootstrap | Only on request"
      ansible.builtin.meta: end_play
      when: not (agent_bootstrap | default(false) | bool)

    - name: "Bootstrap | Read the break-glass passphrase and OS password (print kit, in memory)"
      ansible.builtin.set_fact:
        agent_bootstrap_key: "{{ (lookup('file', agent_print_kit ~ '/04-ssh-passphrase-' ~ platform_org ~ '.json') | from_json).key_file }}"
        agent_bootstrap_passphrase: "{{ (lookup('file', agent_print_kit ~ '/04-ssh-passphrase-' ~ platform_org ~ '.json') | from_json).passphrase }}"
        agent_bootstrap_os_password: "{{ (lookup('file', agent_print_kit ~ '/02-os-password-' ~ platform_org ~ '.json') | from_json).fields.password }}"
      no_log: true

    - name: "Bootstrap | Is an agent alive behind the fixed socket?"
      ansible.builtin.command: "ssh-add -l"
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      register: agent_alive
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      failed_when: false

    - name: "Bootstrap | Remove a stale socket (no agent behind it)"
      ansible.builtin.file:
        path: "{{ agent_sock }}"
        state: absent
      when: agent_alive.rc == 2

    - name: "Bootstrap | Start the agent on the fixed socket"
      ansible.builtin.command: "ssh-agent -a {{ agent_sock }}"
      when: agent_alive.rc == 2
      changed_when: true

    - name: "Bootstrap | Add the break-glass key"
      ansible.builtin.expect:
        command: "ssh-add {{ ansible_env.HOME }}/.ssh/{{ agent_bootstrap_key }}"
        responses:
          "Enter passphrase.*": "{{ agent_bootstrap_passphrase }}"
        timeout: 15
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      register: agent_bootstrap_add
      changed_when: "'Identity added' in (agent_bootstrap_add.stdout | default(''))"
      no_log: true

- name: "Fetch svc key passphrases (AppRole, on the Vault host)"
  hosts: vault
  become: true
  gather_facts: false
  vars_files:
    - ../roles/vault/defaults/main.yml
  vars:
    approle_secret_file: "{{ (vault_secret_dir | expanduser) }}/fabric/app-vault-ansible-controller.json"
    # Bootstrap mode: the hop and the Vault host are reached as the OOB local admin with the
    # break-glass key loaded by the play above; the sudo password comes from the print kit.
    ansible_user: "{{ platform_org if (agent_bootstrap | default(false) | bool) else 'svc-ansible-' ~ (platform_env | default('prod')) }}"
    platform_jump_user: "{{ platform_org if (agent_bootstrap | default(false) | bool) else 'svc-ansible-' ~ (platform_env | default('prod')) }}"
    ansible_become_password: >-
      {{ hostvars['localhost'].agent_bootstrap_os_password
         if (agent_bootstrap | default(false) | bool)
         else ((lookup('file', _os_svc_ansible_secret, errors='ignore') or '{"fields":{}}')
               | from_json).fields.password | default(omit) }}
  tasks:
    - name: "Agent | Load the AppRole credentials (controller file)"
      ansible.builtin.set_fact:
        _approle: "{{ (lookup('file', approle_secret_file) | from_json).fields }}"
      no_log: true

    - name: "Agent | AppRole login (short-lived scoped token)"
      ansible.builtin.command:
        argv: ["docker", "exec", "{{ vault_container_name }}",
               "vault", "write", "-field=token", "auth/approle/login",
               "role_id={{ _approle.role_id }}", "secret_id={{ _approle.secret_id }}"]
      register: _approle_token
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      no_log: true

    - name: "Agent | Read the svc passphrases"
      ansible.builtin.command:
        argv: ["docker", "exec", "-e", "VAULT_TOKEN={{ _approle_token.stdout }}", "{{ vault_container_name }}",
               "vault", "kv", "get", "-mount={{ vault_kv_path }}", "-field=passphrase",
               "prod/{{ item }}/ssh-passphrase"]
      loop: [svc-ansible, svc-rune]
      register: _pass_reads
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      no_log: true

    - name: "Agent | Expose to the localhost play (in-memory only)"
      ansible.builtin.set_fact:
        agent_passphrases:
          svc-ansible-prod: "{{ _pass_reads.results[0].stdout }}"
          svc-rune-prod: "{{ _pass_reads.results[1].stdout }}"
      no_log: true

- name: "Load the agent (controller)"
  hosts: localhost
  gather_facts: true
  become: false
  vars:
    agent_sock: "{{ ansible_env.HOME }}/.ssh/rune-agent.sock"
    agent_keys: [svc-ansible-prod, svc-rune-prod]
  tasks:
    # A socket file outlives its agent (desktop restart, logout): test the agent, not the file.
    - name: "Agent | Is an agent alive behind the fixed socket?"
      ansible.builtin.command: "ssh-add -l"
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      register: agent_alive
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      failed_when: false
    - name: "Agent | Remove a stale socket (no agent behind it)"
      ansible.builtin.file:
        path: "{{ agent_sock }}"
        state: absent
      when: agent_alive.rc == 2
    - name: "Agent | Start the agent on the fixed socket"
      ansible.builtin.command: "ssh-agent -a {{ agent_sock }}"
      when: agent_alive.rc == 2
      changed_when: true

    - name: "Agent | Point ssh at the agent (IdentityAgent — no env export needed)"
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.ssh/config"
        create: true
        mode: "0600"
        marker: "# {mark} ANSIBLE MANAGED — rune agent (identity/0004 §2)"
        block: |
          Host *
              IdentityAgent {{ agent_sock }}
        insertbefore: BOF

    - name: "Agent | Add the svc keys (passphrase from Vault, via expect)"
      ansible.builtin.expect:
        command: "ssh-add {{ ansible_env.HOME }}/.ssh/id_ed25519_{{ item }}"
        responses:
          "Enter passphrase.*": "{{ hostvars[groups['vault'][0]].agent_passphrases[item] }}"
        timeout: 15
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      loop: "{{ agent_keys }}"
      register: agent_add
      changed_when: "'Identity added' in (agent_add.stdout | default(''))"
      failed_when: false
      no_log: true

    - name: "Agent | Verify the keys are loaded"
      ansible.builtin.command: "ssh-add -l"
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      register: agent_list
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      failed_when: agent_list.rc != 0 or (agent_list.stdout_lines | length) < (agent_keys | length)

    - name: "Agent | Drop the break-glass key again (bootstrap only)"
      ansible.builtin.command: "ssh-add -d {{ ansible_env.HOME }}/.ssh/{{ hostvars['localhost'].agent_bootstrap_key }}"
      environment:
        SSH_AUTH_SOCK: "{{ agent_sock }}"
      when: agent_bootstrap | default(false) | bool
      changed_when: true
      failed_when: false
    - name: "Agent | Loaded identities (fingerprints only)"
      ansible.builtin.debug:
        msg: "{{ agent_list.stdout_lines }}"
