---
# ==============================================================================
# Playbook: adguard-prod — configure PROD AdGuard Home (vm-adguard-01)
# AdGuardHome runs as a container (roles/adguard): wildcard TLS + per-VLAN clients.
# Reach the SVC VLAN via the prod FW ProxyJump (see inventories/prod/hosts.yml).
# ==============================================================================

- name: Configure PROD AdGuard Home
  hosts: adguard
  become: true
  gather_facts: true
  roles:
    - base      # toolbox packages + the root filesystem following the disk size (the query log needs the room)
    - docker
    - adguard
