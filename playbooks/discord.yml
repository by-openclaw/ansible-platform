---
# ==============================================================================
# Discord server as code (chat-ops). Bot token from Vault prod/discord/bot;
# reconciles the BY-RESEARCH guild and stores every webhook URL in Vault.
#   ansible-playbook -i inventories/prod playbooks/discord.yml
# ==============================================================================
- name: "Discord guild — categories, channels, roles, webhooks"
  hosts: localhost
  connection: local
  gather_facts: false
  roles:
    - role: discord_guild
