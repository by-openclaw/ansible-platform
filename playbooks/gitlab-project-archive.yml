---
# ==============================================================================
# GitLab — archive (export) + restore (import) ONE project, via the REST API.
# Proves per-project backup/restore end-to-end, with the automation's API token
# (roles/gitlab_api, Vault). The full-instance backup is separate
# (gitlab-backup create → SeaweedFS, scheduled by roles/gitlab).
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-project-archive.yml
# ==============================================================================
- name: "GitLab — archive + restore a project"
  hosts: gitlab
  become: true
  gather_facts: false
  vars:
    gpa_src: "platform/apps/demo"          # project to archive
    gpa_namespace: "platform/apps"         # where to restore
    gpa_restore_path: "demo-restored"      # restored project path
    gpa_api: "{{ gitlab_api_url }}"
    gpa_restored: "{{ gpa_namespace }}/{{ gpa_restore_path }}"
    gpa_delete_retries: 40                 # a permanent delete is asynchronous: polled this many times …
    gpa_delete_delay: 3                    # … this many seconds apart
    gpa_upload_timeout: 120                # seconds for the archive's upload
    gpa_archive: "/var/opt/gitlab/backups/demo-export.tar.gz"
  tasks:
    - name: "Archive | The automation's API token (roles/gitlab_api)"
      ansible.builtin.include_role:
        name: gitlab_api

    - name: "Archive | Use it"
      ansible.builtin.set_fact:
        gpa_token: "{{ gitlab_api_token }}"
      no_log: true

    - name: "Archive | Look up source project id"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_src | replace('/', '%2F') }}"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_proj
      check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
      no_log: true

    - name: "Archive | Trigger export"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_proj.json.id }}/export"
        method: POST
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        status_code: [202]
      no_log: true

    - name: "Archive | Wait for export to finish"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_proj.json.id }}/export"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_exp
      check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
      until: gpa_exp.json.export_status == 'finished'
      retries: 30
      delay: 5
      no_log: true

    - name: "Archive | Download the export archive"
      ansible.builtin.get_url:
        url: "{{ gpa_api }}/projects/{{ gpa_proj.json.id }}/export/download"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        dest: "{{ gpa_archive }}"
        mode: "0600"
        force: true
      no_log: true

    - name: "Archive | Report the archive"
      ansible.builtin.stat:
        path: "{{ gpa_archive }}"
      register: gpa_arch_stat

    - name: "Archive | Archive created"
      ansible.builtin.debug:
        msg: "archive = {{ gpa_archive }} ({{ gpa_arch_stat.stat.size }} bytes)"

    # A previous restored project is removed for good, through the API, in two steps: the first
    # DELETE schedules the deletion (GitLab renames the project and frees its path at once), the
    # second — with the renamed path as confirmation — removes it permanently; then wait for it.
    - name: "Restore | Is there a previous restored project"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_restored | replace('/', '%2F') }}"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        status_code: [200, 404]
      register: gpa_prev
      check_mode: false  # read-only GET: must run under --check too (later tasks read its result)
      no_log: true

    - name: "Restore | Schedule its deletion"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_prev.json.id }}"
        method: DELETE
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        status_code: [202]
      changed_when: true
      no_log: true
      when: gpa_prev.status == 200

    - name: "Restore | The path GitLab gave it while it waits for deletion"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_prev.json.id }}"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_prev_marked
      no_log: true
      when: gpa_prev.status == 200

    - name: "Restore | Remove it permanently"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_prev.json.id }}?permanently_remove=true&full_path={{ gpa_prev_marked.json.path_with_namespace | replace('/', '%2F') }}"
        method: DELETE
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        status_code: [202]
      changed_when: true
      no_log: true
      when: gpa_prev.status == 200

    - name: "Restore | Wait until it is gone"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_prev.json.id }}"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        status_code: [200, 404]
      register: gpa_prev_gone
      until: gpa_prev_gone.status == 404
      retries: "{{ gpa_delete_retries }}"
      delay: "{{ gpa_delete_delay }}"
      no_log: true
      when: gpa_prev.status == 200

    - name: "Restore | The instance's import sources"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/application/settings"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_settings
      check_mode: false  # read-only GET: must run under --check too (the next task reads its result)
      no_log: true

    - name: "Restore | Ensure the gitlab_project import source is enabled (instance policy)"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/application/settings"
        method: PUT
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
        body_format: json
        body: "{{ {'import_sources': (gpa_settings.json.import_sources + ['gitlab_project']) | unique} }}"
      changed_when: true
      no_log: true
      when: "'gitlab_project' not in gpa_settings.json.import_sources"

    # The upload stays a plain curl command: the uri module cannot send a binary file part
    # as it is (it base64-encodes it, which GitLab stores undecoded, or rewrites its line
    # ends) — both tried on 2026-10-09, both imports refused by gzip. The token is not on the
    # command line: curl reads the header from its configuration on standard input.
    # An explicit name, so the restored project does not inherit the exported one's ("Demo")
    # and collide with the original.
    - name: "Restore | Import the archive as a new project (multipart)"
      ansible.builtin.command:
        argv:
          - curl
          - --silent
          - --show-error
          - --fail
          - --max-time
          - "{{ gpa_upload_timeout }}"
          - --config
          - "-"
          - --form
          - "path={{ gpa_restore_path }}"
          - --form
          - "name={{ gpa_restore_path }}"
          - --form
          - "namespace={{ gpa_namespace }}"
          - --form
          - "file=@{{ gpa_archive }}"
          - "{{ gpa_api }}/projects/import"
        stdin: 'header = "PRIVATE-TOKEN: {{ gpa_token }}"'
      register: gpa_import
      changed_when: true
      no_log: true

    - name: "Restore | Wait for the import to end"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_restored | replace('/', '%2F') }}"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_imp
      check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
      until: gpa_imp.json.import_status in ['finished', 'failed']
      retries: 60
      delay: 5
      no_log: true

    - name: "Restore | The import finished"
      ansible.builtin.assert:
        that: gpa_imp.json.import_status == 'finished'
        fail_msg: "GitLab reports the import as {{ gpa_imp.json.import_status }}: {{ gpa_imp.json.import_error | default('no error text') }}"
        quiet: true

    - name: "Restore | Verify the restored repository has the files"
      ansible.builtin.uri:
        url: "{{ gpa_api }}/projects/{{ gpa_imp.json.id }}/repository/tree"
        headers: { PRIVATE-TOKEN: "{{ gpa_token }}" }
      register: gpa_tree
      check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
      no_log: true

    - name: "Restore | Result"
      ansible.builtin.debug:
        msg: >-
          restored={{ gpa_imp.json.path_with_namespace }}
          import_status={{ gpa_imp.json.import_status }}
          files={{ gpa_tree.json | map(attribute='name') | list }}
