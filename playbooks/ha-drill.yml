---
# HA drill (services/0004): a PLANNED change of the PostgreSQL leader and of the Redis primary,
# measured from a consumer's side — through the endpoint, TLS verified. Nothing is written to
# an application: PostgreSQL is probed with a temporary table (only a leader accepts it), Redis
# with the endpoint's check login (the endpoint routes to the member that reports `master`).
#
# Redis, planned change: writes are PAUSED on the primary, the replica confirms it has them
# all, the Sentinels fail over and the former primary is made a replica at once. Without the
# pause the old primary stays writable until the endpoint has switched (about 18 s) and
# those writes are discarded when it becomes a replica (found by the drill of 2026-10-04).
# Clients see errors (never lost writes) until the endpoint follows the new primary — its
# check needs six good answers, about 18 s. An unplanned failure has no such window.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/ha-drill.yml
#        --tags postgresql | redis   one of the two
#
# Announce it first (reconnects: a few seconds for PostgreSQL, about 20 s for Redis) and run it
# outside the backup window. The members are equivalent: the drill does not switch back.
- name: "HA drill | PostgreSQL planned switchover"
  hosts: "{{ groups['patroni'] | first }}"
  become: true
  gather_facts: false
  tags: [postgresql]
  vars_files:
    - ../roles/postgresql/defaults/main.yml
  vars:
    ha_drill_patronictl: [docker, exec, "{{ pg_container_name }}", patronictl, -c, "{{ pg_patroni_conf }}"]
    ha_drill_pg_conninfo: >-
      host={{ platform_pg_host }} port={{ pg_port }} dbname=postgres user=postgres
      sslmode=verify-full sslrootcert=/etc/ssl/certs/ca-certificates.crt connect_timeout=2
    ha_drill_pg_probe:
      - docker
      - exec
      - -e
      - PGPASSWORD
      - "{{ pg_container_name }}"
      - psql
      - "{{ ha_drill_pg_conninfo }}"
      - -Atc
      - "create temp table ha_drill (x int); select 'writable on ' || inet_server_addr()"
  tasks:
    - name: "PostgreSQL | Superuser password (Vault, read)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pg_superuser_vault_path }}"   # pragma: allowlist secret
        vault_secret_action: read   # pragma: allowlist secret

    - name: "PostgreSQL | Keep it"
      ansible.builtin.set_fact:
        ha_drill_pg_password: "{{ vault_secret_result.password }}"
      no_log: true

    - name: "PostgreSQL | Members before"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      register: ha_drill_pg_before
      changed_when: false

    - name: "PostgreSQL | Leader and candidate (the synchronous standby)"
      ansible.builtin.set_fact:
        ha_drill_pg_leader: "{{ _m | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first }}"
        ha_drill_pg_candidate: "{{ _m | selectattr('Role', 'equalto', 'Sync Standby') | map(attribute='Member') | first }}"
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | Every member is healthy before the drill"
      ansible.builtin.assert:
        that:
          - _m | length == platform_pg_members | length
          - _m | rejectattr('State', 'in', ['running', 'streaming']) | list | length == 0
          - _m | rejectattr('Role', 'equalto', 'Leader') | map(attribute='Replay Lag', default=0) | map('int') | max == 0   # Patroni 4: Receive Lag / Replay Lag
        fail_msg: "the cluster is not healthy — no drill: {{ _m }}"
        quiet: true
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | A write through the endpoint works before"
      ansible.builtin.command:
        argv: "{{ ha_drill_pg_probe }}"
      environment:
        PGPASSWORD: "{{ ha_drill_pg_password }}"
      register: ha_drill_pg_w0
      changed_when: false
      no_log: true

    - name: "PostgreSQL | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_pg_t0
      changed_when: false

    - name: "PostgreSQL | Switchover {{ ha_drill_pg_leader }} → {{ ha_drill_pg_candidate }}"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['switchover', '--leader', ha_drill_pg_leader, '--candidate', ha_drill_pg_candidate, '--force'] }}"
      changed_when: true

    - name: "PostgreSQL | Writes through the endpoint work again"
      ansible.builtin.command:
        argv: "{{ ha_drill_pg_probe }}"
      environment:
        PGPASSWORD: "{{ ha_drill_pg_password }}"
      register: ha_drill_pg_w1
      retries: 90
      delay: 1
      until: ha_drill_pg_w1.rc == 0
      changed_when: false
      no_log: true

    - name: "PostgreSQL | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_pg_t1
      changed_when: false

    - name: "PostgreSQL | The former leader follows again"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      register: ha_drill_pg_after
      retries: 40
      delay: 3
      until: >-
        ha_drill_pg_after.rc == 0 and
        (ha_drill_pg_after.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first | default('')) == ha_drill_pg_candidate and
        (ha_drill_pg_after.stdout | from_json | rejectattr('State', 'in', ['running', 'streaming']) | list | length) == 0 and
        (ha_drill_pg_after.stdout | from_json | selectattr('Role', 'equalto', 'Sync Standby') | list | length) == 1
      changed_when: false

    - name: "PostgreSQL | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL postgresql: {{ ha_drill_pg_leader }} → {{ ha_drill_pg_candidate }};
          writes through the endpoint back {{ (ha_drill_pg_t1.stdout | float - ha_drill_pg_t0.stdout | float) | round(1) }} s
          after the order ({{ ha_drill_pg_w1.attempts }} attempt(s));
          members: {{ ha_drill_pg_after.stdout | from_json | map(attribute='Member')
                      | zip(ha_drill_pg_after.stdout | from_json | map(attribute='Role'),
                            ha_drill_pg_after.stdout | from_json | map(attribute='State')) | map('join', ' ') | join(', ') }}

- name: "HA drill | Redis planned failover"
  hosts: "{{ groups['pg_endpoint'] | first }}"   # the endpoint guest (it carries the third Sentinel)
  become: true
  gather_facts: false
  tags: [redis]
  vars_files:
    - ../roles/redis_sentinel/defaults/main.yml
  vars:
    ha_drill_redis_cli:
      - docker
      - exec
      - -e
      - REDISCLI_AUTH
      - "{{ redis_sentinel_container_name }}"
      - redis-cli
      - --no-auth-warning
      - --tls
      - --cacert
      - /etc/ssl/certs/ca-certificates.crt
    ha_drill_redis_sentinel: "{{ ha_drill_redis_cli + ['-h', redis_sentinel_fqdn, '-p', redis_sentinel_port | string] }}"
    ha_drill_redis_endpoint: >-
      {{ ha_drill_redis_cli + ['-h', platform_redis_host, '-p', redis_sentinel_redis_port | string, '--user', 'healthcheck'] }}
    # A safety bound only: the step releases the pause itself once the former primary is a replica.
    ha_drill_redis_pause_ms: 30000
    ha_drill_redis_primary: "{{ ha_drill_redis_cli + ['-h', ha_drill_redis_before.stdout_lines | first, '-p', redis_sentinel_redis_port | string] }}"
  tasks:
    - name: "Redis | The Sentinel's and the check login's passwords (Vault, read)"
      ansible.builtin.include_tasks: tasks/ha-drill-login.yml
      loop:
        - {key: sentinel, path: "{{ redis_sentinel_vault_path }}"}
        - {key: admin, path: "{{ redis_sentinel_redis_vault_path }}"}
        - {key: healthcheck, path: "{{ platform_redis_users_vault_prefix }}/healthcheck"}
      loop_control:
        loop_var: ha_drill_secret
        label: "{{ ha_drill_secret.key }}"

    - name: "Redis | Primary before (as the Sentinels know it)"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_before
      changed_when: false

    - name: "Redis | The Sentinels agree and a replica is ready"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'CKQUORUM', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_quorum
      changed_when: false
      failed_when: "'OK' not in ha_drill_redis_quorum.stdout"

    - name: "Redis | The endpoint answers from the primary before"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_endpoint + ['INFO', 'replication'] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.healthcheck }}"
      register: ha_drill_redis_e0
      changed_when: false
      failed_when: "'role:master' not in ha_drill_redis_e0.stdout"

    - name: "Redis | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_redis_t0
      changed_when: false

    # ONE step, so no task latency sits between its parts:
    #   1. writes are paused on the primary (clients wait; a pause also stops the Sentinels'
    #      hello on that member, so they would fail over by themselves after down-after —
    #      the order below only makes it immediate);
    #   2. WAIT confirms the replica has acknowledged every write;
    #   3. the Sentinels are asked to fail over;
    #   4. as soon as they name the other member, the former primary is made its replica here
    #      (left to the Sentinels it happens only when the pause ends, and until then it is
    #      still a master in the endpoint's eyes) and the pause is released.
    - name: "Redis | Pause writes, confirm the replica, fail over, demote the former primary"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -euo pipefail
          cli() { docker exec -e REDISCLI_AUTH "{{ redis_sentinel_container_name }}" redis-cli --no-auth-warning --tls --cacert /etc/ssl/certs/ca-certificates.crt "$@"; }
          old="{{ ha_drill_redis_before.stdout_lines | first }}"
          REDISCLI_AUTH="$ADMIN_PW" cli -h "$old" -p {{ redis_sentinel_redis_port }} CLIENT PAUSE {{ ha_drill_redis_pause_ms }} WRITE
          acked=$(REDISCLI_AUTH="$ADMIN_PW" cli -h "$old" -p {{ redis_sentinel_redis_port }} WAIT 1 5000)
          [ "$acked" = "1" ] || { REDISCLI_AUTH="$ADMIN_PW" cli -h "$old" -p {{ redis_sentinel_redis_port }} CLIENT UNPAUSE; echo "replica not in sync (acked=$acked): no failover"; exit 1; }
          REDISCLI_AUTH="$SENTINEL_PW" cli -h "{{ redis_sentinel_fqdn }}" -p {{ redis_sentinel_port }} SENTINEL FAILOVER "{{ redis_sentinel_master_name }}"
          new="$old"
          for _ in $(seq 1 40); do
            new=$(REDISCLI_AUTH="$SENTINEL_PW" cli -h "{{ redis_sentinel_fqdn }}" -p {{ redis_sentinel_port }} SENTINEL GET-MASTER-ADDR-BY-NAME "{{ redis_sentinel_master_name }}" | head -1)
            [ "$new" != "$old" ] && break
            sleep 0.5
          done
          [ "$new" != "$old" ] || { REDISCLI_AUTH="$ADMIN_PW" cli -h "$old" -p {{ redis_sentinel_redis_port }} CLIENT UNPAUSE; echo "the Sentinels did not fail over"; exit 1; }
          REDISCLI_AUTH="$ADMIN_PW" timeout 10 docker exec -e REDISCLI_AUTH "{{ redis_sentinel_container_name }}" redis-cli --no-auth-warning --tls --cacert /etc/ssl/certs/ca-certificates.crt -h "$old" -p {{ redis_sentinel_redis_port }} REPLICAOF "$new" {{ redis_sentinel_redis_port }} || true
          REDISCLI_AUTH="$ADMIN_PW" cli -h "$old" -p {{ redis_sentinel_redis_port }} CLIENT UNPAUSE || true
          echo "failed over: $old -> $new"
      environment:
        ADMIN_PW: "{{ ha_drill_secrets.admin }}"
        SENTINEL_PW: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_order
      changed_when: true   # the passwords travel in the environment, never in the command text

    - name: "Redis | The step's outcome"
      ansible.builtin.debug:
        msg: "{{ ha_drill_redis_order.stdout_lines | last }}"

    - name: "Redis | The Sentinels name the other member"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_after
      retries: 60
      delay: 1
      until: ha_drill_redis_after.stdout_lines | first != ha_drill_redis_before.stdout_lines | first
      changed_when: false

    - name: "Redis | The endpoint answers from the new primary"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_endpoint + ['INFO', 'replication'] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.healthcheck }}"
      register: ha_drill_redis_e1
      retries: 90
      delay: 1
      until: ha_drill_redis_e1.rc == 0 and 'role:master' in ha_drill_redis_e1.stdout and 'connected_slaves:1' in ha_drill_redis_e1.stdout
      changed_when: false

    - name: "Redis | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_redis_t1
      changed_when: false

    # The endpoint's own log is the measure (this play's clock includes its own task latency).
    - name: "Redis | What the endpoint saw"
      ansible.builtin.shell:
        executable: /bin/bash
        cmd: |
          set -o pipefail
          docker logs --since 4m -t "{{ dbproxy_container_name | default('dbproxy') }}" 2>&1 \
            | grep -E 'redis/[a-z0-9-]+ is (DOWN|UP)' \
            | sed -E 's/^[0-9-]+T([0-9:.]{12}).*Server (redis\/[a-z0-9-]+) is (DOWN|UP).*/\1 \2 \3/' | sort -u | tail -4
      register: ha_drill_redis_seen
      changed_when: false
      failed_when: false

    - name: "Redis | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL redis: primary {{ ha_drill_redis_before.stdout_lines | first }} → {{ ha_drill_redis_after.stdout_lines | first }};
          writes paused on the old primary (replica confirmed in sync), former primary demoted at once; the endpoint answers from the new primary
          with its replica attached {{ (ha_drill_redis_t1.stdout | float - ha_drill_redis_t0.stdout | float) | round(1) }} s after the pause
          ({{ ha_drill_redis_e1.attempts }} attempt(s)); endpoint log: {{ ha_drill_redis_seen.stdout_lines | default([]) | join(' | ') }}
