---
# HA drill (services/0004): a PLANNED change of the PostgreSQL leader and of the Redis primary,
# measured from a consumer's side — through the endpoint, TLS verified. Nothing is written to
# an application: PostgreSQL is probed with a temporary table (only a leader accepts it), Redis
# with the endpoint's check login (the endpoint routes to the member that reports `master`).
#
# Redis, planned change: writes are PAUSED on the primary, the replica confirms it has them
# all, the Sentinels fail over and the former primary is made a replica at once. Without the
# pause the old primary stays writable until the endpoint has switched (about 18 s) and
# those writes are discarded when it becomes a replica (found by the drill of 2026-10-04).
# Clients see errors (never lost writes) until the endpoint follows the new primary — its
# check needs six good answers, about 18 s. An unplanned failure has no such window.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/ha-drill.yml
#        --tags postgresql | redis | vault   one of the three
#        --tags postgresql-kill | redis-kill | vault-kill
#                                              the UNPLANNED case: the leader's / the primary's /
#                                              the active member's container is killed and the gap
#                                              is measured from a client's side (run only when
#                                              asked for by tag; settings: vars/ha_drill.yml)
#
# Announce it first (reconnects: a few seconds for PostgreSQL, about 20 s for Redis) and run it
# outside the backup window. The members are equivalent: the drill does not switch back.
- name: "HA drill | PostgreSQL planned switchover"
  hosts: "{{ groups['patroni'] | first }}"
  become: true
  gather_facts: false
  tags: [postgresql]
  vars_files:
    - ../roles/postgresql/defaults/main.yml
    - vars/ha_drill.yml
  vars:
    ha_drill_patronictl: [docker, exec, "{{ pg_container_name }}", patronictl, -c, "{{ pg_patroni_conf }}"]
    ha_drill_pg_conninfo: >-
      host={{ platform_pg_host }} port={{ pg_port }} dbname=postgres user=postgres
      sslmode=verify-full sslrootcert={{ ha_drill_ca_bundle }} connect_timeout={{ ha_drill_pg_connect_timeout }}
    ha_drill_pg_probe:
      - docker
      - exec
      - -e
      - PGPASSWORD
      - "{{ pg_container_name }}"
      - psql
      - "{{ ha_drill_pg_conninfo }}"
      - -Atc
      - "create temp table ha_drill (x int); select 'writable on ' || inet_server_addr()"
  tasks:
    - name: "PostgreSQL | Superuser password (Vault, read)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ pg_superuser_vault_path }}"   # pragma: allowlist secret
        vault_secret_action: read   # pragma: allowlist secret

    - name: "PostgreSQL | Keep it"
      ansible.builtin.set_fact:
        ha_drill_pg_password: "{{ vault_secret_result.password }}"
      no_log: true

    - name: "PostgreSQL | Members before"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      register: ha_drill_pg_before
      changed_when: false

    - name: "PostgreSQL | Leader and candidate (the synchronous standby)"
      ansible.builtin.set_fact:
        ha_drill_pg_leader: "{{ _m | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first }}"
        ha_drill_pg_candidate: "{{ _m | selectattr('Role', 'equalto', 'Sync Standby') | map(attribute='Member') | first }}"
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | Every member is healthy before the drill"
      ansible.builtin.assert:
        that:
          - _m | length == platform_pg_members | length
          - _m | rejectattr('State', 'in', ['running', 'streaming']) | list | length == 0
          - _m | rejectattr('Role', 'equalto', 'Leader') | map(attribute='Replay Lag', default=0) | map('int') | max == 0   # Patroni 4: Receive Lag / Replay Lag
        fail_msg: "the cluster is not healthy — no drill: {{ _m }}"
        quiet: true
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | A write through the endpoint works before"
      ansible.builtin.command:
        argv: "{{ ha_drill_pg_probe }}"
      environment:
        PGPASSWORD: "{{ ha_drill_pg_password }}"
      register: ha_drill_pg_w0
      changed_when: false
      no_log: true

    - name: "PostgreSQL | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_pg_t0
      changed_when: false

    - name: "PostgreSQL | Switchover {{ ha_drill_pg_leader }} → {{ ha_drill_pg_candidate }}"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['switchover', '--leader', ha_drill_pg_leader, '--candidate', ha_drill_pg_candidate, '--force'] }}"
      changed_when: true

    - name: "PostgreSQL | Writes through the endpoint work again"
      ansible.builtin.command:
        argv: "{{ ha_drill_pg_probe }}"
      environment:
        PGPASSWORD: "{{ ha_drill_pg_password }}"
      register: ha_drill_pg_w1
      retries: "{{ ha_drill_follow_retries }}"
      delay: "{{ ha_drill_follow_delay }}"
      until: ha_drill_pg_w1.rc == 0
      changed_when: false
      no_log: true

    - name: "PostgreSQL | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_pg_t1
      changed_when: false

    - name: "PostgreSQL | The former leader follows again"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      register: ha_drill_pg_after
      retries: "{{ ha_drill_rejoin_retries }}"
      delay: "{{ ha_drill_rejoin_delay }}"
      until: >-
        ha_drill_pg_after.rc == 0 and
        (ha_drill_pg_after.stdout | from_json | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first | default('')) == ha_drill_pg_candidate and
        (ha_drill_pg_after.stdout | from_json | rejectattr('State', 'in', ['running', 'streaming']) | list | length) == 0 and
        (ha_drill_pg_after.stdout | from_json | selectattr('Role', 'equalto', 'Sync Standby') | list | length) == 1
      changed_when: false

    - name: "PostgreSQL | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL postgresql: {{ ha_drill_pg_leader }} → {{ ha_drill_pg_candidate }};
          writes through the endpoint back {{ (ha_drill_pg_t1.stdout | float - ha_drill_pg_t0.stdout | float) | round(1) }} s
          after the order ({{ ha_drill_pg_w1.attempts }} attempt(s));
          members: {{ ha_drill_pg_after.stdout | from_json | map(attribute='Member')
                      | zip(ha_drill_pg_after.stdout | from_json | map(attribute='Role'),
                            ha_drill_pg_after.stdout | from_json | map(attribute='State')) | map('join', ' ') | join(', ') }}

- name: "HA drill | Redis planned failover"
  hosts: "{{ groups['pg_endpoint'] | first }}"   # the endpoint guest (it carries the third Sentinel)
  become: true
  gather_facts: false
  tags: [redis]
  vars_files:
    - ../roles/redis_sentinel/defaults/main.yml
    - ../roles/dbproxy/defaults/main.yml          # dbproxy_container_name, dbproxy_redis_check_user
    - vars/ha_drill.yml
  vars:
    ha_drill_redis_cli:
      - docker
      - exec
      - -i
      - -e
      - REDISCLI_AUTH
      - "{{ redis_sentinel_container_name }}"
      - redis-cli
      - --no-auth-warning
      - --tls
      - --cacert
      - "{{ ha_drill_ca_bundle }}"
    ha_drill_redis_sentinel: "{{ ha_drill_redis_cli + ['-h', redis_sentinel_fqdn, '-p', redis_sentinel_port | string] }}"
    ha_drill_redis_endpoint: >-
      {{ ha_drill_redis_cli + ['-h', platform_redis_host, '-p', redis_sentinel_redis_port | string, '--user', dbproxy_redis_check_user] }}
    ha_drill_redis_primary: "{{ ha_drill_redis_cli + ['-h', ha_drill_redis_before.stdout_lines | first, '-p', redis_sentinel_redis_port | string] }}"
  tasks:
    - name: "Redis | The Sentinel's and the check login's passwords (Vault, read)"
      ansible.builtin.include_tasks: tasks/ha-drill-login.yml
      loop:
        - {key: sentinel, path: "{{ redis_sentinel_vault_path }}"}
        - {key: admin, path: "{{ redis_sentinel_redis_vault_path }}"}
        - {key: healthcheck, path: "{{ platform_redis_users_vault_prefix }}/{{ dbproxy_redis_check_user }}"}
      loop_control:
        loop_var: ha_drill_secret
        label: "{{ ha_drill_secret.key }}"

    - name: "Redis | Primary before (as the Sentinels know it)"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_before
      changed_when: false

    - name: "Redis | The Sentinels agree and a replica is ready"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'CKQUORUM', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_quorum
      changed_when: false
      failed_when: "'OK' not in ha_drill_redis_quorum.stdout"

    - name: "Redis | The endpoint answers from the primary before"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_endpoint + ['INFO', 'replication'] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.healthcheck }}"
      register: ha_drill_redis_e0
      changed_when: false
      failed_when: "'role:master' not in ha_drill_redis_e0.stdout"

    - name: "Redis | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_redis_t0
      changed_when: false

    # The change, one command per task (the client reads several commands from its input where
    # they belong to the same member):
    #   1. writes are paused on the primary (clients wait) and the replica confirms it has
    #      acknowledged every write;
    #   2. the Sentinels are asked to fail over;
    #   3. as soon as they name the other member, the former primary is made its replica here
    #      (left to the Sentinels it happens only when the pause ends, and until then it is
    #      still a master in the endpoint's eyes) and the pause is released.
    # Whatever fails after the pause, the pause is released.
    - name: "Redis | Pause writes on the primary; the replica confirms it has them all"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_primary }}"
        stdin: |
          CLIENT PAUSE {{ ha_drill_redis_pause_ms }} WRITE
          WAIT 1 {{ ha_drill_redis_wait_ms }}
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.admin }}"
      register: ha_drill_redis_paused
      changed_when: true
      timeout: "{{ ha_drill_redis_step_timeout }}"

    - name: "Redis | Fail over, then make the former primary a replica and release the pause"
      block:
        - name: "Redis | The replica has every write"
          ansible.builtin.assert:
            that: (ha_drill_redis_paused.stdout_lines | last | trim) == '1'
            fail_msg: "the replica did not confirm (answer: {{ ha_drill_redis_paused.stdout_lines | last | default('none') }}): no failover"
            quiet: true

        - name: "Redis | Ask the Sentinels to fail over"
          ansible.builtin.command:
            argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'FAILOVER', redis_sentinel_master_name] }}"
          environment:
            REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
          register: ha_drill_redis_order
          changed_when: true
          failed_when: "'OK' not in ha_drill_redis_order.stdout"

        - name: "Redis | The Sentinels name the other member"
          ansible.builtin.command:
            argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
          environment:
            REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
          register: ha_drill_redis_after
          retries: "{{ ha_drill_recovery_retries }}"
          delay: "{{ ha_drill_poll_delay }}"
          until: ha_drill_redis_after.rc == 0 and (ha_drill_redis_after.stdout_lines | first) != (ha_drill_redis_before.stdout_lines | first)
          changed_when: false

        - name: "Redis | The former primary follows the new one, and the pause ends"
          ansible.builtin.command:
            argv: "{{ ha_drill_redis_primary }}"
            stdin: |
              REPLICAOF {{ ha_drill_redis_after.stdout_lines | first }} {{ redis_sentinel_redis_port }}
              CLIENT UNPAUSE
          environment:
            REDISCLI_AUTH: "{{ ha_drill_secrets.admin }}"
          changed_when: true
          timeout: "{{ ha_drill_redis_step_timeout }}"
      rescue:
        - name: "Redis | Release the pause (the change did not complete)"
          ansible.builtin.command:
            argv: "{{ ha_drill_redis_primary + ['CLIENT', 'UNPAUSE'] }}"
          environment:
            REDISCLI_AUTH: "{{ ha_drill_secrets.admin }}"
          changed_when: true

        - name: "Redis | Stop here"
          ansible.builtin.fail:
            msg: "the planned change did not complete; writes were released on the primary"

    - name: "Redis | The endpoint answers from the new primary"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_endpoint + ['INFO', 'replication'] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.healthcheck }}"
      register: ha_drill_redis_e1
      retries: "{{ ha_drill_follow_retries }}"
      delay: "{{ ha_drill_follow_delay }}"
      until: ha_drill_redis_e1.rc == 0 and 'role:master' in ha_drill_redis_e1.stdout and 'connected_slaves:1' in ha_drill_redis_e1.stdout
      changed_when: false

    - name: "Redis | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_redis_t1
      changed_when: false

    # The endpoint's own log is the measure (this play's clock includes its own task latency).
    - name: "Redis | What the endpoint saw"
      ansible.builtin.command:
        argv: [docker, logs, --since, "{{ ha_drill_redis_log_window }}", -t, "{{ dbproxy_container_name }}"]
      register: ha_drill_redis_seen
      changed_when: false
      failed_when: false

    - name: "Redis | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL redis: primary {{ ha_drill_redis_before.stdout_lines | first }} → {{ ha_drill_redis_after.stdout_lines | first }};
          writes paused on the old primary (replica confirmed in sync), former primary demoted at once; the endpoint answers from the new primary
          with its replica attached {{ (ha_drill_redis_t1.stdout | float - ha_drill_redis_t0.stdout | float) | round(1) }} s after the pause
          ({{ ha_drill_redis_e1.attempts }} attempt(s)); endpoint log:
          {{ ((ha_drill_redis_seen.stdout_lines | default([])) + (ha_drill_redis_seen.stderr_lines | default([]))) | sort
             | select('search', 'Server redis/[a-z0-9-]+ is (DOWN|UP)')
             | map('regex_replace', '^\S+T(\S{12})\S* .*Server (redis/[a-z0-9-]+) is (DOWN|UP).*$', '\1 \2 \3')
             | list | unique | join(' | ') }}

# Vault: the ACTIVE member is lost (its container restarts, so it comes back sealed). The
# two others must elect a new active node and the edge must follow it; then the restarted
# member is unsealed with the role's own init tasks and must follow the cluster again.
- name: "HA drill | Vault loses its active member"
  hosts: "{{ groups['vault'] | first }}"
  become: true
  gather_facts: false
  tags: [vault]
  vars_files:
    - ../roles/vault/defaults/main.yml
    - vars/ha_drill.yml
  vars:
    ha_drill_vault_edge: "https://{{ platform_service_fqdns.vault }}/v1/sys/health"
  tasks:
    - name: "Vault | State of every member before"
      ansible.builtin.command:
        cmd: "docker exec {{ vault_container_name }} vault status -format=json"
      delegate_to: "{{ item }}"
      loop: "{{ platform_vault_members }}"
      register: ha_drill_vault_before
      changed_when: false
      failed_when: ha_drill_vault_before.rc != 0 or (ha_drill_vault_before.stdout | from_json).sealed

    - name: "Vault | The active member"
      ansible.builtin.set_fact:
        ha_drill_vault_active: >-
          {{ ((ha_drill_vault_before.results | first).stdout | from_json).leader_address | default('')
             | regex_replace('^https://', '') | regex_replace('[.:].*$', '') }}

    - name: "Vault | It is one of the members"
      ansible.builtin.assert:
        that: ha_drill_vault_active in platform_vault_members
        fail_msg: "no active member named by the cluster: {{ ha_drill_vault_active }}"
        quiet: true

    - name: "Vault | The edge answers from the active member before"
      ansible.builtin.uri:
        url: "{{ ha_drill_vault_edge }}"
        status_code: [200]

    - name: "Vault | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_vault_t0
      changed_when: false

    - name: "Vault | Restart the active member's container (it comes back sealed)"
      ansible.builtin.command:
        cmd: "docker restart {{ vault_container_name }}"
      delegate_to: "{{ ha_drill_vault_active }}"
      changed_when: true

    - name: "Vault | The edge answers again (another member is active)"
      ansible.builtin.uri:
        url: "{{ ha_drill_vault_edge }}"
        status_code: [200]
      register: ha_drill_vault_edge_after
      retries: "{{ ha_drill_follow_retries }}"
      delay: "{{ ha_drill_follow_delay }}"
      until: ha_drill_vault_edge_after.status == 200

    - name: "Vault | Clock"
      ansible.builtin.command: date +%s.%N
      register: ha_drill_vault_t1
      changed_when: false

    - name: "Vault | The new active member, asked from a member that stayed up"
      ansible.builtin.command:
        cmd: "docker exec {{ vault_container_name }} vault status -format=json"
      delegate_to: "{{ platform_vault_members | difference([ha_drill_vault_active]) | first }}"
      register: ha_drill_vault_after
      changed_when: false

    - name: "Vault | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL vault: active {{ ha_drill_vault_active }} restarted (sealed); the edge answered from
          {{ (ha_drill_vault_after.stdout | from_json).leader_address | default('?') }}
          {{ (ha_drill_vault_t1.stdout | float - ha_drill_vault_t0.stdout | float) | round(1) }} s after the restart
          ({{ ha_drill_vault_edge_after.attempts | default(1) }} attempt(s))

# --- Unplanned: the active member's container is killed and stays down until the play starts
# it. The takeover is read from the records: when Docker says the container stopped, and since
# when the new active node says it is active. The edge follows at its next check of the members.
- name: "HA drill | Vault loses its active member (killed)"
  hosts: "{{ groups['vault'] | first }}"
  become: true
  gather_facts: false
  tags: [never, vault-kill]
  vars_files:
    - ../roles/vault/defaults/main.yml
    - vars/ha_drill.yml
  vars:
    ha_drill_vault_edge: "https://{{ platform_service_fqdns.vault }}/v1/sys/health"
    ha_drill_vault_status: [docker, exec, "{{ vault_container_name }}", vault, status, -format=json]
    ha_drill_vault_witness: "{{ platform_vault_members | difference([ha_drill_vault_active]) | first }}"
    ha_drill_vault_new_active: >-
      {{ (ha_drill_vault_takeover.stdout | from_json).leader_address | default('')
         | regex_replace('^https://', '') | regex_replace('[.:].*$', '') }}
  tasks:
    - name: "Vault | State of every member before"
      ansible.builtin.command:
        argv: "{{ ha_drill_vault_status }}"
      delegate_to: "{{ item }}"
      loop: "{{ platform_vault_members }}"
      register: ha_drill_vault_before
      changed_when: false
      failed_when: ha_drill_vault_before.rc != 0 or (ha_drill_vault_before.stdout | from_json).sealed

    - name: "Vault | The active member"
      ansible.builtin.set_fact:
        ha_drill_vault_active: >-
          {{ ((ha_drill_vault_before.results | first).stdout | from_json).leader_address | default('')
             | regex_replace('^https://', '') | regex_replace('[.:].*$', '') }}

    - name: "Vault | It is one of the members"
      ansible.builtin.assert:
        that: ha_drill_vault_active in platform_vault_members
        fail_msg: "no active member named by the cluster: {{ ha_drill_vault_active }}"
        quiet: true

    - name: "Vault | Kill the active member's container ({{ ha_drill_vault_active }})"
      ansible.builtin.command:
        argv: [docker, kill, "{{ vault_container_name }}"]
      delegate_to: "{{ ha_drill_vault_active }}"
      changed_when: true

    - name: "Vault | When it stopped (Docker's record)"
      community.docker.docker_container_info:
        name: "{{ vault_container_name }}"
      delegate_to: "{{ ha_drill_vault_active }}"
      register: ha_drill_vault_killed

    - name: "Vault | Another member is active (asked from a member that stayed up)"
      ansible.builtin.command:
        argv: "{{ ha_drill_vault_status }}"
      delegate_to: "{{ ha_drill_vault_witness }}"
      register: ha_drill_vault_takeover
      retries: "{{ ha_drill_recovery_retries }}"
      delay: "{{ ha_drill_recovery_delay }}"
      until: >-
        ha_drill_vault_takeover.rc == 0 and
        ha_drill_vault_new_active in (platform_vault_members | difference([ha_drill_vault_active]))
      changed_when: false

    - name: "Vault | Since when the new active node is active (its own record)"
      ansible.builtin.command:
        argv: "{{ ha_drill_vault_status }}"
      delegate_to: "{{ ha_drill_vault_new_active }}"
      register: ha_drill_vault_active_since
      changed_when: false

    - name: "Vault | The edge answers from it"
      ansible.builtin.uri:
        url: "{{ ha_drill_vault_edge }}"
        status_code: [200]
      register: ha_drill_vault_edge_after
      retries: "{{ ha_drill_recovery_retries }}"
      delay: "{{ ha_drill_recovery_delay }}"
      until: ha_drill_vault_edge_after.status == 200

    - name: "Vault | Start the killed member again (it comes back sealed)"
      ansible.builtin.command:
        argv: [docker, start, "{{ vault_container_name }}"]
      delegate_to: "{{ ha_drill_vault_active }}"
      changed_when: true

    - name: "Vault | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL vault (active killed): {{ ha_drill_vault_active }} stopped at {{ ha_drill_vault_killed.container.State.FinishedAt }};
          {{ ha_drill_vault_new_active }} is active since {{ (ha_drill_vault_active_since.stdout | from_json).active_time }},
          {{ ha_drill_gap_seconds }} s later; the edge answers from it (it checks the members every second)
      vars:
        ha_drill_from: "{{ ha_drill_vault_killed.container.State.FinishedAt }}"
        ha_drill_to: "{{ (ha_drill_vault_active_since.stdout | from_json).active_time }}"

- name: "HA drill | Vault — the restarted member is unsealed and follows the cluster"
  hosts: "{{ groups['vault_cluster'] | default(groups['vault']) }}"
  become: true
  gather_facts: false
  serial: 1
  tags: [vault, vault-kill]
  tasks:
    - name: "Vault | Unseal what is sealed, every member follows the active node (roles/vault init)"
      ansible.builtin.include_role:
        name: vault
        tasks_from: init

# --- Unplanned: the member's container is killed and stays down until the play starts it. The
# gap is read from the records (vars/ha_drill.yml), not probed.
- name: "HA drill | PostgreSQL loses its leader (killed)"
  hosts: "{{ groups['patroni'] | first }}"
  become: true
  gather_facts: false
  tags: [never, postgresql-kill]
  vars_files:
    - ../roles/postgresql/defaults/main.yml
    - ../roles/dbproxy/defaults/main.yml          # dbproxy_container_name
    - vars/ha_drill.yml
  vars:
    ha_drill_patronictl: [docker, exec, "{{ pg_container_name }}", patronictl, -c, "{{ pg_patroni_conf }}"]
    ha_drill_endpoint_host: "{{ groups['pg_endpoint'] | first }}"
  tasks:
    - name: "PostgreSQL | Members before"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      register: ha_drill_pg_before
      changed_when: false

    - name: "PostgreSQL | Leader, and a member that stays up"
      ansible.builtin.set_fact:
        ha_drill_pg_leader: "{{ _m | selectattr('Role', 'equalto', 'Leader') | map(attribute='Member') | first }}"
        ha_drill_pg_witness: "{{ _m | selectattr('Role', 'equalto', 'Sync Standby') | map(attribute='Member') | first }}"
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | Every member is healthy before the drill"
      ansible.builtin.assert:
        that:
          - _m | length == platform_pg_members | length
          - _m | rejectattr('State', 'in', ['running', 'streaming']) | list | length == 0
          - _m | rejectattr('Role', 'equalto', 'Leader') | map(attribute='Replay Lag', default=0) | map('int') | max == 0
        fail_msg: "the cluster is not healthy — no drill: {{ _m }}"
        quiet: true
      vars:
        _m: "{{ ha_drill_pg_before.stdout | from_json }}"

    - name: "PostgreSQL | Kill the leader's container ({{ ha_drill_pg_leader }})"
      ansible.builtin.command:
        argv: [docker, kill, "{{ pg_container_name }}"]
      delegate_to: "{{ ha_drill_pg_leader }}"
      changed_when: true

    - name: "PostgreSQL | When it stopped (Docker's record)"
      community.docker.docker_container_info:
        name: "{{ pg_container_name }}"
      delegate_to: "{{ ha_drill_pg_leader }}"
      register: ha_drill_pg_killed

    # The endpoint writes one line when a member starts to receive traffic.
    - name: "PostgreSQL | The endpoint routes to another member (its own log, read until it says so)"
      ansible.builtin.command:
        argv: [docker, logs, --since, "{{ ha_drill_pg_killed.container.State.FinishedAt }}", -t, "{{ dbproxy_container_name }}"]
      delegate_to: "{{ ha_drill_endpoint_host }}"
      register: ha_drill_pg_endpoint_log
      retries: "{{ ha_drill_recovery_retries }}"
      delay: "{{ ha_drill_recovery_delay }}"
      until: ha_drill_pg_up | length > 0
      changed_when: false
      vars:
        ha_drill_pg_up: >-
          {{ ((ha_drill_pg_endpoint_log.stdout_lines | default([])) + (ha_drill_pg_endpoint_log.stderr_lines | default([])))
             | select('search', 'Server postgres/[a-z0-9-]+ is UP') | reject('search', 'postgres/' ~ ha_drill_pg_leader ~ ' ') | list }}

    - name: "PostgreSQL | When that was"
      ansible.builtin.set_fact:
        ha_drill_pg_recovered: >-
          {{ ((ha_drill_pg_endpoint_log.stdout_lines + ha_drill_pg_endpoint_log.stderr_lines) | sort
              | select('search', 'Server postgres/[a-z0-9-]+ is UP') | reject('search', 'postgres/' ~ ha_drill_pg_leader ~ ' ')
              | map('regex_search', '^\S+') | first) }}

    - name: "PostgreSQL | Start the killed member again"
      ansible.builtin.command:
        argv: [docker, start, "{{ pg_container_name }}"]
      delegate_to: "{{ ha_drill_pg_leader }}"
      changed_when: true

    - name: "PostgreSQL | The former leader follows again"
      ansible.builtin.command:
        argv: "{{ ha_drill_patronictl + ['list', '-f', 'json'] }}"
      delegate_to: "{{ ha_drill_pg_witness }}"
      register: ha_drill_pg_after
      retries: "{{ ha_drill_rejoin_retries }}"
      delay: "{{ ha_drill_rejoin_delay }}"
      until: >-
        ha_drill_pg_after.rc == 0 and
        (ha_drill_pg_after.stdout | from_json | length) == (platform_pg_members | length) and
        (ha_drill_pg_after.stdout | from_json | rejectattr('Role', 'equalto', 'Leader') | rejectattr('State', 'equalto', 'streaming') | list | length) == 0
      changed_when: false

    - name: "PostgreSQL | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL postgresql (leader killed): {{ ha_drill_pg_leader }} stopped at {{ ha_drill_pg_killed.container.State.FinishedAt }};
          the endpoint routed to another member {{ ha_drill_gap_seconds }} s later;
          members: {{ ha_drill_pg_after.stdout | from_json | map(attribute='Member')
                      | zip(ha_drill_pg_after.stdout | from_json | map(attribute='Role'),
                            ha_drill_pg_after.stdout | from_json | map(attribute='State')) | map('join', ' ') | join(', ') }}
      vars:
        ha_drill_from: "{{ ha_drill_pg_killed.container.State.FinishedAt }}"
        ha_drill_to: "{{ ha_drill_pg_recovered }}"

- name: "HA drill | Redis loses its primary (killed)"
  hosts: "{{ groups['pg_endpoint'] | first }}"
  become: true
  gather_facts: false
  tags: [never, redis-kill]
  vars_files:
    - ../roles/redis/defaults/main.yml            # redis_container_name
    - ../roles/redis_sentinel/defaults/main.yml
    - ../roles/dbproxy/defaults/main.yml          # dbproxy_container_name, dbproxy_redis_sentinels, dbproxy_redis_sentinel_quorum
    - vars/ha_drill.yml
  vars:
    ha_drill_redis_cli: [docker, exec, -e, REDISCLI_AUTH, "{{ redis_sentinel_container_name }}", redis-cli, --no-auth-warning, --tls, --cacert, "{{ ha_drill_ca_bundle }}"]
    ha_drill_redis_sentinel: "{{ ha_drill_redis_cli + ['-h', redis_sentinel_fqdn, '-p', redis_sentinel_port | string] }}"
    ha_drill_redis_killed: "{{ (ha_drill_redis_before.stdout_lines | first).split('.')[0] }}"
    ha_drill_redis_new: "{{ (ha_drill_redis_named.stdout_lines | first).split('.')[0] }}"
  tasks:
    - name: "Redis | The Sentinels' password (Vault, read)"
      ansible.builtin.include_tasks: tasks/ha-drill-login.yml
      loop:
        - {key: sentinel, path: "{{ redis_sentinel_vault_path }}"}
      loop_control:
        loop_var: ha_drill_secret
        label: "{{ ha_drill_secret.key }}"

    - name: "Redis | Primary before (as the Sentinels know it)"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_before
      changed_when: false

    - name: "Redis | The Sentinels agree and a replica is ready"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'CKQUORUM', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_quorum
      changed_when: false
      failed_when: "'OK' not in ha_drill_redis_quorum.stdout"

    - name: "Redis | Kill the primary's container ({{ ha_drill_redis_killed }})"
      ansible.builtin.command:
        argv: [docker, kill, "{{ redis_container_name }}"]
      delegate_to: "{{ ha_drill_redis_killed }}"
      changed_when: true

    - name: "Redis | When it stopped (Docker's record)"
      community.docker.docker_container_info:
        name: "{{ redis_container_name }}"
      delegate_to: "{{ ha_drill_redis_killed }}"
      register: ha_drill_redis_stopped

    - name: "Redis | The Sentinels name the other member"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'GET-MASTER-ADDR-BY-NAME', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_named
      retries: "{{ ha_drill_recovery_retries }}"
      delay: "{{ ha_drill_recovery_delay }}"
      until: ha_drill_redis_named.rc == 0 and (ha_drill_redis_named.stdout_lines | first) != (ha_drill_redis_before.stdout_lines | first)
      changed_when: false

    # A member receives traffic once it says master AND enough Sentinels name it: the endpoint
    # writes one line for each of those state changes.
    - name: "Redis | The endpoint routes to the new primary (its own log, read until it says so)"
      ansible.builtin.command:
        argv: [docker, logs, --since, "{{ ha_drill_redis_stopped.container.State.FinishedAt }}", -t, "{{ dbproxy_container_name }}"]
      register: ha_drill_redis_endpoint_log
      retries: "{{ ha_drill_recovery_retries }}"
      delay: "{{ ha_drill_recovery_delay }}"
      until: ha_drill_redis_member_up | length > 0 and ha_drill_redis_named_up | length >= (dbproxy_redis_sentinel_quorum | int)
      changed_when: false
      vars: &redis_eligibility
        ha_drill_redis_lines: >-
          {{ ((ha_drill_redis_endpoint_log.stdout_lines | default([])) + (ha_drill_redis_endpoint_log.stderr_lines | default([]))) | sort }}
        ha_drill_redis_member_up: >-
          {{ ha_drill_redis_lines | select('search', 'Server redis/' ~ ha_drill_redis_new ~ ' is UP') | map('regex_search', '^\S+') | list }}
        ha_drill_redis_named_up: >-
          {%- set out = [] -%}
          {%- for s in dbproxy_redis_sentinels -%}
            {%- set first = ha_drill_redis_lines | select('search', 'Server redis_named_' ~ ha_drill_redis_new ~ '/' ~ s ~ ' is UP')
                            | map('regex_search', '^\S+') | first | default('') -%}
            {%- if first | length > 0 -%}{%- set _ = out.append(first) -%}{%- endif -%}
          {%- endfor -%}
          {{ out | sort }}

    - name: "Redis | When that was (the member says master, and the Sentinels' quorum names it)"
      ansible.builtin.set_fact:
        ha_drill_redis_recovered: "{{ [ha_drill_redis_member_up | first, ha_drill_redis_named_up[(dbproxy_redis_sentinel_quorum | int) - 1]] | max }}"
      vars: *redis_eligibility

    - name: "Redis | Start the killed member again (it comes back claiming to be a primary)"
      ansible.builtin.command:
        argv: [docker, start, "{{ redis_container_name }}"]
      delegate_to: "{{ ha_drill_redis_killed }}"
      changed_when: true

    - name: "Redis | When it started (Docker's record)"
      community.docker.docker_container_info:
        name: "{{ redis_container_name }}"
      delegate_to: "{{ ha_drill_redis_killed }}"
      register: ha_drill_redis_restarted

    - name: "Redis | The Sentinels see it as a replica again"
      ansible.builtin.command:
        argv: "{{ ha_drill_redis_sentinel + ['SENTINEL', 'REPLICAS', redis_sentinel_master_name] }}"
      environment:
        REDISCLI_AUTH: "{{ ha_drill_secrets.sentinel }}"
      register: ha_drill_redis_replicas
      retries: "{{ ha_drill_rejoin_retries }}"
      delay: "{{ ha_drill_rejoin_delay }}"
      until: >-
        ha_drill_redis_replicas.rc == 0 and
        (ha_drill_redis_before.stdout_lines | first) in ha_drill_redis_replicas.stdout and
        's_down' not in ha_drill_redis_replicas.stdout and 'disconnected' not in ha_drill_redis_replicas.stdout
      changed_when: false

    # The endpoint logs a session when it ENDS: a line written after the return can be a session
    # of hours ago that a client closes late. What counts is when the session was ACCEPTED (the
    # date in brackets).
    - name: "Redis | The endpoint's log since the member is back"
      ansible.builtin.command:
        argv: [docker, logs, --since, "{{ ha_drill_redis_restarted.container.State.StartedAt }}", "{{ dbproxy_container_name }}"]
      register: ha_drill_redis_endpoint_after
      changed_when: false

    - name: "Redis | Sessions open on the restarted member now"
      ansible.builtin.uri:
        url: "http://127.0.0.1:{{ dbproxy_metrics_port }}/metrics"
        return_content: true
      register: ha_drill_redis_open

    - name: "Redis | The restarted member received nothing"
      ansible.builtin.assert:
        that:
          - ha_drill_redis_accepted_after | length == 0
          - ha_drill_redis_open_now | int == 0
        fail_msg: >-
          the endpoint used the restarted member: {{ ha_drill_redis_accepted_after | length }} session(s) accepted after its
          return, {{ ha_drill_redis_open_now }} open now
        quiet: true
      vars: &redis_received
        ha_drill_redis_accepted_after: >-
          {{ ((ha_drill_redis_endpoint_after.stdout_lines + ha_drill_redis_endpoint_after.stderr_lines)
              | select('search', ' redis redis/' ~ ha_drill_redis_killed ~ ' ') | join('\n'))
             | regex_findall('\[(\d\d/\w{3}/\d{4}:\d\d:\d\d:\d\d)\.\d+\] redis redis/' ~ ha_drill_redis_killed ~ ' ')
             | map('to_datetime', '%d/%b/%Y:%H:%M:%S')
             | select('ge', (ha_drill_redis_restarted.container.State.StartedAt.split('.')[0] | regex_replace('Z$', ''))
                            | to_datetime('%Y-%m-%dT%H:%M:%S'))
             | list }}
        ha_drill_redis_open_now: >-
          {{ ha_drill_redis_open.content
             | regex_findall('haproxy_server_current_sessions\{proxy="redis",server="' ~ ha_drill_redis_killed ~ '"\} ([0-9]+)')
             | first | default('0') }}

    - name: "Redis | Result"
      ansible.builtin.debug:
        msg: >-
          DRILL redis (primary killed): {{ ha_drill_redis_killed }} stopped at {{ ha_drill_redis_stopped.container.State.FinishedAt }},
          primary now {{ ha_drill_redis_new }}; the endpoint routed to it {{ ha_drill_gap_seconds }} s later;
          sessions accepted for the restarted member after its return: {{ ha_drill_redis_accepted_after | length }}
      vars:
        <<: *redis_received
        ha_drill_from: "{{ ha_drill_redis_stopped.container.State.FinishedAt }}"
        ha_drill_to: "{{ ha_drill_redis_recovered }}"
