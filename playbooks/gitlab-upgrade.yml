---
# ==============================================================================
# Playbook: gitlab-upgrade.yml — sequential upgrade for GitLab CE (#384).
#
# GitLab requires the LATEST PATCH of the current minor before moving to the next
# minor, and every step runs its own database migrations during reconfigure. The
# ladder is therefore explicit and each rung is verified before the next starts.
#
#   DRY RUN (prints the ladder, changes nothing):
#     ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-upgrade.yml
#
#   APPLY (GitLab restarts on every rung — running CI jobs are interrupted):
#     ansible-playbook -i inventories/prod/hosts.yml playbooks/gitlab-upgrade.yml \
#       -e upgrade_path_apply=true
#
# Take a backup first (playbooks/gitlab-backup.yml or the nightly PBS job):
# a failed migration is restored, not retried.
# ==============================================================================

- name: "GitLab CE — sequential upgrade"
  hosts: gitlab
  become: true
  gather_facts: true
  any_errors_fatal: true

  roles:
    - role: upgrade_path
      vars:
        upgrade_path_service: gitlab

        # Latest patch of the CURRENT minor first (this is the security release),
        # then the next minor. GitLab's own requirement, not a preference.
        upgrade_path_steps:
          - version: "19.3.2-ce.0"
            image: "19.3.2-ce.0"
            note: "latest 19.3.x — critical patch release (security), required before leaving the minor"
          - version: "19.4.0-ce.0"
            image: "19.4.0-ce.0"
            note: "minor 19.3 -> 19.4"
          - version: "19.4.1-ce.0"
            image: "19.4.1-ce.0"
            note: "latest 19.4.x — patch release 2026-09-23"

        # The running container's Rails VERSION is the truth (the UI banner lags); the rungs
        # are image tags (X.Y.Z-ce.0).
        upgrade_path_current:
          argv: [docker, exec, "{{ gitlab_container }}", cat, /opt/gitlab/embedded/service/gitlab-rails/VERSION]
          suffix: "-ce.0"

        # Re-run the gitlab role with this rung's version so the upgrade takes the normal
        # deploy path (the image tag; the container's startup reconfigure runs the migrations).
        upgrade_path_role: gitlab
        upgrade_path_image_var: gitlab_version

        # reconfigure runs the migrations; this makes sure they finished and the
        # background migrations are not stuck before the next rung is applied.
        upgrade_path_migrate:
          - name: "every runit service answers"
            argv: [docker, exec, "{{ gitlab_container }}", gitlab-ctl, status]
          - name: "no migration is down"
            argv: [docker, exec, "{{ gitlab_container }}", gitlab-rake, "db:migrate:status"]
            stdout_not_regex: ['(?m)^\s*down']

        # Health gate: every runit service up, the app answers, no failed migration.
        # The banner in the UI comes from a CACHED version check: after an upgrade the
        # cache still holds the pre-upgrade verdict (severity danger, critical flag),
        # so the console warns about a version that is no longer running. Drop it here.
        upgrade_path_verify:
          - name: "no runit service is down"
            argv: [docker, exec, "{{ gitlab_container }}", gitlab-ctl, status]
            stdout_not_regex: ['(?m)^down:']
          - name: "the application is ready"
            url: "http://127.0.0.1:8080/-/readiness"
          - name: "drop the cached version check"
            argv: [docker, exec, "{{ gitlab_container }}", gitlab-rails, runner, 'Rails.cache.delete("version_check")']
            changes: true

        upgrade_path_settle_seconds: 90
