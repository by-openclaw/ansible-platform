---
# ==============================================================================
# The NAS: each Proxmox node's backup share and its NFS rule (roles/nas_shares, through
# by_systems.synology_dsm). roles/pve_host runs the same role before it mounts the share; this play
# runs it alone.
#
#   Run: ansible-playbook -i inventories/prod/hosts.yml playbooks/nas.yml [--check --diff]
# ==============================================================================
- name: "NAS — each Proxmox node's backup share and NFS rule"
  hosts: proxmox_nodes
  gather_facts: false
  become: false
  roles:
    - role: nas_shares
