# Point the OPNsense firewall bouncer at the central CrowdSec LAPI.
# Four plays, one connection mode each, so no task-level connection switching:
#   0. vault  — read every secret on the Vault host and hand them to the firewall host
#   1. local  — plugin settings (API via by_systems.opnsense)
#   2. ssh    — read the agent's login; then on the LAPI retire a stale registration of our name
#   3. ssh    — enrol the agent + write the bouncer api_key (the one thing with no API), become root
#   4. local  — reconfigure; then verify on the central LAPI
# Prerequisites on the firewall (seed-owned): sudo_allow_wheel=1 and the automation user's
# password in Vault ({env}/opnsense/svc-ansible-{env}, key webgui_password) — see catalog opn_auth_users.
- name: "CrowdSec FW bouncer — secrets from Vault (read outside the connection:local plays)"
  hosts: vault
  become: true
  gather_facts: false
  vars:
    _fw: "{{ groups['opnsense'][0] }}"
  tasks:
    - name: "Vault | firewall API token"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ hostvars[_fw].crowdsec_fw_bouncer_vault_api | default((platform_env | default('prod')) ~ '/opnsense/api') }}"
    - name: "Vault | hand the API token over"
      ansible.builtin.set_fact:
        crowdsec_fw_bouncer_api:
          host: "{{ hostvars[_fw].opn_host }}"
          key: "{{ vault_secret_result.key }}"
          secret: "{{ vault_secret_result.secret }}"
      delegate_to: "{{ _fw }}"
      delegate_facts: true
      no_log: true
    - name: "Vault | bouncer api_key"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ (platform_env | default('prod')) ~ '/crowdsec/bouncer-opnsense' }}"
    - name: "Vault | hand the bouncer api_key over"
      ansible.builtin.set_fact:
        crowdsec_fw_bouncer_key:
          api_key: "{{ vault_secret_result.api_key }}"
      delegate_to: "{{ _fw }}"
      delegate_facts: true
      no_log: true
    - name: "Vault | agent registration token"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ (platform_env | default('prod')) ~ '/crowdsec/registration-token' }}"
    - name: "Vault | hand the registration token over"
      ansible.builtin.set_fact:
        crowdsec_fw_bouncer_reg_token: "{{ vault_secret_result.token }}"
      delegate_to: "{{ _fw }}"
      delegate_facts: true
      no_log: true
    - name: "Vault | automation user's password (sudo 'ask password')"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ (platform_env | default('prod')) ~ '/opnsense/svc-ansible-' ~ (platform_env | default('prod')) }}"
    - name: "Vault | hand the become password over"
      ansible.builtin.set_fact:
        crowdsec_fw_bouncer_become_password: "{{ vault_secret_result.webgui_password }}"
      delegate_to: "{{ _fw }}"
      delegate_facts: true
      no_log: true

- name: "CrowdSec FW bouncer — plugin settings via API"
  hosts: opnsense
  gather_facts: false
  connection: local
  become: false
  tasks:
    - name: Load credentials
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: load_creds
    - name: Apply plugin settings
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: api_settings

- name: "CrowdSec FW bouncer — is the firewall enrolled under our machine name? (SSH + become)"
  hosts: opnsense
  gather_facts: false
  vars:
    crowdsec_fw_bouncer_ssh_user: "{{ hostvars[inventory_hostname].crowdsec_fw_bouncer_ssh_user | default('svc-ansible-' ~ (platform_env | default('prod'))) }}"
    crowdsec_fw_bouncer_ssh_key: "{{ hostvars[inventory_hostname].crowdsec_fw_bouncer_ssh_key | default(lookup('env', 'HOME') ~ '/.ssh/id_ed25519_opnsense') }}"
    ansible_connection: ssh
    ansible_user: "{{ crowdsec_fw_bouncer_ssh_user }}"
    ansible_port: "{{ opn_ssh_port | default(22) }}"
    ansible_ssh_private_key_file: "{{ crowdsec_fw_bouncer_ssh_key }}"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: "{{ crowdsec_fw_bouncer_become_password }}"
    ansible_python_interpreter: /usr/local/bin/python3
  tasks:
    - name: Read the agent's login
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: agent_login

# A rebuilt firewall cannot register under a name the LAPI still holds for its predecessor.
- name: "CrowdSec FW bouncer — retire a stale registration on the central LAPI"
  hosts: crowdsec
  gather_facts: false
  vars:
    crowdsec_fw_bouncer_fw_host: "{{ groups['opnsense'] | first }}"
  tasks:
    - name: Retire when stale
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: lapi_retire_stale

- name: "CrowdSec FW bouncer — write api_key (SSH + become)"
  hosts: opnsense
  gather_facts: false
  vars:
    crowdsec_fw_bouncer_ssh_user: "{{ hostvars[inventory_hostname].crowdsec_fw_bouncer_ssh_user | default('svc-ansible-' ~ (platform_env | default('prod'))) }}"
    crowdsec_fw_bouncer_ssh_key: "{{ hostvars[inventory_hostname].crowdsec_fw_bouncer_ssh_key | default(lookup('env', 'HOME') ~ '/.ssh/id_ed25519_opnsense') }}"
    ansible_connection: ssh
    ansible_user: "{{ crowdsec_fw_bouncer_ssh_user }}"
    ansible_port: "{{ opn_ssh_port | default(22) }}"   # catalog: the appliance sshd port
    ansible_ssh_private_key_file: "{{ crowdsec_fw_bouncer_ssh_key }}"
    ansible_become: true
    ansible_become_method: sudo
    ansible_become_password: "{{ crowdsec_fw_bouncer_become_password }}"
    ansible_python_interpreter: /usr/local/bin/python3
  tasks:
    - name: Load credentials
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: load_creds
    - name: Enrol the firewall agent to the central LAPI
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: agent_enrol
    - name: Write the bouncer api_key
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: write_key

- name: "CrowdSec FW bouncer — reconfigure + verify"
  hosts: opnsense
  gather_facts: false
  connection: local
  become: false
  tasks:
    - name: Load credentials
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: load_creds
    - name: Reconfigure
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: reconfigure

- name: "CrowdSec FW bouncer — verify on the central LAPI"
  hosts: crowdsec
  gather_facts: false
  tasks:
    - name: Load role defaults for the machine name
      ansible.builtin.import_role:
        name: crowdsec_fw_bouncer
        tasks_from: verify_lapi
