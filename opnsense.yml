---
# OPNsense configuration playbook
# Usage:
#   Full run:      ansible-playbook opnsense.yml -i inventories/poc/
#   WireGuard only: ansible-playbook opnsense.yml -i inventories/poc/ --tags wireguard
#   Dry-run:       ansible-playbook opnsense.yml -i inventories/poc/ --tags wireguard --check

- name: Configure OPNsense
  hosts: opnsense
  gather_facts: false
  vars_files:
    - inventories/poc/group_vars/vault.yml
  roles:
    - opnsense
