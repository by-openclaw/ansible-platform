---
# Per-account provisioning. loop_var: acct.
# state: absent -> DISABLE (lock + expire + nologin), NEVER delete (identity/0004 §1).

- name: "User-mgmt | Disable (lock + expire), never delete — {{ acct.name }}"
  ansible.builtin.user:
    name: "{{ acct.name }}"
    password_lock: true
    expires: 1
    shell: /usr/sbin/nologin
  when: acct.state | default('present') == 'absent'

- name: "User-mgmt | Provision — {{ acct.name }}"
  when: acct.state | default('present') == 'present'
  block:
    - name: "User-mgmt | Ensure primary group — {{ acct.name }}"
      ansible.builtin.group:
        name: "{{ acct.primary_group }}"
        state: present

    # --- password (sudo / break-glass): from Vault, bound in main.yml -------------
    - name: "User-mgmt | The password — {{ acct.name }}"
      ansible.builtin.set_fact:
        um_acct_pw: "{{ user_mgmt_passwords[acct.vault_path].password }}"
      no_log: true
      when: acct.password | default(false)

    - name: "User-mgmt | Ensure the account — {{ acct.name }}"
      ansible.builtin.user:
        name: "{{ acct.name }}"
        comment: "{{ acct.comment | default('') }}"
        group: "{{ acct.primary_group }}"
        groups: "{{ (acct.groups | default([])) + ([user_mgmt_docker_group] if ((acct.docker | default(false)) and um_dockerd.rc == 0) else []) }}"
        append: false
        shell: "{{ acct.shell | default('/bin/bash') }}"
        password: "{{ (um_acct_hash_converged if acct.password_rounds is defined else (um_acct_pw | password_hash('sha512'))) if (acct.password | default(false)) else omit }}"  # pragma: allowlist secret
        update_password: "{{ 'always' if acct.password_rounds is defined else 'on_create' }}"  # pragma: allowlist secret
        create_home: true
        state: present
      vars:
        # An account that declares password_rounds has its stored hash CONVERGED: the same
        # password (Vault), the declared cost, and a salt derived from the host and the account
        # (a salt is not a secret — it is stored beside the hash; deriving it makes the hash the
        # same at every run, so the module writes only when it differs). The others keep a hash
        # made once, at creation.
        um_acct_hash_converged: >-
          {{ um_acct_pw | default('') | password_hash('sha512',
               (inventory_hostname ~ ':' ~ acct.name) | hash('sha256') | truncate(user_mgmt_salt_length, true, ''),
               rounds=(acct.password_rounds | default(user_mgmt_fast_hash_rounds) | int)) }}
      no_log: true

    - name: "User-mgmt | Install the authorized key (one per identity) — {{ acct.name }}"
      ansible.posix.authorized_key:
        user: "{{ acct.name }}"
        key: "{{ lookup('file', user_mgmt_key_dir + '/' + acct.pubkey) }}"
        key_options: "{{ acct.key_options | default(omit) }}"   # e.g. from="…": where the key is accepted
        state: present
        exclusive: true
      # authorized_key can't verify a not-yet-created user in check mode (module
      # limitation); the account exists by this point in a real run.
      when: acct.pubkey is defined and not ansible_check_mode

    - name: "User-mgmt | Sudoers (password required — NOPASSWD forbidden) — {{ acct.name }}"
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ acct.name }}"
        mode: "0440"
        content: "{{ acct.name }} ALL=(ALL:ALL) ALL\n"
        validate: "visudo -cf %s"
      when: acct.sudo | default(false)
