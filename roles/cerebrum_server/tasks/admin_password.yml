---
# The application's Admin password (Cerebrum's own user, set in its first-start dialog): Vault,
# created on first contact with the keys that say what it is, never overwritten.
- name: "Cerebrum server | The application Admin password (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ cerebrum_server_admin_vault_path }}"
    vault_secret_init:
      username: "{{ cerebrum_server_admin_user }}"
      password: >-   # pragma: allowlist secret
        {{ lookup('ansible.builtin.password', '/dev/null', length=22, chars=['ascii_letters', 'digits'])
           ~ lookup('ansible.builtin.password', '/dev/null', length=1, chars=['digits']) ~ '*' }}
      service: "EVS Cerebrum {{ cerebrum_server_version }}"
      instance: "{{ cerebrum_instance }}"
      host: "{{ inventory_hostname }} ({{ ansible_host }})"
      database: "{{ cerebrum_server_db_database }} on {{ cerebrum_server_db_host }}\\{{ cerebrum_server_db_instance }}"
      _note: >-
        Cerebrum application administrator (Cerebrum logon dialog, Standard method). Not a Windows or
        SQL account. Set at Cerebrum's first start; people sign in with their own Cerebrum user.
    vault_secret_metadata_put:
      origin: "roles/cerebrum_server (application Admin of Cerebrum instance {{ cerebrum_instance }} on {{ inventory_hostname }})"

- name: "Cerebrum server | Keep the document for the capture of its encrypted form"
  ansible.builtin.set_fact:
    cerebrum_server_admin_doc: "{{ vault_secret_result }}"
  no_log: true

- name: "Cerebrum server | The stored password meets Cerebrum's rule (no value shown)"
  ansible.builtin.assert:
    that:
      - cerebrum_server_admin_doc.password | length >= 10
      - cerebrum_server_admin_doc.password is search('[0-9]')
      - cerebrum_server_admin_doc.password is search('[a-z]')
      - cerebrum_server_admin_doc.password is search('[A-Z]')
      - cerebrum_server_admin_doc.password is search('[!@#$*]')
      - cerebrum_server_admin_doc.password is not search('[{}]')
    fail_msg: "{{ cerebrum_server_admin_vault_path }}: the password does not meet Cerebrum's rule"
    success_msg: "{{ cerebrum_server_admin_vault_path }}: {{ cerebrum_server_admin_user }}, meets Cerebrum's rule"
    quiet: true
  no_log: true
