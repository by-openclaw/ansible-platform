---
# roles/cerebrum_server — state present: pinned installers → WebView2 → Cerebrum (install or upgrade
# by the version pin) → the bundled SQL taken over when declared → the run account → Cerebrum.ini →
# device files → the project → the logon task → firewall → housekeeping → first start → report.
- name: "Cerebrum server | The WebView2 runtime is pinned (installer store or URL, + sha256)"
  ansible.builtin.assert:
    that:
      - (cerebrum_server_webview2_src | length > 0) or (cerebrum_server_webview2_url | length > 0)
      - cerebrum_server_webview2_sha256 | length == 64
      - (cerebrum_server_sql_bundled | bool) or (groups['cerebrum_db'] | default([]) | length > 0)
    fail_msg: >-
      cerebrum_server: name the WebView2 runtime (cerebrum_server_webview2_src in the installer store, or
      cerebrum_server_webview2_url) with its sha256 (inventory group_vars/cerebrum_server.yml); a multi-VM layout
      also needs a cerebrum_db host, a standalone one sets cerebrum_server_sql_bundled
    quiet: true

- name: "Cerebrum server | Download folder"
  ansible.windows.win_file:
    path: "{{ cerebrum_server_download_dir }}"
    state: directory

# Evergreen: once installed, the runtime updates itself (Microsoft Edge Update). The installer travels only to a
# host that lacks it (215 MB).
- name: "Cerebrum server | Is the WebView2 runtime installed?"
  ansible.windows.win_reg_stat:
    path: "{{ cerebrum_server_webview2_uninstall_key }}"
  register: cerebrum_server_webview2_installed

- name: "Cerebrum server | The WebView2 runtime where it is missing"
  when: not cerebrum_server_webview2_installed.exists
  block:
    - name: "Cerebrum server | The WebView2 installer, from the installer store"
      ansible.windows.win_copy:
        src: "{{ cerebrum_server_webview2_src }}"
        dest: "{{ cerebrum_server_webview2_installer_path }}"
      when: cerebrum_server_webview2_src | length > 0

    - name: "Cerebrum server | The WebView2 installer, from its URL"
      ansible.windows.win_get_url:
        url: "{{ cerebrum_server_webview2_url }}"
        dest: "{{ cerebrum_server_webview2_installer_path }}"
        checksum: "{{ cerebrum_server_webview2_sha256 }}"
        checksum_algorithm: sha256
      when: cerebrum_server_webview2_src | length == 0

    - name: "Cerebrum server | The WebView2 installer's checksum"
      ansible.windows.win_stat:
        path: "{{ cerebrum_server_webview2_installer_path }}"
        get_checksum: true
        checksum_algorithm: sha256
      register: cerebrum_server_webview2_stat

    - name: "Cerebrum server | The WebView2 installer is the pinned one"
      ansible.builtin.assert:
        that: cerebrum_server_webview2_stat.stat.checksum | default('') | lower == cerebrum_server_webview2_sha256 | lower
        fail_msg: "{{ cerebrum_server_webview2_installer_path }}: not the pinned sha256"
        quiet: true
      when: not ansible_check_mode

    - name: "Cerebrum server | Microsoft Edge WebView2 runtime (the installer's dependency)"
      ansible.windows.win_package:
        path: "{{ cerebrum_server_webview2_installer_path }}"
        product_id: "Microsoft EdgeWebView"
        arguments: /silent /install
        state: present

# The first start comes at the end of this file: no restart after a first install.
- name: "Cerebrum server | Cerebrum installed or upgraded to the version pin"
  ansible.builtin.include_tasks: install.yml
  vars:
    cerebrum_server_install_reboot: false

# --- standalone: the bundled SQL Express taken over (sa from Vault, port, logins, backup) ---------------
- name: "Cerebrum server | The bundled instance taken over by roles/cerebrum_db"
  ansible.builtin.include_role:
    name: cerebrum_db
  vars:
    cerebrum_db_install_source: bundled
    cerebrum_db_allowed_from: []
  when: cerebrum_server_sql_bundled | bool

# --- the account that hosts the application ------------------------------------------------------------
- name: "Cerebrum server | The run account's password (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ cerebrum_server_run_user_vault_path }}"
    vault_secret_init:
      user: "{{ cerebrum_server_run_user }}"
      password: >-   # pragma: allowlist secret
        {{ lookup('ansible.builtin.password', '/dev/null', length=cerebrum_server_password_length, chars=['ascii_letters', 'digits']) }}
    vault_secret_metadata_put:
      origin: "roles/cerebrum_server (the local account whose logon starts Cerebrum on {{ inventory_hostname }})"

- name: "Cerebrum server | The run account carries Vault's password (module payload, never argv)"
  ansible.windows.win_user:
    name: "{{ cerebrum_server_run_user }}"
    password: "{{ vault_secret_result.password }}"
    update_password: always   # pragma: allowlist secret
    groups: "{{ cerebrum_server_run_user_groups }}"
    groups_action: replace
    password_never_expires: true
    user_cannot_change_password: true
    account_disabled: false
    description: "roles/cerebrum_server: the session that hosts the Cerebrum server and its Watchdog"
    state: present
  no_log: true

# --- Cerebrum.ini: ONE method, line by line (tasks/ini.yml, the step `--tags ini` runs) ------------------
# Only the declared keys are written; every other line (Cerebrum's own, those it adds over time, the
# encrypted SQL password it wrote, the licence) stays. The whole-file template this replaced wrote the
# clear password (five failed decrypts lock the login) and dropped the licence (2026-11-05).
- name: "Cerebrum server | Cerebrum.ini, only the declared keys (tasks/ini.yml)"
  ansible.builtin.include_tasks: ini.yml

- name: "Cerebrum server | The ini inherits nothing"
  ansible.windows.win_acl_inheritance:
    path: "{{ cerebrum_server_ini }}"
    state: absent
    reorganize: false

- name: "Cerebrum server | The ini: Administrators, SYSTEM and the run account only"
  ansible.windows.win_acl:
    path: "{{ cerebrum_server_ini }}"
    user: "{{ item.user }}"
    rights: "{{ item.rights }}"
    type: allow
    state: present
  loop:
    - { user: Administrators, rights: FullControl }
    - { user: SYSTEM, rights: FullControl }
    - { user: "{{ cerebrum_server_run_user }}", rights: Read }
  loop_control:
    label: "{{ item.user }}"

# --- the device definitions kept to the declaration (every file loads, vendor checklist row 7) ------------
- name: "Cerebrum server | Device definition files present"
  ansible.windows.win_find:
    paths: "{{ cerebrum_server_install_dir }}\\GenericDevices"
    patterns: ["*.cgd"]
    recurse: true
  register: cerebrum_server_cgd
  when: cerebrum_server_device_families | length > 0

- name: "Cerebrum server | Definitions outside the declared families removed"
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop: >-
    {{ (cerebrum_server_cgd.files | default([])) | map(attribute='path') | list
       | reject('regex_search', '\\\\(' ~ ((cerebrum_server_device_families + cerebrum_server_device_families_builtin)
                                     | map('regex_escape') | join('|')) ~ ')$')
       | list }}
  when: cerebrum_server_device_families | length > 0

# --- the site's project ---------------------------------------------------------------------------------------
- name: "Cerebrum server | The site's project file (object store, verified)"
  ansible.windows.win_get_url:
    url: "{{ cerebrum_server_project_url }}"
    dest: "{{ cerebrum_server_install_dir }}\\Projects\\{{ cerebrum_server_project_url | basename }}"
    checksum: "{{ cerebrum_server_project_sha256 }}"
    checksum_algorithm: sha256
  when: cerebrum_server_project_url | length > 0

# --- the vendor's start: the run account signs in at boot, Cerebrum then its Watchdog -------------------------
- name: "Cerebrum server | Start at boot (tasks/startup.yml)"
  ansible.builtin.include_tasks: startup.yml
  vars:
    cerebrum_server_startup_reboot: false   # the first start comes at the end of this file

# --- the host firewall: per port, bound to the program ------------------------------------------------------
- name: "Cerebrum server | The firewall rules of the application"
  ansible.builtin.include_tasks: firewall.yml

# --- housekeeping: error logs older than the retention ------------------------------------------------------
- name: "Cerebrum server | Error logs past the retention, days: {{ cerebrum_server_errorlogs_keep_days }}"
  ansible.windows.win_find:
    paths: "{{ cerebrum_server_errorlogs_dir }}"
    patterns: ["*.log", "*.dmp"]
    age: "{{ cerebrum_server_errorlogs_keep_days }}d"
    recurse: true
  register: cerebrum_server_old_logs
  failed_when: false

- name: "Cerebrum server | Removed"
  ansible.windows.win_file:
    path: "{{ item }}"
    state: absent
  loop: "{{ (cerebrum_server_old_logs.files | default([])) | map(attribute='path') | list }}"

# --- the first start ------------------------------------------------------------------------------------------
- name: "Cerebrum server | Start now through the logon tasks"
  ansible.windows.win_command:
    argv: [schtasks.exe, /Run, /TN, "{{ item.name }}"]
  loop: "{{ cerebrum_server_logon_tasks }}"
  loop_control:
    label: "{{ item.name }}"
  when: cerebrum_server_start | bool
  changed_when: true

- name: "Cerebrum server | The server answers on 40001"
  ansible.windows.win_wait_for:
    port: 40001
    timeout: 300
  when: cerebrum_server_start | bool

- name: "Cerebrum server | Report"
  ansible.builtin.debug:
    msg: >-
      CEREBRUM_SERVER {{ inventory_hostname }}: {{ cerebrum_server_version }} ({{ cerebrum_server_components | join(', ') }}),
      database {{ cerebrum_server_db_name }}\{{ cerebrum_server_db_instance }},{{ cerebrum_server_db_port }} / {{ cerebrum_server_db_database }}
      as {{ cerebrum_server_db_login_user }}; run account {{ cerebrum_server_run_user }} ({{ cerebrum_server_run_user_groups | join(', ') }});
      ini {{ 'written' if (cerebrum_server_ini_lines is changed) else 'unchanged' }};
      firewall {{ cerebrum_server_firewall_rules | selectattr('remoteip', 'defined') | list | length }} rules
      ({{ cerebrum_server_firewall_rules | rejectattr('remoteip') | map(attribute='name') | join(', ') or 'all sourced' }} disabled: no source declared);
      device families {{ 'pruned to ' ~ (cerebrum_server_device_families | length) if cerebrum_server_device_families | length > 0 else 'untouched' }};
      started {{ cerebrum_server_start | bool }}
