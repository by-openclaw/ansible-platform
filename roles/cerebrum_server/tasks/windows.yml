---
# EVS Cerebrum User Manual §3.5 "Cerebrum Deployment Guide", the Windows settings it asks for on a Cerebrum
# server. Each one departs from the platform's CIS baseline where noted; the departure is the vendor's
# requirement (docs/services/cerebrum/README.md §2a).
# UAC "Never notify" (§3.5): Cerebrum and its services need elevation without a prompt; an unelevated
# Cerebrum could not reserve its RCP addresses (2026-11-04). EnableLUA stays 1 (the slider's own value).
- name: "Cerebrum server | UAC: never notify (EVS §3.5; CIS exception)"
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: "{{ item.name }}"
    data: "{{ item.data }}"
    type: dword
  loop:
    - { name: ConsentPromptBehaviorAdmin, data: 0 }
    - { name: PromptOnSecureDesktop, data: 0 }
  loop_control:
    label: "{{ item.name }}={{ item.data }}"

# "Run as Administrator" for Cerebrum and its Watchdog (§3.5), the compatibility layer Windows writes when
# the box is ticked in the program's properties.
- name: "Cerebrum server | Cerebrum and Watchdog always run as administrator (EVS §3.5)"
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AppCompatFlags\Layers'
    name: "{{ item }}"
    data: "~ RUNASADMIN"
    type: string
  loop: "{{ cerebrum_server_run_as_admin }}"

# Real-time anti-virus scanning delays project files, databases and logs (§3.5): Cerebrum's processes and
# folders are excluded from Microsoft Defender; Defender itself stays on.
- name: "Cerebrum server | Defender exclusions today"
  ansible.windows.win_powershell:
    script: |
      $p = Get-MpPreference
      $Ansible.Changed = $false
      [pscustomobject]@{ process = @($p.ExclusionProcess | Where-Object { $_ }); path = @($p.ExclusionPath | Where-Object { $_ }) }
  register: cerebrum_server_defender_now
  check_mode: false   # read-only

- name: "Cerebrum server | Defender: Cerebrum's processes and folders excluded (EVS §3.5; CIS exception)"
  ansible.windows.win_powershell:
    parameters:
      process: "{{ cerebrum_server_defender_processes | difference(cerebrum_server_defender_now.output[0].process) }}"
      path: "{{ cerebrum_server_defender_paths | difference(cerebrum_server_defender_now.output[0].path) }}"
    script: |
      param([string[]]$process, [string[]]$path)
      if ($process) { Add-MpPreference -ExclusionProcess $process }
      if ($path) { Add-MpPreference -ExclusionPath $path }
  when: >-
    (cerebrum_server_defender_processes | difference(cerebrum_server_defender_now.output[0].process) | length > 0) or
    (cerebrum_server_defender_paths | difference(cerebrum_server_defender_now.output[0].path) | length > 0)

# Static host entries on every Cerebrum server even with DNS (§3.5): the servers, the database host. The file is
# written whole, in one copy: win_hosts rewrote it per entry and, on vm-winapp-01, a write that failed after
# truncating it ("Stream was not readable") left the next entry to read an empty file (2026-11-04: the header
# and an entry lost). A copy that fails is tried again.
- name: "Cerebrum server | Hosts file: every Cerebrum server and the database host (EVS §3.5)"
  ansible.windows.win_template:
    src: hosts.j2
    dest: 'C:\Windows\System32\drivers\etc\hosts'
    newline_sequence: "\r\n"
  register: cerebrum_server_hosts_file
  retries: 3
  delay: 3
  until: cerebrum_server_hosts_file is not failed
