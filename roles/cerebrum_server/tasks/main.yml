---
# roles/cerebrum_server — see defaults/main.yml. Order: pinned installers → WebView2 → Cerebrum →
# the run account (Vault) → Cerebrum.ini from the database host's login (Vault) → device files kept
# to the declaration → the project → the logon task → firewall → housekeeping → first start → report.
- name: "Cerebrum server | Absent: the application uninstalled, data and the run account kept"
  ansible.builtin.include_tasks: absent.yml
  when: cerebrum_server_state == 'absent'

- name: "Cerebrum server | Present"
  ansible.builtin.include_tasks: present.yml
  when: cerebrum_server_state == 'present'
