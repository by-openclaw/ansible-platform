---
# ==============================================================================
# Role: nextcloud — files / drawio (Docker) on lxc-nextcloud-01 (SVC)
# web + cron containers (same image). Primary storage = Contabo S3 (object
# storage). Uses the shared cluster PostgreSQL (postgres_db: nextcloud) + Redis,
# both over verified TLS. Fronted by Traefik (wildcard TLS). drawio installed as
# a Nextcloud app (diagrams stored as files -> on S3). Upgrade = bump the
# nextcloud_image tag.
# ==============================================================================
# Exact pin, never a stream tag. Majors are NOT bumped here — Nextcloud refuses
# to skip majors and migrates the database per major, so use
# playbooks/nextcloud-upgrade.yml, which walks the ladder one rung at a time.
nextcloud_image: "nextcloud:34.0.4-apache"   # latest 34.x; 35.0.0 waits for stable app releases (D15, 2026-09-19)

nextcloud_fqdn: "{{ platform_service_fqdns.nextcloud }}"

# Web HTTP backend (Traefik terminates TLS) — published on the SVC IP.
nextcloud_listen_ip: "{{ hostvars[groups['nextcloud'] | first].ansible_host }}"
nextcloud_host_port: 80
nextcloud_container_port: 80

# Traefik is the only reverse proxy in front of Nextcloud (trusted proxy). The
# container's immediate peer is the docker bridge gateway (published-port NAT), so
# that range must ALSO be trusted for Nextcloud to read the X-Forwarded-For chain
# (else "remote address could not be determined" + wrong client IP for bruteforce).
nextcloud_trusted_proxy: "{{ hostvars[groups['traefik'] | first].ansible_host }}"
nextcloud_docker_bridge_cidr: "{{ platform_docker_bridge_cidr4 }}"

# Shared PostgreSQL (DB + role created by the postgres_db role). Nextcloud uses
# libpq; verify-full + CA enforced via config.php dbdriveroptions (the official
# image has no sslmode env).
nextcloud_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"
nextcloud_pg_port: 5432
nextcloud_pg_name: "nextcloud"
nextcloud_pg_user: "nextcloud"
nextcloud_pg_sslmode: "verify-full"
nextcloud_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Shared Redis (TLS). The official image's REDIS_HOST env does NOT enable TLS,
# so Redis is configured via a mounted config.php snippet with ssl_context.
nextcloud_redis_host: "{{ groups['redis'] | first }}.{{ platform_domain }}"
nextcloud_redis_port: 6379
nextcloud_redis_db: "{{ platform_redis_databases.nextcloud }}"   # own DB index on the shared Redis (group_vars/all/redis.yml allocation table, SVC-27)

# Application metrics (INF-35): the serverinfo API scraped by nextcloud-exporter, a sidecar on
# this host; Prometheus finds it through the catalog's `metrics_port` (data-driven job).
nextcloud_exporter_image: "xperimental/nextcloud-exporter:0.9.1"
nextcloud_metrics_port: 9205
nextcloud_vault_serverinfo_path: "{{ platform_env }}/nextcloud/serverinfo"   # token (get-or-create here), read by the exporter + set via occ

# Contabo S3 — PRIMARY object storage (bucket precreated out-of-band).
nextcloud_s3_bucket: "{{ platform_nextcloud_bucket }}"            # group_vars/all/objectstore.yml — one definition (the mirror job reads it too)
nextcloud_s3_host: "{{ platform_external_s3.contabo.host }}"
nextcloud_s3_port: 443
nextcloud_s3_ssl: "true"
nextcloud_s3_region: "{{ platform_external_s3.contabo.region }}"
nextcloud_s3_usepath_style: "true"   # Contabo requires path-style addressing
nextcloud_s3_autocreate: "false"     # we precreate the bucket

# Vault IS the secret store (no controller files). KV v2 paths under mount `secret`:
nextcloud_vault_admin_path: "{{ platform_env }}/nextcloud/admin"      # admin_user + admin_password (+url); get-or-create
nextcloud_vault_db_path: "{{ platform_env }}/nextcloud/db-pgsql"      # minted by postgres_db (Vault mode)
nextcloud_vault_redis_path: "{{ platform_env }}/redis/admin"          # shared Redis requirepass (owner: roles/redis)
nextcloud_vault_s3_path: "{{ platform_external_s3.contabo.vault_path }}"   # Contabo primary storage creds (until the SeaweedFS move)
nextcloud_vault_oidc_path: "{{ platform_env }}/nextcloud/oidc"        # minted by roles/authentik (Vault-native app)

# Initial local break-glass admin (kept alongside SSO as the break-glass login).
nextcloud_admin_user: "admin"

# Persistent volume (Nextcloud app code + config; USER DATA lives on S3).
nextcloud_app_volume: "nextcloud-app"

# Apps to install/enable after first-run install. user_oidc = Authentik SSO;
# sharebymail = "share by email" (send a password-protected link to an address).
# twofactor_totp kept ENABLED: NC nags either way (delegating MFA to Authentik), and
# "no provider available" reads as a security gap — so keep the provider so the
# break-glass local admin can use 2FA. (NC's "not enforced" note is expected.)
nextcloud_apps:
  - drawio
  - user_oidc
  - sharebymail
  - twofactor_totp
  # --- groupware / Teams parity (#396 §10, phase 1) ---------------------------
  - calendar            # CalDAV server, shared calendars, Talk rooms in events, appointment booking
  - contacts            # CardDAV server, system address book, shared Company book
  - mail                # mail front door on mailcow (provisioned below with the Dovecot master user)
  - spreed              # Talk: chat, presence, calls (HPB + coturn arrive in phase 2)
  - groupfolders        # team drives owned by groups
  - deck                # kanban (Planner)
  - tasks               # to-do lists (CalDAV VTODO → phones)
  - notes               # notes with mobile apps
  - forms               # forms / surveys
  - polls               # scheduling + opinion polls
  - tables              # structured lists
  - twofactor_webauthn  # security keys / passkeys next to TOTP
  - files_external      # core app (disabled by default): mounts the Jitsi recordings bucket later
  # --- phase 2 (collab backend on lxc-collab-01, roles/onlyoffice + roles/nextcloud_collab) ---
  - onlyoffice          # Word/Excel/PowerPoint editor (ONLYOFFICE Docs connector, JWT)
  - whiteboard          # real-time whiteboard (needs the whiteboard server)

# Every store app is installed from a PINNED release tarball, checksum-verified:
# occ app:install has no version switch and takes whatever the store lists (on
# 2026-09-19 the store's onlyoffice 10.2.0 pointed at a GitHub asset that 404s),
# and the old "latest for the running major on every play" (apps-update.yml) let
# versions move with no change in git. A version moves only by editing its pin:
# roles/nextcloud/tasks/app-pinned.yml installs it and runs the migrations. The
# pins are the versions running on 2026-09-28 (Nextcloud 34.0.4); URLs are the
# app store's own download links for that release. Apps shipped inside the image
# (sharebymail, twofactor_totp, files_external) move with nextcloud_image.
nextcloud_apps_pinned:
  - {id: calendar, version: "6.6.1", checksum: "sha256:fd6630deec568368784c569ef01c7d9ed8acca1ab6833cf12a2bff5984a3fa7b",
     url: "https://github.com/nextcloud-releases/calendar/releases/download/v6.6.1/calendar-v6.6.1.tar.gz"}
