     url: "https://github.com/nextcloud-releases/contacts/releases/download/v8.9.0/contacts-v8.9.0.tar.gz"}
  - {id: deck, version: "1.18.5", checksum: "sha256:dafec6635ff3af50fb6f73330064ef6153910be2fa434d2edbf8043263122253",
     url: "https://github.com/nextcloud-releases/deck/releases/download/v1.18.5/deck-v1.18.5.tar.gz"}
  - {id: drawio, version: "4.3.9", checksum: "sha256:3ac34d75ad538d067c4d119d464281b424c1958a2c7ef114de1d1d52fea8981c",
     url: "https://github.com/arnowelzel/drawio-nextcloud/releases/download/v4.3.9/drawio-v4.3.9.tar.gz"}
  - {id: forms, version: "5.4.0", checksum: "sha256:fdf8d4b175623411e4c5c47f0e97e54eb70fd97ba2bf8e3f82ef8f2944378a19",
     url: "https://github.com/nextcloud-releases/forms/releases/download/v5.4.0/forms-v5.4.0.tar.gz"}
  - {id: groupfolders, version: "22.0.6", checksum: "sha256:bfff357b12bbd24257d8d127cf30e83a72256e7659f1cc3e32bd09fe647d2f9b",
     url: "https://github.com/nextcloud-releases/groupfolders/releases/download/v22.0.6/groupfolders-v22.0.6.tar.gz"}
  - {id: mail, version: "5.12.2", checksum: "sha256:8985836fa1f6d7f846a523fbf0d096165ce4b21b6ebc0780842b59d6e40b2bcf",
     url: "https://github.com/nextcloud-releases/mail/releases/download/v5.12.2/mail-v5.12.2.tar.gz"}
  - {id: notes, version: "6.1.0", checksum: "sha256:03c493f45cb17a5005a0dce91c4e59b294ef91d4520c3ef44a21d5e61e419526",
     url: "https://github.com/nextcloud-releases/notes/releases/download/v6.1.0/notes-v6.1.0.tar.gz"}
  - {id: onlyoffice, version: "10.1.2", checksum: "sha256:41aa2168c6f0edb9dc06aade6f95bc5e7833aaac2a00b9ec1a04f8f78c5faff1",
     url: "https://github.com/ONLYOFFICE/onlyoffice-nextcloud/releases/download/v10.1.2/onlyoffice.tar.gz"}
  - {id: polls, version: "9.3.0", checksum: "sha256:e61ba33ed5f239a07b977fd45aae00da5661c58096b36fed1006f6194c9854a6",
