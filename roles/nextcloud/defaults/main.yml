---
# ==============================================================================
# Role: nextcloud — files / drawio (Docker) on lxc-nextcloud-01 (SVC)
# web + cron containers (same image). Primary storage = Contabo S3 (object
# storage). Uses the shared cluster PostgreSQL (postgres_db: nextcloud) + Redis,
# both over verified TLS. Fronted by Traefik (wildcard TLS). drawio installed as
# a Nextcloud app (diagrams stored as files -> on S3). Upgrade = bump the
# nextcloud_image tag.
# ==============================================================================
# Exact pin, never a stream tag. Majors are NOT bumped here — Nextcloud refuses
# to skip majors and migrates the database per major, so use
# playbooks/nextcloud-upgrade.yml, which walks the ladder one rung at a time.
nextcloud_image: "nextcloud:34.0.4-apache"   # latest 34.x; 35.0.0 waits for stable app releases (D15, 2026-09-19)

nextcloud_fqdn: "nextcloud.{{ platform_domain }}"

# Web HTTP backend (Traefik terminates TLS) — published on the SVC IP.
nextcloud_listen_ip: "{{ hostvars[groups['nextcloud'] | first].ansible_host }}"
nextcloud_host_port: 80
nextcloud_container_port: 80

# Traefik is the only reverse proxy in front of Nextcloud (trusted proxy). The
# container's immediate peer is the docker bridge gateway (published-port NAT), so
# that range must ALSO be trusted for Nextcloud to read the X-Forwarded-For chain
# (else "remote address could not be determined" + wrong client IP for bruteforce).
nextcloud_trusted_proxy: "{{ hostvars[groups['traefik'] | first].ansible_host }}"
nextcloud_docker_bridge_cidr: "172.17.0.0/16"

# Shared PostgreSQL (DB + role created by the postgres_db role). Nextcloud uses
# libpq; verify-full + CA enforced via config.php dbdriveroptions (the official
# image has no sslmode env).
nextcloud_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"
nextcloud_pg_port: 5432
nextcloud_pg_name: "nextcloud"
nextcloud_pg_user: "nextcloud"
nextcloud_pg_sslmode: "verify-full"
nextcloud_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Shared Redis (TLS). The official image's REDIS_HOST env does NOT enable TLS,
# so Redis is configured via a mounted config.php snippet with ssl_context.
nextcloud_redis_host: "{{ groups['redis'] | first }}.{{ platform_domain }}"
nextcloud_redis_port: 6379

# Contabo S3 — PRIMARY object storage (bucket precreated out-of-band).
nextcloud_s3_bucket: "nextcloud-data"
nextcloud_s3_host: "eu2.contabostorage.com"
nextcloud_s3_port: 443
nextcloud_s3_ssl: "true"
nextcloud_s3_region: "eu2"
nextcloud_s3_usepath_style: "true"   # Contabo requires path-style addressing
nextcloud_s3_autocreate: "false"     # we precreate the bucket

# Vault IS the secret store (no controller files). KV v2 paths under mount `secret`:
nextcloud_vault_admin_path: "{{ platform_env | default('prod') }}/nextcloud/admin"      # admin_user + admin_password (+url); get-or-create
nextcloud_vault_db_path: "{{ platform_env | default('prod') }}/nextcloud/db-pgsql"      # minted by postgres_db (Vault mode)
nextcloud_vault_redis_path: "{{ platform_env | default('prod') }}/redis/admin"          # shared Redis requirepass (owner: roles/redis)
nextcloud_vault_s3_path: "{{ platform_env | default('prod') }}/backup/s3-contabo"       # Contabo primary storage creds (until the SeaweedFS move)
nextcloud_vault_oidc_path: "{{ platform_env | default('prod') }}/nextcloud/oidc"        # minted by roles/authentik (Vault-native app)

# Initial local break-glass admin (kept alongside SSO as the break-glass login).
nextcloud_admin_user: "admin"

# Persistent volume (Nextcloud app code + config; USER DATA lives on S3).
nextcloud_app_volume: "nextcloud-app"

# Apps to install/enable after first-run install. user_oidc = Authentik SSO;
# sharebymail = "share by email" (send a password-protected link to an address).
# twofactor_totp kept ENABLED: NC nags either way (delegating MFA to Authentik), and
# "no provider available" reads as a security gap — so keep the provider so the
# break-glass local admin can use 2FA. (NC's "not enforced" note is expected.)
nextcloud_apps:
  - drawio
  - user_oidc
  - sharebymail
  - twofactor_totp
  # --- groupware / Teams parity (#396 §10, phase 1) ---------------------------
  - calendar            # CalDAV server, shared calendars, Talk rooms in events, appointment booking
  - contacts            # CardDAV server, system address book, shared Company book
  - mail                # mail front door on mailcow (provisioned below with the Dovecot master user)
  - spreed              # Talk: chat, presence, calls (HPB + coturn arrive in phase 2)
  - groupfolders        # team drives owned by groups
  - deck                # kanban (Planner)
  - tasks               # to-do lists (CalDAV VTODO → phones)
  - notes               # notes with mobile apps
  - forms               # forms / surveys
  - polls               # scheduling + opinion polls
  - tables              # structured lists
  - twofactor_webauthn  # security keys / passkeys next to TOTP
  - files_external      # core app (disabled by default): mounts the Jitsi recordings bucket later
  # --- phase 2 (collab backend on lxc-collab-01, roles/onlyoffice + roles/nextcloud_collab) ---
  - onlyoffice          # Word/Excel/PowerPoint editor (ONLYOFFICE Docs connector, JWT) — pinned tarball below
  - whiteboard          # real-time whiteboard (needs the whiteboard server)

# Apps installed from a PINNED release tarball instead of the store's latest: occ
# app:install has no version switch and takes whatever the store lists — on
# 2026-09-19 the store's onlyoffice 10.2.0 pointed at a GitHub asset that 404s.
# The tarball is fetched on the host, copied into the container and unpacked into
# custom_apps as www-data; re-run = no-op while the installed version matches.
# Store apps follow their latest release for the RUNNING major on every play
# (roles/nextcloud/tasks/apps-update.yml, drift-gated via --showonly). Pinned
# apps are excluded there and move only through nextcloud_apps_pinned.
nextcloud_apps_autoupdate: true

nextcloud_apps_pinned:
  - id: onlyoffice
    version: "10.1.2"
    url: "https://github.com/ONLYOFFICE/onlyoffice-nextcloud/releases/download/v10.1.2/onlyoffice.tar.gz"

# --- Authentik OIDC SSO (wired only when the client secret file exists) ---------
# Official user_oidc app, configured idempotently via occ. Access is gated
# IdP-side by the nextcloud-admins group (authentik restrict_to_group); groups
# are provisioned into Nextcloud from the `groups` claim.
nextcloud_authentik_base: "https://authentik.{{ platform_domain }}"
nextcloud_oidc_app_slug: "nextcloud"
nextcloud_oidc_provider_id: "authentik"

# --- Outbound email (Resend SMTP) -----------------------------------------------
# Same Resend relay the other cluster apps send through (vault/authentik/… —
# verified working). Configured via occ (the official image has no mail_* env).
# RETIRED (2026-09-01): Resend replaced by the nextcloud@ service mailbox
# (Vault {env}/mail/nextcloud). Resend creds stay in Vault resend/by-research.

# --- Sharing policy (public links: expiry + password + share-by-email) ----------
# "share with expiration + password + email" — applied to public link shares.
nextcloud_share_default_expire_days: 14   # public links: default + maximum lifetime (days) — #396 contract "limited time"
nextcloud_share_enforce_expire: true      # users cannot exceed/disable the expiry
nextcloud_share_enforce_password: true    # public links must carry a password
nextcloud_share_internal_expire_days: 30  # shares with internal users/groups: default + maximum lifetime (days)
nextcloud_share_internal_enforce_expire: true
nextcloud_share_allow_federation: false   # no federated (remote-server) shares; externals get links or the Guests app

# --- Setup-check hardening (admin "Security & setup warnings") -------------------
nextcloud_phone_region: "BE"              # default_phone_region (ISO 3166-1 alpha-2)
nextcloud_maintenance_window_start: 1     # UTC hour for heavy daily jobs (low usage)
nextcloud_serverid: 0                     # serverid (0-511); single-server → 0

# --- Quota (onedrive-like; per-user). Contabo plan 250 GB now → 1 TB later. ------
nextcloud_default_quota: "50 GB"          # applied to new AND existing users

# --- Clean instance (no demo/example content for any user, incl. future) ---------
nextcloud_skeleton_empty: true            # skeletondirectory="" → zero starter files

# Apps disabled to trim the footprint to a focused "files + sharing" instance (no
# OneDrive-everything bloat). KEPT (core): files*, dav (sync clients), user_oidc,
# drawio, sharebymail, viewer/files_pdfviewer, theming, settings, provisioning_api
# (SSO group sync), password_policy/bruteforcesettings (security), serverinfo
# (Monitoring/usage), logreader, updatenotification, activity, text, twofactor_*.
#   app_api / firstrunwizard / survey_client / weather_status / recommendations /
#   nextcloud_announcements  — Ex-Apps daemon, welcome popup, telemetry, widgets
#   dashboard                — the start-page widget board (we open straight to Files)
#   photos                   — photo gallery (images still open in the file viewer)
#   user_status              — presence / status emoji
#   circles                  — Teams (no Talk/Deck here that need it)
#   contactsinteraction / related_resources / files_reminders / support — minor widgets
#   federation               — cross-Nextcloud-server federation (we are standalone;
#                              internal + public-link sharing is unaffected). The
#                              federation *API* apps (federatedfilesharing,
#                              cloud_federation_api, lookup_server_connector) are
#                              forced shipped apps NC refuses to disable — left on,
#                              harmless (no remote federation configured).
nextcloud_apps_disabled:
  - app_api
  - firstrunwizard
  - survey_client
  - weather_status
  - recommendations
  - nextcloud_announcements
  - dashboard
  - photos
  - user_status
  - circles
  - contactsinteraction
  - related_resources
  - files_reminders
  - support
  - federation

# --- Mail app provisioning (admin API) — every SSO user gets their mailcow account
#     automatically, logging in with the Dovecot master user: no user ever types a
#     mail password in Nextcloud. Values that are secrets come from Vault.
nextcloud_mail_provisioning_enabled: true
nextcloud_vault_master_path: "{{ platform_env | default('prod') }}/mailcow/master-user"   # login + password (roles/mailcow mints it)
nextcloud_vault_api_token_path: "{{ platform_env | default('prod') }}/nextcloud/api-token" # break-glass admin app password for the admin APIs (minted here once)
nextcloud_mail_host: "{{ groups['mailcow'] | first }}.{{ platform_domain }}"   # asset FQDN (split-DNS → DMZ IP; wildcard cert valid)
nextcloud_mail_provisioning:
  provisioningDomain: "{{ platform_domain }}"
  emailTemplate: "%EMAIL%"          # the account's e-mail (people.yml email = username@domain)
  imapUser: "%EMAIL%*{{ nextcloud_master.login }}"   # Dovecot master-user login form
  imapHost: "{{ nextcloud_mail_host }}"
  imapPort: 993
  imapSslMode: "ssl"
  smtpUser: "%EMAIL%*{{ nextcloud_master.login }}"
  smtpHost: "{{ nextcloud_mail_host }}"
  smtpPort: 587
  smtpSslMode: "tls"
  sieveEnabled: true
  sieveUser: "%EMAIL%*{{ nextcloud_master.login }}"
  sieveHost: "{{ nextcloud_mail_host }}"
  sievePort: 4190
  sieveSslMode: "tls"
  masterPasswordEnabled: true
  masterPassword: "{{ nextcloud_master.password }}"
  ldapAliasesProvisioning: false
  ldapAliasesAttribute: ""

# --- Team bindings (#396 row 9) — everything a group needs, bound to the GROUP so
#     membership follows the SSO `groups` claim (people.yml → Authentik → Nextcloud):
#     a group folder (team drive), a Talk room (listable, group members invited on
#     every run), a shared calendar and a shared address book owned by the
#     break-glass admin and shared read-write with the group.
# Groups Nextcloud must NOT carry any more: created earlier from an Authentik claim
# whose platform group has since been retired (service decommissioned). state absent.
nextcloud_groups_retired:
  - defguard-admins        # Defguard VPN decommissioned 2026-08, replaced by NetBird
# Empty groups that are legitimate (not reported as orphan candidates)
nextcloud_groups_empty_ok: []

nextcloud_team_admin_group: "admin"     # the break-glass admin's group: gets every team folder too (guides, support)
nextcloud_team_bindings:
  - name: company
    group: nextcloud-users          # everyone with Nextcloud access
    folder: "Company"               # group folder mount point
    folder_quota: "500 GB"
    folder_permissions: "read write share delete"
    talk_room: "General"
    calendar: "Company"             # DAV slug = name | lower | regex_replace('[^a-z0-9]+', '-')
    addressbook: "Company"

# Guides published into the team drive (WebDAV as the admin); `<domain>` in the source is
# replaced by platform_domain at upload. The welcome mail links to Company/Guides.
nextcloud_guides:
  - src: "{{ playbook_dir }}/../docs/devices.md"
    dest: "Company/Guides/Devices.md"

# --- Collab backend (#396 phase 2, lxc-collab-01: roles/onlyoffice + roles/nextcloud_collab) ---
# The backend roles mint the shared secrets in Vault; this role only READS them and
# wires Talk (HPB, TURN/STUN, recording), the whiteboard and the ONLYOFFICE connector.
nextcloud_collab_enabled: true
nextcloud_collab_vault_path: "{{ platform_env | default('prod') }}/collab/secrets"
nextcloud_onlyoffice_vault_path: "{{ platform_env | default('prod') }}/onlyoffice/secrets"
nextcloud_onlyoffice_fqdn: "office.{{ platform_domain }}"
nextcloud_collab_talk_host: "talk.{{ platform_domain }}"   # TURN/STUN — public DNS only (no split-DNS override)
nextcloud_collab_turn_public_port: 3479                    # 3478 on the WANs is NetBird's coturn (FW alias port_turn_pub)
nextcloud_collab_signaling_prefix: "/standalone-signaling"
nextcloud_collab_recording_prefix: "/recording"
nextcloud_collab_whiteboard_prefix: "/whiteboard"
