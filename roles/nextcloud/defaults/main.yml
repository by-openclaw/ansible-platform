---
# ==============================================================================
# Role: nextcloud — files / drawio (Docker) on lxc-nextcloud-01 (SVC)
# web + cron containers (same image). Primary storage = Contabo S3 (object
# storage). Uses the shared cluster PostgreSQL (postgres_db: nextcloud) + Redis,
# both over verified TLS. Fronted by Traefik (wildcard TLS). drawio installed as
# a Nextcloud app (diagrams stored as files -> on S3). Upgrade = bump the
# nextcloud_image tag.
# ==============================================================================
nextcloud_image: "nextcloud:33-apache"   # pinned (never :latest)

nextcloud_fqdn: "nextcloud.{{ platform_domain }}"

# Web HTTP backend (Traefik terminates TLS) — published on the SVC IP.
nextcloud_listen_ip: "10.1.3.170"
nextcloud_host_port: 80
nextcloud_container_port: 80

# Traefik is the only reverse proxy in front of Nextcloud (trusted proxy). The
# container's immediate peer is the docker bridge gateway (published-port NAT), so
# that range must ALSO be trusted for Nextcloud to read the X-Forwarded-For chain
# (else "remote address could not be determined" + wrong client IP for bruteforce).
nextcloud_trusted_proxy: "10.1.2.110"
nextcloud_docker_bridge_cidr: "172.17.0.0/16"

# Shared PostgreSQL (DB + role created by the postgres_db role). Nextcloud uses
# libpq; verify-full + CA enforced via config.php dbdriveroptions (the official
# image has no sslmode env).
nextcloud_pg_host: "lxc-pgsql-01.{{ platform_domain }}"
nextcloud_pg_port: 5432
nextcloud_pg_name: "nextcloud"
nextcloud_pg_user: "nextcloud"
nextcloud_pg_sslmode: "verify-full"
nextcloud_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Shared Redis (TLS). The official image's REDIS_HOST env does NOT enable TLS,
# so Redis is configured via a mounted config.php snippet with ssl_context.
nextcloud_redis_host: "lxc-redis-01.{{ platform_domain }}"
nextcloud_redis_port: 6379

# Contabo S3 — PRIMARY object storage (bucket precreated out-of-band).
nextcloud_s3_bucket: "nextcloud-data"
nextcloud_s3_host: "eu2.contabostorage.com"
nextcloud_s3_port: 443
nextcloud_s3_ssl: "true"
nextcloud_s3_region: "eu2"
nextcloud_s3_usepath_style: "true"   # Contabo requires path-style addressing
nextcloud_s3_autocreate: "false"     # we precreate the bucket

# Controller secret store.
nextcloud_secret_dir: "~/.openclaw/workspace/infra/secrets"
nextcloud_secret_file: "fabric/nextcloud.json"                 # admin_user + admin_password
nextcloud_pg_secret_file: "fabric/db-pgsql-nextcloud.json"     # written by postgres_db
nextcloud_redis_secret_file: "fabric/db-redis.json"
nextcloud_s3_secret_file: "fabric/infra-backup-s3-contabo.json"

# Initial local break-glass admin (kept alongside SSO as the break-glass login).
nextcloud_admin_user: "admin"

# Persistent volume (Nextcloud app code + config; USER DATA lives on S3).
nextcloud_app_volume: "nextcloud-app"

# Apps to install/enable after first-run install. user_oidc = Authentik SSO;
# sharebymail = "share by email" (send a password-protected link to an address).
# twofactor_totp kept ENABLED: NC nags either way (delegating MFA to Authentik), and
# "no provider available" reads as a security gap — so keep the provider so the
# break-glass local admin can use 2FA. (NC's "not enforced" note is expected.)
nextcloud_apps:
  - drawio
  - user_oidc
  - sharebymail
  - twofactor_totp

# --- Authentik OIDC SSO (wired only when the client secret file exists) ---------
# Official user_oidc app, configured idempotently via occ. Access is gated
# IdP-side by the nextcloud-admins group (authentik restrict_to_group); groups
# are provisioned into Nextcloud from the `groups` claim.
nextcloud_oidc_secret_file: "fabric/app-oidc-nextcloud.json"
nextcloud_authentik_base: "https://authentik.{{ platform_domain }}"
nextcloud_oidc_app_slug: "nextcloud"
nextcloud_oidc_provider_id: "authentik"

# --- Outbound email (Resend SMTP) -----------------------------------------------
# Same Resend relay the other cluster apps send through (vault/authentik/… —
# verified working). Configured via occ (the official image has no mail_* env).
nextcloud_resend_secret_file: "shared/app-resend-by-research.json"

# --- Sharing policy (public links: expiry + password + share-by-email) ----------
# "share with expiration + password + email" — applied to public link shares.
nextcloud_share_default_expire_days: 1    # default public-link expiry (days) — strict
nextcloud_share_enforce_expire: true      # users cannot exceed/disable the expiry
nextcloud_share_enforce_password: true    # public links must carry a password

# --- Setup-check hardening (admin "Security & setup warnings") -------------------
nextcloud_phone_region: "BE"              # default_phone_region (ISO 3166-1 alpha-2)
nextcloud_maintenance_window_start: 1     # UTC hour for heavy daily jobs (low usage)
nextcloud_serverid: 0                     # serverid (0-511); single-server → 0

# --- Quota (onedrive-like; per-user). Contabo plan 250 GB now → 1 TB later. ------
nextcloud_default_quota: "50 GB"          # applied to new AND existing users

# --- Clean instance (no demo/example content for any user, incl. future) ---------
nextcloud_skeleton_empty: true            # skeletondirectory="" → zero starter files

# Apps disabled to trim the footprint to a focused "files + sharing" instance (no
# OneDrive-everything bloat). KEPT (core): files*, dav (sync clients), user_oidc,
# drawio, sharebymail, viewer/files_pdfviewer, theming, settings, provisioning_api
# (SSO group sync), password_policy/bruteforcesettings (security), serverinfo
# (Monitoring/usage), logreader, updatenotification, activity, text, twofactor_*.
#   app_api / firstrunwizard / survey_client / weather_status / recommendations /
#   nextcloud_announcements  — Ex-Apps daemon, welcome popup, telemetry, widgets
#   dashboard                — the start-page widget board (we open straight to Files)
#   photos                   — photo gallery (images still open in the file viewer)
#   user_status              — presence / status emoji
#   circles                  — Teams (no Talk/Deck here that need it)
#   contactsinteraction / related_resources / files_reminders / support — minor widgets
#   federation               — cross-Nextcloud-server federation (we are standalone;
#                              internal + public-link sharing is unaffected). The
#                              federation *API* apps (federatedfilesharing,
#                              cloud_federation_api, lookup_server_connector) are
#                              forced shipped apps NC refuses to disable — left on,
#                              harmless (no remote federation configured).
nextcloud_apps_disabled:
  - app_api
  - firstrunwizard
  - survey_client
  - weather_status
  - recommendations
  - nextcloud_announcements
  - dashboard
  - photos
  - user_status
  - circles
  - contactsinteraction
  - related_resources
  - files_reminders
  - support
  - federation
