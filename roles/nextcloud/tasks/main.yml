---
# ==============================================================================
# Role: nextcloud — dispatcher
# ==============================================================================
- name: Provision the Nextcloud database
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    postgres_db_vault_path: "{{ platform_env | default('prod') }}/nextcloud/db-pgsql"
    postgres_db_name: "{{ nextcloud_pg_name }}"
    postgres_db_user: "{{ nextcloud_pg_user }}"
  tags: [nextcloud, database]

- name: Resolve / generate Nextcloud secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [nextcloud, secrets]

- name: Run the Nextcloud containers (web + cron)
  ansible.builtin.import_tasks: containers.yml
  tags: [nextcloud, container]

# The 28 occ set-calls cannot report honest per-key change state (occ always
# "sets"), so the block is gated by a fingerprint of every input var: it runs
# fully on first deploy or whenever any input changes, and skips cleanly
# otherwise (F13). Force a full reconverge with:  -e nextcloud_post_force=true
- name: Post-install | Fingerprint the occ inputs
  ansible.builtin.copy:
    dest: /opt/nextcloud/.postinstall-fingerprint
    mode: "0600"
    owner: root
    group: root
    content: >-
      {{ [nextcloud_redis_host, nextcloud_redis_port, nextcloud_redis_password,
          nextcloud_resend | default({}), nextcloud_authentik_base | default(''),
          nextcloud_trusted_proxy | default(''), nextcloud_docker_bridge_cidr | default(''),
          nextcloud_share_default_expire_days | default(''), nextcloud_share_enforce_expire | default(''),
          nextcloud_share_enforce_password | default(''), nextcloud_default_quota | default(''),
          nextcloud_phone_region | default(''), nextcloud_maintenance_window_start | default(''),
          nextcloud_locking | default(''), nextcloud_skeleton_empty | default(''),
          nextcloud_apps_present | default([]), nextcloud_apps_disabled | default([]),
          nextcloud_objectstore | default({}), nextcloud_oidc_app_slug | default(''),
          nextcloud_pg_sslrootcert | default('')] | to_json | hash('sha256') }}
  register: nextcloud_post_fingerprint
  no_log: true
  tags: [nextcloud, post]

- name: Post-install (occ — TLS config, trusted proxy, drawio)
  ansible.builtin.import_tasks: post-install.yml
  when: nextcloud_post_fingerprint.changed or (nextcloud_post_force | default(false) | bool)
  tags: [nextcloud, post]

- name: Publish Nextcloud via Traefik (public + rate-limit)
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: nextcloud
    traefik_route_fqdn: "{{ nextcloud_fqdn }}"
    traefik_route_backend_url: "http://{{ nextcloud_listen_ip }}:{{ nextcloud_host_port }}"
    traefik_route_internal_only: false
  tags: [nextcloud, route]
