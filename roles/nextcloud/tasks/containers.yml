---
# The web and cron containers through the scaffold's containers step (the one owner of
# "run a pinned container"); the install wait and the Up assertion stay below.
- name: "containers | Nextcloud web + cron (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: nextcloud
      containers:
        # First: Docker fills a new volume from the image of the first container that mounts it,
        # and this image owns the socket directory.
        - name: "{{ nextcloud_clamav_container }}"
          image: "{{ nextcloud_clamav_image }}"
          volumes:
            - "{{ nextcloud_clamav_db_volume }}:/var/lib/clamav"
            - "{{ nextcloud_clamav_socket_volume }}:{{ nextcloud_clamav_socket_dir }}"
          env: "{{ nextcloud_clamav_env }}"
        - name: nextcloud
          image: "{{ nextcloud_image }}"
          published:
            - "{{ nextcloud_listen_ip }}:{{ nextcloud_host_port }}:80"
          volumes:
            - "{{ nextcloud_app_volume }}:/var/www/html"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
            - "{{ nextcloud_clamav_socket_volume }}:{{ nextcloud_clamav_socket_dir }}:ro"
          env: "{{ nextcloud_env }}"
        - name: nextcloud-cron
          image: "{{ nextcloud_image }}"
          entrypoint: /cron.sh
          volumes:
            - "{{ nextcloud_app_volume }}:/var/www/html"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
            - "{{ nextcloud_clamav_socket_volume }}:{{ nextcloud_clamav_socket_dir }}:ro"
          env: "{{ nextcloud_env }}"
        # Metrics sidecar: scrapes the serverinfo API through the public FQDN (the only
        # trusted_domain), publishes :{{ nextcloud_metrics_port }} to the monitoring host only.
        - name: nextcloud-exporter
          image: "{{ nextcloud_exporter_image }}"
          read_only: true                 # SEC-22: it writes to its volumes only
          tmpfs: ["/tmp:rw,size=64m"]
          published:
            - "{{ nextcloud_listen_ip }}:{{ nextcloud_metrics_port }}:9205"
          env:
            NEXTCLOUD_SERVER: "https://{{ nextcloud_fqdn }}"
            NEXTCLOUD_AUTH_TOKEN: "{{ nextcloud_serverinfo_token }}"
            NEXTCLOUD_LISTEN_ADDRESS: ":9205"
            NEXTCLOUD_TIMEOUT: "10s"

# First start runs the automated install (creates the schema in the empty
# Postgres DB over libpq TLS + S3 primary wiring) before status.php reports
# installed — retry generously.
- name: "containers | Wait for Nextcloud install to finish"
  ansible.builtin.uri:
    url: "http://{{ nextcloud_listen_ip }}:{{ nextcloud_host_port }}/status.php"
    headers:
      Host: "{{ nextcloud_fqdn }}"
    status_code: 200
    return_content: true
  register: nextcloud_ready
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  retries: 60
  delay: 5
  until:
    - nextcloud_ready.status == 200
    - "'\"installed\":true' in nextcloud_ready.content"
  changed_when: false

# The socket appears once clamd has loaded the signatures. Uploads are refused while the scanner
# cannot be reached, so the antivirus settings in post-install wait for it.
- name: "containers | Wait for the ClamAV socket, seen from Nextcloud"
  community.docker.docker_container_exec:
    container: "{{ nextcloud_container }}"
    argv: [test, -S, "{{ nextcloud_clamav_socket }}"]
  register: nextcloud_clamav_socket_probe
  retries: "{{ nextcloud_clamav_wait_retries }}"
  delay: "{{ nextcloud_clamav_wait_delay }}"
  until: nextcloud_clamav_socket_probe.rc == 0
  changed_when: false
  when: not ansible_check_mode    # under --check the container is not recreated with the volume

- name: "containers | Gather running Nextcloud containers"
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      status: running
  register: nextcloud_running

- name: "containers | Assert both containers are Up"
  ansible.builtin.assert:
    that:
      - "'/nextcloud' in (nextcloud_running.containers | map(attribute='Names') | flatten)"
      - "'/nextcloud-cron' in (nextcloud_running.containers | map(attribute='Names') | flatten)"
    fail_msg: "nextcloud and/or nextcloud-cron are not running"
    success_msg: "nextcloud and nextcloud-cron are both Up"
