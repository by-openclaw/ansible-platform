---
# ==============================================================================
# Role: nextcloud — apps-update.yml: keep the store apps (user_oidc, spreed, mail,
# calendar, contacts, whiteboard, …) at their latest release for the RUNNING
# Nextcloud major. occ app:update never crosses a major, so this is safe on every
# play; majors move through playbooks/nextcloud-upgrade.yml. Drift-gated:
# --showonly lists what would move; pinned apps (nextcloud_apps_pinned) are left
# out — they move through their release tarball only.
# ==============================================================================
- name: "apps | Store updates available (showonly)"
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:update --all --showonly
  register: nextcloud_apps_showonly
  changed_when: false
  check_mode: false

- name: "apps | Apps to update (pinned apps excluded)"
  ansible.builtin.set_fact:
    nextcloud_apps_to_update: >-
      {{ nextcloud_apps_showonly.stdout_lines
         | map('regex_search', '^(\\S+) new version available', '\\1')
         | reject('none') | map('first') | list
         | difference(nextcloud_apps_pinned | default([]) | map(attribute='id') | list) }}

- name: "apps | Update to the latest release for this major"
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:update {{ item }} --no-interaction
  loop: "{{ nextcloud_apps_to_update }}"
  register: nextcloud_apps_update
  changed_when: true

- name: "apps | Report"
  ansible.builtin.debug:
    msg: "{{ (nextcloud_apps_showonly.stdout_lines | select('search', 'new version available') | list) or ['all store apps current'] }}"
