---
# ==============================================================================
# Role: nextcloud — app-pinned.yml: one app from a pinned release tarball.
# Runs only when the installed version differs from the pin (fresh install or
# version move). Fetch on the host → docker cp → unpack as www-data into
# custom_apps → app:enable (fresh) → occ upgrade (migrations on a version move).
# ==============================================================================
- name: "post-install | {{ pinned.id }} | Installed apps"
  ansible.builtin.command:
    cmd: docker exec -u www-data nextcloud php occ app:list --output=json
  register: pinned_list
  changed_when: false
  check_mode: false

- name: "post-install | {{ pinned.id }} | Installed version"
  ansible.builtin.set_fact:
    pinned_current: >-
      {{ ((pinned_list.stdout | from_json).enabled | combine((pinned_list.stdout | from_json).disabled))[pinned.id] | default('') }}

- name: "post-install | {{ pinned.id }} | Install {{ pinned.version }} from the release tarball"
  when: pinned_current != pinned.version
  block:
    - name: "post-install | {{ pinned.id }} | Download the release tarball"
      ansible.builtin.get_url:
        url: "{{ pinned.url }}"
        dest: "/tmp/nc-app-{{ pinned.id }}-{{ pinned.version }}.tar.gz"
        checksum: "{{ pinned.checksum | default(omit) }}"
        mode: "0644"

    # Into the container through the Docker API, then unpacked by the web user with two plain
    # commands (the old code directory away, the new one out of the archive) — no shell in
    # between (infra/0010 §3).
    - name: "post-install | {{ pinned.id }} | Copy the tarball into the container"
      community.docker.docker_container_copy_into:
        container: "{{ nextcloud_container }}"
        path: "/tmp/nc-app-{{ pinned.id }}-{{ pinned.version }}.tar.gz"
        container_path: "/tmp/nc-app-{{ pinned.id }}.tar.gz"
        mode: "0644"
        mode_parse: octal_string_only

    - name: "post-install | {{ pinned.id }} | Remove the app's code directory (as the web user)"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container }}"
        user: "{{ nextcloud_web_user }}"
        argv: [rm, -rf, "{{ nextcloud_custom_apps_dir }}/{{ pinned.id }}"]

    - name: "post-install | {{ pinned.id }} | Unpack the release (as the web user)"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container }}"
        user: "{{ nextcloud_web_user }}"
        argv: [tar, -xzf, "/tmp/nc-app-{{ pinned.id }}.tar.gz", -C, "{{ nextcloud_custom_apps_dir }}"]

    - name: "post-install | {{ pinned.id }} | Remove the container-side tarball"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container }}"
        argv: [rm, -f, "/tmp/nc-app-{{ pinned.id }}.tar.gz"]

    - name: "post-install | {{ pinned.id }} | Enable"
      ansible.builtin.command:
        cmd: docker exec -u www-data nextcloud php occ app:enable {{ pinned.id }}
      changed_when: true

    - name: "post-install | {{ pinned.id }} | Run pending migrations (version move)"
      ansible.builtin.command:
        cmd: docker exec -u www-data nextcloud php occ upgrade --no-interaction
      when: pinned_current | length > 0
      changed_when: true

    - name: "post-install | {{ pinned.id }} | Remove the host-side tarball"
      ansible.builtin.file:
        path: "/tmp/nc-app-{{ pinned.id }}-{{ pinned.version }}.tar.gz"
        state: absent
