---
# Nextcloud local break-glass admin creds: reuse the controller secret if present,
# else generate + persist. DB / Redis / S3 credentials are loaded from their own
# secret files. All facts no_log.
- name: "secrets | Stat nextcloud secret on controller"
  ansible.builtin.stat:
    path: "{{ nextcloud_secret_dir }}/{{ nextcloud_secret_file }}"
  delegate_to: localhost
  become: false
  register: nextcloud_secret_stat

- name: "secrets | Load existing nextcloud secrets"
  ansible.builtin.set_fact:
    nextcloud_secrets: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_secret_file) | from_json).fields }}"
  no_log: true
  when: nextcloud_secret_stat.stat.exists

- name: "secrets | Generate nextcloud secrets"
  ansible.builtin.set_fact:
    nextcloud_secrets:
      admin_user: "{{ nextcloud_admin_user }}"
      admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
  no_log: true
  when: not nextcloud_secret_stat.stat.exists

- name: "secrets | Persist nextcloud secret (0600)"
  ansible.builtin.copy:
    dest: "{{ nextcloud_secret_dir }}/{{ nextcloud_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (nextcloud_secrets | combine({'url': 'https://' + nextcloud_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not nextcloud_secret_stat.stat.exists

- name: "secrets | Load the PostgreSQL password"
  ansible.builtin.set_fact:
    nextcloud_pg_password: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_pg_secret_file) | from_json).fields.password }}"
  no_log: true

- name: "secrets | Load the Redis password"
  ansible.builtin.set_fact:
    nextcloud_redis_password: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_redis_secret_file) | from_json).fields.password }}"
  no_log: true

- name: "secrets | Load the Contabo S3 credentials"
  ansible.builtin.set_fact:
    nextcloud_s3_creds: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_s3_secret_file) | from_json).fields }}"
  no_log: true

# Authentik OIDC client id/secret — consumed by post-install (user_oidc) only
# when the SSO phase has provisioned the file on the controller.
- name: "secrets | Stat the nextcloud OIDC secret on controller"
  ansible.builtin.stat:
    path: "{{ nextcloud_secret_dir }}/{{ nextcloud_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: nextcloud_oidc_stat

- name: "secrets | Load the nextcloud OIDC client id and secret"
  ansible.builtin.set_fact:
    nextcloud_oidc: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_oidc_secret_file) | from_json).fields }}"
  no_log: true
  when: nextcloud_oidc_stat.stat.exists

# Resend SMTP credentials — same relay as the other cluster apps. Consumed by
# post-install (occ mail_* config). Absent file = SMTP config is skipped.
- name: "secrets | Stat the Resend SMTP secret on controller"
  ansible.builtin.stat:
    path: "{{ nextcloud_secret_dir }}/{{ nextcloud_resend_secret_file }}"
  delegate_to: localhost
  become: false
  register: nextcloud_resend_stat

- name: "secrets | Load the Resend SMTP credentials"
  ansible.builtin.set_fact:
    nextcloud_resend: "{{ (lookup('file', nextcloud_secret_dir + '/' + nextcloud_resend_secret_file) | from_json).fields }}"
  no_log: true
  when: nextcloud_resend_stat.stat.exists

# Nextcloud official image: PostgreSQL TLS sslmode is NOT settable via env, and
# Redis TLS is NOT settable via REDIS_HOST env. Both are enforced post-install in
# config.php. The env here drives the FIRST-RUN automated install + S3 primary.
- name: "secrets | Build the Nextcloud environment"
  ansible.builtin.set_fact:
    nextcloud_env:
      # PostgreSQL. TLS via libpq env (verify-full + CA) — the official image has
      # no sslmode env and the PDO dbdriveroptions path is unreliable, but libpq
      # honours PGSSLMODE / PGSSLROOTCERT for every connection.
      POSTGRES_HOST: "{{ nextcloud_pg_host }}"
      POSTGRES_DB: "{{ nextcloud_pg_name }}"
      POSTGRES_USER: "{{ nextcloud_pg_user }}"
      POSTGRES_PASSWORD: "{{ nextcloud_pg_password }}"
      PGSSLMODE: "{{ nextcloud_pg_sslmode }}"
      PGSSLROOTCERT: "{{ nextcloud_pg_sslrootcert }}"
      # Server uses password auth (no client certs). Point libpq's optional
      # client cert/key at a non-existent path so it does not try to read the
      # default ~/.postgresql/postgresql.crt (HOME=/root in the image -> EACCES
      # for the www-data process).
      PGSSLCERT: "/nonexistent/postgresql.crt"
      PGSSLKEY: "/nonexistent/postgresql.key"
      # Redis (plaintext env disabled — TLS Redis wired in config.php post-install).
      # Contabo S3 — PRIMARY object storage.
      OBJECTSTORE_S3_BUCKET: "{{ nextcloud_s3_bucket }}"
      OBJECTSTORE_S3_HOST: "{{ nextcloud_s3_host }}"
      OBJECTSTORE_S3_PORT: "{{ nextcloud_s3_port | string }}"
      OBJECTSTORE_S3_SSL: "{{ nextcloud_s3_ssl }}"
      OBJECTSTORE_S3_REGION: "{{ nextcloud_s3_region }}"
      OBJECTSTORE_S3_KEY: "{{ nextcloud_s3_creds.access_key }}"
      OBJECTSTORE_S3_SECRET: "{{ nextcloud_s3_creds.secret_key }}"
      OBJECTSTORE_S3_USEPATH_STYLE: "{{ nextcloud_s3_usepath_style }}"
      OBJECTSTORE_S3_AUTOCREATE: "{{ nextcloud_s3_autocreate }}"
      # Local break-glass admin (SSO via Authentik wired later).
      NEXTCLOUD_ADMIN_USER: "{{ nextcloud_secrets.admin_user }}"
      NEXTCLOUD_ADMIN_PASSWORD: "{{ nextcloud_secrets.admin_password }}"
      NEXTCLOUD_TRUSTED_DOMAINS: "{{ nextcloud_fqdn }}"
      # Behind Traefik (TLS terminated at the edge).
      OVERWRITEPROTOCOL: "https"
      OVERWRITEHOST: "{{ nextcloud_fqdn }}"
      OVERWRITECLIURL: "https://{{ nextcloud_fqdn }}"
      TRUSTED_PROXIES: "{{ nextcloud_trusted_proxy }}"
  no_log: true
