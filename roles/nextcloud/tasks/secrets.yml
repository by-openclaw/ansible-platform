---
# Nextcloud secrets — Vault-native (no controller files). Every read goes through
# the `vault_secret` role (deploy AppRole). Producers: postgres_db (db-pgsql, Vault
# mode), roles/authentik (oidc, Vault-native app), roles/redis (redis/admin),
# platform backup creds (backup/s3-contabo). The local break-glass admin is
# get-or-create here. All facts no_log.
- name: "secrets | Break-glass admin (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_admin_path }}"
    vault_secret_init:
      admin_user: "{{ nextcloud_admin_user }}"
      admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
      url: "https://{{ nextcloud_fqdn }}"

- name: "secrets | Bind the break-glass admin"
  ansible.builtin.set_fact:
    nextcloud_secrets: "{{ vault_secret_result }}"
  no_log: true

- name: "secrets | Read the PostgreSQL password (minted by postgres_db)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_db_path }}"
    vault_secret_init: {}

- name: "secrets | Bind the PostgreSQL password"
  ansible.builtin.set_fact:
    nextcloud_pg_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "secrets | Read the Redis password (owner: roles/redis)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_redis_path }}"
    vault_secret_init: {}

- name: "secrets | Bind the Redis password"
  ansible.builtin.set_fact:
    nextcloud_redis_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "secrets | Read the Contabo S3 credentials (primary storage until the SeaweedFS move)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_s3_path }}"
    vault_secret_init: {}

- name: "secrets | Bind the Contabo S3 credentials"
  ansible.builtin.set_fact:
    nextcloud_s3_creds: "{{ vault_secret_result }}"
  no_log: true

# Authentik OIDC client id/secret — minted by roles/authentik (run it first on a
# fresh environment); consumed by post-install (user_oidc).
- name: "secrets | Read the Authentik OIDC client creds (minted by roles/authentik)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_oidc_path }}"
    vault_secret_init: {}

- name: "secrets | Bind the OIDC client creds"
  ansible.builtin.set_fact:
    nextcloud_oidc: "{{ vault_secret_result }}"
  no_log: true

# Own mail flow: the nextcloud@ service mailbox (mailbox concern-role), NOT
# Resend. Consumed by post-install (occ mail_* config).
- name: "secrets | Read the nextcloud mailbox creds from Vault (read-only)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ platform_env | default('prod') }}/mail/nextcloud"
    vault_secret_init: {}          # the mailbox role mints these

- name: "secrets | Assemble the SMTP settings (our Mailcow, asset FQDN)"
  ansible.builtin.set_fact:
    nextcloud_mail:
      smtp_host: "vm-mailcow-01.{{ platform_domain }}"
      smtp_port: 587
      smtp_username: "{{ vault_secret_result.address }}"
      smtp_password: "{{ vault_secret_result.password }}"
      from_address: "{{ vault_secret_result.address }}"
  no_log: true

# Nextcloud official image: PostgreSQL TLS sslmode is NOT settable via env, and
# Redis TLS is NOT settable via REDIS_HOST env. Both are enforced post-install in
# config.php. The env here drives the FIRST-RUN automated install + S3 primary.
- name: "secrets | Build the Nextcloud environment"
  ansible.builtin.set_fact:
    nextcloud_env:
      # PostgreSQL. TLS via libpq env (verify-full + CA) — the official image has
      # no sslmode env and the PDO dbdriveroptions path is unreliable, but libpq
      # honours PGSSLMODE / PGSSLROOTCERT for every connection.
      POSTGRES_HOST: "{{ nextcloud_pg_host }}"
      POSTGRES_DB: "{{ nextcloud_pg_name }}"
      POSTGRES_USER: "{{ nextcloud_pg_user }}"
      POSTGRES_PASSWORD: "{{ nextcloud_pg_password }}"
      PGSSLMODE: "{{ nextcloud_pg_sslmode }}"
      PGSSLROOTCERT: "{{ nextcloud_pg_sslrootcert }}"
      # Server uses password auth (no client certs). Point libpq's optional
      # client cert/key at a non-existent path so it does not try to read the
      # default ~/.postgresql/postgresql.crt (HOME=/root in the image -> EACCES
      # for the www-data process).
      PGSSLCERT: "/nonexistent/postgresql.crt"
      PGSSLKEY: "/nonexistent/postgresql.key"
      # Redis (plaintext env disabled — TLS Redis wired in config.php post-install).
      # Contabo S3 — PRIMARY object storage.
      OBJECTSTORE_S3_BUCKET: "{{ nextcloud_s3_bucket }}"
      OBJECTSTORE_S3_HOST: "{{ nextcloud_s3_host }}"
      OBJECTSTORE_S3_PORT: "{{ nextcloud_s3_port | string }}"
      OBJECTSTORE_S3_SSL: "{{ nextcloud_s3_ssl }}"
      OBJECTSTORE_S3_REGION: "{{ nextcloud_s3_region }}"
      OBJECTSTORE_S3_KEY: "{{ nextcloud_s3_creds.access_key }}"
      OBJECTSTORE_S3_SECRET: "{{ nextcloud_s3_creds.secret_key }}"
      OBJECTSTORE_S3_USEPATH_STYLE: "{{ nextcloud_s3_usepath_style }}"
      OBJECTSTORE_S3_AUTOCREATE: "{{ nextcloud_s3_autocreate }}"
      # Local break-glass admin (SSO via Authentik wired later).
      NEXTCLOUD_ADMIN_USER: "{{ nextcloud_secrets.admin_user }}"
      NEXTCLOUD_ADMIN_PASSWORD: "{{ nextcloud_secrets.admin_password }}"
      NEXTCLOUD_TRUSTED_DOMAINS: "{{ nextcloud_fqdn }}"
      # Behind Traefik (TLS terminated at the edge).
      OVERWRITEPROTOCOL: "https"
      OVERWRITEHOST: "{{ nextcloud_fqdn }}"
      OVERWRITECLIURL: "https://{{ nextcloud_fqdn }}"
      TRUSTED_PROXIES: "{{ nextcloud_trusted_proxy }}"
  no_log: true
