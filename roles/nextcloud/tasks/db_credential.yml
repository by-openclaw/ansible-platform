---
# DB password rotation (SVC-28/SEC-09): config.php owns dbpassword after the first-run install —
# the env var no longer applies (learned 2026-09-02: a rotation left config.php stale and
# Nextcloud answered 500 until fixed). The current credential goes into a config fragment:
# Nextcloud loads config/*.config.php after config.php and the later file wins, so a rotation needs
# only this file — and no `occ`, which cannot start while the password it holds is wrong.
#
# Nextcloud refuses EVERY request when it cannot open one of its config files (2026-10-06: this
# file written with an unreadable mode took the service down for 20 minutes). So: the mode is
# given as an octal string and parsed as one, the file is checked right after it is written, and
# a file Nextcloud cannot work with is withdrawn at once.
- name: "db credential | Write, check, withdraw on failure"
  block:
    - name: "db credential | The fragment (wins over config.php)"
      community.docker.docker_container_copy_into:
        container: "{{ nextcloud_container }}"
        container_path: "{{ nextcloud_config_dir }}/{{ nextcloud_db_fragment }}"
        content: "{{ nextcloud_db_fragment_content }}"
        owner_id: "{{ nextcloud_web_uid }}"
        group_id: "{{ nextcloud_web_gid }}"
        mode: "{{ nextcloud_db_fragment_mode }}"
        mode_parse: octal_string_only   # the default reads "0640" as the DECIMAL number 640
      register: nextcloud_db_fragment_write
      no_log: true

    - name: "db credential | Nextcloud still reads its configuration (as the web user)"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container }}"
        user: "{{ nextcloud_web_uid }}"
        argv: [php, occ, status, --output=json]
      register: nextcloud_db_fragment_check
      changed_when: false
      failed_when: >-
        nextcloud_db_fragment_check.rc != 0
        or not ((nextcloud_db_fragment_check.stdout | default('{}', true) | from_json).installed | default(false))
      when: nextcloud_db_fragment_write is changed
  rescue:
    - name: "db credential | Withdraw the fragment (Nextcloud could not work with it)"
      community.docker.docker_container_exec:
        container: "{{ nextcloud_container }}"
        argv: [rm, -f, "{{ nextcloud_config_dir }}/{{ nextcloud_db_fragment }}"]

    - name: "db credential | Stop here"
      ansible.builtin.fail:
        msg: >-
          The database credential fragment was written, Nextcloud could not read its configuration
          with it, and the fragment was withdrawn: the service runs on config.php as before.
