---
# ==============================================================================
# Role: nextcloud — Mail app provisioning through the app's admin API.
# One provisioning config per platform domain: every user gets a Mail account for
# their own address on mailcow, authenticated with the Dovecot MASTER user
# (`<mailbox>*<master login>` + master password), so nobody types a mail password.
# Idempotent: GET → compare the visible fields → POST/PUT only on drift → then
# "provision all" so existing users get their account immediately.
# Admin API auth = the break-glass admin + an app password minted ONCE with occ and
# kept in Vault (prod/nextcloud/api-token). Nothing on disk.
# ==============================================================================
- name: "mail | Read the Dovecot master user (Vault, minted by roles/mailcow)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ nextcloud_vault_master_path }}"
    vault_secret_init: {}

- name: "mail | Bind the master user"
  ansible.builtin.set_fact:
    nextcloud_master: "{{ vault_secret_result }}"
  no_log: true

- name: "mail | Admin API credentials (Vault-held app password)"
  ansible.builtin.import_tasks: admin-api-token.yml

# --- desired vs current -----------------------------------------------------------
- name: "mail | Current provisioning configs"
  ansible.builtin.uri:
    url: "https://{{ nextcloud_fqdn }}/apps/mail/api/settings/provisioning"
    url_username: "{{ nextcloud_api_auth.user }}"
    url_password: "{{ nextcloud_api_auth.token }}"
    force_basic_auth: true
    headers: { OCS-APIRequest: "true", Accept: "application/json" }
    return_content: true
    status_code: [200]
  register: nextcloud_mail_prov_cur
  check_mode: false
  no_log: true

- name: "mail | Match the config for {{ platform_domain }}"
  ansible.builtin.set_fact:
    nextcloud_mail_prov_existing: >-
      {{ (nextcloud_mail_prov_cur.json | default([]))
         | selectattr('provisioningDomain', 'equalto', nextcloud_mail_provisioning.provisioningDomain) | list | first | default({}) }}
  no_log: true

- name: "mail | Drift on the visible fields (masterPassword is write-only)"
  ansible.builtin.set_fact:
    nextcloud_mail_prov_diff_keys: >-
      {%- set ns = namespace(diff=[]) -%}
      {%- for k, v in nextcloud_mail_provisioning.items() if k != 'masterPassword' -%}
        {%- if (nextcloud_mail_prov_existing.get(k) | default('', true) | string | lower) != (v | default('', true) | string | lower) -%}
          {%- set ns.diff = ns.diff + [k] -%}
        {%- endif -%}
      {%- endfor -%}
      {{ ns.diff }}
  no_log: true

- name: "mail | Drift verdict"
  ansible.builtin.set_fact:
    nextcloud_mail_prov_drift: "{{ nextcloud_mail_prov_existing | length == 0 or (nextcloud_mail_prov_diff_keys | length > 0) }}"

- name: "mail | Create the provisioning config"
  ansible.builtin.uri:
    url: "https://{{ nextcloud_fqdn }}/apps/mail/api/settings/provisioning"
    method: POST
    url_username: "{{ nextcloud_api_auth.user }}"
    url_password: "{{ nextcloud_api_auth.token }}"
    force_basic_auth: true
    headers: { OCS-APIRequest: "true", Accept: "application/json" }
    body_format: json
    body: { data: "{{ nextcloud_mail_provisioning }}" }
    status_code: [200]
  when: nextcloud_mail_prov_existing | length == 0
  register: nextcloud_mail_prov_create
  changed_when: true
  no_log: true

- name: "mail | Update the provisioning config"
  ansible.builtin.uri:
    url: "https://{{ nextcloud_fqdn }}/apps/mail/api/settings/provisioning/{{ nextcloud_mail_prov_existing.id }}"
    method: PUT
    url_username: "{{ nextcloud_api_auth.user }}"
    url_password: "{{ nextcloud_api_auth.token }}"
    force_basic_auth: true
    headers: { OCS-APIRequest: "true", Accept: "application/json" }
    body_format: json
    body: { data: "{{ nextcloud_mail_provisioning }}" }
    status_code: [200]
  when:
    - nextcloud_mail_prov_existing | length > 0
    - nextcloud_mail_prov_drift | bool
  register: nextcloud_mail_prov_update
  changed_when: true
  no_log: true

# The app also provisions each user at login; this applies the config to existing
# users right away. Runs after a create/update, or on demand with
# -e nextcloud_mail_provision_force=true.
- name: "mail | Provision all users now"
  ansible.builtin.uri:
    url: "https://{{ nextcloud_fqdn }}/apps/mail/api/settings/provisioning/all"
    method: PUT
    url_username: "{{ nextcloud_api_auth.user }}"
    url_password: "{{ nextcloud_api_auth.token }}"
    force_basic_auth: true
    headers: { OCS-APIRequest: "true", Accept: "application/json" }
    status_code: [200]
  when: >-
    (nextcloud_mail_prov_create is changed) or (nextcloud_mail_prov_update is changed)
    or (nextcloud_mail_provision_force | default(false) | bool)
  changed_when: true
  no_log: true
