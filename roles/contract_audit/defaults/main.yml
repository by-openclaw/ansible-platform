---
# ==============================================================================
# Role: contract_audit — idempotent, READ-ONLY compliance audit of each host
# against the ADR contract (docs/audits/adr-compliance-checklist.md). It runs
# probes and scores PASS/FAIL/SKIP per check ID; it changes NOTHING (every task
# is changed_when:false), so it is idempotent by construction. Set
# contract_audit_enforce=true to make the play FAIL on any FAIL (CI gate).
#
# Each check:
#   id      stable ADR check ID (NAM-17, SEC-25a, ...)
#   desc    one-line human description
#   probe   shell run on the target host (stdout is matched)
#   expect  regex the probe stdout MUST match to PASS (case-insensitive)
#   groups  optional list of inventory groups the check applies to; omitted or
#           ['all'] = every audited host. A host not in `groups` -> SKIP.
#   absent  optional: PASS when `expect` is NOT found (invert), for "must not"
# Add a requirement = add a row here. Non-automatable ADR clauses stay in the
# checklist doc for manual review; this role covers the machine-checkable ones.
# ==============================================================================

contract_audit_enforce: false          # true = fail the play on any FAIL (gate)

contract_audit_checks:
  # --- logging (infra/0006) ---------------------------------------------------
  - id: INF-27
    desc: "Promtail agent running (every host)"
    probe: "systemctl is-active promtail 2>/dev/null || echo inactive"
    expect: "^active$"

  - id: SEC-23
    desc: "auditd enabled (audit trail — VMs; kernel audit is host-scoped, N/A in LXC)"
    probe: "systemctl is-active auditd 2>/dev/null || echo inactive"
    expect: "^active$"
    groups: ["adguard", "mailcow", "gitlab_runner", "pbs"]

  # --- hardening / SSH (security/0003 §9, identity/0004 §5) --------------------
  - id: SEC-25a
    desc: "sshd listens on port 22222"
    probe: "sshd -T 2>/dev/null | awk '/^port /{print}'"
    expect: "port 22222"

  - id: SEC-25b
    desc: "sshd PermitRootLogin no (PVE break-glass carve-out excepted)"
    probe: "sshd -T 2>/dev/null | awk '/^permitrootlogin /{print}'"
    expect: "permitrootlogin no"
    groups: ["cluster", "adguard", "mailcow", "gitlab_runner"]

  - id: IDN-29
    desc: "sshd PasswordAuthentication no (global)"
    probe: "sshd -T 2>/dev/null | awk '/^passwordauthentication /{print}'"
    expect: "passwordauthentication no"

  - id: SEC-25c
    desc: "fail2ban active"
    probe: "systemctl is-active fail2ban 2>/dev/null || echo inactive"
    expect: "^active$"

  - id: SEC-20
    desc: "Lynis hardening index >= the host's gate (default 80; documented exceptions via hardening_lynis_min_score)"
    probe: >-
      for i in $(seq 1 24); do pgrep -x lynis >/dev/null || break; sleep 5; done;
      awk -F= -v MIN={{ hardening_lynis_min_score | default(80) }}
      '/hardening_index/{print ($2>=MIN)?"PASS":"FAIL "$2}'
      /var/log/lynis-report.dat 2>/dev/null | head -1 || echo NOREPORT
    expect: "^PASS$"
  - id: SEC-21
    desc: "Host firewall (ufw) installed, active AND its chains loaded (policy DROP without chains = self-lockout)"
    probe: >-
      ufw status 2>/dev/null | head -1 | grep -q '^Status: active$'
      && iptables -S INPUT 2>/dev/null | grep -q -- '-j ufw-before-input' && echo PASS || echo FAIL
    expect: "^PASS$"
    groups: ["cluster", "adguard", "mailcow", "gitlab_runner", "pbs", "k3s"]


  # --- identity naming (naming/0002 §3) — no human/non-svc login accounts -----
  - id: NAM-15
    desc: "No ad-hoc human login accounts (uid>=1000) beyond by-research + svc-*"
    probe: >-
      awk -F: '$3>=1000 && $3<65534 && $1!="nobody" && $7!~/(nologin|false)$/{print $1}' /etc/passwd
      | grep -vE '^(by-research|svc-[a-z0-9-]+)$' | tr '\n' ' ' || true
    expect: "^\\s*$"

  # SEC-30 (step-ca root CA in every trust store) is deferred to v2 — step-ca is
  # parked (P5); internal TLS currently rides the publicly-trusted LE wildcard,
  # so the check would be noise until step-ca is deployed.

# Per-service checks (only run on the owning group) — extend freely.
contract_audit_service_checks:
  - id: SVC-62
    desc: "GitLab DB connection uses sslmode=verify-full"
    probe: "grep -h db_sslmode /etc/gitlab/gitlab.rb 2>/dev/null || echo none"
    expect: "verify-full"
    groups: ["gitlab"]

  - id: SVC-28a
    desc: "NetBox DB connection sslmode=verify-full"
    probe: "docker exec netbox env 2>/dev/null | grep -o 'DB_SSLMODE=verify-full' || echo none"
    expect: "verify-full"
    groups: ["netbox"]

  - id: SVC-28b
    desc: "Nextcloud PG sslmode=verify-full (env)"
    probe: "docker exec nextcloud env 2>/dev/null | grep -o 'PGSSLMODE=verify-full' || echo none"
    expect: "verify-full"
    groups: ["nextcloud"]

  - id: SVC-28c
    desc: "Grafana DB ssl_mode=verify-full"
    probe: "grep -E '^ssl_mode' /etc/grafana/grafana.ini 2>/dev/null || echo none"
    expect: "verify-full"
    groups: ["monitoring"]

  - id: SVC-62a
    desc: "Harbor external DB ssl_mode=verify-full"
    probe: "grep -E 'ssl_mode' /opt/harbor/harbor.yml 2>/dev/null | head -1 || echo none"
    expect: "verify-full"
    groups: ["harbor"]

  - id: SVC-28d
    desc: "Vaultwarden DATABASE_URL sslmode=verify-full"
    probe: "docker exec vaultwarden env 2>/dev/null | grep -o 'sslmode=verify-full' || echo none"
    expect: "verify-full"
    groups: ["vaultwarden"]

  - id: IDN-20-vw
    desc: "Vaultwarden native SSO enabled, signups closed"
    probe: "docker exec vaultwarden env 2>/dev/null | grep -cE 'SSO_ENABLED=true|SIGNUPS_ALLOWED=false' || echo 0"
    expect: "^2$"
    groups: ["vaultwarden"]

  - id: SEC-33-runner
    desc: "GitLab runner docker executor is NOT privileged"
    probe: "grep -c 'privileged = false' /etc/gitlab-runner/config.toml 2>/dev/null || echo 0"
    expect: "^[1-9]"
    groups: ["gitlab_runner"]

  - id: DOCKER-ONE-ENGINE
    desc: "exactly one container engine installed (docker.io XOR docker-ce) — #454"
    probe: "dpkg-query -W -f='${Package} ${Status}\n' docker.io docker-ce 2>/dev/null | grep -c 'install ok installed'"
    expect: "^1$"
    groups: ["docker_hosts"]
  - id: SVC-PORTAINER
    desc: "Portainer console API answering on its own guest"
    probe: "curl -s -o /dev/null -w '%{http_code}' -m5 http://{{ ansible_host }}:9000/api/status || echo 000"
    expect: "^200$"
    groups: ["portainer"]

  - id: SVC-WAZUH
    desc: "Wazuh manager API + dashboard answering on the security-monitoring guest"
    probe: >-
      curl -sk -o /dev/null -w '%{http_code}' -m5 https://127.0.0.1:55000/ ; curl -s -o /dev/null -w ' %{http_code}' -m5
      http://{{ ansible_host }}:5601/api/status
    expect: "^(200|401) (200|302|401)$"
    groups: ["wazuh"]

  - id: SVC-WAZUH-AGENT
    desc: "Wazuh agent running and connected (every guest)"
    probe: "/var/ossec/bin/wazuh-control status 2>/dev/null | grep -c 'wazuh-agentd is running' || echo 0"
    expect: "^1$"
    groups: ["cluster", "adguard", "mailcow", "pbs", "monitoring", "k3s", "gitlab_runner"]

  - id: SVC-STEPCA
    desc: "step-ca internal CA health endpoint answering"
    probe: "curl -sk -o /dev/null -w '%{http_code}' -m5 https://127.0.0.1:9000/health || echo 000"
    expect: "^200$"
    groups: ["step_ca"]

  - id: SVC-VERD
    desc: "Verdaccio npm registry answering /-/ping"
    probe: "curl -s -o /dev/null -w '%{http_code}' -m5 http://127.0.0.1:4873/-/ping || echo 000"
    expect: "^200$"
    groups: ["verdaccio"]

  - id: NAM-17-nb
    desc: "NetBird API principal is a svc-{function}-{env} service user"
    probe: >-
      grep -o 'svc-netbird-[a-z]*'
      {{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/fabric/netbird-automation.json 2>/dev/null
      | head -1 || echo none
    expect: "svc-netbird-"
    groups: ["netbird"]
    delegate_localhost: true

  # --- hypervisor (roles/pve_host) -----------------------------------------------
  - id: NODE-01
    desc: "Proxmox firewall enabled and running (the node's host firewall; ufw stays off on nodes)"
    probe: "pve-firewall status 2>/dev/null | head -1"
    expect: "^Status: enabled/running$"
    groups: ["proxmox_nodes"]
  - id: NODE-07
    desc: "Node routes the guest zones via the prod firewall's OOB leg (replies must not leave by the OOB default gateway)"
    probe: "ip route show 10.1.0.0/16 | grep -q via && echo PASS || echo FAIL"
    expect: "^PASS$"
    groups: ["proxmox_nodes"]
  - id: NODE-06
    desc: "Netfilter modules for the guests preloaded on the host (xt_recent, xt_limit, ip6t_rt … — ufw in unprivileged LXCs)"
    probe: "for m in xt_recent xt_limit xt_LOG xt_conntrack xt_hl ip6t_rt nft_compat; do lsmod | grep -q \"^$m \" || echo missing:$m; done; echo done"
    expect: "^done$"
    groups: ["proxmox_nodes"]
  - id: NODE-05
    desc: "No ufw on the node (the Proxmox firewall is the only host firewall)"
    probe: "command -v ufw >/dev/null && echo present || echo absent"
    expect: "^absent$"
    groups: ["proxmox_nodes"]
  - id: NODE-02
    desc: "Apt sources as code: deb822 Proxmox file present, no enterprise leftovers"
    probe: "[ -f /etc/apt/sources.list.d/proxmox.sources ] && ! ls /etc/apt/sources.list.d/ | grep -qE '^pve-enterprise' && echo PASS || echo FAIL"
    expect: "^PASS$"
    groups: ["proxmox_nodes"]
  - id: NODE-03
    desc: "node_exporter active on the hypervisor (Prometheus scrapes it)"
    probe: "systemctl is-active prometheus-node-exporter node_exporter 2>/dev/null | grep -m1 active || echo inactive"
    expect: "^active$"
    groups: ["proxmox_nodes"]
  - id: NODE-04
    desc: "Datacenter notification sender is the platform alerts address"
    probe: "pvesh get /cluster/options --output-format json 2>/dev/null | python3 -c 'import sys,json; print(json.load(sys.stdin).get(\"email_from\",\"\"))'"
    expect: "^alerts@{{ platform_domain | regex_escape }}$"
    groups: ["proxmox_nodes"]
