---
# Idempotent, read-only compliance audit. Every task is changed_when:false —
# this role never mutates a host and runs no shell. It scores each check PASS/FAIL/SKIP and, when
# contract_audit_enforce is true, fails the play if any check FAILs.

# NAM-17-nb needs the NetBird API principal's name, which lives in Vault. Read
# once for the play, only when a NetBird host is in it; bind the NAME only.
- name: "Contract-audit | NetBird API principal (Vault, once)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ platform_env }}/netbird/automation"
    vault_secret_optional: true
  run_once: true
  when: (groups['netbird'] | default([]) | intersect(ansible_play_hosts)) | length > 0

- name: "Contract-audit | Bind the principal name on every host"
  ansible.builtin.set_fact:
    contract_audit_netbird_principal: "{{ (vault_secret_result | default({})).service_user | default('none') }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts }}"
  run_once: true

# NAM-15 reads the local accounts (/etc/passwd only, as before: no directory lookups).
- name: "Contract-audit | Local accounts"
  ansible.builtin.getent:
    database: passwd
    service: files
  check_mode: false  # read-only: must run under --check too (the scorecard reads it)

# SEC-20 reads Lynis's report; a run in progress rewrites it.
- name: "Contract-audit | Wait for a Lynis run in progress to end"
  ansible.builtin.command:
    argv: [pgrep, -x, lynis]
  register: contract_audit_lynis_running
  until: contract_audit_lynis_running.rc | default(1) != 0
  retries: "{{ contract_audit_lynis_wait_retries }}"
  delay: "{{ contract_audit_lynis_wait_delay }}"
  check_mode: false  # read-only probe
  changed_when: false
  failed_when: false

# One task per kind of probe; each probe reads one thing (no shell, no pipe). A probe that
# cannot run (no such command, no such file, no answer) is not an error here: it reads as ''
# and the check fails on its own terms.
- name: "Contract-audit | Command probes (read-only)"
  ansible.builtin.command:
    argv: "{{ item.argv }}"
  loop: "{{ contract_audit_probe_list | selectattr('argv', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: contract_audit_cmd
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: "{{ item.sensitive | default(false) }}"

- name: "Contract-audit | URL probes (read-only)"
  ansible.builtin.uri:
    url: "{{ item.url }}"
    return_content: "{{ (item.read | default('status')) == 'content' }}"
    validate_certs: "{{ item.validate_certs | default(true) }}"
    follow_redirects: none
    timeout: "{{ item.timeout | default(contract_audit_url_timeout) }}"
  loop: "{{ contract_audit_probe_list | selectattr('url', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: contract_audit_url
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: "{{ item.sensitive | default(false) }}"

- name: "Contract-audit | File probes (read-only)"
  ansible.builtin.slurp:
    src: "{{ item.file }}"
  loop: "{{ contract_audit_probe_list | selectattr('file', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }}"
  register: contract_audit_file
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: "{{ item.sensitive | default(false) }}"

- name: "Contract-audit | Build the scorecard"
  ansible.builtin.set_fact:
    contract_audit_scorecard: "{{ contract_audit_scorecard_built }}"

- name: "Contract-audit | Per-host report"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}:
      PASS={{ contract_audit_scorecard | selectattr('status', 'equalto', 'PASS') | list | length }}
      FAIL={{ contract_audit_scorecard | selectattr('status', 'equalto', 'FAIL') | list | length }}
      SKIP={{ contract_audit_scorecard | selectattr('status', 'equalto', 'SKIP') | list | length }}
      :: fails=[{{ contract_audit_scorecard | selectattr('status', 'equalto', 'FAIL') | map(attribute='id') | join(', ') }}]

- name: "Contract-audit | Enforce (fail the play on any FAIL)"
  ansible.builtin.assert:
    that: (contract_audit_scorecard | selectattr('status', 'equalto', 'FAIL') | list | length) == 0
    fail_msg: >-
      Contract violations on {{ inventory_hostname }}:
      {{ contract_audit_scorecard | selectattr('status', 'equalto', 'FAIL')
         | map(attribute='id') | join(', ') }}
    success_msg: "{{ inventory_hostname }} — all applicable contract checks PASS"
  when: contract_audit_enforce | bool
