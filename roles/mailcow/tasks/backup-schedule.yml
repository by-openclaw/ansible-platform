---
# Daily APP-CONSISTENT snapshot on the host (mailcow's own helper), landing in
# {{ mailcow_backup_dir }} BEFORE the nightly PBS run picks up the VM — same
# pattern as pg-backup (no secrets on the host; the S3+offsite copies stay with
# the on-demand `--tags backup` play / continuous filer.backup). roles/host_job
# owns the unit and timer, so a failed run reaches the alert mail (OnFailure=).
- name: "backup-schedule | Daily mailcow backup (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: mailcow-backup
    host_job_on_calendar: "{{ mailcow_backup_on_calendar }}"
    host_job_randomized_delay: "300"
    host_job_workdir: "{{ mailcow_install_dir }}"
    host_job_environment:
      MAILCOW_BACKUP_LOCATION: "{{ mailcow_backup_dir }}"
    host_job_description: "Daily mailcow app-consistent backup → archive → SeaweedFS S3 (rclone)"
    host_job_wants_network: true
    host_job_timeout: "2h"
    host_job_stamp: true
    host_job_exec:
      - >-
        {{ mailcow_install_dir }}/helper-scripts/backup_and_restore.sh
        backup {{ mailcow_backup_components }} --delete-days {{ mailcow_backup_retention_days }}
      # Archive the set of this run. mailcow's helper names its folder mailcow-<date>-<time>:
      # `find` picks the folder(s) of the day (the job's date stamp) and runs one `tar` per
      # folder from the staging directory, so the archive holds the folder by its own name.
      # `\;` is systemd's way to hand a literal `;` to find; nothing here is expanded by a shell.
      - >-
        /usr/bin/find {{ mailcow_backup_dir }} -maxdepth 1 -type d -name mailcow-${HOST_JOB_DATE}-*
        -execdir /usr/bin/tar -czf {}.tar.gz {} \;
      # push new archives, then prune the bucket beyond retention — credentials stay in the env file
      - >-
        /usr/bin/docker run --rm --network host
        --env-file {{ mailcow_backup_env_file }} -v {{ mailcow_backup_dir }}:/data:ro {{ mailcow_backup_rclone_image }}
        copy /data dst:{{ mailcow_backup_bucket }} --include mailcow-*.tar.gz --max-age {{ mailcow_backup_retention_days }}d --stats-one-line -v
      - >-
        /usr/bin/docker run --rm --network host
        --env-file {{ mailcow_backup_env_file }} {{ mailcow_backup_rclone_image }}
        delete dst:{{ mailcow_backup_bucket }} --min-age {{ mailcow_backup_retention_days }}d --include mailcow-*.tar.gz -v
    host_job_retention:
      - { path: "{{ mailcow_backup_dir }}", age: "{{ mailcow_backup_retention_days }}d" }
