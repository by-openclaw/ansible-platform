---
# Daily APP-CONSISTENT snapshot on the host (mailcow's own helper), landing in
# {{ mailcow_backup_dir }} BEFORE the nightly PBS run picks up the VM — same
# pattern as pg-backup (no secrets on the host; the S3+offsite copies stay with
# the on-demand `--tags backup` play / continuous filer.backup). roles/host_job
# owns the unit and timer, so a failed run reaches the alert mail (OnFailure=).
- name: "backup-schedule | Daily mailcow backup (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: mailcow-backup
    host_job_description: "Daily mailcow app-consistent backup (helper script, local)"
    host_job_on_calendar: "{{ mailcow_backup_on_calendar }}"
    host_job_randomized_delay: "300"
    host_job_workdir: "{{ mailcow_install_dir }}"
    host_job_environment:
      MAILCOW_BACKUP_LOCATION: "{{ mailcow_backup_dir }}"
    host_job_exec:
      - >-
        {{ mailcow_install_dir }}/helper-scripts/backup_and_restore.sh
        backup {{ mailcow_backup_components }} --delete-days {{ mailcow_backup_retention_days }}
