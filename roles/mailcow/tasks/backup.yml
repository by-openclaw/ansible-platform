---
# ==============================================================================
# Role: mailcow — backup. The daily timer (backup-schedule.yml, roles/host_job) runs mailcow's
# OWN helper (app-consistent set), archives the newest set and pushes it to SeaweedFS S3 with
# pinned rclone; retention prunes local + S3. This file provisions what the timer needs.
# SeaweedFS tier-3 auto-offsites the bucket to Contabo, giving
# live(local vmail) + backup(SeaweedFS) + offsite(Contabo).
# Credentials: Vault {{ mailcow_backup_s3_vault_path }} (minted by seaweedfs_bucket).
# On demand: `systemctl start mailcow-backup.service` on the host (same unit the timer fires).
# ==============================================================================
- name: "backup | Assert the mailcow stack is running (helper needs mysql/redis up)"
  ansible.builtin.command:
    cmd: docker compose ps --status running -q
    chdir: "{{ mailcow_install_dir }}"
  register: mailcow_backup_stack
  changed_when: false
  check_mode: false   # read-only probe, valid under --check
  failed_when: mailcow_backup_stack.rc != 0 or (mailcow_backup_stack.stdout_lines | length) == 0

- name: "backup | Read the S3 backup credentials from Vault (read-only, minted by seaweedfs_bucket)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_backup_s3_vault_path }}"
    vault_secret_init: {}

- name: "backup | Bind the S3 credentials"
  ansible.builtin.set_fact:
    mailcow_s3: "{{ vault_secret_result }}"
  no_log: true

- name: "backup | Staging dir (world-writable: mailcow helper needs o+w)"
  ansible.builtin.file:
    path: "{{ mailcow_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0777"

# The upload runs on THIS host from the daily timer (backup-schedule.yml): rclone, pinned image, remote
# from this env file. No controller, no boto3, no Ansible run at night.
- name: "backup | Rclone remote for the S3 upload (env file, root only)"
  ansible.builtin.template:
    src: mailcow-backup.env.j2
    dest: "{{ mailcow_backup_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

- name: "backup | Pull the pinned rclone image"
  community.docker.docker_image:
    name: "{{ mailcow_backup_rclone_image }}"
    source: pull
  check_mode: false
