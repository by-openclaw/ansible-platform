---
# ==============================================================================
# Role: mailcow — backup (dump -> S3). INCREMENT 2.
# mailcow ships helpers/backup_and_restore.sh which dumps vmail+mysql+redis+conf.
# Plan: nightly cron runs the official backup script to mailcow_backup_dir, then
# pushes the dump to S3 (rclone/aws, creds from mailcow_backup_s3_secret_file)
# and prunes local + remote beyond mailcow_backup_retention_days. Storage policy:
# NAS + S3 only, no 2nd local disk; vmail itself already lives on the NAS.
# ==============================================================================

- name: "backup | INCREMENT 2 not yet implemented — fail loudly if a deploy reaches here"
  ansible.builtin.fail:
    msg: >-
      mailcow S3 backup is the next increment. Implement roles/mailcow/tasks/backup.yml
      (or set mailcow_backup_enabled=false) before enabling a full deploy.
