---
# ==============================================================================
# Role: mailcow — oidc.yml — wire Generic-OIDC to Authentik + the 5 GB template.
# Included by config.yml only when app-oidc-mailcow.json exists (authentik role
# created the provider). DB-driven: mailcow exposes no REST endpoint for the IdP.
# ==============================================================================

- name: "oidc | Load the Authentik OIDC client (id + secret)"
  ansible.builtin.set_fact:
    mailcow_oidc_client: "{{ (lookup('file', mailcow_secret_dir + '/' + mailcow_oidc_secret_file) | from_json).fields }}"
  no_log: true

- name: "oidc | Generic-OIDC identity_provider settings"
  ansible.builtin.set_fact:
    mailcow_oidc_kv:
      authsource: "generic-oidc"
      client_id: "{{ mailcow_oidc_client.client_id }}"
      client_secret: "{{ mailcow_oidc_client.client_secret }}"
      authorize_url: "{{ mailcow_oidc_authorization_endpoint }}"
      token_url: "{{ mailcow_oidc_token_endpoint }}"
      userinfo_url: "{{ mailcow_oidc_userinfo_endpoint }}"
      redirect_url: "{{ mailcow_oidc_redirect_url }}"
      client_scopes: "{{ mailcow_oidc_scopes }}"
      login_provisioning: "1"
      mailpassword_flow: "0"
      periodic_sync: "0"
      import_users: "0"
      sync_interval: "15"
      ignore_ssl_error: "0"
  no_log: true

- name: "oidc | Create the default 5 GB mailbox template"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "MYSQL_PWD={{ mailcow_dbroot }}"
      - "{{ mailcow_mysql_container }}"
      - mysql
      - -uroot
      - mailcow
      - -e
      - >-
        INSERT INTO templates (template, type, attributes)
        VALUES ('default', 'mailbox', '{"quota":"{{ mailcow_default_quota_mb }}","active":"1"}')
        ON DUPLICATE KEY UPDATE attributes = VALUES(attributes);
  changed_when: false
  no_log: true

- name: "oidc | Apply the identity_provider settings (key/value)"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - "MYSQL_PWD={{ mailcow_dbroot }}"
      - "{{ mailcow_mysql_container }}"
      - mysql
      - -uroot
      - mailcow
      - -e
      - >-
        INSERT INTO identity_provider (`key`, `value`) VALUES ('{{ item.key }}', '{{ item.value }}')
        ON DUPLICATE KEY UPDATE value = VALUES(value);
  loop: "{{ mailcow_oidc_kv | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  changed_when: false
  no_log: true
