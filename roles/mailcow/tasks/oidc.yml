---
# ==============================================================================
# Role: mailcow — oidc.yml — wire Generic-OIDC to Authentik + the 5 GB template.
# Included by config.yml only when the OIDC client is in Vault (the authentik role
# created the provider); config.yml binds mailcow_oidc_client.
# DB-driven: mailcow exposes no REST endpoint for the IdP.
# ==============================================================================

- name: "oidc | Generic-OIDC identity_provider settings"
  ansible.builtin.set_fact:
    mailcow_oidc_kv:
      authsource: "generic-oidc"
      server_url: "{{ mailcow_oidc_issuer }}"
      client_id: "{{ mailcow_oidc_client.client_id }}"
      client_secret: "{{ mailcow_oidc_client.client_secret }}"
      authorize_url: "{{ mailcow_oidc_authorization_endpoint }}"
      token_url: "{{ mailcow_oidc_token_endpoint }}"
      userinfo_url: "{{ mailcow_oidc_userinfo_endpoint }}"
      redirect_url: "{{ mailcow_oidc_redirect_url }}"
      client_scopes: "{{ mailcow_oidc_scopes }}"
      # Auto-provision every OIDC user from this mailbox template (the 5 GB
      # "default" created below) — mailcow's reliable provisioning path.
      default_template: "{{ mailcow_oidc_default_template }}"
      # mailcow's SSO callback does array_search($user_template, $iam_settings['mappers'])
      # in identity_provider('verify-sso'). Omitting these leaves 'mappers' NULL, which
      # throws a TypeError in PHP 8 and returns an EMPTY page after a successful
      # Authentik login — a blank screen with no error shown to the user.
      # We provision everyone from default_template, so no attribute mapping is
      # needed; the keys must simply exist as arrays.
      mappers: []
      templates: []
      login_provisioning: "1"
      mailpassword_flow: "0"
      periodic_sync: "0"
      import_users: "0"
      sync_interval: "15"
      ignore_ssl_error: "0"
  no_log: true

# A person's mailbox is marked OIDC-sourced (authsource=generic-oidc) by its one
# writer, roles/mailbox, through roles/identity_orchestrator — mailcow otherwise
# refuses the SSO login with a generic login_failed. postmaster@ and the separate
# `admin` UI account stay local as break-glass.

- name: "oidc | Remove the legacy lowercase 'default' template (case-sensitive)"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client }}"
    env: "{{ mailcow_mysql_env }}"
    # BINARY keeps this case-sensitive so mailcow's built-in "Default" is untouched.
    stdin: "DELETE FROM templates WHERE BINARY template = 'default' AND type = 'mailbox';"
  changed_when: false
  no_log: true

# mailcow's `templates` table has no key but its id, so an "insert … on duplicate key update"
# never finds a duplicate: it added one more identical row at every run (25 of them by
# 2026-10-08). Read first — how many rows carry the name, how many of them carry these
# attributes — and write only when the answer is not "one, and it is right". The write replaces
# every row of that name by one, in a transaction: a login that provisions a mailbox meanwhile
# always finds a template. Nothing refers to a template by its id (the identity provider names it).
- name: "oidc | The auto-provisioning mailbox template as stored (rows of that name, rows that are right)"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client + ['-N'] }}"   # -N: the values only
    env: "{{ mailcow_mysql_env }}"
    stdin: >-
      SELECT CONCAT(COUNT(*), ' ', IFNULL(SUM(attributes = '{{ mailcow_oidc_template_attributes | to_json }}'), 0))
      FROM templates WHERE BINARY template = '{{ mailcow_oidc_default_template }}' AND type = 'mailbox';
  register: mailcow_oidc_template_rows
  check_mode: false  # read-only probe: must run under --check too (the next task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Write the 5 GB auto-provisioning mailbox template (one row)"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client }}"
    env: "{{ mailcow_mysql_env }}"
    stdin: >-
      START TRANSACTION;
      DELETE FROM templates WHERE BINARY template = '{{ mailcow_oidc_default_template }}' AND type = 'mailbox';
      INSERT INTO templates (template, type, attributes)
      VALUES ('{{ mailcow_oidc_default_template }}', 'mailbox', '{{ mailcow_oidc_template_attributes | to_json }}');
      COMMIT;
  when: (mailcow_oidc_template_rows.stdout | default('') | trim) != '1 1'
  changed_when: true
  no_log: true

- name: "oidc | Apply the identity_provider settings (key/value)"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client }}"
    env: "{{ mailcow_mysql_env }}"
    stdin: >-
      INSERT INTO identity_provider (`key`, `value`) VALUES ('{{ item.key }}', '{{ item.value }}')
      ON DUPLICATE KEY UPDATE value = VALUES(value);
  loop: "{{ mailcow_oidc_kv | dict2items }}"
  loop_control: { label: "{{ item.key }}" }
  changed_when: false
  no_log: true
