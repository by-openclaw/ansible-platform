---
# ==============================================================================
# Role: mailcow — wildcard TLS for the mail ports via Cloudflare DNS-01 (roles/lego_cert,
# the same role as traefik + adguard). mailcow runs SKIP_LETS_ENCRYPT=y (acme
# container off) and serves whatever sits in data/assets/ssl, so we issue the
# *.{{ platform_domain }} wildcard here and drop it in, then reload the mail daemons.
# DNS-01 needs only outbound Cloudflare API — independent of WAN/public exposure.
# ==============================================================================

# The certificate (issue once, renew by systemd timer) — roles/lego_cert. A renewal
# that replaced the cert starts lego-deploy-mailcow: install cert.pem + key.pem into
# mailcow's ssl dir and restart the three daemons that serve it (no script).
- name: "cert | Wildcard certificate via roles/lego_cert"
  ansible.builtin.include_role:
    name: lego_cert
  vars:
    lego_cert_id: mailcow
    lego_cert_email: "{{ mailcow_acme_email }}"
    lego_cert_domains: ["*.{{ mailcow_domain }}", "{{ mailcow_domain }}"]
    lego_cert_cf_token: "{{ mailcow_cf_token }}"
    lego_cert_renew_days: "{{ mailcow_renew_days }}"
    lego_cert_on_calendar: "*-*-* 03:41:00"
    lego_cert_deploy_workdir: "{{ mailcow_install_dir }}"
    lego_cert_deploy_steps:
      - "/usr/bin/install -m 0644 {{ mailcow_cert_crt }} {{ mailcow_ssl_dir }}/cert.pem"
      - "/usr/bin/install -m 0600 {{ mailcow_cert_key }} {{ mailcow_ssl_dir }}/key.pem"
      - "/usr/bin/docker compose restart postfix-mailcow dovecot-mailcow nginx-mailcow"
    lego_cert_legacy_cron: lego-renew-mailcow
    lego_cert_legacy_script: /etc/lego/renew-mailcow-cert.sh

# --- deploy into mailcow's bring-your-own cert path (idempotent on content) ----
- name: "cert | Ensure mailcow ssl dir exists"
  ansible.builtin.file:
    path: "{{ mailcow_ssl_dir }}"
    state: directory
    mode: "0755"

- name: "cert | Install the wildcard fullchain as mailcow cert.pem"
  ansible.builtin.copy:
    src: "{{ mailcow_cert_crt }}"
    dest: "{{ mailcow_ssl_dir }}/cert.pem"
    remote_src: true
    mode: "0644"
  notify: Reload mailcow mail TLS

- name: "cert | Install the wildcard private key as mailcow key.pem"
  ansible.builtin.copy:
    src: "{{ mailcow_cert_key }}"
    dest: "{{ mailcow_ssl_dir }}/key.pem"
    remote_src: true
    mode: "0600"
  no_log: true
  notify: Reload mailcow mail TLS
