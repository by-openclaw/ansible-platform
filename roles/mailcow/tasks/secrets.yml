---
# ==============================================================================
# Role: mailcow — secrets (generate once, persist 0600 on the controller)
# Holds the stack's DB/Redis passwords + an API key (seeded into mailcow's `api`
# table so the config phase can drive mailcow over its REST API, ansible-only).
# Never printed (no_log) and never committed — lives in the secret folder.
# ==============================================================================

- name: "secrets | Stat the mailcow secret on the controller"
  ansible.builtin.stat:
    path: "{{ mailcow_secret_dir }}/{{ mailcow_secret_file }}"
  delegate_to: localhost
  become: false
  register: mailcow_secret_stat

- name: "secrets | Load existing mailcow secrets"
  ansible.builtin.set_fact:
    mailcow_secrets: "{{ (lookup('file', mailcow_secret_dir + '/' + mailcow_secret_file) | from_json).fields }}"
  no_log: true
  when: mailcow_secret_stat.stat.exists

- name: "secrets | Generate mailcow secrets (first run only)"
  ansible.builtin.set_fact:
    mailcow_secrets:
      db_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      db_root_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      redis_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      api_key: "{{ lookup('community.general.random_string', length=30, special=false, upper=true, numbers=true) }}"
  no_log: true
  when: not mailcow_secret_stat.stat.exists

- name: "secrets | Persist the mailcow secret (0600, controller)"
  ansible.builtin.copy:
    dest: "{{ mailcow_secret_dir }}/{{ mailcow_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (mailcow_secrets | combine({'hostname': mailcow_hostname, 'url': 'https://' + mailcow_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not mailcow_secret_stat.stat.exists

# OIDC client secret is provisioned by the authentik role (app-oidc-mailcow.json),
# same as every other SSO service. Loaded here when present; the config phase
# wires it into mailcow's Identity Provider settings.
- name: "secrets | Stat the OIDC client secret"
  ansible.builtin.stat:
    path: "{{ mailcow_secret_dir }}/{{ mailcow_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: mailcow_oidc_secret_stat

- name: "secrets | Load the OIDC client id + secret"
  ansible.builtin.set_fact:
    mailcow_oidc: "{{ (lookup('file', mailcow_secret_dir + '/' + mailcow_oidc_secret_file) | from_json).fields }}"
  no_log: true
  when: mailcow_oidc_secret_stat.stat.exists

# Cloudflare API token for lego DNS-01 (the same scoped token the traefik/adguard
# roles use to issue the *.by-research.be wildcard). Used by cert.yml.
- name: "secrets | Load the Cloudflare API token (lego DNS-01)"
  ansible.builtin.set_fact:
    mailcow_cf_token: "{{ (lookup('file', mailcow_cf_secret) | from_json).fields.api_token }}"
  no_log: true
  when: mailcow_tls_wildcard | bool
