---
# ==============================================================================
# Role: mailcow — secrets (Vault: generated once, reused after)
# Holds the stack's DB/Redis passwords + an API key (seeded into mailcow's `api`
# table so the config phase can drive mailcow over its REST API, ansible-only).
# Never printed (no_log) and never committed — lives in Vault.
# ==============================================================================

- name: "secrets | Mailcow stack secrets (Vault, get-or-create)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_vault_path }}"
    vault_secret_init:
      db_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      db_root_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      redis_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      api_key: "{{ lookup('community.general.random_string', length=30, special=false, upper=true, numbers=true) }}"
      hostname: "{{ mailcow_hostname }}"
      url: "https://{{ mailcow_fqdn }}"

- name: "secrets | Bind them"
  ansible.builtin.set_fact:
    mailcow_secrets: "{{ vault_secret_result }}"
  no_log: true

# OIDC client is minted by the authentik role, same as every other SSO service.
# Optional: absent means Authentik has not provisioned mailcow yet.
- name: "secrets | OIDC client id + secret (Vault, optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_oidc_vault_path }}"
    vault_secret_optional: true

- name: "secrets | Bind it (when present)"
  ansible.builtin.set_fact:
    mailcow_oidc: "{{ vault_secret_result }}"
  no_log: true
  when: vault_secret_result | length > 0

# Cloudflare API token for lego DNS-01 (the same scoped token the traefik/adguard
# roles use to issue the *.{{ platform_domain }} wildcard). Used by cert.yml.
- name: "secrets | Read the Cloudflare zone secret from Vault (lego DNS-01)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ mailcow_cf_vault_path }}"
    vault_secret_init: {}
  when: mailcow_tls_wildcard | bool

- name: "secrets | Adopt the Cloudflare API token (no_log)"
  ansible.builtin.set_fact:
    mailcow_cf_token: "{{ vault_secret_result.api_token }}"
  no_log: true
  when: mailcow_tls_wildcard | bool

# Dovecot master user — Vault-native (get-or-create). Consumed by mailcow.conf
# (DOVECOT_MASTER_USER/PASS) and by roles/nextcloud (Mail provisioning).
- name: "secrets | Dovecot master user (Vault, get-or-create)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_master_vault_path }}"
    vault_secret_init:
      user: "{{ mailcow_master_user }}"
      login: "{{ mailcow_master_user }}@mailcow.local"
      password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      note: "Dovecot master user; IMAP login = <mailbox>*<login>"

- name: "secrets | Bind the master user"
  ansible.builtin.set_fact:
    mailcow_master: "{{ vault_secret_result }}"
  no_log: true
