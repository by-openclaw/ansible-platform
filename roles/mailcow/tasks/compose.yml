---
# ==============================================================================
# Role: mailcow — compose (bring the stack up). Gated behind mailcow_deploy_stack.
# Pulls the pinned images then starts the full mailcow-dockerized stack and waits
# for the web UI to answer on the HTTP listener.
# ==============================================================================

# The pinned tags come from mailcow's compose (the git ref pins them) — no :latest.
- name: "compose | Pull + start the mailcow stack (roles/compose_stack)"
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ mailcow_install_dir }}"
    # mailcow interpolates ${VAR} from mailcow.conf (not .env) → point compose at it.
    compose_stack_env_files: ["{{ mailcow_install_dir }}/mailcow.conf"]
    compose_stack_pull: always
    compose_stack_remove_orphans: false
    compose_stack_environment:
      COMPOSE_HTTP_TIMEOUT: "300"

- name: "compose | Wait for the mailcow UI to answer (HTTP listener)"
  ansible.builtin.uri:
    url: "http://{{ mailcow_listen_ip }}:{{ mailcow_http_port }}/"
    method: GET
    status_code: [200, 301, 302]
    validate_certs: false
  register: mailcow_ui_probe
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  retries: 30
  delay: 10
  until: mailcow_ui_probe.status in [200, 301, 302]
  changed_when: false
