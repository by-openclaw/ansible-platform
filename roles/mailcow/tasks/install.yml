---
# ==============================================================================
# Role: mailcow — install (Docker CE + clone + mailcow.conf)
# mailcow requires Docker CE >= 24 + compose v2 (Debian's docker.io is too old),
# so we install Docker CE from the official repo here. vmail stays on the local
# 60 GB disk via mailcow's default volumes — no NFS, no extra disk.
# Idempotent + check-mode safe. Does NOT start the stack (see compose.yml, gated).
# ==============================================================================

- name: "install | Purge any host MTA (frees :25 for mailcow postfix)"
  ansible.builtin.apt:
    name: "{{ mailcow_host_mta_packages }}"
    state: absent
    purge: true

- name: "install | Prerequisite packages (Docker repo + git clone)"
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, git]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "install | Ensure /etc/apt/keyrings exists"
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "install | Docker CE apt signing key"
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"

- name: "install | Docker CE apt repository"
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
    filename: docker
    state: present

- name: "install | Install Docker CE + compose v2 plugin"
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: true

- name: "install | Docker service enabled + running"
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

# mailcow's containers must reach the platform DNS chain. On this network the
# IPv4 resolver (10.1.2.1) is dead; only IPv6 (fd01:2::1) answers — so the Docker
# network must be dual-stack or unbound (and thus the whole stack) can't resolve.
- name: "install | Configure Docker IPv6 (dual-stack) daemon.json"
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    content: |
      {
        "ipv6": true,
        "ip6tables": true,
        "experimental": true,
        "fixed-cidr-v6": "fd00:d0c6:1::/64",
        "log-driver": "json-file",
        "log-opts": {"max-size": "10m", "max-file": "3"}
      }
  notify: Restart docker for mailcow

# Apply the docker restart NOW (before clone/compose) rather than at play end,
# so the stack's network is created dual-stack on first `compose up`.
- name: "install | Apply pending docker restart before the stack starts"
  ansible.builtin.meta: flush_handlers

- name: "install | Clone mailcow-dockerized at the pinned tag"
  ansible.builtin.git:
    repo: "{{ mailcow_git_repo }}"
    dest: "{{ mailcow_install_dir }}"
    version: "{{ mailcow_git_version }}"
    depth: 1
    # Clone once; never pull/reset on re-runs. mailcow's data/conf/* are tracked
    # files that we (unbound.conf) and mailcow's runtime modify, so a git update
    # would fail on "local modifications" / wipe live config. Version bumps are
    # done out-of-band via mailcow's own update.sh, not git pull.
    update: false
  register: mailcow_clone

- name: "install | Render mailcow.conf"
  ansible.builtin.template:
    src: mailcow.conf.j2
    dest: "{{ mailcow_install_dir }}/mailcow.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true # carries DB/Redis passwords

# generate_config.sh (which we skip — we template mailcow.conf) also creates the
# initial self-signed cert; without it nginx crash-loops. Traefik terminates the
# real TLS (wildcard), so mailcow's internal cert only needs to EXIST.
- name: "install | Ensure mailcow ssl assets dir"
  ansible.builtin.file:
    path: "{{ mailcow_install_dir }}/data/assets/ssl"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "install | Generate mailcow internal self-signed cert (Traefik does real TLS)"
  ansible.builtin.command:
    cmd: >-
      openssl req -x509 -newkey rsa:2048
      -keyout {{ mailcow_install_dir }}/data/assets/ssl/key.pem
      -out {{ mailcow_install_dir }}/data/assets/ssl/cert.pem
      -days 3650 -subj "/CN={{ mailcow_hostname }}/O=mailcow/C=BE" -sha256 -nodes
    creates: "{{ mailcow_install_dir }}/data/assets/ssl/cert.pem"

- name: "install | Generate mailcow dhparams.pem (dovecot fatals without it)"
  ansible.builtin.command:
    cmd: openssl dhparam -out {{ mailcow_install_dir }}/data/assets/ssl/dhparams.pem 2048
    creates: "{{ mailcow_install_dir }}/data/assets/ssl/dhparams.pem"

# mailcow's unbound recurses to root servers on :53, which the platform blocks
# (force DNS through the chain). Make it FORWARD to the platform resolver and
# drop local DNSSEC validation (the chain validates upstream) so it stays healthy.
- name: "install | Point mailcow unbound at the platform DNS chain (forward, no recurse)"
  ansible.builtin.blockinfile:
    path: "{{ mailcow_install_dir }}/data/conf/unbound/unbound.conf"
    marker: "# {mark} ANSIBLE MANAGED — forward to platform DNS chain"
    block: |
      server:
        module-config: "iterator"
      forward-zone:
        name: "."
        forward-addr: {{ mailcow_unbound_forward_to }}

# NOTE: vmail = mailcow's default docker volume on the local disk (no override).
# example.com internal-only postfix restriction is applied in config.yml (after
# the domain exists + the stack runs), validated against the live postfix chain.
