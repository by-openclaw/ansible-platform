---
# ==============================================================================
# Role: mailcow — install (clone + mailcow.conf)
# Lays down the stack on disk but does NOT start it (see compose.yml, gated).
# vmail stays on the local 60 GB disk via mailcow's default volumes — no NFS,
# no extra disk, no override (NAS migration is deferred, see defaults).
# Idempotent + check-mode safe.
# ==============================================================================

- name: "install | Git package (for the mailcow clone)"
  ansible.builtin.apt:
    name: [git]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "install | Clone mailcow-dockerized at the pinned tag"
  ansible.builtin.git:
    repo: "{{ mailcow_git_repo }}"
    dest: "{{ mailcow_install_dir }}"
    version: "{{ mailcow_git_version }}"
    depth: 1
  register: mailcow_clone

- name: "install | Render mailcow.conf"
  ansible.builtin.template:
    src: mailcow.conf.j2
    dest: "{{ mailcow_install_dir }}/mailcow.conf"
    owner: root
    group: root
    mode: "0600"
  no_log: true # carries DB/Redis passwords

# NOTE: vmail = mailcow's default docker volume on the local disk (no override).
# example.com internal-only postfix restriction is applied in config.yml (after
# the domain exists + the stack runs), validated against the live postfix chain.
