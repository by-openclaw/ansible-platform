---
# ==============================================================================
# Role: mailcow — config (post-deploy). Idempotent. Runs against the live stack.
# - admin password (DB, mailcow {SSHA256} hash from the secret)
# - mailcow REST API key seeded so the uri tasks can authenticate
# - domains + DKIM + the bootstrap mailbox (postmaster@) via the API
# - Authentik OIDC IdP + 5 GB template (DB) — only when the OIDC secret exists
# Secrets are READ from the controller secret store (generated out-of-band); the
# playbook never computes hashes inline.
# ==============================================================================

- name: "config | Mailcow secrets (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_vault_path }}"

- name: "config | Bind them"
  ansible.builtin.set_fact:
    mailcow_sec: "{{ vault_secret_result }}"
  no_log: true

# Bootstrap ONLY postmaster@: RFC 2142, the catch-all target, and needed before the
# domain is useful — at a first install this role mints the API key roles/mailbox
# needs, so it cannot call roles/mailbox here. Every other box has ONE writer
# through roles/mailbox: a person via platform_people (roles/identity_orchestrator),
# a service via playbooks/mailboxes.yml.
- name: "config | The bootstrap mailbox (postmaster@)"
  ansible.builtin.set_fact:
    mailcow_provision_mailboxes:
      - local_part: "postmaster"
        domain: "{{ platform_domain }}"
        name: "Postmaster"
        password: "{{ mailcow_sec.postmaster_password }}"
        quota: 5120
  no_log: true

- name: "config | Read DBROOT from mailcow.conf"
  ansible.builtin.slurp:
    src: "{{ mailcow_install_dir }}/mailcow.conf"
  register: mailcow_conf_raw
  no_log: true

- name: "config | Extract DBROOT"
  ansible.builtin.set_fact:
    mailcow_dbroot: "{{ (mailcow_conf_raw.content | b64decode).split('\n') | select('match', '^DBROOT=') | first | regex_replace('^DBROOT=', '') }}"
  no_log: true

# --- mailcow REST API key (seed so the uri tasks below can authenticate) -------
- name: "config | Seed the mailcow REST API key (rw)"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client }}"
    env: "{{ mailcow_mysql_env }}"
    stdin: >-
      INSERT INTO api (api_key, allow_from, skip_ip_check, access, active, created, modified)
      VALUES ('{{ mailcow_sec.api_key }}', '0.0.0.0/0', 1, 'rw', 1, NOW(), NOW())
      ON DUPLICATE KEY UPDATE active = 1, skip_ip_check = 1;
  changed_when: false
  no_log: true

# --- admin password (idempotent: only update if the stored hash differs) -------
- name: "config | Current admin password hash"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client + ['-N'] }}"   # -N: the value only, no column name
    env: "{{ mailcow_mysql_env }}"
    stdin: "SELECT password FROM admin WHERE username='admin';"
  register: mailcow_admin_hash
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "config | Set the mailcow admin password"
  community.docker.docker_container_exec:
    container: "{{ mailcow_mysql_container }}"
    argv: "{{ mailcow_mysql_client }}"
    env: "{{ mailcow_mysql_env }}"
    stdin: "UPDATE admin SET password='{{ mailcow_sec.admin_password_hash }}', active=1 WHERE username='admin';"
  when: mailcow_admin_hash.stdout | trim != mailcow_sec.admin_password_hash
  changed_when: true
  no_log: true

# --- domains + DKIM (mailcow REST API) ----------------------------------------
- name: "config | Set API endpoint + auth header"
  ansible.builtin.set_fact:
    mailcow_api: "https://{{ mailcow_listen_ip }}:{{ mailcow_https_port }}/api/v1"
    mailcow_api_hdr: { "X-API-Key": "{{ mailcow_sec.api_key }}", "Content-Type": "application/json" }
  no_log: true

- name: "config | Add hosted domains"
  ansible.builtin.uri:
    url: "{{ mailcow_api }}/add/domain"
    method: POST
    headers: "{{ mailcow_api_hdr }}"
    body_format: json
    body:
      domain: "{{ item.domain }}"
      description: "{{ item.description }}"
      aliases: 400
      mailboxes: "{{ item.mailboxes }}"
      defquota: "{{ item.defquota_mb }}"
      maxquota: "{{ item.maxquota_mb }}"
      quota: "{{ item.quota_mb }}"
      active: "1"
    validate_certs: false
    status_code: [200]
  loop: "{{ mailcow_domains }}"
  loop_control: { label: "{{ item.domain }}" }
  register: mailcow_dom_add
  changed_when: "'domain_added' in (mailcow_dom_add.json | default([]) | string)"
  failed_when: >-
    mailcow_dom_add.json is defined and
    (mailcow_dom_add.json | string is search('danger')) and
    not (mailcow_dom_add.json | string is search('domain_exists'))
  no_log: true

- name: "config | Generate DKIM keys (2048) per domain"
  ansible.builtin.uri:
    url: "{{ mailcow_api }}/add/dkim"
    method: POST
    headers: "{{ mailcow_api_hdr }}"
    body_format: json
    body: { domains: "{{ item.domain }}", dkim_selector: "dkim", key_size: 2048 }
    validate_certs: false
    status_code: [200]
  loop: "{{ mailcow_domains }}"
  loop_control: { label: "{{ item.domain }}" }
  register: mailcow_dkim_add
  changed_when: "'dkim_added' in (mailcow_dkim_add.json | default([]) | string)"
  failed_when: false
  no_log: true

- name: "config | Domain catch-all alias (SVC-09)"
  ansible.builtin.uri:
    url: "{{ mailcow_api }}/add/alias"
    method: POST
    headers: "{{ mailcow_api_hdr }}"
    body_format: json
    body:
      address: "@{{ item.domain }}"
      goto: "{{ item.catchall_to }}"
      active: "1"
    validate_certs: false
    status_code: [200]
  loop: "{{ mailcow_domains | selectattr('catchall_to', 'defined') | list }}"
  loop_control: { label: "@{{ item.domain }} -> {{ item.catchall_to }}" }
  register: mailcow_catchall
  changed_when: "'alias_added' in (mailcow_catchall.json | default([]) | string)"
  failed_when: >-
    mailcow_catchall.json is defined and
    (mailcow_catchall.json | string is search('danger')) and
    not (mailcow_catchall.json | string is search('object_exists|is_alias_or_mailbox'))
  no_log: true

# --- the bootstrap mailbox: postmaster@ (RFC) -----------------------------------
- name: "config | Create the bootstrap mailbox (postmaster@)"
  ansible.builtin.uri:
    url: "{{ mailcow_api }}/add/mailbox"
    method: POST
    headers: "{{ mailcow_api_hdr }}"
    body_format: json
    body:
      local_part: "{{ item.local_part }}"
      domain: "{{ item.domain }}"
      name: "{{ item.name }}"
      password: "{{ item.password }}"
      password2: "{{ item.password }}"
      quota: "{{ item.quota | default(mailcow_default_quota_mb) }}"
      active: "1"
    validate_certs: false
    status_code: [200]
  loop: "{{ mailcow_provision_mailboxes }}"
  loop_control: { label: "{{ item.local_part }}@{{ item.domain }}" }
  register: mailcow_mbox_add
  changed_when: "'mailbox_added' in (mailcow_mbox_add.json | default([]) | string)"
  failed_when: >-
    mailcow_mbox_add.json is defined and
    (mailcow_mbox_add.json | string is search('danger')) and
    not (mailcow_mbox_add.json | string is search('object_exists'))
  no_log: true

# --- Authentik OIDC (only once the authentik role wrote the client secret) -----
- name: "config | The OIDC client (Vault, optional — absent until Authentik mints it)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailcow_oidc_vault_path }}"
    vault_secret_optional: true
  when: mailcow_oidc_enabled | bool

- name: "config | Bind it"
  ansible.builtin.set_fact:
    mailcow_oidc_client: "{{ vault_secret_result }}"
  no_log: true
  when: mailcow_oidc_enabled | bool

- name: "config | Wire Authentik OIDC IdP + 5 GB template"
  ansible.builtin.include_tasks: oidc.yml
  when:
    - mailcow_oidc_enabled | bool
    - mailcow_oidc_client | default({}) | length > 0
