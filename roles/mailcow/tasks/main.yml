---
# ==============================================================================
# Role: mailcow — dispatcher
# Phases: secrets -> install (clone/NFS/conf/override/compose) -> config (API:
# domains/template/OIDC/postmaster/example.com) -> traefik route -> backup.
# Config/route/backup require the stack to be running, so they are gated behind
# `mailcow_deploy_stack` (default false). Install is safe to run/check anytime.
# ==============================================================================

- name: Resolve / generate mailcow stack secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [always]   # every tagged phase (cert, backup, config…) needs these facts

- name: Install the mailcow stack (clone, NFS vmail, mailcow.conf, override)
  ansible.builtin.import_tasks: install.yml
  tags: [mailcow, install]

# include_tasks does not pass its tags to the included tasks: without `apply`, a run
# scoped to --tags compose skipped the whole phase (found during the 2026-09-19 restore,
# #454). cert.yml and config.yml below already use the same pattern.
- name: Bring the mailcow stack up (gated)
  ansible.builtin.include_tasks:
    file: compose.yml
    apply:
      tags: [mailcow, compose]
  when: mailcow_deploy_stack | bool
  tags: [mailcow, compose]

- name: Issue + deploy the wildcard TLS cert for the mail ports (gated)
  ansible.builtin.include_tasks:
    file: cert.yml
    apply:
      tags: [mailcow, cert]
  when:
    - mailcow_deploy_stack | bool
    - mailcow_tls_wildcard | bool
  tags: [mailcow, cert]

- name: Configure mailcow domains/template/OIDC/postmaster/example.com (API)
  ansible.builtin.include_tasks:
    file: config.yml
    apply:
      tags: [mailcow, config]
  when: mailcow_deploy_stack | bool
  tags: [mailcow, config]

- name: Publish the mailcow web UI via Traefik (public + rate-limit)
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: mailcow
    traefik_route_fqdn: "{{ mailcow_fqdn }}"
    traefik_route_backend_url: "http://{{ mailcow_listen_ip }}:{{ mailcow_http_port }}"
    traefik_route_internal_only: "{{ mailcow_traefik_internal_only }}"
  when: mailcow_deploy_stack | bool
  tags: [mailcow, route]

- name: Provision the SeaweedFS backup bucket + scoped key (dependency composition)
  ansible.builtin.include_role:
    name: seaweedfs_bucket
    apply:
      tags: [mailcow, backup]
  vars:
    seaweedfs_bucket_identity: mailcow
    seaweedfs_bucket_names: [mailcow-backups]
    seaweedfs_bucket_vault_path: "{{ mailcow_backup_s3_vault_path }}"
  # Backup is NOT gated on mailcow_deploy_stack (that flag guards the outward-facing
  # `compose up`); backup.yml asserts itself that the stack is running.
  when: mailcow_backup_enabled | bool
  tags: [mailcow, backup]

- name: Configure mailcow backups (dump -> S3)
  ansible.builtin.include_tasks:
    file: backup.yml
    apply:
      tags: [mailcow, backup]
  when: mailcow_backup_enabled | bool
  tags: [mailcow, backup]

- name: Schedule the daily app-consistent backup (host-local)
  ansible.builtin.import_tasks: backup-schedule.yml
  tags: [mailcow, backup-schedule]
