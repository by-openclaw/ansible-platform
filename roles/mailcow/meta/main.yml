---
galaxy_info:
  role_name: mailcow
  author: BY-SYSTEMS SRL
  description: >-
    mailcow-dockerized mail server (Postfix/Dovecot/Rspamd/SOGo/MariaDB/Redis) on
    a dedicated DMZ VM. vmail Maildir on Synology NFS; web UI via Traefik + native
    Authentik OIDC; mail bound to the Telenet static WAN. Self-contained appliance.
  license: Apache-2.0
  min_ansible_version: "2.15"
  platforms:
    - name: Debian
      versions:
        - bookworm
dependencies:
  - role: base
# NOT the platform `docker` role: that installs Debian's docker.io (v20.10, no
# compose v2). mailcow requires Docker CE >= 24 + the compose plugin, installed
# from the official Docker repo in install.yml.
