---
- name: "lego_cert | Required inputs"
  ansible.builtin.assert:
    that:
      - lego_cert_id | length > 0
      - lego_cert_email | length > 0
      - lego_cert_domains | length > 0
      - lego_cert_cf_token | length > 0
    fail_msg: "lego_cert needs lego_cert_id, lego_cert_email, lego_cert_domains and lego_cert_cf_token"
    quiet: true

# The SAME command for the first issuance and every renewal (v5: `lego run` does both): account,
# TOS, DNS provider, propagation, Common Name, domains.
- name: "lego_cert | Command line (shared by the first run and every renewal)"
  ansible.builtin.set_fact:
    lego_cert_argv: >-
      {{ ['/usr/local/bin/lego', 'run', '--email', lego_cert_email, '--accept-tos', '--dns', 'cloudflare',
          '--dns.propagation.wait', lego_cert_propagation_wait]
         + (['--key-type', lego_cert_key_type] if lego_cert_key_type | length > 0 else [])
         + (['--pfx', '--pfx.format', 'SHA256'] if lego_cert_pfx | bool else [])
         + (['--enable-cn'] if lego_cert_enable_cn | bool else [])
         + (lego_cert_domains | map('regex_replace', '^', '--domains=') | list) }}
    lego_cert_hook: >-
      {{ ('systemctl start lego-deploy-' ~ lego_cert_id ~ '.service')
         if (lego_cert_deploy_steps | length > 0) else lego_cert_renew_hook }}

# --- lego itself (pinned) --------------------------------------------------------
- name: "lego_cert | Installed lego version"
  ansible.builtin.command: /usr/local/bin/lego --version
  register: lego_cert_installed
  changed_when: false
  failed_when: false
  check_mode: false   # read-only

- name: "lego_cert | Install lego {{ lego_cert_version }} (absent or another version)"
  when: lego_cert_installed.rc != 0 or lego_cert_version not in lego_cert_installed.stdout
  block:
    - name: "lego_cert | What the download + extract need"
      ansible.builtin.apt:
        name: [ca-certificates, tar]
        state: present

    - name: "lego_cert | Download the release"
      ansible.builtin.get_url:
        url: "{{ lego_cert_url }}"
        dest: "/tmp/lego_v{{ lego_cert_version }}_linux_amd64.tar.gz"
        mode: "0644"
      register: lego_cert_download

    # Under --check the download above is only reported: there is no archive to extract yet.
    - name: "lego_cert | Extract the binary"
      when: not (ansible_check_mode and lego_cert_download is changed)
      ansible.builtin.unarchive:
        src: "/tmp/lego_v{{ lego_cert_version }}_linux_amd64.tar.gz"
        dest: /usr/local/bin
        remote_src: true
        include: [lego]
        owner: root
        group: root
        mode: "0755"

# --- layout + credentials ----------------------------------------------------------
- name: "lego_cert | /etc/lego layout (root, 0700)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop:
    - "{{ lego_cert_dir }}"
    - "{{ lego_cert_path }}"

- name: "lego_cert | Cloudflare credentials (root, 0600)"
  ansible.builtin.template:
    src: cloudflare.env.j2
    dest: "{{ lego_cert_dir }}/cloudflare.env"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# --- a v4 store: `lego migrate` once (v5 CLI guide: "a requirement", before any other command) --
# v4 kept an account's key in accounts/<server>/<account>/keys/; v5 next to account.json, with
# changed JSON. The tool asks for a backup first and a confirmation (answered on stdin).
- name: "Lego_cert | A v4 store? (accounts/<server>/<account>/keys)"
  ansible.builtin.find:
    paths: "{{ lego_cert_path }}/accounts"
    patterns: keys
    file_type: directory
    recurse: true
  register: lego_cert_v4_store

- name: "Lego_cert | Migrate the v4 store"
  when: lego_cert_v4_store.matched > 0
  block:
    - name: "Lego_cert | Back up the store first (root only)"
      community.general.archive:
        path: "{{ lego_cert_path }}"
        dest: "{{ lego_cert_dir }}/cert-v4-{{ now(utc=true).strftime('%Y%m%dT%H%M%SZ') }}.tar.gz"
        format: gz
        owner: root
        group: root
        mode: "0600"

    - name: "Lego_cert | lego migrate"
      ansible.builtin.command:
        argv: [/usr/local/bin/lego, migrate, --path, "{{ lego_cert_path }}"]
        stdin: "y"
        chdir: "{{ lego_cert_dir }}"
      register: lego_cert_migrated
      changed_when: true

    - name: "Lego_cert | No v4 account key directory left"
      ansible.builtin.find:
        paths: "{{ lego_cert_path }}/accounts"
        patterns: keys
        file_type: directory
        recurse: true
      register: lego_cert_v4_left
      failed_when: lego_cert_v4_left.matched > 0 and not ansible_check_mode

# --- first issuance ----------------------------------------------------------------
- name: "lego_cert | Issue the certificate (first run only)"
  ansible.builtin.command:
    argv: "{{ lego_cert_argv }}"
    creates: "{{ lego_cert_crt }}"
    chdir: "{{ lego_cert_dir }}"
  environment:
    CF_DNS_API_TOKEN: "{{ lego_cert_cf_token }}"
    CF_ZONE_API_TOKEN: "{{ lego_cert_cf_token }}"
    LEGO_PATH: "{{ lego_cert_path }}"
  no_log: true

# --- renewal: systemd, no script ---------------------------------------------------
- name: "lego_cert | The failure notifier (OnFailure= target)"
  ansible.builtin.include_role:
    name: systemd_failure_alert
  when: lego_cert_on_failure | bool

- name: "lego_cert | Deploy unit (started by the renew hook)"
  ansible.builtin.template:
    src: lego-deploy.service.j2
    dest: "/etc/systemd/system/lego-deploy-{{ lego_cert_id }}.service"
    owner: root
    group: root
    mode: "0644"
  register: lego_cert_deploy_unit
  when: lego_cert_deploy_steps | length > 0

- name: "lego_cert | Renewal service + timer"
  ansible.builtin.template:
    src: "lego-renew.{{ item }}.j2"
    dest: "/etc/systemd/system/lego-renew-{{ lego_cert_id }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: [service, timer]
  register: lego_cert_units

- name: "lego_cert | Reload systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: (lego_cert_units is changed) or (lego_cert_deploy_unit is changed)

- name: "lego_cert | Timer enabled + running"
  ansible.builtin.systemd_service:
    name: "lego-renew-{{ lego_cert_id }}.timer"
    enabled: true
    state: started
  # --check never wrote a NEW unit, so there is nothing to start yet.
  when: not ansible_check_mode or (lego_cert_units is not changed)

# --- retire the per-role cron + script this replaces -------------------------------
- name: "lego_cert | Remove the old renewal cron"
  ansible.builtin.cron:
    name: "{{ lego_cert_legacy_cron }}"
    cron_file: "{{ lego_cert_legacy_cron }}"
    state: absent
  when: lego_cert_legacy_cron | length > 0

# The systemd units replaced it; git holds its history — no copy stays on the host.
- name: "lego_cert | The old renewal script (and the copy an earlier run archived)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ lego_cert_legacy_script }}"
    - "{{ lego_cert_dir }}/retired-{{ lego_cert_legacy_script | basename }}"
  when: lego_cert_legacy_script | length > 0
