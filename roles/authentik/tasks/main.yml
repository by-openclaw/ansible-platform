---
# ==============================================================================
# Role: authentik — dispatcher
# ==============================================================================
- name: Provision the Authentik database
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    postgres_db_vault_path: "{{ platform_env }}/authentik/db-pgsql"
    postgres_db_name: "{{ authentik_pg_name }}"
    postgres_db_user: "{{ authentik_pg_user }}"
  when: inventory_hostname == authentik_first_member
  tags: [authentik, database]

- name: Resolve / generate Authentik secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [authentik, secrets]

- name: Run the Authentik containers (server + worker)
  ansible.builtin.import_tasks: containers.yml
  tags: [authentik, container]

- name: The LDAP provider, its application, the bind account and the bind flow (one blueprint)
  ansible.builtin.import_tasks: ldap_provider.yml
  when: authentik_ldap_enabled | bool
  tags: [authentik, ldap]

- name: Run the LDAP outpost (LDAPS for the OPNsense WebGUI)
  ansible.builtin.import_tasks: ldap.yml
  when:
    - authentik_ldap_enabled | bool
    - inventory_hostname == authentik_first_member
  tags: [authentik, container, ldap]

- name: "LDAP outpost TLS certificate — platform wildcard, synced from Traefik"
  ansible.builtin.import_tasks: ldap_cert.yml
  when: inventory_hostname == authentik_first_member
  tags: [authentik, ldap, ldap-cert]

- name: "LDAP bind test — certificate verified, bind with the bind account"
  ansible.builtin.import_tasks: ldap_bind_test.yml
  when:
    - authentik_ldap_enabled | bool
    - inventory_hostname == authentik_first_member
  tags: [authentik, ldap, ldap-bind]

- name: Provision per-service OIDC blueprints (SSO)
  ansible.builtin.import_tasks: blueprints.yml
  tags: [authentik, blueprints, sso]

- name: Publish Authentik via Traefik (public + rate-limit)
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: authentik
    traefik_route_fqdn: "{{ authentik_fqdn }}"
    # Every instance behind the one name; an instance that is not ready receives no traffic.
    traefik_route_backend_urls: >-
      {{ authentik_members | map('extract', hostvars, 'ansible_host')
         | map('regex_replace', '^', 'http://') | map('regex_replace', '$', ':' ~ authentik_host_port) | list }}
    traefik_route_health_path: "{{ authentik_health_path }}"
    traefik_route_health_interval: "2s"     # its readiness asks the database: a little more time than the default
    traefik_route_health_timeout: "1500ms"
    traefik_route_internal_only: false
  when: inventory_hostname == authentik_first_member
  tags: [authentik, route]
