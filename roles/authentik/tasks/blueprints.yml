---
# Render one OIDC blueprint per cluster service into the mounted blueprints dir.
# Authentik's worker auto-discovers + applies them (declarative, idempotent). A
# change to any file notifies the restart handler so the worker re-applies now
# instead of on its next poll.
- name: "blueprints | Ensure the host blueprints dir exists"
  ansible.builtin.file:
    path: "{{ authentik_blueprints_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "blueprints | Render the per-service OIDC blueprints"
  ansible.builtin.template:
    src: oidc-app.yaml.j2
    dest: "{{ authentik_blueprints_dir }}/oidc-{{ app.slug }}.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ authentik_oidc_resolved }}"
  loop_control:
    loop_var: app
    label: "{{ app.slug }}"
  no_log: true   # app carries client_secret
  notify: Restart authentik

- name: "blueprints | Render the forwardAuth (proxy) blueprint for no-auth apps"
  ansible.builtin.template:
    src: proxy-apps.yaml.j2
    dest: "{{ authentik_blueprints_dir }}/proxy-apps.yaml"
    owner: root
    group: root
    mode: "0644"
  when: authentik_proxy_apps | default([]) | length > 0
  notify: Restart authentik

- name: "blueprints | Retire proxy providers that are declared retired (the OIDC provider of the same name can then exist)"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - authentik-server
      - ak
      - shell
      - -c
      - |
        from authentik.providers.proxy.models import ProxyProvider
        names = {{ authentik_proxy_apps_retired | default([]) | to_json }}
        qs = ProxyProvider.objects.filter(name__in=names)
        n = qs.count()
        for p in qs:
            for o in p.outpost_set.all():
                o.providers.remove(p)
        qs.delete()
        print("retired=%d" % n)
  register: authentik_proxy_retired
  changed_when: "'retired=0' not in authentik_proxy_retired.stdout"
  when: authentik_proxy_apps_retired | default([]) | length > 0
  notify: Restart authentik

# Blueprints are applied on file change or on the discovery schedule: after a retirement
# the OIDC blueprint of the same slug is unchanged, so its provider would only appear on
# the next cycle — apply it now (idempotent; no restart involved).
- name: "blueprints | Apply the OIDC blueprint of each retired proxy app now (the provider it was blocking)"
  ansible.builtin.command:
    argv: [docker, exec, authentik-server, ak, apply_blueprint, "/blueprints/custom/oidc-{{ item }}.yaml"]
  loop: "{{ authentik_proxy_apps_retired | default([]) }}"
  register: authentik_retired_apply
  changed_when: "'applied' in ((authentik_retired_apply.stdout ~ authentik_retired_apply.stderr) | lower)"
  failed_when: authentik_retired_apply.rc != 0 and 'No such file' not in (authentik_retired_apply.stderr | default(''))
  when: authentik_proxy_apps_retired | default([]) | length > 0

- name: "blueprints | Render the identity blueprint (groups + users)"
  ansible.builtin.template:
    src: identity.yaml.j2
    dest: "{{ authentik_blueprints_dir }}/identity-core.yaml"
    owner: root
    group: root
    mode: "0644"
  no_log: true   # users carry email/name
  notify: Restart authentik

# Apply immediately so callers don't wait for the worker's poll interval.
- name: "blueprints | Flush handlers to apply blueprints now"
  ansible.builtin.meta: flush_handlers

# Passwords can't be set in a blueprint (Authentik hashes them) — set via API
# once the blueprint has created the user. Wait for the API + the user to exist.
- name: "blueprints | Wait for the Authentik API to be ready"
  ansible.builtin.uri:
    url: "http://{{ authentik_listen_ip }}:{{ authentik_host_port }}/-/health/ready/"
    status_code: [200, 204]
  register: authentik_ready
  check_mode: false   # read-only GET: must run under --check too (later tasks read its json)
  retries: 30
  delay: 5
  until: authentik_ready.status in [200, 204]

- name: "blueprints | Resolve user pks (wait for the blueprint to create them)"
  ansible.builtin.uri:
    url: "http://{{ authentik_listen_ip }}:{{ authentik_host_port }}/api/v3/core/users/?username={{ user.username }}"
    headers:
      Authorization: "Bearer {{ authentik_secrets.bootstrap_token }}"
  register: authentik_user_lookup
  check_mode: false   # read-only GET: must run under --check too (later tasks read its json)
  retries: 24
  delay: 5
  until: (authentik_user_lookup.json.results | default([])) | length > 0
  loop: "{{ authentik_users_resolved }}"
  loop_control:
    loop_var: user
    label: "{{ user.username }}"
  no_log: true

- name: "blueprints | Set user passwords (initial; rotate after first login)"
  ansible.builtin.uri:
    url: "http://{{ authentik_listen_ip }}:{{ authentik_host_port }}/api/v3/core/users/{{ item.0.json.results[0].pk }}/set_password/"
    method: POST
    headers:
      Authorization: "Bearer {{ authentik_secrets.bootstrap_token }}"
    body_format: json
    body:
      password: "{{ item.1.password }}"
    status_code: [204]
  loop: "{{ authentik_user_lookup.results | zip(authentik_users_resolved) | list }}"
  loop_control:
    label: "{{ item.1.username }}"
  no_log: true
