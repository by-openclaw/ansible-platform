---
# Authentik's own secrets, all from Vault (no controller files). secret_key and the
# bootstrap admin are get-or-create; DB and Redis passwords are plain reads (their
# owners — postgres_db and the redis role — create them). All facts no_log.
- name: "secrets | Authentik secret_key + bootstrap admin (Vault, get-or-create)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ authentik_vault_path }}"
    vault_secret_init:
      secret_key: "{{ lookup('community.general.random_string', length=60, special=false) }}"
      bootstrap_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
      bootstrap_token: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      url: "https://{{ authentik_fqdn }}"
      email: "{{ authentik_bootstrap_email }}"

- name: "secrets | Bind them"
  ansible.builtin.set_fact:
    authentik_secrets: "{{ vault_secret_result }}"
  no_log: true

- name: "secrets | The PostgreSQL password (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ authentik_pg_vault_path }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    authentik_pg_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "secrets | The Redis password (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ authentik_redis_vault_path }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    authentik_redis_password: "{{ vault_secret_result.password }}"
  no_log: true

# Own mail flow: authentik@ service mailbox (mailbox concern-role), NOT Resend.
- name: "secrets | Read the authentik mailbox creds from Vault (read-only)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ platform_env | default('prod') }}/mail/authentik"
    vault_secret_init: {}          # the mailbox role mints these

- name: "secrets | Assemble the SMTP settings (our Mailcow, asset FQDN)"
  ansible.builtin.set_fact:
    authentik_mail:
      smtp_host: "{{ groups['mailcow'] | first }}.{{ platform_domain }}"
      smtp_port: 587
      smtp_username: "{{ vault_secret_result.address }}"
      smtp_password: "{{ vault_secret_result.password }}"
      from_address: "{{ vault_secret_result.address }}"
  no_log: true

- name: "secrets | Build the Authentik environment"
  ansible.builtin.set_fact:
    authentik_env:
      AUTHENTIK_SECRET_KEY: "{{ authentik_secrets.secret_key }}"
      AUTHENTIK_POSTGRESQL__HOST: "{{ authentik_pg_host }}"
      AUTHENTIK_POSTGRESQL__PORT: "{{ authentik_pg_port | string }}"
      AUTHENTIK_POSTGRESQL__NAME: "{{ authentik_pg_name }}"
      AUTHENTIK_POSTGRESQL__USER: "{{ authentik_pg_user }}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "{{ authentik_pg_password }}"
      AUTHENTIK_POSTGRESQL__SSLMODE: "verify-full"
      AUTHENTIK_POSTGRESQL__SSLROOTCERT: "/etc/ssl/certs/ca-certificates.crt"
      AUTHENTIK_POSTGRESQL__CONN_MAX_AGE: "{{ authentik_pg_conn_max_age | string }}"
      AUTHENTIK_POSTGRESQL__CONN_HEALTH_CHECKS: "{{ 'true' if authentik_pg_conn_health_checks | bool else 'false' }}"
      AUTHENTIK_REDIS__HOST: "{{ authentik_redis_host }}"
      AUTHENTIK_REDIS__PORT: "{{ authentik_redis_port | string }}"
      AUTHENTIK_REDIS__PASSWORD: "{{ authentik_redis_password }}"
      AUTHENTIK_REDIS__TLS: "true"
      AUTHENTIK_REDIS__TLS_REQS: "required"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ authentik_secrets.bootstrap_password }}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_secrets.bootstrap_token }}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "{{ authentik_bootstrap_email }}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_EMAIL__HOST: "{{ authentik_mail.smtp_host }}"
      AUTHENTIK_EMAIL__PORT: "{{ authentik_mail.smtp_port | string }}"
      AUTHENTIK_EMAIL__USERNAME: "{{ authentik_mail.smtp_username }}"
      AUTHENTIK_EMAIL__PASSWORD: "{{ authentik_mail.smtp_password }}"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__USE_TLS: "true"     # 587 STARTTLS (SVC-12)
      AUTHENTIK_EMAIL__FROM: "{{ authentik_mail.from_address }}"
      AUTHENTIK_EMAIL__TIMEOUT: "30"
  no_log: true

# --- OIDC client creds + identity users, from Vault in one batch ---------------
# OIDC apps are get-or-create: a new app is minted on first run, an existing one is
# read. Users are plain reads (no init): an absent user secret fails the run rather
# than inventing a password.
- name: "secrets | What each OIDC app needs, and what to mint if it is absent"
  ansible.builtin.set_fact:
    authentik_vault_wanted: >-
      {%- set out = [] -%}
      {%- for app in authentik_oidc_apps -%}
        {%- set _ = out.append({
              'path': app.vault_path,
              'init': {'client_id': lookup('community.general.random_string', length=40, special=false),
                       'client_secret': lookup('community.general.random_string', length=64, special=false),
                       'app': app.slug,
                       'note': 'Authentik OIDC client (ansible-generated, Vault-native)'}}) -%}
      {%- endfor -%}
      {%- for u in authentik_users -%}
        {%- set _ = out.append({'path': u.vault_path, 'init': {}}) -%}
      {%- endfor -%}
      {{ out }}
  no_log: true

- name: "secrets | OIDC client creds + user secrets (Vault)"
  ansible.builtin.include_role:
    name: vault_secret
    tasks_from: many
  vars:
    vault_secret_paths: "{{ authentik_vault_wanted }}"

- name: "secrets | Resolve OIDC client creds for blueprint apps"
  ansible.builtin.set_fact:
    authentik_oidc_resolved: "{{ authentik_oidc_resolved | default([]) + [item | combine({'client_id': _c.client_id, 'client_secret': _c.client_secret})] }}"
  loop: "{{ authentik_oidc_apps }}"
  loop_control:
    label: "{{ item.slug }}"
  vars:
    _c: "{{ vault_secret_results[item.vault_path] }}"
  no_log: true

- name: "secrets | Resolve identity users (username/name/email/groups/password)"
  ansible.builtin.set_fact:
    authentik_users_resolved: >-
      {{ authentik_users_resolved | default([])
         + [{'username': _u.username, 'name': _u.name, 'email': _u.email,
             'groups': (_p | length > 0) | ternary(_p[0].groups | default([]), _u.groups),
             'password': _u.password}] }}
  loop: "{{ authentik_users }}"
  loop_control:
    label: "{{ item.username }}"
  vars:
    _u: "{{ vault_secret_results[item.vault_path] }}"
    # platform_people (group_vars/all/people.yml) is the single source of group
    # membership; the `groups` field in the user secret is the legacy fallback.
    _p: "{{ platform_people | default([]) | selectattr('username', 'equalto', item.username) | list }}"
  no_log: true
