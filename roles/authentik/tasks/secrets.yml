---
# Authentik secret_key + bootstrap admin creds: reuse the controller secret if
# present, else generate + persist. DB/Redis passwords are loaded from their own
# secret files (written by postgres_db / the redis role). All facts no_log.
- name: "secrets | Stat authentik secret on controller"
  ansible.builtin.stat:
    path: "{{ authentik_secret_dir }}/{{ authentik_secret_file }}"
  delegate_to: localhost
  become: false
  register: authentik_secret_stat

- name: "secrets | Load existing authentik secrets"
  ansible.builtin.set_fact:
    authentik_secrets: "{{ (lookup('file', authentik_secret_dir + '/' + authentik_secret_file) | from_json).fields }}"
  no_log: true
  when: authentik_secret_stat.stat.exists

- name: "secrets | Generate authentik secrets"
  ansible.builtin.set_fact:
    authentik_secrets:
      secret_key: "{{ lookup('community.general.random_string', length=60, special=false) }}"
      bootstrap_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
      bootstrap_token: "{{ lookup('community.general.random_string', length=40, special=false) }}"
  no_log: true
  when: not authentik_secret_stat.stat.exists

- name: "secrets | Persist authentik secret (0600)"
  ansible.builtin.copy:
    dest: "{{ authentik_secret_dir }}/{{ authentik_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (authentik_secrets | combine({'url': 'https://' + authentik_fqdn, 'email': authentik_bootstrap_email}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not authentik_secret_stat.stat.exists

- name: "secrets | Load the PostgreSQL password"
  ansible.builtin.set_fact:
    authentik_pg_password: "{{ (lookup('file', authentik_secret_dir + '/' + authentik_pg_secret_file) | from_json).fields.password }}"
  no_log: true

- name: "secrets | Load the Redis password"
  ansible.builtin.set_fact:
    authentik_redis_password: "{{ (lookup('file', authentik_secret_dir + '/' + authentik_redis_secret_file) | from_json).fields.password }}"
  no_log: true

# Own mail flow: authentik@ service mailbox (mailbox concern-role), NOT Resend.
- name: "secrets | Read the authentik mailbox creds from Vault (read-only)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ platform_env | default('prod') }}/mail/authentik"
    vault_secret_init: {}          # the mailbox role mints these

- name: "secrets | Assemble the SMTP settings (our Mailcow, asset FQDN)"
  ansible.builtin.set_fact:
    authentik_mail:
      smtp_host: "vm-mailcow-01.{{ platform_domain | default('by-research.be') }}"
      smtp_port: 587
      smtp_username: "{{ vault_secret_result.address }}"
      smtp_password: "{{ vault_secret_result.password }}"
      from_address: "{{ vault_secret_result.address }}"
  no_log: true

- name: "secrets | Build the Authentik environment"
  ansible.builtin.set_fact:
    authentik_env:
      AUTHENTIK_SECRET_KEY: "{{ authentik_secrets.secret_key }}"
      AUTHENTIK_POSTGRESQL__HOST: "{{ authentik_pg_host }}"
      AUTHENTIK_POSTGRESQL__PORT: "{{ authentik_pg_port | string }}"
      AUTHENTIK_POSTGRESQL__NAME: "{{ authentik_pg_name }}"
      AUTHENTIK_POSTGRESQL__USER: "{{ authentik_pg_user }}"
      AUTHENTIK_POSTGRESQL__PASSWORD: "{{ authentik_pg_password }}"
      AUTHENTIK_POSTGRESQL__SSLMODE: "verify-full"
      AUTHENTIK_POSTGRESQL__SSLROOTCERT: "/etc/ssl/certs/ca-certificates.crt"
      AUTHENTIK_POSTGRESQL__CONN_MAX_AGE: "{{ authentik_pg_conn_max_age | string }}"
      AUTHENTIK_POSTGRESQL__CONN_HEALTH_CHECKS: "{{ 'true' if authentik_pg_conn_health_checks | bool else 'false' }}"
      AUTHENTIK_REDIS__HOST: "{{ authentik_redis_host }}"
      AUTHENTIK_REDIS__PORT: "{{ authentik_redis_port | string }}"
      AUTHENTIK_REDIS__PASSWORD: "{{ authentik_redis_password }}"
      AUTHENTIK_REDIS__TLS: "true"
      AUTHENTIK_REDIS__TLS_REQS: "required"
      AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ authentik_secrets.bootstrap_password }}"
      AUTHENTIK_BOOTSTRAP_TOKEN: "{{ authentik_secrets.bootstrap_token }}"
      AUTHENTIK_BOOTSTRAP_EMAIL: "{{ authentik_bootstrap_email }}"
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
      AUTHENTIK_EMAIL__HOST: "{{ authentik_mail.smtp_host }}"
      AUTHENTIK_EMAIL__PORT: "{{ authentik_mail.smtp_port | string }}"
      AUTHENTIK_EMAIL__USERNAME: "{{ authentik_mail.smtp_username }}"
      AUTHENTIK_EMAIL__PASSWORD: "{{ authentik_mail.smtp_password }}"
      AUTHENTIK_EMAIL__USE_SSL: "false"
      AUTHENTIK_EMAIL__USE_TLS: "true"     # 587 STARTTLS (SVC-12)
      AUTHENTIK_EMAIL__FROM: "{{ authentik_mail.from_address }}"
      AUTHENTIK_EMAIL__TIMEOUT: "30"
  no_log: true

# --- Vault-native OIDC apps (item carries vault_path) — read creds from Vault ----
# The GitLab chain is Vault-native: its client creds live in Vault, not a file.
# Apps still carrying secret_file keep the file logic below (Phase-2 migration).
- name: "secrets | Authenticate to Vault (ansible-deploy AppRole; root fallback)"
  ansible.builtin.include_role:
    name: vault_login

- name: "secrets | Use the deploy token (for Vault-native OIDC apps)"
  ansible.builtin.set_fact:
    authentik_vault_token: "{{ vault_deploy_token }}"
  no_log: true
  when: authentik_oidc_apps | selectattr('vault_path', 'defined') | list | length > 0

# Get-or-create (symmetric with the file-based apps below): read each Vault-native
# app's creds; MINT client_id/client_secret for any that don't exist yet, then
# re-read. Onboarding a new Vault-native OIDC app is thus fully ansible-native.
# Mint writes via STDIN (no argv) so secrets never hit the process list.
- name: "secrets | Read Vault-native OIDC client creds (tolerate absent)"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ authentik_vault_token }} vault
      vault kv get -mount=secret -format=json {{ item.vault_path }}
  delegate_to: lxc-vault-01
  become: true
  loop: "{{ authentik_oidc_apps | selectattr('vault_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.slug }}"
  register: authentik_oidc_vault_read
  changed_when: false
  failed_when: false
  no_log: true

- name: "secrets | Mint missing Vault-native OIDC client creds (stdin, no argv)"
  ansible.builtin.command:
    cmd: >-
      docker exec -i -e VAULT_TOKEN={{ authentik_vault_token }} vault
      vault kv put -mount=secret {{ item.item.vault_path }} -
    stdin: >-
      {{ {'client_id': lookup('community.general.random_string', length=40, special=false),
          'client_secret': lookup('community.general.random_string', length=64, special=false),
          'app': item.item.slug,
          'note': 'Authentik OIDC client (ansible-generated, Vault-native)'} | to_json }}
  delegate_to: lxc-vault-01
  become: true
  loop: "{{ authentik_oidc_vault_read.results }}"
  loop_control:
    label: "{{ item.item.slug }}"
  when: item.rc != 0
  changed_when: true
  no_log: true

- name: "secrets | Re-read Vault-native OIDC client creds (now all present)"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ authentik_vault_token }} vault
      vault kv get -mount=secret -format=json {{ item.vault_path }}
  delegate_to: lxc-vault-01
  become: true
  loop: "{{ authentik_oidc_apps | selectattr('vault_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.slug }}"
  register: authentik_oidc_vault
  check_mode: false   # read-only Vault GET — must also run under --check, else the resolve step fails
  changed_when: false
  no_log: true

# Generate a client_id/client_secret for any FILE-based OIDC app missing its secret
# file, so onboarding a new SSO app is fully ansible-native (the repo's stated
# model). Idempotent + NON-destructive: existing files are stat-gated and never
# touched — only NEW file-based apps get fresh creds. Vault-native apps skip this.
- name: "secrets | Stat each file-based OIDC app's client secret file"
  ansible.builtin.stat:
    path: "{{ authentik_secret_dir }}/{{ item.secret_file }}"
  delegate_to: localhost
  become: false
  loop: "{{ authentik_oidc_apps | rejectattr('vault_path', 'defined') | list }}"
  loop_control:
    label: "{{ item.slug }}"
  register: authentik_oidc_secret_stat

- name: "secrets | Generate + persist missing OIDC client secrets (0600)"
  ansible.builtin.copy:
    dest: "{{ authentik_secret_dir }}/{{ item.item.secret_file }}"
    mode: "0600"
    content: >-
      {{ {'fields': {
        'client_id': lookup('community.general.random_string', length=40, special=false),
        'client_secret': lookup('community.general.random_string', length=64, special=false),
        'app': item.item.slug,
        'note': 'Authentik OIDC client (ansible-generated)'
      }} | to_nice_json }}
  delegate_to: localhost
  become: false
  no_log: true
  loop: "{{ authentik_oidc_secret_stat.results }}"
  loop_control:
    label: "{{ item.item.slug }}"
  when: not item.stat.exists

# Merge each OIDC app's client_id/client_secret into the apps list so the blueprint
# template can render them — from Vault (vault_path apps) or the file (others).
- name: "secrets | Resolve OIDC client creds for blueprint apps"
  ansible.builtin.set_fact:
    authentik_oidc_resolved: "{{ authentik_oidc_resolved | default([]) + [item | combine({'client_id': _c.client_id, 'client_secret': _c.client_secret})] }}"
  loop: "{{ authentik_oidc_apps }}"
  loop_control:
    label: "{{ item.slug }}"
  vars:
    _c: >-
      {{ ((authentik_oidc_vault.results | default([]) | selectattr('item.slug', 'equalto', item.slug)
           | first).stdout | from_json).data.data
         if item.vault_path is defined
         else (lookup('file', authentik_secret_dir + '/' + item.secret_file) | from_json).fields }}
  no_log: true

- name: "secrets | Resolve identity users (username/name/email/groups/password)"
  ansible.builtin.set_fact:
    authentik_users_resolved: >-
      {{ authentik_users_resolved | default([])
         + [{'username': _u.username, 'name': _u.name, 'email': _u.email,
             'groups': (_p | length > 0) | ternary(_p[0].groups | default([]), _u.groups),
             'password': _u.password}] }}
  loop: "{{ authentik_users }}"
  loop_control:
    label: "{{ item.username }}"
  vars:
    _u: "{{ (lookup('file', authentik_secret_dir + '/' + item.secret_file) | from_json).fields }}"
    # platform_people (group_vars/all/people.yml) is the single source of group
    # membership; the `groups` field in the user secret file is the legacy fallback.
    _p: "{{ platform_people | default([]) | selectattr('username', 'equalto', item.username) | list }}"
  no_log: true
