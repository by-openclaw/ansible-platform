---
# ==============================================================================
# authentik | ldap_bind_test — what a tool does: LDAPS to the directory's name, the
# certificate verified against that name, a bind with the bind account. A self-signed
# certificate or a flow a bind cannot answer fails here, on every run.
# ==============================================================================
- name: "LDAP bind | The bind account's password (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ authentik_ldap_bind_vault_path }}"

- name: "LDAP bind | Bind over LDAPS, certificate verified against {{ authentik_ldap_fqdn }}"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - LPW
      - "{{ authentik_server_container }}"
      - python3
      - -c
      - |
        import os, ssl
        from ldap3 import Server, Connection, Tls
        tls = Tls(validate=ssl.CERT_REQUIRED, ca_certs_file="{{ authentik_ca_bundle }}")
        server = Server("{{ authentik_ldap_fqdn }}", port={{ authentik_ldap_port }}, use_ssl=True, tls=tls, connect_timeout={{ authentik_ldap_bind_test_timeout }})
        conn = Connection(server, user="cn={{ authentik_ldap_bind_account }},{{ authentik_ldap_users_ou }},{{ authentik_ldap_base_dn }}", password=os.environ["LPW"], receive_timeout={{ authentik_ldap_bind_test_timeout * 2 }})
        try:
            print("BIND_OK" if conn.bind() else "BIND_REFUSED %s" % conn.result.get("description"))
        except Exception as exc:
            print("BIND_ERROR %s" % type(exc).__name__, str(exc)[:200])
  environment:
    LPW: "{{ vault_secret_result.password }}"
  register: authentik_ldap_bind
  until: "'BIND_OK' in authentik_ldap_bind.stdout"
  retries: "{{ authentik_ldap_bind_test_retries }}"
  delay: "{{ authentik_ldap_bind_test_delay }}"
  changed_when: false
  failed_when: "'BIND_OK' not in authentik_ldap_bind.stdout"
  check_mode: false   # read-only probe

- name: "LDAP bind | Result"
  ansible.builtin.debug:
    msg: "LDAPS {{ authentik_ldap_fqdn }}:{{ authentik_ldap_port }} — certificate verified, bind as {{ authentik_ldap_bind_account }}: {{ authentik_ldap_bind.stdout | trim }}"
