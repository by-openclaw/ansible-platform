---
# ==============================================================================
# authentik | ldap_bind_test — what a tool does: LDAPS to the directory's name, the
# certificate verified against that name, a bind with the bind account. A self-signed
# certificate or a flow a bind cannot answer fails here, on every run.
# ==============================================================================
- name: "LDAP bind | The LDAP client library the bind test needs on this host"
  ansible.builtin.apt:
    name: "{{ authentik_ldap_test_package }}"
    state: present

- name: "LDAP bind | The bind account's password (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ authentik_ldap_bind_vault_path }}"

- name: "LDAP bind | Bind over LDAPS, certificate verified against {{ authentik_ldap_fqdn }}"
  community.general.ldap_search:
    server_uri: "ldaps://{{ authentik_ldap_fqdn }}:{{ authentik_ldap_port }}"
    validate_certs: true
    ca_path: "{{ authentik_ca_bundle }}"
    bind_dn: "cn={{ authentik_ldap_bind_account }},{{ authentik_ldap_users_ou }},{{ authentik_ldap_base_dn }}"
    bind_pw: "{{ vault_secret_result.password }}"
    dn: "{{ authentik_ldap_base_dn }}"
    scope: base
    attrs: ["dn"]
  register: authentik_ldap_bind
  retries: "{{ authentik_ldap_bind_test_retries }}"
  delay: "{{ authentik_ldap_bind_test_delay }}"
  until: authentik_ldap_bind is succeeded
  check_mode: false   # read-only probe
  no_log: true

- name: "LDAP bind | Result"
  ansible.builtin.debug:
    msg: "LDAPS {{ authentik_ldap_fqdn }}:{{ authentik_ldap_port }} — certificate verified, bind as {{ authentik_ldap_bind_account }}: ok"
