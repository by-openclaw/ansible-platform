---
# Server and worker through the scaffold's containers step (the one owner of "run a pinned
# container").
- name: "containers | authentik server + worker (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: authentik
      containers:
        - name: authentik-server
          image: "{{ authentik_image }}"
          command: server
          published:
            - "{{ authentik_listen_ip }}:{{ authentik_host_port }}:9000"
            - "{{ authentik_listen_ip }}:{{ authentik_metrics_port }}:9300"   # /metrics for Prometheus (INF-33)
          volumes:
            - "{{ authentik_media_volume }}:/media"
            - "{{ authentik_templates_volume }}:/templates"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
            - "{{ authentik_blueprints_dir }}:/blueprints/custom:ro"
          env: "{{ authentik_env }}"
        - name: authentik-worker
          image: "{{ authentik_image }}"
          command: worker
          volumes:
            - "{{ authentik_media_volume }}:/media"
            - "{{ authentik_templates_volume }}:/templates"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
            - "{{ authentik_blueprints_dir }}:/blueprints/custom:ro"
            # Worker manages embedded/Docker outposts via the Docker socket.
            - "/var/run/docker.sock:/var/run/docker.sock"
          env: "{{ authentik_env }}"

- name: "containers | Wait for Authentik to be ready"
  ansible.builtin.uri:
    url: "http://{{ authentik_listen_ip }}:{{ authentik_host_port }}/-/health/ready/"
    status_code: [200, 204]
  register: authentik_ready
  check_mode: false   # read-only GET: must run under --check too (later tasks read its json)
  retries: 40
  delay: 5
  until: authentik_ready.status in [200, 204]
  changed_when: false
