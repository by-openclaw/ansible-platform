---
# ==============================================================================
# Role: authentik — SSO / Identity Provider (Docker) on lxc-authentik-01 (SVC)
# server + worker containers (same image). Uses the shared cluster PostgreSQL
# (postgres_db: authentik) + Redis, both over verified TLS. Fronted by Traefik
# (wildcard TLS). Upgrade = bump authentik_image tag.
# ==============================================================================
authentik_image: "ghcr.io/goauthentik/server:2026.5.2"   # pinned (never :latest)

authentik_fqdn: "authentik.by-research.be"

# Server HTTP backend (Traefik terminates TLS) — published on the SVC IP.
authentik_listen_ip: "10.1.3.130"
authentik_host_port: 9000
authentik_container_port: 9000

# Shared PostgreSQL (DB + role created by the postgres_db role).
authentik_pg_host: "lxc-pgsql-01.by-research.be"
authentik_pg_port: 5432
authentik_pg_name: "authentik"
authentik_pg_user: "authentik"

# Shared Redis.
authentik_redis_host: "lxc-redis-01.by-research.be"
authentik_redis_port: 6379

# Controller secret store.
authentik_secret_dir: "~/.openclaw/workspace/infra/secrets"
authentik_secret_file: "authentik.json"               # secret_key + bootstrap
authentik_pg_secret_file: "db-pgsql-authentik.json"   # written by postgres_db
authentik_redis_secret_file: "db-redis.json"

# Initial admin (akadmin).
authentik_bootstrap_email: "admin@by-research.be"

# Persistent volumes.
authentik_media_volume: "authentik-media"
authentik_templates_volume: "authentik-templates"

# --- OIDC / SSO blueprints (declarative, one per cluster service) ----------------
# Host dir mounted into the containers at /blueprints/custom; Authentik auto-applies.
authentik_blueprints_dir: "/opt/authentik/blueprints"
# Each entry → one OIDC app. client_id/client_secret are loaded from secret_file
# (app-oidc-<slug>.json under the workspace secrets dir) in secrets.yml. Add a
# service here to wire its SSO — same pattern for every svc.
authentik_oidc_apps:
  - slug: vault
    launch_url: "https://vault.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/hashicorp-vault.svg"
    name: "Vault"
    group: "vault-admins"
    secret_file: "app-oidc-vault.json"
    redirect_uris:
      - "https://vault.by-research.be/ui/vault/auth/oidc/oidc/callback"
      - "http://localhost:8250/oidc/callback"
  - slug: pgadmin
    launch_url: "https://pgadmin.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/pgadmin.svg"
    name: "pgAdmin"
    group: "pgadmin-admins"
    secret_file: "app-oidc-pgadmin.json"
    redirect_uris:
      - "https://pgadmin.by-research.be/oauth2/authorize"
  - slug: netbox
    launch_url: "https://netbox.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/netbox.svg"
    name: "NetBox"
    group: "netbox-admins"
    secret_file: "app-oidc-netbox.json"
    restrict_to_group: true     # IdP-enforced: only netbox-admins can log in
    redirect_uris:
      - "https://netbox.by-research.be/oauth/complete/oidc/"
  - slug: vaultwarden
    launch_url: "https://vaultwarden.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden.svg"
    name: "Vaultwarden"
    group: "vaultwarden-admins"
    secret_file: "app-oidc-vaultwarden.json"
    restrict_to_group: true     # IdP-enforced: only vaultwarden-admins can log in
    force_email_verified: true  # vaultwarden rejects email_verified=False (authentik default)
    offline_access: true        # vaultwarden requests offline_access → needs refresh_token
    redirect_uris:
      - "https://vaultwarden.by-research.be/identity/connect/oidc-signin"
  - slug: nextcloud
    launch_url: "https://nextcloud.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nextcloud.svg"
    name: "Nextcloud"
    group: "nextcloud-users"    # ACCESS group — any member may log into Nextcloud
    admin_source_group: "nextcloud-admins"  # members of THIS group also get NC admin
    secret_file: "app-oidc-nextcloud.json"
    restrict_to_group: true     # IdP-enforced: only nextcloud-users can log in
    admin_group_alias: "admin"  # admin_source_group members → NC "admin" group
    redirect_uris:
      - "https://nextcloud.by-research.be/apps/user_oidc/code"
    logout_uris:                                # post_logout_redirect_uri (type=logout)
      - "https://nextcloud.by-research.be/"
  - slug: netbird
    launch_url: "https://vpn.by-research.be"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/netbird.svg"
    name: "NetBird"
    group: "netbird-users"        # ACCESS group — only members may authenticate
    secret_file: "app-oidc-netbird.json"
    restrict_to_group: true       # IdP-enforced: only netbird-users can log in
    # Multi-container NetBird logs in against Authentik DIRECTLY (no Dex), per the
    # goauthentik.io NetBird guide. The dashboard is a PUBLIC SPA doing PKCE; the
    # CLI/mobile use the device-code grant; the IdP manager uses client_credentials.
    client_type: public
    extra_grant_types:
      - client_credentials
      - "urn:ietf:params:oauth:grant-type:device_code"
    offline_access: true          # refresh tokens (NetBird requests offline_access)
    entitlements: true            # per the guide's Selected Scopes
    api_access: true              # goauthentik.io/api — IdP-manager directory reads
    # PKCE loopback (CLI/mobile) + the dashboard's /auth and /silent-auth callbacks.
    redirect_uris:
      - "http://localhost:53000"
    redirect_uris_regex:
      - "https://vpn\\.by-research\\.be/.*"
  - slug: proxmox
    launch_url: "https://10.6.224.105:8006"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/proxmox.svg"
    name: "Proxmox VE"
    group: "proxmox-admins"       # access group — only members may log into PVE
    secret_file: "app-oidc-proxmox.json"
    restrict_to_group: true       # IdP-enforced: only proxmox-admins can log in
    # PVE OIDC realm maps its username from the `sub` claim → email (goauthentik.io
    # PVE guide). The PVE realm's --username-claim must match this (email).
    sub_mode: user_email
    # PVE sends its UI base URL as the OIDC redirect_uri. Internal-only (OOB/mgmt).
    redirect_uris:
      - "https://10.6.224.105:8006"

# --- forwardAuth (proxy) blueprints — gate NO-AUTH apps behind Authentik SSO ------
# For apps that can't speak OIDC themselves (e.g. the Traefik dashboard, api@internal),
# Authentik fronts them with a Proxy Provider in `forward_single` mode, served by the
# built-in EMBEDDED OUTPOST (runs inside the authentik server at :9000, path
# /outpost.goauthentik.io/). Traefik calls it via forwardAuth: unauthenticated →
# redirect to Authentik; authenticated but not in `group` → 403. Add an app here to
# gate it — same "one list entry" pattern as authentik_oidc_apps.
authentik_proxy_apps:
  - slug: traefik-dashboard
    name: "Traefik Dashboard"
    group: "traefik-admins"                       # only this group passes forwardAuth
    external_host: "https://traefik.by-research.be"

# --- Identity: groups + human users (declarative) -------------------------------
# Passwords set via API from app-user-<username>.json after the blueprint creates
# the user (Authentik hashes them; can't be set in a blueprint).
authentik_groups:
  - platform-admins
  - proxmox-admins      # access group — only members may log into Proxmox VE (#145)
  - vault-admins
  - pgadmin-admins
  - netbox-admins
  - vaultwarden-admins
  - nextcloud-users     # access group — any member can use Nextcloud (OneDrive-like)
  - nextcloud-admins    # subset of users that additionally get NC admin rights
  - traefik-admins      # forwardAuth gate for the Traefik dashboard (admin-only svc)
  - netbird-users       # access group — only members may authenticate to NetBird VPN
  - netbird-admins      # NetBird admins (NetBird's own owner/admin role set in-app)
  - infra-admins
  - dev
# Groups whose members are Authentik superusers (can manage Authentik itself).
# platform-admins = top-level platform operators.
authentik_superuser_groups:
  - platform-admins
# Admin-account separation (EntraID-style): the daily-driver account (yboujraf)
# holds NO admin groups — it is a regular user. A SEPARATE privileged account
# (adm_yboujraf) holds the *-admins groups and is the Authentik superuser. Manage
# admin things only from adm_yboujraf. Break-glass beyond these: Authentik akadmin
# (bootstrap) + each app's local admin.
authentik_users:
  - username: yboujraf
    secret_file: "app-user-yboujraf.json"      # regular user (nextcloud-users)
  - username: adm_yboujraf
    secret_file: "app-user-adm_yboujraf.json"  # PRIVILEGED admin account

# Outbound email (password resets / MFA / notifications) via Resend (by-research).
authentik_resend_secret_file: "app-resend-by-research.json"

# --- LDAP provider + outpost (OPNsense WebGUI SSO; OPNsense can't speak OIDC) ------
# Authentik exposes LDAP via a dedicated LDAP outpost container that connects back to
# core with an outpost token. OPNsense binds as a service account and searches the
# directory to authenticate WebGUI users + read their group membership.
authentik_ldap_enabled: true
authentik_ldap_image: "ghcr.io/goauthentik/ldap:2026.5.2"   # pinned; match the server tag
authentik_ldap_slug: "ldap"
authentik_ldap_name: "LDAP"
authentik_ldap_base_dn: "dc=ldap,dc=by-research,dc=be"
# Bind/search service account: cn=<bind_account>,ou=users,<base_dn>. Password
# ansible-generated into the secret store (app-ldap-bind.json), set via the API.
authentik_ldap_bind_account: "ldapservice"
authentik_ldap_bind_secret_file: "app-ldap-bind.json"
# The bind account must search the whole directory to resolve any login user. Authentik
# grants the global "Search full LDAP directory" permission to ROLES (→ groups → users),
# not to a user directly, so we bind it through this role + same-named group.
authentik_ldap_search_role: "ldap-search"
# The outpost instance (manual deploy — no Docker service connection registered).
authentik_ldap_outpost_name: "authentik-ldap"
authentik_ldap_outpost_token_file: "app-ldap-outpost.json"   # outpost API token (read back)
# LDAPS is served with the platform wildcard *.by-research.be cert (Let's Encrypt via
# lego/Cloudflare on the cert-authority host) — NOT self-signed. OPNsense then connects
# by FQDN with certificate validation ON. Source mirrors the tls_cert role.
authentik_ldap_fqdn: "ldap.by-research.be"
authentik_ldap_cert_keypair_name: "wildcard-by-research"
authentik_ldap_cert_source_host: "lxc-traefik-01"
authentik_ldap_cert_source_crt: "/etc/lego/cert/certificates/_.by-research.be.crt"
authentik_ldap_cert_source_key: "/etc/lego/cert/certificates/_.by-research.be.key"
# Ports published on the SVC host (10.1.3.130) so OPNsense can reach them.
authentik_ldap_host_ldaps_port: 636    # → container 6636 (LDAPS / SSL)
authentik_ldap_host_ldap_port: 389     # → container 3389 (plain / StartTLS)
