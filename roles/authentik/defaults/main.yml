---
# ==============================================================================
# Role: authentik — SSO / Identity Provider (Docker) on lxc-authentik-01 (SVC)
# server + worker containers (same image). Uses the shared cluster PostgreSQL
# (postgres_db: authentik) + Redis, both over verified TLS. Fronted by Traefik
# (wildcard TLS). Upgrade = bump authentik_image tag.
# ==============================================================================
# Core image. Derived from authentik_version so the LDAP outpost tag below
# cannot drift away from it — one variable moves both.
authentik_image: "ghcr.io/goauthentik/server:{{ authentik_version }}"

authentik_fqdn: "{{ platform_service_fqdns.authentik }}"

# Server HTTP backend (Traefik terminates TLS) — published on the SVC IP.
authentik_listen_ip: "{{ hostvars[groups['authentik'] | first].ansible_host }}"
authentik_host_port: 9000
authentik_container_port: 9000

# Shared PostgreSQL (DB + role created by the postgres_db role).
authentik_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"
authentik_pg_port: 5432
authentik_pg_name: "authentik"
authentik_pg_user: "authentik"

# Shared Redis.
authentik_redis_host: "{{ groups['redis'] | first }}.{{ platform_domain }}"
authentik_redis_port: 6379

# Secrets — Vault only (secret/{env}/{service}/{key}); no controller files.
authentik_vault_path: "{{ platform_env }}/authentik/admin"          # secret_key + bootstrap (get-or-create)
authentik_pg_vault_path: "{{ platform_env }}/authentik/db-pgsql"    # postgres_db creates it
authentik_redis_vault_path: "{{ platform_env }}/redis/admin"        # the redis role owns it (shared)

# Initial admin (akadmin).
authentik_bootstrap_email: "admin@{{ platform_domain }}"

# Persistent volumes.
authentik_media_volume: "authentik-media"
authentik_templates_volume: "authentik-templates"

# --- OIDC / SSO blueprints (declarative, one per cluster service) ----------------
# Host dir mounted into the containers at /blueprints/custom; Authentik auto-applies.
authentik_blueprints_dir: "/opt/authentik/blueprints"
# The OIDC and proxy app registries live in inventory: group_vars/all/sso.yml
# (authentik_oidc_apps, authentik_proxy_apps, authentik_proxy_apps_retired).

# --- Identity: groups + human users (declarative) -------------------------------
# Passwords set via API from app-user-<username>.json after the blueprint creates
# the user (Authentik hashes them; can't be set in a blueprint).
# Derived from platform_service_groups + platform_standalone_groups (group_vars/all/identity.yml).
# It used to be a second hand-kept list, which is how four groups ended up live but unmanaged —
# a rebuild from this blueprint would have deleted them. The blueprint template is unchanged: it
# still iterates a flat list of names.
authentik_groups: >-
  {{ (platform_service_groups.values() | map('dict2items') | flatten | map(attribute='value') | list)
     + platform_standalone_groups | unique }}
# Groups whose members are Authentik superusers (can manage Authentik itself).
# platform-admins = top-level platform operators.
authentik_superuser_groups:
  - platform-admins
# Admin-account separation (EntraID-style): a daily-driver account holds NO admin
# groups — it is a regular user. A SEPARATE privileged account (adm_<name>) holds the
# *-admins groups and is the Authentik superuser; admin things are managed only from
# it. Break-glass beyond these: Authentik akadmin (bootstrap) + each app's local admin.
# Every person in platform_people (group_vars/all/people.yml) is an Authentik user; the
# user secret sits at {env}/authentik/user-<username, _ as -> (a convention, not a list).
# People are added, renamed or disabled in people.yml only — never here.
authentik_users: >-
  {%- set out = [] -%}
  {%- for p in platform_people -%}
    {%- set _ = out.append({'username': p.username,
                            'vault_path': platform_env ~ '/authentik/user-' ~ (p.username | replace('_', '-'))}) -%}
  {%- endfor -%}
  {{ out }}

# Outbound email (password resets / MFA / notifications) via Resend (by-research).
# RETIRED (2026-09-01): Resend replaced by the authentik@ service mailbox
# (Vault {env}/mail/authentik via the mailbox concern-role). Resend creds stay
# in Vault at resend/by-research.
# (was shared/app-resend-by-research.json; now Vault resend/<org>)

# ------------------------------------------------------------------------------
# LDAP outpost — the container that serves LDAPS for the OPNsense WebGUI login.
#
# This ran UNMANAGED until now: it was created by hand, so nothing in this role
# could move it and it drifted a full release behind the core (2026.5.2 while
# server/worker were on 2026.5.6). Outposts are expected to track the core
# version, so the tag is derived from authentik_version and cannot silently
# diverge again.
# ------------------------------------------------------------------------------
authentik_ldap_enabled: true
# renovate: datasource=docker depName=ghcr.io/goauthentik/server
authentik_version: "2026.5.6"
# Database connection lifetime. The upstream default (0) closes the connection after EVERY
# request: on this platform that was ~2 new TLS connections per second (12 363 in 70 min on
# 2026-09-22), one per forwardAuth/API call, so any slowdown stacked fresh connections until the
# shared cluster's ceiling (100) was hit and every route behind forwardAuth answered 500. With a
# lifetime, each gunicorn thread keeps its connection: the footprint is bounded by
# web workers × threads (2 × 4) + the worker (1 × 2) + the outposts, and the per-request TLS
# handshake (CPU on both containers) disappears. Health checks drop a stale connection before reuse.
authentik_pg_conn_max_age: 300
authentik_pg_conn_health_checks: true
authentik_ldap_image: "ghcr.io/goauthentik/ldap:{{ authentik_version }}"

# LDAPS only — no cleartext 389. Dual-stack: Docker will not bind v6 on its own
# even with ip6tables enabled, so both families are published explicitly.
authentik_ldap_port: 636
authentik_ldap_container_port: 6636

# Outpost API token, issued by Authentik and stored in Vault.
authentik_ldap_vault_path: "{{ platform_env }}/authentik/ldap-outpost"

# --- LDAP outpost TLS = platform wildcard (synced from the Traefik host, tasks/ldap_cert.yml) ---
authentik_ldap_cert_name: "wildcard-{{ platform_org }}"          # Authentik certificate-keypair name
authentik_ldap_provider_name: "ldap"                       # LDAP provider that must reference it
authentik_ldap_cert_src_host: "{{ groups['traefik'] | first }}"
authentik_ldap_cert_src_crt: "/etc/lego/cert/certificates/_.{{ platform_domain }}.crt"
authentik_ldap_cert_src_key: "/etc/lego/cert/certificates/_.{{ platform_domain }}.key"
authentik_ldap_container_name: "authentik-ldap"   # outpost container (tasks/ldap.yml)
