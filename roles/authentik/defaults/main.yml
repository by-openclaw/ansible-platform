---
# ==============================================================================
# Role: authentik — SSO / Identity Provider (Docker) on the authentik members (SVC)
# server + worker containers (same image). Uses the shared cluster PostgreSQL
# (postgres_db: authentik) over verified TLS. Fronted by Traefik
# (wildcard TLS). Upgrade = bump authentik_image tag.
# ==============================================================================
# Core image. Derived from authentik_version so the LDAP outpost tag below
# cannot drift away from it — one variable moves both.
authentik_image: "ghcr.io/goauthentik/server:{{ authentik_version }}"

authentik_fqdn: "{{ platform_service_fqdns.authentik }}"

# Server HTTP backend (Traefik terminates TLS) — published on the SVC IP.
authentik_listen_ip: "{{ ansible_host }}"
# The instances (services/0004 §Cluster placement): each runs a server and a worker on the
# shared PostgreSQL, behind the one edge route. What exists once for the whole deployment —
# the database, the LDAP outpost and its certificate, the API calls that follow the blueprints,
# the route — is done on the first member only; every member renders the same blueprints.
authentik_members: "{{ groups['authentik_cluster'] | default(groups['authentik']) }}"
authentik_first_member: "{{ groups['authentik'] | first }}"
authentik_health_path: "/-/health/ready/"
authentik_host_port: 9000
authentik_container_port: 9000

# Shared PostgreSQL (DB + role created by the postgres_db role).
authentik_pg_host: "{{ platform_pg_host }}"
authentik_pg_port: 5432
authentik_pg_name: "authentik"
authentik_pg_user: "authentik"

# No Redis: since 2025.10 Authentik keeps cache, sessions and tasks in PostgreSQL (its Redis
# settings were removed upstream; the role carried them unused until 2026-10-04).

# Secrets — Vault only (secret/{env}/{service}/{key}); no controller files.
authentik_vault_path: "{{ platform_env }}/authentik/admin"          # secret_key + bootstrap (get-or-create)
authentik_pg_vault_path: "{{ platform_env }}/authentik/db-pgsql"    # postgres_db creates it
# Authentik's own metrics listener (:9300 inside the server container), published on the host for
# Prometheus (INF-33); the DOCKER-USER catalog admits the monitoring host to it.
authentik_metrics_port: 9300

# Initial admin (akadmin).
authentik_bootstrap_email: "admin@{{ platform_domain }}"

# Persistent volumes.
authentik_media_volume: "authentik-media"
authentik_templates_volume: "authentik-templates"

# --- OIDC / SSO blueprints (declarative, one per cluster service) ----------------
# Host dir mounted into the containers at /blueprints/custom; Authentik auto-applies.
authentik_blueprints_dir: "/opt/authentik/blueprints"
# The OIDC and proxy app registries live in inventory: group_vars/all/sso.yml
# (authentik_oidc_apps, authentik_proxy_apps, authentik_proxy_apps_retired).

# --- Identity: groups + human users (declarative) -------------------------------
# Passwords set via API from app-user-<username>.json after the blueprint creates
# the user (Authentik hashes them; can't be set in a blueprint).
# Derived from platform_service_groups + platform_standalone_groups (group_vars/all/identity.yml).
# It used to be a second hand-kept list, which is how four groups ended up live but unmanaged —
# a rebuild from this blueprint would have deleted them. The blueprint template is unchanged: it
# still iterates a flat list of names.
authentik_groups: >-
  {{ (platform_service_groups.values() | map('dict2items') | flatten | map(attribute='value') | list)
     + platform_standalone_groups | unique }}
# Groups whose members are Authentik superusers (can manage Authentik itself).
# platform-admins = top-level platform operators.
authentik_superuser_groups:
  - platform-admins
# Service accounts (identity.yml platform_service_accounts): rendered as type service_account with
# scoped permissions; their groups are replaced by the declared list (a stray superuser group goes).
authentik_service_accounts: "{{ platform_service_accounts | default([]) }}"
# Admin-account separation (EntraID-style): a daily-driver account holds NO admin
# groups — it is a regular user. A SEPARATE privileged account (adm_<name>) holds the
# *-admins groups and is the Authentik superuser; admin things are managed only from
# it. Break-glass beyond these: Authentik akadmin (bootstrap) + each app's local admin.
# Every person in platform_people (group_vars/all/people.yml) is an Authentik user; the
# user secret sits at {env}/authentik/user-<username, _ as -> (a convention, not a list).
# People are added, renamed or disabled in people.yml only — never here.
authentik_users: >-
  {%- set out = [] -%}
  {%- for p in platform_people -%}
    {%- set _ = out.append({'username': p.username,
                            'vault_path': platform_env ~ '/authentik/user-' ~ (p.username | replace('_', '-'))}) -%}
  {%- endfor -%}
  {{ out }}

# Outbound email (password resets / MFA / notifications): the authentik@ service mailbox
# (Vault {env}/mail/authentik via the mailbox concern-role). Resend is retired.

# ------------------------------------------------------------------------------
# LDAP outpost — the container that serves LDAPS for the OPNsense WebGUI login.
#
# This ran UNMANAGED until now: it was created by hand, so nothing in this role
# could move it and it drifted a full release behind the core (2026.5.2 while
# server/worker were on 2026.5.6). Outposts are expected to track the core
# version, so the tag is derived from authentik_version and cannot silently
# diverge again.
# ------------------------------------------------------------------------------
authentik_ldap_enabled: true
# renovate: datasource=docker depName=ghcr.io/goauthentik/server
authentik_version: "2026.5.6"
# Database connection lifetime. The upstream default (0) closes the connection after EVERY
# request: on this platform that was ~2 new TLS connections per second (12 363 in 70 min on
# 2026-09-22), one per forwardAuth/API call, so any slowdown stacked fresh connections until the
# shared cluster's ceiling (100) was hit and every route behind forwardAuth answered 500. With a
# lifetime, each worker thread keeps its connection — measured 2026-10-04: about 60 per
# instance (the async workers use more threads than web workers × threads), which the
# cluster's pg_max_connections budgets for — and the per-request TLS
# handshake (CPU on both containers) disappears. Health checks drop a stale connection before reuse.
authentik_pg_conn_max_age: 300
authentik_pg_conn_health_checks: true
authentik_ldap_image: "ghcr.io/goauthentik/ldap:{{ authentik_version }}"

# LDAPS only — no cleartext 389. Dual-stack: Docker will not bind v6 on its own
# even with ip6tables enabled, so both families are published explicitly.
authentik_ldap_port: 636
authentik_ldap_container_port: 6636

# Outpost API token, issued by Authentik and stored in Vault.
authentik_ldap_vault_path: "{{ platform_env }}/authentik/ldap-outpost"

# --- LDAP outpost TLS = platform wildcard (synced from the Traefik host, tasks/ldap_cert.yml) ---
authentik_ldap_cert_name: "wildcard-{{ platform_org }}"          # Authentik certificate-keypair name
authentik_ldap_provider_name: "ldap"                       # LDAP provider that must reference it
authentik_ldap_cert_src_host: "{{ groups['traefik'] | first }}"
authentik_ldap_cert_src_crt: "/etc/lego/cert/certificates/_.{{ platform_domain }}.crt"
authentik_ldap_cert_src_key: "/etc/lego/cert/certificates/_.{{ platform_domain }}.key"
authentik_ldap_container_name: "authentik-ldap"   # outpost container (tasks/ldap.yml)

# The LDAP provider, its application, the bind account and the bind flow: one blueprint
# (templates/ldap-provider.yaml.j2). Until 2026-10-04 a file of an unmerged branch sat in the
# blueprint directory and was re-applied every hour: it put the provider back on a self-signed
# certificate and on the web login flow (second factor — which a bind cannot answer), undoing
# what tasks/ldap_cert.yml had set.
authentik_ldap_app_name: "LDAP"
authentik_ldap_bind_account: "ldapservice"
authentik_ldap_base_dn: "dc=ldap,{{ platform_domain.split('.') | map('regex_replace', '^', 'dc=') | join(',') }}"
authentik_ldap_flow: "ldap-authentication"
authentik_ldap_bind_vault_path: "{{ platform_env }}/authentik/ldap-bind"
# The name the certificate is checked against by the bind test (the Unbound override of the firewall).
authentik_ldap_fqdn: "ldap.{{ platform_domain }}"

# ------------------------------------------------------------------------------
# RADIUS — administrator logins on network devices (switches) against Authentik.
#
# Authentik's own RADIUS provider, served by an outpost container on EVERY instance: a device
# is given both as its primary and secondary server. Everything is declared in one blueprint
# (templates/radius.yaml.j2 — nothing through the UI):
#   * the provider of the devices: who may ask (the management network of the switch fabric),
#     the login flow WITH the second factor (the code is typed after the password:
#     `password;123456`), access for the infrastructure administrators' group only;
#   * a self-test provider: its own shared secret, reachable from the monitoring host only,
#     one probe account that can do nothing else — so every run proves an accepted and a
#     refused login on each instance without the devices' secret leaving Vault and Authentik.
# PAP only (device administration). Port authentication (802.1X/EAP) is not what this serves.
# ------------------------------------------------------------------------------
authentik_radius_enabled: true
authentik_radius_image: "ghcr.io/goauthentik/radius:{{ authentik_version }}"
authentik_radius_container_name: "authentik-radius"
authentik_radius_port: 1812

# The devices' provider.
authentik_radius_provider_name: "radius-network-devices"
authentik_radius_app_slug: "radius-network-devices"
authentik_radius_app_name: "Network devices (RADIUS)"
authentik_radius_outpost_name: "authentik-radius"
authentik_radius_group: "{{ platform_infra_admins_group }}"
authentik_radius_flow: "default-authentication-flow"       # password, then the second factor
authentik_radius_mfa: true
authentik_radius_client_networks:
  - "{{ platform_mgmt_zones.fabric.cidr4 }}"

# The self-test.
authentik_radius_selftest_name: "radius-selftest"
authentik_radius_selftest_user: "radius-probe"
authentik_radius_selftest_group: "radius-probe"
authentik_radius_test_host: "{{ groups['monitoring'] | first }}"
authentik_radius_selftest_networks:
  - "{{ hostvars[authentik_radius_test_host].ansible_host }}/32"
# The client the self-test runs (and removes) on the monitoring host.
# renovate: datasource=docker depName=freeradius/freeradius-server
authentik_radius_test_image: "freeradius/freeradius-server:3.2.9-alpine"
authentik_radius_test_client: "/opt/bin/radclient"

# Shared secrets and the probe's password: one Vault document, created once.
authentik_radius_vault_path: "{{ platform_env }}/authentik/radius"
# The outpost's API token (issued by Authentik) and the identifier it belongs to.
authentik_radius_outpost_vault_path: "{{ platform_env }}/authentik/radius-outpost"
# The user the server and worker run as in their image: owner of the blueprint that carries secrets.
authentik_container_uid: 1000
