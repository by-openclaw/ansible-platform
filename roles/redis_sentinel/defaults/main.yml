---
# ==============================================================================
# Role: redis_sentinel — one of the three Sentinels that watch the Redis pair and promote the
# replica when the primary is gone (services/0004). A quorum of 2 agrees before a failover, so
# one Sentinel (or the guest it runs on) can be down.
# Sentinel OWNS its configuration file once it runs: it records the members, the other
# Sentinels and the failover epochs in it. The role writes the file only when it does not
# exist; redis_sentinel_reset re-creates it (the Sentinels then rediscover each other).
# ==============================================================================
redis_sentinel_state: present       # absent = remove this Sentinel and its recorded state
redis_sentinel_image: "{{ redis_image | default('redis:8.10.2') }}"   # the same pinned image as the members
redis_sentinel_container_name: "redis-sentinel"
redis_sentinel_uid: 999
redis_sentinel_port: 26379
redis_sentinel_listen_ip: "{{ hostvars[inventory_hostname].ansible_host }}"
redis_sentinel_listen_ip6: "{{ hostvars[inventory_hostname].platform_host_v6 }}"
redis_sentinel_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"
redis_sentinel_state_host_dir: "/var/lib/redis-sentinel"
redis_sentinel_conf_file: "{{ redis_sentinel_state_host_dir }}/sentinel.conf"
redis_sentinel_cert_host_dir: "/etc/redis-sentinel/certs"
redis_sentinel_tls_cert: "{{ redis_sentinel_cert_host_dir }}/wildcard.crt"
redis_sentinel_tls_key: "{{ redis_sentinel_cert_host_dir }}/wildcard.key"
redis_sentinel_reset: false

# What is watched.
redis_sentinel_master_name: "{{ platform_redis_master_name }}"
redis_sentinel_members: "{{ platform_redis_members }}"
redis_sentinel_redis_port: 6379
redis_sentinel_quorum: 2
redis_sentinel_down_after_ms: 3000        # a primary silent for 3 s is suspected (pings go every second)
# The endpoint's check login on the Sentinels (same credential as on the members, owner:
# roles/redis): it may ask which member is the primary, nothing else.
redis_sentinel_check_user: "healthcheck"
redis_sentinel_check_vault_path: "{{ platform_redis_users_vault_prefix }}/{{ redis_sentinel_check_user }}"
redis_sentinel_check_rules: "-@all +ping +sentinel|get-master-addr-by-name"
redis_sentinel_failover_timeout_ms: 60000

# Credentials: the members' admin password (owner: roles/redis) and the Sentinels' own.
redis_sentinel_redis_vault_path: "{{ platform_env }}/redis/admin"
redis_sentinel_vault_path: "{{ platform_env }}/redis/sentinel"
# SEC-09: -e redis_sentinel_rotate=true gives the Sentinels a new password of their own
# (tasks/rotate.yml: accepted next to the old one, used, then the old one removed).
redis_sentinel_rotate: false
# The Sentinel's own command line. Its password is the first line each call writes on
# redis-cli's standard input (an AUTH line built by redis_sentinel_auth_for): neither an argument
# nor a variable of the task environment — both are readable in the host's process list.
# redis-cli answers one line for AUTH (OK) before the answer to the command.
redis_sentinel_backslash: "\\"
redis_sentinel_auth: 'AUTH "{{ redis_sentinel_password | replace(redis_sentinel_backslash, redis_sentinel_backslash ~ redis_sentinel_backslash) | replace(''"'', redis_sentinel_backslash ~ ''"'') }}"'
redis_sentinel_redis_auth: 'AUTH "{{ redis_sentinel_redis_password | replace(redis_sentinel_backslash, redis_sentinel_backslash ~ redis_sentinel_backslash) | replace(''"'', redis_sentinel_backslash ~ ''"'') }}"'
redis_sentinel_ca_bundle: "/etc/ssl/certs/ca-certificates.crt"   # the host CA store, mounted in the containers
redis_sentinel_redis_container_name: "redis"                      # the Redis member's container on a member host
redis_sentinel_cli:
  - docker
  - exec
  - -i
  - "{{ redis_sentinel_container_name }}"
  - redis-cli
  - --no-auth-warning
  - --tls
  - --cacert
  - "{{ redis_sentinel_ca_bundle }}"
  - -h
  - "{{ redis_sentinel_fqdn }}"
  - -p
  - "{{ redis_sentinel_port | string }}"
