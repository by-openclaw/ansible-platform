---
# ==============================================================================
# crowdsec_agent — install the log processor and point it at the central LAPI.
# ==============================================================================

# ONE token for every agent: read once per play, not once per host (a per-host
# delegated read opens one SSH session per host to the Vault host at once).
- name: "Crowdsec_agent | LAPI registration token (Vault, once for the play)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ crowdsec_agent_registration_token_vault_path }}"
  run_once: true

# No `when:` — under run_once a condition is evaluated in one host's context.
- name: "Crowdsec_agent | Bind it on every host in the play"
  ansible.builtin.set_fact:
    crowdsec_agent_token: "{{ vault_secret_result.token }}"
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ ansible_play_hosts }}"
  run_once: true
  no_log: true

- name: "Crowdsec_agent | Ensure repo prerequisites (gpg, curl, ca-certs)"
  ansible.builtin.apt:
    name: [gnupg, curl, ca-certificates, apt-transport-https]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Crowdsec_agent | Install the packagecloud signing key"
  ansible.builtin.get_url:
    url: "{{ crowdsec_agent_apt_key_url }}"
    dest: "{{ crowdsec_agent_apt_key_path }}"
    mode: "0644"

- name: "Crowdsec_agent | Add the CrowdSec apt repository"
  ansible.builtin.apt_repository:
    repo: "{{ crowdsec_agent_apt_repo }}"
    filename: crowdsec
    state: present
    update_cache: true

- name: "Crowdsec_agent | Install crowdsec"
  ansible.builtin.apt:
    name: crowdsec
    state: present

# A fresh install starts its OWN LAPI and registers against localhost. Left
# alone, the host reports "You can successfully interact with Local API",
# builds a private decision set, and no bouncer ever reads it — so a plain
# `cscli lapi status` check is NOT proof of enrolment. What matters is which
# URL the credentials point at, which is what is compared below.
#
# Enrolment is a `cscli lapi register` call, NOT a hand-written credentials
# file: local_api_credentials.yaml has no registration_token field (the schema
# is url/login/password), and cscli is what exchanges the token for the
# machine password the agent then logs in with.
- name: "Crowdsec_agent | Read the LAPI URL the agent currently points at"
  ansible.builtin.command:
    cmd: awk '/^url:/{print $2}' /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_agent_current_url
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

- name: "Crowdsec_agent | Check whether the agent can reach that LAPI"
  ansible.builtin.command: cscli lapi status
  register: crowdsec_agent_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

# Enrol when the agent is pointed anywhere other than the central LAPI (a fresh
# install points at 127.0.0.1), or when it cannot authenticate to it.
- name: "Crowdsec_agent | Decide whether this host needs enrolling"
  ansible.builtin.set_fact:
    crowdsec_agent_needs_enrol: >-
      {{ (crowdsec_agent_current_url.stdout | default('') | trim) != crowdsec_agent_lapi_url
         or crowdsec_agent_status.rc != 0 }}

- name: "Crowdsec_agent | Report the enrolment decision"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: currently pointed at
      '{{ crowdsec_agent_current_url.stdout | default('none') | trim }}' →
      {{ 'will enrol against ' ~ crowdsec_agent_lapi_url
         if crowdsec_agent_needs_enrol | bool else 'already enrolled centrally' }}

# cscli lapi register refuses to run when the credentials file is missing or
# unparseable (crowdsecurity/crowdsec#4237), so lay down a schema-valid stub
# first. Guarded so a working central registration is never clobbered.
- name: "Crowdsec_agent | Stub the credentials file so cscli can enrol"
  ansible.builtin.copy:
    dest: /etc/crowdsec/local_api_credentials.yaml
    owner: root
    group: root
    mode: "0600"
    backup: true
    content: |
      # Managed by ansible (crowdsec_agent role) — filled in by 'cscli lapi register'.
      url: {{ crowdsec_agent_lapi_url }}
  when: crowdsec_agent_needs_enrol | bool

# REBUILD-SAFE: a destroyed+recreated host still has its OLD machine registered on
# the central LAPI under the same name, and `cscli lapi register --machine <host>`
# refuses to overwrite it ("machine already exists") — which would need a manual
# `cscli machines delete`. Delete any stale registration for THIS hostname on the
# central LAPI first (delegated), so re-enrolment is fully hands-off. Best-effort:
# a first-ever install has nothing to delete. Only runs when we're (re-)enrolling.
- name: "Crowdsec_agent | Remove any stale registration for this host on the central LAPI"
  ansible.builtin.command:
    argv: "{{ crowdsec_cscli + ['machines', 'delete', inventory_hostname] }}"   # the LAPI's container
  delegate_to: "{{ crowdsec_agent_lapi_inventory_host }}"
  become: true
  when: crowdsec_agent_needs_enrol | bool
  changed_when: true
  failed_when: false

- name: "Crowdsec_agent | Enrol with the central LAPI (auto-registration token)"
  ansible.builtin.command: >-
    cscli lapi register
      --machine {{ inventory_hostname }}
      --url {{ crowdsec_agent_lapi_url }}
      --token {{ crowdsec_agent_token }}
  when: crowdsec_agent_needs_enrol | bool
  changed_when: true
  no_log: true
  notify: Restart crowdsec agent

# ------------------------------------------------------------------------------
# No Local API on a log processor. If it runs its own, `cscli lapi register` is never reached
# and the agent quietly stays bound to itself: it builds a private decision set that no bouncer
# ever reads. CrowdSec merges `config.yaml.local` over the vendor's `config.yaml`: the override
# switches the Local API off and the vendor file is left as the package wrote it. (Until
# 2026-10-09 a helper program deleted the `api.server` block from the vendor file instead; where
# it already did, the override says the same thing again.)
# ------------------------------------------------------------------------------
- name: "Crowdsec_agent | The helper this role used to install (superseded by the override)"
  ansible.builtin.file:
    path: "{{ crowdsec_agent_retired_helper }}"
    state: absent

# Under --check on a host that does not have CrowdSec yet there is no configuration folder to
# write into: the dry-run of this play must still be able to list such hosts (#582).
- name: "Crowdsec_agent | Is CrowdSec's configuration there yet?"
  ansible.builtin.stat:
    path: "{{ crowdsec_agent_config }}"
  register: crowdsec_agent_config_stat
  when: crowdsec_agent_disable_local_lapi | bool

- name: "Crowdsec_agent | Local API off (config.yaml.local)"
  ansible.builtin.copy:
    dest: "{{ crowdsec_agent_config }}.local"
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible (roles/crowdsec_agent) — merged by CrowdSec over config.yaml.
      # A log processor does not run a Local API: it reports to the platform's.
      api:
        server:
          enable: false
  register: crowdsec_agent_local_api_off
  when:
    - crowdsec_agent_disable_local_lapi | bool
    - crowdsec_agent_config_stat.stat.exists | default(false)
  notify: Restart crowdsec agent

# Never restart onto a configuration that will not load. Validate first; take the override
# back if crowdsec refuses the result.
- name: "Crowdsec_agent | Validate the configuration before restarting"
  ansible.builtin.command:
    argv: [crowdsec, -t, -c, "{{ crowdsec_agent_config }}"]
  register: crowdsec_agent_cfg_test
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "Crowdsec_agent | Take the override back if the configuration is refused"
  when:
    - not ansible_check_mode
    - crowdsec_agent_cfg_test.rc != 0
    - crowdsec_agent_local_api_off is changed
  block:
    - name: "Crowdsec_agent | Remove the override"
      ansible.builtin.file:
        path: "{{ crowdsec_agent_config }}.local"
        state: absent

    - name: "Crowdsec_agent | Fail loudly — configuration refused"
      ansible.builtin.fail:
        msg: >-
          crowdsec refused its configuration with the override on {{ inventory_hostname }};
          the override has been removed. stderr:
          {{ crowdsec_agent_cfg_test.stderr | default('') | trim }}

- name: "Crowdsec_agent | The configuration loads"
  ansible.builtin.assert:
    that: crowdsec_agent_cfg_test.rc == 0
    fail_msg: "crowdsec refuses its configuration on {{ inventory_hostname }}: {{ crowdsec_agent_cfg_test.stderr | default('') | trim }}"
    quiet: true
  when: not ansible_check_mode

# A collection with no matching log source is installed and inert — the exact
# state mailcow was in: crowdsecurity/postfix present, zero mail lines read,
# because postfix logs to Docker stdout and never to /var/log/mail.log.
- name: "Crowdsec_agent | Acquire container logs via the docker datasource"
  ansible.builtin.template:
    src: acquis-docker.yaml.j2
    dest: "/etc/crowdsec/acquis.d/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ crowdsec_agent_docker_sources }}"
  loop_control:
    label: "{{ item.name }}"
  when: crowdsec_agent_docker_sources | length > 0
  notify: Restart crowdsec agent

- name: "Crowdsec_agent | Acquire host log files via the file datasource"
  ansible.builtin.template:
    src: acquis-file.yaml.j2
    dest: "/etc/crowdsec/acquis.d/{{ item.name }}.yaml"
    owner: root
    group: root
    mode: "0640"
  loop: "{{ crowdsec_agent_file_sources }}"
  loop_control:
    label: "{{ item.name }}"
  when: crowdsec_agent_file_sources | length > 0
  notify: Restart crowdsec agent

- name: "Crowdsec_agent | Whitelist the platform's own address space (parser, s02-enrich)"
  ansible.builtin.template:
    src: whitelist-platform.yaml.j2
    dest: /etc/crowdsec/parsers/s02-enrich/00-platform-whitelist.yaml
    owner: root
    group: root
    mode: "0644"
  when: crowdsec_whitelist_cidrs | length > 0
  notify: Restart crowdsec agent

# cscli reports an install on stderr and with wording that changed across versions, so "changed"
# is decided by membership: what was installed before the loop vs what this host declares. A real
# install must restart the agent, or the new parsers/scenarios are never loaded (2026-10-02).
- name: "Crowdsec_agent | Collections installed before this run"
  ansible.builtin.command:
    cmd: cscli collections list -o json
  register: crowdsec_agent_coll_before
  changed_when: false
  check_mode: false

- name: "Crowdsec_agent | Install detection collections"
  ansible.builtin.command:
    cmd: "cscli collections install {{ item }} --error"
  register: crowdsec_agent_coll
  changed_when: >-
    item not in ((crowdsec_agent_coll_before.stdout | default('{}') | from_json).collections | default([])
                 | map(attribute='name') | list)
  failed_when:
    - crowdsec_agent_coll.rc != 0
    - "'already' not in (crowdsec_agent_coll.stderr | default('') ~ crowdsec_agent_coll.stdout | default(''))"
  loop: "{{ crowdsec_agent_collections + crowdsec_agent_extra_collections }}"
  notify: Restart crowdsec agent

- name: "Crowdsec_agent | Ensure the service is enabled and running"
  ansible.builtin.systemd_service:
    name: crowdsec
    enabled: true
    state: started
  when: not ansible_check_mode

- name: "Crowdsec_agent | Flush handlers before verifying"
  ansible.builtin.meta: flush_handlers

# An agent that installed cleanly but never reached the CENTRAL LAPI is the
# failure mode worth catching, and it is invisible to `cscli lapi status` alone:
# a host still bound to its own 127.0.0.1 LAPI answers "success" too. So assert
# BOTH that the credentials point at the central LAPI and that it authenticates.
- name: "Crowdsec_agent | Re-read the LAPI URL after enrolment"
  ansible.builtin.command:
    cmd: awk '/^url:/{print $2}' /etc/crowdsec/local_api_credentials.yaml
  register: crowdsec_agent_final_url
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: "Crowdsec_agent | Verify the agent authenticates to the central LAPI"
  ansible.builtin.command:
    cmd: cscli lapi status
  register: crowdsec_agent_lapi_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  retries: 6
  delay: 5
  until: crowdsec_agent_lapi_status.rc == 0
  when: not ansible_check_mode

- name: "Crowdsec_agent | Fail if this host is not bound to the central LAPI"
  ansible.builtin.fail:
    msg: >-
      {{ inventory_hostname }} is not a central log processor:
      credentials point at '{{ crowdsec_agent_final_url.stdout | default('none') | trim }}'
      (expected {{ crowdsec_agent_lapi_url }}),
      lapi status rc={{ crowdsec_agent_lapi_status.rc | default('n/a') }}.
  when:
    - not ansible_check_mode
    - ((crowdsec_agent_final_url.stdout | default('') | trim) != crowdsec_agent_lapi_url)
      or crowdsec_agent_lapi_status.rc != 0

- name: "Crowdsec_agent | Report"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: crowdsec log processor CONNECTED to
      {{ crowdsec_agent_lapi_url }} (machine registered as {{ inventory_hostname }})
  when: not ansible_check_mode
