---
# ==============================================================================
# Role: crowdsec_agent — a CrowdSec LOG PROCESSOR on every LXC/VM.
#
# Per the CrowdSec multi-server guide the roles are separate:
#   log processor  — parses local logs, matches scenarios, sends alerts to LAPI
#   LAPI           — turns alerts into decisions (lxc-crowdsec-01)
#   bouncer        — pulls decisions and enforces them (the OPNsense firewall)
#
# Consequence that shapes this role: parsers and scenarios belong HERE, not on
# the LAPI. The LAPI needs no collections at all.
# ==============================================================================

crowdsec_agent_lapi_host: "10.1.3.190"
crowdsec_agent_lapi_port: 8080
# Inventory host running the central LAPI (cscli lives here) — used to delegate
# machine cleanup so a REBUILT agent can re-register without a name conflict.
crowdsec_agent_lapi_inventory_host: "lxc-crowdsec-01"
crowdsec_agent_lapi_url: "http://{{ crowdsec_agent_lapi_host }}:{{ crowdsec_agent_lapi_port }}"

# Apt source — same packagecloud repo the LAPI uses. Debian 13 has no trixie
# repo yet, so bookworm packages are used (proven on lxc-crowdsec-01).
crowdsec_agent_apt_key_url: "https://packagecloud.io/crowdsec/crowdsec/gpgkey"
crowdsec_agent_apt_key_path: "/etc/apt/keyrings/crowdsec.asc"
crowdsec_agent_apt_codename: "{{ 'bookworm' if ansible_distribution_release == 'trixie' else ansible_distribution_release }}"
crowdsec_agent_apt_repo: >-
  deb [signed-by={{ crowdsec_agent_apt_key_path }}]
  https://packagecloud.io/crowdsec/crowdsec/debian/
  {{ crowdsec_agent_apt_codename }} main

# Baseline collections every host parses. Service-specific ones are appended
# per group (e.g. nginx on Traefik, postfix on mailcow).
crowdsec_agent_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/whitelist-good-actors
crowdsec_agent_extra_collections: []

# This host registers itself with the LAPI using the shared token.
crowdsec_agent_registration_token_file: "fabric/app-crowdsec-registration-token.json"
crowdsec_agent_secret_dir: "~/.openclaw/workspace/infra/secrets"

# The LAPI is remote, so the local API server is switched off — this host is a
# log processor only, never its own LAPI.
crowdsec_agent_disable_local_lapi: true

# Container log sources. CrowdSec ships a built-in `docker` datasource, so
# containerised services do NOT need to be modified to write host log files:
# the agent reads their stdout directly through the Docker socket. Without
# this, a collection like crowdsecurity/postfix is installed but has no log
# to parse — installed and inert.
# Each entry: {name: <acquis file stem>, containers: [...], type: <log type>}
crowdsec_agent_docker_sources: []

# Parser whitelist for the platform's own address space (never self-ban). ONE source:
# platform_trusted_cidrs in group_vars/all/deployment.yml.
crowdsec_whitelist_cidrs: "{{ platform_trusted_cidrs | default([]) }}"
