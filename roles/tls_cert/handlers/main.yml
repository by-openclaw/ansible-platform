---
# Consuming roles add their own handler with `listen: "tls_cert changed"` to
# reload their service when the wildcard cert is renewed. This handler keeps the
# notify topic valid even when no consumer is listening.
- name: "TLS | Log cert update"
  ansible.builtin.debug:
    msg: "Wildcard cert updated on {{ inventory_hostname }} ({{ tls_cert_crt }})."
  listen: "tls_cert changed"
