---
# ==============================================================================
# Role: traefik_route — register a service router on the Traefik host
# Drops a watched dynamic-config file ({{ route_name }}.yml) into Traefik's file
# provider directory on the Traefik host (delegated). Reusable by EVERY web
# service (per the per-service pattern): pgAdmin, Authentik, NetBox, …
#
# Required (pass via include_role vars):
#   traefik_route_name        e.g. "pgadmin"   (router/service id, file name)
#   traefik_route_fqdn        e.g. "pgadmin.{{ platform_domain }}"
#   traefik_route_backend_url e.g. "http://10.1.3.140:8080"
# ==============================================================================
traefik_route_host: "{{ groups['traefik'] | first }}"        # inventory hostname of the Traefik host
traefik_route_dynamic_dir: "/etc/traefik/dynamic"

# Router match rule. Defaults to an exact host match; override for wildcards, e.g.
# GitLab Pages: 'HostRegexp(`^[a-zA-Z0-9-]+\.pages\.by-research\.be$`)' (Traefik v3).
traefik_route_rule: "Host(`{{ traefik_route_fqdn }}`)"

# Internal-only services get an ipAllowList (no public exposure). Public services
# (a Cloudflare record + DNAT exist) set this false.
traefik_route_internal_only: true
# Backend speaks its own TLS with a NON-Traefik-verifiable cert (e.g. PBS's
# self-signed cert on :8007). true -> emit a per-route serversTransport with
# insecureSkipVerify so Traefik still proxies over TLS but skips cert validation
# (acceptable on the trusted internal SVC hop). Default false = verify the cert
# (the Vault pattern: point the backend at the FQDN so the wildcard validates).
traefik_route_backend_insecure_skip_verify: false
# Backend served with a certificate from the platform's internal CA (step-ca): give Traefik the
# root file (installed by roles/platform_ca on the Traefik host) instead of skipping verification.
traefik_route_backend_root_ca_file: ""      # e.g. /usr/local/share/ca-certificates/<domain>-internal-ca.crt
traefik_route_internal_cidrs:
  - "{{ platform_internal_cidr4 }}"   # platform LAN (all SVC/DMZ/MGMT VLANs)
  - "{{ platform_vpn_cidr }}"         # NetBird overlay (CGNAT) — VPN peers reach EVERY internal svc
  - "{{ platform_internal_cidr6 }}"
  - "127.0.0.1/32"
  - "::1/128"
# Extra break-glass admin sources appended to the ipAllowList (e.g. the OOB admin
# desktop). Set per-environment in group_vars so EVERY route re-render keeps them
# — without this, re-rendering a single route silently drops desk access.
traefik_route_admin_cidrs: []

# Public services (internal_only=false) get a per-client rate limit (brute-force
# throttle) instead of the ipAllowList. CrowdSec/Suricata at the FW + the app login
# + host fail2ban remain the other layers.
traefik_route_public_hardening: true
# Generous so asset/icon-heavy SPAs (e.g. the Bitwarden web-vault, which bursts a
# favicon request per item on unlock) are NOT throttled. Still caps egregious abuse;
# real brute-force protection = FW CrowdSec + app login + fail2ban (+ Traefik
# CrowdSec bouncer, follow-up). Tune per-route via these vars if needed.
traefik_route_ratelimit_average: 300   # req/s per client IP (sustained)
traefik_route_ratelimit_burst: 600     # short burst allowance

# forwardAuth (Authentik SSO gate) for apps with no native OIDC (e.g. weed admin,
# the Traefik dashboard). true -> the route carries the global `authentik` forwardAuth
# middleware + a per-host /outpost.goauthentik.io/ sub-router (login callback/assets).
# Access is IdP-gated by the app's proxy-provider group (authentik_proxy_apps).
# Combine with internal_only=true so it's also network-gated (VPN/LAN).
traefik_route_forward_auth: false

# --- Path-prefix routes (several backends under ONE host name, e.g. the Talk backend
#     under nextcloud.<domain>/standalone-signaling/). The rule becomes
#     Host(fqdn) && PathPrefix(prefix); with strip_prefix the prefix is removed before
#     the request reaches the backend. Plain host routes are unaffected (both empty).
traefik_route_path_prefix: ""        # e.g. "/standalone-signaling"
traefik_route_strip_prefix: false    # add a stripPrefix middleware for the prefix

# A route must be withdrawable, not only publishable (services/0007 §7.1). Retiring a service
# that leaves its router behind gives Traefik a rule pointing at nothing, which answers 502 on a
# name that should simply stop existing.
traefik_route_state: present

# --- Multi-endpoint routes ---------------------------------------------------
# Some products are several backends behind ONE host name. NetBird is six: gRPC
# management, gRPC signal, REST API, signal WebSocket, relay, dashboard SPA. List
# them here and the role renders one router + one service each, all into the SAME
# {{ traefik_route_name }}.yml — so the route is still published and WITHDRAWN by
# one name (services/0007 §7.1), not six files to remember.
#
# Each entry:
#   name           required — router/service id becomes <route_name>-<name>
#   backend_url    required — full URL incl. scheme; use h2c:// for gRPC backends
#   path_prefixes  optional — OR'd together and ANDed with the host rule.
#                  Omit for the catch-all (give it the lowest priority).
#   priority       optional — explicit, because every rule matches the same host
#                  and Traefik would otherwise order them by rule length.
#
# traefik_route_endpoints:
#   - {name: api,       path_prefixes: ["/api", "/ws-proxy/management"], backend_url: "http://10.1.3.9:33073", priority: 90}
#   - {name: dashboard, backend_url: "http://10.1.3.9:80",                                                     priority: 1}
#
# The network gate (ipAllowList or rateLimit) applies to EVERY endpoint, exactly as
# it does to a single-endpoint route — a multi-endpoint route must not be a way to
# lose it silently. A product that genuinely must carry neither says so explicitly
# with internal_only=false + public_hardening=false.
traefik_route_endpoints: []
