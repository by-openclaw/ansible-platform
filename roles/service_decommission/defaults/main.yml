---
# ==============================================================================
# Role: service_decommission — force a retired service ABSENT.
# Data-driven, archive-before-destroy, idempotent. Given a service from the
# catalog it will (for the components that service declares):
#   * db      — pg_dump the database (archived), then DROP DATABASE + DROP ROLE
#   * secrets — archive each in Vault (-> secret/fabric/archive/) + move the
#               controller fabric file to secrets/_stale/
# A component the service does not declare, or one already gone, is a no-op.
#
# NOT handled here (do separately, by design):
#   * destroying the guest VM/LXC        -> Terraform (infra-terraform-proxmox)
#   * Authentik OIDC app / group         -> remove from authentik_oidc_apps + apply
#   * Traefik route + split-DNS override -> remove from the catalog + re-apply
# ==============================================================================

# Which service to decommission (required at run time): -e decommission_target=<name>
decommission_target: ""

# Where the DB dump + moved secret files are archived (controller-side).
decommission_dump_dir: "{{ (vault_secret_dir | expanduser) }}/_stale/db-dumps"
decommission_stale_dir: "{{ (vault_secret_dir | expanduser) }}/_stale"

# Where each footprint component is removed.
decommission_pg_host: "{{ groups['postgresql'] | first }}"
decommission_pg_container: "postgres"
decommission_traefik_host: "{{ groups['traefik'] | first }}"
decommission_traefik_dynamic_dir: "/etc/traefik/dynamic"
decommission_authentik_host: "{{ groups['authentik'] | first }}"
decommission_crowdsec_host: "{{ groups['crowdsec'] | first }}"

# The catalog of decommissionable services + their FULL footprint. Every field is
# OPTIONAL — declare only the components a service actually has; each is removed
# archive-before-destroy and skipped (no-op) when already absent. Full template:
#
#   <service>:
#     db:             { database: <db>, role: <role> }   # pg_dump → DROP DATABASE + ROLE
#     secrets:        [<fabric-secret-name>, ...]         # → Vault fabric/archive/ + file _stale
#     traefik_route:  <route-name>                        # rm /etc/traefik/dynamic/<name>.yml
#     authentik_app:  <oidc-slug>                         # delete app + provider
#     authentik_group: <group-name>                       #   (optional) + delete this group
#     crowdsec_machine: <machine-id>                       # cscli machines delete
#     guest:          <vm-or-lxc-name>                     # ⚠️ Terraform-managed → logged, NOT auto-destroyed
#     split_dns:      <fqdn>                               # ⚠️ remove from opn_unbound.host_overrides → logged
#
decommission_catalog:
  # defguard and minio were retired and are GONE: no catalog row, no role, no host, no play, no
  # database, no login role, no CrowdSec registration. Their entries were describing nothing, so
  # they are removed rather than kept as folklore.
  #
  # wazuh and portainer are LIVE. What their entries held was not a retirement order but teardown
  # intent — "keep the indexer volume, it is the security record" and "keep the Vault paths". That
  # intent belongs with the service, next to what the service IS, so it moved into their role
  # contracts (service_scaffold `teardown:`). A list called decommission_catalog naming two running
  # services reads as a deletion queue, which is exactly the wrong thing to leave lying around.
  #
  # What remains here is the legacy path for a service whose role has already been deleted, where
  # there is no contract left to read. Anything still installed declares its own teardown.
  {}
