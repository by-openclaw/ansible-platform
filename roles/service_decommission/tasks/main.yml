---
# The footprint comes from the platform service catalog, not a second hand-kept list. Emptying
# that list in #535 was right — it only ever covered 4 of 32 services — but it left this role
# with nothing to read, so it refused every target. services.yml already records the database,
# the route and the host for all of them; decommission_catalog now only carries the leftovers
# of a service whose role is already gone, where there is no catalog row left to read.
# Statements that write run on the cluster's LEADER (a replica is read-only): ask once.
- name: "decommission | Which PostgreSQL member leads"
  ansible.builtin.include_role:
    name: postgres_db
    tasks_from: leader
  when: platform_pg_leader is not defined

- name: "decommission | Require a target"
  ansible.builtin.assert:
    that: decommission_target | length > 0
    fail_msg: "Set -e decommission_target=<name>, as it appears in group_vars/all/services.yml."
    quiet: true

- name: "decommission | Resolve the service from the platform catalog"
  ansible.builtin.set_fact:
    _row: >-
      {{ (platform_services | default([]) | selectattr('name', 'equalto', decommission_target)
          | list | first) | default({}, true) }}
    _stamp: "{{ now(utc=true).strftime('%Y-%m-%d') }}"

- name: "decommission | The service must be known somewhere"
  ansible.builtin.assert:
    that: (_row | length > 0) or (decommission_target in decommission_catalog)
    fail_msg: >-
      '{{ decommission_target }}' is in neither services.yml nor decommission_catalog.
      A service that was never catalogued cannot be decommissioned by code.
    success_msg: "Decommissioning '{{ decommission_target }}' (ABSENT)."

- name: "decommission | Pin the service footprint"
  ansible.builtin.set_fact:
    _svc: >-
      {{ decommission_catalog[decommission_target]
         if decommission_target in decommission_catalog
         else {'db': ({'database': _row.name, 'role': _row.name} if _row.db | default('none') != 'none' else omit),
               'traefik_route': (_row.name if _row.fqdn | default(None) else omit),
               'secrets': []} }}

# ============================ Postgres DB + role =============================
- name: "decommission | DB — dump (archive) then drop"
  when: _svc.db is defined
  block:
    - name: "decommission | DB present?"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -tAc,
               "select 1 from pg_database where datname='{{ _svc.db.database }}'"]
      delegate_to: "{{ decommission_pg_host }}"
      register: _dbchk
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false

    - name: "decommission | Dump directory on the leader (root only)"
      ansible.builtin.file:
        path: "{{ decommission_pg_dump_host_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"
      delegate_to: "{{ decommission_pg_host }}"
      when: (_dbchk.stdout | trim) == '1'

    # pg_dump writes the archive to its standard output; a transient systemd unit sends that
    # output to the file (truncate: an earlier file is replaced) under a 0077 umask, and its
    # exit status is pg_dump's — no shell redirect.
    - name: "decommission | Dump the DB before dropping (custom format)"
      ansible.builtin.command:
        argv: >-
          {{ decommission_pg_unit + ['--property=StandardOutput=truncate:' ~ decommission_pg_dump_file,
             'docker', 'exec', decommission_pg_container, 'pg_dump', '-U', 'postgres', '-Fc', _svc.db.database] }}
      delegate_to: "{{ decommission_pg_host }}"
      changed_when: true
      when: (_dbchk.stdout | trim) == '1'

    # An archive that cannot be read back is not an archive: pg_restore lists it (the file is the
    # unit's standard input) before anything is dropped.
    - name: "decommission | The dump reads back (pg_restore lists its contents)"
      ansible.builtin.command:
        argv: >-
          {{ decommission_pg_unit + ['--property=StandardInput=file:' ~ decommission_pg_dump_file,
             '--property=StandardOutput=truncate:' ~ decommission_pg_dump_file ~ '.list',
             'docker', 'exec', '-i', decommission_pg_container, 'pg_restore', '-l'] }}
      delegate_to: "{{ decommission_pg_host }}"
      changed_when: false
      when:
        - (_dbchk.stdout | trim) == '1'
        - not ansible_check_mode

    - name: "decommission | Its table of contents"
      ansible.builtin.slurp:
        src: "{{ decommission_pg_dump_file }}.list"
      delegate_to: "{{ decommission_pg_host }}"
      register: decommission_pg_dump_list
      when:
        - (_dbchk.stdout | trim) == '1'
        - not ansible_check_mode

    - name: "decommission | The dump is the archive of this database"
      ansible.builtin.assert:
        that: decommission_pg_dump_dbname == _svc.db.database
        fail_msg: "the dump of {{ _svc.db.database }} does not read back as its archive — nothing was dropped"
        success_msg: "dump of {{ _svc.db.database }}: {{ decommission_pg_dump_entries }} entries listed"
      when:
        - (_dbchk.stdout | trim) == '1'
        - not ansible_check_mode

    - name: "decommission | Ensure the controller archive dir"
      ansible.builtin.file:
        path: "{{ decommission_dump_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | Fetch the dump to the controller archive (checksum verified)"
      ansible.builtin.fetch:
        src: "{{ decommission_pg_dump_file }}"
        dest: "{{ decommission_dump_dir }}/{{ _svc.db.database }}-{{ _stamp }}.dump"
        flat: true
      delegate_to: "{{ decommission_pg_host }}"
      when:
        - (_dbchk.stdout | trim) == '1'
        - not ansible_check_mode   # a dry run takes no dump: there is nothing to fetch

    - name: "decommission | The copy on the leader is removed (the archive is on the controller)"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      delegate_to: "{{ decommission_pg_host }}"
      loop:
        - "{{ decommission_pg_dump_file }}"
        - "{{ decommission_pg_dump_file }}.list"
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | DROP DATABASE (FORCE)"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -c,
               "DROP DATABASE IF EXISTS {{ _svc.db.database }} WITH (FORCE);"]
      delegate_to: "{{ decommission_pg_host }}"
      changed_when: true
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | Login role present?"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -tAc,
               "select 1 from pg_roles where rolname='{{ _svc.db.role }}'"]
      delegate_to: "{{ decommission_pg_host }}"
      register: _rolechk
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false
      when: _svc.db.role is defined

    - name: "decommission | DROP ROLE"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -c,
               "DROP ROLE IF EXISTS {{ _svc.db.role }};"]
      delegate_to: "{{ decommission_pg_host }}"
      changed_when: true
      when:
        - _svc.db.role is defined
        - (_rolechk.stdout | default('') | trim) == '1'

# ============================ Secrets (archive) ==============================
- name: "decommission | Secrets — archive in Vault + move fabric files"
  when: (_svc.secrets | default([])) | length > 0
  block:
    - name: "decommission | Authenticate to Vault (ansible-deploy AppRole; root fallback)"
      ansible.builtin.include_role:
        name: vault_login

    # Copy, read the copy back, then remove the original — through Vault's HTTP API, from the
    # Vault host (the controller has no route to Vault). No token file, no staged program.
    - name: "decommission | Archive each secret in Vault (copy, verify, remove the original)"
      ansible.builtin.include_tasks: vault_archive_one.yml
      loop: "{{ _svc.secrets }}"
      loop_control:
        loop_var: decommission_secret

    - name: "decommission | The former staged files are gone from the Vault host"
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      delegate_to: "{{ decommission_vault_host }}"
      loop: "{{ decommission_vault_former_files }}"

    - name: "decommission | Move the fabric secret files to _stale (controller)"
      ansible.builtin.command:
        cmd: "mv {{ (vault_secret_dir | expanduser) }}/fabric/{{ item }}.json {{ decommission_stale_dir }}/{{ item }}.json"
        removes: "{{ (vault_secret_dir | expanduser) }}/fabric/{{ item }}.json"
      delegate_to: localhost
      loop: "{{ _svc.secrets | reject('search', '/') | list }}"   # a KV path has no fabric file

# ============================ S3 (SeaweedFS) =================================
# The identity goes with its keys; the bucket only when it holds nothing — archiving
# data is a decision this role does not make for anyone.
- name: "decommission | S3 — identity + (empty) bucket"
  when: _svc.s3_identity is defined or _svc.s3_bucket is defined
  delegate_to: "{{ decommission_seaweedfs_host }}"
  become: true
  block:
    - name: "decommission | S3 identities and buckets now"
      ansible.builtin.command:
        argv: "{{ decommission_weed_shell }}"
        stdin: "s3.configure\ns3.bucket.list"
      register: _s3now
      changed_when: false
      check_mode: false   # read-only probe
      no_log: true        # the identity config carries keys

    - name: "decommission | Remove the S3 identity (and its keys)"
      ansible.builtin.command:
        argv: "{{ decommission_weed_shell }}"
        stdin: "s3.configure -user {{ _svc.s3_identity }} -delete -apply"
      when:
        - _svc.s3_identity is defined
        - _svc.s3_identity in decommission_s3_identities
      changed_when: true
      no_log: true        # weed prints the remaining identities, with their keys

    - name: "decommission | The bucket as listed"
      ansible.builtin.set_fact:
        _s3_bucket_line: "{{ _s3now.stdout_lines | select('match', '^\\s*' ~ _svc.s3_bucket ~ '\\s') | first | default('') }}"
      when: _svc.s3_bucket is defined
      no_log: true

    - name: "decommission | A bucket is removed only when empty"
      ansible.builtin.assert:
        that: _s3_bucket_line | length == 0 or 'size:0' in _s3_bucket_line
        fail_msg: "bucket {{ _svc.s3_bucket }} holds data — archive it first; nothing was removed"
        quiet: true
      when: _svc.s3_bucket is defined

    - name: "decommission | Remove the empty bucket"
      ansible.builtin.command:
        argv: "{{ decommission_weed_shell }}"
        stdin: "s3.bucket.delete -name {{ _svc.s3_bucket }}"
      when:
        - _svc.s3_bucket is defined
        - _s3_bucket_line | length > 0
      changed_when: true

# ============================ Traefik route =================================
# roles/traefik_route owns route files in both directions. Deleting one by path here meant
# two places knew where routes live and what they are called — and the withdrawal only
# existed in this role, so a service torn down any other way left its router behind.
- name: "decommission | Withdraw the Traefik route"
  ansible.builtin.include_role:
    name: traefik_route
  vars:
    traefik_route_name: "{{ _svc.traefik_route }}"
    traefik_route_fqdn: ""
    traefik_route_backend_url: ""
    traefik_route_state: absent
  when: _svc.traefik_route is defined

# ============================ Authentik OIDC app ============================
- name: "decommission | Remove the Authentik app + provider (+ group)"
  when: _svc.authentik_app is defined
  block:
    - name: "decommission | The application is no longer declared for the blueprints"
      ansible.builtin.assert:
        that: _svc.authentik_app not in decommission_authentik_declared
        fail_msg: >-
          '{{ _svc.authentik_app }}' is still declared in group_vars/all/sso.yml: remove it there
          first (Authentik re-applies its blueprints every hour and would create it again).
        quiet: true

    - name: "decommission | Authentik's API token (Vault)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ decommission_authentik_vault_path }}"

    - name: "decommission | Keep it for the calls below"
      ansible.builtin.set_fact:
        decommission_authentik_token: "{{ vault_secret_result[decommission_authentik_token_field] }}"
      no_log: true

    - name: "decommission | The application, by slug"
      ansible.builtin.uri:
        url: "{{ decommission_authentik_api }}/core/applications/?slug={{ _svc.authentik_app | urlencode }}&superuser_full_list=true"
        headers: { Authorization: "Bearer {{ decommission_authentik_token }}" }
      delegate_to: "{{ decommission_authentik_host }}"
      register: decommission_authentik_apps
      check_mode: false   # read-only probe
      no_log: true

    # An application is addressed by its slug (not its pk); its provider by its pk.
    - name: "decommission | Delete the application"
      ansible.builtin.uri:
        url: "{{ decommission_authentik_api }}/core/applications/{{ item.slug | urlencode }}/"
        method: DELETE
        headers: { Authorization: "Bearer {{ decommission_authentik_token }}" }
        status_code: [204]
      delegate_to: "{{ decommission_authentik_host }}"
      loop: "{{ decommission_authentik_apps.json.results | default([]) | selectattr('slug', 'eq', _svc.authentik_app) | list }}"
      loop_control:
        label: "{{ item.slug }}"
      changed_when: true
      no_log: true

    - name: "decommission | Delete its provider"
      ansible.builtin.uri:
        url: "{{ decommission_authentik_api }}/providers/all/{{ item.provider }}/"
        method: DELETE
        headers: { Authorization: "Bearer {{ decommission_authentik_token }}" }
        status_code: [204]
      delegate_to: "{{ decommission_authentik_host }}"
      loop: >-
        {{ decommission_authentik_apps.json.results | default([]) | selectattr('slug', 'eq', _svc.authentik_app)
           | selectattr('provider') | list }}
      loop_control:
        label: "provider {{ item.provider }}"
      changed_when: true
      no_log: true

    - name: "decommission | The group, by name"
      ansible.builtin.uri:
        url: "{{ decommission_authentik_api }}/core/groups/?name={{ _svc.authentik_group | urlencode }}"
        headers: { Authorization: "Bearer {{ decommission_authentik_token }}" }
      delegate_to: "{{ decommission_authentik_host }}"
      register: decommission_authentik_groups
      check_mode: false   # read-only probe
      no_log: true
      when: (_svc.authentik_group | default('')) | length > 0

    - name: "decommission | Delete the group"
      ansible.builtin.uri:
        url: "{{ decommission_authentik_api }}/core/groups/{{ item.pk }}/"
        method: DELETE
        headers: { Authorization: "Bearer {{ decommission_authentik_token }}" }
        status_code: [204]
      delegate_to: "{{ decommission_authentik_host }}"
      loop: >-
        {{ decommission_authentik_groups.json.results | default([])
           | selectattr('name', 'eq', _svc.authentik_group | default('')) | list }}
      loop_control:
        label: "{{ item.name }}"
      changed_when: true
      no_log: true
      when: (_svc.authentik_group | default('')) | length > 0

    - name: "decommission | The former staged program is gone from the Authentik host"
      ansible.builtin.file:
        path: "{{ decommission_authentik_former_file }}"
        state: absent
      delegate_to: "{{ decommission_authentik_host }}"

# ============================ CrowdSec machine ==============================
- name: "decommission | Delete the CrowdSec machine"
  ansible.builtin.command:
    argv: "{{ crowdsec_cscli + ['machines', 'delete', _svc.crowdsec_machine] }}"   # the LAPI's container
  delegate_to: "{{ decommission_crowdsec_host }}"
  register: _csdel
  changed_when: _csdel.rc == 0
  failed_when:
    - _csdel.rc != 0
    - "'exist' not in (_csdel.stderr | default('') | lower)"
  when: _svc.crowdsec_machine is defined

# ==================== Guest + split-DNS (flagged, not auto) =================
- name: "decommission | Guest VM/LXC → destroy in Terraform (NOT done here)"
  ansible.builtin.debug:
    msg: "⚠️ Guest '{{ _svc.guest }}' is Terraform-managed — remove it in infra-terraform-proxmox (module / terraform destroy -target). Not auto-destroyed by design."
  when: _svc.guest is defined

- name: "decommission | Split-DNS override → remove from the FW catalog (NOT done here)"
  ansible.builtin.debug:
    msg: "⚠️ Remove split-DNS host override '{{ _svc.split_dns }}' from inventories/prod/group_vars/opnsense.yml (opn_unbound.host_overrides) + apply."
  when: _svc.split_dns is defined

- name: "decommission | Summary"
  ansible.builtin.debug:
    msg: >-
      {{ 'DRY RUN, nothing was removed. A real run gives: ' if ansible_check_mode else '' }}{{ decommission_target }} ABSENT —
      db:{{ ('dumped+dropped' if (_dbchk.stdout | default('') | trim) == '1' else 'already absent') if _svc.db is defined else '-' }}
      secrets:{{ (_svc.secrets | default([])) | length }}
      route:{{ 'removed' if _svc.traefik_route is defined else '-' }}
      authentik:{{ 'removed' if _svc.authentik_app is defined else '-' }}
      crowdsec:{{ 'removed' if _svc.crowdsec_machine is defined else '-' }}.
      Guest(TF){{ '=' + _svc.guest if _svc.guest is defined else '' }} + split-DNS are flagged, not auto-removed.
