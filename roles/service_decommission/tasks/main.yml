---
# The footprint comes from the platform service catalog, not a second hand-kept list. Emptying
# that list in #535 was right — it only ever covered 4 of 32 services — but it left this role
# with nothing to read, so it refused every target. services.yml already records the database,
# the route and the host for all of them; decommission_catalog now only carries the leftovers
# of a service whose role is already gone, where there is no catalog row left to read.
- name: "decommission | Require a target"
  ansible.builtin.assert:
    that: decommission_target | length > 0
    fail_msg: "Set -e decommission_target=<name>, as it appears in group_vars/all/services.yml."
    quiet: true

- name: "decommission | Resolve the service from the platform catalog"
  ansible.builtin.set_fact:
    _row: >-
      {{ (platform_services | default([]) | selectattr('name', 'equalto', decommission_target)
          | list | first) | default({}, true) }}
    _stamp: "{{ lookup('pipe', 'date +%Y-%m-%d') }}"

- name: "decommission | The service must be known somewhere"
  ansible.builtin.assert:
    that: (_row | length > 0) or (decommission_target in decommission_catalog)
    fail_msg: >-
      '{{ decommission_target }}' is in neither services.yml nor decommission_catalog.
      A service that was never catalogued cannot be decommissioned by code.
    success_msg: "Decommissioning '{{ decommission_target }}' (ABSENT)."

- name: "decommission | Pin the service footprint"
  ansible.builtin.set_fact:
    _svc: >-
      {{ decommission_catalog[decommission_target]
         if decommission_target in decommission_catalog
         else {'db': ({'database': _row.name, 'role': _row.name} if _row.db | default('none') != 'none' else omit),
               'traefik_route': (_row.name if _row.fqdn | default(None) else omit),
               'secrets': []} }}

# ============================ Postgres DB + role =============================
- name: "decommission | DB — dump (archive) then drop"
  when: _svc.db is defined
  block:
    - name: "decommission | DB present?"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -tAc,
               "select 1 from pg_database where datname='{{ _svc.db.database }}'"]
      delegate_to: "{{ decommission_pg_host }}"
      register: _dbchk
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
      changed_when: false

    - name: "decommission | Dump the DB before dropping (custom format)"
      ansible.builtin.shell:
        cmd: "docker exec {{ decommission_pg_container }} pg_dump -U postgres -Fc {{ _svc.db.database }} > /tmp/{{ _svc.db.database }}.dump"
      delegate_to: "{{ decommission_pg_host }}"
      changed_when: true
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | Ensure the controller archive dir"
      ansible.builtin.file:
        path: "{{ decommission_dump_dir }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | Fetch the dump to the controller archive"
      ansible.builtin.fetch:
        src: "/tmp/{{ _svc.db.database }}.dump"
        dest: "{{ decommission_dump_dir }}/{{ _svc.db.database }}-{{ _stamp }}.dump"
        flat: true
      delegate_to: "{{ decommission_pg_host }}"
      when: (_dbchk.stdout | trim) == '1'

    - name: "decommission | DROP DATABASE (FORCE)"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -c,
               "DROP DATABASE IF EXISTS {{ _svc.db.database }} WITH (FORCE);"]
      delegate_to: "{{ decommission_pg_host }}"
      register: _dbdrop
      changed_when: "'DROP DATABASE' in _dbdrop.stdout"

    - name: "decommission | DROP ROLE"
      ansible.builtin.command:
        argv: [docker, exec, "{{ decommission_pg_container }}", psql, -U, postgres, -c,
               "DROP ROLE IF EXISTS {{ _svc.db.role }};"]
      delegate_to: "{{ decommission_pg_host }}"
      register: _roledrop
      changed_when: "'DROP ROLE' in _roledrop.stdout"
      when: _svc.db.role is defined

# ============================ Secrets (archive) ==============================
- name: "decommission | Secrets — archive in Vault + move fabric files"
  when: (_svc.secrets | default([])) | length > 0
  block:
    - name: "decommission | Authenticate to Vault (ansible-deploy AppRole; root fallback)"
      ansible.builtin.include_role:
        name: vault_login

    - name: "decommission | Use the deploy token"
      ansible.builtin.set_fact:
        _vault_root_token: "{{ vault_deploy_token }}"
      no_log: true

    - name: "decommission | Stage the token on the vault host (0600)"
      ansible.builtin.copy:
        dest: /tmp/.vt
        content: "{{ _vault_root_token }}"
        mode: "0600"
      delegate_to: "{{ groups['vault'][0] }}"
      no_log: true

    - name: "decommission | Stage the archive script on the vault host"
      ansible.builtin.copy:
        src: vault_archive_secret.py
        dest: /tmp/vault_archive_secret.py
        mode: "0644"
      delegate_to: "{{ groups['vault'][0] }}"

    - name: "decommission | Archive the secrets in Vault (-> fabric/archive/)"
      ansible.builtin.command:
        argv: "{{ ['python3', '/tmp/vault_archive_secret.py'] + _svc.secrets }}"
      delegate_to: "{{ groups['vault'][0] }}"
      register: _secarch
      changed_when: "'CHANGED=0' not in _secarch.stdout"

    - name: "decommission | Remove the staged token"
      ansible.builtin.file:
        path: /tmp/.vt
        state: absent
      delegate_to: "{{ groups['vault'][0] }}"

    - name: "decommission | Move the fabric secret files to _stale (controller)"
      ansible.builtin.command:
        cmd: "mv {{ (vault_secret_dir | expanduser) }}/fabric/{{ item }}.json {{ decommission_stale_dir }}/{{ item }}.json"
        removes: "{{ (vault_secret_dir | expanduser) }}/fabric/{{ item }}.json"
      delegate_to: localhost
      loop: "{{ _svc.secrets }}"

# ============================ Traefik route =================================
# roles/traefik_route owns route files in both directions. Deleting one by path here meant
# two places knew where routes live and what they are called — and the withdrawal only
# existed in this role, so a service torn down any other way left its router behind.
- name: "decommission | Withdraw the Traefik route"
  ansible.builtin.include_role:
    name: traefik_route
  vars:
    traefik_route_name: "{{ _svc.traefik_route }}"
    traefik_route_fqdn: ""
    traefik_route_backend_url: ""
    traefik_route_state: absent
  when: _svc.traefik_route is defined

# ============================ Authentik OIDC app ============================
- name: "decommission | Remove the Authentik app + provider (+ group)"
  when: _svc.authentik_app is defined
  block:
    - name: "decommission | Stage the Authentik remover"
      ansible.builtin.copy:
        src: authentik_remove_app.py
        dest: /tmp/authentik_remove_app.py
        mode: "0644"
      delegate_to: "{{ decommission_authentik_host }}"

    - name: "decommission | Delete the Authentik app + provider (+ group)"
      ansible.builtin.shell:
        cmd: >-
          cat /tmp/authentik_remove_app.py | docker exec -i authentik-server
          python3 - {{ _svc.authentik_app }} {{ _svc.authentik_group | default('') }}
      delegate_to: "{{ decommission_authentik_host }}"
      register: _akdel
      changed_when: "'CHANGED=0' not in _akdel.stdout"

# ============================ CrowdSec machine ==============================
- name: "decommission | Delete the CrowdSec machine"
  ansible.builtin.command:
    argv: [cscli, machines, delete, "{{ _svc.crowdsec_machine }}"]
  delegate_to: "{{ decommission_crowdsec_host }}"
  register: _csdel
  changed_when: _csdel.rc == 0
  failed_when:
    - _csdel.rc != 0
    - "'exist' not in (_csdel.stderr | default('') | lower)"
  when: _svc.crowdsec_machine is defined

# ==================== Guest + split-DNS (flagged, not auto) =================
- name: "decommission | Guest VM/LXC → destroy in Terraform (NOT done here)"
  ansible.builtin.debug:
    msg: "⚠️ Guest '{{ _svc.guest }}' is Terraform-managed — remove it in infra-terraform-proxmox (module / terraform destroy -target). Not auto-destroyed by design."
  when: _svc.guest is defined

- name: "decommission | Split-DNS override → remove from the FW catalog (NOT done here)"
  ansible.builtin.debug:
    msg: "⚠️ Remove split-DNS host override '{{ _svc.split_dns }}' from inventories/prod/group_vars/opnsense.yml (opn_unbound.host_overrides) + apply."
  when: _svc.split_dns is defined

- name: "decommission | Summary"
  ansible.builtin.debug:
    msg: >-
      {{ decommission_target }} ABSENT —
      db:{{ 'dumped+dropped' if _svc.db is defined else '-' }}
      secrets:{{ (_svc.secrets | default([])) | length }}
      route:{{ 'removed' if _svc.traefik_route is defined else '-' }}
      authentik:{{ 'removed' if _svc.authentik_app is defined else '-' }}
      crowdsec:{{ 'removed' if _svc.crowdsec_machine is defined else '-' }}.
      Guest(TF){{ '=' + _svc.guest if _svc.guest is defined else '' }} + split-DNS are flagged, not auto-removed.
