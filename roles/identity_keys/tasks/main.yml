---
# Runs on the controller. Get-or-create per identity: keys are generated only for an
# identity whose Vault entry has none, with Ansible modules (no shell script). Private
# material exists only in a transient 0700 directory (removed in `always`) and in Vault.
- name: "IdKeys | Which identities already have keys (roles/vault_secret, optional reads)"
  ansible.builtin.include_role:
    name: vault_secret
    tasks_from: many
  vars:
    vault_secret_optional: true
    vault_secret_mount: "{{ identity_keys_vault_mount }}"
    vault_secret_host: "{{ identity_keys_vault_host }}"
    vault_secret_container: "{{ identity_keys_vault_container }}"
    vault_secret_paths: >-
      {{ identity_keys_people | map(attribute='username')
         | map('regex_replace', '^', identity_keys_path_prefix ~ '/')
         | map('regex_replace', '$', '/keys') | list }}

- name: "IdKeys | Identities missing keys"
  ansible.builtin.set_fact:
    identity_keys_missing: "{{ identity_keys_people | rejectattr('username', 'in', _have) | list }}"
  vars:
    _have: >-
      {{ vault_secret_results | dict2items
         | selectattr('value.ssh_fingerprint', 'defined')
         | map(attribute='key') | map('regex_replace', '^' ~ identity_keys_path_prefix ~ '/', '')
         | map('regex_replace', '/keys$', '') | list }}
  no_log: true

- name: "IdKeys | Generate + escrow for each identity missing keys"
  ansible.builtin.include_tasks: one.yml
  loop: "{{ identity_keys_missing }}"
  loop_control:
    loop_var: ik_person
    label: "{{ ik_person.username }}"
