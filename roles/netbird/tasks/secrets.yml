---
# NetBird secrets (multi-container / Authentik-direct model), all from Vault.
#   {env}/netbird/core         — datastore_enc_key / relay_auth_secret / turn_password
#                                (get-or-create: minted on first run, reused after).
#   {env}/netbird/oidc         — Authentik OIDC client_id / client_secret (public
#                                client; the authentik role provisions it). Read.
#   {env}/netbird/authentik-sa — IdP-manager service account username + app token. Read.
# There is NO local owner secret: the first @{{ platform_domain }} user to log in via
# Authentik becomes the account owner (single-account mode). All facts no_log.

- name: "secrets | NetBird core secrets (Vault, get-or-create)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbird_core_vault_path }}"
    vault_secret_init:
      # datastore encryptionKey must be base64 of 32 bytes (Go base64.StdEncoding).
      datastore_enc_key: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
      relay_auth_secret: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      turn_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      url: "https://{{ netbird_fqdn }}"

- name: "secrets | Bind them"
  ansible.builtin.set_fact:
    netbird_core: "{{ vault_secret_result }}"
  no_log: true

- name: "secrets | Authentik OIDC client (Vault, read — the authentik role mints it)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbird_oidc_vault_path }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    netbird_oidc: "{{ vault_secret_result }}"
  no_log: true

- name: "secrets | IdP-manager service account (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbird_sa_vault_path }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    netbird_sa: "{{ vault_secret_result }}"
  no_log: true
