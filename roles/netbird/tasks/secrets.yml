---
# NetBird secrets (multi-container / Authentik-direct model). All facts no_log.
# Three secret files on the controller:
#   netbird-core.json         — datastore_enc_key / relay_auth_secret / turn_password
#                               (generated here if absent; reused otherwise).
#   app-oidc-netbird.json     — Authentik OIDC client_id / client_secret (public
#                               client; already provisioned with the Authentik side).
#   netbird-authentik-sa.json — IdP-manager service account username + app token.
# There is NO local owner secret: the first @by-research.be user to log in via
# Authentik becomes the account owner (single-account mode).

# --- core control-plane secrets -------------------------------------------------
- name: "secrets | Stat netbird core secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_core_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_core_stat

- name: "secrets | Load existing netbird core secrets"
  ansible.builtin.set_fact:
    netbird_core: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_core_secret_file) | from_json).fields }}"
  no_log: true
  when: netbird_core_stat.stat.exists

- name: "secrets | Generate netbird core secrets (first run)"
  ansible.builtin.set_fact:
    netbird_core:
      # datastore encryptionKey must be base64 of 32 bytes (Go base64.StdEncoding).
      datastore_enc_key: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
      relay_auth_secret: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      turn_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  no_log: true
  when: not netbird_core_stat.stat.exists

- name: "secrets | Persist netbird core secret (0600)"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_core_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (netbird_core | combine({'url': 'https://' + netbird_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_core_stat.stat.exists

# --- Authentik OIDC client (public) ---------------------------------------------
- name: "secrets | Assert the Authentik OIDC client secret file exists"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_oidc_stat

- name: "secrets | Fail clearly if the Authentik OIDC client is missing"
  ansible.builtin.fail:
    msg: >-
      {{ netbird_oidc_secret_file }} not found. The Authentik side must be
      provisioned first (OAuth2 provider 'netbird', public client) and its
      client_id/client_secret written to that file.
  when: not netbird_oidc_stat.stat.exists

- name: "secrets | Load the Authentik OIDC client id/secret"
  ansible.builtin.set_fact:
    netbird_oidc: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_oidc_secret_file) | from_json).fields }}"
  no_log: true

# --- IdP-manager service account -------------------------------------------------
- name: "secrets | Assert the Authentik service-account file exists"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_authentik_sa_file }}"
  delegate_to: localhost
  become: false
  register: netbird_sa_stat

- name: "secrets | Fail clearly if the service account is missing"
  ansible.builtin.fail:
    msg: >-
      {{ netbird_authentik_sa_file }} not found. Create the Authentik service
      account 'NetBird' (in group 'authentik Admins'), generate its app-password
      token, and write username/password to that file.
  when: not netbird_sa_stat.stat.exists

- name: "secrets | Load the IdP-manager service account (username + app token)"
  ansible.builtin.set_fact:
    netbird_sa: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_authentik_sa_file) | from_json).fields }}"
  no_log: true

# PostgreSQL credentials for the management store (services/0004). Same
# secret-file pattern as every other service; the database and scoped user
# already exist.
- name: "secrets | Load the NetBird PostgreSQL credentials"
  ansible.builtin.set_fact:
    netbird_pg: >-
      {{ (lookup('file', netbird_secret_dir + '/' + netbird_pg_secret_file)
          | from_json).fields }}
  no_log: true
  when: netbird_store_engine == 'postgres'
