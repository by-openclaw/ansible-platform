---
# NetBird control-plane secrets (reuse if present, else generate + persist). All
# facts no_log. The relay authSecret + datastore encryptionKey mirror the
# getting-started.sh defaults (datastore key = base64 of 32 bytes, padding KEPT).
- name: "secrets | Stat netbird core secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_core_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_core_stat

- name: "secrets | Load existing netbird core secrets"
  ansible.builtin.set_fact:
    netbird_secrets: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_core_secret_file) | from_json).fields }}"
  no_log: true
  when: netbird_core_stat.stat.exists

- name: "secrets | Generate netbird core secrets"
  ansible.builtin.set_fact:
    netbird_secrets:
      # datastore encryptionKey must be base64 of 32 bytes (Go base64.StdEncoding,
      # padding kept) — b64encode of a 32-char string yields a valid 44-char key.
      datastore_enc_key: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
      relay_auth_secret: "{{ lookup('community.general.random_string', length=40, special=false) }}"
  no_log: true
  when: not netbird_core_stat.stat.exists

- name: "secrets | Persist netbird core secret (0600)"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_core_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (netbird_secrets | combine({'url': 'https://' + netbird_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_core_stat.stat.exists

# Authentik OIDC client id/secret — generated if absent so the SAME values feed
# this role (POST /api/identity-providers) and the authentik blueprint (slug netbird).
- name: "secrets | Stat the authentik oidc secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_oidc_stat

- name: "secrets | Generate the authentik oidc client id/secret"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_oidc_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': {'client_id': lookup('community.general.random_string', length=40, special=false),
      'client_secret': lookup('community.general.random_string', length=64, special=false),
      'url': 'https://' + netbird_fqdn}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_oidc_stat.stat.exists

- name: "secrets | Load the authentik oidc client id and secret"
  ansible.builtin.set_fact:
    netbird_oidc: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_oidc_secret_file) | from_json).fields }}"
  no_log: true

# Bootstrap owner password (local Dex break-glass account) — generate + persist.
- name: "secrets | Stat the netbird owner secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_owner_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_owner_stat

- name: "secrets | Generate the netbird owner secret"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_owner_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': {'email': netbird_owner_email, 'name': netbird_owner_name,
      'password': lookup('community.general.random_string', length=28, special=true, override_special='-_.@')}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_owner_stat.stat.exists

- name: "secrets | Load the netbird owner credentials"
  ansible.builtin.set_fact:
    netbird_owner: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_owner_secret_file) | from_json).fields }}"
  no_log: true
