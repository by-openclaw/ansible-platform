---
# NetBird control-plane secrets: reuse the controller secret if present, else
# generate + persist. The Authentik OIDC client id/secret live in their own file
# (shared with the authentik blueprint). DB password from its postgres_db file.
# All facts no_log.
- name: "secrets | Stat netbird core secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_secret_stat

- name: "secrets | Load existing netbird core secrets"
  ansible.builtin.set_fact:
    netbird_secrets: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_secret_file) | from_json).fields }}"
  no_log: true
  when: netbird_secret_stat.stat.exists

- name: "secrets | Generate netbird core secrets"
  ansible.builtin.set_fact:
    netbird_secrets:
      # DataStoreEncryptionKey must be a base64-encoded 32-byte key.
      datastore_enc_key: "{{ lookup('community.general.random_string', length=32, special=false) | b64encode }}"
      relay_auth_secret: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      turn_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  no_log: true
  when: not netbird_secret_stat.stat.exists

- name: "secrets | Persist netbird core secret (0600)"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (netbird_secrets | combine({'url': 'https://' + netbird_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_secret_stat.stat.exists

- name: "secrets | Load the postgresql password"
  ansible.builtin.set_fact:
    netbird_pg_password: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_pg_secret_file) | from_json).fields.password }}"
  no_log: true

# Authentik OIDC client id/secret — generated here if absent so the SAME values
# feed both this role and the authentik blueprint (authentik_oidc_apps: netbird).
- name: "secrets | Stat the authentik oidc secret on controller"
  ansible.builtin.stat:
    path: "{{ netbird_secret_dir }}/{{ netbird_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: netbird_oidc_stat

- name: "secrets | Generate the authentik oidc client id/secret"
  ansible.builtin.copy:
    dest: "{{ netbird_secret_dir }}/{{ netbird_oidc_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': {'client_id': lookup('community.general.random_string', length=40, special=false),
      'client_secret': lookup('community.general.random_string', length=64, special=false),
      'url': 'https://' + netbird_fqdn}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not netbird_oidc_stat.stat.exists

- name: "secrets | Load the authentik oidc client id and secret"
  ansible.builtin.set_fact:
    netbird_oidc: "{{ (lookup('file', netbird_secret_dir + '/' + netbird_oidc_secret_file) | from_json).fields }}"
  no_log: true

# --- environment for each container --------------------------------------------
- name: "secrets | Build the management environment"
  ansible.builtin.set_fact:
    netbird_management_env:
      # PostgreSQL store (verified TLS via libpq DSN params).
      NETBIRD_STORE_ENGINE_POSTGRES_DSN: >-
        host={{ netbird_pg_host }} port={{ netbird_pg_port }} user={{ netbird_pg_user }}
        password={{ netbird_pg_password }} dbname={{ netbird_pg_name }}
        sslmode={{ netbird_pg_sslmode }} sslrootcert={{ netbird_pg_sslrootcert }}
      NETBIRD_STORE_ENGINE_MYSQL_DSN: ""
  no_log: true

- name: "secrets | Build the dashboard environment"
  ansible.builtin.set_fact:
    netbird_dashboard_env:
      NETBIRD_MGMT_API_ENDPOINT: "https://{{ netbird_fqdn }}"
      NETBIRD_MGMT_GRPC_API_ENDPOINT: "https://{{ netbird_fqdn }}"
      AUTH_AUDIENCE: "{{ netbird_oidc.client_id }}"
      AUTH_CLIENT_ID: "{{ netbird_oidc.client_id }}"
      AUTH_CLIENT_SECRET: "{{ netbird_oidc.client_secret }}"
      AUTH_AUTHORITY: "{{ netbird_oidc_issuer }}"
      USE_AUTH0: "false"
      AUTH_SUPPORTED_SCOPES: "{{ netbird_oidc_scopes }}"
      AUTH_REDIRECT_URI: "/auth"
      AUTH_SILENT_REDIRECT_URI: "/silent-auth"
      NETBIRD_TOKEN_SOURCE: "accessToken"
  no_log: true

- name: "secrets | Build the relay environment"
  ansible.builtin.set_fact:
    netbird_relay_env:
      NB_LOG_LEVEL: "info"
      NB_LISTEN_ADDRESS: ":{{ netbird_relay_port }}"
      NB_EXPOSED_ADDRESS: "{{ netbird_relay_endpoint }}"
      NB_AUTH_SECRET: "{{ netbird_secrets.relay_auth_secret }}"
  no_log: true
