---
# ==============================================================================
# netbird | retired — nothing the role no longer manages stays on the host.
# Each item is idempotent: once gone, these tasks are no-ops.
#   * approval notifier (unwired; ran every 5 min with a dead token, #382):
#     stopped, disabled, its units/script/state moved to the archive directory;
#     its token copy removed (the live token is in Vault).
#   * /root/.nb_setup_key: the router setup key lives in Vault.
#   * SQLite store files in the volume: management runs on PostgreSQL and the
#     migration archived them under {{ netbird_sqlite_archive_dir }}/sqlite-*.
#   * empty store-backup-* directories under the build dir (an earlier, manual
#     store copy whose content moved on): only removed when nothing is inside.
# ==============================================================================

- name: "retired | Approval notifier units present?"
  ansible.builtin.stat:
    path: "/etc/systemd/system/netbird-approval-notify.{{ item }}"
  loop: [timer, service]
  register: netbird_retired_units

- name: "retired | Stop + disable the approval notifier"
  ansible.builtin.systemd_service:
    name: "netbird-approval-notify.{{ item.item }}"
    state: stopped
    enabled: false
  loop: "{{ netbird_retired_units.results }}"
  loop_control: { label: "{{ item.item }}" }
  when: item.stat.exists

- name: "retired | The notifier's units, script and state (git holds the code)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/systemd/system/netbird-approval-notify.timer
    - /etc/systemd/system/netbird-approval-notify.service
    - /usr/local/bin/netbird-approval-notify
    - /var/lib/netbird-approval-notified.json
  register: netbird_retired_moved

- name: "retired | Reload systemd after removing the units"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: netbird_retired_moved is changed

- name: "retired | Secret copies superseded by Vault"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/netbird/automation-token.json          # dead token of the retired notifier
    - "{{ netbird_router_setup_key_legacy_file }}" # router setup key → Vault

- name: "retired | Archived copies of the SQLite store"
  ansible.builtin.find:
    paths: "{{ netbird_sqlite_archive_dir }}"
    patterns: [store.db, events.db]
    recurse: true
  register: netbird_sqlite_archived

- name: "retired | Is management on PostgreSQL? (live management.json)"
  ansible.builtin.slurp:
    src: "{{ netbird_build_dir }}/management.json"
  register: netbird_retired_mgmt
  check_mode: false

# Only once management runs on PostgreSQL AND both files have an archived copy.
- name: "retired | Remove the SQLite store files from the volume"
  ansible.builtin.file:
    path: "/var/lib/docker/volumes/{{ netbird_mgmt_volume }}/_data/{{ item }}"
    state: absent
  loop: [store.db, store.db-journal, events.db]
  when:
    - ((netbird_retired_mgmt.content | b64decode | from_json).StoreConfig.Engine | default('')) == 'postgres'
    - (netbird_sqlite_archived.files | map(attribute='path') | map('basename') | unique | sort) == ['events.db', 'store.db']

# The migration's rollback material: SQLite copies on this host and the renamed stale
# databases (<db>_archive_<stamp>). Once management runs on PostgreSQL and the live
# SQLite files are gone it is not needed; the last copies live in the nightly
# pg_dumpall and the PBS backups of both hosts.
- name: "retired | Live SQLite files still on the volume?"
  ansible.builtin.stat:
    path: "/var/lib/docker/volumes/{{ netbird_mgmt_volume }}/_data/store.db"
  register: netbird_live_sqlite

- name: "retired | Migration archives removed (PostgreSQL store proven)"
  when:
    - ((netbird_retired_mgmt.content | b64decode | from_json).StoreConfig.Engine | default('')) == 'postgres'
    - not netbird_live_sqlite.stat.exists
  block:
    - name: "retired | The archive directory (SQLite copies, the retired notifier)"
      ansible.builtin.file:
        path: "{{ netbird_sqlite_archive_dir }}"
        state: absent

    - name: "retired | Archived databases on the shared PostgreSQL"
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - "{{ netbird_pg_container }}"
          - psql
          - -U
          - postgres
          - -Atc
          - "select datname from pg_database where datname like '{{ netbird_pg_database }}\\_archive\\_%'"
      delegate_to: "{{ netbird_pg_delegate }}"
      register: netbird_archived_dbs
      changed_when: false
      check_mode: false   # read-only probe

    - name: "retired | Drop them"
      ansible.builtin.command:
        argv: [docker, exec, "{{ netbird_pg_container }}", psql, -U, postgres, -c, 'DROP DATABASE "{{ item }}"']
      loop: "{{ netbird_archived_dbs.stdout_lines }}"
      delegate_to: "{{ netbird_pg_delegate }}"
      changed_when: true

- name: "retired | store-backup-* directories left by the first store copy"
  ansible.builtin.find:
    paths: "{{ netbird_build_dir }}"
    patterns: ["store-backup-*"]
    file_type: directory
    recurse: false
  register: netbird_store_backup_dirs

- name: "retired | Anything still inside them?"
  ansible.builtin.find:
    paths: "{{ netbird_store_backup_dirs.files | map(attribute='path') | list }}"
    recurse: true
    file_type: any
  register: netbird_store_backup_content
  when: netbird_store_backup_dirs.files | length > 0

- name: "retired | Remove the empty ones (a non-empty copy is kept)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ netbird_store_backup_dirs.files | map(attribute='path') | list }}"
  when:
    - netbird_store_backup_dirs.files | length > 0
    - (netbird_store_backup_content.files | default([]) | map(attribute='path') | select('match', item ~ '/') | list | length) == 0
