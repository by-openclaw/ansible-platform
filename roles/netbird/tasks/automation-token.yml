---
# Machine authentication for the NetBird public API — NON-HUMAN, no PAT.
#
# NetBird accepts two auth schemes (docs.netbird.io/api/guides/authentication):
# a Personal Access Token, OR an OAuth2 Bearer JWT from the configured IdP — and
# the docs recommend a SERVICE USER for "all organization-wide flows calling the
# API". We use the second: a client-credentials grant against Authentik with the
# dedicated NetBird service account (group 'authentik Admins'). The JWT is minted
# fresh every run and used within the run, so there is nothing to persist, expire,
# or rotate — and no human is ever in the loop. Sets `netbird_auth_header`, the
# Authorization value consumed by routing-peer / vpn-tiers / account-settings.
#
# Inputs (already loaded by secrets.yml + oidc-discovery.yml):
#   netbird_oidc.client_id / .client_secret  — Authentik OIDC app (app-oidc-netbird)
#   netbird_sa.username / .password           — service account (netbird-authentik-sa)
#   netbird_oidc_token                        — discovered token endpoint

- name: "automation-token | Mint a client-credentials JWT from Authentik (machine auth)"
  ansible.builtin.uri:
    url: "{{ netbird_oidc_token }}"
    method: POST
    body_format: form-urlencoded
    body:
      grant_type: client_credentials
      client_id: "{{ netbird_oidc.client_id }}"
      client_secret: "{{ netbird_oidc.client_secret | default('', true) }}"
      username: "{{ netbird_sa.username }}"
      password: "{{ netbird_sa.password }}"
      scope: "openid profile email"
    status_code: [200]
  register: netbird_cc_token
  changed_when: false
  no_log: true
  when:
    - netbird_oidc.client_id | default('') | length > 0
    - netbird_sa.username | default('') | length > 0

- name: "automation-token | Bind the API Authorization header (Bearer JWT)"
  ansible.builtin.set_fact:
    netbird_auth_header: "Bearer {{ netbird_cc_token.json.access_token }}"
  no_log: true
  when:
    - netbird_cc_token is defined
    - netbird_cc_token.json is defined
    - netbird_cc_token.json.access_token is defined

- name: "automation-token | Summary"
  ansible.builtin.debug:
    msg: >-
      NetBird API auth: {{ 'client-credentials JWT for service account '
        + netbird_sa.username + ' (non-human, minted this run)'
        if (netbird_auth_header is defined)
        else 'UNAVAILABLE — check the Authentik OIDC client (app-oidc-netbird) and '
             + 'the NetBird service account (netbird-authentik-sa) in group authentik Admins' }}
