---
# ==============================================================================
# netbird | store — management + activity stores on the shared PostgreSQL.
#
# Databases come from roles/postgres_db (owner role + password in Vault).
# The one-time migration from SQLite (2026-09) is archived: tasks/_archive/store_migration.yml.
# ==============================================================================

# Statements that write run on the cluster's LEADER (a replica is read-only): ask once.
- name: "store | Which PostgreSQL member leads"
  ansible.builtin.include_role:
    name: postgres_db
    tasks_from: leader
  when: platform_pg_leader is not defined

- name: "store | The live management.json (which engine is running now?)"
  ansible.builtin.slurp:
    src: "{{ netbird_build_dir }}/management.json"
  register: netbird_live_mgmt_json
  failed_when: false
  check_mode: false  # read-only

# The one-time SQLite → PostgreSQL migration ran in 2026-09 and is archived
# (tasks/_archive/store_migration.yml). A store that is still on SQLite is refused here rather
# than silently pointed at an empty PostgreSQL database.
- name: "store | The live store is not SQLite"
  ansible.builtin.assert:
    that: not (netbird_store_on_sqlite | bool)
    fail_msg: >-
      This NetBird still runs on SQLite. The one-time migration to PostgreSQL is archived in
      roles/netbird/tasks/_archive/store_migration.yml: put its tasks back in tasks/store.yml
      (after the two postgres_db includes) to migrate, then archive them again.
    quiet: true

- name: "store | Management store database + owner (postgres_db, Vault)"
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    postgres_db_name: "{{ netbird_pg_database }}"
    postgres_db_user: "{{ netbird_pg_user }}"
    postgres_db_vault_path: "{{ netbird_pg_vault_path }}"

- name: "store | Bind the store password"
  ansible.builtin.set_fact:
    netbird_pg_password: "{{ postgres_db_password }}"
  no_log: true

- name: "store | Activity events database + owner (postgres_db, Vault)"
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    postgres_db_name: "{{ netbird_events_pg_database }}"
    postgres_db_user: "{{ netbird_events_pg_user }}"
    postgres_db_vault_path: "{{ netbird_events_pg_vault_path }}"

- name: "store | Bind the events password"
  ansible.builtin.set_fact:
    netbird_events_pg_password: "{{ postgres_db_password }}"
  no_log: true
