---
# ==============================================================================
# Enroll THIS host as a NetBird routing peer so remote VPN clients reach the
# internal LAN (and resolve internal names via AdGuard). Two halves:
#   server-side (NetBird API on :80): routers group, reusable setup key, the
#                10.1.0.0/16 route, the AdGuard DNS nameserver — all GET-checked
#                before POST so re-runs are no-ops (the API does NOT dedupe).
#   peer-side  : /etc/hosts pin (no hairpin), IP forwarding, install the client,
#                `netbird up` once (skipped when already Connected).
# Gated by netbird_routing_peer_enabled. Tag: routing.
# ==============================================================================

- name: "routing-peer | Require the automation token (set by automation-token.yml)"
  ansible.builtin.assert:
    that: netbird_auth_header is defined and (netbird_auth_header | length > 0)
    fail_msg: >-
      netbird_auth_header not set — automation-token.yml must run first (it mints a
      client-credentials JWT for the NetBird service account). Check the Authentik
      OIDC client + service account.
    quiet: true

- name: "routing-peer | Local NetBird API base + peer-match facts"
  ansible.builtin.set_fact:
    netbird_rp_api: "http://{{ netbird_listen_ip }}:{{ netbird_api_port }}"
    netbird_rp_peer_match: "{{ inventory_hostname }}"   # peers API hostname == inventory name

# --- Server-side: routers group -------------------------------------------------
- name: "routing-peer | List NetBird groups"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/groups"
    method: GET
    headers: { Authorization: "{{ netbird_auth_header }}" }
    status_code: [200]
  register: netbird_rp_groups
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  no_log: true

- name: "routing-peer | Create the routers group (idempotent)"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/groups"
    method: POST
    headers: { Authorization: "{{ netbird_auth_header }}" }
    body_format: json
    body: { name: "{{ netbird_routers_group }}" }
    status_code: [200, 201]
  register: netbird_rp_routers_grp_new
  no_log: true
  when: (netbird_rp_groups.json | selectattr('name', 'equalto', netbird_routers_group) | list | length) == 0

- name: "routing-peer | Resolve group ids (routers + access group)"
  ansible.builtin.set_fact:
    netbird_rp_routers_gid: >-
      {{ (netbird_rp_groups.json | selectattr('name', 'equalto', netbird_routers_group) | map(attribute='id') | first)
         if (netbird_rp_groups.json | selectattr('name', 'equalto', netbird_routers_group) | list | length)
         else netbird_rp_routers_grp_new.json.id }}
    netbird_rp_access_gid: "{{ netbird_rp_groups.json | selectattr('name', 'equalto', netbird_route_access_group) | map(attribute='id') | first }}"

# --- Server-side: reusable setup key in the routers group -----------------------
- name: "routing-peer | List setup keys"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/setup-keys"
    method: GET
    headers: { Authorization: "{{ netbird_auth_header }}" }
    status_code: [200]
  register: netbird_rp_keys
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  no_log: true

- name: "routing-peer | Create the reusable router setup key (idempotent)"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/setup-keys"
    method: POST
    headers: { Authorization: "{{ netbird_auth_header }}" }
    body_format: json
    body:
      name: "{{ netbird_router_setup_key_name }}"
      type: "reusable"
      expires_in: 31536000      # 1y; reusable so it survives client re-enroll
      usage_limit: 0            # unlimited
      auto_groups: ["{{ netbird_rp_routers_gid }}"]
      ephemeral: false
    status_code: [200, 201]
  register: netbird_rp_key_new
  no_log: true
  when: (netbird_rp_keys.json | selectattr('name', 'equalto', netbird_router_setup_key_name) | list | length) == 0

# The plaintext key is returned ONLY on create, so it is kept in Vault for any later
# (re)enroll. A key that exists server-side but was never stored cannot be recovered
# (delete it in the dashboard to regenerate).
- name: "routing-peer | Store the freshly-created setup key (Vault, overwrite)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbird_router_setup_key_vault_path }}"
    vault_secret_init: { key: "{{ netbird_rp_key_new.json.key }}" }
    vault_secret_force_fields: { key: "{{ netbird_rp_key_new.json.key }}" }
  when: netbird_rp_key_new is defined and netbird_rp_key_new.json is defined

# --- Peer-side: no-hairpin + forwarding + client + enroll -----------------------
- name: "routing-peer | Pin this host's client to Traefik internally (no public hairpin)"
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '\s{{ netbird_fqdn | regex_escape }}$'
    line: "{{ netbird_traefik_ip }} {{ netbird_fqdn }}"
    state: present

# The pin above sends {{ netbird_fqdn }}:{{ netbird_stun_port }} (STUN/TURN) to
# Traefik, which does not serve it → ICE gathering timed out every few minutes.
# coturn is on this host: redirect this host's own packets to it (own nft table).
- name: "routing-peer | Local STUN/TURN redirect — nft table"
  ansible.builtin.template:
    src: netbird-local-stun.nft.j2
    dest: "{{ netbird_local_stun_nft }}"
    owner: root
    group: root
    mode: "0644"
  register: netbird_rp_stun_nft

- name: "routing-peer | Local STUN/TURN redirect — systemd unit"
  ansible.builtin.template:
    src: netbird-local-stun.service.j2
    dest: /etc/systemd/system/netbird-local-stun.service
    owner: root
    group: root
    mode: "0644"
  register: netbird_rp_stun_unit

- name: "routing-peer | Local STUN/TURN redirect — enable + (re)load"
  ansible.builtin.systemd_service:
    name: netbird-local-stun.service
    enabled: true
    state: "{{ 'restarted' if (netbird_rp_stun_nft is changed or netbird_rp_stun_unit is changed) else 'started' }}"
    daemon_reload: "{{ netbird_rp_stun_unit is changed }}"
  when: not ansible_check_mode or (netbird_rp_stun_unit is not changed)

- name: "routing-peer | Enable IP forwarding (router must forward LAN traffic)"
  ansible.posix.sysctl:
    name: "{{ item }}"
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - net.ipv4.ip_forward
    - net.ipv6.conf.all.forwarding

- name: "routing-peer | Is the NetBird apt signing key there?"
  ansible.builtin.stat:
    path: "{{ netbird_client_keyring }}"
  register: netbird_client_key_file

# Fetched once: get_url under --check HEADs the URL and reports "changed" for an identical
# file. A rotated upstream key is a deliberate change (remove the file), never a silent fetch.
- name: "routing-peer | NetBird apt signing key"
  ansible.builtin.get_url:
    url: "{{ netbird_client_key_url }}"
    dest: "{{ netbird_client_keyring }}"
    owner: root
    group: root
    mode: "0644"
  when: not netbird_client_key_file.stat.exists

# install.sh wrote the same source with its own keyring. apt refuses one source with
# two Signed-By values ("Conflicting values set for option Signed-By"), so the old line
# goes BEFORE the new one is added.
- name: "routing-peer | The source line install.sh wrote (other keyring)"
  ansible.builtin.apt_repository:
    repo: "deb [signed-by={{ netbird_client_legacy_keyring }}] {{ netbird_client_repo_url }} stable main"
    filename: netbird
    state: absent
    update_cache: false

- name: "routing-peer | NetBird apt repository"
  ansible.builtin.apt_repository:
    repo: "{{ netbird_client_repo }}"
    filename: netbird
    state: present

- name: "routing-peer | The keyring install.sh left behind (superseded)"
  ansible.builtin.file:
    path: "{{ netbird_client_legacy_keyring }}"
    state: absent

- name: "routing-peer | NetBird client, pinned"
  ansible.builtin.apt:
    name: "netbird={{ netbird_client_version }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "routing-peer | Current client status"
  ansible.builtin.command: netbird status
  register: netbird_rp_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

- name: "routing-peer | The setup key for enrollment (Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbird_router_setup_key_vault_path }}"
    vault_secret_optional: true   # absent → {} (not enrolled yet; created with the key above)

- name: "routing-peer | Bind it"
  ansible.builtin.set_fact:
    netbird_rp_setup_key: "{{ vault_secret_result.key | default('') }}"
  no_log: true

- name: "routing-peer | Enroll this host as a routing peer (netbird up)"
  ansible.builtin.command: >-
    netbird up
    --management-url {{ netbird_http_protocol }}://{{ netbird_fqdn }}
    --setup-key {{ netbird_rp_setup_key }}
    --wireguard-port {{ netbird_host_peer_wg_port }}
    {{ '--external-ip-map ' ~ (netbird_rp_external_ip_map | join(',')) if netbird_rp_external_ip_map | length else '' }}
  register: netbird_rp_up
  changed_when: true
  no_log: true
  when: "'Management: Connected' not in (netbird_rp_status.stdout | default(''))"

# An already-enrolled peer keeps the port/mapping it was enrolled with; read the
# client's own config and re-apply only on drift. `netbird up` does not change the
# settings of a running engine, so drift means down + up (a few seconds without the
# LAN route for connected VPN users).
- name: "routing-peer | Read the client config (WireGuard port + external IP map)"
  ansible.builtin.slurp:
    src: "{{ netbird_rp_client_config }}"
  register: netbird_rp_cfg_raw
  check_mode: false  # read-only: the drift decision below depends on it
  no_log: true       # the file carries the peer's WireGuard private key

- name: "routing-peer | Client settings drift"
  ansible.builtin.set_fact:
    netbird_rp_cfg_drift: >-
      {{ ((netbird_rp_cfg_raw.content | b64decode | from_json).WgPort | default(0) | int) != (netbird_host_peer_wg_port | int)
         or ((netbird_rp_cfg_raw.content | b64decode | from_json).NATExternalIPs | default([], true) | sort)
            != (netbird_rp_external_ip_map | sort) }}
  no_log: true

# Two plain commands, in this order; the second only runs when the first succeeded.
- name: "routing-peer | Client down (to re-apply the WireGuard port + external IP map)"
  ansible.builtin.command:
    argv: [netbird, down]
  changed_when: true
  when: netbird_rp_cfg_drift | bool

- name: "routing-peer | Client up with the WireGuard port + external IP map"
  ansible.builtin.command:
    argv:
      - netbird
      - up
      - --management-url
      - "{{ netbird_http_protocol }}://{{ netbird_fqdn }}"
      - --wireguard-port
      - "{{ netbird_host_peer_wg_port }}"
      - --external-ip-map
      - "{{ netbird_rp_external_ip_map | join(',') }}"
  changed_when: true
  when: netbird_rp_cfg_drift | bool

# --- Server-side: route + DNS (after the peer exists) ---------------------------
- name: "routing-peer | Find this host's peer (wait for enrollment to register)"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/peers"
    method: GET
    headers: { Authorization: "{{ netbird_auth_header }}" }
    status_code: [200]
  register: netbird_rp_peers
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  no_log: true
  until: (netbird_rp_peers.json | selectattr('hostname', 'search', netbird_rp_peer_match) | list | length) > 0
  retries: 12
  delay: 5

- name: "routing-peer | Resolve the router peer id"
  ansible.builtin.set_fact:
    netbird_rp_peer_id: "{{ netbird_rp_peers.json | selectattr('hostname', 'search', netbird_rp_peer_match) | map(attribute='id') | first }}"

- name: "routing-peer | List routes"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/routes"
    method: GET
    headers: { Authorization: "{{ netbird_auth_header }}" }
    status_code: [200]
  register: netbird_rp_routes
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  no_log: true

- name: "routing-peer | Create the internal-LAN route (idempotent)"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/routes"
    method: POST
    headers: { Authorization: "{{ netbird_auth_header }}" }
    body_format: json
    body:
      network_id: "{{ netbird_route_network_id }}"
      network: "{{ netbird_route_network }}"
      peer: "{{ netbird_rp_peer_id }}"
      masquerade: "{{ netbird_route_masquerade }}"
      metric: "{{ netbird_route_metric | int }}"
      enabled: true
      groups: ["{{ netbird_rp_access_gid }}"]
    status_code: [200, 201]
  register: netbird_rp_route_new
  no_log: true
  when: (netbird_rp_routes.json | selectattr('network_id', 'equalto', netbird_route_network_id) | list | length) == 0

- name: "routing-peer | List DNS nameservers"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/dns/nameservers"
    method: GET
    headers: { Authorization: "{{ netbird_auth_header }}" }
    status_code: [200]
  register: netbird_rp_ns
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  no_log: true

- name: "routing-peer | Create the AdGuard DNS nameserver group (idempotent)"
  ansible.builtin.uri:
    url: "{{ netbird_rp_api }}/api/dns/nameservers"
    method: POST
    headers: { Authorization: "{{ netbird_auth_header }}" }
    body_format: json
    body:
      name: "{{ netbird_dns_nameserver_name }}"
      description: "Internal AdGuard (DNS chain head)"
      nameservers:
        - ip: "{{ netbird_dns_nameserver_ip }}"
          ns_type: "udp"
          port: "{{ netbird_dns_nameserver_port | int }}"
      enabled: true
      groups: ["{{ netbird_rp_access_gid }}"]
      primary: true            # catch-all resolver for tunnelled peers
      domains: []
      search_domains_enabled: false
    status_code: [200, 201]
  register: netbird_rp_ns_new
  no_log: true
  when: (netbird_rp_ns.json | selectattr('name', 'equalto', netbird_dns_nameserver_name) | list | length) == 0

- name: "routing-peer | Routing-peer summary"
  ansible.builtin.debug:
    msg:
      - "router peer: {{ netbird_rp_peer_id }} (group {{ netbird_routers_group }})"
      - "route {{ netbird_route_network }}: {{ 'created' if netbird_rp_route_new is changed else 'present' }}"
      - "DNS {{ netbird_dns_nameserver_ip }}: {{ 'created' if netbird_rp_ns_new is changed else 'present' }}"
      - "client enroll: {{ 'ran' if netbird_rp_up is changed else 'already Connected' }}"
