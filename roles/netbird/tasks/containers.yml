---
# Multi-container NetBird stack (official Traefik compose, in pure Ansible). The
# old combined `netbird-server` is removed first (it held host :80 + :3478, which
# the new dashboard + coturn need). TLS is terminated by our Traefik; every
# backend here is plaintext (gRPC = h2c).

# --- Remove the old combined container + its config -----------------------------
- name: "containers | Remove the old combined netbird-server (model swap)"
  community.docker.docker_container:
    name: netbird-server
    state: absent

- name: "containers | Remove the stale combined config.yaml"
  ansible.builtin.file:
    path: "{{ netbird_build_dir }}/config.yaml"
    state: absent

# --- Build dir + rendered config ------------------------------------------------
- name: "containers | Create the netbird build directory"
  ansible.builtin.file:
    path: "{{ netbird_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "containers | Render management.json (Authentik-direct)"
  ansible.builtin.template:
    src: management.json.j2
    dest: "{{ netbird_build_dir }}/management.json"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: "Restart netbird management"

- name: "containers | Validate the rendered management.json is valid JSON"
  ansible.builtin.command: "python3 -c \"import json,sys; json.load(open('{{ netbird_build_dir }}/management.json'))\""
  changed_when: false

- name: "containers | Render turnserver.conf"
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: "{{ netbird_build_dir }}/turnserver.conf"
    owner: root
    # coturn runs as {{ netbird_coturn_gid }} (nobody:nogroup) in the image. With
    # group root it could not read this file and ran on built-in defaults: no
    # realm, no user → every TURN allocate failed and peers' ICE gathering timed out.
    group: "{{ netbird_coturn_gid }}"
    mode: "0640"
  no_log: true
  notify: "Restart netbird coturn"

- name: "containers | Render dashboard.env"
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ netbird_build_dir }}/dashboard.env"
    owner: root
    group: root
    mode: "0640"
  notify: "Restart netbird dashboard"

# --- Network + images -----------------------------------------------------------
# The containers run through the scaffold's containers step (the one owner of "run a
# pinned container"): the four on the netbird network in one call, coturn on the host
# network in its own. Each call pulls its pinned images and ensures its network.
- name: "containers | dashboard, management, signal, relay (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: netbird
      network: netbird
      containers:
        - name: netbird-dashboard
          image: "{{ netbird_dashboard_image }}"
          restart_policy: unless-stopped
          published:
            - "{{ netbird_listen_ip }}:{{ netbird_dashboard_port }}:80"
          env_file: "{{ netbird_build_dir }}/dashboard.env"
          log_driver: journald   # container logs -> journal -> promtail -> Loki (INF-27)
        - name: netbird-management
          image: "{{ netbird_management_image }}"
          restart_policy: unless-stopped
          published:
            - "{{ netbird_listen_ip }}:{{ netbird_mgmt_port }}:{{ netbird_mgmt_port }}"
            - "{{ netbird_listen_ip }}:{{ netbird_mgmt_metrics_port }}:{{ netbird_metrics_port_internal }}"   # /metrics (INF-33)
          # Resolve Authentik internally via our Traefik (no public hairpin; survives the
          # NetBird client rewriting host resolv.conf once the routing peer is up — #408).
          #
          # Built from an EXPRESSION, not a YAML mapping: Ansible does not template mapping
          # KEYS. It was written as `authentik.{{ platform_domain }}: "<ip>"`, and the live
          # container carried that literally —
          #     "ExtraHosts": ["authentik.{{ platform_domain }}:10.1.2.110"]
          # — so the pin never existed and management resolved Authentik through whatever
          # resolv.conf said, which is exactly the failure this entry was added to prevent.
          etc_hosts: "{{ {platform_service_fqdns.authentik: netbird_traefik_ip} }}"
          volumes:
            - "{{ netbird_mgmt_volume }}:/var/lib/netbird"
            - "{{ netbird_build_dir }}/management.json:/etc/netbird/management.json:ro"
            # verify-full against the platform CA: the host trust store, read-only.
            - "{{ netbird_pg_sslrootcert }}:{{ netbird_pg_sslrootcert }}:ro"
          command:
            - "--port"
            - "{{ netbird_mgmt_port }}"
            - "--log-file"
            - "console"
            - "--log-level"
            - "info"
            - "--disable-anonymous-metrics={{ netbird_disable_anonymous_metrics | bool | lower }}"
            - "--single-account-mode-domain={{ netbird_single_account_mode_domain }}"
            - "--dns-domain={{ netbird_mgmt_dns_domain }}"
          env:
            NETBIRD_STORE_ENGINE_POSTGRES_DSN: >-
              host={{ netbird_pg_host }} port={{ netbird_pg_port }} user={{ netbird_pg_user }}
              password={{ netbird_pg_password }} dbname={{ netbird_pg_database }}
              sslmode=verify-full sslrootcert={{ netbird_pg_sslrootcert }}
            NETBIRD_STORE_ENGINE_MYSQL_DSN: ""
            NB_ACTIVITY_EVENT_STORE_ENGINE: "postgres"
            NB_ACTIVITY_EVENT_POSTGRES_DSN: >-
              host={{ netbird_pg_host }} port={{ netbird_pg_port }} user={{ netbird_events_pg_user }}
              password={{ netbird_events_pg_password }} dbname={{ netbird_events_pg_database }}
              sslmode=verify-full sslrootcert={{ netbird_pg_sslrootcert }}
          log_driver: journald   # container logs -> journal -> promtail -> Loki (INF-27)
        - name: netbird-signal
          image: "{{ netbird_signal_image }}"
          restart_policy: unless-stopped
          published:
            - "{{ netbird_listen_ip }}:{{ netbird_signal_grpc_port }}:{{ netbird_signal_grpc_port }}"
            - "{{ netbird_listen_ip }}:{{ netbird_signal_ws_host_port }}:{{ netbird_signal_ws_port }}"
            - "{{ netbird_listen_ip }}:{{ netbird_signal_metrics_port }}:{{ netbird_metrics_port_internal }}"   # /metrics (INF-33)
          volumes:
            - "{{ netbird_signal_volume }}:/var/lib/netbird"
          log_driver: journald   # container logs -> journal -> promtail -> Loki (INF-27)
        - name: netbird-relay
          image: "{{ netbird_relay_image }}"
          restart_policy: unless-stopped
          published:
            - "{{ netbird_listen_ip }}:{{ netbird_relay_port }}:{{ netbird_relay_port }}"
            - "{{ netbird_listen_ip }}:{{ netbird_relay_metrics_port }}:{{ netbird_metrics_port_internal }}"   # /metrics (INF-33)
          env:
            NB_LOG_LEVEL: "info"
            NB_LISTEN_ADDRESS: ":{{ netbird_relay_port }}"
            NB_EXPOSED_ADDRESS: "rels://{{ netbird_fqdn }}:{{ netbird_public_port }}/relay"
            NB_AUTH_SECRET: "{{ netbird_core.relay_auth_secret }}"
          log_driver: journald   # container logs -> journal -> promtail -> Loki (INF-27)

- name: "containers | coturn — STUN/TURN on the host network (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: netbird-coturn
      containers:
        - name: netbird-coturn
          image: "{{ netbird_coturn_image }}"
          state: "{{ 'started' if netbird_coturn_enabled | bool else 'absent' }}"
          restart_policy: unless-stopped
          network_mode: host
          volumes:
            - "{{ netbird_build_dir }}/turnserver.conf:/etc/turnserver.conf:ro"
          command: ["-c", "/etc/turnserver.conf"]
          log_driver: journald   # container logs -> journal -> promtail -> Loki (INF-27)

- name: "containers | Flush handlers (apply config restarts before readiness)"
  ansible.builtin.meta: flush_handlers

# --- Readiness ------------------------------------------------------------------
# Management serves REST on :33073 (plaintext). Unauthenticated /api returns 401 —
# proof it is up and the auth middleware (Authentik JWT validation) is wired.
- name: "containers | Wait for netbird-management to serve the API"
  ansible.builtin.uri:
    url: "http://{{ netbird_listen_ip }}:{{ netbird_mgmt_port }}/api/users"
    method: GET
    status_code: [401, 403, 200]
  register: netbird_mgmt_ready
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  retries: 40
  delay: 3
  until: netbird_mgmt_ready.status in [401, 403, 200]
  changed_when: false

- name: "containers | Gather running netbird containers"
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      status: running
  register: netbird_running

- name: "containers | Assert the core containers are up"
  ansible.builtin.assert:
    that:
      - "'/netbird-dashboard' in (netbird_running.containers | map(attribute='Names') | flatten)"
      - "'/netbird-management' in (netbird_running.containers | map(attribute='Names') | flatten)"
      - "'/netbird-signal' in (netbird_running.containers | map(attribute='Names') | flatten)"
      - "'/netbird-relay' in (netbird_running.containers | map(attribute='Names') | flatten)"
    fail_msg: "one or more NetBird containers are not running"
    success_msg: "NetBird multi-container stack is up (dashboard/management/signal/relay)"
