---
- name: "containers | Create the netbird build directory"
  ansible.builtin.file:
    path: "{{ netbird_build_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "containers | Render config.yaml (combined server)"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: "{{ netbird_build_dir }}/config.yaml"
    owner: root
    group: root
    mode: "0640"
  no_log: true
  notify: "Restart netbird server"

- name: "containers | Render dashboard.env"
  ansible.builtin.template:
    src: dashboard.env.j2
    dest: "{{ netbird_build_dir }}/dashboard.env"
    owner: root
    group: root
    mode: "0640"
  notify: "Restart netbird dashboard"

- name: "containers | Create the netbird docker network"
  community.docker.docker_network:
    name: netbird
    state: present

- name: "containers | Pull the pinned netbird images"
  community.docker.docker_image:
    name: "{{ item }}"
    source: pull
    state: present
  loop:
    - "{{ netbird_server_image }}"
    - "{{ netbird_dashboard_image }}"

- name: "containers | Run netbird-server (combined mgmt+signal+relay+STUN+Dex)"
  community.docker.docker_container:
    name: netbird-server
    image: "{{ netbird_server_image }}"
    state: started
    restart_policy: unless-stopped
    pull: false
    networks:
      - name: netbird
    published_ports:
      - "{{ netbird_listen_ip }}:{{ netbird_http_port }}:80"
      - "{{ netbird_listen_ip }}:{{ netbird_stun_port }}:{{ netbird_stun_port }}/udp"
    volumes:
      - "{{ netbird_data_volume }}:/var/lib/netbird"
      - "{{ netbird_build_dir }}/config.yaml:/etc/netbird/config.yaml:ro"
    env:
      # Enables the headless first-owner bootstrap via POST /api/setup (+ PAT).
      NB_SETUP_PAT_ENABLED: "{{ netbird_setup_pat_enabled | string | lower }}"
    command: ["--config", "/etc/netbird/config.yaml"]
    log_options:
      max-size: "500m"
      max-file: "2"
    log_driver: json-file

- name: "containers | Run netbird-dashboard (web UI)"
  community.docker.docker_container:
    name: netbird-dashboard
    image: "{{ netbird_dashboard_image }}"
    state: started
    restart_policy: unless-stopped
    pull: false
    networks:
      - name: netbird
    published_ports:
      - "{{ netbird_listen_ip }}:{{ netbird_dashboard_port }}:80"
    env_file: "{{ netbird_build_dir }}/dashboard.env"
    log_options:
      max-size: "500m"
      max-file: "2"
    log_driver: json-file

- name: "containers | Flush handlers (apply config restarts before readiness)"
  ansible.builtin.meta: flush_handlers

# Authoritative readiness probe (getting-started.sh wait_management_direct):
# the embedded Dex OIDC discovery endpoint returns 200 once the server is up.
- name: "containers | Wait for netbird-server to be ready (embedded Dex OIDC discovery)"
  ansible.builtin.uri:
    url: "http://{{ netbird_listen_ip }}:{{ netbird_http_port }}/oauth2/.well-known/openid-configuration"
    status_code: [200]
  register: netbird_ready
  retries: 40
  delay: 3
  until: netbird_ready.status == 200
  changed_when: false

- name: "containers | Gather running netbird containers"
  community.docker.docker_host_info:
    containers: true
    containers_filters:
      status: running
  register: netbird_running

- name: "containers | Assert both netbird containers are up"
  ansible.builtin.assert:
    that:
      - "'/netbird-server' in (netbird_running.containers | map(attribute='Names') | flatten)"
      - "'/netbird-dashboard' in (netbird_running.containers | map(attribute='Names') | flatten)"
    fail_msg: "netbird-server and/or netbird-dashboard are not running"
    success_msg: "netbird-server + dashboard are up (combined model)"
