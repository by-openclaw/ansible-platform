---
# ==============================================================================
# Role: netbird — NetBird CE (OFFICIAL multi-container model) on lxc-netbird-01.
#
# This is the deployment the goauthentik.io NetBird guide targets: NetBird's own
# login IS Authentik (direct OIDC), with NO bundled/Dex IdP. It reproduces, in
# pure Ansible, exactly what NetBird's getting-started.sh (configure.sh) renders
# from its official templates — management.json + the Traefik docker-compose —
# only translated to OUR split topology (Traefik runs on a separate host and
# reaches these containers over the SVC network via the file provider).
#
# Five containers (official stack):
#   dashboard   — web UI (SPA); redirects the browser to Authentik to log in.
#   management  — control plane + REST/gRPC API; validates Authentik JWTs and
#                 syncs the user list from Authentik (IdP manager = service acct).
#   signal      — peer signalling (gRPC h2c + ws-proxy).
#   relay       — relayed data path (wss) for hard-NAT peers.
#   coturn      — STUN/TURN (host network) for direct-connection optimisation.
#
# Auth model (verbatim from the goauthentik.io doc, mapped into management.json):
#   - PKCE flow (dashboard browser login)  -> Authentik authorize/token
#   - Device flow (CLI / mobile `netbird up`) -> Authentik device endpoint
#   - IdP manager (user sync)              -> Authentik SA "svc-netbird-{env}"
# The five OIDC endpoints are NOT hardcoded — the role fetches Authentik's live
# .well-known/openid-configuration (like configure.sh) and derives them. See
# tasks/oidc-discovery.yml + templates/management.json.j2.
# ==============================================================================

netbird_restart_policy: "{{ platform_container_restart_policy | default('always') }}"   # the platform's policy (inventory, with its reason)
# --- Pinned images (never :latest) ----------------------------------------------
netbird_dashboard_image: "netbirdio/dashboard:v2.94.0"
netbird_management_image: "netbirdio/management:0.80.0"
netbird_signal_image: "netbirdio/signal:0.80.0"
netbird_relay_image: "netbirdio/relay:0.80.0"
netbird_coturn_image: "coturn/coturn:4.18.0-r0"
# Routing-peer client: NetBird's apt repo, PINNED (never a curl | sh "latest").
netbird_client_version: "0.80.0"
netbird_client_key_url: "https://pkgs.netbird.io/debian/public.key"   # public apt signing key  # pragma: allowlist secret
netbird_client_keyring: "/etc/apt/keyrings/netbird.asc"
netbird_client_repo_url: "https://pkgs.netbird.io/debian"
netbird_client_repo: "deb [signed-by={{ netbird_client_keyring }}] {{ netbird_client_repo_url }} stable main"
netbird_client_legacy_keyring: "/usr/share/keyrings/netbird-archive-keyring.gpg"   # left by install.sh; removed
netbird_coturn_gid: 65534                          # the image's runtime group (nogroup); reads turnserver.conf

# --- Identity / addressing ------------------------------------------------------
# Public name = vpn.{{ platform_domain }} (CNAME -> apex/Telenet; see cloudflare_dns role).
netbird_fqdn: "{{ platform_service_fqdns.netbird }}"
netbird_listen_ip: "{{ hostvars[groups['netbird'] | first].ansible_host }}"                # SVC IP the containers publish on
netbird_public_port: 443                        # TLS terminated by our Traefik
netbird_http_protocol: "https"

# Container-internal ports (verbatim from the official Traefik compose template).
# Published on netbird_listen_ip so the remote Traefik can reach each backend.
netbird_dashboard_port: 80                       # dashboard SPA
netbird_mgmt_port: 33073                         # management REST + gRPC(h2c) + ws
netbird_signal_grpc_port: 10000                  # signal gRPC (h2c)
netbird_signal_ws_port: 80                       # signal ws-proxy  (publish as 8081)
netbird_signal_ws_host_port: 8081                # host-published port for signal ws
netbird_relay_port: 33080                        # relay (wss)
netbird_stun_port: 3478                          # coturn STUN/TURN (host network)

# --- Metrics (INF-33) ------------------------------------------------------------
# management, signal and relay each serve Prometheus /metrics on :9090 inside their
# container (NetBird default). Published on the SVC address for the monitoring host
# (catalog `metrics_ports` → Prometheus job `netbird`; DOCKER-USER rules from `monitoring`).
netbird_metrics_port_internal: 9090
netbird_mgmt_metrics_port: 9224
netbird_signal_metrics_port: 9225
netbird_relay_metrics_port: 9226

# --- Authentik OIDC (the goauthentik.io doc's setup.env, mapped here) -----------
# Both live in Vault (the Authentik side provisions them):
#   {env}/netbird/oidc         -> client_id / client_secret (public client)
#   {env}/netbird/authentik-sa -> username (NetBird) / password (app token)
netbird_oidc_vault_path: "{{ platform_env }}/netbird/oidc"
netbird_sa_vault_path: "{{ platform_env }}/netbird/authentik-sa"
netbird_oidc_app_slug: "netbird"
netbird_oidc_base: "https://{{ platform_service_fqdns.authentik }}/application/o/{{ netbird_oidc_app_slug }}"
netbird_oidc_config_endpoint: "{{ netbird_oidc_base }}/.well-known/openid-configuration"

# Scopes — exactly as the goauthentik.io doc prescribes.
netbird_auth_supported_scopes: "openid profile email offline_access entitlements goauthentik.io/api"
netbird_device_auth_scope: "openid"              # doc default (device flow)
# Dashboard redirect paths (doc: /auth + /silent-auth). Covered by the Authentik
# provider redirect regex https://vpn.{{ platform_domain }}/.*
netbird_auth_redirect_uri: "/auth"
netbird_auth_silent_redirect_uri: "/silent-auth"
netbird_pkce_redirect_url: "http://localhost:53000"   # CLI/device PKCE loopback
# Keep the smooth login (no forced re-prompt). Account swap is handled by signing out
# in the client, not by forcing prompt=login (which created logout/redirect friction).
netbird_pkce_disable_prompt_login: true
netbird_idp_signkey_refresh: false
netbird_mgmt_idp: "authentik"
# IdP-manager service account extra config (NETBIRD_IDP_MGMT_EXTRA_* -> ExtraConfig).
netbird_idp_extra_username: "svc-netbird-{{ platform_env }}"   # = SA username (naming/0002 §3; renamed 2026-09-01)

# --- Management server knobs ----------------------------------------------------
# single-account mode: every @{{ platform_domain }} user joins ONE NetBird org (prevents
# the per-user tenant forking the bundled-IdP model produced).
netbird_single_account_mode_domain: "{{ platform_domain }}"
netbird_mgmt_dns_domain: "netbird.selfhosted"
netbird_disable_anonymous_metrics: true
netbird_disable_default_policy: false
# Stores on the shared cluster PostgreSQL (services/0004; catalog db: shared-pg).
# NEVER sqlite: it lived in the container volume, outside the DB backup chain.
netbird_store_engine: "postgres"
netbird_pg_host: "{{ platform_pg_host }}"   # FQDN: matches the server cert (verify-full)
netbird_pg_port: 5432
netbird_pg_user: "netbird"
netbird_pg_vault_path: "{{ platform_env }}/netbird/db-pgsql"
netbird_events_pg_database: "netbird_events"     # activity events store
netbird_events_pg_user: "netbird_events"
netbird_events_pg_vault_path: "{{ platform_env }}/netbird/db-pgsql-events"
netbird_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"   # host trust store (platform CA), mounted read-only
# Where the one-time SQLite → PostgreSQL migration (archived: tasks/_archive/store_migration.yml)
# kept the SQLite files; tasks/retired.yml still reads it. The files are archived, never removed.
netbird_sqlite_archive_dir: "/var/backups/netbird"
# Is the LIVE management.json still on SQLite? (tasks/store.yml refuses to go on if it is.)
netbird_store_on_sqlite: >-
  {{ netbird_store_engine == 'postgres'
     and (netbird_live_mgmt_json.content is defined)
     and ((netbird_live_mgmt_json.content | b64decode | from_json).StoreConfig.Engine | default('sqlite')) == 'sqlite' }}

# --- TURN -----------------------------------------------------------------------
netbird_turn_domain: "{{ netbird_fqdn }}"
netbird_turn_user: "self"
netbird_turn_min_port: 49152
netbird_turn_max_port: 65535
# Public IP coturn advertises for relayed candidates. Empty -> line omitted
# (STUN + the relay container still work; set later to optimise TURN).
netbird_turn_external_ip: ""

# --- Our Traefik (separate host, file provider) ---------------------------------
netbird_traefik_ip: "{{ hostvars[groups['traefik'] | first].ansible_host }}"
netbird_traefik_host: "{{ groups['traefik'] | first }}"
netbird_traefik_dynamic_dir: "/etc/traefik/dynamic"

# --- Layout ---------------------------------------------------------------------
netbird_build_dir: "/opt/netbird"
netbird_mgmt_volume: "netbird-mgmt"
netbird_signal_volume: "netbird-signal"

# --- Secrets: Vault only ----------------------------------------------------------
netbird_core_vault_path: "{{ platform_env }}/netbird/core"   # datastore_enc_key / relay_auth_secret / turn_password
# NetBird automation token. The role uses a DEDICATED service user (never a human's
# PAT) for all API automation (routing peer + tiers). automation-token.yml bootstraps
# it non-humanly (Authentik SA client-credentials JWT), mints the service-user token
# and keeps it in Vault (netbird_automation_vault_path).
netbird_automation_user: "svc-netbird-{{ platform_env }}"  # naming/0002 §3 svc-{function}-{env}
# Contract: only the service user may hold a NetBird API token. Any PAT on a
# non-service user is revoked at the store (the API can't address the legacy
# local owner's tokens); any stray service user (a differently-named one) is
# deleted via the API. See tasks/enforce-no-human-pat.yml.
netbird_enforce_no_human_pat: true
netbird_pg_container: "postgres"       # shared cluster PG container on the DB host
netbird_pg_database: "netbird"
netbird_pg_delegate: "{{ platform_pg_leader | default(groups['postgresql'] | first) }}"    # the cluster's leader (tasks ask postgres_db/leader first)
netbird_automation_vault_path: "{{ platform_env }}/netbird/automation"   # service-user PAT (role-managed)
netbird_pat_expire_days: 365

# --- coturn toggle (optional optimisation; relay covers hard-NAT regardless) -----
netbird_coturn_enabled: true

# ==============================================================================
# Phase 2 — routing peer + VPN tiers (run only once a PAT exists). These advertise
# the internal LAN to VPN clients and split web-vs-full access by NetBird group.
# Gated by netbird_routing_peer_enabled / netbird_vpn_tiers_enabled AND a PAT.
# ==============================================================================
netbird_routing_peer_enabled: true
netbird_api_port: "{{ netbird_mgmt_port }}"      # role API automation hits mgmt:33073
netbird_routers_group: "routers"
netbird_router_setup_key_name: "router-key"
netbird_router_setup_key_vault_path: "{{ platform_env }}/netbird/router-setup-key"   # plaintext is returned only on create
netbird_router_setup_key_legacy_file: "/root/.nb_setup_key"   # pre-Vault copy on the peer: removed by tasks/retired.yml
netbird_rp_client_config: "/var/lib/netbird/default.json"   # the client's own settings (WgPort, NATExternalIPs)
netbird_local_stun_nft: "/etc/netbird/local-stun.nft"          # host-local STUN/TURN redirect (routing-peer.yml)
netbird_route_network_id: "internal-lan"
netbird_route_network: "{{ platform_internal_cidr4 }}"
netbird_route_metric: 9999
netbird_route_masquerade: true
netbird_route_access_group: "All"
netbird_dns_nameserver_name: "internal-adguard"
netbird_dns_nameserver_ip: "{{ hostvars[groups['adguard'] | first].ansible_host }}"          # AdGuard (DNS chain head)
netbird_dns_nameserver_port: 53

netbird_vpn_tiers_enabled: true
netbird_vpn_full_group: "vpn-full"
netbird_vpn_web_routes:
  - { network_id: "web-traefik", network: "{{ hostvars[groups['traefik'] | first].ansible_host }}/32" }   # Traefik -> web apps
  - { network_id: "web-dns", network: "{{ hostvars[groups['adguard'] | first].ansible_host }}/32" }       # AdGuard -> DNS
# Full internal reach: every active member of NetBird's admin group in people.yml.
netbird_vpn_full_users: >-
  {{ platform_people
     | selectattr('state', 'equalto', 'active')
     | selectattr('groups', 'contains', platform_service_groups.netbird.admin)
     | map(attribute='email') | list }}

# --- Account session policy (NIS2) ----------------------------------------------
# Force a fresh interactive Authentik login (+TOTP) after this long. NIS2 is
# risk-based (no fixed number); 8h ≈ one working day, re-auth at the IdP each time.
# Set netbird_peer_login_expiration to your policy value (e.g. 3600=1h, 43200=12h).
netbird_account_settings_enabled: true
netbird_peer_login_expiration_enabled: true
netbird_peer_login_expiration: 86400             # seconds (24h baseline; tune for NIS2 later)
# New SSO users land BLOCKED (pending approval) by default → the client loops on
# "user pending approval cannot add peers". Authentik's netbird-users group is already
# the access gate, so disable NetBird's redundant user approval → members auto-join.
netbird_user_approval_required: false

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
netbird_host_peer_wg_port: 51820          # the host is itself a NetBird peer (routing); kernel WireGuard listener
# The routing peer sits behind the FW NAT and pins {{ netbird_fqdn }} to Traefik, so
# its own STUN probe never learns the public address and remote peers only ever get
# a private candidate → every VPN session to the LAN rides the 443 relay. Advertise
# the public address instead (FW DNATs udp/{{ netbird_host_peer_wg_port }} here);
# "public/private" pairs, `netbird up --external-ip-map`. Empty = no mapping.
netbird_rp_external_ip_map: >-
  {{ [platform_public_ipv4 ~ '/' ~ netbird_listen_ip] if (platform_public_ipv4 | default('') | length) else [] }}
netbird_firewall_rules:
  - { port: "{{ netbird_stun_port }}", proto: udp, comment: "coturn STUN/TURN (host network, public)" }
  - { port: "{{ netbird_stun_port }}", proto: tcp, comment: "coturn STUN/TURN (host network, public)" }
  - { port: "{{ netbird_turn_min_port }}:{{ netbird_turn_max_port }}", proto: udp, comment: "TURN relay range (public)" }
  - { port: "{{ netbird_host_peer_wg_port }}", proto: udp, comment: "NetBird peer WireGuard (public)" }
  - { port: "{{ netbird_dns_nameserver_port }}", proto: udp, from: "{{ platform_trusted_cidrs }}", comment: "NetBird DNS for peers" }
