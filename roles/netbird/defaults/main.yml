---
# ==============================================================================
# Role: netbird — NetBird CE (OFFICIAL COMBINED model) on lxc-netbird-01 (SVC)
# Reproduces, in pure Ansible, what the official getting-started.sh generates for
# the "existing Traefik" path — NO .sh installer is run. Two containers:
#   netbird-server  — combined Management + Signal + Relay + STUN + embedded Dex IdP
#                     (single image; config.yaml). Listens :80 (HTTP REST + gRPC
#                     h2c + WS) and STUN on :3478/udp.
#   dashboard       — web UI (talks to the embedded Dex at /oauth2).
# Fronted by OUR Traefik (file provider, h2c for the gRPC routers). Store = sqlite
# in the data volume (the official default; Postgres is a documented switch).
# Authentik is added as an EXTERNAL OIDC IdP via the NetBird API (Dex federates to
# it) — see tasks/bootstrap.yml. Upgrade = bump the pinned image tags.
# ==============================================================================

# --- Pinned images (never :latest; installer default is :latest) ----------------
netbird_server_image: "netbirdio/netbird-server:0.72.2"     # combined server
netbird_dashboard_image: "netbirdio/dashboard:v2.39.0"

# --- Identity / addressing ------------------------------------------------------
# Public name = vpn.by-research.be (CNAME -> apex/Telenet; see cloudflare_dns role).
netbird_fqdn: "vpn.by-research.be"
netbird_listen_ip: "10.1.3.181"                # SVC IP the containers publish on

# Published host ports on netbird_listen_ip (Traefik on the DMZ reaches these).
netbird_http_port: 80          # netbird-server :80 — HTTP REST + gRPC (h2c) + WS
netbird_dashboard_port: 8080   # dashboard :80 -> host 8080
netbird_stun_port: 3478        # STUN/UDP (published direct; DNAT'd on the WAN)

# Public exposed URL (TLS terminated by our Traefik).
netbird_public_port: 443
netbird_http_protocol: "https"

# Embedded Dex issuer + redirect URIs (verbatim from getting-started.sh).
netbird_oauth2_issuer: "https://{{ netbird_fqdn }}/oauth2"
netbird_dashboard_redirect_uris:
  - "https://{{ netbird_fqdn }}/nb-auth"
  - "https://{{ netbird_fqdn }}/nb-silent-auth"
netbird_cli_redirect_uris:
  - "http://localhost:53000/"

# Our Traefik = the trusted reverse proxy (sets the real client IP via XFF).
netbird_traefik_ip: "10.1.2.110"
netbird_traefik_host: "lxc-traefik-01"
netbird_traefik_dynamic_dir: "/etc/traefik/dynamic"

# --- Store: sqlite in the data volume (official default) ------------------------
# Postgres is a documented switch (store.engine: postgres + a libpq DSN) if shared-
# store consistency is later wanted; sqlite keeps the official-install simplicity.
netbird_store_engine: "sqlite"
netbird_data_volume: "netbird_data"
netbird_build_dir: "/opt/netbird"

# --- Bootstrap owner (local Dex break-glass admin) ------------------------------
# The first owner is created headlessly via POST /api/setup (needs NB_SETUP_PAT_ENABLED).
# This is the LOCAL Dex account (break-glass, like akadmin / Nextcloud's local admin);
# everyday login is via Authentik SSO (added below).
netbird_setup_pat_enabled: true
netbird_owner_email: "adm_yboujraf@by-research.be"
netbird_owner_name: "Adm Yboujraf"
netbird_pat_expire_days: 365
netbird_owner_secret_file: "netbird-owner.json"   # email/name/password (generated)
netbird_setup_secret_file: "netbird-setup.json"   # PAT, written after /api/setup

# --- Authentik external OIDC IdP (added via the NetBird API; Dex federates) ------
netbird_authentik_idp_name: "Authentik"
netbird_authentik_issuer: "https://authentik.by-research.be/application/o/netbird/"
netbird_oidc_secret_file: "app-oidc-netbird.json"  # client_id/secret (shared w/ authentik blueprint)

# --- Controller secret store ----------------------------------------------------
netbird_secret_dir: "~/.openclaw/workspace/infra/secrets"
netbird_core_secret_file: "netbird-core.json"      # relay authSecret + datastore enc key
