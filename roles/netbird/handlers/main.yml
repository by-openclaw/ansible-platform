---
- name: "Restart netbird management"
  community.docker.docker_container:
    name: netbird-management
    state: started
    restart: true
  listen: "Restart netbird management"

- name: "Restart netbird coturn"
  community.docker.docker_container:
    name: netbird-coturn
    state: started
    restart: true
  listen: "Restart netbird coturn"
