---
- name: "Restart netbird server"
  community.docker.docker_container:
    name: netbird-server
    state: started
    restart: true
  listen: "Restart netbird server"

- name: "Restart netbird dashboard"
  community.docker.docker_container:
    name: netbird-dashboard
    state: started
    restart: true
  listen: "Restart netbird dashboard"
