---
# One Vault password: get-or-create, then bind under the requested fact name.
- name: "Wazuh | Vault get-or-create: {{ secret.note }}"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ secret.path }}"
    vault_secret_init:
      password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      _note: "Wazuh {{ secret.note }} (roles/wazuh)"

- name: "Wazuh | Bind {{ secret.fact }}"
  ansible.builtin.set_fact:
    "{{ secret.fact }}": "{{ vault_secret_result.password }}"
  no_log: true
