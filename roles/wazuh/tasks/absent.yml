---
# Decommission (-e wazuh_state=absent): the stack stops; the indexer data volume is kept
# (archive rule — a security record is evidence) and the guest is removed by Terraform.
- name: "Wazuh | Stop the stack (roles/compose_stack; volumes kept)"
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ wazuh_dir }}"
    compose_stack_state: absent
