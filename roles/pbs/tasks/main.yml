---
# ==============================================================================
# Role: pbs — Proxmox Backup Server 4 (S3 datastore on SeaweedFS)
# Runs ON vm-pbs-01. The PVE-side storage wiring + 2nd backup job are a separate
# play (playbooks/pbs.yml delegates that to the node) so this role stays host-local.
# ==============================================================================

- name: "PBS | Install proxmox-backup-server"
  ansible.builtin.import_tasks: install.yml
  tags: [install]

- name: "PBS | S3-backed datastore (SeaweedFS)"
  ansible.builtin.import_tasks: datastore.yml
  tags: [datastore, s3]

# Read-if-present: roles/authentik mints the client; PBS can be installed first.
# apply: so `--tags oidc` still runs vault_secret's own tasks.
- name: "PBS | Is the Authentik OIDC client in Vault yet?"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [oidc, sso]
  vars:
    vault_secret_path: "{{ pbs_oidc_vault_path }}"
    vault_secret_optional: true
  tags: [oidc, sso]

- name: "PBS | Remember whether SSO can be configured"
  ansible.builtin.set_fact:
    pbs_oidc_held: "{{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}"
  no_log: true
  tags: [oidc, sso]

- name: "PBS | Authentik OIDC SSO (only once the client exists)"
  ansible.builtin.import_tasks: oidc.yml
  when:
    - pbs_oidc_enabled | bool
    - pbs_oidc_held | bool
  tags: [oidc, sso]

- name: Retention + verification jobs (infra/0008)
  ansible.builtin.import_tasks: jobs.yml
  tags: [pbs, jobs]
- name: "PBS | Notifications reach the platform alert mailbox"
  ansible.builtin.import_tasks: notify.yml
  tags: [pbs, notify]

- name: "PBS | API/UI certificate (the platform wildcard)"
  ansible.builtin.import_tasks: tls.yml
  when: pbs_console_cert | bool
  tags: [pbs, tls]

- name: "PBS | Publish the web UI via Traefik (internal / VPN-only)"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: pbs
    traefik_route_fqdn: "{{ pbs_fqdn }}"
    traefik_route_backend_url: "{{ pbs_traefik_backend_url }}"
    traefik_route_backend_insecure_skip_verify: "{{ not (pbs_console_cert | bool) }}"   # verified once the proxy serves the wildcard
    traefik_route_internal_only: true
    # internal_cidrs (LAN + VPN + loopback) from the role default
  when: pbs_traefik_enabled | bool
  tags: [route]

- name: "PBS | Host firewall rules for the native listeners (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ pbs_firewall_rules }}"
  tags: [pbs, firewall]
