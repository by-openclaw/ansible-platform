---
# The S3 datastore on the off-site provider (infra/0008 amended 2026-10-20). Order: provider
# credentials from Vault -> the bucket exists on the provider -> the PBS S3 endpoint -> s3 check ->
# local cache dir -> datastore -> the one-off migration sync job from the on-site datastore.
- name: "Datastore | The provider's S3 credentials (Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pbs_s3_vault_path }}"

- name: "Datastore | Bind them"
  ansible.builtin.set_fact:
    pbs_s3_creds: "{{ vault_secret_result }}"
  no_log: true

# The bucket is created from the controller (boto3 there; the PBS guest carries no AWS SDK):
# credentials go as module arguments, never into an environment or onto a command line.
- name: "Datastore | The bucket exists on the provider ({{ pbs_s3_bucket }})"
  amazon.aws.s3_bucket:
    name: "{{ pbs_s3_bucket }}"
    endpoint_url: "https://{{ pbs_s3_endpoint_host }}"
    region: "{{ pbs_s3_region | default(omit, true) }}"
    access_key: "{{ pbs_s3_creds.access_key }}"
    secret_key: "{{ pbs_s3_creds.secret_key }}"
    ceph: true     # path-style addressing, no AWS-only bucket features
    state: present
  delegate_to: localhost
  become: false
  no_log: true

- name: "Datastore | List existing S3 endpoints"
  ansible.builtin.command: "proxmox-backup-manager s3 endpoint list --output-format json"
  register: pbs_s3_ep_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false

# NO --port: PBS defaults to 443 and signs the bare host (a port in the signed host once broke the
# signature behind a reverse proxy). --region is what SigV4 needs on a non-AWS provider.
- name: "Datastore | Create the S3 endpoint ({{ pbs_s3_endpoint_id }})"
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 's3', 'endpoint', 'create', pbs_s3_endpoint_id,
          '--access-key', pbs_s3_creds.access_key, '--secret-key', pbs_s3_creds.secret_key,
          '--endpoint', pbs_s3_endpoint_host, '--path-style', (pbs_s3_path_style | string | lower)]
         + (['--region', pbs_s3_region] if (pbs_s3_region | length > 0) else [])
         + (['--provider-quirks', pbs_s3_provider_quirks | join(';')] if (pbs_s3_provider_quirks | length > 0) else [])
         + (['--put-rate-limit', pbs_s3_put_rate_limit | string] if (pbs_s3_put_rate_limit | int > 0) else []) }}
  no_log: true
  changed_when: true
  when: pbs_s3_endpoint_id not in (pbs_s3_ep_list.stdout | from_json | map(attribute='id') | list)

# The settings a provider needs can change after creation: converge them on the live endpoint.
- name: "Datastore | The endpoint's rate limit and quirks follow the declaration"
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 's3', 'endpoint', 'update', pbs_s3_endpoint_id]
         + (['--put-rate-limit', pbs_s3_put_rate_limit | string] if (pbs_s3_put_rate_limit | int > 0) else ['--delete', 'put-rate-limit'])
         + (['--provider-quirks', pbs_s3_provider_quirks | join(';')] if (pbs_s3_provider_quirks | length > 0) else []) }}
  vars:
    _live: "{{ pbs_s3_ep_list.stdout | from_json | selectattr('id', 'equalto', pbs_s3_endpoint_id) | first | default({}) }}"
  when:
    - pbs_s3_endpoint_id in (pbs_s3_ep_list.stdout | from_json | map(attribute='id') | list)
    - ((_live['put-rate-limit'] | default(0) | int) != (pbs_s3_put_rate_limit | int))
      or ((_live['provider-quirks'] | default([]) | sort) != (pbs_s3_provider_quirks | sort))
  changed_when: true

- name: "Datastore | Verify S3 connectivity (s3 check)"
  ansible.builtin.command: "proxmox-backup-manager s3 check {{ pbs_s3_endpoint_id }} {{ pbs_s3_bucket }}"
  register: pbs_s3_check
  changed_when: false

- name: "Datastore | Local cache/metadata dir for the S3 datastore"
  ansible.builtin.file:
    path: "{{ pbs_datastore_cache_path }}"
    state: directory
    owner: backup
    group: backup
    mode: "0750"

- name: "Datastore | List existing datastores"
  ansible.builtin.command: "proxmox-backup-manager datastore list --output-format json"
  register: pbs_ds_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false

- name: "Datastore | Create the S3-backed datastore ({{ pbs_datastore_name }})"
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - datastore
      - create
      - "{{ pbs_datastore_name }}"
      - "{{ pbs_datastore_cache_path }}"
      - "--backend"
      - "type=s3,client={{ pbs_s3_endpoint_id }},bucket={{ pbs_s3_bucket }}"
      - "--gc-schedule"
      - "{{ pbs_gc_schedule }}"
  register: pbs_ds_create
  changed_when: true
  when: pbs_datastore_name not in (pbs_ds_list.stdout | from_json | map(attribute='name') | list)

- name: "Datastore | Show the datastore (confirm S3 backend online)"
  ansible.builtin.command: "proxmox-backup-manager datastore show {{ pbs_datastore_name }}"
  register: pbs_ds_show
  changed_when: false

# --- the one-off migration: a LOCAL sync job (no --remote) pulls the on-site datastore's
#     snapshots into the new one; it is run by playbooks/pbs-datastore-migrate.yml ----------------
- name: "Datastore | Existing sync jobs"
  ansible.builtin.command: "proxmox-backup-manager sync-job list --output-format json"
  register: pbs_sync_list
  check_mode: false  # read-only probe
  changed_when: false
  when: pbs_datastore_migrate_from | length > 0

- name: "Datastore | The migration sync job ({{ pbs_datastore_migrate_from }} → {{ pbs_datastore_name }})"
  ansible.builtin.command:
    argv:
      - proxmox-backup-manager
      - sync-job
      - create
      - "{{ pbs_datastore_migrate_job }}"
      - "--store"
      - "{{ pbs_datastore_name }}"
      - "--remote-store"
      - "{{ pbs_datastore_migrate_from }}"
      - "--remove-vanished"
      - "false"
      - "--owner"
      - "{{ pbs_datastore_migrate_owner }}"
      - "--schedule"
      - "{{ pbs_datastore_migrate_schedule }}"
      - "--comment"
      - "the on-site datastore's history into the off-site one (infra/0008, 2026-10-20); retired with the source"
  changed_when: true
  when:
    - pbs_datastore_migrate_from | length > 0
    - pbs_datastore_migrate_from in (pbs_ds_list.stdout | from_json | map(attribute='name') | list)
    - pbs_datastore_migrate_job not in (pbs_sync_list.stdout | default('[]', true) | from_json | map(attribute='id') | list)

- name: "Datastore | The migration sync job's owner, schedule and depth follow the declaration"
  ansible.builtin.command:
    argv: >-
      {{ ['proxmox-backup-manager', 'sync-job', 'update', pbs_datastore_migrate_job,
          '--owner', pbs_datastore_migrate_owner, '--schedule', pbs_datastore_migrate_schedule]
         + (['--transfer-last', pbs_datastore_migrate_transfer_last | string] if (pbs_datastore_migrate_transfer_last | int > 0) else ['--delete', 'transfer-last']) }}
  vars:
    _job: "{{ pbs_sync_list.stdout | default('[]', true) | from_json | selectattr('id', 'equalto', pbs_datastore_migrate_job) | first | default({}) }}"
  when:
    - pbs_datastore_migrate_from | length > 0
    - pbs_datastore_migrate_job in (pbs_sync_list.stdout | default('[]', true) | from_json | map(attribute='id') | list)
    - (_job.owner | default('root@pam')) != pbs_datastore_migrate_owner
      or (_job.schedule | default('')) != pbs_datastore_migrate_schedule
      or ((_job['transfer-last'] | default(0) | int) != (pbs_datastore_migrate_transfer_last | int))
  changed_when: true
