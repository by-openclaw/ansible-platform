---
# ==============================================================================
# Role: pbs — Proxmox Backup Server 4 on vm-pbs-01 (SVC, 10.1.3.222)
# SECOND, independent backup copy alongside the existing PVE vzdump -> NFS
# (Synology, storage `poc-backup`). Datastore is backed by SeaweedFS S3 (PBS 4
# S3 backend, tech-preview) so every guest lands on BOTH Synology + SeaweedFS.
# Native systemd service (NOT docker). All server config via proxmox-backup-manager.
# ==============================================================================

pbs_fqdn: "{{ platform_service_fqdns.pbs }}"
# Still used ONLY by playbooks/pbs-pve-storage.yml to persist the PBS encryption key;
# that write moves to Vault in the next #377 batch.

# --- PBS 4 apt repo (no-subscription) on Debian 13 (trixie) --------------------
pbs_repo_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg"
pbs_repo_line: "deb [signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pbs trixie pbs-no-subscription"

# --- The S3 datastore: OFF-SITE, on the provider directly (infra/0008 amended 2026-10-20) ------
# The datastore IS the off-site copy: PBS 4 S3 backend, a local cache on this guest, the guests'
# client-side encryption key in Vault. The platform's own S3 (SeaweedFS) is not a backup
# destination any more — until 2026-10-20 the datastore sat there (on the hypervisor's pool) and
# was mirrored to the provider: the same bytes twice on site, and the pool filled (#1004).
pbs_s3_provider: contabo                                                   # a key of platform_external_s3
pbs_s3_endpoint_id: "{{ pbs_s3_provider }}"
pbs_s3_endpoint_host: "{{ platform_external_s3[pbs_s3_provider].host }}"
pbs_s3_region: "{{ platform_external_s3[pbs_s3_provider].region | default('') }}"
pbs_s3_path_style: "{{ platform_external_s3[pbs_s3_provider].path_style | default(true) }}"
pbs_s3_provider_quirks: "{{ platform_external_s3[pbs_s3_provider].pbs_quirks | default([]) }}"   # PBS --provider-quirks
# The provider's request cap, split by method (0 = not declared): PUT/POST/DELETE per second (429 on
# 2026-10-21 under the first night's uploads) and GET/HEAD per second — a verify's and a restore's
# chunk reads count against the same cap (429 during the 2026-11-01 verify while backups uploaded).
pbs_s3_limit_active_requests: "{{ platform_external_s3[pbs_s3_provider].pbs_limit_active_requests | default(0) }}"
pbs_s3_limit_passive_requests: "{{ platform_external_s3[pbs_s3_provider].pbs_limit_passive_requests | default(0) }}"
pbs_s3_bucket: "pbs-datastore"                                             # on the provider; created by the role
pbs_s3_vault_path: "{{ platform_external_s3[pbs_s3_provider].vault_path }}"   # access_key + secret_key

# --- Migration from the on-site datastore (one-off; both vars go to '' once it is retired) ------
# A local sync job pulls every snapshot of the old datastore into the new one (chunks travel once,
# deduplicated); playbooks/pbs-datastore-migrate.yml runs it. The old datastore stays untouched
# until the owner's go to retire it.
pbs_datastore_migrate_from: ""                  # "" since 2026-10-24: the history is off-site (namespace history), the source retires
pbs_datastore_migrate_job: "migrate-pbs-datastore"
# The first night (2026-10-21): the sync created groups as root@pam, the nightly job (the backup
# token) was then refused by the owner check on 18 guests; both wrote to the provider at once and
# it answered 429. So: the synced groups belong to the backup token, the sync runs daily after the
# backup window, and the first passes carry only the last snapshots of each group — the rest of
# the history follows when pbs_datastore_migrate_transfer_last is raised to 0 (unlimited).
pbs_datastore_migrate_owner: "{{ pbs_pve_backup_user }}!{{ pbs_pve_backup_token }}"
pbs_datastore_migrate_schedule: "05:00"          # UTC on the PBS guest; the nightly jobs end ~04:00Z
pbs_datastore_migrate_transfer_last: 0           # 0 = every snapshot (set 2026-10-22)
# A sync only carries snapshots NEWER than the newest one already in the target group (PBS rule, seen
# 2026-10-22: "skipped: 6 snapshot(s) … older than the newest snapshot present on sync target"). The
# history that predates the nightly copies (932 local snapshots since 2026-08-29 against 437 off-site)
# therefore needs an EMPTY target: its own namespace on the off-site datastore. Prune and verify reach
# it through max-depth; a restore from it names the namespace (PVE storage option `namespace`).
pbs_datastore_migrate_ns: "history"

pbs_version: "4.2.7-1"   # 2026-09-29 (4.2 line)
pbs_datastore_name: "pbs-s3"                 # naming/0001 §4.1: {content}-{backend}, site- and tier-free
pbs_datastore_cache_path: "/var/lib/proxmox-backup/s3-cache/{{ pbs_datastore_name }}"  # local cache/metadata for the S3-backed datastore
# Schedules run on the PBS clock (UTC). The backup job itself is PVE-side (CEST),
# see pbs_backup_schedule below.
pbs_gc_schedule: "daily"                    # 00:00 UTC
pbs_prune_schedule: "daily"                 # 00:00 UTC
# Weekly, and OUTSIDE the backup window. A verify of the off-site datastore reads every chunk the
# new snapshots reference back from the provider — nearly the whole deduplicated set (~490 GB) at
# the provider's documented 10 MB/s: ~15 h (measured 2026-10-31 22:00Z → 11-01 13:19Z). Started on
# Saturday 22:00Z it ran through Sunday's backups (01:30–05:05Z); the uploads and the verify's reads
# together exceeded the provider's 250 requests/s, and every chunk read answered 429 marked a
# healthy snapshot `failed` (the S3 verify does not retry a 429 — upstream #7606 pending). Sunday
# 06:00Z: after the backups, done ~21:00Z, before GC/prune (00:00Z) and Monday's backups. A daily
# job (the vendor's advice for local disks) would re-read the same set every day — 15 h of the
# provider's line per day — so not for an S3 datastore.
pbs_verify_schedule: "sun 06:00"

# --- The platform automation's identity on PBS (identity/0003; security/0001 #77 shape) --------
# What the automation presents to PBS for maintenance the manager cannot do (change the owner of
# a group, prune or run jobs through the API): a PBS user with an API token, DatastoreAdmin on
# every datastore, the token in Vault under the identity. The client package carries the commands.
pbs_automation_user: "svc-ansible-{{ platform_env }}@pbs"
pbs_automation_token: "admin"
pbs_automation_acl_path: "/datastore"
pbs_automation_role: "DatastoreAdmin"
pbs_automation_vault_path: "{{ platform_env }}/svc-ansible/pbs-api"
pbs_client_version: "4.2.8-1"                 # proxmox-backup-client on the PBS guest (same repo as the server)

# --- Authentik OIDC (SSO) -----------------------------------------------------
pbs_oidc_enabled: true
pbs_oidc_vault_path: "{{ platform_env }}/pbs/oidc"   # minted by roles/authentik
pbs_oidc_realm: "authentik"
pbs_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
pbs_oidc_slug: "pbs"
pbs_oidc_issuer: "{{ pbs_authentik_base }}/application/o/{{ pbs_oidc_slug }}/"
pbs_oidc_username_claim: "preferred_username"           # Authentik emits this (profile scope)
pbs_oidc_scopes: ["openid", "email", "profile"]
# Privileged accounts that get the PBS Admin ACL after autocreation (EntraID-style
# separation — the daily driver is a plain user): every active member of PBS's
# admin group in platform_people, as <username-claim value>@<realm>. Group-based —
# a person is added or removed in people.yml, never here.
pbs_admin_auth_ids: >-
  {{ platform_people
     | selectattr('state', 'equalto', 'active')
     | selectattr('groups', 'contains', platform_service_groups.pbs.admin)
     | map(attribute='username')
     | map('regex_replace', '$', '@' ~ pbs_oidc_realm)
     | list }}

# --- Traefik edge (VPN-only) --------------------------------------------------
pbs_traefik_enabled: true
# PBS serves its own TLS on 8007 with a self-signed cert -> Traefik must skip
# backend verification (internal SVC hop, still TLS-encrypted). Needs the
# traefik_route insecure-skip-verify option.
pbs_port: 8007                                   # PBS API/UI (own TLS)
# The API/UI certificate (security/0004: no self-signed certificate): the proxy serves the
# platform wildcard (roles/tls_cert; refreshed by playbooks/certs-sync.yml). The hypervisor
# addresses the server by NAME and trusts it through its CA store — no pinned fingerprint, so a
# renewal changes nothing there (PVE storage docs: `fingerprint` is for a certificate the host does
# not trust). pbs_console_cert false = self-signed: pbs-pve-storage.yml pins IP + fingerprint instead.
pbs_console_cert: true
pbs_node_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"
pbs_cert_dir: "/etc/ssl/{{ platform_org }}"
pbs_cert_crt: "{{ pbs_cert_dir }}/wildcard.crt"
pbs_cert_key: "{{ pbs_cert_dir }}/wildcard.key"
pbs_traefik_backend_url: "https://{{ pbs_node_fqdn if pbs_console_cert | bool else ansible_host }}:{{ pbs_port }}"

# --- PVE storage wiring + 2nd backup job (delegated to the node) --------------
pbs_pve_node: "{{ groups['proxmox_nodes'] | first }}"
pbs_pve_node_ssh: "{{ hostvars[groups['proxmox_nodes'] | first].ansible_host }}"          # node OOB, root SSH (id_ed25519_rune_automation)
pbs_pve_storage_id: "pbs-s3"              # PVE storage entry: {content}-{backend} (naming/0001 §4.1); a storage's
                                          # datastore is FIXED at creation, so a moved datastore means a new id
pbs_pve_storage_previous: ""              # "" since 2026-10-24 (was "pbs"): the entry of the on-site datastore: its job moves, its key is reused,
                                          # the entry itself retires with that datastore ('' once gone)
pbs_pve_backup_user: "svc-pbs-backup-prod@pbs"   # naming/0002 §3 (renamed 2026-09-01; was pve-backup@pbs)
pbs_pve_backup_token: "pve"               # API token name -> pve-backup@pbs!pve
# Where the minted token lives. Vault, not a controller file: the file used to be
# the authority for whether the token was held, and Vault a copy something had to
# remember to refresh. It did not — after the 2026-09-01 rename Vault still held
# pve-backup@pbs!pve, an auth-id PBS no longer has (#570).
pbs_token_vault_path: "{{ platform_env }}/pbs/pve-backup-token"
pbs_backup_schedule: "03:30"              # 2nd job; NFS vzdump is 05:00 — offset to not overlap
# The PBS VM must NOT be in its OWN S3 job — backing the backup server up into the
# datastore it serves deadlocks ("http upgrade request timed out") and is pointless
# (PBS's DR copy is the NFS/vzdump job). Excluded by VMID (auto-detected by name).
pbs_self_vm_name: "{{ groups['pbs'] | first }}"
# VMs whose guest agent can't fs-freeze (FreeBSD/OPNsense → "Resource deadlock
# avoided"), so the whole backup job errors. Set freeze-fs-on-backup=0 on these so
# the backup runs crash-consistent (fine for a firewall) with no error. NOTE: the
# flag is a PVE VM-config attribute Telmate 2.9.x can't express AND the OPNsense
# module ignores agent drift, so Ansible owns it here. Applies on the VM's next
# `qm reboot` (a guest reboot is NOT enough — it doesn't cycle the QEMU process).
pbs_no_fsfreeze_vms:
  - "{{ groups['opnsense'] | first }}"
  # The VM name the prod firewall has carried since the 26.7 cutover (VMID 196). It is a
  # Proxmox guest name, not an inventory host, so there is nothing to derive it from.
  - "{{ groups['opnsense'] | first }}-new"
# PVE's own placeholders ({{guestname}} …) written with the '{{' escape like roles/pve_host; ASCII only,
# so the comparison with the live job is byte-exact whatever the API's encoding of a dash.
pbs_backup_notes: "PBS off-site copy (object store), beside the NAS archive: {{ '{{' }}guestname{{ '}}' }} (VMID {{ '{{' }}vmid{{ '}}' }}) on node {{ '{{' }}node{{ '}}' }}"
pbs_backup_comment: "PBS off-site copy - second copy of every guest (managed by the pbs role)"
# Client-side encryption: the key is generated + stored in Vault; PVE encrypts
# before upload. Losing the key = unrecoverable backups -> Vault is the store.
pbs_encryption_enabled: true
# ONE document per node: each node has its own key, and a shared document flip-flopped between the
# two nodes' keys on every run (five versions by 2026-10-20 — history kept both, the current value
# was whichever node ran last). Per-node material sits under the node (security/0001 #77 shape).
pbs_encryption_vault_path: "{{ platform_env }}/pbs/{{ inventory_hostname }}/encryption-key"

# Retention — infra/0008 decision 7, LOCKED 2026-10-20 (the off-site history): 14 daily, 8 weekly,
# 12 monthly; keep-last 1 so the newest snapshot of a group always survives a prune.
pbs_keep_last: 1
pbs_keep_daily: 14
pbs_keep_weekly: 8
pbs_keep_monthly: 12
pbs_reverify_days: 90                      # a full re-read of the off-site set at most quarterly

# The two datastore jobs, declared once; tasks/jobs.yml makes the live jobs match
# (create, update drift, retire superseded ids). Ids carry no cadence: the old ones
# (verify-weekly, prune-daily) would lie as soon as a schedule changed.
pbs_jobs:
  prune:
    id: prune
    legacy: [prune-daily]
    settings:
      store: "{{ pbs_datastore_name }}"   # part of the comparison: a job follows the datastore it is declared for
      schedule: "{{ pbs_prune_schedule }}"
      keep-last: "{{ pbs_keep_last }}"
      keep-daily: "{{ pbs_keep_daily }}"
      keep-weekly: "{{ pbs_keep_weekly }}"
      keep-monthly: "{{ pbs_keep_monthly }}"
      max-depth: 7                        # the root and every namespace (the migrated history)
  verify:
    id: verify
    legacy: [verify-weekly]
    settings:
      store: "{{ pbs_datastore_name }}"
      schedule: "{{ pbs_verify_schedule }}"
      ignore-verified: true
      outdated-after: "{{ pbs_reverify_days }}"
      max-depth: 7

# Where PBS's notifications go. The built-in mail-to-root target mails root@pam's
# address and the built-in matcher routes everything but successful prunes — but
# root@pam had NO address, so PBS dropped every notice ("no recipients provided"):
# the 09-14 verify failure and the 09-22 GC failure reached nobody.
# Backup reports go where a person reads them, next to the Proxmox backup job's
# (USER 2026-09-29: one place for backup mail): the ops mailbox, not the alert one.
pbs_notify_email: "{{ platform_ops_email }}"
pbs_notification_matcher: default-matcher
pbs_notification_severities: [warning, error]   # a mail means a failure (owner 2026-11-01); successes are in the task log

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
pbs_firewall_rules:
  - { port: "{{ pbs_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "PBS API/UI (PVE node, Traefik)" }

# --- retired datastores (infra/0008 decision 7, owner 2026-10-24): the on-site datastore leaves the
#     PBS configuration once its history is off-site. The sync job that migrated it and the datastore
#     entry are removed; the DATA is kept (no --destroy-data): the bucket is the owner's to delete.
pbs_datastores_retired: [pbs-datastore]
pbs_sync_jobs_retired: [migrate-pbs-datastore]
pbs_pve_storages_retired: [pbs]                 # the PVE storage entry of the on-site datastore

# --- Node options (node.cfg) -------------------------------------------------------------------
# Task logs: PBS keeps every task's log under /var/log/proxmox-backup/tasks until `task-log-max-days`
# (node.cfg, "Maximum days to keep task logs") says otherwise — unset, nothing is ever removed
# (541 MB and growing on vm-pbs-01, census 2026-10-30). The documentation's example value is 30 days;
# the backup liveness signal and the verify/prune/GC alerts read the task LIST, not old logs.
pbs_task_log_max_days: 30
