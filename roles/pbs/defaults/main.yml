---
# ==============================================================================
# Role: pbs — Proxmox Backup Server 4 on vm-pbs-01 (SVC, 10.1.3.222)
# SECOND, independent backup copy alongside the existing PVE vzdump -> NFS
# (Synology, storage `poc-backup`). Datastore is backed by SeaweedFS S3 (PBS 4
# S3 backend, tech-preview) so every guest lands on BOTH Synology + SeaweedFS.
# Native systemd service (NOT docker). All server config via proxmox-backup-manager.
# ==============================================================================

pbs_fqdn: "pbs.by-research.be"
pbs_secret_dir: "~/.openclaw/workspace/infra/secrets"

# --- PBS 4 apt repo (no-subscription) on Debian 13 (trixie) --------------------
pbs_repo_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg"
pbs_repo_line: "deb [signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pbs trixie pbs-no-subscription"

# --- SeaweedFS S3 datastore ---------------------------------------------------
# PBS S3 always speaks HTTPS -> reach SeaweedFS via the Traefik HTTPS route
# (real LE wildcard cert PBS trusts). Direct :8333 is plain HTTP and unusable.
pbs_s3_endpoint_id: "seaweedfs"
pbs_s3_endpoint_host: "s3.by-research.be"
pbs_s3_endpoint_port: 443
pbs_s3_path_style: true
pbs_s3_bucket: "pbs-datastore"
pbs_s3_identity: "pbs"                                   # SeaweedFS scoped S3 user
pbs_s3_secret_file: "fabric/infra-seaweedfs-pbs.json"   # written by seaweedfs_bucket role

pbs_datastore_name: "pbs-datastore"
pbs_datastore_cache_path: "/var/lib/proxmox-backup/s3-cache/pbs-datastore"  # local cache/metadata for the S3-backed datastore
pbs_gc_schedule: "daily"
pbs_prune_schedule: "daily"
# Retention on the PBS datastore (independent of the NFS job's retention).
pbs_keep:
  keep-daily: 7
  keep-weekly: 4
  keep-monthly: 6

# --- Authentik OIDC (SSO) -----------------------------------------------------
pbs_oidc_enabled: true
pbs_oidc_secret_file: "fabric/app-oidc-pbs.json"        # written by the authentik role
pbs_oidc_realm: "authentik"
pbs_authentik_base: "https://authentik.by-research.be"
pbs_oidc_slug: "pbs"
pbs_oidc_issuer: "{{ pbs_authentik_base }}/application/o/{{ pbs_oidc_slug }}/"
pbs_oidc_username_claim: "preferred_username"           # Authentik emits this (profile scope)
pbs_oidc_scopes: ["openid", "email", "profile"]
# Privileged account that gets the PBS Admin ACL after autocreation (EntraID-style
# separation — the daily driver is a plain user). username-claim value + @realm.
pbs_admin_auth_id: "adm_yboujraf@authentik"

# --- Traefik edge (VPN-only) --------------------------------------------------
pbs_traefik_enabled: true
# PBS serves its own TLS on 8007 with a self-signed cert -> Traefik must skip
# backend verification (internal SVC hop, still TLS-encrypted). Needs the
# traefik_route insecure-skip-verify option.
pbs_traefik_backend_url: "https://10.1.3.222:8007"

# --- PVE storage wiring + 2nd backup job (delegated to the node) --------------
pbs_pve_node: "srv-proxmox-poc-01"
pbs_pve_node_ssh: "10.6.224.105"          # node OOB, root SSH (id_ed25519_rune_automation)
pbs_pve_storage_id: "pbs"                 # PVE storage entry name
pbs_pve_backup_user: "pve-backup@pbs"     # dedicated PBS user PVE authenticates as
pbs_pve_backup_token: "pve"               # API token name -> pve-backup@pbs!pve
pbs_backup_schedule: "03:30"              # 2nd job; NFS vzdump is 05:00 — offset to not overlap
pbs_backup_notes: "PBS S3 copy (SeaweedFS) — 2nd copy alongside NFS. {{ '{{' }} guestname {{ '}}' }} (VMID {{ '{{' }} vmid {{ '}}' }})"
# Client-side encryption: the key is generated + stored in Vault; PVE encrypts
# before upload. Losing the key = unrecoverable backups -> Vault is the store.
pbs_encryption_enabled: true
pbs_encryption_vault_path: "fabric/pbs-encryption-key"
