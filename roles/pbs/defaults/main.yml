---
# ==============================================================================
# Role: pbs — Proxmox Backup Server 4 on vm-pbs-01 (SVC, 10.1.3.222)
# SECOND, independent backup copy alongside the existing PVE vzdump -> NFS
# (Synology, storage `poc-backup`). Datastore is backed by SeaweedFS S3 (PBS 4
# S3 backend, tech-preview) so every guest lands on BOTH Synology + SeaweedFS.
# Native systemd service (NOT docker). All server config via proxmox-backup-manager.
# ==============================================================================

pbs_fqdn: "{{ platform_service_fqdns.pbs }}"
# Still used ONLY by playbooks/pbs-pve-storage.yml to persist the PBS encryption key;
# that write moves to Vault in the next #377 batch.

# --- PBS 4 apt repo (no-subscription) on Debian 13 (trixie) --------------------
pbs_repo_key_url: "https://enterprise.proxmox.com/debian/proxmox-release-trixie.gpg"
pbs_repo_line: "deb [signed-by=/usr/share/keyrings/proxmox-archive-keyring.gpg] http://download.proxmox.com/debian/pbs trixie pbs-no-subscription"

# --- SeaweedFS S3 datastore ---------------------------------------------------
# PBS S3 always speaks HTTPS -> reach SeaweedFS via the Traefik HTTPS route
# (real LE wildcard cert PBS trusts). Direct :8333 is plain HTTP and unusable.
pbs_s3_endpoint_id: "seaweedfs"
pbs_s3_endpoint_host: "{{ platform_service_fqdns.seaweedfs }}"
pbs_s3_endpoint_port: 443
pbs_s3_path_style: true
pbs_s3_bucket: "pbs-datastore"
pbs_s3_identity: "pbs"                                   # SeaweedFS scoped S3 user
pbs_s3_vault_path: "{{ platform_env }}/pbs/s3"   # minted by seaweedfs_bucket (Vault mode)

pbs_datastore_name: "pbs-datastore"
pbs_datastore_cache_path: "/var/lib/proxmox-backup/s3-cache/pbs-datastore"  # local cache/metadata for the S3-backed datastore
# Schedules run on the PBS clock (UTC). The backup job itself is PVE-side (CEST),
# see pbs_backup_schedule below.
pbs_gc_schedule: "daily"                    # 00:00 UTC
pbs_prune_schedule: "daily"                 # 00:00 UTC
# Daily, so a broken backup is proven within a day (it was weekly: 7 days blind).
# 21:00 UTC = 23:00 CEST: a full run takes 72-97 min (measured 09-21/09-28), so it
# ends before GC/prune (00:00 UTC) and the 03:30 CEST backup job, and never
# overlaps the 05:00 CEST NFS job that keeps the node's disks busy until ~08:15.
pbs_verify_schedule: "21:00"

# --- Authentik OIDC (SSO) -----------------------------------------------------
pbs_oidc_enabled: true
pbs_oidc_vault_path: "{{ platform_env }}/pbs/oidc"   # minted by roles/authentik
pbs_oidc_realm: "authentik"
pbs_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
pbs_oidc_slug: "pbs"
pbs_oidc_issuer: "{{ pbs_authentik_base }}/application/o/{{ pbs_oidc_slug }}/"
pbs_oidc_username_claim: "preferred_username"           # Authentik emits this (profile scope)
pbs_oidc_scopes: ["openid", "email", "profile"]
# Privileged account that gets the PBS Admin ACL after autocreation (EntraID-style
# separation — the daily driver is a plain user). username-claim value + @realm.
pbs_admin_auth_id: "adm_yboujraf@authentik"

# --- Traefik edge (VPN-only) --------------------------------------------------
pbs_traefik_enabled: true
# PBS serves its own TLS on 8007 with a self-signed cert -> Traefik must skip
# backend verification (internal SVC hop, still TLS-encrypted). Needs the
# traefik_route insecure-skip-verify option.
pbs_port: 8007                                   # PBS API/UI (own TLS)
pbs_traefik_backend_url: "https://{{ ansible_host }}:{{ pbs_port }}"

# --- PVE storage wiring + 2nd backup job (delegated to the node) --------------
pbs_pve_node: "{{ groups['proxmox_nodes'] | first }}"
pbs_pve_node_ssh: "{{ hostvars[groups['proxmox_nodes'] | first].ansible_host }}"          # node OOB, root SSH (id_ed25519_rune_automation)
pbs_pve_storage_id: "pbs"                 # PVE storage entry name
pbs_pve_backup_user: "svc-pbs-backup-prod@pbs"   # naming/0002 §3 (renamed 2026-09-01; was pve-backup@pbs)
pbs_pve_backup_token: "pve"               # API token name -> pve-backup@pbs!pve
# Where the minted token lives. Vault, not a controller file: the file used to be
# the authority for whether the token was held, and Vault a copy something had to
# remember to refresh. It did not — after the 2026-09-01 rename Vault still held
# pve-backup@pbs!pve, an auth-id PBS no longer has (#570).
pbs_token_vault_path: "{{ platform_env }}/pbs/pve-backup-token"
pbs_backup_schedule: "03:30"              # 2nd job; NFS vzdump is 05:00 — offset to not overlap
# The PBS VM must NOT be in its OWN S3 job — backing the backup server up into the
# datastore it serves deadlocks ("http upgrade request timed out") and is pointless
# (PBS's DR copy is the NFS/vzdump job). Excluded by VMID (auto-detected by name).
pbs_self_vm_name: "{{ groups['pbs'] | first }}"
# VMs whose guest agent can't fs-freeze (FreeBSD/OPNsense → "Resource deadlock
# avoided"), so the whole backup job errors. Set freeze-fs-on-backup=0 on these so
# the backup runs crash-consistent (fine for a firewall) with no error. NOTE: the
# flag is a PVE VM-config attribute Telmate 2.9.x can't express AND the OPNsense
# module ignores agent drift, so Ansible owns it here. Applies on the VM's next
# `qm reboot` (a guest reboot is NOT enough — it doesn't cycle the QEMU process).
pbs_no_fsfreeze_vms:
  - "{{ groups['opnsense'] | first }}"
  # The VM name the prod firewall has carried since the 26.7 cutover (VMID 196). It is a
  # Proxmox guest name, not an inventory host, so there is nothing to derive it from.
  - "{{ groups['opnsense'] | first }}-new"
pbs_backup_notes: "PBS S3 copy (SeaweedFS) — 2nd copy alongside NFS. {{ '{{' }} guestname {{ '}}' }} (VMID {{ '{{' }} vmid {{ '}}' }})"
# Client-side encryption: the key is generated + stored in Vault; PVE encrypts
# before upload. Losing the key = unrecoverable backups -> Vault is the store.
pbs_encryption_enabled: true
pbs_encryption_vault_path: "{{ platform_env }}/pbs/encryption-key"

# Retention (infra/0008 — no explicit numbers in the ADR; platform defaults)
pbs_keep_last: 3
pbs_keep_daily: 14
pbs_keep_weekly: 8
pbs_keep_monthly: 6
pbs_reverify_days: 30

# The two datastore jobs, declared once; tasks/jobs.yml makes the live jobs match
# (create, update drift, retire superseded ids). Ids carry no cadence: the old ones
# (verify-weekly, prune-daily) would lie as soon as a schedule changed.
pbs_jobs:
  prune:
    id: prune
    legacy: [prune-daily]
    settings:
      schedule: "{{ pbs_prune_schedule }}"
      keep-last: "{{ pbs_keep_last }}"
      keep-daily: "{{ pbs_keep_daily }}"
      keep-weekly: "{{ pbs_keep_weekly }}"
      keep-monthly: "{{ pbs_keep_monthly }}"
  verify:
    id: verify
    legacy: [verify-weekly]
    settings:
      schedule: "{{ pbs_verify_schedule }}"
      ignore-verified: true
      outdated-after: "{{ pbs_reverify_days }}"

# Where PBS's notifications go. The built-in mail-to-root target mails root@pam's
# address and the built-in matcher routes everything but successful prunes — but
# root@pam had NO address, so PBS dropped every notice ("no recipients provided"):
# the 09-14 verify failure and the 09-22 GC failure reached nobody.
pbs_notify_email: "{{ platform_alert_email }}"

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
pbs_firewall_rules:
  - { port: "{{ pbs_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "PBS API/UI (PVE node, Traefik)" }
