---
vdi_name: "ansible-deploy"
vdi_env: "{{ platform_env }}"
# Envs the single controller deploy-identity may manage in Vault (prod + the
# isolated test env for the OPNsense test FW / lib work). Additive, machine-only.
vdi_envs: ["prod", "test"]
vdi_mount: "secret"
vdi_token_ttl: "30m"
vdi_token_max_ttl: "2h"
vdi_secret_id_ttl: "0"
vdi_creds_file: "app-vault-approle-ansible-deploy.json"   # pragma: allowlist secret
vdi_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
vdi_host: "{{ platform_vault_host | default(groups['vault'] | first) }}"
vdi_api_url: "{{ platform_vault_addr }}"   # Vault's HTTP API as the delegate host reaches it (inventory)
vdi_api_timeout: 15
vdi_approle_mount: "approle"
vdi_container: "vault"   # no longer used by this role
vdi_bootstrap_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
vdi_bootstrap_file: "vault-init.json"
