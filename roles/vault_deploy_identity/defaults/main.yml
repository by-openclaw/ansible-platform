---
vdi_name: "ansible-deploy"
vdi_env: "{{ platform_env | default('prod') }}"
vdi_mount: "secret"
vdi_token_ttl: "30m"
vdi_token_max_ttl: "2h"
vdi_secret_id_ttl: "0"
vdi_creds_file: "app-vault-approle-ansible-deploy.json"   # pragma: allowlist secret
vdi_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
vdi_host: "lxc-vault-01"
vdi_container: "vault"
vdi_bootstrap_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
vdi_bootstrap_file: "vault-init.json"
