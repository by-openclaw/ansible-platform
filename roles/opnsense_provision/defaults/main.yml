---
# Role: opnsense_provision — take a free VMID to a running, seeded OPNsense firewall with Ansible
# only (infra-terraform-proxmox #93). Replaces the VM-lifecycle half of the seed Python pipeline;
# the console step that hands the appliance its config.xml is by_systems.opnsense.opnsense_seed_import.
#
# Hardware truth stays in the seed profile (infra-terraform-proxmox modules/vm-opnsense/seed/seeds/
# <fw>.json) so there is one source for it; this role reads that file and converges the VM to it.

# Which firewall (the seed profile name, without .json). REQUIRED.
opnsense_provision_fw: ""

# Where the seed profiles and the rendered config live. Defaults to a sibling checkout.
opnsense_provision_seed_dir: "{{ playbook_dir }}/../../infra-terraform-proxmox/modules/vm-opnsense/seed"
opnsense_provision_seed_profile: "{{ opnsense_provision_seed_dir }}/seeds/{{ opnsense_provision_fw }}.json"
opnsense_provision_baseline: "{{ opnsense_provision_seed_dir }}/templates/baseline.xml"
opnsense_provision_build_dir: "{{ opnsense_provision_seed_dir }}/out/{{ opnsense_provision_fw }}"
opnsense_provision_seed_iso: "{{ opnsense_provision_seed_dir }}/out/{{ opnsense_provision_fw }}-seed.iso"

# The break-glass credential, the ISP credentials and the internal domain are read from the fabric
# secret store when the configuration is rendered — a seed profile never carries them.
opnsense_provision_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/fabric"

# Proxmox: API credentials come from the fabric secret store, never from the inventory.
opnsense_provision_pve_secret: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/fabric/infra-proxmox-poc.json"
opnsense_provision_pve_node_host: srv-proxmox-poc-01     # inventory host, for the ISO upload
opnsense_provision_validate_certs: false

# Storage + images
opnsense_provision_storage: poc-data                     # VM disks (ZFS)
opnsense_provision_image_store: poc-iso                  # import store for the nano + seed images
opnsense_provision_image_path: /mnt/pve/poc-iso/import   # same store, as a path on the node
opnsense_provision_nano_image: OPNsense-26.7-nano-amd64.raw
opnsense_provision_target_disk_gb: 20

# Safety. A recreate DESTROYS the VM: prod needs the explicit confirm, and any firewall that is not
# the one named in the profile is never touched because the VMID comes from the profile itself.
opnsense_provision_recreate: false
opnsense_provision_confirm_prod: false

# Seeding: drive the appliance's boot importer and hand it the config on the second disk.
opnsense_provision_seed_device: vtbd1
opnsense_provision_seed_timeout: 600
