---
# Provision a firewall VM from its seed profile. Order: read the profile → refuse anything unsafe →
# put the images on the node → create the VM → hand the appliance its config through the boot
# importer → wait for it to answer.

- name: "Provision | A firewall must be named"
  ansible.builtin.assert:
    that: opnsense_provision_fw | length > 0
    fail_msg: "set opnsense_provision_fw to a seed profile name, e.g. -e opnsense_provision_fw=vm-opns-test-01"
    quiet: true

- name: "Provision | Read the seed profile (the single source for this firewall's hardware)"
  ansible.builtin.set_fact:
    opnsense_provision_seed: "{{ lookup('file', opnsense_provision_seed_profile) | from_json }}"

- name: "Provision | Profile facts"
  ansible.builtin.set_fact:
    opnsense_provision_vm: "{{ opnsense_provision_seed.vm }}"
    opnsense_provision_vmid: "{{ opnsense_provision_seed.vm.vmid }}"
    opnsense_provision_node: "{{ opnsense_provision_seed.vm.node }}"

# ── Safety ───────────────────────────────────────────────────────────────────────────────────────
# Two ways to wreck a firewall from here: recreate a prod profile, or give a non-prod box prod's ISP
# identity so it dials the one PPPoE session or claims the static WAN2 address. Both are refused
# before anything is created.
- name: "Provision | Recreating a PROD firewall needs an explicit confirmation"
  ansible.builtin.assert:
    that: not (opnsense_provision_recreate | bool) or (opnsense_provision_confirm_prod | bool)
    fail_msg: >-
      {{ opnsense_provision_fw }} is env=prod — recreating it DESTROYS the running firewall.
      Pass -e opnsense_provision_confirm_prod=true inside a maintenance window.
    quiet: true
  when: opnsense_provision_vm.env | default('') == 'prod'

- name: "Provision | A non-prod firewall must never carry prod's ISP identity"
  ansible.builtin.assert:
    that:
      - (opnsense_provision_seed.wan2 | default({})).creds_secret | default('') is not search('net-isp-telenet.json$')
      - (opnsense_provision_seed.wan | default({})).creds_secret | default('') is not search('net-isp-proximus-pppoe.json$')
    fail_msg: >-
      {{ opnsense_provision_fw }} is not prod but references prod's ISP credentials — that would put a
      duplicate identity on the ISP segment. Give it its own, or leave the wan/wan2 sections out.
    quiet: true
  when: opnsense_provision_vm.env | default('') != 'prod'

- name: "Provision | Load the Proxmox API credentials"
  ansible.builtin.set_fact:
    opnsense_provision_pve: "{{ (lookup('file', opnsense_provision_pve_secret) | from_json).fields }}"
  no_log: true

- name: "Provision | Network interfaces from the profile"
  ansible.builtin.set_fact:
    opnsense_provision_nics: >-
      {{ opnsense_provision_nics | default({}) | combine({
           item.key: 'virtio,bridge=' ~ item.value ~ ',firewall=0'
                     ~ (',link_down=1'
                        if (item.key in opnsense_provision_uplink_nic
                            and not ((opnsense_provision_vm.uplinks | default({}))
                                     [opnsense_provision_uplink_nic[item.key]] | default(false)))
                        else '') }) }}
  loop: "{{ opnsense_provision_vm.nics | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> {{ item.value }}"
  vars:
    # firewall=0: packet filtering is the appliance's job, not the hypervisor's. An uplink whose
    # flag is off is created link_down, so a firewall can exist without ever touching an ISP.
    opnsense_provision_uplink_nic: {net2: proximus, net3: telenet}

- name: "Provision | Report what will be built"
  ansible.builtin.debug:
    msg: >-
      {{ opnsense_provision_fw }} (vmid {{ opnsense_provision_vmid }}, env
      {{ opnsense_provision_vm.env | default('?') }}) on {{ opnsense_provision_node }}:
      {{ opnsense_provision_vm.cores }} vCPU / {{ opnsense_provision_vm.memory }} MiB,
      nics {{ opnsense_provision_nics }}

# ── Images on the node ───────────────────────────────────────────────────────────────────────────
- name: "Provision | The appliance image must already be on the node's import store"
  ansible.builtin.stat:
    path: "{{ opnsense_provision_image_path }}/{{ opnsense_provision_nano_image }}"
  register: opnsense_provision_nano
  delegate_to: "{{ opnsense_provision_pve_node_host }}"
  become: true
  vars:   # a delegated task resolves become vars from localhost, which has none of the node's
    ansible_become_password: "{{ hostvars[opnsense_provision_pve_node_host].ansible_become_password | default(omit) }}"

- name: "Provision | Fail clearly when the appliance image is missing"
  ansible.builtin.fail:
    msg: >-
      {{ opnsense_provision_nano_image }} is not in {{ opnsense_provision_image_path }} on
      {{ opnsense_provision_pve_node_host }} — put the release image there first.
  when: not opnsense_provision_nano.stat.exists

# ── Seed configuration ───────────────────────────────────────────────────────────────────────────
# A fresh appliance has no API to configure itself with — on 26.7 `interfaces/assign/*` is 404 — so
# its config.xml has to exist before it is reachable. Rendered from the seed profile here and packed
# into an image its boot importer reads, so building a firewall needs nothing but ansible-playbook.
# Vault first, file second. A rebuild frequently runs with Vault unreachable — it lives behind
# the firewall being rebuilt — so each read is best-effort and the renderer falls back to the
# file the seed names for anything that did not come back.
- name: "Provision | Read the seed credentials from Vault"
  ansible.builtin.include_tasks: vault_secret_read.yml
  loop: "{{ opnsense_provision_vault_paths | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when: opnsense_provision_vault_secrets | bool

- name: "Provision | Where each credential came from"
  ansible.builtin.debug:
    msg: >-
      Vault: {{ (opnsense_provision_secrets | default({})).keys() | list | join(', ') or 'none' }}
      | files (fallback):
      {{ opnsense_provision_vault_paths.keys()
         | difference((opnsense_provision_secrets | default({})).keys() | list)
         | join(', ') or 'none' }}

- name: "Provision | Render this firewall's configuration from its seed profile"
  by_systems.opnsense.opnsense_seed_config:
    seed: "{{ opnsense_provision_seed }}"
    baseline: "{{ opnsense_provision_baseline }}"
    dest: "{{ opnsense_provision_build_dir }}/conf/config.xml"
    secret_dir: "{{ opnsense_provision_secret_dir }}"
    secrets: "{{ opnsense_provision_secrets | default(omit) }}"
  register: opnsense_provision_config
  no_log: true                      # the render carries the break-glass credential
  delegate_to: localhost
  become: false

- name: "Provision | Look for an already-built seed image"
  ansible.builtin.stat:
    path: "{{ opnsense_provision_seed_iso }}"
  register: opnsense_provision_iso
  delegate_to: localhost
  become: false

# ISO9660 carrying the volume label the importer looks for. The appliance sees a plain block device
# and mounts /conf/config.xml off it.
- name: "Provision | Pack the configuration into the seed image"
  community.general.iso_create:
    src_files: ["{{ opnsense_provision_build_dir }}/conf"]
    dest_iso: "{{ opnsense_provision_seed_iso }}"
    vol_ident: OPNsense
    joliet: 3
    rock_ridge: "1.09"
    interchange_level: 3
  when: (opnsense_provision_config is changed) or (not opnsense_provision_iso.stat.exists)
  delegate_to: localhost
  become: false

# Named .raw on purpose: Proxmox's import store parses the volume by extension and only accepts
# disk-image names there. The file is an ISO9660 image; the appliance reads it as a plain block
# device (vtbd1) and its importer mounts it, so the extension is presentation, not content.
- name: "Provision | Upload this firewall's seed image"
  ansible.builtin.copy:
    src: "{{ opnsense_provision_seed_iso }}"
    dest: "{{ opnsense_provision_image_path }}/{{ opnsense_provision_fw }}-seed.raw"
    mode: "0644"
  when: not ansible_check_mode or opnsense_provision_iso.stat.exists
  delegate_to: "{{ opnsense_provision_pve_node_host }}"
  become: true
  vars:   # a delegated task resolves become vars from localhost, which has none of the node's
    ansible_become_password: "{{ hostvars[opnsense_provision_pve_node_host].ansible_become_password | default(omit) }}"

# ── VM ───────────────────────────────────────────────────────────────────────────────────────────
- name: "Provision | Remove the existing VM (recreate only)"
  community.proxmox.proxmox_kvm:
    api_host: "{{ opnsense_provision_pve.host }}"
    api_user: "{{ opnsense_provision_pve.admin_token_id | regex_replace('!.*$', '') }}"
    api_token_id: "{{ opnsense_provision_pve.admin_token_id | regex_replace('^.*!', '') }}"
    api_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    node: "{{ opnsense_provision_node }}"
    vmid: "{{ opnsense_provision_vmid }}"
    state: absent
    force: true
    timeout: 180
  delegate_to: localhost
  become: false
  no_log: true
  when: opnsense_provision_recreate | bool

- name: "Provision | Create the firewall VM from the seed profile"
  community.proxmox.proxmox_kvm:
    api_host: "{{ opnsense_provision_pve.host }}"
    api_user: "{{ opnsense_provision_pve.admin_token_id | regex_replace('!.*$', '') }}"
    api_token_id: "{{ opnsense_provision_pve.admin_token_id | regex_replace('^.*!', '') }}"
    api_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    node: "{{ opnsense_provision_node }}"
    vmid: "{{ opnsense_provision_vmid }}"
    name: "{{ opnsense_provision_vm.name }}"
    state: present
    bios: "{{ opnsense_provision_vm.bios | default('seabios') }}"
    machine: "{{ opnsense_provision_vm.machine | default('q35') }}"
    ostype: "{{ opnsense_provision_vm.ostype | default('other') }}"
    scsihw: "{{ opnsense_provision_vm.scsihw | default('virtio-scsi-single') }}"
    cores: "{{ opnsense_provision_vm.cores }}"
    sockets: 1
    memory: "{{ opnsense_provision_vm.memory }}"
    onboot: "{{ (opnsense_provision_vm.onboot | default(0)) | bool }}"
    tags: "{{ opnsense_provision_vm.tags | default('') | split(';') | reject('equalto', '') | list }}"
    # Off for the first boot so nothing competes with the importer on the serial console; the
    # task after the import switches it on per the profile's agent_enabled. Leaving it off is
    # what made `Services | Ensure the QEMU guest agent is running` the one task that never
    # converged — no virtio-serial port, so the daemon starts and exits (#362).
    agent: false
    keyboard: "{{ opnsense_provision_vm.keyboard | default('fr-be') }}"
    tablet: false
    vga: std
    serial:
      serial0: socket     # the boot importer talks over this
    boot: order=virtio0
    # virtio0 = the appliance image, virtio1 = this firewall's configuration (vtbd1 in the guest)
    virtio:
      virtio0: >-
        {{ opnsense_provision_storage }}:0,import-from={{ opnsense_provision_image_store }}:import/{{
        opnsense_provision_nano_image }},iothread=1,discard=on
      virtio1: >-
        {{ opnsense_provision_storage }}:0,import-from={{ opnsense_provision_image_store }}:import/{{
        opnsense_provision_fw }}-seed.raw,iothread=1,discard=on
    net: "{{ opnsense_provision_nics }}"
    timeout: 300
  delegate_to: localhost
  become: false
  register: opnsense_provision_created

- name: "Provision | Grow the appliance disk to the profile's size"
  community.proxmox.proxmox_disk:
    api_host: "{{ opnsense_provision_pve.host }}"
    api_user: "{{ opnsense_provision_pve.admin_token_id | regex_replace('!.*$', '') }}"
    api_token_id: "{{ opnsense_provision_pve.admin_token_id | regex_replace('^.*!', '') }}"
    api_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    vmid: "{{ opnsense_provision_vmid }}"
    disk: virtio0
    state: resized
    size: "{{ opnsense_provision_target_disk_gb }}G"   # absolute target; Proxmox only ever grows
  delegate_to: localhost
  become: false
  register: opnsense_provision_resized
  failed_when: false   # already at or above the target size is not an error
  when: not ansible_check_mode

# ── Hand the appliance its configuration ─────────────────────────────────────────────────────────
# The only step a fresh box has no API for: it has no configuration yet, so its boot importer is the
# way in. The module answers the two prompts and returns once the restore starts.
# Only for a box that was just created. Re-driving the importer on a firewall that already exists
# would overwrite whatever the catalog has since applied, so an existing VM is left alone.
- name: "Provision | Seed the firewall through its boot importer"   # noqa: no-handler (ordered step, not a notification)
  by_systems.opnsense.opnsense_seed_import:
    pve_host: "{{ opnsense_provision_pve.host }}"
    pve_node: "{{ opnsense_provision_node }}"
    pve_token_id: "{{ opnsense_provision_pve.admin_token_id }}"
    pve_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    vmid: "{{ opnsense_provision_vmid }}"
    device: "{{ opnsense_provision_seed_device }}"
    timeout: "{{ opnsense_provision_seed_timeout }}"
  register: opnsense_provision_seeded
  delegate_to: localhost
  become: false
  when: opnsense_provision_created is changed

# The agent needs its virtio-serial port, and that only attaches at power-on — so the flag goes
# on after the import and the VM is cold-cycled. Without this the plugin reports Enabled=1 while
# the service sits stopped, and `qm agent <vmid> ping` answers "not running" forever.
- name: "Provision | Attach the guest-agent port the profile asks for"
  community.proxmox.proxmox_kvm:
    api_host: "{{ opnsense_provision_pve.host }}"
    api_user: "{{ opnsense_provision_pve.admin_token_id | regex_replace('!.*$', '') }}"
    api_token_id: "{{ opnsense_provision_pve.admin_token_id | regex_replace('^.*!', '') }}"
    api_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    node: "{{ opnsense_provision_node }}"
    vmid: "{{ opnsense_provision_vmid }}"
    agent: "enabled=1,type=virtio,freeze-fs-on-backup=0"
    update: true
  when:
    - opnsense_provision_vm.agent_enabled | default(false) | bool
    - opnsense_provision_created is changed
  delegate_to: localhost
  become: false
  no_log: true

- name: "Provision | Cold-cycle so the port actually attaches"
  community.proxmox.proxmox_kvm:
    api_host: "{{ opnsense_provision_pve.host }}"
    api_user: "{{ opnsense_provision_pve.admin_token_id | regex_replace('!.*$', '') }}"
    api_token_id: "{{ opnsense_provision_pve.admin_token_id | regex_replace('^.*!', '') }}"
    api_token_secret: "{{ opnsense_provision_pve.admin_token_secret }}"
    validate_certs: "{{ opnsense_provision_validate_certs }}"
    node: "{{ opnsense_provision_node }}"
    vmid: "{{ opnsense_provision_vmid }}"
    state: "{{ item }}"
    timeout: 180
  loop: [stopped, started]
  when:
    - opnsense_provision_vm.agent_enabled | default(false) | bool
    - opnsense_provision_created is changed
  delegate_to: localhost
  become: false
  no_log: true

- name: "Provision | Wait for the firewall to answer on its management address"
  ansible.builtin.wait_for:
    host: "{{ opnsense_provision_seed.lan.ipv4 }}"
    port: 443
    timeout: 300
    delay: 10
  delegate_to: localhost
  become: false
  when: not ansible_check_mode

- name: "Provision | Result"
  ansible.builtin.debug:
    msg: >-
      {{ opnsense_provision_fw }} is up on {{ opnsense_provision_seed.lan.ipv4 }} —
      {{ ('seeded in ' ~ opnsense_provision_seeded.elapsed ~ 's')
         if (opnsense_provision_created is changed) else 'already existed, left untouched' }}.
      Next: the API token (playbooks/opnsense-api-bootstrap.yml), then the catalog
      (playbooks/opnsense.yml).
