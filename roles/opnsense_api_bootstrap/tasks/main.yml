---
# ==============================================================================
# opnsense_api_bootstrap — mint the svc-ansible API token THROUGH the MVC API
# and store it in Vault. Get-or-mint + rotate-when-stale + idempotent.
# lib-first: user + API key via the by_systems.opnsense collection (lib-opnsense
# underneath); ansible.builtin.uri is used ONLY for read-only lookups/probes.
# See defaults/main.yml + README.
# ==============================================================================

# --- 0. resolve the genesis (break-glass admin) credentials -------------------
- name: "OPNsense bootstrap | Load genesis creds from local file (if given)"
  ansible.builtin.set_fact:
    opnsense_api_bootstrap_gen_key: "{{ opnsense_api_bootstrap_f.key }}"
    opnsense_api_bootstrap_gen_secret: "{{ opnsense_api_bootstrap_f.secret }}"
  vars:
    opnsense_api_bootstrap_f: "{{ (lookup('file', opnsense_api_bootstrap_genesis_file) | from_json).fields }}"
  no_log: true
  when: opnsense_api_bootstrap_genesis_file | default('') | length > 0

- name: "OPNsense bootstrap | Use genesis creds passed as vars"
  ansible.builtin.set_fact:
    opnsense_api_bootstrap_gen_key: "{{ opnsense_api_bootstrap_genesis_key }}"
    opnsense_api_bootstrap_gen_secret: "{{ opnsense_api_bootstrap_genesis_secret }}"
  no_log: true
  when:
    - opnsense_api_bootstrap_gen_key is not defined
    - opnsense_api_bootstrap_genesis_key | length > 0

- name: "OPNsense bootstrap | Require genesis creds"
  ansible.builtin.assert:
    that: opnsense_api_bootstrap_gen_key is defined and opnsense_api_bootstrap_gen_secret is defined
    fail_msg: >-
      No genesis admin credentials. Set opnsense_api_bootstrap_genesis_file (a
      secret file with .fields.key/.secret) or _genesis_key/_genesis_secret.

- name: "OPNsense bootstrap | Connection facts"
  ansible.builtin.set_fact:
    opnsense_api_bootstrap_api: "https://{{ opnsense_api_bootstrap_host }}:{{ opnsense_api_bootstrap_port }}/api"

# --- 1. is the token already in Vault? (get-or-mint) --------------------------
- name: "OPNsense bootstrap | Vault login (ansible-deploy AppRole)"
  ansible.builtin.include_role:
    name: vault_login

- name: "OPNsense bootstrap | Read existing token from Vault"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ vault_deploy_token }} {{ opnsense_api_bootstrap_vault_container }}
      vault kv get -mount={{ opnsense_api_bootstrap_vault_mount }} -format=json {{ opnsense_api_bootstrap_vault_path }}
  delegate_to: "{{ opnsense_api_bootstrap_vault_host }}"
  become: true
  register: opnsense_api_bootstrap_vault_get
  changed_when: false
  failed_when: false
  check_mode: false
  no_log: true

- name: "OPNsense bootstrap | Reuse token already in Vault (noop)"  # noqa: var-naming[no-role-prefix] (contract names used by the catalog + roles/opnsense)
  ansible.builtin.set_fact:
    opn_key: "{{ opnsense_api_bootstrap_kv.key }}"
    opn_secret: "{{ opnsense_api_bootstrap_kv.secret }}"
    opnsense_api_key: "{{ opnsense_api_bootstrap_kv.key }}"
    opnsense_api_secret: "{{ opnsense_api_bootstrap_kv.secret }}"
    opnsense_api_bootstrap_minted: false
  vars:
    opnsense_api_bootstrap_kv: "{{ (opnsense_api_bootstrap_vault_get.stdout | from_json).data.data }}"
  no_log: true
  when: opnsense_api_bootstrap_vault_get.rc == 0

# A Vault token can be STALE: a Terraform+seed rebuild/reseed wipes on-box API keys
# (the seed carries none for svc-ansible by design). Verify before trusting it;
# on 401/403 fall through to mint (rotation = a new KV v2 version, history kept).
- name: "OPNsense bootstrap | Verify the Vault token still works on the FW (rebuild detection)"
  ansible.builtin.uri:
    url: "{{ opnsense_api_bootstrap_api }}/auth/user/search"
    method: POST
    url_username: "{{ opn_key }}"
    url_password: "{{ opn_secret }}"
    force_basic_auth: true
    body_format: json
    body: {}
    validate_certs: "{{ opnsense_api_bootstrap_validate_certs }}"
    status_code: [200, 401, 403]
  delegate_to: localhost
  become: false
  register: opnsense_api_bootstrap_reuse_probe
  check_mode: false          # read-only probe; must also run under --check
  no_log: true
  when: opnsense_api_bootstrap_vault_get.rc == 0

- name: "OPNsense bootstrap | Decide: reuse, or (re)mint"
  ansible.builtin.set_fact:
    opnsense_api_bootstrap_need_mint: >-
      {{ (opnsense_api_bootstrap_force_rotate | bool)
         or opnsense_api_bootstrap_vault_get.rc != 0
         or (opnsense_api_bootstrap_reuse_probe.status | default(0)) != 200 }}
    opnsense_api_bootstrap_stale: >-
      {{ opnsense_api_bootstrap_vault_get.rc == 0
         and (opnsense_api_bootstrap_reuse_probe.status | default(0)) != 200 }}

# --- 2. mint path (absent in Vault, or present but stale) ---------------------
- name: "OPNsense bootstrap | CHECK MODE — token absent/stale in Vault, would mint (no change made)"
  ansible.builtin.debug:
    msg: >-
      check mode: no usable token at {{ opnsense_api_bootstrap_vault_mount }}/{{ opnsense_api_bootstrap_vault_path }}
      — a real run would mint one via auth/user/add_api_key for {{ opnsense_api_bootstrap_user }}
      on {{ opnsense_api_bootstrap_host }} and store it in Vault.
  when:
    - opnsense_api_bootstrap_need_mint | bool
    - ansible_check_mode

- name: "OPNsense bootstrap | Mint svc-ansible token via MVC (lib-first)"
  when:
    - opnsense_api_bootstrap_need_mint | bool       # absent in Vault, OR present but stale (FW rebuilt/reseeded)
    - not ansible_check_mode      # never mint under --check (CLAUDE.md: check mode must work)
  block:
    # ---- read-only lookups (uri GET/search; no lib manager for "does it exist" queries) ----
    - name: "OPNsense bootstrap | Search for the service user (read-only)"
      ansible.builtin.uri:
        url: "{{ opnsense_api_bootstrap_api }}/auth/user/search"
        method: POST
        url_username: "{{ opnsense_api_bootstrap_gen_key }}"
        url_password: "{{ opnsense_api_bootstrap_gen_secret }}"
        force_basic_auth: true
        body_format: json
        body: {}
        validate_certs: "{{ opnsense_api_bootstrap_validate_certs }}"
      delegate_to: localhost   # API calls originate from the controller (no SSH/Python on the FW)
      become: false
      register: opnsense_api_bootstrap_user_search
      no_log: true

    - name: "OPNsense bootstrap | Resolve the admin group gid (the user API wants gids, not names)"
      ansible.builtin.uri:
        url: "{{ opnsense_api_bootstrap_api }}/auth/group/search"
        method: POST
        url_username: "{{ opnsense_api_bootstrap_gen_key }}"
        url_password: "{{ opnsense_api_bootstrap_gen_secret }}"
        force_basic_auth: true
        body_format: json
        body: {}
        validate_certs: "{{ opnsense_api_bootstrap_validate_certs }}"
      delegate_to: localhost
      become: false
      register: opnsense_api_bootstrap_group_search
      no_log: true

    - name: "OPNsense bootstrap | Extract user row + admin gid"
      ansible.builtin.set_fact:
        opnsense_api_bootstrap_user_row: >-
          {{ (opnsense_api_bootstrap_user_search.json.rows | default([]))
             | selectattr('name', 'equalto', opnsense_api_bootstrap_user) | list | first | default({}) }}
        opnsense_api_bootstrap_admin_gid: >-
          {{ (opnsense_api_bootstrap_group_search.json.rows | default([]))
             | selectattr('name', 'equalto', opnsense_api_bootstrap_admin_group) | map(attribute='gid') | list | first }}

    # ---- ensure the user via the lib-backed module (create needs a password) ----
    # The GUI password doubles as the sudo password for the SSH plays (catalog opn_auth_users):
    # when Vault already holds one for the service user, create the user with it so a rebuilt
    # firewall is usable over SSH + sudo right away (2026-09-21: a random one left sudo broken).
    - name: "OPNsense bootstrap | The service user's GUI password in Vault (if any)"
      ansible.builtin.command:
        cmd: >-
          docker exec -e VAULT_TOKEN={{ vault_deploy_token }} {{ opnsense_api_bootstrap_vault_container }}
          vault kv get -mount={{ opnsense_api_bootstrap_vault_mount }} -format=json
          {{ opnsense_api_bootstrap_env }}/opnsense/{{ opnsense_api_bootstrap_user }}
      delegate_to: "{{ opnsense_api_bootstrap_vault_host }}"
      become: true
      register: opnsense_api_bootstrap_user_secret
      changed_when: false
      failed_when: false
      no_log: true
      when: opnsense_api_bootstrap_user_row.name is not defined

    - name: "OPNsense bootstrap | Use the Vault GUI password for the new user"
      ansible.builtin.set_fact:
        opnsense_api_bootstrap_gen_pw: "{{ (opnsense_api_bootstrap_user_secret.stdout | from_json).data.data.webgui_password }}"
      no_log: true
      when:
        - opnsense_api_bootstrap_user_row.name is not defined
        - opnsense_api_bootstrap_user_secret.rc | default(1) == 0
        - ((opnsense_api_bootstrap_user_secret.stdout | default('{}') | from_json).data.data.webgui_password | default('')) | length > 0

    - name: "OPNsense bootstrap | Generate a random password (create-only; real auth = API key + SSH keys)"
      ansible.builtin.set_fact:
        opnsense_api_bootstrap_gen_pw: "{{ lookup('community.general.random_string', length=40, special=true, override_special='!@#%^*-_=+') }}"
      no_log: true
      when:
        - opnsense_api_bootstrap_user_row.name is not defined
        - opnsense_api_bootstrap_gen_pw is not defined

    - name: "OPNsense bootstrap | Ensure the service user in the admin group (by_systems.opnsense, lib-opnsense)"
      by_systems.opnsense.opnsense_auth_user:
        host: "{{ opnsense_api_bootstrap_host }}"
        port: "{{ opnsense_api_bootstrap_port }}"
        key: "{{ opnsense_api_bootstrap_gen_key }}"
        secret: "{{ opnsense_api_bootstrap_gen_secret }}"
        verify_ssl: "{{ opnsense_api_bootstrap_validate_certs }}"
        name: "{{ opnsense_api_bootstrap_user }}"
        description: "{{ opnsense_api_bootstrap_user_descr }} ({{ opnsense_api_bootstrap_env }})"
        # password only when CREATING: passing a fresh random one on every run would
        # rotate the (unused) GUI password and report a change each time.
        password: "{{ opnsense_api_bootstrap_gen_pw if (opnsense_api_bootstrap_user_row.name is not defined) else omit }}"
        group_memberships: "{{ opnsense_api_bootstrap_admin_gid }}"
        state: present
      delegate_to: localhost
      become: false
      register: opnsense_api_bootstrap_user_ensure
      no_log: true

    # ---- mint the API token via MVC (lib AuthApiKeyManager) ------------------
    - name: "OPNsense bootstrap | Mint API token (auth/user/add_api_key via by_systems.opnsense)"
      by_systems.opnsense.opnsense_auth_api_key:
        host: "{{ opnsense_api_bootstrap_host }}"
        port: "{{ opnsense_api_bootstrap_port }}"
        key: "{{ opnsense_api_bootstrap_gen_key }}"
        secret: "{{ opnsense_api_bootstrap_gen_secret }}"
        verify_ssl: "{{ opnsense_api_bootstrap_validate_certs }}"
        username: "{{ opnsense_api_bootstrap_user }}"
        state: present
      delegate_to: localhost
      become: false
      register: opnsense_api_bootstrap_mint
      no_log: true

    - name: "OPNsense bootstrap | Assert mint returned a key + secret"
      ansible.builtin.assert:
        that:
          - opnsense_api_bootstrap_mint.api_key | default('') | length > 0
          - opnsense_api_bootstrap_mint.api_secret | default('') | length > 0
        fail_msg: "opnsense_auth_api_key did not return api_key/api_secret"

    # ---- store the minted token in Vault (primary store; new KV v2 version on rotate) ----
    - name: "OPNsense bootstrap | Write minted token to Vault"
      ansible.builtin.command:
        cmd: >-
          docker exec -i -e VAULT_TOKEN={{ vault_deploy_token }} {{ opnsense_api_bootstrap_vault_container }}
          vault kv put -mount={{ opnsense_api_bootstrap_vault_mount }} {{ opnsense_api_bootstrap_vault_path }} -
        stdin: >-  # pragma: allowlist secret
          {{ {'host': opnsense_api_bootstrap_host, 'port': opnsense_api_bootstrap_port,
              'username': opnsense_api_bootstrap_user,
              'key': opnsense_api_bootstrap_mint.api_key, 'secret': opnsense_api_bootstrap_mint.api_secret,
              'created_via': 'mvc:auth/user/add_api_key', 'env': opnsense_api_bootstrap_env} | to_json }}
      delegate_to: "{{ opnsense_api_bootstrap_vault_host }}"
      become: true
      changed_when: true
      no_log: true

    - name: "OPNsense bootstrap | Record the rotation in the secret's metadata (SEC-09 audit trail)"
      ansible.builtin.command:
        cmd: >-
          docker exec -e VAULT_TOKEN={{ vault_deploy_token }} {{ opnsense_api_bootstrap_vault_container }}
          vault kv metadata put -mount={{ opnsense_api_bootstrap_vault_mount }}
          -custom-metadata=rotated_at={{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}
          -custom-metadata=rotated_by=ansible-deploy
          -custom-metadata=reason={{ 'forced' if (opnsense_api_bootstrap_force_rotate | bool)
                                     else ('stale' if (opnsense_api_bootstrap_stale | bool) else 'absent') }}
          {{ opnsense_api_bootstrap_vault_path }}
      delegate_to: "{{ opnsense_api_bootstrap_vault_host }}"
      become: true
      changed_when: true
      no_log: true   # the command line carries the deploy token

    - name: "OPNsense bootstrap | Publish minted token as facts"  # noqa: var-naming[no-role-prefix] (contract names used by the catalog + roles/opnsense)
      ansible.builtin.set_fact:
        opn_key: "{{ opnsense_api_bootstrap_mint.api_key }}"
        opn_secret: "{{ opnsense_api_bootstrap_mint.api_secret }}"
        opnsense_api_key: "{{ opnsense_api_bootstrap_mint.api_key }}"
        opnsense_api_secret: "{{ opnsense_api_bootstrap_mint.api_secret }}"
        opnsense_api_bootstrap_minted: true
      no_log: true

    # ---- optional 0600 DR / local fast-path mirror (Vault stays primary) ------
    - name: "OPNsense bootstrap | Mirror to local secret file (DR / fast-path)"
      ansible.builtin.copy:
        dest: "{{ opnsense_api_bootstrap_collect_file }}"
        mode: "0600"
        content: >-  # pragma: allowlist secret
          {{ {'_meta': {'purpose': 'OPNsense MVC API token for ' ~ opnsense_api_bootstrap_user,
                        'created_via': 'mvc:auth/user/add_api_key', 'env': opnsense_api_bootstrap_env},
              'fields': {'env': opnsense_api_bootstrap_env, 'host': opnsense_api_bootstrap_host,
                         'port': opnsense_api_bootstrap_port, 'username': opnsense_api_bootstrap_user,
                         'key': opnsense_api_bootstrap_mint.api_key, 'secret': opnsense_api_bootstrap_mint.api_secret}} | to_nice_json }}
      delegate_to: localhost
      become: false
      no_log: true
      when: opnsense_api_bootstrap_collect_file | default('') | length > 0

- name: "OPNsense bootstrap | Summary"
  ansible.builtin.debug:
    msg: >-
      svc user={{ opnsense_api_bootstrap_user }} on {{ opnsense_api_bootstrap_host }} —
      token {{ (('ROTATED — Vault token was stale (FW rebuilt/reseeded), re-minted via MVC + stored' if (opnsense_api_bootstrap_stale | bool)
                 else 'MINTED via MVC + stored in Vault') if (opnsense_api_bootstrap_minted | default(false))
               else ('ABSENT/STALE — check mode, would mint (no change made)' if (ansible_check_mode and (opnsense_api_bootstrap_need_mint | bool))
               else 'reused from Vault (noop, verified HTTP 200)')) }}
      at {{ opnsense_api_bootstrap_vault_mount }}/{{ opnsense_api_bootstrap_vault_path }}
