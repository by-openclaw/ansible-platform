---
# FW API credentials from HashiCorp Vault (security/0001: Vault is THE secret store).
# Include at the start of every play that talks to the OPNsense API; it publishes
# opn_key/opn_secret (catalog names) and opnsense_api_key/opnsense_api_secret
# (role names) as host facts. Replaces the ansible-vault-encrypted
# group_vars/all/vault.yml (retired 2026-09-04).
opnsense_api_creds_vault_path: "{{ platform_env | default('prod') }}/opnsense/api"
opnsense_api_creds_vault_host: "{{ groups['vault'] | first }}"
opnsense_api_creds_vault_container: "vault"
opnsense_api_creds_vault_mount: "secret"
# Optional: read the API token from this local JSON (fields.key/.secret) instead of
# Vault — set per-inventory for envs where the Vault delegation is not wired.
opnsense_api_creds_local_file: ""
# Source 0: a credential passed in (facts/vars) — the build chain hands the genesis key over this way.
opnsense_api_creds_key: ""       # pragma: allowlist secret
opnsense_api_creds_secret: ""    # pragma: allowlist secret
