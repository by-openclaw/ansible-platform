---
# Fast, robust path: if a local secret file is provided (opnsense_api_creds_local_file),
# read the API token straight from it — NO Vault delegation, NO sudo, NO jump. Used by
# the test env (its token also lives in Vault secret/test/opnsense/api for DR). Prod
# leaves the var unset and uses the Vault path below.
# Source 0: credentials handed over as facts/vars (the build chain publishes the genesis credential
# from roles/opnsense_provision). Source 1: a local file. Source 2 (default): Vault.
- name: "FW creds | Publish from the credential passed in"  # noqa: var-naming[no-role-prefix] (contract names used by the catalog + roles/opnsense)
  ansible.builtin.set_fact:
    opn_key: "{{ opnsense_api_creds_key }}"
    opn_secret: "{{ opnsense_api_creds_secret }}"
    opnsense_api_key: "{{ opnsense_api_creds_key }}"
    opnsense_api_secret: "{{ opnsense_api_creds_secret }}"
  no_log: true
  when: opnsense_api_creds_key | default('') | length > 0

- name: "FW creds | Stat the local secret file (if configured)"
  ansible.builtin.stat:
    path: "{{ opnsense_api_creds_local_file }}"
  delegate_to: localhost
  become: false
  check_mode: false
  register: opnsense_api_creds_local
  when:
    - opn_key is not defined
    - opnsense_api_creds_local_file | default('') | length > 0

- name: "FW creds | Publish from the local file"  # noqa: var-naming[no-role-prefix] (contract names used by the catalog + roles/opnsense)
  ansible.builtin.set_fact:
    opn_key: "{{ _f.key }}"
    opn_secret: "{{ _f.secret }}"
    opnsense_api_key: "{{ _f.key }}"
    opnsense_api_secret: "{{ _f.secret }}"
  vars:
    _f: "{{ (lookup('file', opnsense_api_creds_local_file) | from_json).fields }}"
  no_log: true
  when: opnsense_api_creds_local.stat.exists | default(false)

# apply: the caller runs this under tags: always; an include_role's tags do not reach
# the role's own tasks without it (the old static import_role inherited them).
- name: "FW creds | {{ opnsense_api_creds_vault_path }} (roles/vault_secret)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ opnsense_api_creds_vault_path }}"
    vault_secret_mount: "{{ opnsense_api_creds_vault_mount }}"
    vault_secret_host: "{{ opnsense_api_creds_vault_host }}"
    vault_secret_container: "{{ opnsense_api_creds_vault_container }}"
  when: opn_key is not defined
  tags: [always]

- name: "FW creds | Publish as facts (catalog + role names)"  # noqa: var-naming[no-role-prefix] (contract names used by the catalog + roles/opnsense)
  ansible.builtin.set_fact:
    opn_key: "{{ vault_secret_result.key }}"
    opn_secret: "{{ vault_secret_result.secret }}"
    opnsense_api_key: "{{ vault_secret_result.key }}"
    opnsense_api_secret: "{{ vault_secret_result.secret }}"
  no_log: true
  when: opn_key is not defined
