---
# Windows: ping.exe resolves through the Windows resolver (hosts file, then DNS) and prints the address it
# used ("Pinging <name> [<address>]"), even when the target drops ICMP; win_wait_for opens the TCP port.
- name: "Net check | Resolve (Windows resolver, hosts file first)"
  ansible.windows.win_command:
    argv: [ping.exe, -n, "1", -w, "{{ net_check_ping_wait_ms | string }}", "{{ item.name }}"]
  loop: "{{ net_check_items.resolve | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  register: net_check_win_resolve
  changed_when: false
  failed_when: false

- name: "Net check | TCP"
  ansible.windows.win_wait_for:
    host: "{{ item.host }}"
    port: "{{ item.port }}"
    timeout: "{{ net_check_tcp_timeout }}"
  loop: "{{ net_check_items.tcp | default([]) }}"
  loop_control:
    label: "{{ item.host }}:{{ item.port }}"
  register: net_check_win_tcp
  failed_when: false

- name: "Net check | Ping"
  ansible.windows.win_command:
    argv: [ping.exe, -n, "1", -w, "{{ net_check_ping_wait_ms | string }}", "{{ item.host }}"]
  loop: "{{ net_check_items.ping | default([]) }}"
  loop_control:
    label: "{{ item.host }}"
  register: net_check_win_ping
  changed_when: false
  failed_when: false

# SQL Server, on the database host: Windows authentication (the session's own token, no password anywhere),
# one read-only query per declared login — database state, lockout, live sessions from the client address.
- name: "Net check | SQL: database online, login usable, sessions from its client"
  ansible.windows.win_command:
    argv:
      - "{{ net_check_sqlcmd }}"
      - -S
      - "localhost\\{{ item.instance }}"
      - -E
      - -C
      - -h
      - "-1"
      - -W
      - -Q
      - >-
        SET NOCOUNT ON; SELECT CONCAT(CAST(DATABASEPROPERTYEX(N'{{ item.database }}', 'Status') AS nvarchar(20)), '|',
        CAST(ISNULL(LOGINPROPERTY(N'{{ item.login }}', 'IsLocked'), -1) AS int), '|',
        (SELECT COUNT(*) FROM sys.dm_exec_sessions s JOIN sys.dm_exec_connections c ON c.session_id = s.session_id
         WHERE s.login_name = N'{{ item.login }}' AND c.client_net_address = N'{{ item.from }}'))
  loop: "{{ net_check_items.sql | default([]) }}"
  loop_control:
    label: "{{ item.login }}@{{ item.database }} from {{ item.from }}"
  register: net_check_win_sql
  changed_when: false
  failed_when: false

- name: "Net check | Results"
  ansible.builtin.set_fact:
    net_check_results: >-
      {%- set out = [] -%}
      {%- for r in net_check_win_resolve.results | default([]) -%}
        {%- set got = (r.stdout | default('') | regex_search('\[([0-9a-fA-F:.%]+)\]', '\\1') | default([''], true) | first) -%}
        {%- set want = r.item.expect | default('') | string -%}
        {%- set ok = (got | length > 0) and (want | length == 0 or got == want) -%}
        {%- set _ = out.append({'ok': ok, 'required': r.item.required | default(true),
             'line': ('PASS ' if ok else 'FAIL ') ~ 'resolve ' ~ r.item.name ~ ' -> ' ~ (got or 'no answer')
                     ~ ((' (expected ' ~ want ~ ')') if want and not ok else '')}) -%}
      {%- endfor -%}
      {%- for r in net_check_win_tcp.results | default([]) -%}
        {%- set ok = not (r.failed | default(false)) and ('timeout' not in (r.msg | default('') | lower)) -%}
        {%- set _ = out.append({'ok': ok, 'required': r.item.required | default(true),
             'line': ('PASS ' if ok else 'FAIL ') ~ 'tcp ' ~ r.item.host ~ ':' ~ r.item.port
                     ~ ('' if ok else ' (' ~ (r.msg | default('no answer') | truncate(80)) ~ ')')}) -%}
      {%- endfor -%}
      {%- for r in net_check_win_ping.results | default([]) -%}
        {%- set ok = 'TTL=' in (r.stdout | default('')) -%}
        {%- set req = r.item.required | default(false) -%}
        {%- set _ = out.append({'ok': ok, 'required': req,
             'line': ('PASS ' if ok else ('FAIL ' if req else 'INFO ')) ~ 'ping ' ~ r.item.host ~ (' replies' if ok else ' no reply')}) -%}
      {%- endfor -%}
      {%- for r in net_check_win_sql.results | default([]) -%}
        {%- set f = ((r.stdout | default('') | trim) ~ '||').split('|') -%}
        {%- set ran = r.rc | default(1) == 0 -%}
        {%- set ok = ran and f[0] == 'ONLINE' and f[1] == '0' and (f[2] | int(0)) > 0 -%}
        {%- set lock = 'not locked' if f[1] == '0' else ('LOCKED' if f[1] == '1' else 'no such login') -%}
        {%- set detail = ((f[0] or 'no answer') ~ ', ' ~ lock ~ ', ' ~ (f[2] | int(0)) ~ ' sessions') if ran
                         else ((r.stderr | default('', true) or r.stdout | default('', true) or 'sqlcmd failed') | trim | truncate(80)) -%}
        {%- set _ = out.append({'ok': ok, 'required': r.item.required | default(true),
             'line': ('PASS ' if ok else 'FAIL ') ~ 'sql ' ~ r.item.login ~ '@' ~ r.item.database ~ ' from ' ~ r.item.from ~ ': ' ~ detail}) -%}
      {%- endfor -%}
      {{ out }}
