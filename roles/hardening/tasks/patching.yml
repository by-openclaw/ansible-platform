---
- name: "Patching | Install unattended-upgrades + apt-listchanges"
  ansible.builtin.apt:
    name: [unattended-upgrades, apt-listchanges]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Patching | Configure unattended-upgrades (security only)"
  ansible.builtin.template:
    src: 51-hardening-unattended.conf.j2
    dest: /etc/apt/apt.conf.d/51-hardening-unattended
    owner: root
    group: root
    mode: "0644"

- name: "Patching | Enable periodic apt (download + install security)"
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    owner: root
    group: root
    mode: "0644"
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Download-Upgradeable-Packages "1";
      APT::Periodic::AutocleanInterval "7";
      APT::Periodic::Unattended-Upgrade "1";

- name: "Patching | Ensure unattended-upgrades is enabled"
  ansible.builtin.systemd_service:
    name: unattended-upgrades
    enabled: true
    state: started
  when: not ansible_check_mode
