---
# Patching has ONE owner: roles/updates (security origins only, the container
# runtime never upgraded unattended, point releases gated behind the waves in
# playbooks/updates.yml). The baseline includes its mechanism so every host has it.
- name: "Patching | Unattended security upgrades (roles/updates)"
  ansible.builtin.include_role:
    name: updates
    tasks_from: unattended

- name: "Patching | The policy file this role used to write (superseded by roles/updates)"
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/51-hardening-unattended
    state: absent
