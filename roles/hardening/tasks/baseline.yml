---
# Userspace baseline — safe in both VMs and unprivileged LXCs.
- name: "Baseline | sudoers secure_path + logged, tty-required sudo"
  ansible.builtin.copy:
    dest: /etc/sudoers.d/10-hardening
    mode: "0440"
    validate: "visudo -cf %s"
    content: |
      # Managed by Ansible (role: hardening)
      Defaults        secure_path="{{ hardening_sudo_secure_path }}"
      Defaults        use_pty
      Defaults        logfile="{{ hardening_sudo_logfile }}"
      Defaults        !visiblepw

- name: "Baseline | Default UMASK in /etc/login.defs"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^\s*UMASK\s+'
    line: "UMASK           {{ hardening_umask }}"
    state: present

# --- Lynis-driven additions (security/0003 §5, canary index 75 -> target >=80) --
- name: "Baseline | Blacklist unused storage/net protocol modules (USB-1000/STRG-1846/NETW-3200)"
  ansible.builtin.copy:
    dest: /etc/modprobe.d/hardening-blacklist.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening) — Lynis USB-1000/STRG-1846/NETW-3200
      blacklist usb-storage
      blacklist firewire-core
      install dccp /bin/false
      install sctp /bin/false
      install rds /bin/false
      install tipc /bin/false

- name: "Baseline | Package-integrity + patch-mgmt + malware tooling (PKGS-7370/7394, HRDN-7230, FINT-4350)"
  ansible.builtin.apt:
    name: [debsums, apt-show-versions, rkhunter]
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Baseline | File-integrity tool (FINT-4350: AIDE)"
  ansible.builtin.apt:
    # s-nail: since aide 0.18 the daily check runs as _aide under systemd, which
    # cannot use the setgid sendmail path — every report failed to send and
    # dailyaidecheck.service went failed. s-nail submits over SMTP to the local
    # postfix (loopback :25) instead (aide-common README.Debian).
    name: [aide, s-nail]
    state: present

# s-nail's default transport is the sendmail binary — exactly the path the _aide unit
# cannot use ("s-nail: ... message not sent"). Point it at the local MTA over SMTP:
# postfix listens on loopback :25 on every host (mailcow's own on its VM).
- name: "Baseline | s-nail submits over SMTP to the local MTA (not the sendmail binary)"
  ansible.builtin.lineinfile:
    path: /etc/s-nail.rc
    regexp: "^set mta="
    line: "set mta=smtp://127.0.0.1:25"
    create: true
    mode: "0644"

- name: "Baseline | AIDE reports go to the alert mailbox, and only when something changed"
  ansible.builtin.lineinfile:
    path: /etc/default/aide
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    create: true
    mode: "0644"
  loop:
    - { key: MAILTO, value: "{{ hardening_email_alert_dest }}" }
    - { key: QUIETREPORTS, value: "yes" }
    # Report each change once: the next day's baseline includes it. With "no" the
    # baseline never moved and every host mailed the same, growing diff every day —
    # alert fatigue that hides the change that matters.
    - { key: COPYNEWDB, value: "yes" }
  loop_control: { label: "{{ item.key }}" }

# Where the relay template owns main.cf the banner is in the template; a second
# writer here made every run change main.cf twice (the template dropped the line,
# this task added it back). This task covers only a postfix the template does not own.
- name: "Baseline | Hide the postfix banner (MAIL-8818) — only where postfix exists outside the relay template"
  ansible.builtin.lineinfile:
    path: /etc/postfix/main.cf
    regexp: "^smtpd_banner"
    line: "smtpd_banner = $myhostname ESMTP"
  register: hardening_postfix_banner
  failed_when:
    - hardening_postfix_banner is failed
    - "'does not exist' not in (hardening_postfix_banner.msg | default(''))"
  when: not (hardening_email_relay_enabled | bool)
  notify: Restart postfix

- name: "Baseline | Password aging policy (AUTH-9286) — key-only accounts, aging is inert but audited"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: PASS_MAX_DAYS, value: "365" }
    - { key: PASS_MIN_DAYS, value: "1" }
  loop_control: { label: "{{ item.key }}" }

- name: "Baseline | PAM tmpdir isolation (DEB-0280)"
  ansible.builtin.apt:
    name: libpam-tmpdir
    state: present

# aideinit runs in the background (10+ min on a busy host). An async launch with poll: 0
# always reports "changed" — so gate it on the database file and on a build already running,
# otherwise every hardening pass re-launched a full AIDE build (and reported a change).
- name: "Baseline | AIDE scope: the host's files, not container or guest storage"
  ansible.builtin.copy:
    dest: /etc/aide/aide.conf.d/99_platform_scope
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening, hardening_aide_excludes): host files only.
      {% for p in _aide_excludes %}
      !{{ p }}($|/)
      {% endfor %}
  vars:
    _aide_excludes: >-
      {{ hardening_aide_excludes
         + ((ansible_facts.mounts | default([]) | selectattr('fstype', 'equalto', 'zfs')
             | selectattr('device', 'match', '^[^/]+$') | map(attribute='mount') | list)
            if inventory_hostname in (groups['proxmox_nodes'] | default([])) else []) }}
  register: hardening_aide_scope

- name: "Baseline | AIDE database present?"
  ansible.builtin.stat:
    path: /var/lib/aide/aide.db
  register: hardening_aide_db

- name: "Baseline | AIDE build already running?"
  ansible.builtin.command: pgrep -x aide
  register: hardening_aide_running
  changed_when: false
  failed_when: false
  check_mode: false

# Built once, and rebuilt when the scope changes (a baseline taken with the old scope
# would report every newly excluded file as removed). 3600 s: the first build on the
# node ran past the old 900 s limit and left an empty aide.db.new.
- name: "Baseline | Build the AIDE database (FINT-4402 — first run or new scope, in the background)"
  ansible.builtin.command: aideinit -y -f
  async: 3600
  poll: 0
  when:
    - not hardening_aide_db.stat.exists or hardening_aide_scope is changed
    - hardening_aide_running.rc != 0
    - not ansible_check_mode
  changed_when: true

- name: "Baseline | Password hashing rounds (AUTH-9230)"
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: "^#?\\s*{{ item.key }}\\s"
    line: "{{ item.key }}\t{{ item.value }}"
  loop:
    - { key: SHA_CRYPT_MIN_ROUNDS, value: "640000" }
    - { key: SHA_CRYPT_MAX_ROUNDS, value: "640000" }
  loop_control: { label: "{{ item.key }}" }

- name: "Baseline | Accounting + password-strength tooling (ACCT-9626, AUTH-9262)"
  ansible.builtin.apt:
    name: [sysstat, libpam-pwquality, needrestart]
    state: present

# Kernel process accounting is host-scoped like the audit subsystem: in an LXC
# accton gets "Operation not permitted" and acct.service sits failed on every
# container. VMs and nodes keep it (ACCT-9622); containers do not carry it.
- name: "Baseline | Process accounting (ACCT-9622) on VMs and nodes, not in LXCs"
  ansible.builtin.apt:
    name: acct
    state: "{{ 'absent' if ansible_virtualization_type | default('') == 'lxc' else 'present' }}"

- name: "Baseline | Enable sysstat collection"
  ansible.builtin.lineinfile:
    path: /etc/default/sysstat
    regexp: "^ENABLED="
    line: 'ENABLED="true"'
  notify: Restart sysstat

- name: "Baseline | AIDE checksums SHA512 (FINT-4316)"
  ansible.builtin.lineinfile:
    path: /etc/aide/aide.conf
    regexp: "^Checksums\\s*="
    line: "Checksums = sha512"
  failed_when: false

- name: "Baseline | Install auditd on VMs (SEC-23; kernel audit is host-scoped, so not in LXCs)"
  ansible.builtin.apt:
    name: [auditd, audispd-plugins]
    state: present
  when: ansible_virtualization_type | default('') != 'lxc'

- name: "Baseline | Gather package facts (for conditional auditd rules)"
  ansible.builtin.package_facts:
    manager: apt

- name: "Baseline | Minimal auditd ruleset when auditd is present (ACCT-9630)"
  ansible.builtin.copy:
    dest: /etc/audit/rules.d/hardening.rules
    mode: "0640"
    content: |
      ## identity/0004 baseline audit trail (shipped to Loki via promtail — see #12)
      -w /etc/passwd -p wa -k identity
      -w /etc/group -p wa -k identity
      -w /etc/shadow -p wa -k identity
      -w /etc/sudoers -p wa -k privilege
      -w /etc/sudoers.d/ -p wa -k privilege
      -w /etc/ssh/sshd_config -p wa -k sshd
      -a always,exit -F arch=b64 -S adjtimex,settimeofday -k time-change
  register: hardening_audit_rules
  when: "'auditd' in ansible_facts.packages | default({})"
  notify: Reload auditd rules

- name: "Baseline | Detect networkd-managed links (apt-daily wait-online guard)"
  ansible.builtin.shell: |
    set -o pipefail
    networkctl list --no-legend 2>/dev/null | awk '$4 != "unmanaged" && $2 != "lo"' | wc -l
  args: { executable: /bin/bash }
  register: hardening_networkd_managed
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

# On ifupdown guests networkd manages no links, so wait-online can never
# succeed — it times out daily and silently aborts apt-daily-upgrade.
- name: "Baseline | Mask systemd-networkd-wait-online when networkd manages no links"
  ansible.builtin.systemd_service:
    name: systemd-networkd-wait-online.service
    enabled: false
    masked: true
  when: (hardening_networkd_managed.stdout | default('1') | trim | int) == 0

- name: "Baseline | auditd log readable by group adm (promtail ships the trail)"
  ansible.builtin.lineinfile:
    path: /etc/audit/auditd.conf
    regexp: "^log_group\\s*="
    line: "log_group = adm"
  register: hardening_auditd_group
  failed_when:
    - hardening_auditd_group is failed
    - "'does not exist' not in (hardening_auditd_group.msg | default(''))"
  notify: Reload auditd rules

- name: "Baseline | Rotate AIDE + local tool logs (logrotate concern-role)"
  ansible.builtin.include_role:
    name: logrotate
  vars:
    logrotate_entries:
      - name: aide
        paths: ["/var/log/aide/*.log"]
        rotate: 8
        frequency: weekly

# With docker's journald log driver, the journal is the rotation control for
# ALL container output — pin explicit caps instead of the 10%-of-disk default.
- name: "Baseline | journald conf dir exists first"
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Baseline | journald disk caps (containers log here now)"
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/10-caps.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/hardening)
      [Journal]
      SystemMaxUse={{ hardening_journald_max_use }}
      SystemKeepFree={{ hardening_journald_keep_free }}
      MaxRetentionSec={{ hardening_journald_retention }}
  register: hardening_journald_caps

- name: "Baseline | Apply journald caps"  # noqa: no-handler
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted
  when: hardening_journald_caps is changed

# A unit whose file is gone (package removed, service retired by a role) or that is
# masked (switched off for good) keeps its "failed" state until reset — e.g.
# wtmpdb-rotate.timer after wtmpdb left, the retired netbird-approval-notify, the
# masked ipmitool collector. Only NOT-FOUND and MASKED units are reset: a real
# failure of a unit that can still run stays visible.
- name: "Baseline | Failed units that are gone or masked"
  ansible.builtin.shell: >-
    set -o pipefail;
    systemctl list-units --all --failed --plain --no-legend | awk '$2 == "not-found" || $2 == "masked" {print $1}'
  args:
    executable: /bin/bash
  register: hardening_vanished_failed
  changed_when: false
  check_mode: false   # read-only probe

- name: "Baseline | Clear their failed state"
  ansible.builtin.command:
    argv: [systemctl, reset-failed, "{{ item }}"]
  loop: "{{ hardening_vanished_failed.stdout_lines }}"
  changed_when: true
  when: not ansible_check_mode
