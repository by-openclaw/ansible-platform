---
# ==============================================================================
# Task: sshd hardening
#
# Strategy: replace /etc/ssh/sshd_config entirely (not .d/ fragments).
# Reason: sshd_config.d/ overrides ADD ports but do not REMOVE the default
# Port 22 — this means both ports end up open. Full replacement is the only
# safe approach.
#
# Safety: validate with `sshd -t` before restarting. Verify new port responds
# before disconnecting. Never closes current connection without confirmation.
# ==============================================================================

- name: "SSH | Ensure openssh-server is installed"
  ansible.builtin.package:
    name: openssh-server
    state: present

- name: "SSH | Remove any .d/ fragment files that might re-open port 22"
  ansible.builtin.find:
    paths: /etc/ssh/sshd_config.d/
    patterns: "*.conf"
  register: hardening_sshd_fragments
  ignore_errors: true

- name: "SSH | Remove conflicting .d/ fragments (re-opens port 22)"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ hardening_sshd_fragments.files | default([]) }}"
  notify: Validate and restart sshd

- name: "SSH | Deploy hardened sshd_config from template"
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config
    owner: root
    group: root
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Validate and restart sshd

- name: "SSH | Ensure break-glass group exists"
  ansible.builtin.group:
    name: "{{ hardening_ssh_break_glass_group }}"
    state: present

- name: "SSH | Flush handlers now (restart sshd before checking port)"
  ansible.builtin.meta: flush_handlers

- name: "SSH | Verify new SSH port is responding (from controller)"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: "{{ hardening_ssh_port }}"
    timeout: 30
    state: started
  delegate_to: localhost
  become: false

- name: "SSH | Verify port 22 is NOT responding (from controller)"
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 22
    timeout: 5
    state: stopped
  delegate_to: localhost
  become: false
  ignore_errors: true
  register: hardening_port22_check

- name: "SSH | Report port 22 status"
  ansible.builtin.debug:
    msg: >-
      {% if hardening_port22_check.failed %}Port 22 is closed ✅{% else %}
      ⚠️  WARNING: Port 22 is still responding on {{ ansible_host }}.
      Check sshd_config manually.{% endif %}
