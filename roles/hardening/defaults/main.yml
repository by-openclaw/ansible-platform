---
# ==============================================================================
# Role: hardening — default variables
# Override per group_vars / host_vars as needed
# ==============================================================================

# ------------------------------------------------------------------------------
# SSH
# ------------------------------------------------------------------------------
hardening_ssh_port: "{{ platform_ssh_port | default(22222) }}"
hardening_ssh_password_auth: "no"
hardening_ssh_permit_root_login: "no"
hardening_ssh_pubkey_auth: "yes"
hardening_ssh_challenge_response: "no"
hardening_ssh_x11_forwarding: "no"
hardening_ssh_max_auth_tries: 3
hardening_ssh_login_grace_time: 30
hardening_ssh_client_alive_interval: 300
hardening_ssh_client_alive_count_max: 2

# Groups allowed to SSH in (key-based)
hardening_ssh_allow_groups:
  - by-research
  - rune

# Break-glass: password auth allowed ONLY for this group AND from these networks
# These are OOB and MGMT networks — never internet-facing
hardening_ssh_break_glass_group: "break-glass"
hardening_ssh_break_glass_networks:
  - "10.6.224.0/20"   # OOB production management
  - "10.6.240.0/20"   # MGMT VLAN

# ------------------------------------------------------------------------------
# fail2ban
# ------------------------------------------------------------------------------
hardening_fail2ban_ssh_port: "{{ hardening_ssh_port }}"
hardening_fail2ban_ssh_maxretry: 5
hardening_fail2ban_ssh_bantime: 3600
hardening_fail2ban_ssh_findtime: 600
hardening_fail2ban_ssh_ignoreip: "127.0.0.1/8 10.6.224.0/20 10.6.240.0/20"

# Additional jails (list of dicts: name, port, filter, maxretry, bantime)
hardening_fail2ban_extra_jails: []

# ------------------------------------------------------------------------------
# Firewall (ufw) — nodes set hardening_ufw_enabled: false (the Proxmox firewall is theirs)
hardening_ufw_enabled: true
hardening_ufw_after_docker: "{{ (ansible_facts.services | default({}))['docker.service'] is defined }}"   # order ufw after Docker where Docker runs
# ------------------------------------------------------------------------------
# Default policy: deny all incoming, allow all outgoing
# Rules are additive — specify what to open, everything else is blocked
hardening_ufw_allowed_ports:
  - { port: "{{ hardening_ssh_port }}", proto: "tcp", from: "10.6.224.0/20", comment: "SSH from OOB" }
  # The controller reaches guests THROUGH the firewall (ProxyJump): the connection arrives from the
  # FW's zone address (10.1.x.1), and JumpServer (SVC) is the human bastion — both inside the platform
  # supernet. Without these, an active ufw blocks Ansible after the first reboot (vm-k3s-01, 2026-09-19).
  - { port: "{{ hardening_ssh_port }}", proto: "tcp", from: "10.1.0.0/16", comment: "SSH from the platform (FW jump, JumpServer)" }
  - { port: "{{ hardening_ssh_port }}", proto: "tcp", from: "fd01::/16", comment: "SSH from the platform v6 (FW jump, JumpServer)" }

# ------------------------------------------------------------------------------
# Email relay (postfix satellite)
# ------------------------------------------------------------------------------
hardening_email_relay_enabled: false
hardening_email_relay_host: ""
hardening_email_relay_port: 587
hardening_email_relay_user: ""
hardening_email_relay_password: ""
hardening_email_from: "alerts@{{ platform_domain | default('by-research.be') }}"
hardening_email_alert_dest: "alerts@{{ platform_domain | default('by-research.be') }}"
hardening_email_hostname: "{{ inventory_hostname }}"
# Mail identity for ANY host that carries a local postfix (Debian default MTA), relay or
# not: myhostname = <inventory_hostname>.<platform_domain> (resolves via the FW overrides),
# myorigin = <platform_domain>. Without it system mail goes out as root@<host>.localdomain,
# mailcow answers 450 "Sender address rejected: Domain not found", the queue retries
# forever and CrowdSec read that as postfix-spam (2026-09-18 self-ban of every SVC host).
hardening_mail_identity_enabled: true
hardening_mail_domain: "{{ platform_domain | default('by-research.be') }}"

# ------------------------------------------------------------------------------
# Part-B baseline (CIS-L1 ≈ NIS2 Art.21 / GDPR Art.32) — mandatory-now hardening
# ------------------------------------------------------------------------------
# Automatic security patching (unattended-upgrades). No auto-reboot by default
# on a controlled platform — alert instead.
hardening_auto_updates: true
hardening_auto_reboot: false
hardening_auto_reboot_time: "03:30"
hardening_updates_mail: "{{ hardening_email_alert_dest | default('ops@by-systems.be') }}"

# sudoers: secure_path (env-PATH hardening) + logged, tty-required sudo
hardening_sudo_secure_path: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
hardening_sudo_logfile: "/var/log/sudo.log"

# login.defs default umask (027 = files 640 / dirs 750)
hardening_umask: "027"

# NTP (chrony) — time sync for log correlation / forensics. Default pool; override
# per env to point at the OPNsense gateway if preferred.
hardening_ntp_enabled: true
hardening_ntp_servers:
  - "{{ ansible_default_ipv4.gateway }}"   # the OPNsense VLAN gateway (FW serves NTP)

# auditd — audit trail of auth / privilege / config changes + log retention.
hardening_auditd_enabled: true
hardening_auditd_max_log_file: 20      # MB per log
hardening_auditd_num_logs: 8
hardening_auditd_space_left_action: "SYSLOG"

# sysctl kernel hardening. NOTE: ip_forward / *.forwarding are deliberately NOT
# set here — Docker-in-LXC hosts require forwarding (roles/docker sets it).
hardening_sysctl_enabled: true

# Lynis audit gate — security/0003 §5 (LOCKED: >=80 or the play fails).
hardening_lynis_min_score: 80
hardening_lynis_enforce: true

# journald caps — the rotation control for container logs (docker journald driver)
hardening_journald_max_use: "1G"
hardening_journald_keep_free: "2G"
hardening_journald_retention: "30day"
