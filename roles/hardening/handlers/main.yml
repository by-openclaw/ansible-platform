---
# ==============================================================================
# Handlers — triggered by notify, run once at end of play (or after flush)
# ==============================================================================

- name: Reload ufw
  community.general.ufw:
    state: reloaded

# Both skipped under --check. A handler RUNS in check mode when notified, and on a
# host that does not have postfix yet the unit does not exist and postmap has no
# input — so a dry-run aborted on the three hosts that still need the package.
# Third time today this shape appeared (crowdsec_agent #583, the postfix service
# task, here): the tasks that notify a handler get guarded and the handler does not.
- name: Restart postfix
  ansible.builtin.service:
    name: postfix
    state: restarted
  when: not ansible_check_mode

- name: Postmap sasl_passwd
  ansible.builtin.command: postmap /etc/postfix/sasl_passwd
  changed_when: true
  when: not ansible_check_mode

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Restart chrony
  ansible.builtin.service:
    name: chrony
    state: restarted
  when: not ansible_check_mode

- name: Restart auditd
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: not ansible_check_mode

- name: Restart sysstat
  ansible.builtin.service:
    name: sysstat
    state: restarted
  failed_when: false

- name: Reload auditd rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  failed_when: false
