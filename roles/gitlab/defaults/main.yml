---
# ==============================================================================
# Role: gitlab — GitLab CE (the official Omnibus image, a container on the host network)
# on lxc-gitlab-01 (SVC).
# Bundled Postgres/Redis/object-storage are DISABLED — GitLab consumes the shared
# cluster services (separation of concerns), all wired from the controller secret
# store. Fronted by Traefik (TLS termination); SSO via Authentik OIDC (mandatory).
#
#   DB     → lxc-pgsql-01     (postgres_db: gitlabhq_production)   sslmode=require
#   Redis  → lxc-redis-01     (rediss, LE wildcard, password)
#   S3     → lxc-seaweedfs-01 (seaweedfs_bucket: gitlab-* buckets, path-style)
#   OIDC   → authentik        (required_groups + admin_groups from `groups` claim)
#   Email  → mailcow          (submission 587, service mailbox — optional)
#   Repos  → /var/opt/gitlab/git-data  (ZFS bind-mount, survives destroy)
# ==============================================================================

# Secrets: Vault IS the store (no local files). Each path below is read from Vault
# via the vault_secret role; the owning role (postgres_db / seaweedfs_bucket /
# authentik / mailcow) creates it first. GitLab's OWN generated secrets are written
# back to Vault after install (DR-critical).
gitlab_pg_vault_path: "{{ platform_env }}/gitlab/db-pgsql"          # postgres_db creates
gitlab_redis_vault_path: "{{ platform_env }}/redis/admin"         # redis role owns (shared)
gitlab_s3_vault_path: "{{ platform_env }}/gitlab/s3"   # seaweedfs_bucket creates
gitlab_oidc_vault_path: "{{ platform_env }}/gitlab/oidc"        # authentik creates
# SMTP + IMAP both come from the service mailbox document below (SVC-11/SVC-16); the former
# `{env}/gitlab/smtp` document is no longer read.
# Service Desk / reply-by-email (mailroom over IMAPS on the gitlab@ box, Vault
# prod/mail/gitlab). Dependency: mail.<domain> must resolve INTERNALLY to mailcow
# (split-DNS record in the FW catalog) — SVC→DMZ is allowed by default, no FW
# rule needed. Proven 2026-09-04: imap-login OK from lxc-gitlab-01.
gitlab_service_desk_enabled: true
gitlab_mail_vault_path: "{{ platform_env }}/mail/gitlab"        # mailbox concern-role: address/imap_host/imap_port/password
gitlab_secrets_vault_path: "{{ platform_env }}/gitlab/secrets"      # GitLab's own secrets (written post-install)  # pragma: allowlist secret

# --- Version pin (NEVER unpinned / :latest) -----------------------------------
# The image tag. Move through playbooks/gitlab-upgrade.yml (one rung per minor).
# renovate: datasource=docker depName=gitlab/gitlab-ce versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ce\.(?<build>\d+)$
gitlab_version: "19.4.1-ce.0"
gitlab_image: "gitlab/gitlab-ce:{{ gitlab_version }}"
# The image's own startup (init-container) knobs: no OpenSSH in the container (git over SSH is
# not offered — the host's sshd admits only the admin groups), and the logs stay in
# /var/log/gitlab files as the package had them (no `gitlab-ctl tail` into the journal).
gitlab_container_env:
  GITLAB_DISABLE_OPENSSH: "true"
  GITLAB_SKIP_TAIL_LOGS: "true"
gitlab_shm_size: "256m"                # Puma/Sidekiq metrics live in /dev/shm (the image's recommendation)
# The retired native install (removed once the container is ready). /etc/gitlab,
# /var/opt/gitlab and /var/log/gitlab are the container's — never part of this.
gitlab_native:
  units: [gitlab-runsvdir]
  packages: [gitlab-ce]
  files:
    - /etc/apt/sources.list.d/gitlab_gitlab-ce.list
    - /etc/apt/keyrings/gitlab-ce.asc
    - /usr/lib/systemd/system/gitlab-runsvdir.service
    - /opt/gitlab   # what the package's reconfigure left beside its files (sv, service, init, etc)

# --- Identity / URLs ----------------------------------------------------------
gitlab_external_url: "https://{{ platform_service_fqdns.gitlab }}"
gitlab_registry_external_url: "https://{{ platform_service_fqdns.gitlab_registry }}"
gitlab_pages_external_url: "https://{{ platform_service_fqdns.gitlab_pages }}"   # wildcard TLS route = follow-up
gitlab_svc_ip: "{{ hostvars[inventory_hostname].ansible_host }}"

# Backends Traefik routes to (GitLab nginx serves plaintext; Traefik does TLS).
gitlab_http_backend_port: 80
gitlab_registry_backend_port: 5050

# Git-over-SSH: gitlab-shell manages the git user's authorized_keys on the host
# sshd. Current LXC sshd = port 22 (not yet hardened to 22222). If hardening moves
# it, bump this too.
gitlab_ssh_port: 22
# Clone URLs advertise this SSH host. gitlab.{{ platform_domain }} resolves to Traefik
# (web/registry over 443 only) — SSH can't traverse Traefik, so SSH must target the
# LXC directly. <the gitlab host>.{{ platform_domain }} → its SVC address (VPN→SVC:22 already allowed).
gitlab_ssh_host: "{{ inventory_hostname }}.{{ platform_domain }}"

# --- Persistent git storage (the ZFS bind-mount target) -----------------------
gitlab_git_data_dir: "/var/opt/gitlab/git-data"

# --- Shared PostgreSQL --------------------------------------------------------
gitlab_pg_host: "{{ platform_pg_host }}"
gitlab_pg_port: 5432
gitlab_pg_name: "gitlabhq_production"
gitlab_pg_user: "gitlab"
gitlab_pg_sslmode: "verify-full"       # validates the PG server cert (security parity with netbox/nextcloud/vaultwarden)
gitlab_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"   # host CA bundle (platform CA present; PG cert SAN *.by-research.be)

# --- Shared Redis (TLS) -------------------------------------------------------
gitlab_redis_host: "{{ groups['redis'] | first }}.{{ platform_domain }}"
gitlab_redis_port: 6379
gitlab_redis_ssl: true

# --- S3 object storage (SeaweedFS, direct same-VLAN endpoint) -----------------
# Host FQDN (same-VLAN direct, no IP, no Traefik hairpin; s3.{{ platform_domain }} would
# hairpin via the DMZ Traefik). TLS-direct to SeaweedFS = a hardening follow-up.
gitlab_s3_endpoint: "http://{{ groups['seaweedfs'] | first }}.{{ platform_domain }}:8333"
gitlab_s3_region: "us-east-1"                   # SeaweedFS ignores it; GitLab requires one
# The buckets (gitlab_s3_buckets, gitlab_registry_bucket, gitlab_backup_bucket) live in
# group_vars/all/gitlab.yml: the playbook provisions exactly what this role configures.

# --- SSO (Authentik OIDC) -----------------------------------------------------
gitlab_oidc_issuer: "https://{{ platform_service_fqdns.authentik }}/application/o/gitlab/"
gitlab_oidc_required_groups: ["{{ platform_service_groups.gitlab.access }}"]   # only these may sign in (CE, from claim)
gitlab_oidc_admin_groups: ["{{ platform_service_groups.gitlab.admin }}"]     # these become GitLab admins (CE)
gitlab_oidc_block_auto_created: false           # auto-provision on first SSO login
# Keep local password login as break-glass (root). SSO is the user path.
gitlab_disable_password_login: true    # the sign-in page goes straight to Authentik (IDN-01); break-glass root: ?auto_sign_in=false, password in Vault

# --- Email (mailcow submission) — optional ------------------------------------
# If the Vault path exists (mailcow mailbox provisioned), SMTP is configured; else
# email is left OFF. GitLab runs fine without it, but notifications/resets need it.

# --- Pages --------------------------------------------------------------------
# Pages ENABLED: prerequisites now in place — *.pages.{{ platform_domain }} wildcard cert
# (on Traefik) + Unbound wildcard override + Traefik wildcard router. Pages nginx
# runs as a plaintext HTTP backend (Traefik terminates TLS) so it needs no local
# cert (that was the earlier crash-loop). Backend port below.
gitlab_pages_enabled: true
gitlab_pages_backend_port: 8091   # Pages daemon external_http (Traefik target); listen_proxy default 8090 stays localhost

# --- Footprint knobs ----------------------------------------------------------
gitlab_prometheus_monitoring: false    # bundled prometheus/grafana off (RAM; monitoring stack is separate/parked)
# --- Metrics for the platform Prometheus (INF-33) -----------------------------------------
# The services' own exporters bind to the SVC address (host network) and ufw admits the
# monitoring host; the catalog `metrics_ports` scrapes them (job `gitlab`).
gitlab_metrics_ports:
  puma: 8083
  sidekiq: 8082
  workhorse: 9229
  gitaly: 9236
  gitlab_exporter: 9168
gitlab_metrics_scrapers: "{{ groups['monitoring'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
gitlab_puma_workers: 2
gitlab_sidekiq_concurrency: 10

# --- Backup (SeaweedFS gitlab-backups → Contabo offsite tier-3, pure Ansible) --
gitlab_backup_enabled: true
gitlab_backup_keep_seconds: 604800     # 7 days on S3 (GitLab prunes)
gitlab_backup_on_calendar: "*-*-* 02:30:00"   # nightly (roles/host_job timer)

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
gitlab_firewall_rules:
  - { port: "{{ gitlab_http_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab HTTP backend (Traefik)" }
  - { port: "{{ gitlab_registry_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab registry backend (Traefik)" }
  - { port: "{{ gitlab_pages_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab Pages backend (Traefik)" }
  - { port: "{{ gitlab_metrics_ports.puma }}", proto: tcp, from: "{{ gitlab_metrics_scrapers }}", comment: "GitLab Puma /metrics (Prometheus)" }
  - { port: "{{ gitlab_metrics_ports.sidekiq }}", proto: tcp, from: "{{ gitlab_metrics_scrapers }}", comment: "GitLab Sidekiq /metrics (Prometheus)" }
  - { port: "{{ gitlab_metrics_ports.workhorse }}", proto: tcp, from: "{{ gitlab_metrics_scrapers }}", comment: "GitLab Workhorse /metrics (Prometheus)" }
  - { port: "{{ gitlab_metrics_ports.gitaly }}", proto: tcp, from: "{{ gitlab_metrics_scrapers }}", comment: "Gitaly /metrics (Prometheus)" }
  - { port: "{{ gitlab_metrics_ports.gitlab_exporter }}", proto: tcp, from: "{{ gitlab_metrics_scrapers }}", comment: "gitlab-exporter /metrics (Prometheus)" }
