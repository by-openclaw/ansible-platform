---
# ==============================================================================
# Role: gitlab — GitLab CE (official Omnibus, apt) on lxc-gitlab-01 (SVC).
# Bundled Postgres/Redis/object-storage are DISABLED — GitLab consumes the shared
# cluster services (separation of concerns), all wired from the controller secret
# store. Fronted by Traefik (TLS termination); SSO via Authentik OIDC (mandatory).
#
#   DB     → lxc-pgsql-01     (postgres_db: gitlabhq_production)   sslmode=require
#   Redis  → lxc-redis-01     (rediss, LE wildcard, password)
#   S3     → lxc-seaweedfs-01 (seaweedfs_bucket: gitlab-* buckets, path-style)
#   OIDC   → authentik        (required_groups + admin_groups from `groups` claim)
#   Email  → mailcow          (submission 587, service mailbox — optional)
#   Repos  → /var/opt/gitlab/git-data  (ZFS bind-mount, survives destroy)
# ==============================================================================

# Secrets: Vault IS the store (no local files). Each path below is read from Vault
# via the vault_secret role; the owning role (postgres_db / seaweedfs_bucket /
# authentik / mailcow) creates it first. GitLab's OWN generated secrets are written
# back to Vault after install (DR-critical).
gitlab_pg_vault_path: "prod/gitlab/db-pgsql"          # postgres_db creates
gitlab_redis_vault_path: "prod/redis/admin"         # redis role owns (shared)
gitlab_s3_vault_path: "prod/gitlab/s3"   # seaweedfs_bucket creates
gitlab_oidc_vault_path: "prod/gitlab/oidc"        # authentik creates
gitlab_smtp_vault_path: "prod/gitlab/smtp"        # mailcow mailbox (optional)
# Service Desk / reply-by-email (mailroom over IMAPS on the gitlab@ box, Vault
# prod/mail/gitlab). Dependency: mail.<domain> must resolve INTERNALLY to mailcow
# (split-DNS record in the FW catalog) — SVC→DMZ is allowed by default, no FW
# rule needed. Proven 2026-09-04: imap-login OK from lxc-gitlab-01.
gitlab_service_desk_enabled: true
gitlab_mail_vault_path: "prod/mail/gitlab"        # mailbox concern-role: address/imap_host/imap_port/password
gitlab_secrets_vault_path: "prod/gitlab/secrets"      # GitLab's own secrets (written post-install)  # pragma: allowlist secret

# --- Version pin (NEVER unpinned / :latest) -----------------------------------
# Verify the exact available string before apply: `apt-cache madison gitlab-ce`.
# renovate: datasource=docker depName=gitlab/gitlab-ce versioning=regex:^(?<major>\d+)\.(?<minor>\d+)\.(?<patch>\d+)-ce\.(?<build>\d+)$
gitlab_version: "19.4.0-ce.0"          # ladder target; move through playbooks/gitlab-upgrade.yml (19.3.2 security patch first)
gitlab_apt_repo_url: "https://packages.gitlab.com/gitlab/gitlab-ce"

# --- Identity / URLs ----------------------------------------------------------
gitlab_external_url: "https://gitlab.{{ platform_domain }}"
gitlab_registry_external_url: "https://registry.{{ platform_domain }}"
gitlab_pages_external_url: "https://pages.{{ platform_domain }}"   # wildcard TLS route = follow-up
gitlab_svc_ip: "10.1.3.210"

# Backends Traefik routes to (GitLab nginx serves plaintext; Traefik does TLS).
gitlab_http_backend_port: 80
gitlab_registry_backend_port: 5050

# Git-over-SSH: gitlab-shell manages the git user's authorized_keys on the host
# sshd. Current LXC sshd = port 22 (not yet hardened to 22222). If hardening moves
# it, bump this too.
gitlab_ssh_port: 22
# Clone URLs advertise this SSH host. gitlab.{{ platform_domain }} resolves to Traefik
# (web/registry over 443 only) — SSH can't traverse Traefik, so SSH must target the
# LXC directly. lxc-gitlab-01.{{ platform_domain }} → 10.1.3.210 (VPN→SVC:22 already allowed).
gitlab_ssh_host: "lxc-gitlab-01.{{ platform_domain }}"

# --- Persistent git storage (the ZFS bind-mount target) -----------------------
gitlab_git_data_dir: "/var/opt/gitlab/git-data"

# --- Shared PostgreSQL --------------------------------------------------------
gitlab_pg_host: "lxc-pgsql-01.{{ platform_domain }}"
gitlab_pg_port: 5432
gitlab_pg_name: "gitlabhq_production"
gitlab_pg_user: "gitlab"
gitlab_pg_sslmode: "verify-full"       # validates the PG server cert (security parity with netbox/nextcloud/vaultwarden)
gitlab_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"   # host CA bundle (platform CA present; PG cert SAN *.by-research.be)

# --- Shared Redis (TLS) -------------------------------------------------------
gitlab_redis_host: "lxc-redis-01.{{ platform_domain }}"
gitlab_redis_port: 6379
gitlab_redis_ssl: true

# --- S3 object storage (SeaweedFS, direct same-VLAN endpoint) -----------------
# Host FQDN (same-VLAN direct, no IP, no Traefik hairpin; s3.{{ platform_domain }} would
# hairpin via the DMZ Traefik). TLS-direct to SeaweedFS = a hardening follow-up.
gitlab_s3_endpoint: "http://lxc-seaweedfs-01.{{ platform_domain }}:8333"
gitlab_s3_region: "us-east-1"                   # SeaweedFS ignores it; GitLab requires one
# One scoped key, access to all of these. Consolidated object storage + registry +
# backups. seaweedfs_bucket creates the buckets and the gitlab-scoped identity.
gitlab_s3_buckets:
  artifacts: "gitlab-artifacts"
  external_diffs: "gitlab-external-diffs"
  lfs: "gitlab-lfs"
  uploads: "gitlab-uploads"
  packages: "gitlab-packages"
  dependency_proxy: "gitlab-dependency-proxy"
  terraform_state: "gitlab-terraform-state"
  ci_secure_files: "gitlab-ci-secure-files"
  pages: "gitlab-pages"
gitlab_registry_bucket: "gitlab-registry"
gitlab_backup_bucket: "gitlab-backups"

# --- SSO (Authentik OIDC) -----------------------------------------------------
gitlab_oidc_issuer: "https://authentik.{{ platform_domain }}/application/o/gitlab/"
gitlab_oidc_required_groups: ["gitlab-users"]   # only these may sign in (CE, from claim)
gitlab_oidc_admin_groups: ["gitlab-admins"]     # these become GitLab admins (CE)
gitlab_oidc_block_auto_created: false           # auto-provision on first SSO login
# Keep local password login as break-glass (root). SSO is the user path.
gitlab_disable_password_login: false

# --- Email (mailcow submission) — optional ------------------------------------
# If the Vault path exists (mailcow mailbox provisioned), SMTP is configured; else
# email is left OFF. GitLab runs fine without it, but notifications/resets need it.

# --- Pages --------------------------------------------------------------------
# Pages ENABLED: prerequisites now in place — *.pages.{{ platform_domain }} wildcard cert
# (on Traefik) + Unbound wildcard override + Traefik wildcard router. Pages nginx
# runs as a plaintext HTTP backend (Traefik terminates TLS) so it needs no local
# cert (that was the earlier crash-loop). Backend port below.
gitlab_pages_enabled: true
gitlab_pages_backend_port: 8091   # Pages daemon external_http (Traefik target); listen_proxy default 8090 stays localhost

# --- Footprint knobs ----------------------------------------------------------
gitlab_prometheus_monitoring: false    # bundled prometheus/grafana off (RAM; monitoring stack is separate/parked)
gitlab_puma_workers: 2
gitlab_sidekiq_concurrency: 10

# --- Backup (SeaweedFS gitlab-backups → Contabo offsite tier-3, pure Ansible) --
gitlab_backup_enabled: true
gitlab_backup_keep_seconds: 604800     # 7 days on S3 (GitLab prunes)
gitlab_backup_cron: "30 2 * * *"       # nightly 02:30

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
gitlab_firewall_rules:
  - { port: "{{ gitlab_http_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab HTTP backend (Traefik)" }
  - { port: "{{ gitlab_registry_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab registry backend (Traefik)" }
  - { port: "{{ gitlab_pages_backend_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "GitLab Pages backend (Traefik)" }
