---
# ==============================================================================
# GitLab CE — the official Omnibus image as a container (host network), wired to the
# shared cluster services. Pre-req: Play 1 (pve_zfs_mount) has attached the ZFS git-data
# bind-mount, and the gitlab DB / S3 bucket+key / OIDC client have been provisioned (playbook).
# ==============================================================================

# --- Secrets from Vault (no local files; owning roles created each path) --------
- name: "GitLab | Read PostgreSQL creds from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_pg_vault_path }}"

- name: "GitLab | Adopt PostgreSQL password"
  ansible.builtin.set_fact:
    gitlab_pg_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "GitLab | Read its Redis login from Vault (owner: roles/redis)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_redis_vault_path }}"

- name: "GitLab | Adopt Redis password"
  ansible.builtin.set_fact:
    gitlab_redis_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "GitLab | Read S3 scoped key from Vault (SeaweedFS)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_s3_vault_path }}"

- name: "GitLab | Adopt S3 scoped key"
  ansible.builtin.set_fact:
    gitlab_s3_key: "{{ vault_secret_result }}"
  no_log: true

- name: "GitLab | Read OIDC client creds from Vault (Authentik)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_oidc_vault_path }}"

- name: "GitLab | Adopt OIDC client creds"
  ansible.builtin.set_fact:
    gitlab_oidc: "{{ vault_secret_result }}"
  no_log: true

# The service mailbox (roles/mailbox → secret/{env}/mail/gitlab) is the ONE document for outbound
# SMTP and the Service Desk IMAP (SVC-11/SVC-16). Optional: on a first install the mailbox may
# not exist yet — then mail stays off until it does.
- name: "GitLab | Read the service mailbox document (SMTP + IMAP; optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_mail_vault_path }}"
    vault_secret_optional: true

- name: "GitLab | Adopt the mailbox creds (mail is on when the document names an SMTP host)"
  ansible.builtin.set_fact:
    gitlab_mail: "{{ vault_secret_result | default({}) }}"
    gitlab_smtp_configured: "{{ ((vault_secret_result | default({})).smtp_host | default('')) | length > 0 }}"
  no_log: true

# --- Persistent git storage must be the ZFS bind-mount BEFORE install ----------
- name: "GitLab | Verify git-data is a mountpoint (ZFS bind-mount)"
  ansible.builtin.command: "mountpoint -q {{ gitlab_git_data_dir }}"
  register: gitlab_gitdata_mp
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

- name: "GitLab | Fail if the git-data ZFS bind-mount is missing"
  ansible.builtin.fail:
    msg: >-
      {{ gitlab_git_data_dir }} is not a mountpoint. Run Play 1 (pve_zfs_mount) so
      git repositories land on tank/data/gitlab and survive `terraform destroy`.
  when: gitlab_gitdata_mp.rc != 0

# --- DR restore: put GitLab's OWN secrets back BEFORE the first reconfigure -----
# On a fresh install GitLab would generate NEW secret_key_base/db_key_base, which
# cannot decrypt the PRESERVED database (CI variables, 2FA, runner tokens, PATs are
# encrypted with these keys). The DB + git-data survive a destroy; the encryption
# keys live only in Vault. Restore them here so reconfigure adopts them and the
# rebuilt instance reconnects to its data cleanly. First-ever install: Vault path
# is absent → skip, GitLab generates fresh (captured back to Vault post-install).
# Only when the file is ABSENT (i.e. a fresh install / rebuild). On an existing
# install the file is present → skip, so a normal re-run never churns it.
- name: "GitLab | Check whether gitlab-secrets.json already exists"
  ansible.builtin.stat:
    path: /etc/gitlab/gitlab-secrets.json
  register: gitlab_secrets_local

- name: "GitLab | GitLab's own secrets from Vault (for DR restore; optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_secrets_vault_path }}"
    vault_secret_optional: true
  when: not gitlab_secrets_local.stat.exists

- name: "GitLab | Keep them for the restore"
  ansible.builtin.set_fact:
    gitlab_secrets_restore: "{{ vault_secret_result | default({}) }}"
  no_log: true
  when: not gitlab_secrets_local.stat.exists

- name: "GitLab | Restore /etc/gitlab/gitlab-secrets.json from Vault (before reconfigure)"
  ansible.builtin.copy:
    dest: /etc/gitlab/gitlab-secrets.json
    owner: root
    group: root
    mode: "0600"
    content: "{{ gitlab_secrets_restore.gitlab_secrets | to_nice_json }}"
  when:
    - not gitlab_secrets_local.stat.exists
    - gitlab_secrets_restore.gitlab_secrets | default({}) | length > 0
  no_log: true
  register: gitlab_secrets_restored

# Does GitLab connect to its own Redis database already? Read from the connection file the
# last reconfigure wrote (not gitlab.rb: a reconfigure that failed half-way is then taken up
# again by the next run). No = its keys still sit in the database it shared:
# tasks/redis_database.yml moves them, once. The file holds a credential: counted, never shown.
- name: "GitLab | Redis database of the live connection"
  ansible.builtin.command:
    argv: [grep, -c, "^  url: .*/{{ gitlab_redis_db }}$", "{{ gitlab_redis_live_file }}"]
  register: gitlab_redis_db_live
  changed_when: false
  failed_when: gitlab_redis_db_live.rc > 2
  check_mode: false   # read-only probe

- name: "GitLab | Render /etc/gitlab/gitlab.rb"
  ansible.builtin.template:
    src: gitlab.rb.j2
    dest: /etc/gitlab/gitlab.rb
    owner: root
    group: root
    mode: "0600"
  register: gitlab_rb_file

# --- The container ----------------------------------------------------------------
# The official Omnibus image runs the same GitLab: /etc/gitlab, /var/opt/gitlab (with the
# git-data ZFS bind-mount inside — Docker binds recursively) and /var/log/gitlab are mounted;
# its startup runs `gitlab-ctl reconfigure` with our gitlab.rb (loaded by the image's own).
# The switch-over: pull first (the gap is the start, not the pull), stop the package's
# runsvdir, re-own the data to the image's accounts when they differ, start, wait for ready.
- name: "GitLab | Is there an engine to talk to? (only a first-install dry-run has none)"
  ansible.builtin.set_fact:
    gitlab_engine_ready: "{{ not (ansible_check_mode and (docker_engine_install | default({})) is changed) }}"

- name: "GitLab | Pull the pinned image first"
  community.docker.docker_image:
    name: "{{ gitlab_image }}"
    source: pull
  when: gitlab_engine_ready | bool

- name: "GitLab | Does the container exist already? (a config change then reconfigures in place)"
  community.docker.docker_container_info:
    name: "{{ gitlab_container }}"
  register: gitlab_container_before
  when: gitlab_engine_ready | bool

- name: "GitLab | The scripts directory callers stage for gitlab-rails runner"
  ansible.builtin.file:
    path: "{{ gitlab_scripts_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "GitLab | The package's runsvdir stops (retired; it holds every GitLab port)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ gitlab_native }}"

# The image creates its accounts at build time (manage_accounts off): the data must belong
# to ITS git user. update-permissions is the image's own tool; it runs once, when the
# git-data owner is not the image's git — on the switch from the package, or after a restore.
- name: "GitLab | The image's git uid"
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, none, --entrypoint, id, "{{ gitlab_image }}", -u, git]
  register: gitlab_image_git_uid
  changed_when: false
  check_mode: false   # read-only
  when: gitlab_engine_ready | bool

- name: "GitLab | The git-data owner"
  ansible.builtin.stat:
    path: "{{ gitlab_git_data_dir }}"
  register: gitlab_gitdata_stat

- name: "GitLab | Re-own the data to the image's accounts (update-permissions, once)"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --network
      - none
      - -v
      - /etc/gitlab:/etc/gitlab
      - -v
      - /var/opt/gitlab:/var/opt/gitlab
      - -v
      - /var/log/gitlab:/var/log/gitlab
      - --entrypoint
      - update-permissions
      - "{{ gitlab_image }}"
  changed_when: true
  when:
    - gitlab_engine_ready | bool
    - not ansible_check_mode
    - gitlab_gitdata_stat.stat.uid | default(-1) | string != gitlab_image_git_uid.stdout | default('') | trim

- name: "GitLab | The container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: gitlab_engine_ready | bool
  vars:
    service_scaffold_def:
      name: gitlab
      containers:
        - name: "{{ gitlab_container }}"
          image: "{{ gitlab_image }}"
          network_mode: host
          env: "{{ gitlab_container_env }}"
          shm_size: "{{ gitlab_shm_size }}"
          log_driver: journald   # the container's own stdout -> journal -> promtail (INF-27); GitLab's logs are files, shipped by promtail file jobs
          volumes:
            - /etc/gitlab:/etc/gitlab
            - /var/opt/gitlab:/var/opt/gitlab
            - /var/log/gitlab:/var/log/gitlab
            - "{{ gitlab_scripts_dir }}:{{ gitlab_scripts_dir }}:ro"
            - /etc/ssl/certs:/etc/ssl/certs:ro   # the host's trust store: PG verify-full names its bundle

- name: "GitLab | Its keys move to its own Redis database (once)"
  ansible.builtin.include_tasks: redis_database.yml
  when:
    - not ansible_check_mode
    - gitlab_container_before.exists | default(false)
    - (gitlab_container_before.container.State.Running | default(false))
    - gitlab_redis_db_live.rc == 1          # the file exists and does not name the database yet

# A running container takes a config change with a reconfigure in place (no restart); a
# container started just now reconfigured at its own start.
- name: "GitLab | Reconfigure in the running container (config changed)"
  ansible.builtin.command:
    argv: "{{ gitlab_exec + [gitlab_container, 'gitlab-ctl', 'reconfigure'] }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - gitlab_container_before.exists | default(false)
    - (gitlab_container_before.container.State.Running | default(false))
    - gitlab_rb_file is changed or gitlab_secrets_restored is changed or gitlab_redis_moved is defined

- name: "GitLab | Start its processes (stopped for the move of its keys)"
  ansible.builtin.command:
    argv: "{{ gitlab_exec + [gitlab_container, 'gitlab-ctl', 'start'] }}"
  changed_when: true
  when: gitlab_redis_moved is defined

# --- Verify the daemon is actually healthy (API 'ok' != running; read status) --
# The first start of the container runs the whole reconfigure: give it minutes.
- name: "GitLab | Wait for the web endpoint to answer"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ gitlab_http_backend_port }}/-/readiness"
    status_code: [200, 401]
    validate_certs: false
  register: gitlab_ready
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  retries: 60
  delay: 15
  until: gitlab_ready.status in [200, 401]

- name: "GitLab | gitlab-ctl status"
  ansible.builtin.command:
    argv: "{{ gitlab_exec + [gitlab_container, 'gitlab-ctl', 'status'] }}"
  register: gitlab_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  when: gitlab_engine_ready | bool
  failed_when:
    - gitlab_status.rc != 0
    # a dry-run of the switch-over: the container it would create does not exist yet
    - not (ansible_check_mode and 'No such container' in (gitlab_status.stderr | default('')))

- name: "GitLab | Assert no service is down"
  ansible.builtin.assert:
    that: "'down:' not in (gitlab_status.stdout | default(''))"
    fail_msg: "A GitLab service is down:\n{{ gitlab_status.stdout | default('') }}"
    success_msg: "All GitLab services up."
  when: gitlab_engine_ready | bool

# update-permissions re-owns the data, not the log files the package's accounts left: a
# service that appends to one gets EACCES and flaps (mailroom → mail_room_json.log, the
# switch-over on 2026-10-01). The container's reconfigure owns every log directory to its
# service's account: a file owned by ANOTHER non-root account follows its directory.
# Root-owned files (svlogd's current/rotations, nginx, reconfigure) are left alone, so a
# re-run finds nothing to do.
- name: "GitLab | Log directories and their owners"
  ansible.builtin.find:
    paths: /var/log/gitlab
    file_type: directory
    recurse: false
  register: gitlab_log_dirs

- name: "GitLab | Log files and their owners"
  ansible.builtin.find:
    paths: /var/log/gitlab
    file_type: file
    recurse: true
    hidden: true
  register: gitlab_log_files

- name: "GitLab | Which directory belongs to whom"
  ansible.builtin.set_fact:
    gitlab_log_dir_owner: >-
      {{ dict(gitlab_log_dirs.files | map(attribute='path')
              | zip(gitlab_log_dirs.files | map(attribute='uid')
                    | zip(gitlab_log_dirs.files | map(attribute='gid')))) }}

- name: "GitLab | A log file the package's account left follows its directory's owner"
  ansible.builtin.file:
    path: "{{ item.path }}"
    owner: "{{ gitlab_log_dir_owner[item.path | dirname][0] }}"
    group: "{{ gitlab_log_dir_owner[item.path | dirname][1] }}"
  loop: >-
    {{ gitlab_log_files.files | rejectattr('uid', 'equalto', 0)
       | selectattr('path', 'regex', '^/var/log/gitlab/[^/]+/[^/]+$') | list }}
  loop_control:
    label: "{{ item.path }}"
  when:
    - gitlab_log_dir_owner[item.path | dirname][0] != 0
    - item.uid != gitlab_log_dir_owner[item.path | dirname][0]

- name: "GitLab | The package install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ gitlab_native }}"

# --- Capture GitLab's OWN generated secrets → Vault (DR-critical, no local file) -
# gitlab-secrets.json holds secret_key_base / db_key_base / otp_key_base: a backup
# restored WITHOUT it cannot decrypt 2FA/CI tokens. Written straight to Vault
# (fabric/gitlab-secrets) via stdin — never lands on the controller disk.
- name: "GitLab | Slurp GitLab-generated secrets (DR-critical)"
  ansible.builtin.slurp:
    src: /etc/gitlab/gitlab-secrets.json
  register: gitlab_secrets_raw
  no_log: true
  tags: [gitlab, gitlab-dr]

- name: "GitLab | Slurp initial root password (exists ~24h post-install)"
  ansible.builtin.slurp:
    src: /etc/gitlab/initial_root_password
  register: gitlab_initial_root_raw
  failed_when: false
  no_log: true
  tags: [gitlab, gitlab-dr]

# One optional read of the whole stored document: a kv put replaces the WHOLE
# document, and GitLab deletes /etc/gitlab/initial_root_password ~24h after install,
# so a field that can no longer be re-read locally must be carried over (#572).
- name: "GitLab | The currently stored DR document (roles/vault_secret, optional)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [gitlab, gitlab-dr]
  vars:
    vault_secret_path: "{{ gitlab_secrets_vault_path }}"
    vault_secret_optional: true
  tags: [gitlab, gitlab-dr]

- name: "GitLab | Desired DR document (the live secrets + whichever root password still exists)"
  ansible.builtin.set_fact:
    gitlab_vault_stored: "{{ vault_secret_result | default({}) }}"
    gitlab_dr_desired:
      gitlab_secrets: "{{ gitlab_secrets_raw.content | b64decode | from_json }}"
      initial_root_password_file: >-
        {{ (gitlab_initial_root_raw.content | default('') | b64decode)
           if ((gitlab_initial_root_raw.content | default('') | b64decode) | length > 0)
           else (vault_secret_result.initial_root_password_file | default('')) }}
  no_log: true
  tags: [gitlab, gitlab-dr]

- name: "GitLab | Write GitLab-generated secrets to Vault ({{ gitlab_secrets_vault_path }}) — only when they differ"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [gitlab, gitlab-dr]
  vars:
    vault_secret_path: "{{ gitlab_secrets_vault_path }}"
    vault_secret_init: "{{ gitlab_dr_desired }}"
    vault_secret_force_fields: "{{ gitlab_dr_desired }}"
  when: (gitlab_vault_stored | to_json(sort_keys=true)) != (gitlab_dr_desired | to_json(sort_keys=true))
  tags: [gitlab, gitlab-dr]

# --- Nightly backup → SeaweedFS gitlab-backups (pure gitlab command, no .sh) ---
- name: "GitLab | The root crontab backup line (retired: a host_job timer now)"
  ansible.builtin.cron:
    name: "gitlab-backup-to-s3"
    user: root
    state: absent

- name: "GitLab | Nightly backup to S3 (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: gitlab-backup
    host_job_description: "GitLab backup to S3 (gitlab-backups bucket; GitLab prunes)"
    host_job_exec:
      - "/usr/bin/docker exec {{ gitlab_container }} gitlab-backup create CRON=1"
    host_job_on_calendar: "{{ gitlab_backup_on_calendar }}"
    host_job_timeout: 2h
  when: gitlab_backup_enabled

- name: "GitLab | Host firewall rules for the native listeners (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ gitlab_firewall_rules }}"
  tags: [gitlab, firewall]
