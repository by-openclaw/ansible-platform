# ==============================================================================
# GitLab CI npm template — every pipeline uses the platform registry (Verdaccio,
# npm.<domain>): scoped packages are served from it, everything else is proxied
# and cached from npmjs. Credentials are INSTANCE-level CI variables set by
# Ansible (playbooks/verdaccio-gitlab-ci.yml): NPM_CONFIG_REGISTRY + NPM_TOKEN
# (masked, the svc account's registry token — Verdaccio 7 refuses Basic auth on package
# requests). No per-project secrets.
#
# Consume from a project's .gitlab-ci.yml:
#   include:
#     - project: 'platform/infra/ci-templates'
#       file: '/npm.gitlab-ci.yml'
#   build:
#     extends: .npm-registry
#     script: [npm ci, npm test]
# ==============================================================================

.npm-registry:
  image: "node:22.12.0-alpine"
  before_script:
    - test -n "$NPM_CONFIG_REGISTRY" || { echo "NPM_CONFIG_REGISTRY missing (instance CI variable)"; exit 1; }
    - REG_HOST="$(echo "$NPM_CONFIG_REGISTRY" | sed -E 's#^https?://##; s#/.*$##')"
    - test -n "$NPM_TOKEN" || { echo "NPM_TOKEN missing (instance CI variable)"; exit 1; }
    - printf 'registry=%s\n//%s/:_authToken=%s\n' "$NPM_CONFIG_REGISTRY" "$REG_HOST" "$NPM_TOKEN" > "$HOME/.npmrc"
    - npm config get registry

# Smoke job — proves the runner reaches the registry and the token authenticates.
npm-registry-check:
  extends: .npm-registry
  stage: test
  script:
    - npm ping
    - npm whoami
    - npm view is-number version
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
