# ==============================================================================
# GitLab CI security-scan template — SAST + SBOM + filesystem vuln scan for any
# project. The OSS answer to what GitLab CE lacks (SAST/dependency scanning are
# Ultimate-only). Container image scanning already happens in Harbor (Trivy).
#
# Consume from a project's .gitlab-ci.yml:
#   include:
#     - project: 'infra/ci-templates'                 # or copy verbatim
#       file: '/security-scan.gitlab-ci.yml'
#
# All jobs are non-blocking by default (allow_failure) so they inform without
# gating; flip allow_failure: false per job to enforce once a repo is clean.
# Pinned tool images — never :latest.
# ==============================================================================

stages:
  - security

# --- SAST: Semgrep (source patterns / insecure code) --------------------------
sast_semgrep:
  stage: security
  image: "semgrep/semgrep:1.90.0"
  script:
    - semgrep scan --config auto --error --sarif --output semgrep.sarif || true
    - semgrep scan --config auto --json --output semgrep.json .
  allow_failure: true
  artifacts:
    when: always
    paths: ["semgrep.sarif", "semgrep.json"]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# --- SBOM: Syft (software bill of materials, CycloneDX) ------------------------
sbom_trivy:
  # SBOM (CycloneDX) from Trivy — the syft image has no shell, so a GitLab job cannot
  # execute in it (runc "unable to start container process", 2026-09-19); one scanner
  # does vulnerabilities, secrets, misconfigurations AND the SBOM.
  stage: security
  image:
    name: "aquasec/trivy:0.74.0"
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths: [".trivycache/"]
  script:
    - trivy fs --format cyclonedx --output sbom.cdx.json .
    - trivy sbom --severity HIGH,CRITICAL --exit-code 0 --format table sbom.cdx.json
  allow_failure: true
  artifacts:
    when: always
    paths: ["sbom.cdx.json"]
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

trivy_fs:
  stage: security
  image:
    name: "aquasec/trivy:0.74.0"
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths: [".trivycache/"]
  script:
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 --format table .
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --format json --output trivy.json .
  allow_failure: true
  artifacts:
    when: always
    paths: ["trivy.json"]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
