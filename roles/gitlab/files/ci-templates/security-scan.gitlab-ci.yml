# ==============================================================================
# GitLab CI security-scan template — SAST + SBOM + filesystem vuln scan for any
# project. The OSS answer to what GitLab CE lacks (SAST/dependency scanning are
# Ultimate-only). Container image scanning already happens in Harbor (Trivy).
#
# Consume from a project's .gitlab-ci.yml:
#   include:
#     - project: 'infra/ci-templates'                 # or copy verbatim
#       file: '/security-scan.gitlab-ci.yml'
#
# trivy_fs is THE gate (security/0003 §4: zero Critical + zero High on every MR and on
# main; vuln + secret + misconfig). Suppressions live in the project's `.trivyignore.yaml`
# (Trivy's structured ignore file): every entry carries `statement:` (why) and
# `expired_at:` (date) — an expired entry re-fails the gate by itself (§4). The SAST and
# SBOM jobs inform (allow_failure) — the ADR gates on vulnerabilities, not on patterns.
# Pinned tool images — never :latest.
# ==============================================================================

stages:
  - security

# --- SAST: Semgrep (source patterns / insecure code) --------------------------
sast_semgrep:
  stage: security
  image: "semgrep/semgrep:1.90.0"
  script:
    - semgrep scan --config auto --error --sarif --output semgrep.sarif || true
    - semgrep scan --config auto --json --output semgrep.json .
  allow_failure: true
  artifacts:
    when: always
    paths: ["semgrep.sarif", "semgrep.json"]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

# --- SBOM: Syft (software bill of materials, CycloneDX) ------------------------
sbom_trivy:
  # SBOM (CycloneDX) from Trivy — the syft image has no shell, so a GitLab job cannot
  # execute in it (runc "unable to start container process", 2026-09-19); one scanner
  # does vulnerabilities, secrets, misconfigurations AND the SBOM.
  stage: security
  image:
    name: "aquasec/trivy:0.74.0"
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths: [".trivycache/"]
  script:
    - trivy fs --format cyclonedx --output sbom.cdx.json .
    - trivy sbom --severity HIGH,CRITICAL --exit-code 0 --format table sbom.cdx.json
  allow_failure: true
  artifacts:
    when: always
    paths: ["sbom.cdx.json"]
    expire_in: 90 days
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG'

trivy_fs:
  stage: security
  image:
    name: "aquasec/trivy:0.74.0"
    entrypoint: [""]
  variables:
    TRIVY_NO_PROGRESS: "true"
    TRIVY_CACHE_DIR: ".trivycache/"
  cache:
    paths: [".trivycache/"]
  script:
    # Suppressions only from the structured file (statement + expired_at per entry); the flag is
    # fatal when the file is missing, so it is passed only when the project ships one.
    - 'IGNORE=""; [ -f .trivyignore.yaml ] && IGNORE="--ignorefile .trivyignore.yaml"'
    # Evidence first (always archived), then the gate: a non-zero exit fails the pipeline.
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 0 $IGNORE --format json --output trivy.json .
    - trivy fs --scanners vuln,secret,misconfig --severity HIGH,CRITICAL --exit-code 1 $IGNORE --format table .
  allow_failure: false
  artifacts:
    when: always
    paths: ["trivy.json"]
    expire_in: 30 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
