---
# ==============================================================================
# Role: jumpserver — self-contained JumpServer CE bastion/PAM (Docker-in-LXC).
#
# Break-glass tool: runs its OWN bundled Postgres + Redis (NOT the shared
# cluster) so it still grants access if the cluster is down. Non-privileged
# multi-container compose (privileged containers are unsafe nested in an
# unprivileged LXC). All secrets are Vault-native (fabric/app-jumpserver +
# fabric/app-oidc-jumpserver); the on-host .env (0600) is rendered from Vault,
# same pattern as gitlab.rb — no repo/controller secret files.
#
#   ansible-playbook -i inventories/prod/hosts.yml playbooks/jumpserver.yml
# ==============================================================================

# --- Pinned images (never :latest) — installer GA tag v4.10.19 --------------
jumpserver_version: "v4.10.19-ce"
jumpserver_image_core: "jumpserver/core:{{ jumpserver_version }}"
jumpserver_image_koko: "jumpserver/koko:{{ jumpserver_version }}"
jumpserver_image_lion: "jumpserver/lion:{{ jumpserver_version }}"
jumpserver_image_web: "jumpserver/web:{{ jumpserver_version }}"
jumpserver_image_postgres: "postgres:16"
jumpserver_image_redis: "redis:7-alpine"

# --- Layout on the LXC ------------------------------------------------------
# Root-owned components (core/koko/lion/nginx) use host BIND MOUNTS (container
# root = LXC root, works fine). Postgres + Redis run as uid 999 inside their
# containers: in an UNPRIVILEGED LXC a host bind mount hits the userns uid-remap
# mismatch (server can't reopen its own files -> "Permission denied"), so they
# use DOCKER NAMED VOLUMES, which docker uid-maps consistently within the LXC.
jumpserver_base_dir: "/opt/jumpserver"
jumpserver_compose_dir: "{{ jumpserver_base_dir }}"          # compose + .env live here
jumpserver_data_dir: "{{ jumpserver_base_dir }}/core"        # app data + session recordings
jumpserver_pgdata_volume: "jumpserver_pgdata"                # bundled Postgres (named volume)
jumpserver_redisdata_volume: "jumpserver_redisdata"          # bundled Redis (named volume)
jumpserver_docker_network: "jumpserver-net"

# --- Web front — browser-only; only this port is published + proxied ---------
jumpserver_web_host_port: 8090                                # host:8090 -> web container:80
jumpserver_fqdn: "jumpserver.by-research.be"
jumpserver_base_site_url: "https://{{ jumpserver_fqdn }}"     # OIDC redirect base (BASE_SITE_URL)
jumpserver_domains: "{{ jumpserver_fqdn }}"                   # DOMAINS allow-list

# --- Bundled DB / Redis (self-contained; compose-internal only) --------------
jumpserver_db_name: "jumpserver"
jumpserver_db_user: "jumpserver"
jumpserver_db_engine: "postgresql"

# --- Vault-native secrets (get-or-create; minted here on first run) ----------
# fabric/app-jumpserver: secret_key(>=50 alnum), bootstrap_token(>=24 alnum),
# db_password, redis_password. no special chars (JumpServer rule) + no quotes.
jumpserver_vault_path: "fabric/app-jumpserver"

# --- OIDC (Authentik) — client creds minted by the authentik role into Vault -
# JumpServer's OIDC backend does not auto-discover Authentik, so feed the explicit
# endpoints. In Authentik authorize/token/userinfo are GLOBAL; issuer + jwks +
# end-session are per-application (slug `jumpserver`).
jumpserver_oidc_enabled: false                               # flip true in group_vars to enable
jumpserver_oidc_vault_path: "fabric/app-oidc-jumpserver"
jumpserver_authentik_base: "https://authentik.by-research.be"
jumpserver_oidc_provider_endpoint: "{{ jumpserver_authentik_base }}/application/o/jumpserver/"
jumpserver_oidc_authorization_endpoint: "{{ jumpserver_authentik_base }}/application/o/authorize/"
jumpserver_oidc_token_endpoint: "{{ jumpserver_authentik_base }}/application/o/token/"
jumpserver_oidc_jwks_endpoint: "{{ jumpserver_authentik_base }}/application/o/jumpserver/jwks/"
jumpserver_oidc_userinfo_endpoint: "{{ jumpserver_authentik_base }}/application/o/userinfo/"
jumpserver_oidc_end_session_endpoint: "{{ jumpserver_authentik_base }}/application/o/jumpserver/end-session/"

# --- Locale / misc -----------------------------------------------------------
jumpserver_tz: "Europe/Brussels"
jumpserver_log_level: "ERROR"

# --- RBAC / assets reconcile (idempotent Django reconcile; like gitlab_rbac) --
# adm_yboujraf = System Admin (reaches all) + member of the bastion-admins group.
# Regular users get NO grant here (least-privilege; added per-need later).
jumpserver_reconcile_enabled: true
jumpserver_bastion_admin:
  username: adm_yboujraf
  name: "adm_yboujraf"
  email: "adm_yboujraf@by-research.be"
jumpserver_bastion_group: "bastion-admins"
jumpserver_permission_name: "bastion-admins-all"
jumpserver_s3_storage_name: "seaweedfs"
jumpserver_s3_vault_path: "fabric/infra-seaweedfs-jumpserver"
jumpserver_s3_bucket: "jumpserver-replays"

# JumpServer dynamic feature settings reconciled into the DB (idempotent).
# ANSIBLE_DOCKER_ENABLED=false -> asset connectivity/account tasks run inside the
# celery container (we don't mount docker.sock, so the per-task ansible-executor
# Docker container can't spawn — the default would fail every connectivity test).
jumpserver_settings:
  ANSIBLE_DOCKER_ENABLED: false

# The single automation key JumpServer vaults as each asset's account (encrypted
# in JumpServer's own store — the "one credential, root on all" pattern).
jumpserver_rune_key_path: "~/.ssh/id_ed25519_rune_nopass"

# Assets to register (SSH). SVC (10.1.3.x) are same-subnet as the bastion →
# reachable now; DMZ (10.1.2.x) needs the SVC→DMZ FW rule (Phase 4). LXCs log in
# as root (privileged); VMs as by-systems (sudo). OOB proxmox + OPNsense are
# special (different key/port / API-only) → added later.
jumpserver_assets:
  # --- SVC LXCs (root) ---
  - { name: lxc-vault-01, address: 10.1.3.150, node: SVC, account: root, privileged: true }
  - { name: lxc-pgsql-01, address: 10.1.3.110, node: SVC, account: root, privileged: true }
  - { name: lxc-redis-01, address: 10.1.3.117, node: SVC, account: root, privileged: true }
  - { name: lxc-seaweedfs-01, address: 10.1.3.200, node: SVC, account: root, privileged: true }
  - { name: lxc-authentik-01, address: 10.1.3.130, node: SVC, account: root, privileged: true }
  - { name: lxc-crowdsec-01, address: 10.1.3.190, node: SVC, account: root, privileged: true }
  - { name: lxc-diagrams-01, address: 10.1.3.220, node: SVC, account: root, privileged: true }
  - { name: lxc-gitlab-01, address: 10.1.3.210, node: SVC, account: root, privileged: true }
  - { name: lxc-nbox-01, address: 10.1.3.120, node: SVC, account: root, privileged: true }
  - { name: lxc-netbird-01, address: 10.1.3.181, node: SVC, account: root, privileged: true }
  - { name: lxc-nextcloud-01, address: 10.1.3.170, node: SVC, account: root, privileged: true }
  - { name: lxc-pgadmin-01, address: 10.1.3.140, node: SVC, account: root, privileged: true }
  - { name: lxc-vaultwarden-01, address: 10.1.3.160, node: SVC, account: root, privileged: true }
  # --- SVC VMs (by-systems + sudo) ---
  - { name: vm-adguard-01, address: 10.1.3.101, node: SVC, account: by-systems, privileged: false }
  - { name: vm-gitlab-runner-01, address: 10.1.3.211, node: SVC, account: by-systems, privileged: false }
  # --- DMZ (needs SVC→DMZ FW rule, Phase 4) ---
  - { name: lxc-traefik-01, address: 10.1.2.110, node: DMZ, account: root, privileged: true }
  - { name: vm-mailcow-01, address: 10.1.2.120, node: DMZ, account: by-systems, privileged: false }
