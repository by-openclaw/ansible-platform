---
# ==============================================================================
# jumpserver | what the bastion must hold, through its own API (session: api_session.yml).
#   the built-in administrator's password · the owner's account and the administrators group ·
#   the tree and every inventory host · one account per host (the break-glass key) · the
#   permission · the replay storage · the email settings · and the bastion's own login test.
# Each part reads what the bastion has, compares, and writes only what differs; a dry run reads
# and compares. Secrets come from Vault and travel in request bodies only (not logged).
# ==============================================================================
- name: "JumpServer reconcile | Nothing changed yet"
  ansible.builtin.set_fact:
    jumpserver_changes: []

- name: "JumpServer reconcile | Read replay S3 creds from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_s3_vault_path }}"
    vault_secret_init: {}          # read-only: minted by seaweedfs_bucket

- name: "JumpServer reconcile | Bind S3 creds"
  ansible.builtin.set_fact:
    jumpserver_s3_creds: "{{ vault_secret_result }}"
  no_log: true

# Email is OPTIONAL: read the mailcow SMTP mailbox creds if provisioned; else
# email notifications stay off (fresh builds without the mailbox don't break).
- name: "JumpServer reconcile | Read the service mailbox document (SMTP; optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_mail_vault_path }}"
    vault_secret_optional: true

- name: "JumpServer reconcile | Bind the mailbox creds (no_log)"
  ansible.builtin.set_fact:
    jumpserver_mail: "{{ vault_secret_result | default({}) }}"
  no_log: true

# The four values the email settings need, from the ONE mailbox document (address = the SMTP
# user). {} when the mailbox is not minted yet → email stays off.
- name: "JumpServer reconcile | Build email config ({} when no mailbox)"
  ansible.builtin.set_fact:
    jumpserver_email_cfg: >-
      {{ dict(['smtp_host', 'smtp_port', 'smtp_user', 'smtp_password']
              | zip([jumpserver_mail.smtp_host, jumpserver_mail.smtp_port, jumpserver_mail.address, jumpserver_mail.password]))
         if (jumpserver_mail.smtp_host | default('')) | length > 0 else {} }}
  no_log: true

- name: "JumpServer reconcile | Read the break-glass SSH key from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_asset_key_vault_path }}"

- name: "JumpServer reconcile | Keep the key material (no_log)"
  ansible.builtin.set_fact:
    jumpserver_asset_key_b64: "{{ vault_secret_result.private_b64 }}"
    jumpserver_asset_key_public: "{{ vault_secret_result.public }}"
  no_log: true

- name: "JumpServer reconcile | Read the key passphrase from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_asset_key_passphrase_vault_path }}"

- name: "JumpServer reconcile | Keep the passphrase (no_log)"
  ansible.builtin.set_fact:
    jumpserver_asset_key_passphrase: "{{ vault_secret_result.passphrase }}"  # pragma: allowlist secret
  no_log: true

- name: "JumpServer reconcile | The built-in administrator"
  ansible.builtin.import_tasks: api_builtin_admin.yml

- name: "JumpServer reconcile | The owner's account and the administrators group"
  ansible.builtin.import_tasks: api_people.yml

- name: "JumpServer reconcile | The tree and the hosts"
  ansible.builtin.import_tasks: api_assets.yml

- name: "JumpServer reconcile | The accounts"
  ansible.builtin.import_tasks: api_accounts.yml

- name: "JumpServer reconcile | The permission"
  ansible.builtin.import_tasks: api_permission.yml

- name: "JumpServer reconcile | The replay storage"
  ansible.builtin.import_tasks: api_storage.yml

- name: "JumpServer reconcile | The email settings"
  ansible.builtin.import_tasks: api_email.yml

- name: "JumpServer reconcile | The bastion's own login test"
  ansible.builtin.import_tasks: api_verify.yml

# What the program this replaced staged on the host (until 2026-10-09).
- name: "JumpServer reconcile | What earlier versions staged on the host"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: "{{ jumpserver_reconcile_retired_host_files }}"

- name: "JumpServer reconcile | Summary"
  ansible.builtin.debug:
    msg: "{{ jumpserver_changes + ['RECONCILE_DONE changes=' ~ (jumpserver_changes | length) ~ ' · assets ' ~ (jumpserver_assets | length)] }}"
