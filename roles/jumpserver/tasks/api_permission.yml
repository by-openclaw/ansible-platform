---
# The bastion's asset permissions, declared: the administrators' (every node, every asset,
# every account) and the users' (the Windows assets' <org>-user session only), each
# reconciled by tasks/api_permission_one.yml.
- name: "JumpServer permission | As the bastion has them"
  ansible.builtin.uri:
    url: "{{ jumpserver_api_url }}/perms/asset-permissions/?limit={{ jumpserver_api_page_size }}"
    headers: "{{ jumpserver_api_headers }}"
  register: jumpserver_perms_read
  check_mode: false   # read-only

- name: "JumpServer permission | What each must hold"
  ansible.builtin.set_fact:
    jumpserver_permissions:
      - name: "{{ jumpserver_permission_name }}"
        group_id: "{{ jumpserver_group_id }}"
        accounts: "{{ jumpserver_permission_accounts }}"
        node_ids: "{{ jumpserver_assets | map(attribute='node') | unique | map('extract', jumpserver_node_ids) | list }}"
        asset_ids: "{{ jumpserver_host_ids.values() | list }}"
      - name: "{{ jumpserver_users_permission_name }}"
        group_id: "{{ jumpserver_users_group_id | default('') }}"
        accounts: "{{ jumpserver_users_permission_accounts }}"
        node_ids: "{{ jumpserver_assets | selectattr('platform', 'defined') | selectattr('platform', 'equalto', 'Windows') | map(attribute='node') | unique | map('extract', jumpserver_node_ids) | list }}"
        asset_ids: "{{ jumpserver_assets | selectattr('platform', 'defined') | selectattr('platform', 'equalto', 'Windows') | map(attribute='name') | map('extract', jumpserver_host_ids) | list }}"

- name: "JumpServer permission | Each one"
  ansible.builtin.include_tasks: api_permission_one.yml
  loop: "{{ jumpserver_permissions | selectattr('asset_ids', 'defined') | rejectattr('asset_ids', 'equalto', []) | list }}"
  loop_control:
    loop_var: jumpserver_perm
    label: "{{ jumpserver_perm.name }}"
