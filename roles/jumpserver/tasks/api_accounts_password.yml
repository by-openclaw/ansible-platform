---
# One tier's break-glass OS password, with its Vault KV version as the account mark.
- name: "JumpServer accounts | Vault {{ jumpserver_tier }}/break-glass/os"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_windows_password_vault_path % jumpserver_tier }}"
    vault_secret_read_metadata: true

- name: "JumpServer accounts | Keep it for the plan ({{ jumpserver_tier }})"
  ansible.builtin.set_fact:
    jumpserver_passwords: "{{ jumpserver_passwords | default({}) | combine({jumpserver_tier: vault_secret_result.password}) }}"
    jumpserver_password_marks: "{{ jumpserver_password_marks | default({}) | combine({jumpserver_tier: 'pw kv v' ~ vault_secret_metadata.current_version}) }}"
  no_log: true
