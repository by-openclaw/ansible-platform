---
# One password account's Vault doc, with its KV version as the account's mark.
- name: "JumpServer accounts | Vault {{ jumpserver_pw_path }}"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jumpserver_pw_path }}"
    vault_secret_read_metadata: true

- name: "JumpServer accounts | Keep it for the plan ({{ jumpserver_pw_path }})"
  ansible.builtin.set_fact:
    jumpserver_passwords: "{{ jumpserver_passwords | default({}) | combine({jumpserver_pw_path: vault_secret_result.password}) }}"
    jumpserver_password_marks: "{{ jumpserver_password_marks | default({}) | combine({jumpserver_pw_path: 'pw kv v' ~ vault_secret_metadata.current_version}) }}"
  no_log: true
