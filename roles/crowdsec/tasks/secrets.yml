---
# Generate bouncer API keys on the LAPI and keep them in Vault (consumed by the
# OPNsense firewall bouncer + the Traefik bouncer). A bouncer key can't be re-read
# from cscli, so one is created only when Vault has none — idempotent and
# non-destructive.
- name: "secrets | Bouncer keys (one per bouncer)"
  ansible.builtin.include_tasks: bouncer.yml
  loop: "{{ crowdsec_bouncers }}"
  loop_control:
    loop_var: crowdsec_bouncer
    label: "{{ crowdsec_bouncer.name }}"

- name: "secrets | Report engine status"
  ansible.builtin.command: cscli lapi status
  changed_when: false
  register: crowdsec_lapi_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)

- name: "secrets | LAPI status"
  ansible.builtin.debug:
    msg: "{{ crowdsec_lapi_status.stdout_lines | select('match', '.*(successfully|reachable|You can).*') | list }}"
