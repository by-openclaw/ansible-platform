---
# Bouncer keys: Vault holds each key (get-or-create), the LAPI knows each bouncer under it
# (consumed by the OPNsense firewall bouncer + the Traefik plugin). Vault first: a rebuilt
# LAPI registers every bouncer again with the key it already holds — no re-key.
- name: "secrets | Bouncers the LAPI knows"
  ansible.builtin.command:
    argv: "{{ crowdsec_cscli + ['bouncers', 'list', '-o', 'json'] }}"
  register: crowdsec_bouncers_known
  changed_when: false
  check_mode: false  # read-only probe: must run under --check too (the loop below reads it)
  when: crowdsec_engine_ready | bool   # a first-install dry-run has no engine to ask
  failed_when:
    - crowdsec_bouncers_known.rc != 0
    # a dry-run of the switch-over: the container it would create does not exist yet
    - not (ansible_check_mode and 'No such container' in (crowdsec_bouncers_known.stderr | default('')))

- name: "secrets | Their names"
  ansible.builtin.set_fact:
    crowdsec_bouncer_names: >-
      {{ ((crowdsec_bouncers_known.stdout | default('', true) | trim or '[]') | from_json | default([], true))
         | map(attribute='name') | list }}

- name: "secrets | Bouncer keys (one per bouncer)"
  ansible.builtin.include_tasks: bouncer.yml
  loop: "{{ crowdsec_bouncers }}"
  loop_control:
    loop_var: crowdsec_bouncer
    label: "{{ crowdsec_bouncer.name }}"

- name: "secrets | Report engine status"
  ansible.builtin.command:
    argv: "{{ crowdsec_cscli + ['lapi', 'status'] }}"
  changed_when: false
  register: crowdsec_lapi_status
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  when: crowdsec_engine_ready | bool
  failed_when:
    - crowdsec_lapi_status.rc != 0
    - not (ansible_check_mode and 'No such container' in (crowdsec_lapi_status.stderr | default('')))

- name: "secrets | LAPI status"
  ansible.builtin.debug:
    msg: "{{ _lines | select('match', '.*(successfully|reachable|You can).*') | list }}"
  vars:
    _lines: "{{ (crowdsec_lapi_status.stdout_lines | default([])) + (crowdsec_lapi_status.stderr_lines | default([])) }}"
