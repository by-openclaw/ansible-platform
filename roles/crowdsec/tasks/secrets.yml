---
# Generate bouncer API keys on the LAPI and persist them to the controller secret
# store (consumed by the OPNsense firewall bouncer + the Traefik bouncer later).
# Stat-gated: a bouncer key can't be re-read from cscli, so we only create when
# the secret file is absent (first run), keeping it idempotent + non-destructive.

- name: "secrets | Stat existing bouncer secrets on the controller"
  ansible.builtin.stat:
    path: "{{ crowdsec_secret_dir }}/{{ item.secret_file }}"
  delegate_to: localhost
  become: false
  loop: "{{ crowdsec_bouncers }}"
  loop_control: { label: "{{ item.name }}" }
  register: crowdsec_bouncer_stat

- name: "secrets | Add the bouncer + capture its API key"
  ansible.builtin.command: "cscli bouncers add {{ item.item.name }} -o raw"
  loop: "{{ crowdsec_bouncer_stat.results }}"
  loop_control: { label: "{{ item.item.name }}" }
  when: not item.stat.exists
  register: crowdsec_bouncer_add
  changed_when: true
  no_log: true

- name: "secrets | Persist new bouncer keys (0600, controller)"
  ansible.builtin.copy:
    dest: "{{ crowdsec_secret_dir }}/{{ item.item.item.secret_file }}"
    mode: "0600"
    content: >-
      {{ {'fields': {
        'api_key': item.stdout | trim,
        'lapi_url': 'http://' + crowdsec_lapi_host + ':' + (crowdsec_lapi_port | string),
        'bouncer': item.item.item.name
      }} | to_nice_json }}
  delegate_to: localhost
  become: false
  loop: "{{ crowdsec_bouncer_add.results }}"
  loop_control: { label: "{{ item.item.item.name | default('skipped') }}" }
  when: item.stdout is defined and (item.stdout | trim | length) > 0
  no_log: true

- name: "secrets | Report engine status"
  ansible.builtin.command: cscli lapi status
  changed_when: false
  register: crowdsec_lapi_status

- name: "secrets | LAPI status"
  ansible.builtin.debug:
    msg: "{{ crowdsec_lapi_status.stdout_lines | select('match', '.*(successfully|reachable|You can).*') | list }}"
