---
# Make the LAPI central (listen on the LAN, not just loopback) + wire AppSec.

- name: "config | LAPI listens on the LAN (not 127.0.0.1) so agents/bouncers reach it"
  ansible.builtin.replace:
    path: /etc/crowdsec/config.yaml
    # default is `listen_uri: 127.0.0.1:8080`; only the LAPI uses that pair.
    regexp: '(listen_uri:\s*)127\.0\.0\.1:8080'
    replace: '\g<1>{{ crowdsec_lapi_listen_uri }}'
  notify: Restart crowdsec

# Documented onboarding path (CrowdSec multi-server guide): log processors
# self-register with a shared token, restricted to our own ranges. Both `token`
# and `allowed_ranges` are mandatory. A processor can push arbitrary alerts, so
# the ranges are deliberately narrow — a compromised agent must not be able to
# ban us out of our own platform.
- name: "config | Enable LAPI auto-registration for log processors"
  ansible.builtin.blockinfile:
    path: /etc/crowdsec/config.yaml
    marker: "    # {mark} ANSIBLE MANAGED auto_registration"
    insertafter: '^\s+listen_uri:'
    block: "{{ crowdsec_auto_registration_block }}"
  no_log: true
  notify: Restart crowdsec

- name: "config | AppSec acquisition (the WAF the Traefik bouncer feeds)"
  ansible.builtin.copy:
    dest: /etc/crowdsec/acquis.d/appsec.yaml
    mode: "0644"
    content: |
      # Managed by Ansible role `crowdsec`. AppSec (WAF) component — the Traefik
      # CrowdSec bouncer forwards requests here for in-band inspection.
      appsec_config: crowdsecurity/appsec-default
      labels:
        type: appsec
      source: appsec
      listen_addr: 0.0.0.0:{{ crowdsec_appsec_port }}
  when: crowdsec_appsec_enabled | bool
  notify: Restart crowdsec

- name: "config | Remove AppSec acquisition when disabled (no crash on missing config)"
  ansible.builtin.file:
    path: /etc/crowdsec/acquis.d/appsec.yaml
    state: absent
  when: not (crowdsec_appsec_enabled | bool)
  notify: Restart crowdsec

- name: "config | Syslog feed acquisitions (services/0010 §1 — the firewalls' Suricata EVE)"
  ansible.builtin.copy:
    dest: "/etc/crowdsec/acquis.d/syslog-{{ item.name }}.yaml"
    mode: "0644"
    content: |
      # Managed by Ansible role `crowdsec`. Syslog datasource fed by the OPNsense firewalls
      # (catalog opn_syslog_destinations → this host:{{ item.port }}, RFC5424 over UDP — this datasource is UDP-only).
      source: syslog
      listen_addr: 0.0.0.0
      listen_port: {{ item.port }}
      max_message_len: {{ item.max_message_len | default(65535) }}
      labels:
        type: syslog
  loop: "{{ crowdsec_syslog_feeds | default([]) }}"
  loop_control:
    label: "syslog-{{ item.name }} :{{ item.port }}"
  notify: Restart crowdsec

- name: "config | Bridge the OPNsense Suricata EVE syslog program onto the hub parser's name"
  ansible.builtin.template:
    src: parser-opnsense-suricata-eve.yaml.j2
    dest: /etc/crowdsec/parsers/s01-parse/00-opnsense-suricata-eve.yaml
    mode: "0644"
  when: crowdsec_suricata_syslog_program | default('') | length > 0
  notify: Restart crowdsec

- name: "config | Remove the Suricata program bridge (disabled, or the retired s00-raw location)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/crowdsec/parsers/s00-raw/zz-opnsense-suricata-eve.yaml   # retired: syslog-logs leaves s00-raw
    - "{{ '/etc/crowdsec/parsers/s01-parse/00-opnsense-suricata-eve.yaml' if not (crowdsec_suricata_syslog_program | default('') | length > 0) else omit }}"
  notify: Restart crowdsec

- name: "config | Apply LAPI/AppSec config now"
  ansible.builtin.meta: flush_handlers

- name: "config | Wait for the LAPI to answer on the LAN"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ crowdsec_lapi_port }}/health"
    status_code: [200, 401, 403]
  register: crowdsec_lapi_health
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  retries: 12
  delay: 5
  until: crowdsec_lapi_health.status in [200, 401, 403]
