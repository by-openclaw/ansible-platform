---
# ==============================================================================
# The LAPI runs as a container: the pinned vendor image on the host network (it binds
# :8080, the syslog feeds and :6060 on the host, as the native daemon did), the same
# /etc/crowdsec and /var/lib/crowdsec/data, so every machine and bouncer keeps its
# registration.
# The switch-over keeps the gap to seconds: the image is pulled first, then the native
# unit stops (it holds the ports), then the container starts and is verified; the
# native package goes last (retire.yml).
# ==============================================================================
# A dry-run of the first engine install has no daemon to talk to: the Docker steps are
# skipped then (roles/docker registered docker_engine_install earlier in the play).
- name: "container | Is there an engine to talk to? (only a first-install dry-run has none)"
  ansible.builtin.set_fact:
    crowdsec_engine_ready: "{{ not (ansible_check_mode and (docker_engine_install | default({})) is changed) }}"

- name: "container | Pull the pinned image first (the gap is the start, not the pull)"
  community.docker.docker_image:
    name: "{{ crowdsec_image }}"
    source: pull
  when: crowdsec_engine_ready | bool

# The LAPI's Central API identity (cscli capi register) lives in a file the entrypoint
# regenerates when absent — a rebuilt LAPI would register a NEW identity. Vault holds a copy:
# an absent file is restored from it before the first start (a fresh platform has neither).
- name: "container | The CAPI credentials file"
  ansible.builtin.stat:
    path: "{{ crowdsec_config_dir }}/online_api_credentials.yaml"
  register: crowdsec_capi_file

- name: "container | Their escrowed copy (Vault, optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ crowdsec_capi_vault_path }}"
    vault_secret_optional: true
  when: not crowdsec_capi_file.stat.exists

- name: "container | Restore the CAPI credentials from Vault (DR)"
  ansible.builtin.copy:
    content: "{{ vault_secret_result.credentials }}"
    dest: "{{ crowdsec_config_dir }}/online_api_credentials.yaml"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when:
    - not crowdsec_capi_file.stat.exists
    - (vault_secret_result | default({})).credentials | default('') | length > 0

- name: "container | Services on this host"
  ansible.builtin.service_facts:

- name: "container | The native CrowdSec stops (retired; it holds the ports)"
  ansible.builtin.systemd_service:
    name: crowdsec
    state: stopped
    enabled: false
  when: "'crowdsec.service' in ansible_facts.services"

- name: "container | CrowdSec LAPI (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: crowdsec_engine_ready | bool
  vars:
    service_scaffold_def:
      name: crowdsec
      containers:
        - name: "{{ crowdsec_container }}"
          image: "{{ crowdsec_image }}"
          read_only: true                 # SEC-22: it writes to its mounted directories only
          tmpfs: ["/tmp:rw,size=64m"]
          network_mode: host
          env: "{{ crowdsec_container_env }}"
          volumes:
            - "{{ crowdsec_config_dir }}:{{ crowdsec_config_dir }}"
            - "{{ crowdsec_data_dir }}:{{ crowdsec_data_dir }}"
          restart: "{{ crowdsec_config_changed | default(false) }}"   # the engine reads its config at start

- name: "container | The LAPI answers"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ crowdsec_lapi_port }}/health"
    status_code: [200, 401, 403]
  register: crowdsec_lapi_health
  check_mode: false  # read-only GET: under --check the native (or running) LAPI answers it
  retries: 24
  delay: 5
  until: crowdsec_lapi_health.status in [200, 401, 403]
  when: crowdsec_engine_ready | bool

# After the start the file exists (restored, kept, or freshly registered): Vault keeps a
# copy, written only when it differs (gitlab's DR document follows the same rule).
- name: "container | The CAPI credentials (the file the engine uses)"
  ansible.builtin.slurp:
    src: "{{ crowdsec_config_dir }}/online_api_credentials.yaml"
  register: crowdsec_capi_raw
  no_log: true
  when: crowdsec_engine_ready | bool and not ansible_check_mode

- name: "container | Their escrowed copy, as stored"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ crowdsec_capi_vault_path }}"
    vault_secret_optional: true
  when: crowdsec_capi_raw.content is defined

- name: "container | Escrow the CAPI credentials (Vault) — only when they differ"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ crowdsec_capi_vault_path }}"
    vault_secret_init: {credentials: "{{ crowdsec_capi_raw.content | b64decode }}"}
    vault_secret_force_fields: {credentials: "{{ crowdsec_capi_raw.content | b64decode }}"}
  when:
    - crowdsec_capi_raw.content is defined
    - (vault_secret_result | default({})).credentials | default('') != (crowdsec_capi_raw.content | b64decode)
