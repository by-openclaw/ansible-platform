---
# ==============================================================================
# The LAPI runs as a container: the pinned vendor image on the host network (it binds
# :8080, the syslog feeds and :6060 on the host, as the native daemon did), the same
# /etc/crowdsec and /var/lib/crowdsec/data, so every machine and bouncer keeps its
# registration. /var/log and the journal are mounted read-only for the host's own logs.
# The switch-over keeps the gap to seconds: the image is pulled first, then the native
# unit stops (it holds the ports), then the container starts and is verified; the
# native package goes last (retire.yml).
# ==============================================================================
# A dry-run of the first engine install has no daemon to talk to: the Docker steps are
# skipped then (roles/docker registered docker_engine_install earlier in the play).
- name: "container | Is there an engine to talk to? (only a first-install dry-run has none)"
  ansible.builtin.set_fact:
    crowdsec_engine_ready: "{{ not (ansible_check_mode and (docker_engine_install | default({})) is changed) }}"

- name: "container | Pull the pinned image first (the gap is the start, not the pull)"
  community.docker.docker_image:
    name: "{{ crowdsec_image }}"
    source: pull
  when: crowdsec_engine_ready | bool

- name: "container | Services on this host"
  ansible.builtin.service_facts:

- name: "container | The native CrowdSec stops (retired; it holds the ports)"
  ansible.builtin.systemd_service:
    name: crowdsec
    state: stopped
    enabled: false
  when: "'crowdsec.service' in ansible_facts.services"

- name: "container | CrowdSec LAPI (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: crowdsec_engine_ready | bool
  vars:
    service_scaffold_def:
      name: crowdsec
      containers:
        - name: "{{ crowdsec_container }}"
          image: "{{ crowdsec_image }}"
          network_mode: host
          env: "{{ crowdsec_container_env }}"
          volumes:
            - "{{ crowdsec_config_dir }}:{{ crowdsec_config_dir }}"
            - "{{ crowdsec_data_dir }}:{{ crowdsec_data_dir }}"
            # the host's own logs (crowdsec_host_acquisitions): files and the journal
            - "/var/log:/var/log:ro"
            - "/run/log/journal:/run/log/journal:ro"
            - "/etc/machine-id:/etc/machine-id:ro"
          restart: "{{ crowdsec_config_changed | default(false) }}"   # the engine reads its config at start

- name: "container | The LAPI answers"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ crowdsec_lapi_port }}/health"
    status_code: [200, 401, 403]
  register: crowdsec_lapi_health
  check_mode: false  # read-only GET: under --check the native (or running) LAPI answers it
  retries: 24
  delay: 5
  until: crowdsec_lapi_health.status in [200, 401, 403]
  when: crowdsec_engine_ready | bool
