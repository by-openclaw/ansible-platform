---
- name: "bouncer | Its key (Vault, get-or-create) — {{ crowdsec_bouncer.name }}"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ crowdsec_bouncer.vault_path }}"
    vault_secret_init:
      api_key: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      lapi_url: "http://{{ crowdsec_lapi_host }}:{{ crowdsec_lapi_port }}"
      bouncer: "{{ crowdsec_bouncer.name }}"

- name: "bouncer | Registered on the LAPI under that key (absent only) — {{ crowdsec_bouncer.name }}"
  ansible.builtin.command:
    argv: "{{ crowdsec_cscli + ['bouncers', 'add', crowdsec_bouncer.name, '--key', vault_secret_result.api_key] }}"
  changed_when: true
  no_log: true
  when: crowdsec_bouncer.name not in crowdsec_bouncer_names
