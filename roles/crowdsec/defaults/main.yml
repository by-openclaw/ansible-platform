---
# ==============================================================================
# Role: crowdsec — defaults (central LAPI / detection engine on lxc-crowdsec-01)
# Decision A (services/0006): this host is the platform's central CrowdSec LAPI.
# Every other host (LXC/VM/Windows) runs an AGENT that ships events here; the
# OPNsense firewall bouncer and the Traefik bouncer enforce the decisions.
# Runs as a container: the vendor image on the host network (it binds :8080, the
# syslog feeds and :6060 on the host, as the native daemon did).
# ==============================================================================

# --- The container --------------------------------------------------------------
# The -debian variant ships journalctl, which the sshd acquisition reads the host
# journal with (the alpine variant has none).
# renovate: datasource=docker depName=crowdsecurity/crowdsec
crowdsec_version: "v1.8.1"
crowdsec_image: "crowdsecurity/crowdsec:{{ crowdsec_version }}-debian"
# Host path = path inside the container. Config: hub, acquisitions, local parsers, the
# machine + CAPI credentials. Data: the sqlite (machines, bouncers, decisions), GeoIP.
crowdsec_config_dir: /etc/crowdsec
crowdsec_data_dir: /var/lib/crowdsec/data
# Where the image ships the notification plugins (the native package used /usr/lib).
crowdsec_plugin_dir: /usr/local/lib/crowdsec/plugins/
# The vendor entrypoint (docker_start.sh) keeps owning config.yaml; the platform's
# settings live in config.yaml.local, which CrowdSec merges over it. Its knobs: the local
# machine keeps the name it is registered under, hub items change only when this role
# says so, CAPI follows crowdsec_capi_enabled.
crowdsec_container_env:
  CUSTOM_HOSTNAME: "{{ inventory_hostname }}"
  NO_HUB_UPGRADE: "true"
  DISABLE_ONLINE_API: "{{ (not (crowdsec_capi_enabled | bool)) | string | lower }}"

# --- The retired native install (removed once the container answers) ------------
crowdsec_native_package: crowdsec
crowdsec_native_retired_files:
  - /etc/apt/sources.list.d/crowdsec.list
  - /etc/apt/keyrings/crowdsec.asc

# --- LAPI: listen on the SVC IP so remote agents/bouncers can reach it ---------
# (default crowdsec listens 127.0.0.1:8080 = local only — that's what made .196
# "BASIC".) Central = reachable on the LAN. FW rules gate who may connect.
crowdsec_lapi_listen_ip: "0.0.0.0"
crowdsec_lapi_port: 8080
crowdsec_lapi_listen_uri: "{{ crowdsec_lapi_listen_ip }}:{{ crowdsec_lapi_port }}"
# The SVC IP agents + bouncers actually connect to (saved into their secrets).
crowdsec_lapi_host: "{{ hostvars[groups['crowdsec'] | first].ansible_host }}"
# AppSec (WAF) component — the in-band rules the Traefik reverse proxy feeds.
# Deferred to the Traefik phase (no point running the AppSec source until a
# Traefik CrowdSec bouncer forwards requests to it). Enable there.
crowdsec_appsec_enabled: false
crowdsec_appsec_port: 7422

# --- Collections (the central engine's parser/scenario set) -------------------
# Base detection for the LXC itself + the HTTP/AppSec rules that protect the
# reverse-proxied web apps (Traefik agent feeds these). Per-service collections
# (postfix/dovecot/nginx/proxmox/…) are installed on each AGENT host, not here.
crowdsec_collections:
  - crowdsecurity/linux
  - crowdsecurity/sshd
  - crowdsecurity/base-http-scenarios
  - crowdsecurity/whitelist-good-actors
  - crowdsecurity/http-cve
  # services/0010 §1: the firewalls' Suricata (alert-only on WAN) FEEDS CrowdSec — parser
  # suricata-logs + scenario suricata-alerts (remediation on high/major alerts) + context.
  - crowdsecurity/suricata
# AppSec rule collections — installed in the Traefik phase together with the
# Traefik bouncer + appsec acquis (crowdsec_appsec_enabled).
crowdsec_appsec_collections:
  - crowdsecurity/appsec-virtual-patching
  - crowdsecurity/appsec-generic-rules

# --- Syslog feeds this engine listens to (acquis.d/syslog-<name>.yaml) ---------------------------
# The OPNsense firewalls ship Suricata EVE (and everything else) as RFC5424/UDP syslog to this
# port (the crowdsec syslog datasource listens on UDP only) (catalog opn_syslog_destinations); the syslog-logs parser sets `program`, the suricata
# collection does the rest. No host firewall on the LXC (nftables input policy accept); the
# OPNsense rules decide who may reach it.
crowdsec_syslog_feeds:
  - {name: suricata, port: 1515, max_message_len: 65535}

# The syslog program name the firewalls' Suricata EVE arrives under (OPNsense uses `suricata` for
# both the engine log and the EVE stream). A local s00-raw parser maps JSON payloads from it onto
# `suricata-evelogs`, which is what crowdsecurity/suricata's parser filters on. Empty = no bridge.
crowdsec_suricata_syslog_program: "suricata"

# Namespace for hub items we write ourselves. CrowdSec names every parser/scenario `author/name`,
# and ours is the platform's own token — the same one the domain, the zones and every FQDN carry —
# so a `cscli parsers list` reads like the rest of the estate instead of introducing a new word.
crowdsec_local_namespace: "{{ platform_org }}"

# --- Bouncers that pull decisions from this LAPI ----------------------------------
# Each entry: its key in Vault (get-or-create), registered on the LAPI under that key.
# Vault first, so a rebuilt LAPI takes back the keys the bouncers already hold
# (consumed by the OPNsense crowdsec/general MVC config + the Traefik plugin).
crowdsec_bouncers:
  - name: "opnsense-firewall"
    vault_path: "{{ platform_env }}/crowdsec/bouncer-opnsense"
  - name: "traefik"
    vault_path: "{{ platform_env }}/crowdsec/bouncer-traefik"

# --- Agent auto-enrollment token (so every LXC/VM/Windows agent can register to
#     this LAPI non-interactively in the agent phase). Vault, get-or-create. ---
crowdsec_registration_token_vault_path: "{{ platform_env }}/crowdsec/registration-token"
# Bound by tasks/token.yml, which the dispatcher runs BEFORE config.yml.
crowdsec_registration_token: ""

# --- Console / CAPI enrollment (community blocklist) — optional, off by default
#     (enroll later with a console key if desired). -----------------------------
crowdsec_capi_enabled: true

# --- log-processor onboarding (multi-server guide) --------------------------------
# Agents self-register with this token. Restricted to the platform ranges: a log
# processor can push arbitrary alerts to the LAPI, so a wide range would let a
# compromised host ban the whole estate.
crowdsec_registration_allowed_ranges:
  - "{{ platform_internal_cidr4 }}"      # SVC / DMZ — the cluster LXCs and VMs
  # OOB only, deliberately not platform_mgmt_cidrs: adding the fabric network here
  # would widen who may register an agent, which is a security change, not a refactor.
  - "{{ platform_mgmt_zones.oob.cidr4 }}"   # OOB — Proxmox nodes and the firewall

# The block the native install wrote into config.yaml (retired: config.yaml.local holds it now).
crowdsec_retired_block_marker: "    # {mark} ANSIBLE MANAGED auto_registration"

# --- The host's own logs ---------------------------------------------------------
# The LAPI host is its own log processor (the agent role skips the crowdsec group). One
# acquis.d/<name>.yaml per entry; the container reads /var/log and the journal read-only.
crowdsec_host_acquisitions:
  - name: host-syslog
    config:
      source: file
      filenames: [/var/log/syslog, /var/log/kern.log, /var/log/messages]
      labels: {type: syslog}
  - name: host-sshd
    config:
      source: journalctl
      journalctl_filter: ["_SYSTEMD_UNIT=ssh.service"]
      labels: {type: syslog}
# What the native package's install-time detection (cscli setup) wrote — replaced above.
crowdsec_retired_acquisitions: [setup.linux.yaml, setup.postfix.yaml, setup.sshd.yaml]

# Parser whitelist for the platform's own address space (the LAPI host parses its own logs
# too). ONE source: platform_trusted_cidrs in group_vars/all/deployment.yml.
crowdsec_whitelist_cidrs: "{{ platform_trusted_cidrs | default([]) }}"

# Host firewall (ufw) rules for this role's listeners (host network) — applied by roles/host_firewall when ufw is active
crowdsec_firewall_rules:
  - { port: "{{ crowdsec_lapi_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "CrowdSec LAPI (agents, bouncers)" }
  - { port: "{{ crowdsec_appsec_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "CrowdSec AppSec (Traefik)" }
