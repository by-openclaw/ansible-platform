---
# Install + run the Prometheus node-exporter on every host (fleet-wide).
- name: "Node-exporter | Install prometheus-node-exporter"
  ansible.builtin.apt:
    name: prometheus-node-exporter
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Node-exporter | Bind address, port and extra arguments (the package's defaults file)"
  ansible.builtin.copy:
    dest: /etc/default/prometheus-node-exporter
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: node_exporter)
      ARGS="{{ (['--web.listen-address=' ~ node_exporter_listen ~ ':' ~ node_exporter_port] + node_exporter_extra_args) | join(' ') }}"
  notify: Restart node-exporter

# The Debian package pulls in the collectors, ipmitool and openipmi (Recommends).
# A guest has no BMC: the ipmitool-sensor collector fails on every LXC ("Could
# not open device at /dev/ipmi0") and the openipmi init script on every VM.
# Only a physical node keeps them.
- name: "Node-exporter | Virtualisation facts (the fleet play skips fact gathering)"
  ansible.builtin.setup:
    gather_subset: ["!all", "!min", virtual]
  when: ansible_virtualization_role is not defined

- name: "Node-exporter | No IPMI tooling on guests (no BMC to talk to)"
  ansible.builtin.apt:
    name: [ipmitool, openipmi]
    state: absent
    purge: true   # openipmi's LSB init script is a conffile: a plain remove leaves the unit behind
  when: ansible_virtualization_role | default('') == 'guest'

- name: "Node-exporter | The ipmitool-sensor collector off on guests"
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    masked: true
  loop:
    - prometheus-node-exporter-ipmitool-sensor.timer
    - prometheus-node-exporter-ipmitool-sensor.service
  when:
    - ansible_virtualization_role | default('') == 'guest'
    - not ansible_check_mode

# Masking stops a unit from running again but keeps its last "failed" state.
- name: "Node-exporter | Clear the collector's old failed state on guests"
  ansible.builtin.command:
    argv: [systemctl, reset-failed, prometheus-node-exporter-ipmitool-sensor.timer, prometheus-node-exporter-ipmitool-sensor.service]
  register: node_exporter_ipmi_reset
  changed_when: false   # clears a stale status flag only
  failed_when: false    # nothing to reset is fine
  when:
    - ansible_virtualization_role | default('') == 'guest'
    - not ansible_check_mode

- name: "Node-exporter | Enabled + running"
  ansible.builtin.systemd_service:
    name: prometheus-node-exporter
    enabled: true
    state: started
  when: not ansible_check_mode

- name: "node_exporter | Admit the scrapers (roles/host_firewall owns every ufw rule)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules:
      - port: "9100"
        proto: tcp
        from: "{{ node_exporter_scrapers }}"
        comment: "Prometheus node exporter scrape"
