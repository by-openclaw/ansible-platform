---
# ==============================================================================
# Role: base — baseline packages + sshd for every cluster LXC
# ==============================================================================

- name: "base | Install baseline packages"
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "base | Ensure sshd is enabled and running"
  ansible.builtin.systemd_service:
    name: ssh
    enabled: true
    state: started

- name: "base | Ensure cron is enabled and running"
  ansible.builtin.systemd_service:
    name: cron
    enabled: true
    state: started
