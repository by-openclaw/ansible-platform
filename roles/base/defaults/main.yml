---
# ==============================================================================
# Role: base — baseline packages + sshd for every cluster LXC
# debian-13-standard ships openssh-server but is otherwise minimal (no curl,
# no dnsutils, etc.). This role guarantees a consistent toolbox on every node
# BEFORE service roles run.
# ==============================================================================
base_packages:
  - ca-certificates
  - curl
  - wget
  - gnupg
  - vim
  - less
  - htop
  - net-tools
  - iproute2
  - dnsutils
  - jq
  - unzip
  - tar
  - rsync
  - cron
  - python3
  - python3-apt   # required by the ansible apt module
  - openssh-server
  - qemu-guest-agent  # PVE integration for LXC (harmless if already present)
