---
# ==============================================================================
# Role: postgres_db — create one app database + owner role on the shared cluster
# PostgreSQL (lxc-pgsql-01). REUSABLE per-app: each app's playbook includes this
# to provision its OWN DB+role at install time (separation of concerns — the
# postgresql engine role does NOT create app DBs).
#
# Required (pass via include_role vars):
#   postgres_db_name   e.g. "netbox"
#   postgres_db_user   e.g. "netbox"
# ==============================================================================
# Where the PostgreSQL container runs (delegate target for docker exec).
# Where the statements run: the cluster's LEADER (a replica is read-only). tasks/leader.yml
# asks Patroni once per play host and publishes platform_pg_leader; before that fact exists
# (and for a caller that names the host itself) the first member is the default.
postgres_db_host: "{{ platform_pg_leader | default(groups['postgresql'] | first) }}"
postgres_db_members: "{{ platform_pg_members | default(groups['postgresql']) }}"
postgres_db_patroni_conf: "/etc/postgres/patroni/patroni.yml"
postgres_db_container: "postgres"
postgres_db_listen_ip: "{{ hostvars[groups['postgresql'] | first].ansible_host }}"
postgres_db_port: 5432
# How a statement that carries a password reaches the server: psql reads it on standard input
# (stops at the first error), a quote in the password is doubled as SQL wants it, and the probe
# of the live password connects over TCP so that the password is actually checked.
postgres_db_psql: [psql, -U, postgres, -d, postgres, -v, ON_ERROR_STOP=1, -tA]
postgres_db_password_sql: "{{ postgres_db_password | replace(\"'\", \"''\") }}"
postgres_db_probe_host: "127.0.0.1"

# --- Secret source -----------------------------------------------------------
# Vault IS the store. Set postgres_db_vault_path (e.g. "{{ platform_env }}/gitlab/db-pgsql")
# to make this DB fully Vault-native: the password is read from Vault, or minted
# INTO Vault on first run (get-or-create). The password is then ALTER'd onto the
# role every run so a rebuilt/re-pointed app always matches Vault.
postgres_db_vault_path: ""     # REQUIRED — the role asserts it (no file mode any more)
postgres_db_extensions: []     # extensions the service needs (CREATE EXTENSION is superuser work here): created once, never dropped
# --- Role-only mode, memberships, CONNECT (a login for cluster tooling, e.g. pgAdmin's) -------
# postgres_db_name: "" -> no database: the login is created/kept (password from Vault) and only
# its memberships + CONNECT grants are reconciled. Never a superuser.
postgres_db_role_attributes: []  # role attributes of the login (e.g. REPLICATION); set on create, added to an existing role
postgres_db_memberships: []      # roles granted to the login (GRANT x TO login), e.g. the predefined pg_read_all_data; never revoked here
postgres_db_connect_all: false   # the login may CONNECT to every database of the cluster (service databases revoke PUBLIC)
# The platform's DBA logins (inventories/<env>/group_vars/all/postgresql.yml, key = service -> login):
# every database this role creates grants them CONNECT, reconciled on every run — so a login
# created before a service's database still reaches it. Optional: a tier without DBA tooling has none.
postgres_db_dba_logins: "{{ platform_pg_dba_logins | default({}) }}"
