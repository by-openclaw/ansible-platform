---
# ==============================================================================
# postgres_db | provision one app DB + owner role on the shared cluster Postgres
# Idempotent via `docker exec` (delegated to the Postgres host; local socket =
# trust). Password is generated once and stored in Vault (get-or-create).
# ==============================================================================
# --- Password: Vault (get-or-create) -----------------------------------------
- name: "Postgresdb | A Vault path is required"
  ansible.builtin.assert:
    that: postgres_db_vault_path | length > 0
    # The legacy file mode wrote each database's password to the controller's disk.
    # Every caller now passes a Vault path (#377); an empty one would otherwise fall
    # back to writing a secret file, silently.
    fail_msg: "postgres_db requires postgres_db_vault_path (e.g. prod/<service>/db-pgsql)"
    quiet: true
- name: "Postgresdb | Resolve password from Vault (get-or-create)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ postgres_db_vault_path }}"
    vault_secret_init:
      host: "{{ postgres_db_listen_ip }}"
      port: "{{ postgres_db_port }}"
      database: "{{ postgres_db_name }}"
      user: "{{ postgres_db_user }}"
      password: "{{ lookup('community.general.random_string', length=40, special=false) }}"

- name: "Postgresdb | Adopt the Vault password"
  ansible.builtin.set_fact:
    postgres_db_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "Postgresdb | Check role exists: {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -tAU postgres -d postgres -c "SELECT 1 FROM pg_roles WHERE rolname = '{{ postgres_db_user }}'"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_role_exists
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false

- name: "Postgresdb | Create role {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} psql -U postgres -d postgres
      -c "CREATE ROLE {{ postgres_db_user }} LOGIN PASSWORD '{{ postgres_db_password }}'"
  delegate_to: "{{ postgres_db_host }}"
  when: postgres_db_role_exists.stdout | trim != '1'
  no_log: true
  changed_when: true

# Vault is the source of truth: on an existing role, force its password to match
# Vault so a rebuilt/re-pointed app reconnects cleanly. Vault mode only (file-mode
# services keep their current password untouched).
- name: "Postgresdb | Probe whether the live password already matches Vault"
  ansible.builtin.command:
    cmd: >-
      docker exec -e PGPASSWORD={{ postgres_db_password }} {{ postgres_db_container }}
      psql -h 127.0.0.1 -U {{ postgres_db_user }} -d postgres -tAc "SELECT 1"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_pw_probe
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  failed_when: false
  changed_when: false
  no_log: true
  when:
    - postgres_db_role_exists.stdout | trim == '1'

- name: "Postgresdb | Sync existing role password to Vault ({{ postgres_db_user }})"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} psql -U postgres -d postgres
      -c "ALTER ROLE {{ postgres_db_user }} LOGIN PASSWORD '{{ postgres_db_password }}'"
  delegate_to: "{{ postgres_db_host }}"
  when:
    - postgres_db_role_exists.stdout | trim == '1'
    - postgres_db_pw_probe.rc | default(1) != 0
  no_log: true
  changed_when: true

- name: "Postgresdb | Check database exists: {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -tAU postgres -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '{{ postgres_db_name }}'"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_exists
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  when: postgres_db_name | length > 0

- name: "Postgresdb | Create database (UTF-8) {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} createdb -U postgres -O {{ postgres_db_user }}
      -E UTF8 -T template0 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 {{ postgres_db_name }}
  delegate_to: "{{ postgres_db_host }}"
  when:
    - postgres_db_name | length > 0
    - postgres_db_exists.stdout | default('') | trim != '1'
  changed_when: true

# --- Extensions the consumer declared (superuser; created once, never dropped) -------------
- name: "Postgresdb | Installed extensions of {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -tAU postgres -d {{ postgres_db_name }} -c "SELECT extname FROM pg_extension"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_ext_now
  check_mode: false  # read-only probe (a database created only in this dry-run answers nothing)
  changed_when: false
  failed_when: false
  when: postgres_db_name | length > 0 and postgres_db_extensions | length > 0

- name: "Postgresdb | Create the declared extensions in {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -U postgres -d {{ postgres_db_name }} -c "CREATE EXTENSION IF NOT EXISTS {{ item }}"
  delegate_to: "{{ postgres_db_host }}"
  loop: "{{ postgres_db_extensions }}"
  when: postgres_db_name | length > 0 and item not in (postgres_db_ext_now.stdout_lines | default([]))
  changed_when: true

# --- Memberships the consumer declared (GRANT role TO login; never revoked here) ------------
- name: "Postgresdb | Current memberships of {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} psql -tAU postgres -d postgres
      -c "SELECT r.rolname FROM pg_auth_members m JOIN pg_roles r ON r.oid = m.roleid
          JOIN pg_roles u ON u.oid = m.member WHERE u.rolname = '{{ postgres_db_user }}'"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_members_now
  check_mode: false  # read-only probe (the login may not exist yet under --check: empty answer)
  changed_when: false
  failed_when: false
  when: postgres_db_memberships | length > 0

- name: "Postgresdb | Grant the missing memberships to {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -U postgres -d postgres -c "GRANT {{ item }} TO {{ postgres_db_user }}"
  delegate_to: "{{ postgres_db_host }}"
  loop: "{{ postgres_db_memberships }}"
  when: item not in (postgres_db_members_now.stdout_lines | default([]))
  changed_when: true

# --- CONNECT: a cluster-tooling login reaches every database (service databases revoke PUBLIC) -
- name: "Postgresdb | Databases the login cannot connect to yet: {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} psql -tAU postgres -d postgres
      -c "SELECT datname FROM pg_database WHERE NOT datistemplate
          AND NOT has_database_privilege('{{ postgres_db_user }}', datname, 'CONNECT')"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_connect_missing
  check_mode: false  # read-only probe
  changed_when: false
  failed_when: false  # the login does not exist yet under --check
  when: postgres_db_connect_all | bool

- name: "Postgresdb | Grant CONNECT on every database to {{ postgres_db_user }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -U postgres -d postgres -c "GRANT CONNECT ON DATABASE {{ item }} TO {{ postgres_db_user }}"
  delegate_to: "{{ postgres_db_host }}"
  loop: "{{ postgres_db_connect_missing.stdout_lines | default([]) }}"
  when:
    - postgres_db_connect_all | bool
    - postgres_db_connect_missing.rc | default(1) == 0
  changed_when: true

# --- This database: the platform's DBA logins may CONNECT (whether created before or after it) -
- name: "Postgresdb | DBA logins that exist but cannot connect to {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ postgres_db_container }} psql -tAU postgres -d postgres
      -c "SELECT rolname FROM pg_roles
          WHERE rolname = ANY(string_to_array('{{ postgres_db_dba_logins.values() | join(',') }}', ','))
          AND NOT has_database_privilege(rolname, '{{ postgres_db_name }}', 'CONNECT')"
  delegate_to: "{{ postgres_db_host }}"
  register: postgres_db_dba_missing
  check_mode: false  # read-only probe
  changed_when: false
  failed_when: false  # the database does not exist yet under --check
  when: postgres_db_name | length > 0 and postgres_db_dba_logins | length > 0

- name: "Postgresdb | Grant CONNECT to the DBA logins on {{ postgres_db_name }}"
  ansible.builtin.command:
    cmd: docker exec {{ postgres_db_container }} psql -U postgres -d postgres -c "GRANT CONNECT ON DATABASE {{ postgres_db_name }} TO {{ item }}"
  delegate_to: "{{ postgres_db_host }}"
  loop: "{{ postgres_db_dba_missing.stdout_lines | default([]) }}"
  when:
    - postgres_db_name | length > 0
    - postgres_db_dba_missing.rc | default(1) == 0
  changed_when: true
