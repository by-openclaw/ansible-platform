---
# ==============================================================================
# Role: gitlab_rbac — reconcile GitLab instance policy + groups + memberships
# from desired state, idempotently, via gitlab-rails (no token). GitLab CE can't
# sync group membership from OIDC and only re-evaluates admin at login, so this
# role is the source of truth for GitLab-side RBAC. Re-run to converge.
# Secure model (per BY-SYSTEMS): nothing public, Owner = adm_* only, only admins
# create repos/groups, docs = read-only for users, SSO-only signup.
# ==============================================================================

# --- Instance policy (ApplicationSetting) — hardening ------------------------
gitlab_rbac_settings:
  signup_enabled: false                              # no open registration — Authentik SSO only
  require_admin_approval_after_user_signup: true     # belt-and-suspenders
  default_project_visibility: private
  default_group_visibility: private
  restricted_visibility_levels: [public]             # NOBODY can make anything public (internal+private ok)
  can_create_group: false                            # regular users can't create top-level groups (admins exempt)
  project_export_enabled: true                       # needed for per-project archive/restore
  import_sources: [gitlab_project]                   # ONLY project export/import (no github/bitbucket/etc. external imports)
  # Diagram rendering — URLs must be BROWSER-reachable (GitLab emits <img src=…>),
  # so use the Traefik HTTPS names, not the internal SVC URL. Kroki covers
  # graphviz/ditaa/etc.; ```plantuml routes to the standalone PlantUML server
  # (Kroki's native-image PlantUML can't run on this old CPU); ```mermaid stays
  # GitLab-native. Services: roles/diagrams on lxc-diagrams-01.
  kroki_enabled: true
  kroki_url: "https://{{ platform_service_fqdns.diagrams_kroki }}"
  plantuml_enabled: true
  plantuml_url: "https://{{ platform_service_fqdns.diagrams_plantuml }}"
  # drawio (diagrams.net) — the self-hosted editor on lxc-diagrams-01 (no egress
  # to embed.diagrams.net); GitLab embeds the editor in wiki/issues/MRs.
  diagramsnet_enabled: true
  diagramsnet_url: "https://{{ platform_service_fqdns.diagrams_drawio }}"
  # --- Track B: safe instance settings ---
  default_branch_name: "main"                        # default branch for new repos
  # Web IDE: extensions from the marketplace; assets from GitLab's external CDN ONLY —
  # the single-origin fallback (serving VS Code from the GitLab origin) is an XSS-class
  # risk flagged by the admin dashboard on 19.3. Browsers must reach the CDN.
  vscode_extension_marketplace:
    enabled: true
    extension_host_domain: cdn.web-ide.gitlab-static.net
    single_origin_fallback_enabled: false
  usage_ping_enabled: false                          # no telemetry phone-home (private instance)
  default_project_deletion_protection: true          # guard against accidental project deletion

# --- Instance admins = the people in the GitLab admin group (people.yml) — root always exempt
# Nobody is spelled out here: platform_people is the one place a person is written down
# (identity/0004); the group names come from platform_service_groups (one source).
gitlab_rbac_admin_group: "{{ platform_service_groups.gitlab.admin }}"     # gitlab-admins
gitlab_rbac_user_group: "{{ platform_service_groups.gitlab.access }}"     # gitlab-users
gitlab_rbac_people_active: "{{ platform_people | selectattr('state', 'equalto', 'active') | selectattr('groups', 'defined') | list }}"
gitlab_rbac_instance_admins: >-
  {{ gitlab_rbac_people_active | selectattr('groups', 'contains', gitlab_rbac_admin_group)
     | map(attribute='username') | list }}
gitlab_rbac_enforce_admin_exact: true

# --- Group tree --------------------------------------------------------------
# access-creation levels: project_creation = maintainer (only admins create repos);
# subgroup_creation = owner (only admins create subgroups). docs = internal so any
# SSO user can READ the Pages "wiki"; code groups = private.
gitlab_rbac_groups:
  - { path: platform, name: "Platform", visibility: private, project_creation: maintainer, subgroup_creation: owner }
  - { path: infra, parent: platform, name: "Infra", visibility: private, project_creation: maintainer, subgroup_creation: owner }
  - { path: apps, parent: platform, name: "Apps", visibility: private, project_creation: maintainer, subgroup_creation: owner }
  - { path: devops, parent: platform, name: "DevOps", visibility: private, project_creation: maintainer, subgroup_creation: owner }
  # docs stays private like the parent (GitLab forbids a more-visible subgroup);
  # "everyone reads the Pages wiki" is done per-project via Pages access control.
  - { path: docs, parent: platform, name: "Docs", visibility: private, project_creation: maintainer, subgroup_creation: owner }
  # support = Service Desk home (email -> confidential issues) — a real repo too
  # (runbooks/KB alongside the desk), per the "desk support has a repo" rule.
  - { path: support, parent: platform, name: "Support", visibility: private, project_creation: maintainer, subgroup_creation: owner }

# --- Memberships: Owner = the admin group's people; users = Developer (code) / Reporter (docs)
# Not granted at platform level (inheritance would floor docs at Developer); set
# per-subgroup so docs stays read-only for regular users. The people come from people.yml:
# gitlab-admins → Owner of `platform` (inherits to every subgroup); gitlab-users who are
# not admins → the per-subgroup roles below.
gitlab_rbac_user_memberships:
  - { group: platform/infra, access: developer }
  - { group: platform/apps, access: developer }
  - { group: platform/devops, access: developer }
  - { group: platform/docs, access: reporter }      # viewer — reads Pages only
  - { group: platform/support, access: developer }  # support agent: sees confidential desk issues
gitlab_rbac_members: >-
  {%- set out = [] -%}
  {%- for u in gitlab_rbac_instance_admins -%}
    {%- set _ = out.append({'group': 'platform', 'username': u, 'access': 'owner'}) -%}
  {%- endfor -%}
  {%- for p in gitlab_rbac_people_active if gitlab_rbac_user_group in p.groups and gitlab_rbac_admin_group not in p.groups -%}
    {%- for m in gitlab_rbac_user_memberships -%}
      {%- set _ = out.append({'group': m.group, 'username': p.username, 'access': m.access}) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ out }}

# --- Cleanup: throwaway projects created during CI bring-up -------------------
gitlab_rbac_delete_projects:
  - root/smoke
  - root/gtest

# --- Projects: create-if-absent, reconcile desc/visibility/service_desk --------
# service_desk goes LIVE only once roles/gitlab has incoming_email (mailroom)
# enabled (gitlab_service_desk_enabled) — the flag itself is safe to set early.
gitlab_rbac_projects:
  - { group: platform/support, path: helpdesk, name: "Helpdesk", visibility: private, service_desk: true,
      description: "Service Desk — support requests by email become confidential issues here; runbooks + KB in the repo." }
  # Shared CI templates — any project does `include: {project: platform/infra/ci-templates, file: /<name>.gitlab-ci.yml}`.
  # Content is pushed by the reconciler from roles/gitlab/files/ci-templates (gitlab_rbac_project_files).
  - group: platform/infra
    path: ci-templates
    name: "CI templates"
    visibility: private     # GitLab forbids a more-visible project under a private group; members' pipelines can still include it
    service_desk: false
    description: "Shared GitLab CI templates (pre-commit, security-scan, npm) — managed by Ansible; include them, do not copy."
  # npm registry smoke project — its pipeline proves every runner reaches Verdaccio with the platform creds.
  - group: platform/devops
    path: npm-check
    name: "npm registry check"
    visibility: private
    service_desk: false
    description: "Pipeline smoke test: the runner pulls through npm.<domain> (Verdaccio) with the instance CI credentials."

# --- Project files: pushed to the default branch when content differs -------
# src = path the reconciler reads INSIDE the GitLab container: staged by this role (from
# roles/gitlab/files/ci-templates) into the scripts directory the container mounts.
gitlab_rbac_ci_templates_dir: "{{ gitlab_scripts_dir }}/ci-templates"
gitlab_rbac_project_files:
  - project: platform/infra/ci-templates
    files:
      - { path: pre-commit.gitlab-ci.yml, src: "{{ gitlab_rbac_ci_templates_dir }}/pre-commit.gitlab-ci.yml" }
      - { path: security-scan.gitlab-ci.yml, src: "{{ gitlab_rbac_ci_templates_dir }}/security-scan.gitlab-ci.yml" }
      - { path: npm.gitlab-ci.yml, src: "{{ gitlab_rbac_ci_templates_dir }}/npm.gitlab-ci.yml" }
  - project: platform/devops/npm-check
    files:
      - path: .gitlab-ci.yml
        content: |
          # Managed by Ansible (gitlab_rbac). Proves the runner reaches the platform npm registry.
          include:
            - project: 'platform/infra/ci-templates'
              file: '/npm.gitlab-ci.yml'
          stages: [test]

# --- Per-project integrations (Discord channel per project) -------------------
# The webhook is a SECRET: give the Vault path, the role resolves it at run time.
# Create the webhook in Discord (channel → Integrations → Webhooks), store it:
#   vault kv put secret/prod/gitlab/discord-<project> webhook=https://discord.com/api/webhooks/...
# Entries stay inert until a path is listed.
# Webhooks are created by roles/discord_guild (bot svc-chatops-prod) and stored at
# prod/discord/webhook-<name>; one channel per GitLab group + #helpdesk.
gitlab_rbac_integrations:
  - project: platform/support/helpdesk
    type: discord
    webhook_vault_path: "{{ platform_env }}/discord/webhook-gitlab-helpdesk"
    events: { push: false, issues: true, confidential_issues: true, merge_requests: true, pipeline: false, note: false }
    branches: default
  - project: platform/devops/npm-check
    type: discord
    webhook_vault_path: "{{ platform_env }}/discord/webhook-gitlab-devops"
    events: { push: true, issues: true, confidential_issues: false, merge_requests: true, pipeline: true, note: false }
    branches: default
  - project: platform/infra/ci-templates
    type: discord
    webhook_vault_path: "{{ platform_env }}/discord/webhook-gitlab-infra"
    events: { push: true, issues: true, confidential_issues: false, merge_requests: true, pipeline: true, note: false }
    branches: default
  - project: platform/apps/demo
    type: discord
    webhook_vault_path: "{{ platform_env }}/discord/webhook-gitlab-apps"
    events: { push: true, issues: true, confidential_issues: false, merge_requests: true, pipeline: true, note: false }
    branches: default

# --- Per-user SSH/GPG keys — derived from platform_people (group_vars/all/people.yml).
# GitLab user must already exist (created via SSO first login or the identity flow).
gitlab_rbac_user_keys: []   # built at runtime from Vault (roles/identity_keys escrow) in tasks/main.yml

gitlab_rbac_host: "{{ groups['gitlab'] | first }}"
