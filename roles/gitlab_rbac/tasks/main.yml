---
# ==============================================================================
# gitlab_rbac | reconcile GitLab admins + groups + memberships from desired state.
# Runs on the GitLab server via gitlab-rails (no token). Idempotent + re-runnable.
# ==============================================================================
- name: "RBAC | Stage the reconciler script"
  ansible.builtin.copy:
    src: reconcile.rb
    dest: /opt/gitlab-rbac-reconcile.rb
    owner: root
    group: root
    mode: "0644"

# --- Discord webhooks are secrets: resolve each Vault path into the desired state
- name: "RBAC | Vault login (AppRole) for integration secrets"
  ansible.builtin.include_role:
    name: vault_login
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Resolve integration webhooks from Vault"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ vault_deploy_token }} vault
      vault kv get -mount=secret -field=webhook {{ item.webhook_vault_path }}
  delegate_to: lxc-vault-01
  become: true
  register: gitlab_rbac_webhook_get
  changed_when: false
  no_log: true
  loop: "{{ gitlab_rbac_integrations }}"
  loop_control:
    label: "{{ item.project }} {{ item.type }}"

- name: "RBAC | Build the resolved integration list"
  ansible.builtin.set_fact:
    gitlab_rbac_integrations_resolved: >-
      {{ (gitlab_rbac_integrations_resolved | default([]))
         + [item.item | combine({'webhook': item.stdout}) | dict2items
            | rejectattr('key', 'equalto', 'webhook_vault_path') | items2dict] }}
  no_log: true
  loop: "{{ gitlab_rbac_webhook_get.results | default([]) }}"
  loop_control:
    label: "{{ item.item.project | default('') }}"
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Render the desired-state JSON"
  ansible.builtin.template:
    src: desired.json.j2
    dest: /opt/gitlab-rbac-desired.json
    owner: root
    group: root
    mode: "0644"

- name: "RBAC | Reconcile (admins, groups, memberships)"
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - /opt/gitlab-rbac-reconcile.rb
      - /opt/gitlab-rbac-desired.json
  register: gitlab_rbac_run
  changed_when: "'changes=0' not in gitlab_rbac_run.stdout"
  failed_when: "'RBAC_DONE' not in gitlab_rbac_run.stdout"

- name: "RBAC | Reconcile result"
  ansible.builtin.debug:
    msg: "{{ gitlab_rbac_run.stdout_lines }}"
