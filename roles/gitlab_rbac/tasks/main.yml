---
# ==============================================================================
# gitlab_rbac | reconcile GitLab admins + groups + memberships from desired state.
# Runs on the GitLab server via gitlab-rails (no token). Idempotent + re-runnable.
# ==============================================================================
- name: "RBAC | Stage the reconciler script"
  ansible.builtin.copy:
    src: reconcile.rb
    dest: /opt/gitlab-rbac-reconcile.rb
    owner: root
    group: root
    mode: "0644"

# --- Discord webhooks are secrets: resolve each Vault path into the desired state
- name: "RBAC | Vault login (AppRole) for integration secrets"
  ansible.builtin.include_role:
    name: vault_login
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Resolve integration webhooks from Vault"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ vault_deploy_token }} vault
      vault kv get -mount=secret -field=webhook {{ item.webhook_vault_path }}
  delegate_to: "{{ groups['vault'] | first }}"
  become: true
  register: gitlab_rbac_webhook_get
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true
  loop: "{{ gitlab_rbac_integrations }}"
  loop_control:
    label: "{{ item.project }} {{ item.type }}"

- name: "RBAC | Build the resolved integration list"
  ansible.builtin.set_fact:
    gitlab_rbac_integrations_resolved: >-
      {{ (gitlab_rbac_integrations_resolved | default([]))
         + [item.item | combine({'webhook': item.stdout}) | dict2items
            | rejectattr('key', 'equalto', 'webhook_vault_path') | items2dict] }}
  no_log: true
  loop: "{{ gitlab_rbac_webhook_get.results | default([]) }}"
  loop_control:
    label: "{{ item.item.project | default('') }}"
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Stage the shared CI templates on the GitLab host"
  ansible.builtin.copy:
    src: "{{ role_path }}/../gitlab/files/ci-templates/"
    dest: "{{ gitlab_rbac_ci_templates_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# --- Per-identity public keys: sourced from Vault (roles/identity_keys escrow) ---
- name: "RBAC | Managed identities (manage_keys)"
  ansible.builtin.set_fact:
    gitlab_rbac_key_people: "{{ platform_people | default([]) | selectattr('manage_keys', 'defined') | selectattr('manage_keys') | list }}"

- name: "RBAC | Vault login for escrowed public keys"
  ansible.builtin.import_role:
    name: vault_login
  when: gitlab_rbac_key_people | length > 0

- name: "RBAC | Read each identity's escrowed public keys"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_TOKEN={{ vault_deploy_token }} vault
      vault kv get -mount=secret -format=json
      {{ platform_env | default('prod') }}/users/{{ item.username }}/keys
  delegate_to: "{{ groups['vault'] | first }}"
  become: true
  loop: "{{ gitlab_rbac_key_people }}"
  loop_control: { label: "{{ item.username }}" }
  register: gitlab_rbac_keyreads
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true

- name: "RBAC | Assemble user_keys from the Vault reads"
  ansible.builtin.set_fact:
    gitlab_rbac_user_keys: "{{ _uk | from_json }}"
  vars:
    _uk: >-
      [
      {% for r in gitlab_rbac_keyreads.results | default([]) if r.rc | default(1) == 0 %}
        {% set d = (r.stdout | from_json).data.data %}
        {"username": "{{ r.item.username }}",
         "ssh_keys": [{"label": "identity", "key": {{ d.ssh_public_key | to_json }}}],
         "gpg_keys": [{"label": "identity", "key": {{ d.gpg_public_key | to_json }}}]}{{ "," if not loop.last else "" }}
      {% endfor %}
      ]
  no_log: true
  when: gitlab_rbac_key_people | length > 0

- name: "RBAC | Render the desired-state JSON"
  ansible.builtin.template:
    src: desired.json.j2
    dest: /opt/gitlab-rbac-desired.json
    owner: root
    group: root
    mode: "0644"

- name: "RBAC | Reconcile (admins, groups, memberships)"
  ansible.builtin.command:
    argv:
      - gitlab-rails
      - runner
      - /opt/gitlab-rbac-reconcile.rb
      - /opt/gitlab-rbac-desired.json
  register: gitlab_rbac_run
  changed_when: "'changes=0' not in gitlab_rbac_run.stdout"
  failed_when: "'RBAC_DONE' not in gitlab_rbac_run.stdout"

- name: "RBAC | Reconcile result"
  ansible.builtin.debug:
    msg: "{{ gitlab_rbac_run.stdout_lines }}"
