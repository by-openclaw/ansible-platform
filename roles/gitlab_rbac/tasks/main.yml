---
# ==============================================================================
# gitlab_rbac | reconcile GitLab admins + groups + memberships from desired state.
# Runs on the GitLab server via gitlab-rails (no token). Idempotent + re-runnable.
# ==============================================================================
- name: "RBAC | The pre-container staging paths (retired; the desired state held webhooks)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/opt/gitlab-rbac-reconcile.rb, /opt/gitlab-rbac-desired.json, /opt/gitlab-ci-templates]

- name: "RBAC | Stage the reconciler script"
  ansible.builtin.copy:
    src: reconcile.rb
    dest: "{{ gitlab_scripts_dir }}/rbac-reconcile.rb"   # mounted into the GitLab container
    owner: root
    group: root
    mode: "0644"

# --- Discord webhooks are secrets: resolve each Vault path into the desired state
- name: "RBAC | Integration webhooks from Vault (roles/vault_secret)"
  ansible.builtin.include_role:
    name: vault_secret
    tasks_from: many
  vars:
    vault_secret_paths: "{{ gitlab_rbac_integrations | map(attribute='webhook_vault_path') | unique | list }}"
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Build the resolved integration list"
  ansible.builtin.set_fact:
    gitlab_rbac_integrations_resolved: >-
      {{ (gitlab_rbac_integrations_resolved | default([]))
         + [item | combine({'webhook': vault_secret_results[item.webhook_vault_path].webhook}) | dict2items
            | rejectattr('key', 'equalto', 'webhook_vault_path') | items2dict] }}
  no_log: true
  loop: "{{ gitlab_rbac_integrations }}"
  loop_control:
    label: "{{ item.project | default('') }}"
  when: gitlab_rbac_integrations | length > 0

- name: "RBAC | Stage the shared CI templates on the GitLab host"
  ansible.builtin.copy:
    src: "{{ role_path }}/../gitlab/files/ci-templates/"
    dest: "{{ gitlab_rbac_ci_templates_dir }}/"
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

# --- Per-identity public keys: sourced from Vault (roles/identity_keys escrow) ---
- name: "RBAC | Managed identities (manage_keys)"
  ansible.builtin.set_fact:
    gitlab_rbac_key_people: "{{ platform_people | default([]) | selectattr('manage_keys', 'defined') | selectattr('manage_keys') | list }}"

# Optional: an identity whose keys are not escrowed yet is simply skipped.
- name: "RBAC | Each identity's escrowed public keys (roles/vault_secret, optional)"
  ansible.builtin.include_role:
    name: vault_secret
    tasks_from: many
  vars:
    vault_secret_optional: true
    vault_secret_paths: "{{ gitlab_rbac_key_people | map(attribute='username') | map('regex_replace', '^', platform_env ~ '/users/') | map('regex_replace', '$', '/keys') | list }}"
  when: gitlab_rbac_key_people | length > 0

- name: "RBAC | Assemble user_keys from the Vault reads"
  ansible.builtin.set_fact:
    gitlab_rbac_user_keys: >-
      {%- set out = [] -%}
      {%- for u in gitlab_rbac_key_people -%}
        {%- set d = (vault_secret_results | default({})).get(platform_env ~ '/users/' ~ u.username ~ '/keys', {}) -%}
        {%- if d | length > 0 -%}
          {%- set _ = out.append({'username': u.username,
                                  'ssh_keys': [{'label': 'identity', 'key': d.ssh_public_key}],
                                  'gpg_keys': [{'label': 'identity', 'key': d.gpg_public_key}]}) -%}
        {%- endif -%}
      {%- endfor -%}
      {{ out }}
  no_log: true
  when: gitlab_rbac_key_people | length > 0

- name: "RBAC | Render the desired-state JSON"
  ansible.builtin.template:
    src: desired.json.j2
    dest: "{{ gitlab_scripts_dir }}/rbac-desired.json"
    owner: root
    group: root
    mode: "0600"   # carries the integration webhooks (secrets); gitlab-rails runs as root

- name: "RBAC | Reconcile (admins, groups, memberships)"
  ansible.builtin.command:
    argv: >-
      {{ gitlab_exec + [gitlab_container, 'gitlab-rails', 'runner',
         gitlab_scripts_dir ~ '/rbac-reconcile.rb', gitlab_scripts_dir ~ '/rbac-desired.json'] }}
  register: gitlab_rbac_run
  changed_when: "'changes=0' not in gitlab_rbac_run.stdout"
  failed_when: "'RBAC_DONE' not in gitlab_rbac_run.stdout"

- name: "RBAC | Reconcile result"
  ansible.builtin.debug:
    msg: "{{ gitlab_rbac_run.stdout_lines }}"
