---
- name: "Docker data | Verify: the data root is its own mount (findmnt; the mounts fact drops ZFS datasets)"
  ansible.builtin.command:
    cmd: "findmnt -n -o SOURCE,FSTYPE,SIZE,AVAIL {{ docker_data_path }}"
  register: docker_data_findmnt_after
  check_mode: false  # read-only probe
  changed_when: false
  failed_when: docker_data_findmnt_after.rc != 0

- name: "Docker data | Verify: the engine is up and every container is back"
  community.docker.docker_host_info:
    containers: true
  register: docker_data_after
  until: docker_data_after.containers | length >= (docker_data_before.containers | default([]) | length)
  retries: "{{ docker_data_containers_wait_retries }}"
  delay: 10

- name: "Docker data | Verify: the engine's data root is the volume"
  ansible.builtin.assert:
    that: docker_data_after.host_info.DockerRootDir == docker_data_path
    fail_msg: "Docker Root Dir is {{ docker_data_after.host_info.DockerRootDir }}"
    quiet: true

- name: "Docker data | Result"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ docker_data_path }} on {{ docker_data_findmnt_after.stdout | trim }}
      (source fstype size avail), {{ docker_data_after.containers | length }} containers running
