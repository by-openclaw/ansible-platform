---
# The backup liveness signal (infra/0008 · INF-45). A timer on the node asks PVE for
# the guests, the backup jobs and the backup content of every job's target storage,
# and writes — where node_exporter's textfile collector reads it — which guest each
# job covers, when its newest backup started and how many of its snapshots failed
# verification. roles/prometheus raises the Backup* alerts from those series, so a
# missed or failed backup reaches the alert channel instead of a mailbox.
# No shell and no filter program: the timer runs a small play ON the node (ansible-playbook,
# local connection) — three reads of PVE, then a template written whole and renamed into place.
- name: "PVE host | Ansible on the node (the signal is a local play)"
  ansible.builtin.apt:
    name: ansible-core
    state: present
    install_recommends: false

- name: "PVE host | Backup signal directory"
  ansible.builtin.file:
    path: "{{ pve_host_backup_signal_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "PVE host | Backup signal play and its template (copied as they are: rendered on the node)"
  ansible.builtin.copy:
    src: "backup-signal/{{ item }}"
    dest: "{{ pve_host_backup_signal_dir }}/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - signal.yml
    - platform_backup.prom.j2

- name: "PVE host | The jq filter the signal used to go through"
  ansible.builtin.file:
    path: "{{ pve_host_backup_signal_retired_filter }}"
    state: absent

- name: "PVE host | Backup jobs (the storages the signal reads)"
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/backup, --output-format, json]
  register: pve_host_backup_signal_jobs
  changed_when: false
  check_mode: false   # read-only probe

# One `pvesh get …/content` per target storage: the storages of the live jobs, plus the
# NAS job's (declared here, so present even before its first converge).
- name: "PVE host | Target storages of the signal"
  ansible.builtin.set_fact:
    pve_host_backup_signal_storages: >-
      {{ ((pve_host_backup_signal_jobs.stdout | from_json | map(attribute='storage') | list)
          + [pve_host_nfs_backup_job.storage]) | unique | sort }}

# One `pvesh get …/content` per target storage, so the play is told which ones.
- name: "PVE host | Backup signal settings"
  ansible.builtin.copy:
    dest: "{{ pve_host_backup_signal_dir }}/vars.yml"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (roles/pve_host) — the settings of signal.yml.
      {{ {'signal_node': pve_host_node,
          'signal_storages': pve_host_backup_signal_storages,
          'signal_file': pve_host_backup_signal_file,
          'signal_template': pve_host_backup_signal_dir ~ '/platform_backup.prom.j2'} | to_nice_yaml(indent=2) }}

- name: "PVE host | Backup signal timer (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: platform-backup-signal
    host_job_description: "Backup liveness signal for Prometheus (newest backup and failed verifications per guest)"
    host_job_on_calendar: ""
    host_job_on_boot_sec: "120"
    host_job_on_unit_active_sec: "{{ pve_host_backup_signal_interval }}"
    host_job_timeout: "10min"
    host_job_runtime_directory: platform-backup-signal
    host_job_environment: "{{ pve_host_backup_signal_environment }}"
    # A read that fails ends the play before the file is written: the unit fails and the
    # previous file stays — BackupSignalStale then says so, instead of a partial signal.
    host_job_exec:
      - >-
        {{ pve_host_backup_signal_ansible_playbook }} --inventory localhost,
        --extra-vars @{{ pve_host_backup_signal_dir }}/vars.yml
        {{ pve_host_backup_signal_dir }}/signal.yml

- name: "PVE host | Write the signal now"
  ansible.builtin.systemd_service:
    name: platform-backup-signal.service
    state: started
  changed_when: false
  when: not ansible_check_mode

# The timer may have started the first run by itself: wait for the file of a complete run
# (a series per covered guest and a backup time per guest that has one).
- name: "PVE host | The signal as written"
  ansible.builtin.command:
    argv: [grep, -c, -e, "^platform_backup_expected", -e, "^platform_backup_last_timestamp_seconds", "{{ pve_host_backup_signal_file }}"]
  register: pve_host_backup_signal_count
  changed_when: false
  failed_when: false
  retries: 12
  delay: 5
  until: pve_host_backup_signal_count.stdout | default('0') | int > pve_host_backup_signal_storages | length
  when: not ansible_check_mode

- name: "PVE host | The signal carries the guests and their backups"
  ansible.builtin.command:
    argv: [grep, -c, "^platform_backup_last_timestamp_seconds", "{{ pve_host_backup_signal_file }}"]
  register: pve_host_backup_signal_times
  changed_when: false
  failed_when: pve_host_backup_signal_times.stdout | default('0') | int < 1
  when: not ansible_check_mode
