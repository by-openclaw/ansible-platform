---
- name: "Storage | Pool state"
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, health, "{{ pve_host_zfs_pool }}"]
  register: pve_storage_pool
  changed_when: false
  check_mode: false   # read-only probe

- name: "Storage | Logical volumes and physical drives (controller)"
  ansible.builtin.command:
    argv: [ssacli, ctrl, "slot={{ pve_host_smartarray_slot }}", "{{ item }}", all, show, status]
  loop: [ld, pd]
  register: pve_storage_state
  changed_when: false
  check_mode: false   # read-only probe

- name: "Storage | Facts of the report"
  ansible.builtin.set_fact:
    pve_storage_pool_state: "{{ pve_storage_pool.stdout | trim }}"
    pve_storage_ld_failed: >-
      {{ (pve_storage_state.results | selectattr('item', 'eq', 'ld') | first).stdout_lines | select('search', 'logicaldrive')
         | reject('search', ' OK *$') | map('split') | map(attribute=1) | map('replace', ':', '') | list }}
    pve_storage_pd_not_ok: >-
      {{ (pve_storage_state.results | selectattr('item', 'eq', 'pd') | first).stdout_lines | select('search', 'physicaldrive')
         | reject('search', ' OK *$') | map('split') | map(attribute=1) | list }}
    pve_storage_pd_count: >-
      {{ (pve_storage_state.results | selectattr('item', 'eq', 'pd') | first).stdout_lines | select('search', 'physicaldrive') | list | length }}

- name: "Storage | Per-drive SMART record (through the controller)"
  ansible.builtin.command:
    argv: [smartctl, -a, -d, "cciss,{{ item }}", "{{ pve_host_smartarray_device }}"]
  loop: "{{ range(0, pve_storage_pd_count | int) | list }}"
  register: pve_storage_smart
  changed_when: false
  failed_when: false   # smartctl's exit status is a bit mask of findings, not a failed read
  check_mode: false   # read-only probe

# Per bay: the health word, the grown defect list, and the uncorrected errors summed over the
# read, write and verify rows of the error counter log (their last column).
- name: "Storage | Per-drive wear"
  ansible.builtin.set_fact:
    pve_storage_wear: >-
      {%- set out = [] -%}
      {%- for r in pve_storage_smart.results -%}
        {%- set health = r.stdout | default('') | regex_search('SMART Health Status: *(\\S.*)', '\\1') -%}
        {%- set grown = r.stdout | default('') | regex_search('grown defect list: *(\\S+)', '\\1') -%}
        {%- set uncorrected = r.stdout_lines | default([]) | select('match', '(read|write|verify):') | map('split') | map('last') | map('float') | sum | int -%}
        {%- set _ = out.append('bay ' ~ (r.item + 1) ~ ' health=' ~ ((health | first | trim) if health else '?')
                               ~ ' grown_defects=' ~ ((grown | first) if grown else '?') ~ ' uncorrected=' ~ uncorrected) -%}
      {%- endfor -%}
      {{ out }}

- name: "Storage | Report"
  ansible.builtin.debug:
    msg:
      - "pool {{ pve_host_zfs_pool }}: {{ pve_storage_pool_state }}"
      - "logical volumes not OK: {{ pve_storage_ld_failed | default([], true) }}"
      - "physical drives not OK: {{ pve_storage_pd_not_ok | default([], true) }}"
      - "drive wear (bay, health, grown defects, uncorrected errors):"
      - "{{ pve_storage_wear }}"

# Repair: only a volume whose physical drive the controller reports OK (a failed drive needs a
# replacement, not a re-enable).
- name: "Storage | Re-enable failed logical volumes (their physical drives are OK)"
  ansible.builtin.command:
    argv: [ssacli, ctrl, "slot={{ pve_host_smartarray_slot }}", ld, "{{ item }}", modify, reenable, forced]
  loop: "{{ pve_storage_ld_failed }}"
  when:
    - pve_storage_reenable | bool
    - pve_storage_pd_not_ok | length == 0
  changed_when: true
  register: pve_storage_reenabled

# The kernel re-attaches the disk and ZFS takes it back a few seconds after the controller's
# answer: waiting for "the resilver" before it has begun returns at once.
- name: "Storage | Wait until ZFS has taken the volume back"
  ansible.builtin.command:
    argv: [zpool, list, -H, -o, health, "{{ pve_host_zfs_pool }}"]
  register: pve_storage_pool_back
  until: pve_storage_pool_back.stdout | trim == 'ONLINE'
  retries: "{{ pve_storage_reattach_retries }}"
  delay: "{{ pve_storage_reattach_delay }}"
  when: pve_storage_reenabled is changed
  changed_when: false

- name: "Storage | Wait for the resilver"
  ansible.builtin.command:
    argv: [zpool, wait, -t, resilver, "{{ pve_host_zfs_pool }}"]
  when: pve_storage_reenabled is changed
  changed_when: false

# Replace: a member moves to another volume of the controller (a new drive, or a volume nothing
# uses) and the volume it leaves is retired — tasks/storage_replace.yml.
- name: "Storage | Replace a member by another volume"
  ansible.builtin.include_tasks: storage_replace.yml
  when: pve_storage_replace_ld | string | length > 0

- name: "Storage | Scrub the pool and wait (every block read and verified)"
  ansible.builtin.command:
    argv: [zpool, scrub, -w, "{{ pve_host_zfs_pool }}"]
  when: pve_storage_reenabled is changed or pve_storage_replaced | default(false) | bool or pve_storage_scrub | bool
  changed_when: true
  async: 7200
  poll: 30
  # ZFS refuses a scrub while a resilver runs (2026-10-08: the resilver began after the wait
  # above had returned, and the play stopped here with the pool repaired but not verified).
  register: pve_storage_scrub_run
  until: pve_storage_scrub_run is not failed or 'currently resilvering' not in (pve_storage_scrub_run.stderr | default(''))
  retries: "{{ pve_storage_scrub_retries }}"
  delay: "{{ pve_storage_scrub_retry_delay }}"

- name: "Storage | Pool after the run"
  ansible.builtin.command:
    argv: [zpool, status, "{{ pve_host_zfs_pool }}"]
  register: pve_storage_after
  changed_when: false
  check_mode: false   # read-only probe

- name: "Storage | The pool is ONLINE without errors"
  ansible.builtin.assert:
    that:
      - "'state: ONLINE' in pve_storage_after.stdout"
      - "'errors: No known data errors' in pve_storage_after.stdout"
    fail_msg: "{{ pve_storage_after.stdout_lines | select('search', 'state:|scan:|errors:|DEGRADED|REMOVED|FAULTED|UNAVAIL') | list }}"
    success_msg: "{{ pve_storage_after.stdout_lines | select('search', 'state:|scan:|errors:') | map('trim') | list }}"
