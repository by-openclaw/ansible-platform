---
# Cold-start sequence (pve_host_boot_order): `startup: order=N,up=S` on each guest, set online.
- name: "PVE host | Guest configuration files of this node"
  ansible.builtin.find:
    paths: "{{ pve_host_guest_config_dirs | map(attribute='path') | list }}"
    patterns: "*.conf"
  register: pve_host_boot_configs
  check_mode: false   # read-only probe

# One line per key found: <file>:<key>: <value>. A file's own configuration comes before its
# snapshot sections, so the first occurrence of a key is the current value.
- name: "PVE host | Name and current startup of each guest"
  ansible.builtin.command:
    argv: "{{ ['grep', '-H', '-E', '^(' ~ (((pve_host_guest_config_dirs | map(attribute='name_key') | list) + ['startup']) | unique | join('|')) ~ '):']
              + (pve_host_boot_configs.files | map(attribute='path') | sort | list) }}"
  register: pve_host_boot_guests
  changed_when: false
  failed_when: pve_host_boot_guests.rc > 1   # 1 = no guest on this node
  check_mode: false   # read-only probe
  when: pve_host_boot_configs.files | length > 0

- name: "PVE host | Guest table"
  ansible.builtin.set_fact:
    pve_host_boot_table: >-
      {%- set out = {} -%}
      {%- for d in pve_host_guest_config_dirs -%}
        {%- set found = {} -%}
        {%- for line in pve_host_boot_guests.stdout_lines | default([]) if line.startswith(d.path ~ '/') -%}
          {%- set parts = line.split(':', 2) -%}
          {%- set id = (parts[0] | basename | splitext)[0] -%}
          {%- if id not in found -%}{%- set _ = found.update({id: {}}) -%}{%- endif -%}
          {%- if parts[1] not in found[id] -%}
            {%- set _ = found[id].update({parts[1]: (parts[2].split() | first | default(''))}) -%}
          {%- endif -%}
        {%- endfor -%}
        {%- for id, conf in found.items() if d.name_key in conf -%}
          {%- set _ = out.update({conf[d.name_key]: {'id': id, 'kind': d.kind, 'startup': conf.startup | default('')}}) -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: "PVE host | Every guest of the sequence exists on this node"
  ansible.builtin.assert:
    that: pve_host_boot_order | map(attribute='guest') | reject('in', pve_host_boot_table.keys()) | list | length == 0
    fail_msg: "not on this node: {{ pve_host_boot_order | map(attribute='guest') | reject('in', pve_host_boot_table.keys()) | list }}"
    quiet: true

- name: "PVE host | Set the start order and delay (online, no restart)"
  ansible.builtin.command:
    argv:
      - "{{ pve_host_boot_table[item.guest].kind }}"
      - set
      - "{{ pve_host_boot_table[item.guest].id }}"
      - --startup
      - "order={{ item.order }},up={{ item.up }}"
  loop: "{{ pve_host_boot_order }}"
  loop_control:
    label: "{{ item.guest }} order={{ item.order }} up={{ item.up }}"
  when: pve_host_boot_table[item.guest].startup != 'order=' ~ item.order ~ ',up=' ~ item.up
  changed_when: true

- name: "PVE host | Running guests without a place in the sequence (they start last)"
  ansible.builtin.debug:
    msg: "{{ pve_host_boot_table.keys() | reject('in', pve_host_boot_order | map(attribute='guest') | list) | reject('match', '^debian-.*-cloud$') | list }}"
