---
- name: "PVE host | Proxmox archive keyring present"
  ansible.builtin.stat:
    path: "{{ pve_host_repo_keyring }}"
  register: pve_host_keyring

- name: "PVE host | Proxmox archive keyring must exist (ships with the installer / proxmox-archive-keyring)"
  ansible.builtin.assert:
    that: pve_host_keyring.stat.exists
    fail_msg: "{{ pve_host_repo_keyring }} missing — install proxmox-archive-keyring first"
    quiet: true

- name: "PVE host | deb822 source: Proxmox VE ({{ pve_host_repo_pve_component }})"
  ansible.builtin.template:
    src: proxmox.sources.j2
    dest: /etc/apt/sources.list.d/proxmox.sources
    owner: root
    group: root
    mode: "0644"
  register: pve_host_src_pve

- name: "PVE host | deb822 source: Ceph ({{ pve_host_repo_ceph_component }})"
  ansible.builtin.template:
    src: ceph.sources.j2
    dest: /etc/apt/sources.list.d/ceph.sources
    owner: root
    group: root
    mode: "0644"
  when: pve_host_repo_ceph_enabled | bool
  register: pve_host_src_ceph

- name: "PVE host | Install-time leftovers removed (enterprise repo, legacy files)"
  ansible.builtin.file:
    path: "/etc/apt/sources.list.d/{{ item }}"
    state: absent
  loop: "{{ pve_host_repo_files_absent }}"
  register: pve_host_src_gone

- name: "PVE host | Legacy one-line Proxmox entries removed from sources.list (deb822 files own them now)"
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: "{{ pve_host_legacy_sources_regex }}"
    state: absent
  register: pve_host_src_legacy

- name: "PVE host | Refresh the package index when a source changed"
  ansible.builtin.apt:
    update_cache: true
  when: pve_host_src_pve is changed or pve_host_src_ceph is changed or pve_host_src_gone is changed or pve_host_src_legacy is changed
