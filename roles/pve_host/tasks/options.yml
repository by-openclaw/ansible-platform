---
- name: "PVE host | Datacenter options today"
  ansible.builtin.command:
    argv: [pvesh, get, /cluster/options, --output-format, json]
  register: pve_host_opts
  changed_when: false
  check_mode: false

- name: "PVE host | Bind the current options"
  ansible.builtin.set_fact:
    pve_host_opts_now: "{{ pve_host_opts.stdout | from_json }}"

- name: "PVE host | root@pam today"
  ansible.builtin.command:
    argv: [pvesh, get, /access/users/root@pam, --output-format, json]
  register: pve_host_root_user
  changed_when: false
  check_mode: false

- name: "PVE host | root@pam's address = the ops mailbox (only on drift)"
  ansible.builtin.command:
    argv: [pvesh, set, /access/users/root@pam, --email, "{{ pve_host_root_email }}"]
  when: (pve_host_root_user.stdout | from_json).email | default('') != pve_host_root_email
  changed_when: true

- name: "PVE host | Set the datacenter options (only on drift): email_from, keyboard"
  ansible.builtin.command:
    argv: [pvesh, set, /cluster/options, --email_from, "{{ pve_host_email_from }}", --keyboard, "{{ pve_host_keyboard }}"]
  when: >-
    (pve_host_opts_now.email_from | default('')) != pve_host_email_from
    or (pve_host_opts_now.keyboard | default('')) != pve_host_keyboard
  changed_when: true

# --- the local dir storage's declared content set ----------------------------------------
# A fresh node ships `local` without the snippets content type; the bpg Terraform provider
# uploads cloud-init user-data snippets there over SSH (vm-linux vendor-data, vm-windows).
- name: "PVE host | The local dir storage today: {{ pve_host_local_storage }}"
  ansible.builtin.command:
    argv: [pvesh, get, "/storage/{{ pve_host_local_storage }}", --output-format, json]
  register: pve_host_local_storage_now
  changed_when: false
  check_mode: false

- name: "PVE host | Its declared content set (only on drift)"
  ansible.builtin.command:
    argv: [pvesm, set, "{{ pve_host_local_storage }}",
           --content, "{{ pve_host_local_storage_content | sort | join(',') }}"]
  when: >-
    ((pve_host_local_storage_now.stdout | from_json).content | split(',') | map('trim') | sort | list)
    != (pve_host_local_storage_content | sort | list)
  changed_when: true
