---
- name: "PVE host | Apt sources as code"
  ansible.builtin.import_tasks: apt.yml
  tags: [pve_host, apt]

- name: "PVE host | Vendor storage CLI (HPE Smart Array)"
  ansible.builtin.import_tasks: vendor_tools.yml
  when: pve_host_smartarray_cli | bool
  tags: [pve_host, apt, vendor]

- name: "PVE host | Datacenter options"
  ansible.builtin.import_tasks: options.yml
  tags: [pve_host, options]

- name: "PVE host | Identity: local admin, OIDC realm, ACLs"
  ansible.builtin.import_tasks: identity.yml
  tags: [pve_host, identity]

- name: "PVE host | WAN bridges: no RA / autoconf on the host"
  ansible.builtin.import_tasks: wan_bridges.yml
  tags: [pve_host, network]

- name: "PVE host | Static routes to the guest zones (persistent + now)"
  ansible.builtin.import_tasks: routes.yml
  tags: [pve_host, routes]

- name: "PVE host | Cold-start sequence of the guests"
  ansible.builtin.import_tasks: boot_order.yml
  when: pve_host_boot_order | length > 0
  tags: [pve_host, boot]

- name: "PVE host | Netfilter modules for the guests (preloaded at host boot)"
  ansible.builtin.import_tasks: netfilter.yml
  tags: [pve_host, netfilter]

- name: "PVE host | No ufw on a node (the Proxmox firewall is the host firewall)"
  ansible.builtin.import_tasks: ufw.yml
  tags: [pve_host, firewall]

- name: "PVE host | Proxmox firewall (datacenter + host)"
  ansible.builtin.import_tasks: firewall.yml
  tags: [pve_host, firewall]

- name: "PVE host | Console certificate (the platform wildcard)"
  ansible.builtin.import_tasks: tls.yml
  when: pve_host_console_cert | bool
  tags: [pve_host, tls]

- name: "PVE host | UI route through Traefik"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: "{{ pve_host_oidc_slug }}"
    traefik_route_fqdn: "{{ pve_host_fqdn }}"
    traefik_route_backend_url: "{{ pve_host_backend_url }}"
    traefik_route_backend_insecure_skip_verify: "{{ not (pve_host_console_cert | bool) }}"   # verified once pveproxy serves the wildcard
    traefik_route_internal_only: true
  when: pve_host_route_enabled | bool
  tags: [pve_host, route]

- name: The NAS backup job (declared, converged)
  ansible.builtin.import_tasks: backup_jobs.yml
  tags: [pve_host, backup]

- name: The configuration export to PBS (declared, first run proven)
  ansible.builtin.import_tasks: config_backup.yml
  when: pve_host_config_backup_enabled | bool
  tags: [pve_host, backup]

- name: "PVE host | Release drift (the ladder playbooks/pve-host-upgrade.yml moves the node)"
  ansible.builtin.command:
    cmd: dpkg-query -W -f '${Version}' pve-manager
  register: pve_host_pve_manager_now
  changed_when: false
  check_mode: false
  tags: [pve_host, release]

- name: "PVE host | Report the release against the pin"
  ansible.builtin.debug:
    msg: >-
      pve-manager {{ pve_host_pve_manager_now.stdout }} — declared {{ pve_host_version }}
      {{ '(on the pin)' if pve_host_pve_manager_now.stdout == pve_host_version else
         '→ DRIFT: run playbooks/pve-host-upgrade.yml -e apt_release_ladder_apply=true' }}
  tags: [pve_host, release]

- name: Guest netfilter logging (DOCKER-USER audit in LXCs)
  ansible.builtin.import_tasks: netfilter_log.yml
  tags: [pve_host, netfilter]

- name: Stale labels of dead ZFS pools (declared, proven, cleared)
  ansible.builtin.import_tasks: zfs_stale_labels.yml
  when: pve_host_zfs_stale_labels | length > 0
  tags: [pve_host, zfs]

- name: Ceph daemons off (Ceph is not used on this node)
  ansible.builtin.import_tasks: ceph.yml
  when: not pve_host_ceph_enabled | bool
  tags: [pve_host, ceph]
