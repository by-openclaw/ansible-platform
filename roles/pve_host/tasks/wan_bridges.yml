---
# The WAN bridges exist only on nodes that carry the firewall's ISP legs; a node without them
# (POC DEV, 2026-11-01) must get neither the sysctl file nor the flush. The declared list is
# intersected with the bridges the node has.
- name: "PVE host | WAN bridges present on this node"
  ansible.builtin.set_fact:
    pve_host_wan_bridges_present: "{{ pve_host_wan_bridges | intersect(ansible_facts.interfaces | default([])) }}"

- name: "PVE host | No router advertisements / autoconf on the WAN bridges (persistent sysctl)"
  ansible.builtin.copy:
    dest: /etc/sysctl.d/70-pve-wan-bridges-no-ra.conf
    content: |
      # Managed by Ansible (role: pve_host) — the host takes no address from the ISPs' RAs
      {% for b in pve_host_wan_bridges_present %}
      net.ipv6.conf.{{ b }}.accept_ra = 0
      net.ipv6.conf.{{ b }}.autoconf = 0
      {% endfor %}
    owner: root
    group: root
    mode: "0644"
  register: pve_host_wan_sysctl
  when: pve_host_wan_bridges_present | length > 0

- name: "PVE host | No WAN bridge here: no sysctl file either"
  ansible.builtin.file:
    path: /etc/sysctl.d/70-pve-wan-bridges-no-ra.conf
    state: absent
  when: pve_host_wan_bridges_present | length == 0

- name: "PVE host | Apply the sysctl now"
  ansible.builtin.command:
    argv: [sysctl, -q, -p, /etc/sysctl.d/70-pve-wan-bridges-no-ra.conf]
  when: pve_host_wan_sysctl is changed
  changed_when: true

- name: "PVE host | Global v6 addresses learned on the WAN bridges (today)"
  ansible.builtin.command:
    argv: [ip, -6, -o, addr, show, dev, "{{ item }}", scope, global]
  loop: "{{ pve_host_wan_bridges_present }}"
  register: pve_host_wan_v6
  changed_when: false
  failed_when: false
  check_mode: false

- name: "PVE host | Flush the learned global v6 addresses from the WAN bridges"
  ansible.builtin.command:
    argv: [ip, -6, addr, flush, dev, "{{ item.item }}", scope, global]
  loop: "{{ pve_host_wan_v6.results | default([]) }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.rc == 0 and (item.stdout | trim | length > 0)
  changed_when: true
