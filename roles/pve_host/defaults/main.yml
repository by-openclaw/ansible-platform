---
# ==============================================================================
# Role: pve_host — the Proxmox VE hypervisor built from the repo (bare install → platform node).
# Apt sources as code, datacenter options, the Proxmox firewall (the node's host firewall —
# ufw stays off on nodes), the OIDC realm from Vault, local admin + ACLs, the UI route through
# Traefik. Every value is a variable; nothing is done by hand on the node. Idempotent.
# ==============================================================================
pve_host_domain: "{{ platform_domain }}"
pve_host_env: "{{ platform_env }}"
pve_host_node: "{{ inventory_hostname }}"

# --- apt sources (deb822) -----------------------------------------------------
pve_host_debian_suite: "{{ ansible_distribution_release }}"
pve_host_repo_keyring: /usr/share/keyrings/proxmox-archive-keyring.gpg
pve_host_repo_pve_uri: "http://download.proxmox.com/debian/pve"
pve_host_repo_pve_component: pve-no-subscription
# The declared Proxmox VE release (pve-manager). The role only REPORTS drift; the ladder
# playbooks/pve-host-upgrade.yml (roles/apt_release_ladder) moves the node — apt full-upgrade,
# a staged kernel reboots only in an owner window.
pve_host_version: "9.2.21"   # 2026-09-30 (9.2 line)
pve_host_repo_ceph_enabled: true         # the repo stays: pve-manager needs ceph-common / ceph-fuse updates
# Ceph daemons (mon/mgr/mds/osd) on this node. Storage is ZFS + PBS + NFS; a
# leftover mon + mgr restart-looped at boot. tasks/ceph.yml masks them while no
# storage uses Ceph (asserted).
pve_host_ceph_enabled: false
# Devices that still carry the labels of a DEAD ZFS pool (declared per node in the
# inventory: {device: <by-id path>, pool_guid: <the dead pool>}); tasks/zfs_stale_labels.yml
# clears them only after proving each one (see there).
pve_host_zfs_stale_labels: []
pve_host_repo_ceph_uri: "http://download.proxmox.com/debian/ceph-squid"
pve_host_repo_ceph_component: no-subscription
pve_host_repo_files_absent:            # install-time leftovers
  - pve-enterprise.list
  - pve-enterprise.sources
  - ceph.list
pve_host_legacy_sources_regex: 'download\.proxmox\.com/debian/(pve|ceph)'   # legacy one-line entries replaced by the deb822 files

# --- datacenter options -------------------------------------------------------
pve_host_email_from: "{{ platform_alert_email }}"
pve_host_keyboard: fr-be
# root@pam's address: PVE's mail-to-root notifications (e.g. a failed backup job).
pve_host_root_email: "{{ platform_ops_email }}"

# The backup liveness signal (tasks/backup_signal.yml): the series the Backup* alerts of
# roles/prometheus read, written for node_exporter's textfile collector (the Debian
# package reads this directory by default).
pve_host_backup_signal_interval: "15min"
pve_host_backup_signal_file: /var/lib/prometheus/node-exporter/platform_backup.prom
pve_host_backup_signal_filter: /etc/platform-backup-signal/backup-signal.jq

# The NAS (NFS) backup job: every guest, nightly, reports mailed to the ops mailbox.
# Matched by its storage (one job per target storage); tasks/backup_jobs.yml creates
# it when missing and `pvesh set`s any drifted setting. The PBS job (second copy)
# belongs to playbooks/pbs-pve-storage.yml, with the PBS storage it targets.
pve_host_nfs_backup_job:
  storage: "{{ platform_nfs_backup_storage }}"
  schedule: "05:00"
  comment: "Daily backup all VMs and LXCs - {{ pve_host_node }}"
  all: 1
  mode: snapshot
  compress: zstd
  enabled: 1
  mailnotification: always
  mailto: "{{ platform_ops_email }}"
  node: "{{ pve_host_node }}"
  notes-template: "Backup of {{ '{{' }}guestname{{ '}}' }} (VMID {{ '{{' }}vmid{{ '}}' }}) on node {{ '{{' }}node{{ '}}' }} - {{ platform_company | upper }} automated backup"
# Retention of the NAS copy (infra/0008; owner decision 2026-10-03): per guest, the job keeps
# 7 daily, 4 weekly and 6 monthly backups and prunes the rest after each run. It overrides the
# storage's `keep-all`; backups of guests that no longer exist are not touched (no run = no prune).
pve_host_nfs_backup_prune:
  keep-daily: 7
  keep-weekly: 4
  keep-monthly: 6

# --- Proxmox firewall (datacenter + host) ------------------------------------
pve_host_firewall_enabled: true
pve_host_firewall_log_level_in: info
pve_host_mgmt_cidrs: "{{ platform_mgmt_cidrs }}"                         # OOB + fabric (group_vars)
pve_host_ui_port: 8006
pve_host_spice_port: 3128
pve_host_ssh_port: "{{ platform_ssh_port }}"
pve_host_metrics_ports: [9100]
pve_host_ui_sources: >-
  {{ pve_host_mgmt_cidrs
     + (traefik_admin_cidrs | default([]))
     + (groups['traefik'] | default([]) | map('extract', hostvars, 'ansible_host') | list) }}
pve_host_ssh_sources: >-
  {{ pve_host_mgmt_cidrs
     + (groups['jumpserver'] | default([]) | map('extract', hostvars, 'ansible_host') | list) }}
pve_host_metrics_sources: "{{ groups['monitoring'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
pve_host_icmp_sources: "{{ platform_trusted_cidrs }}"
pve_host_guard_from_controller: true      # after enabling: SSH + UI must still answer from the controller, else roll back

# --- identity: local admin, OIDC realm (client minted by roles/authentik → Vault), ACLs ------
pve_host_local_admin: "{{ platform_org }}"     # <org>@pam = the OOB/local admin (identity/0004)
pve_host_oidc_realm: authentik
pve_host_oidc_slug: proxmox
pve_host_oidc_vault_path: "{{ pve_host_env }}/pve/oidc"
pve_host_oidc_issuer: "https://authentik.{{ pve_host_domain }}/application/o/{{ pve_host_oidc_slug }}/"
pve_host_oidc_scopes: "openid profile email groups"
pve_host_oidc_admin_group: "{{ platform_service_groups.proxmox.admin }}"      # Authentik group; PVE stores it as <group>-<realm>
pve_host_oidc_add_only_options: ['username-claim']   # accepted by "realm add" but not by "realm modify" (PVE 9)
pve_host_acls:
  - { path: "/", role: Administrator, kind: user, ugid: "{{ pve_host_local_admin }}@pam" }
  - { path: "/", role: Administrator, kind: group, ugid: "{{ pve_host_oidc_admin_group }}-{{ pve_host_oidc_realm }}" }

# --- Automation identities (identity/0002: every identity declared, reconciled, least privilege) --
# Custom roles with their exact privilege set (created or corrected on drift).
pve_host_roles:
  TerraformRole:   # infra-terraform-proxmox: guests, storage allocation, SDN — no user/ACL/realm rights
    - Datastore.Allocate
    - Datastore.AllocateSpace
    - Datastore.AllocateTemplate
    - Datastore.Audit
    - SDN.Allocate
    - SDN.Audit
    - SDN.Use
    - Sys.Audit
    - Sys.Modify
    - VM.Allocate
    - VM.Audit
    - VM.Clone
    - VM.Config.CDROM
    - VM.Config.CPU
    - VM.Config.Cloudinit
    - VM.Config.Disk
    - VM.Config.HWType
    - VM.Config.Memory
    - VM.Config.Network
    - VM.Config.Options
    - VM.GuestAgent.Audit
    - VM.GuestAgent.Unrestricted
    - VM.Migrate
    - VM.PowerMgmt
# Service accounts in the local `pve` realm: no password (their API tokens are the credential,
# privilege-separated), ACLs on the user (the ceiling) and on each token (the effective rights).
# A declared token that does not exist is minted ONCE and stored in Vault
# (`{{ pve_host_tokens_vault_prefix }}/<user>-<token>`); an existing token is never re-minted.
# ACL entries on these identities that are not declared here are removed (least privilege).
pve_host_tokens_vault_prefix: "{{ pve_host_env }}/proxmox/tokens"
pve_host_service_accounts:
  - user: "svc-rune@pve"
    comment: "{{ platform_company | upper }} automation agent — infra ops, Terraform, audit"
    acls: [{ path: "/", role: Administrator }]          # the ceiling for its privsep tokens
    tokens:
      - { id: terraform, acls: [{ path: "/", role: TerraformRole }] }   # infra-terraform-proxmox provider
      - { id: admin, acls: [{ path: "/", role: Administrator }] }   # platform automation (Vault {env}/proxmox/admin)
  - user: "svc-opus@pve"
    comment: "{{ platform_company | upper }} automation — audit, read-only"
    acls: [{ path: "/", role: PVEAuditor }]
    tokens:
      - { id: audit, acls: [{ path: "/", role: PVEAuditor }] }   # read-only: was PVEAdmin before 2026-10-03

# --- UI through Traefik (internal / admin-only) ------------------------------
pve_host_route_enabled: true
pve_host_fqdn: "{{ pve_host_oidc_slug }}.{{ pve_host_domain }}"
# The console certificate (security/0004: no self-signed certificate): pveproxy serves the
# platform wildcard, distributed like every other consumer's copy (roles/tls_cert, refreshed by
# playbooks/certs-sync.yml). The edge then VERIFIES the backend, by the node's own name.
pve_host_console_cert: true
pve_host_node_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"
pve_host_cert_dir: "/etc/ssl/{{ platform_org }}"
pve_host_cert_crt: "{{ pve_host_cert_dir }}/wildcard.crt"
pve_host_cert_key: "{{ pve_host_cert_dir }}/wildcard.key"
pve_host_backend_url: "https://{{ pve_host_node_fqdn if pve_host_console_cert | bool else ansible_host }}:{{ pve_host_ui_port }}"

# --- netfilter modules for the GUESTS ---------------------------------------------------
# Unprivileged containers cannot load kernel modules; their ufw/iptables rules need the
# matches loaded on the HOST. At boot, guests starting before the host had loaded them failed
# ufw-init ("No chain/target/match by that name") and locked themselves out (2026-09-21).
# Preload once at host boot, before any guest starts.
pve_host_guest_netfilter_modules:
  - nf_conntrack
  - nf_nat
  - nf_log_syslog
  - nft_compat
  - nft_ct
  - nft_limit
  - nft_masq
  - xt_addrtype
  - xt_comment
  - xt_conntrack
  - xt_hl
  - xt_limit
  - xt_LOG
  - xt_mark
  - xt_MASQUERADE
  - xt_multiport
  - xt_nat
  - xt_NFLOG
  - xt_physdev
  - xt_recent
  - xt_set
  - xt_state
  - xt_tcpudp
  - ipt_REJECT
  - ip6t_REJECT
  - ip6t_rt

# --- static routes of the node ---------------------------------------------------------
# The node sits on the OOB plane; the guest zones are behind the prod firewall's OOB leg.
# Without these, replies to a guest leave via the OOB default gateway and every guest→node
# connection times out (found after the 2026-09-21 reboot: the routes had been added by hand).
pve_host_oob_bridge: vmbrOOB
pve_host_static_routes:
  - { dest: "{{ platform_internal_cidr4 }}", via: "{{ hostvars[groups['opnsense'][0]].ansible_host }}", comment: "guest zones via the prod firewall (OOB leg)" }

# --- WAN bridges: the host must not take an address from the ISPs' router advertisements ------
# Found 2026-09-21: the node held a public Telenet v6 (SLAAC on vmbrWAN2) and a v6 default route
# through it. The bridges only carry the firewall VM's WAN legs; the host stays v4/OOB only.
pve_host_wan_bridges:
  - vmbrWAN1
  - vmbrWAN2

# --- Configuration export (infra/0008 class A: the hypervisor's own configuration) ---------------
# Daily host backup of /etc/pve (pmxcfs: guests, storage, firewall, users, jobs), /etc/network and
# /etc/apt to the PBS datastore the guests already use — same token (the PVE storage's secret file),
# same encryption key (the storage's key file): no new secret. The repository is read from the
# storage definition pbs-pve-storage.yml wrote.
pve_host_config_backup_enabled: true
pve_host_config_backup_storage: pbs                 # the `pbs:` storage id in /etc/pve/storage.cfg
pve_host_config_backup_schedule: "*-*-* 04:30:00"
pve_host_config_backup_paths:
  pve-etc: /etc/pve
  network: /etc/network
  apt: /etc/apt

# --- Vendor storage CLI (HPE Smart Array) ------------------------------------------------------
# On an HPE ProLiant whose Smart Array runs in RAID mode, every pool disk is a single-drive
# logical volume: the controller — not the OS — knows the bay, the health and the predictive
# failures of each physical drive, and a replaced drive stays invisible to the OS until its
# logical volume exists. `ssacli` (HPE's CLI, from HPE's own repository) reads and manages that
# without a reboot. Off by default; a node that carries the controller turns it on in the inventory.
pve_host_smartarray_cli: false
pve_host_hpe_repo_url: "https://downloads.linux.hpe.com/SDR/repo/mcp"
pve_host_hpe_repo_suite: "{{ ansible_distribution_release }}/current"
pve_host_hpe_repo_keys:        # HPE's signing keys, pinned by checksum
  - {name: hpe-mcp-key1.asc, url: "https://downloads.linux.hpe.com/SDR/hpePublicKey2048_key1.pub", sha256: "3fe679e5ca629526e3927b7aa7d58bc58f173d49cb1c00f163eea761c39b718e"}  # pragma: allowlist secret — public key checksum
  - {name: hpe-mcp-key2.asc, url: "https://downloads.linux.hpe.com/SDR/hpePublicKey2048_key2.pub", sha256: "60888e9309eda5f45428605c80d7210fed5fe0999a774b1a480da8fafeceb902"}  # pragma: allowlist secret — public key checksum
pve_host_smartarray_package: ssacli

# --- Cold-start sequence of the guests ---------------------------------------------------------
# PVE starts guests in ascending `order` and waits `up` seconds after each one before the next;
# a guest without an entry starts last. Without a sequence every guest starts in the same second:
# on 2026-10-03 the node's load reached 270 on 12 CPUs, the firewall VM came up fifth, and the
# platform needed 17 minutes to settle. Declared per node in the inventory (guest = the name PVE
# shows; the VMID is read from the node — Terraform and the firewall seed own the ids).
pve_host_boot_order: []        # [{guest: <name>, order: <n>, up: <seconds>}]

# --- Storage health and repair (playbooks/pve-storage-health.yml) --------------------------------
# Report: the pool, the controller's logical volumes and physical drives, per-drive wear (SMART).
# Repair (pve_storage_reenable=true): a logical volume that is `Failed` while its physical drive is
# `OK` is re-enabled, ZFS resilvers the mirror, the pool is scrubbed and must end ONLINE with 0
# errors — the sequence run by hand on 2026-10-03, now a play.
pve_host_zfs_pool: tank
pve_host_smartarray_slot: 0
pve_storage_reenable: false
pve_storage_scrub: false            # a scrub after the report (always done after a repair)
