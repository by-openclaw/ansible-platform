---
- name: "k3s | Kernel prerequisites (modules + sysctl)"
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k3s.conf
    content: "br_netfilter\noverlay\n"
    mode: "0644"

- name: "k3s | sysctl for bridged traffic + forwarding"
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    sysctl_file: /etc/sysctl.d/90-k3s.conf
    sysctl_set: true
    reload: true
  loop:
    - { k: net.bridge.bridge-nf-call-iptables, v: "1" }
    - { k: net.ipv4.ip_forward, v: "1" }
    - { k: net.ipv6.conf.all.forwarding, v: "1" }
  failed_when: false   # br_netfilter loads at boot; first run may precede it

- name: "k3s | Kernel defaults the kubelet enforces (protect-kernel-defaults=true refuses to start otherwise)"
  ansible.posix.sysctl:
    name: "{{ item.k }}"
    value: "{{ item.v }}"
    sysctl_file: /etc/sysctl.d/90-kubelet.conf
    sysctl_set: true
    reload: true
  loop:
    - { k: vm.overcommit_memory, v: "1" }
    - { k: kernel.panic, v: "10" }
    - { k: kernel.panic_on_oops, v: "1" }
    - { k: vm.panic_on_oom, v: "0" }

- name: "k3s | Directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop: [/etc/rancher/k3s, /var/lib/rancher/k3s]

- name: "k3s | Pinned binary ({{ k3s_version }}, checksum verified)"
  ansible.builtin.get_url:
    url: "{{ k3s_download_url }}"
    dest: /usr/local/bin/k3s
    checksum: "sha256:{{ k3s_sha256 }}"
    owner: root
    group: root
    mode: "0755"
  notify: Restart k3s

- name: "k3s | kubectl / crictl / ctr symlinks"
  ansible.builtin.file:
    src: /usr/local/bin/k3s
    dest: "/usr/local/bin/{{ item }}"
    state: link
    force: true    # --check on a fresh host: the binary is not downloaded yet, the link target may be absent
  loop: [kubectl, crictl, ctr]

- name: "k3s | API audit log directory + policy (SEC-23 / INF-29)"
  ansible.builtin.file:
    path: "{{ k3s_audit_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  when: k3s_audit_enabled | bool

- name: "k3s | API audit policy"
  ansible.builtin.template:
    src: audit-policy.yaml.j2
    dest: /etc/rancher/k3s/audit-policy.yaml
    owner: root
    group: root
    mode: "0640"
  notify: Restart k3s
  when: k3s_audit_enabled | bool

# The API server validates the IdP's tokens itself, so it needs the OIDC client id before it starts.
- name: "k3s | Headlamp's OIDC client (Vault; minted by the authentik play)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ k3s_headlamp_vault_path }}"
    vault_secret_optional: true
  when: k3s_headlamp_enabled | bool

- name: "k3s | Bind the OIDC client"
  ansible.builtin.set_fact:
    k3s_headlamp_oidc: "{{ vault_secret_result | default({}) if k3s_headlamp_enabled | bool else {} }}"
  no_log: true

- name: "k3s | Server configuration"
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: "k3s | Registry mirrors (Docker Hub through Harbor)"
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    owner: root
    group: root
    mode: "0600"
  notify: Restart k3s

- name: "k3s | systemd unit (rendered)"
  ansible.builtin.template:
    src: k3s.service.j2
    dest: /etc/systemd/system/k3s.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: "k3s | Enabled + running"
  ansible.builtin.systemd_service:
    name: k3s
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: "k3s | Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "k3s | Node Ready (read-only)"
  ansible.builtin.command:
    cmd: kubectl get nodes --no-headers
  register: k3s_nodes
  retries: 30
  delay: 10
  until: "' Ready ' in k3s_nodes.stdout"
  changed_when: false
  check_mode: false
  when: not ansible_check_mode

# Pod Security Admission: enforce + warn at the declared level per namespace (idempotent labels).
- name: "k3s | Pod Security Admission labels today"
  ansible.builtin.command:
    argv: [kubectl, get, ns, -o, json]
  register: k3s_ns_now
  changed_when: false
  check_mode: false

- name: "k3s | Pod Security Admission per namespace (enforce + warn)"
  ansible.builtin.command:
    argv: [kubectl, label, ns, "{{ item.key }}", "pod-security.kubernetes.io/enforce={{ item.value }}", "pod-security.kubernetes.io/warn={{ item.value }}", --overwrite]
  loop: "{{ k3s_pod_security | dict2items }}"
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  vars:
    k3s_ns_labels: >-
      {{ (k3s_ns_now.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', item.key)
         | map(attribute='metadata.labels', default={}) | first | default({}) }}
  when:
    - (k3s_ns_now.stdout | from_json)['items'] | selectattr('metadata.name', 'equalto', item.key) | list | length > 0
    - k3s_ns_labels['pod-security.kubernetes.io/enforce'] | default('') != item.value
      or k3s_ns_labels['pod-security.kubernetes.io/warn'] | default('') != item.value
  changed_when: true

- name: "k3s | k9s {{ k3s_k9s_version }} archive (pinned, checksum verified)"
  ansible.builtin.get_url:
    url: "{{ k3s_k9s_url }}"
    dest: "/var/cache/k9s-{{ k3s_k9s_version }}.tar.gz"
    checksum: "sha256:{{ k3s_k9s_sha256 }}"
    mode: "0644"

- name: "k3s | k9s binary from the verified archive"
  ansible.builtin.unarchive:
    src: "/var/cache/k9s-{{ k3s_k9s_version }}.tar.gz"
    remote_src: true
    dest: /usr/local/bin
    include: [k9s]
    owner: root
    group: root
    mode: "0755"
    creates: "/usr/local/bin/.k9s-{{ k3s_k9s_version }}"

- name: "k3s | k9s version marker"
  ansible.builtin.copy:
    dest: "/usr/local/bin/.k9s-{{ k3s_k9s_version }}"
    content: "{{ k3s_k9s_sha256 }}\n"
    mode: "0644"

- name: "k3s | Headlamp (web UI, OIDC)"
  ansible.builtin.include_tasks: headlamp.yml
  when: k3s_headlamp_enabled | bool

- name: "k3s | CI deployers per namespace"
  ansible.builtin.include_tasks: ci-namespace.yml
  loop: "{{ k3s_ci_namespaces }}"
  loop_control:
    loop_var: ns
    label: "{{ ns.name }}"
  when: not ansible_check_mode

- name: "k3s | Admit the ingress and API (roles/host_firewall owns every ufw rule)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules:
      - port: "{{ k3s_ingress_http_port | string }}"
        proto: tcp
        from: ["{{ platform_internal_cidr4 }}", "{{ platform_vpn_cidr }}"]
        comment: "k3s ingress"
      - port: "6443"
        proto: tcp
        from: ["{{ platform_internal_cidr4 }}", "{{ platform_vpn_cidr }}"]
        comment: "k3s API"
- name: "k3s | Traefik routes for the published apps"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: "{{ item.name }}"
    traefik_route_fqdn: "{{ item.fqdn }}"
    traefik_route_backend_url: "http://{{ k3s_node_ip }}:{{ k3s_ingress_http_port }}"
    traefik_route_internal_only: true
    traefik_route_forward_auth: true
  loop: "{{ k3s_published_apps }}"
  loop_control:
    label: "{{ item.name }} → {{ item.fqdn }}"
  tags: [route]
