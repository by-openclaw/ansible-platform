---
# One namespace + a namespace-scoped deployer: ServiceAccount, Role (admin in the
# namespace), long-lived token Secret; kubeconfig → Vault <k3s_vault_path>/ci-<ns>
# and → the GitLab project's CI variable KUBECONFIG_B64 (masked, protected).
- name: "k3s | {{ ns.name }} | Namespace + deployer manifests"
  ansible.builtin.copy:
    dest: "/etc/rancher/k3s/ci-{{ ns.name }}.yaml"
    mode: "0600"
    content: |
      apiVersion: v1
      kind: Namespace
      metadata: { name: {{ ns.name }} }
      ---
      apiVersion: v1
      kind: ServiceAccount
      metadata: { name: gitlab-deployer, namespace: {{ ns.name }} }
      ---
      apiVersion: rbac.authorization.k8s.io/v1
      kind: RoleBinding
      metadata: { name: gitlab-deployer-admin, namespace: {{ ns.name }} }
      roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: admin }
      subjects: [{ kind: ServiceAccount, name: gitlab-deployer, namespace: {{ ns.name }} }]
      ---
      apiVersion: v1
      kind: Secret
      metadata:
        name: {{ k3s_ci_deployer_object }}
        namespace: {{ ns.name }}
        annotations: { kubernetes.io/service-account.name: gitlab-deployer }
      type: kubernetes.io/service-account-token
  register: k3s_ns_manifest

- name: "k3s | {{ ns.name }} | Apply (kubectl, server-side idempotent)"
  ansible.builtin.command:
    cmd: kubectl apply -f /etc/rancher/k3s/ci-{{ ns.name }}.yaml
  register: k3s_ns_apply
  changed_when: "' created' in k3s_ns_apply.stdout or ' configured' in k3s_ns_apply.stdout"

# The token controller fills the Secret a moment after it is created: ask again until the token
# is there. The Secret comes back as JSON; its fields are read in the next task.
- name: "k3s | Deployer token + CA (read-only): {{ ns.name }}"
  ansible.builtin.command:
    argv: [kubectl, -n, "{{ ns.name }}", get, secret, "{{ k3s_ci_deployer_object }}", -o, json]
  register: k3s_ns_token
  until: (k3s_ns_token.stdout | default('', true) | default('{}', true) | from_json).data.token | default('') | length > 0
  retries: "{{ k3s_ci_deployer_wait_retries }}"
  delay: "{{ k3s_ci_deployer_wait_delay }}"
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "k3s | Kubeconfig (base64) for the CI deployer: {{ ns.name }}"
  ansible.builtin.set_fact:
    k3s_ns_kubeconfig_b64: >-
      {{ {'apiVersion': 'v1', 'kind': 'Config',
          'clusters': [{'name': 'k3s', 'cluster': {'server': 'https://' ~ k3s_node_ip ~ ':6443',
                                                  'certificate-authority-data': k3s_ns_secret.data['ca.crt']}}],
          'users': [{'name': 'gitlab-deployer', 'user': {'token': (k3s_ns_secret.data.token | b64decode)}}],
          'contexts': [{'name': ns.name, 'context': {'cluster': 'k3s', 'user': 'gitlab-deployer', 'namespace': ns.name}}],
          'current-context': ns.name} | to_nice_yaml | b64encode }}
  vars:
    k3s_ns_secret: "{{ k3s_ns_token.stdout | from_json }}"
  no_log: true

- name: "k3s | Kubeconfig → Vault (get-or-create): {{ ns.name }}"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ k3s_vault_path }}/ci-{{ ns.name }}"
    vault_secret_init:
      kubeconfig_b64: "{{ k3s_ns_kubeconfig_b64 }}"
      gitlab_project: "{{ ns.gitlab_project }}"
      _note: "namespace-scoped k3s deployer for GitLab CI (roles/k3s); rewritten whenever the SA token changes"

# The SA token is the source of truth: a recreated cluster/SA yields a new token and the
# escrowed kubeconfig must follow (otherwise CI deploys with a dead token). Idempotent:
# nothing is written when Vault already holds the live one.
- name: "k3s | {{ ns.name }} | Kubeconfig → Vault (rewrite when the live token differs)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ k3s_vault_path }}/ci-{{ ns.name }}"
    vault_secret_init: {}
    vault_secret_force_fields:
      kubeconfig_b64: "{{ k3s_ns_kubeconfig_b64 }}"
      gitlab_project: "{{ ns.gitlab_project }}"
      _note: "namespace-scoped k3s deployer for GitLab CI (roles/k3s); rewritten whenever the SA token changes"
  when: vault_secret_result.kubeconfig_b64 != k3s_ns_kubeconfig_b64

# Through GitLab's REST API (roles/gitlab_api), on the GitLab host: the value travels in the body
# of the module call. Vault holds the live kubeconfig at this point (written just above), so the
# variable is given the same value.
- name: "k3s | {{ ns.name }} | GitLab CI variable KUBECONFIG_B64 on {{ ns.gitlab_project }} (masked, protected)"
  ansible.builtin.include_role:
    name: gitlab_api
    tasks_from: project_variable
    apply:
      delegate_to: "{{ k3s_gitlab_host }}"
  vars:
    gitlab_api_project: "{{ ns.gitlab_project }}"
    gitlab_api_project_variable:
      key: KUBECONFIG_B64
      value: "{{ k3s_ns_kubeconfig_b64 }}"
      masked: true
      protected: true
      raw: true
