---
# ==============================================================================
# Role: k3s — single-node Kubernetes (k3s) on vm-k3s-01: the application platform.
# Binary from the pinned GitHub release (checksum verified), unit RENDERED by the
# role (never the vendor install script), config + registry mirrors declared here.
# Publishing path: GitLab CI (Kaniko → GitLab registry) → kubectl with a
# namespace-scoped deployer → k3s ingress (embedded Traefik, HTTP only) ←
# platform Traefik (TLS, SSO forwardAuth) per app route.
# ==============================================================================
k3s_version: "v1.37.1+k3s1"   # 2026-09-25 (1.37 line)
# release checksum (sha256sum-amd64.txt), not a secret
k3s_sha256: "92b94582eb7b34a8cf532e6006842b9ed215a6783cf56a3dd6271fd35243b2c0"  # pragma: allowlist secret
k3s_download_url: "https://github.com/k3s-io/k3s/releases/download/{{ k3s_version | urlencode }}/k3s"
k3s_env: "{{ platform_env }}"
k3s_node_ip: "{{ ansible_host }}"
k3s_fqdn: "{{ platform_service_fqdns.k3s }}"                 # API name (tls-san), internal only
# Apps are published as <app>.<domain> (ONE label: the Let's Encrypt wildcard covers *.<domain> only;
# a second level such as demo.apps.<domain> would get Traefik's default certificate).
k3s_ingress_http_port: 80                              # embedded Traefik (servicelb) — HTTP only, TLS is the platform Traefik's
k3s_cluster_cidr: "{{ platform_k3s_cluster_cidr4 }}"
k3s_service_cidr: "{{ platform_k3s_service_cidr4 }}"
k3s_disable: ["metrics-server"]                        # keep traefik + servicelb + local-storage + coredns
# API audit log (SEC-23/INF-29): every request at Metadata level, the secrets/configmaps bodies never
# logged (RequestResponse omitted on purpose); rotated by the apiserver, shipped by promtail with the
# audit label (group_vars/k3s.yml).
k3s_audit_enabled: true
k3s_audit_log_dir: /var/log/k3s
k3s_audit_log_maxage: 30
k3s_audit_log_maxbackup: 10
k3s_audit_log_maxsize: 100
# Pod Security Admission per namespace (enforce + warn): the platform apps are restricted; the
# kube-system and agent namespaces stay at the default (vendor images need baseline/privileged).
k3s_pod_security:
  demo: restricted
  default: restricted
  portainer-agent: baseline
# Registry mirrors: Docker Hub through the Harbor pull-through cache (rate limits, on-net, scanned)
k3s_registry_mirrors:
  - { upstream: "docker.io", endpoint: "https://{{ platform_service_fqdns.harbor }}", rewrite_from: "^(.*)$", rewrite_to: "dockerhub/$1" }
# Namespaces with a CI deployer service account (kubeconfig → Vault + GitLab CI variable of the project)
k3s_ci_namespaces:
  - { name: demo, gitlab_project: "platform/apps/demo" }
k3s_vault_path: "{{ k3s_env }}/k3s"                    # <path>/ci-<namespace>: kubeconfig (base64)
k3s_gitlab_host: "{{ groups['gitlab'] | first }}"                       # where gitlab-rails runs (CI variable upsert)
# Apps published through the platform Traefik (TLS + SSO forwardAuth) → k3s ingress :80.
# Each entry also needs: an unbound override <fqdn> → Traefik (catalog) and an Authentik
# proxy app (roles/authentik authentik_proxy_apps) with the same slug.
k3s_published_apps:
  - { name: demo-apps, fqdn: "{{ platform_service_fqdns.k3s_demo }}" }
