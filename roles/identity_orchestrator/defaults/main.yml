---
# ==============================================================================
# Role: identity_orchestrator — the "Entra-ID-like" account admin fan-out.
#
# Authentik is the FRONT DOOR (define the person + groups). This role RECONCILES
# a declarative people list into Authentik (user + group memberships), then sends
# a confirmation email with the account bundle. Human mailboxes are auto-created
# by mailcow OIDC on first SSO login (the mailcow-users group grants it), so this
# role does NOT create mailboxes for humans — group membership drives access.
#
# Boundaries: never emails a password (Authentik enrolment/recovery link only);
# reconciles TO Authentik, never bypasses it; removal = disable, never delete
# (identity/0004 §1) — set state: disabled.
# ==============================================================================
identity_orchestrator_people: []          # see the schema in README/new-service docs
identity_orchestrator_env: "{{ platform_env | default('prod') }}"
identity_orchestrator_domain: "{{ platform_domain | default('by-research.be') }}"
identity_orchestrator_ak_host: "10.1.3.130"
identity_orchestrator_ak_port: 9000
identity_orchestrator_ak_secret_file: "fabric/authentik.json"   # holds bootstrap_token  # pragma: allowlist secret
identity_orchestrator_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
# Confirmation email — sent from the authentik@ service mailbox via Mailcow.
identity_orchestrator_send_confirmation: true
identity_orchestrator_mail_from: "authentik@{{ platform_domain | default('by-research.be') }}"
identity_orchestrator_mail_host: "vm-mailcow-01.{{ platform_domain | default('by-research.be') }}"
identity_orchestrator_mail_delegate: "adm_yboujraf@{{ platform_domain | default('by-research.be') }}"
