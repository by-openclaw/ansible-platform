---
# ==============================================================================
# Role: identity_orchestrator — the "Entra-ID-like" account admin fan-out.
#
# Authentik is the FRONT DOOR (define the person + groups). This role RECONCILES
# a declarative people list into Authentik (user + group memberships), then sends
# a confirmation email with the account bundle. Human mailboxes are auto-created
# by mailcow OIDC on first SSO login (the mailcow-users group grants it), so this
# role does NOT create mailboxes for humans — group membership drives access.
#
# Boundaries: never emails a password (Authentik enrolment/recovery link only);
# reconciles TO Authentik, never bypasses it; removal = disable, never delete
# (identity/0004 §1) — set state: disabled.
# ==============================================================================
identity_orchestrator_people: []          # see the schema in README/new-service docs
identity_orchestrator_env: "{{ platform_env | default('prod') }}"
identity_orchestrator_domain: "{{ platform_domain }}"
identity_orchestrator_ak_host: "10.1.3.130"
identity_orchestrator_ak_port: 9000
identity_orchestrator_ak_vault_path: "{{ platform_env | default('prod') }}/authentik/admin"   # bootstrap_token (Vault, no file)

# --- Person mailboxes (mailcow API) — the mailbox exists BEFORE the first SSO login
#     so Nextcloud Mail provisioning, aliases and the welcome mail work on day one.
identity_orchestrator_mailbox_enabled: true
identity_orchestrator_mailbox_group: "{{ platform_service_groups.mailcow.access }}"      # only people holding this group get a mailbox
identity_orchestrator_mailbox_quota_mb: 5120              # = the mailcow OIDC template (5 GB); per-person override: mailbox.quota_mb
identity_orchestrator_mailbox_authsource: "generic-oidc"  # SSO-bound: the mailbox password is never used
identity_orchestrator_mailcow_host: "vm-mailcow-01"
identity_orchestrator_mailcow_api: "https://{{ mailcow_listen_ip | default('10.1.2.120') }}:{{ mailcow_https_port | default(8443) }}/api/v1"
identity_orchestrator_mailcow_vault_path: "{{ platform_env | default('prod') }}/mailcow/admin"  # api_key
identity_orchestrator_mailcow_s3_vault_path: "{{ platform_env | default('prod') }}/mailcow/s3"  # leaver export → bucket mailcow-backups
identity_orchestrator_mailcow_vmail_dir: "/var/lib/docker/volumes/mailcowdockerized_vmail-vol-1/_data"
identity_orchestrator_mailcow_mysql_container: "mailcowdockerized-mysql-mailcow-1"
identity_orchestrator_mailbox_export_dir: "/var/backups/mailcow/leavers"   # staging on the mailcow host, removed after upload
identity_orchestrator_mailbox_export_prefix: "leavers"                      # S3 key prefix inside the mailcow-backups bucket
identity_orchestrator_mailbox_leave_days: 7                                # auto-reply repeat interval (sieve vacation :days)
# Confirmation email — sent from the authentik@ service mailbox via Mailcow.
identity_orchestrator_send_confirmation: true
identity_orchestrator_mail_from: "authentik@{{ platform_domain }}"
identity_orchestrator_mail_host: "vm-mailcow-01.{{ platform_domain }}"
identity_orchestrator_mail_delegate: "adm_yboujraf@{{ platform_domain }}"
