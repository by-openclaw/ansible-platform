---
# ==============================================================================
# identity_orchestrator — a person's mailbox, through roles/mailbox. One person
# per include. This file decides POLICY (what a joiner, mover and leaver mean for
# a person); the mailbox role performs it, and is the only writer of mailcow
# mailbox state on the platform.
#
#   joiner : the mailbox exists BEFORE the first SSO login — authsource
#            generic-oidc, display name, quota, aliases.
#   mover  : name / quota / active / authsource reconciled, aliases added. The
#            role reads each attribute before writing it, so a converged person
#            reports no change.
#   leaver : suspended — login disallowed while mail is still accepted
#            (mailcow active=2), optional forward + auto-reply as a prefilter
#            sieve, ONE-TIME export of the maildir to S3. Never deleted.
#
# Per-person optional block in people.yml:
#   mailbox: { quota_mb: 5120, aliases: [ "y.boujraf" ], forward_to: "x@…", leave_message: "…" }
# ==============================================================================
- name: "IdentityOrch | Mailbox — {{ io_person.username }}"
  ansible.builtin.include_role:
    name: mailbox
  vars:
    mailbox_address: "{{ io_person.email }}"
    mailbox_domain: "{{ io_person.email.split('@')[1] }}"
    mailbox_display_name: "{{ io_person.name }}"
    mailbox_quota_mb: >-
      {{ (io_person.mailbox | default({})).quota_mb | default(identity_orchestrator_mailbox_quota_mb) }}
    mailbox_aliases: "{{ (io_person.mailbox | default({})).aliases | default([]) }}"
    # SSO-bound: the generated password is never used and never stored — the
    # person authenticates through Authentik.
    mailbox_credential: sso
    mailbox_authsource: "{{ identity_orchestrator_mailbox_authsource }}"
    # A person's mailbox does not model delegation in people.yml, so the role must
    # not revoke grants that nothing here declares.
    mailbox_delegates_declarative: false
    # active -> present; anything else is a leaver.
    mailbox_state: "{{ 'present' if (io_person.state | default('active')) == 'active' else 'suspended' }}"
    mailbox_forward_to: "{{ (io_person.mailbox | default({})).forward_to | default('') }}"
    mailbox_autoreply: "{{ (io_person.mailbox | default({})).leave_message | default('') }}"
    mailbox_autoreply_days: "{{ identity_orchestrator_mailbox_leave_days }}"
    mailbox_export_s3: true
    mailbox_export_bucket_vault_path: "{{ identity_orchestrator_mailcow_s3_vault_path }}"
    mailbox_export_prefix: "{{ identity_orchestrator_mailbox_export_prefix }}"
    mailbox_export_dir: "{{ identity_orchestrator_mailbox_export_dir }}"
    mailbox_vmail_dir: "{{ identity_orchestrator_mailcow_vmail_dir }}"
    mailbox_api_vault_path: "{{ identity_orchestrator_mailcow_vault_path }}"
    mailbox_mailcow_host: "{{ identity_orchestrator_mailcow_host }}"
    mailbox_mysql_container: "{{ identity_orchestrator_mailcow_mysql_container }}"
