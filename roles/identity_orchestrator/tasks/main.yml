---
- name: "IdentityOrch | Read the Authentik admin token (Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ identity_orchestrator_ak_vault_path }}"
    vault_secret_init: {}

- name: "IdentityOrch | Bind the Authentik admin token"
  ansible.builtin.set_fact:
    io_ak_token: "{{ vault_secret_result.bootstrap_token }}"
    io_ak_base: "http://{{ identity_orchestrator_ak_host }}:{{ identity_orchestrator_ak_port }}/api/v3"
  no_log: true

- name: "IdentityOrch | Reconcile each person"
  ansible.builtin.include_tasks: person.yml
  loop: "{{ identity_orchestrator_people }}"
  loop_control:
    loop_var: io_person
    label: "{{ io_person.username }}"
