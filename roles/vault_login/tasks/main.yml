---
# Sets: vault_deploy_token (a Vault token) + vault_deploy_auth (approle|root).

- name: "Vault login | Stat the ansible-deploy AppRole creds"
  ansible.builtin.stat:
    path: "{{ vault_login_secret_dir }}/{{ vault_login_approle_file }}"
  delegate_to: localhost
  become: false
  check_mode: false
  register: vault_login_ar_stat

- name: "Vault login | Load AppRole creds (when present)"
  ansible.builtin.set_fact:
    vault_login_ar: "{{ (lookup('file', vault_login_secret_dir + '/' + vault_login_approle_file) | from_json).fields }}"
  no_log: true
  when: vault_login_ar_stat.stat.exists

# Vault's HTTP API, called on the Vault node (delegated): the role id and the secret id travel
# in the module call, never on a command line. The address comes from the inventory
# (platform_vault_addr follows platform_vault_host) — it is not derived here.
- name: "Vault login | AppRole login → token"
  ansible.builtin.uri:
    url: "{{ vault_login_api_url }}/v1/auth/approle/login"
    method: POST
    body_format: json
    body:
      role_id: "{{ vault_login_ar.role_id }}"
      secret_id: "{{ vault_login_ar.secret_id }}"
    timeout: "{{ vault_login_api_timeout }}"
  delegate_to: "{{ vault_login_host }}"
  register: vault_login_result
  check_mode: false          # a login is read-only; FW plays must be dry-runnable
  changed_when: false
  failed_when: false
  no_log: true
  when: vault_login_ar_stat.stat.exists

- name: "Vault login | Adopt the AppRole token"
  ansible.builtin.set_fact:
    vault_deploy_token: "{{ vault_login_result.json.auth.client_token }}"
    vault_deploy_auth: approle
  no_log: true
  when:
    - vault_login_ar_stat.stat.exists
    - (vault_login_result.json.auth.client_token | default('')) | length > 0

# AppRole yielded no token. Surface the REAL cause (HTTP status + Vault's errors, UUIDs
# redacted, token never shown) instead of silently falling back — a silent
# fallback to the retired root token is what killed every flow (SEC-06).
- name: "Vault login | AppRole login failed — fail loudly with the cause"
  ansible.builtin.fail:
    msg: >-
      ansible-deploy AppRole login produced no token
      (approle file present: {{ vault_login_ar_stat.stat.exists }},
      HTTP {{ vault_login_result.status | default('skipped') }} at {{ vault_login_api_url }},
      errors={{ ((vault_login_result.json.errors | default([]) | join('; ')) ~ ' ' ~ (vault_login_result.msg | default('')))
                | regex_replace('[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}', '<uuid>')
                | regex_replace('\\s+', ' ') | trim }}).
      Fix the AppRole path ({{ vault_login_secret_dir }}/{{ vault_login_approle_file }},
      Vault reachable from {{ vault_login_host }}); do NOT rely on the retired
      root token. Set vault_login_allow_root_fallback=true ONLY for Vault genesis.
  when:
    - vault_deploy_token is not defined
    - not (vault_login_allow_root_fallback | default(false) | bool)

- name: "Vault login | Root-token fallback (Vault genesis ONLY, opt-in)"
  ansible.builtin.set_fact:
    vault_deploy_token: "{{ (lookup('file', vault_login_secret_dir + '/' + vault_login_bootstrap_file) | from_json).fields.root_token }}"
    vault_deploy_auth: root
  no_log: true
  when:
    - vault_deploy_token is not defined
    - vault_login_allow_root_fallback | default(false) | bool

- name: "Vault login | Refuse a revoked/empty root fallback (value never printed)"
  ansible.builtin.fail:
    msg: >-
      Root-token fallback is unusable: the bootstrap file holds an empty or
      'REVOKED*' placeholder (len={{ vault_deploy_token | default('') | length }}).
      Regenerate root via generate-root + unseal keys for genesis, or fix AppRole.
  when:
    - vault_deploy_auth | default('') == 'root'
    - (vault_deploy_token | default('')) == '' or (vault_deploy_token | default('')) is match('^REVOKED')

- name: "Vault login | Report auth method (no token)"
  ansible.builtin.debug:
    msg: "Vault deploy auth = {{ vault_deploy_auth }}"
