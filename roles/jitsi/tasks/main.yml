---
# --- secrets: get-or-create the internal component/auth secrets in Vault --------
- name: "Jitsi | Get-or-create component secrets in Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ jitsi_vault_path }}"
    vault_secret_init:
      jicofo_component_secret: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      jicofo_auth_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      jvb_auth_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      jigasi_xmpp_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      jibri_recorder_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
      jibri_xmpp_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"

- name: "Jitsi | Bind the secrets"
  ansible.builtin.set_fact:
    jitsi_secrets: "{{ vault_secret_result }}"
  no_log: true

- name: "Jitsi | Layout directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0750"
  loop:
    - "{{ jitsi_build_dir }}"
    - "{{ jitsi_config_dir }}"
  become: true

# stable-11146 (docker-jitsi-meet #2258, "Backwards-incompatible changes"): the containers run as
# uid/gid 1000 and cannot read or write host directories owned by another user; the new writable
# directories must exist, writable by that uid, before the start (Docker would create them
# root-owned). The vendor offers chmod 777 or chown -R 1000:1000 — ownership, not a world-writable
# mode. Existing prosody accounts and certificates are copied to storage/prosody on first start.
- name: "Jitsi | The writable volumes of the rootless images (owned by uid {{ jitsi_uid }})"
  ansible.builtin.file:
    path: "{{ jitsi_config_dir }}/{{ item }}"
    state: directory
    owner: "{{ jitsi_uid }}"
    group: "{{ jitsi_uid }}"
    mode: "0750"
  loop:
    - storage/web
    - storage/prosody
    - storage/transcripts
    - tmp/web-load-test
    - web/custom-ca
    - prosody/custom-ca
    - jicofo/custom-ca
    - jvb/custom-ca
  become: true

- name: "Jitsi | The configuration readable by the containers' user (uid {{ jitsi_uid }})"
  ansible.builtin.file:
    path: "{{ jitsi_config_dir }}"
    state: directory
    recurse: true
    owner: "{{ jitsi_uid }}"
    group: "{{ jitsi_uid }}"
  become: true

- name: "Jitsi | Render .env (secrets, PUBLIC_URL, JVB)"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ jitsi_build_dir }}/.env"
    owner: root
    group: root
    mode: "0640"
  become: true
  no_log: true
  register: jitsi_env_file

- name: "Jitsi | Render docker-compose.yml"
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ jitsi_build_dir }}/docker-compose.yml"
    owner: root
    group: root
    mode: "0644"
  become: true
  register: jitsi_compose_file

- name: "Jitsi | Start the stack (roles/compose_stack)"
  ansible.builtin.include_role:
    name: compose_stack
  vars:
    compose_stack_dir: "{{ jitsi_build_dir }}"

- name: "Jitsi | Wait for the web UI (loopback)"
  ansible.builtin.uri:
    url: "http://{{ jitsi_http_ip }}:{{ jitsi_http_port }}/"
    status_code: [200]
  register: jitsi_ping
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  retries: 20
  delay: 3
  until: jitsi_ping.status == 200

- name: "Jitsi | Admit the web port (roles/host_firewall owns every ufw rule)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules:
      - port: "{{ jitsi_http_port | string }}"
        proto: tcp
        from: ["{{ platform_internal_cidr4 }}", "{{ platform_vpn_cidr }}"]
        comment: "Jitsi web via Traefik"
- name: "Jitsi | Scaffold the platform concerns"
  ansible.builtin.include_role:
    name: service_scaffold
  vars:
    service_scaffold_def:
      name: jitsi
      fqdn: "{{ jitsi_fqdn }}"
      backend_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ jitsi_http_port }}"
      exposure: public          # meet.<domain> reachable…
      forward_auth: true        # …but only for jitsi-users: Authentik forwardAuth on the route
      mailbox: false            # Jitsi sends no mail; the mailbox created earlier stays at mailcow (never deleted)
      sso_slug: "{{ jitsi_sso_slug }}"
      vault_secrets:
        - path: "{{ jitsi_vault_path }}"
