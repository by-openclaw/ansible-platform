---
# Jitsi Meet — self-hosted video conferencing (official jitsi/docker-jitsi-meet).
# Docker-in-LXC on lxc-jitsi-01. TLS terminated by Traefik (meet.<domain>); the
# stack serves plain HTTP on the loopback. JVB media = UDP 10000, DNAT'd from WAN
# so external participants connect. Internal component secrets live in Vault.
# renovate: datasource=docker depName=jitsi/web versioning=regex:^stable-(?<major>\d+)$
jitsi_image_tag: "stable-11031"        # pinned; latest published on Docker Hub (bump deliberately)
jitsi_build_dir: "/opt/jitsi"
jitsi_config_dir: "/opt/jitsi/config"
jitsi_fqdn: "{{ platform_service_fqdns.jitsi }}"
jitsi_http_ip: "0.0.0.0"                   # bind all; ufw (internal only) + OPNsense FW gate it; Traefik is the ingress
jitsi_http_port: 8000
jitsi_jvb_port: 10000                      # UDP media
# Addresses the video bridge advertises as ICE candidates (docker-jitsi-meet JVB_ADVERTISE_IPS):
# the host address for LAN/VPN peers and the public address for peers on the internet. Without
# them the bridge only offers its Docker-network address (172.18.x) and every call drops after
# ICE fails (2026-09-17). Media port = jitsi_jvb_port/udp, published by compose on the host.
jitsi_wan_ip: "{{ platform_public_ipv4 | default('') }}"
jitsi_public_ip: "{{ jitsi_wan_ip }}"
jitsi_advertise_ips: "{{ [ansible_host | default(''), jitsi_wan_ip] | select | unique | join(',') }}"
jitsi_env: "{{ platform_env | default('prod') }}"
jitsi_vault_path: "{{ jitsi_env }}/jitsi/secrets"      # component/auth secrets
jitsi_tz: "Europe/Brussels"
# SSO: Authentik forwardAuth gates the web app to platform users (jitsi-users).
# Guest/JWT join for externals is a documented follow-up.
jitsi_sso_slug: "jitsi"
