---
# ==============================================================================
# Role: opnsense_pppoe — vault.yml: the store of record, through roles/vault_secret (data +
# custom metadata). Decides between "unchanged", "normalised from base64" and "rotated", writes
# one new KV version at most, marks the store with custom metadata, and hands the RAW password to
# the firewall host(s) and the controller through delegate_facts. Nothing is printed.
# ==============================================================================
- name: "PPPoE vault | Read the credential and its metadata ({{ opnsense_pppoe_vault_path }})"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ opnsense_pppoe_vault_path }}"
    vault_secret_read_metadata: true
    vault_secret_mount: "{{ opnsense_pppoe_vault_mount }}"
    vault_secret_container: "{{ opnsense_pppoe_vault_container }}"

- name: "PPPoE vault | Bind what Vault holds"
  ansible.builtin.set_fact:
    opnsense_pppoe_fields: "{{ vault_secret_result }}"
    opnsense_pppoe_format: >-
      {{ (vault_secret_metadata.custom | default({}, true)).format | default('') }}
    opnsense_pppoe_version: "{{ vault_secret_metadata.current_version }}"
    # A version written outside this role (the Vault UI on rotation day) carries no trail: the
    # stamped version lags the current one, and the trail is completed below as 'rotation-external'.
    opnsense_pppoe_unstamped: >-
      {{ ((vault_secret_metadata.custom | default({}, true)).version_stamped | default('0')) | string
         != (vault_secret_metadata.current_version | string) }}
  no_log: true

# The value stored until 2026-09-21 was copied from a live config, i.e. the base64 form OPNsense
# keeps on disk; a rotation entered raw would then break the next rebuild (ansible-opnsense#40).
# The store is unambiguous only once it carries format=raw — set by this role, never assumed.
- name: "PPPoE vault | Refuse an unmarked store (no format=raw, no normalisation asked)"
  ansible.builtin.fail:
    msg: >-
      {{ opnsense_pppoe_vault_path }} carries no custom metadata format=raw — the stored value may be
      the base64 form copied from a live config. Run once with -e opnsense_pppoe_normalize=true to
      decode it and mark the store raw. Nothing was applied.
  when:
    - opnsense_pppoe_format | trim != 'raw'
    - not (opnsense_pppoe_normalize | bool)

- name: "PPPoE vault | Normalise: the stored value must be strict base64 of printable text"
  ansible.builtin.assert:
    that:
      - opnsense_pppoe_fields.pppoe_password is match('^[A-Za-z0-9+/]+={0,2}$')
      - (opnsense_pppoe_fields.pppoe_password | b64decode) is match('^[ -~]+$')
    fail_msg: "the stored value does not decode to printable text — it is already raw; do not normalise"
    quiet: true
  when:
    - opnsense_pppoe_normalize | bool
    - opnsense_pppoe_format | trim != 'raw'

- name: "PPPoE vault | The raw credential: rotated, normalised, or as stored"  # pragma: allowlist secret
  ansible.builtin.set_fact:
    opnsense_pppoe_raw: "{{ opnsense_pppoe_new_password if (opnsense_pppoe_new_password | length > 0) else _stored_raw }}"
    opnsense_pppoe_stored: "{{ _stored }}"
  vars:
    _stored: "{{ opnsense_pppoe_fields.pppoe_password }}"  # pragma: allowlist secret
    _normalise: "{{ (opnsense_pppoe_normalize | bool) and (opnsense_pppoe_format | trim != 'raw') }}"
    _stored_raw: "{{ (_stored | b64decode) if (_normalise | bool) else _stored }}"
  no_log: true

- name: "PPPoE vault | Decide whether Vault gets a new version"
  ansible.builtin.set_fact:
    opnsense_pppoe_write: "{{ (opnsense_pppoe_raw != opnsense_pppoe_stored) or (opnsense_pppoe_format | trim != 'raw') }}"
    opnsense_pppoe_reason_effective: "{{ 'rotation' if (_rotated | bool) else ('normalised-from-base64' if (_unmarked | bool) else 'unchanged') }}"
  vars:
    _rotated: "{{ (opnsense_pppoe_new_password | length > 0) and (opnsense_pppoe_new_password != opnsense_pppoe_stored) }}"  # pragma: allowlist secret
    _unmarked: "{{ opnsense_pppoe_format | trim != 'raw' }}"
  no_log: true

# One step: a new KV version when the value changes (every other field kept) and the
# rotation trail in custom metadata — also on its own when a version was written
# outside this role (the Vault UI on rotation day). The version this run leaves current
# is the one it writes (current + 1) or the one it found. Never under --check.
- name: "PPPoE vault | Write the new version and/or complete the rotation trail"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ opnsense_pppoe_vault_path }}"
    vault_secret_mount: "{{ opnsense_pppoe_vault_mount }}"
    vault_secret_container: "{{ opnsense_pppoe_vault_container }}"
    vault_secret_force_fields: >-  # pragma: allowlist secret
      {{ opnsense_pppoe_fields | combine({'pppoe_password': opnsense_pppoe_raw, '_note': opnsense_pppoe_store_note | trim})
         if (opnsense_pppoe_write | bool) else {} }}
    vault_secret_metadata_put:
      format: raw
      rotated_at: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(utc=true) }}"
      rotated_by: "{{ 'ansible-deploy' if (opnsense_pppoe_write | bool) else 'external-write' }}"
      reason: "{{ (opnsense_pppoe_reason_effective | trim) if (opnsense_pppoe_write | bool) else 'rotation-external' }}"
      version_stamped: "{{ (opnsense_pppoe_version | int + 1) if (opnsense_pppoe_write | bool) else opnsense_pppoe_version }}"
  when:
    - (opnsense_pppoe_write | bool) or (opnsense_pppoe_unstamped | bool)
    - not ansible_check_mode

- name: "PPPoE vault | Report (no value)"
  ansible.builtin.debug:
    msg: >-
      {{ opnsense_pppoe_vault_path }}: store {{ 'marked raw' if (opnsense_pppoe_format | trim == 'raw') else 'UNMARKED' }},
      {{ ('new version: ' ~ (opnsense_pppoe_reason_effective | trim)) if (opnsense_pppoe_write | bool)
         else ('version ' ~ opnsense_pppoe_version ~ ' written outside the role — trail completed (rotation-external)'
               if (opnsense_pppoe_unstamped | bool) else 'unchanged') }}{{
      ' [check mode — not written]' if (ansible_check_mode and ((opnsense_pppoe_write | bool) or (opnsense_pppoe_unstamped | bool))) else '' }}

- name: "PPPoE vault | Hand the raw password to the firewall host(s) and the controller"
  ansible.builtin.set_fact:
    opnsense_pppoe_raw: "{{ opnsense_pppoe_raw }}"
    opnsense_pppoe_fields: "{{ opnsense_pppoe_fields | combine({'pppoe_password': opnsense_pppoe_raw}) }}"  # pragma: allowlist secret
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['opnsense'] + ['localhost'] }}"
  no_log: true

# The appliance's sudo asks the automation user's GUI password. Absent in an environment (the test
# firewall today) → the apply play fails at become, which is the honest outcome; read is tolerant.
- name: "PPPoE vault | The automation user's password (wheel sudo on the appliance; optional)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ opnsense_pppoe_vault_become }}"
    vault_secret_optional: true
    vault_secret_mount: "{{ opnsense_pppoe_vault_mount }}"
    vault_secret_container: "{{ opnsense_pppoe_vault_container }}"

- name: "PPPoE vault | Hand the become password over"
  ansible.builtin.set_fact:
    opnsense_pppoe_become_password: "{{ vault_secret_result.webgui_password | default('') }}"  # pragma: allowlist secret
  delegate_to: "{{ item }}"
  delegate_facts: true
  loop: "{{ groups['opnsense'] }}"
  no_log: true
