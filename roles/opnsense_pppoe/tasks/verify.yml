---
# ==============================================================================
# Role: opnsense_pppoe — verify.yml: the uplink, through the API (connection: local). Polls the
# gateway status until the PPPoE gateway the catalog names is back, then reports the interface.
# Read-only; runs under --check too.
# ==============================================================================
- name: "PPPoE verify | Gateway status, polled until both address families are back on {{ opnsense_pppoe_device.interface }}"
  ansible.builtin.uri:
    url: "https://{{ opn_host }}:{{ opn_port | default(443) }}/api/routes/gateway/status"
    method: GET
    url_username: "{{ opn_key }}"
    url_password: "{{ opn_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opn_verify_ssl | default(false) }}"
    status_code: 200
  register: opnsense_pppoe_gw
  check_mode: false
  retries: "{{ opnsense_pppoe_gateway_wait_retries if (opnsense_pppoe_redialed | default(false) | bool) else 1 }}"
  delay: "{{ opnsense_pppoe_gateway_wait_delay }}"
  until: >-
    (opnsense_pppoe_gw.json['items'] | default([])
     | selectattr('name', 'in', opnsense_pppoe_gateways)
     | rejectattr('status', 'in', ['down', 'force_down'])
     | list | length) == (opnsense_pppoe_gateways | length)
  vars:
    _v6_list: "{{ [opnsense_pppoe_device.gateway_v6] if (opnsense_pppoe_device.gateway_v6 | default('')) else [] }}"
    opnsense_pppoe_gateways: "{{ [opnsense_pppoe_device.gateway_v4] + _v6_list }}"

- name: "PPPoE verify | Interface overview (address present)"
  ansible.builtin.uri:
    url: "https://{{ opn_host }}:{{ opn_port | default(443) }}/api/interfaces/overview/interfacesInfo"
    method: GET
    url_username: "{{ opn_key }}"
    url_password: "{{ opn_secret }}"
    force_basic_auth: true
    validate_certs: "{{ opn_verify_ssl | default(false) }}"
    status_code: 200
  register: opnsense_pppoe_ifinfo
  check_mode: false

- name: "PPPoE verify | Report"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ opnsense_pppoe_device.gateway_v4 }} = {{ _v4 }},
      {{ opnsense_pppoe_device.gateway_v6 | default('(no v6 gateway declared)') }} = {{ _v6 }};
      {{ opnsense_pppoe_device.interface }} {{ (_if.status | default('absent')) }},
      IPv4 {{ 'present' if (_if.addr4 | default('') | length > 0) else 'NONE' }},
      IPv6 global {{ 'present' if (_v6_global | length > 0) else 'NONE' }}
  vars:
    _items: "{{ opnsense_pppoe_gw.json['items'] | default([]) }}"
    # interfacesInfo lists addr6 as strings ("2001:db8::1/64"); link-local ones are not the proof
    _v6_global: "{{ _if.addr6 | default([]) | map('string') | reject('match', '^fe80') | list }}"
    _v4: "{{ _items | selectattr('name', 'equalto', opnsense_pppoe_device.gateway_v4) | map(attribute='status_translated') | first | default('ABSENT') }}"
    _v6_name: "{{ opnsense_pppoe_device.gateway_v6 | default('') }}"
    _v6: "{{ _items | selectattr('name', 'equalto', _v6_name) | map(attribute='status_translated') | first | default('ABSENT') }}"
    _if: >-
      {{ opnsense_pppoe_ifinfo.json.rows | default([])
         | selectattr('identifier', 'equalto', opnsense_pppoe_device.interface) | first | default({}) }}
