---
# ==============================================================================
# Blackbox exporter — a container (the pinned official image on the host network,
# loopback listen) running as the prometheus account (roles/prometheus creates it).
# Config first (validated with the image), then the container; a config change
# restarts it once. The native package goes once the container answers.
# ==============================================================================
- name: "Blackbox | The account it runs as (roles/prometheus owns it)"
  ansible.builtin.getent:
    database: passwd
    key: "{{ blackbox_exporter_account }}"
    fail_key: "{{ not ansible_check_mode }}"   # a fresh host's dry-run has not created it yet

- name: "Blackbox | Probe modules ({{ blackbox_exporter_config }})"
  ansible.builtin.template:
    src: blackbox.yml.j2
    dest: "{{ blackbox_exporter_config }}"
    owner: root
    group: "{{ blackbox_exporter_account }}"
    mode: "0640"
    validate: >-
      {{ omit if ansible_check_mode else
         'docker run --rm --network none --user 0 -v %s:/check.yml:ro ' ~ blackbox_exporter_image
         ~ ' --config.check --config.file=/check.yml' }}
  register: blackbox_exporter_config_file

# The container shares the host's network namespace, so this host sysctl is what lets
# its unprivileged ping sockets work (ambient CAP_NET_RAW is not honoured in the LXC).
- name: "Blackbox | Unprivileged ICMP: allow every group to open ping sockets"
  ansible.posix.sysctl:
    name: net.ipv4.ping_group_range
    value: "0 65535"
    sysctl_file: /etc/sysctl.d/90-blackbox-icmp.conf
    sysctl_set: true
    reload: true

- name: "Blackbox | The native unit stops (retired; it holds {{ blackbox_exporter_listen }})"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ blackbox_exporter_native }}"

- name: "Blackbox | Its uid and gid"
  ansible.builtin.set_fact:
    blackbox_exporter_account_entry: "{{ (ansible_facts.getent_passwd | default({}))[blackbox_exporter_account] | default(['', '0', '0']) }}"

- name: "Blackbox | The container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: blackbox-exporter
      containers:
        - name: "{{ blackbox_exporter_container }}"
          image: "{{ blackbox_exporter_image }}"
          read_only: true                 # SEC-22: it writes to its mounted directories only
          tmpfs: ["/tmp:rw,size=64m"]
          network_mode: host
          log_driver: journald   # container log -> journal -> promtail -> Loki (INF-27)
          user: "{{ blackbox_exporter_account_entry[1] }}:{{ blackbox_exporter_account_entry[2] }}"
          command:
            - "--config.file={{ blackbox_exporter_config }}"
            - "--web.listen-address={{ blackbox_exporter_listen }}"
            - "--log.level=warn"   # every probe logged at info was ~1.7k lines/min into Loki
          volumes:
            # the config's directory, not the file: Ansible replaces files by rename (new inode)
            - "{{ blackbox_exporter_config | dirname }}:{{ blackbox_exporter_config | dirname }}:ro"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"   # HTTPS probes trust what the host trusts (incl. the platform CA)
          restart: "{{ blackbox_exporter_config_file is changed }}"

- name: "Blackbox | Exporter answers (read-only)"
  ansible.builtin.uri:
    url: "http://{{ blackbox_exporter_listen }}/-/healthy"
    status_code: [200]
  register: blackbox_exporter_health
  until: blackbox_exporter_health.status == 200
  retries: 10
  delay: 3
  when: not ansible_check_mode

- name: "Blackbox | The native install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ blackbox_exporter_native }}"
