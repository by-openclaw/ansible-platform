---
# ==============================================================================
# Role: blackbox_exporter — synthetic probes (HTTPS, DNS, TCP/TLS, SMTP STARTTLS,
# ICMP) on lxc-monitoring-01, a container (the pinned official image, host network),
# loopback only (Prometheus scrapes it). Targets are declared on the prometheus role
# (data-driven); modules live here.
# ==============================================================================
# renovate: datasource=docker depName=prom/blackbox-exporter
blackbox_exporter_version: "v0.26.0"   # what the Debian package ran
blackbox_exporter_image: "prom/blackbox-exporter:{{ blackbox_exporter_version }}"
blackbox_exporter_container: blackbox-exporter
# Runs as the prometheus account (roles/prometheus creates it; the config is group-readable).
blackbox_exporter_account: prometheus
blackbox_exporter_native:
  units: [prometheus-blackbox-exporter]
  packages: [prometheus-blackbox-exporter]
  files:
    - /etc/default/prometheus-blackbox-exporter
    - /etc/systemd/system/prometheus-blackbox-exporter.service.d
blackbox_exporter_listen: "127.0.0.1:9115"
blackbox_exporter_config: "/etc/prometheus/blackbox.yml"
blackbox_exporter_timeout: "10s"
# HTTP: follow redirects (SSO routes land on the IdP login = 200); 401/403 accepted for
# API-only hosts (registry, S3) and allow-listed admin routes — the probe proves the
# route, TLS and the backend answered, not authorisation.
blackbox_exporter_http_valid_status: [200, 201, 204, 301, 302, 303, 307, 308, 401, 403]
# DNS module: the name every guest resolves through the platform resolver and the
# answer it must give (unbound override → Traefik).
blackbox_exporter_dns_query: "{{ platform_service_fqdns.nextcloud }}"
blackbox_exporter_dns_expect: '10\.1\.2\.110'
