---
# ==============================================================================
# Windows updates — row #10 of the walk, the `updates` role's sibling: the same
# patch-wave model (playbooks/updates.yml, serial 1, stop at the first failure),
# through the platform proxy (the guests' only egress, roles/windows_firewall).
# Plan by default; -e updates_apply=true installs and reboots when Windows asks.
# ==============================================================================
windows_updates_categories: [SecurityUpdates, CriticalUpdates, UpdateRollups, Updates, Definition Updates]
windows_updates_reboot_timeout: 1200          # a Windows update reboot can take a while on first cumulative
windows_updates_services_must_return: [sshd, WazuhSvc, windows_exporter, Alloy, w32time]
