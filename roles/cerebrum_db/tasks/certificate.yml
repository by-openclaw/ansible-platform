---
# The instance's TLS certificate (security/0004: no self-signed certificate anywhere): the tier's zone
# wildcard, which covers cerebrum-db.<tier>.<domain> of the split DNS, through roles/tls_cert; its private
# key readable by the instance's service account; named in the instance's network settings. A client
# that asks for encryption (JumpServer's database client over JDBC) then validates the instance against
# the public chain. Encryption is not forced: Cerebrum (ODBC 17) connects as before.
# SQL Server reads the certificate at start, so a new one restarts the instance (announce the run: both
# Cerebrum instances lose their database for the restart). An instance that does not come back with it
# is put back on its own certificate and restarted again, and the run fails.
- name: "Cerebrum DB | The zone wildcard: files + machine store"
  ansible.builtin.include_role:
    name: tls_cert
    tasks_from: windows.yml
  vars:
    tls_cert_domain: "{{ cerebrum_db_tls_zone }}"

- name: "Cerebrum DB | The instance id"
  ansible.windows.win_reg_stat:
    path: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\Instance Names\SQL'
    name: "{{ cerebrum_db_instance }}"
  register: cerebrum_db_instance_id

# A first dry run has not imported the certificate: nothing to set rights on yet.
- name: "Cerebrum DB | The instance's service account reads the private key"
  ansible.windows.win_acl:
    path: "Cert:\\LocalMachine\\My\\{{ tls_cert_thumbprint }}"
    user: "NT SERVICE\\{{ cerebrum_db_service }}"
    rights: Read
    type: allow
    state: present
  register: cerebrum_db_cert_acl
  when: not ansible_check_mode or (tls_cert_win_store.certificates | selectattr('thumbprint', 'equalto', tls_cert_thumbprint) | list | length > 0)

- name: "Cerebrum DB | The instance names that certificate"
  ansible.windows.win_regedit:
    path: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ cerebrum_db_instance_id.value }}\MSSQLServer\SuperSocketNetLib'
    name: Certificate
    data: "{{ tls_cert_thumbprint | lower }}"
    type: string
  register: cerebrum_db_cert_reg

- name: "Cerebrum DB | Restart on a new certificate; back to its own if the instance refuses it"
  when: cerebrum_db_cert_reg is changed or cerebrum_db_cert_acl is changed
  block:
    - name: "Cerebrum DB | The instance restarted (it reads the certificate at start)"
      ansible.windows.win_service:
        name: "{{ cerebrum_db_service }}"
        state: restarted

    - name: "Cerebrum DB | The port answers"
      ansible.windows.win_wait_for:
        port: "{{ cerebrum_db_port }}"
        timeout: 60
  rescue:
    - name: "Cerebrum DB | The certificate setting removed (the instance did not start with it)"
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Microsoft SQL Server\{{ cerebrum_db_instance_id.value }}\MSSQLServer\SuperSocketNetLib'
        name: Certificate
        data: ""
        type: string

    - name: "Cerebrum DB | The instance restarted on its own certificate"
      ansible.windows.win_service:
        name: "{{ cerebrum_db_service }}"
        state: restarted

    - name: "Cerebrum DB | Fail the run: the instance refused the zone wildcard"
      ansible.builtin.fail:
        msg: "{{ cerebrum_db_service }} did not answer on {{ cerebrum_db_port }} with certificate {{ tls_cert_thumbprint }}; put back on its own. Read its ERRORLOG."
