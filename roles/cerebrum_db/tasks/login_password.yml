---
# One login's password: Vault, created on first contact, under the instance's folder.
- name: "Cerebrum DB | The password of {{ cerebrum_db_login.name }} (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ cerebrum_db_vault_base }}/{{ cerebrum_db_login.name }}"
    vault_secret_init:
      user: "{{ cerebrum_db_login.name }}"
      password: >-   # pragma: allowlist secret
        {{ lookup('ansible.builtin.password', '/dev/null', length=cerebrum_db_password_length, chars=['ascii_letters', 'digits']) }}
    vault_secret_metadata_put:
      origin: "roles/cerebrum_db (login {{ cerebrum_db_login.name }} of {{ cerebrum_db_instance }} on {{ inventory_hostname }})"

- name: "Cerebrum DB | Kept for the logins script"
  ansible.builtin.set_fact:
    cerebrum_db_login_passwords: "{{ cerebrum_db_login_passwords | default({}) | combine({cerebrum_db_login.name: vault_secret_result.password}) }}"
  no_log: true
