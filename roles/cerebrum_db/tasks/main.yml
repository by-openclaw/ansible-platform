---
# roles/cerebrum_db — see defaults/main.yml for the contract. cerebrum_db_state decides:
# present (present.yml: secrets → the instance → patches → port, services, logins, backup,
# firewall → hardening) or absent (absent.yml: the instance uninstalled, data and backups kept).
- name: "Cerebrum DB | Absent: the instance uninstalled, data and backups kept"
  ansible.builtin.include_tasks: absent.yml
  when: cerebrum_db_state == 'absent'

- name: "Cerebrum DB | Present"
  ansible.builtin.include_tasks: present.yml
  when: cerebrum_db_state == 'present'
