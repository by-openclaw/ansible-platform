---
# ==============================================================================
# Role: cerebrum_db — the SQL Server instance EVS Cerebrum stores its state in.
#
# The vendor's help: the application "uses an SQL database for storing the network/application
# events and the configuration data", creates its own database at first start through the login
# its ini names, and supports a remote instance. This role owns everything around that database:
# the instance (pinned installer from the object store, unattended), its `sa` password from Vault
# (never the vendor's documented default), a static TCP port, the logins the application and the
# audit read with, the services that stay off, a nightly native backup, and the host firewall rule.
# The database itself is Cerebrum's to create (docs/services/cerebrum/README.md §15.2).
#
# Secrets: Vault only, carried as module payloads or rendered into a file the role removes in the
# same play. Management SQL runs over the SSH session (Windows authentication, `sqlcmd -E`):
# BUILTIN\Administrators is a sysadmin on this dedicated database host, so no password crosses a
# command line. `sa` is set from Vault at install and disabled afterwards (CIS 2.14): the
# application uses its own login.
# ==============================================================================
cerebrum_db_env: "{{ env | default(platform_env) }}"
cerebrum_db_state: present                      # absent: the instance uninstalled, its data files, backups and Vault documents kept

# --- where the instance comes from ----------------------------------------------------------------
# microsoft: Microsoft's own SQL Server Express media, pinned below (a dedicated database host, the
#            multi-VM layout). bundled: the Cerebrum installer's own SQL Express, already installed on
#            this host by roles/cerebrum_server with cerebrum_server_sql_bundled (a standalone server);
#            this role then only takes it over: Vault's sa password instead of the vendor's documented
#            default, the static port, the logins, the backup, the firewall rule.
cerebrum_db_install_source: microsoft           # the owner's rule (2026-10-22): Microsoft's media, Microsoft's patches — the bundle is not used

# --- patches from Microsoft (GDR / CU), pinned; applied in order when the instance is below them ----
# - { kb: "KB5122773", version: "15.0.2190.7", url: "https://…/SQLServer2019-KB5122773-x64.exe", sha256: "…" }
cerebrum_db_patches: []

# --- the installers, pinned by checksum (the object store holds them; the inventory names them) ---
cerebrum_db_download_dir: 'C:\ProgramData\platform\installers'
cerebrum_db_version: "2025"                     # the EVS manual §3.1: Express from 2017 for a non-redundant system; 2025 is the owner's choice (2026-11-03)
cerebrum_db_installer_url: ""                   # SQLEXPR_x64_ENU.exe of that version, on the object store (inventory)
cerebrum_db_installer_sha256: ""                # REQUIRED — the role refuses to install without it
# A copy already on the host (a manual download), taken instead of the URL when set: verified against
# the same sha256, then copied into the download folder like a downloaded one.
cerebrum_db_installer_staged_path: ""
# The command-line utilities (sqlcmd 17, ODBC-based). They need ODBC Driver 18, which SQL Server 2025
# setup installs with the instance — so they go in after it.
cerebrum_db_sqlcmd_msi_url: ""                  # Microsoft Command Line Utilities for SQL Server (MsSqlCmdLnUtils.msi)
cerebrum_db_sqlcmd_msi_sha256: ""
cerebrum_db_sqlcmd: 'C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\180\Tools\Binn\SQLCMD.EXE'
# Management runs over shared memory with Windows authentication (-E); sqlcmd on ODBC 18 encrypts by
# default and the instance has only its self-signed certificate until the platform's (README): -C.

# --- the instance ---------------------------------------------------------------------------------
cerebrum_db_instance: CEREBRUMSQL               # the vendor's installer uses this name; Cerebrum.ini points at host\instance,port
cerebrum_db_port: 1433                          # static; the lab ran on a dynamic port with the Browser on (the opposite of this)
cerebrum_db_features: SQLENGINE
cerebrum_db_sysadmins: ['BUILTIN\Administrators']   # the SSH management session (roles/windows_guest's Administrator) — the role's own door
cerebrum_db_service: "MSSQL${{ cerebrum_db_instance }}"
cerebrum_db_services_off:                       # what a database host does not run (CIS 2.x, the vendor's own lab: Agent off)
  - "SQLAgent${{ cerebrum_db_instance }}"
  - "SQLTELEMETRY${{ cerebrum_db_instance }}"
  - SQLBrowser

# --- secrets (Vault, get-or-create; one folder per host and instance: security/0001) ---------------
cerebrum_db_vault_base: "{{ cerebrum_db_env }}/mssql/{{ inventory_hostname }}/{{ cerebrum_db_instance }}"
cerebrum_db_sa_vault_path: "{{ cerebrum_db_vault_base }}/sa"
# A document whose `password` becomes sa's when sa has none yet (a manual install recorded by hand);
# the old document is then retired through inventories/prod/group_vars/all/vault_retired.yml.
cerebrum_db_sa_vault_copy_from: ""
cerebrum_db_sa_enabled: false                   # CIS 2.14: the server administrator login stays disabled; management = Windows authentication

# --- the databases and logins: one per Cerebrum instance (the cerebrum_server hosts) --------------
# Each Cerebrum server carries `cerebrum_instance` ("01", "02", …) in the inventory; its database and
# its login follow from it. Cerebrum creates its database at first start through that login.
cerebrum_db_instances: "{{ groups['cerebrum_server'] | default([]) | map('extract', hostvars, 'cerebrum_instance') | list }}"
cerebrum_db_database_prefix: "Cerebrum_"
cerebrum_db_login_prefix: "cerebrum_"
cerebrum_db_databases: "{{ cerebrum_db_instances | map('regex_replace', '^', cerebrum_db_database_prefix) | list }}"
# The owner's decision (2026-11-03): each instance's login has the rights of sa (sysadmin), as the
# vendor's default sa login has; sa itself is then disabled. `db_roles` apply inside every database
# of cerebrum_db_databases once it exists (sysadmin needs none). The backup task runs as SYSTEM.
cerebrum_db_login_server_roles: [sysadmin]
cerebrum_db_logins_extra:
  - { name: cerebrum_federated, server_roles: [sysadmin], db_roles: [] }                         # the Federation service, when it is used
  - { name: jumpserver_editor,  server_roles: [],         db_roles: [db_datareader, db_datawriter] }   # browsing and editing through the bastion
cerebrum_db_logins: >-
  {%- set out = [] -%}
  {%- for i in cerebrum_db_instances -%}
  {%- set _ = out.append({'name': cerebrum_db_login_prefix ~ i, 'server_roles': cerebrum_db_login_server_roles, 'db_roles': []}) -%}
  {%- endfor -%}
  {{ out + cerebrum_db_logins_extra }}
cerebrum_db_password_length: 28                 # letters and digits only: Cerebrum refuses { and } in a password

# --- hardening (CIS Microsoft SQL Server 2019 Benchmark, section 2 and 3) --------------------------
cerebrum_db_hardening: true
cerebrum_db_sp_configure:                       # name → value; every row guarded, changed only on drift
  - { name: "Ad Hoc Distributed Queries", value: 0 }   # 2.1
  - { name: "clr enabled", value: 0 }                   # 2.2
  - { name: "cross db ownership chaining", value: 0 }   # 2.3
  - { name: "Database Mail XPs", value: 0 }             # 2.4
  - { name: "Ole Automation Procedures", value: 0 }     # 2.5
  - { name: "remote access", value: 0 }                 # 2.6
  - { name: "remote admin connections", value: 0 }      # 2.7
  - { name: "scan for startup procs", value: 0 }        # 2.8
  - { name: "xp_cmdshell", value: 0 }                   # 2.16
  - { name: "contained database authentication", value: 0 }
cerebrum_db_audit_level: 3                      # 5.1 login auditing: 0 none, 1 success, 2 failure, 3 both (NIS2 21(2)(b): both)

# --- backup (infra/0008): a native full backup every night, seven rotating files, in the guest backup ---
cerebrum_db_backup_dir: 'C:\Backup\SQL'
cerebrum_db_backup_time: "02:00"
cerebrum_db_state_dir: 'C:\ProgramData\platform\cerebrum-db'
cerebrum_db_backup_task: "PLATFORM-cerebrum-db-backup-{{ cerebrum_db_instance }}"

# --- firewall: the instance answers the Cerebrum servers only ------------------------------------
cerebrum_db_allowed_from: "{{ groups['cerebrum_server'] | default([]) | map('extract', hostvars, 'ansible_host') | list }}"
cerebrum_db_firewall_rule: "CEREBRUM-DB-In-SQL-{{ cerebrum_db_instance }}"
cerebrum_db_firewall_profiles: [domain, private, public]
