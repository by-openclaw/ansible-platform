---
# ==============================================================================
# Role: controller — the automation controller itself (this workstation), so the machine that
# runs every play is managed by a play like any other host. Two concerns today:
#   1. a route to the platform's service zones through the firewall's OOB address, so the
#      controller reads Vault's API DIRECTLY instead of through the SSH hop whose keys the
#      agent is unlocking (the circular bootstrap that broke automation on 2026-09-22);
#   2. the SSH agent as a lingering user service, so it survives a desktop logout or restart.
# ==============================================================================
controller_manage_route: true
controller_route_gateway: "{{ hostvars[groups['opnsense'][0]].ansible_host }}"   # the firewall's OOB address
controller_route_networks:
  - "{{ platform_internal_cidr4 }}"        # every guest zone (network.yml)
controller_netplan_file: "/etc/netplan/60-platform-routes.yaml"
controller_netplan_interface: "{{ ansible_default_ipv4.interface }}"

# Vault, reached directly over its API (no hop, no docker exec)
controller_vault_addr: "https://{{ hostvars[groups['vault'][0]].ansible_host }}:{{ vault_port | default(8200) }}"
controller_vault_hosts_entry: true        # /etc/hosts pin so the API's TLS name resolves without the platform resolver

# SSH agent as a user service (survives a desktop restart; `loginctl enable-linger`)
controller_manage_agent_service: true
controller_agent_socket: "{{ ansible_env.HOME }}/.ssh/rune-agent.sock"
controller_agent_unit_dir: "{{ ansible_env.HOME }}/.config/systemd/user"

# --- Scheduled plays (user systemd timers on the controller) ------------------------------------
# A play that must run on a schedule and has no host of its own to live on runs here: one oneshot
# service + timer per job, rendered from this list — no script, output in the user journal
# (`journalctl --user -u controller-job-<name>`). The repository checkout on `main` is the source.
# The checkout the scheduled plays run from: the controller's own clone on `main` — a fixed path,
# never the directory of the play that happens to render the units (that could be a worktree).
controller_repo_dir: "{{ ansible_env.HOME }}/repos/ansible-platform"
controller_ansible_bin: "{{ ansible_env.HOME }}/.local/bin/ansible-playbook"
controller_jobs:
  # The wildcard certificate is issued on the edge host; PostgreSQL, Redis, the hypervisor console
  # and the backup server hold COPIES. Until 2026-10-03 nothing refreshed them on a schedule: a
  # renewal would have left the copies to expire.
  - name: certs-sync
    description: "Refresh the wildcard certificate copies on every consumer"
    on_calendar: "Mon *-*-* 04:17:00 UTC"
    playbook: "playbooks/certs-sync.yml"

# --- HashiCorp's package repository and Terraform (tasks/hashicorp.yml) --------------------------
controller_manage_hashicorp: true
controller_hashicorp_repo_url: "https://apt.releases.hashicorp.com"
controller_hashicorp_key_url: "{{ controller_hashicorp_repo_url }}/gpg"
# The ONLY key trusted for that repository. Source: HashiCorp bulletin HCSEC-2026-33 (2026-09-10),
# checked on 2026-10-06 against the key the repository serves and the key that signs its index.
controller_hashicorp_key_fingerprint: "D55C 0D1A C78A 8D81 26CB 631C FC9C A96A CA02 6560"   # pragma: allowlist secret
controller_hashicorp_keyring: "/etc/apt/keyrings/hashicorp.asc"
controller_hashicorp_source_file: "/etc/apt/sources.list.d/hashicorp.sources"
controller_hashicorp_suite: "{{ ansible_distribution_release }}"
# What the hand-made setup left: its source line and the former key (replaced by HashiCorp).
controller_hashicorp_superseded_files:
  - "/etc/apt/sources.list.d/hashicorp.list"
  - "/usr/share/keyrings/hashicorp-archive-keyring.gpg"
controller_hashicorp_cache_dir: "{{ ansible_env.HOME }}/.cache/platform-controller/hashicorp"
controller_hashicorp_key_cached: "{{ controller_hashicorp_cache_dir }}/hashicorp.asc"
# Terraform: the version installed on the controller, held so that `apt upgrade` does not move it.
controller_terraform_version: "1.16.1-1"
controller_terraform_hold: true
# Derived from `gpg --show-keys --with-colons`: how many primary keys the file holds, and the
# fingerprint of the first one.
controller_hashicorp_key_pinned: "{{ controller_hashicorp_key_fingerprint | replace(' ', '') | upper }}"
controller_hashicorp_key_primaries: "{{ controller_hashicorp_key_listing.stdout | default('') | regex_findall('(?m)^pub:') | length }}"
controller_hashicorp_key_found: "{{ controller_hashicorp_key_listing.stdout | default('') | regex_findall('(?m)^fpr:+([0-9A-F]{40}):') | first | default('') }}"
