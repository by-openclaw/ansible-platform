---
# ==============================================================================
# Loki — a container (the pinned official image on the host network), run as the loki
# account that owns the local scratch dir; chunks + index in SeaweedFS S3. Config
# first, then the container; a config change restarts it once. The native package goes
# once the container is ready. (The Grafana APT source is promtail's: roles/promtail.)
# ==============================================================================
- name: "Loki | Service account (owns the scratch dir; the container runs as it)"
  ansible.builtin.user:
    name: "{{ loki_account }}"
    group: "{{ loki_account_group }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: loki_account_user

- name: "Loki | Provision the SeaweedFS S3 bucket + scoped identity"
  ansible.builtin.include_role:
    name: seaweedfs_bucket
  vars:
    seaweedfs_bucket_identity: "{{ loki_s3_identity }}"
    seaweedfs_bucket_names: ["{{ loki_s3_bucket }}"]
    seaweedfs_bucket_vault_path: "{{ loki_s3_vault_path }}"

- name: "Loki | Bind the S3 credentials (handed back by seaweedfs_bucket)"
  ansible.builtin.set_fact:
    loki_s3_creds: "{{ seaweedfs_bucket_key }}"
  no_log: true

- name: "Loki | Config and local scratch directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ loki_account_group if item.owner != 'root' else 'root' }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ loki_config_dir }}", owner: root, mode: "0755"}
    - {path: "{{ loki_data_dir }}", owner: "{{ loki_account }}", mode: "0750"}
  loop_control:
    label: "{{ item.path }}"

- name: "Loki | Config (config.yml, S3 backend) in {{ loki_config_dir }}"
  ansible.builtin.template:
    src: loki.yaml.j2
    dest: "{{ loki_config_dir }}/config.yml"
    owner: root
    group: "{{ loki_account_group }}"
    mode: "0640"
  no_log: true   # contains S3 secret key
  register: loki_config_file

- name: "Loki | The native unit stops (retired; it holds :{{ loki_port }})"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ loki_native }}"

- name: "Loki | The container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: loki
      containers:
        - name: "{{ loki_container }}"
          image: "{{ loki_image }}"
          network_mode: host
          log_driver: journald   # container log -> journal -> promtail -> Loki (INF-27)
          user: "{{ loki_account_user.uid | default(0) }}:{{ loki_account_user.group | default(0) }}"
          command: ["-config.file={{ loki_config_dir }}/config.yml"]
          volumes:
            # the config's directory, not the file: Ansible replaces files by rename (new inode)
            - "{{ loki_config_dir }}:{{ loki_config_dir }}:ro"
            - "{{ loki_data_dir }}:{{ loki_data_dir }}"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"   # the S3 endpoint's TLS is checked against the host's store
          restart: "{{ loki_config_file is changed }}"

- name: "Loki | Ready (read-only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ loki_port }}/ready"
    status_code: [200]
  register: loki_ready
  until: loki_ready.status == 200
  retries: 30
  delay: 5
  when: not ansible_check_mode

- name: "Loki | The native install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ loki_native }}"

- name: "Loki | Host firewall rules for the listeners (host network; when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ loki_firewall_rules }}"
  tags: [loki, firewall]
