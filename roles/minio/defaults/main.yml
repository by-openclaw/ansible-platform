---
# ==============================================================================
# Role: minio — local S3 object storage (lxc-minio-01, SVC). Native binary +
# systemd (no Docker). Fast in-house tier for GitLab (artifacts/LFS/registry),
# backup staging, and apps needing local S3. Pinned releases, never :latest.
# ==============================================================================
minio_version: "RELEASE.2025-09-07T16-13-09Z"
minio_mc_version: "RELEASE.2025-08-13T08-35-41Z"
minio_url: "https://dl.min.io/server/minio/release/linux-amd64/archive/minio.{{ minio_version }}"
minio_mc_url: "https://dl.min.io/client/mc/release/linux-amd64/archive/mc.{{ minio_mc_version }}"

minio_user: "minio-user"                 # system service account (not the S3 root)
minio_data_dir: "/data"                  # S3 backing store (persistent — never wipe)
minio_api_port: 9000
minio_console_port: 9001
minio_region: "fabric"

minio_listen_ip: "10.1.3.200"
minio_fqdn: "minio.by-research.be"        # S3 API (via Traefik)
minio_console_fqdn: "minio-console.by-research.be"   # single-level: covered by *.by-research.be wildcard cert

# Controller secret (root + rune/opus access keys), Vault-mirrored.
minio_secret: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/fabric/infra-minio-poc.json"

# Buckets to create on first run (GitLab + backups + generic).
minio_buckets:
  - gitlab-artifacts
  - gitlab-lfs
  - gitlab-registry
  - gitlab-backups
  - backup-staging
