---
# ==============================================================================
# Role: adguard — default variables (PROD vm-adguard-01)
# Override per group_vars / host_vars as needed.
# Mirrors infra-terraform-proxmox/modules/vm-opnsense/seed/setup-adguard-tls.sh
# parameterized for the PROD AdGuard VM (10.1.x / fd01:).
# ==============================================================================

# ------------------------------------------------------------------------------
# Identity / addressing
# ------------------------------------------------------------------------------
adguard_ip: "{{ hostvars[groups['adguard'] | first].ansible_host }}"
adguard_ip6: "{{ hostvars[inventory_hostname].platform_host_v6 }}"
# Primary NIC (netplan) — used to disable IPv6 RA/SLAAC so the host stays
# static-only (keeps adguard_ip6, drops the auto EUI-64 mngtmpaddr).
adguard_primary_iface: "eth0"
# prod wildcard *.{{ platform_domain }} (NOT test.{{ platform_domain }})
adguard_domain: "{{ platform_domain }}"
adguard_renew_days: 30

# Upstream = the PROD OPNsense FW Unbound (SVC gateway). NOTE: prod FW currently
# has dnscryptproxy disabled and Unbound recursing on :53, so default is the SVC
# gateway on :53. If Unbound is later moved to :53530, set "10.1.3.1:53530".
adguard_upstreams:
  - "{{ platform_zones.svc.gw4 }}"

# Bootstrap resolvers (used only to resolve upstream hostnames / ACME, etc.)
adguard_bootstrap_dns:
  - "9.9.9.10"
  - "149.112.112.10"
  - "2620:fe::10"
  - "2620:fe::fe:10"

# ------------------------------------------------------------------------------
# The container
# ------------------------------------------------------------------------------
# AdGuardHome runs as a container: the pinned official image on the host network
# (it binds :53, :853, :443 and the UI port on the host, as the binary did).
# renovate: datasource=docker depName=adguard/adguardhome extractVersion=^v(?<version>.*)$
adguard_version: "0.107.79"
adguard_image: "adguard/adguardhome:v{{ adguard_version }}"
adguard_container: adguard
# Config (AdGuardHome.yaml) and data (filters, query log, stats) — one host dir, mounted
# at the image's conf and work paths, so the image runs its own default command.
adguard_home_dir: "/opt/AdGuardHome"
# The retired native install (removed once the container answers).
adguard_native_retired_files:
  - /etc/systemd/system/AdGuardHome.service
  - "{{ adguard_home_dir }}/AdGuardHome"   # the binary (the container ships its own)

# ------------------------------------------------------------------------------
# Secret files — live on the CONTROLLER (operator machine), read via lookup.
# ------------------------------------------------------------------------------
# Cloudflare zone secret (token + ACME e-mail) — Vault, never a file.
adguard_cf_vault_path: "{{ platform_env }}/cloudflare/{{ platform_domain | replace('.', '-') }}"
adguard_admin_vault_path: "{{ platform_env }}/adguard/admin"   # admin user/password/bcrypt (generated once)

# ------------------------------------------------------------------------------
# AdGuard admin / ports
# ------------------------------------------------------------------------------
adguard_admin_user: "admin"
adguard_http_address: "0.0.0.0:3000"
adguard_dns_address: "0.0.0.0"
adguard_dns_port: 53
adguard_schema_version: 28
# Retention is set by the inventory (group_vars/adguard.yml), not here — a
# deployment policy: adguard_querylog_retention, adguard_statistics_retention.

# ------------------------------------------------------------------------------
# Per-VLAN persistent client policies (mirrors the bash VLAN_CLIENTS block).
# parental on for iot+cctv; safe_search on for iot.
# ------------------------------------------------------------------------------
# One entry per zone of the network catalog (group_vars/all/network.yml): {zone, cidr4, cidr6}.
adguard_vlan_clients: >-
  {%- set zones = [] -%}
  {%- for name, z in platform_zones.items() -%}
  {%- set _ = zones.append({'zone': name, 'cidr4': z.cidr4, 'cidr6': z.cidr6}) -%}
  {%- endfor -%}
  {{ zones }}

# Zones that get parental control / safe-search enabled.
adguard_parental_zones:
  - iot
  - cctv
adguard_safesearch_zones:
  - iot

# ------------------------------------------------------------------------------
# Default filter lists (useful out of the box).
# ------------------------------------------------------------------------------
adguard_filters:
  - {enabled: true, id: 1, name: "AdGuard DNS filter", url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_1.txt"}
  - {enabled: true, id: 2, name: "AdAway Default Blocklist", url: "https://adguardteam.github.io/HostlistsRegistry/assets/filter_2.txt"}

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
adguard_tls_port: 853                      # DoT (tcp) + DoQ (udp) listener
adguard_firewall_rules:
  - { port: "{{ adguard_dns_port }}", proto: udp, from: "{{ platform_trusted_cidrs }}", comment: "DNS (AdGuard)" }
  - { port: "{{ adguard_dns_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "DNS (AdGuard)" }
  - { port: "{{ adguard_tls_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "DNS over TLS" }
  - { port: "{{ adguard_tls_port }}", proto: udp, from: "{{ platform_trusted_cidrs }}", comment: "DNS over QUIC" }
  - { port: "{{ adguard_http_address.split(':') | last }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "AdGuard UI via Traefik" }
