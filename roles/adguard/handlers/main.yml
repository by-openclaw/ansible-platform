---
# ==============================================================================
# Role: adguard — handlers (triggered by notify)
# ==============================================================================


- name: Apply netplan
  ansible.builtin.command:
    cmd: netplan apply
  changed_when: true

- name: "Restart systemd-resolved"
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted

- name: "Reload systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
