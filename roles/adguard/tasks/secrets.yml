---
# ==============================================================================
# Role: adguard — controller-side secret resolution
# Cloudflare token + ACME email come from Vault; the admin bcrypt hash is read from
# Vault, or generated once and stored there.
# All facts carry no_log to avoid echoing secret values.
# ==============================================================================

- name: "secrets | Read the Cloudflare zone secret from Vault (token + ACME e-mail)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ adguard_cf_vault_path }}"
    vault_secret_init: {}
  run_once: true

- name: "secrets | Adopt the Cloudflare token + ACME e-mail (no_log)"
  ansible.builtin.set_fact:
    adguard_cf_token: "{{ vault_secret_result.api_token }}"
    adguard_acme_email: "{{ vault_secret_result.acme_email }}"
  no_log: true
  run_once: true

# ------------------------------------------------------------------------------
# Admin bcrypt: reuse it from Vault; generate + store it there on first run.
# ------------------------------------------------------------------------------
- name: "secrets | Admin credentials (Vault, optional)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ adguard_admin_vault_path }}"
    vault_secret_optional: true
  run_once: true

- name: "secrets | Adopt the stored admin bcrypt hash"
  ansible.builtin.set_fact:
    adguard_admin_bcrypt: "{{ vault_secret_result.admin_bcrypt }}"
  no_log: true
  run_once: true
  when: vault_secret_result.admin_bcrypt | default('') | length > 0

# Made by Ansible on the controller: the random_string lookup, then the password_hash filter.
# Two tasks on purpose — a lookup is evaluated again each time its variable is read, so the
# password is fixed as a fact before it is hashed (and stored) below.
- name: "secrets | Generate a fresh admin password (controller)"
  ansible.builtin.set_fact:
    adguard_gen_password: "{{ lookup('community.general.random_string', length=adguard_admin_password_length, special=false) }}"
  run_once: true
  no_log: true
  when: not (adguard_admin_bcrypt is defined and adguard_admin_bcrypt | length > 0)

- name: "secrets | Its bcrypt hash (what AdGuard Home's configuration holds)"
  ansible.builtin.set_fact:
    adguard_gen_bcrypt: "{{ adguard_gen_password | password_hash('bcrypt', rounds=adguard_admin_bcrypt_rounds) }}"
  run_once: true
  no_log: true
  when: adguard_gen_password is defined

- name: "secrets | Store the generated admin credentials (Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ adguard_admin_vault_path }}"
    vault_secret_init:
      host: "{{ adguard_ip }}"
      admin_user: "{{ adguard_admin_user }}"
      admin_password: "{{ adguard_gen_password }}"
      admin_bcrypt: "{{ adguard_gen_bcrypt }}"
      port_admin: 3000
      port_doh: 443
      port_dot: 853
      port_doq: 853
    vault_secret_force_fields: "{{ vault_secret_init }}"
  run_once: true
  when: adguard_gen_bcrypt is defined

- name: "secrets | Set generated admin bcrypt fact"
  ansible.builtin.set_fact:
    adguard_admin_bcrypt: "{{ adguard_gen_bcrypt }}"
  no_log: true
  run_once: true
  when: adguard_gen_bcrypt is defined
