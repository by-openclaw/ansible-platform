---
# ==============================================================================
# Role: adguard — controller-side secret resolution
# Cloudflare token + ACME email come from Vault; reads-or-generates the admin bcrypt hash
# and persists a freshly generated secret JSON back to the controller.
# All facts carry no_log to avoid echoing secret values.
# ==============================================================================

- name: "secrets | Read the Cloudflare zone secret from Vault (token + ACME e-mail)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ adguard_cf_vault_path }}"
    vault_secret_init: {}
  run_once: true

- name: "secrets | Adopt the Cloudflare token + ACME e-mail (no_log)"
  ansible.builtin.set_fact:
    adguard_cf_token: "{{ vault_secret_result.api_token }}"
    adguard_acme_email: "{{ vault_secret_result.acme_email }}"
  no_log: true
  run_once: true

# ------------------------------------------------------------------------------
# Admin bcrypt: reuse if present in the prod secret, else generate + persist.
# ------------------------------------------------------------------------------
- name: "secrets | Check whether prod AdGuard secret exists on controller"
  ansible.builtin.stat:
    path: "{{ adguard_secret }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: adguard_secret_stat

- name: "secrets | Load existing admin bcrypt hash"
  ansible.builtin.set_fact:
    adguard_admin_bcrypt: "{{ (lookup('file', adguard_secret) | from_json).fields.admin_bcrypt }}"
  no_log: true
  run_once: true
  when:
    - adguard_secret_stat.stat.exists
    - (lookup('file', adguard_secret) | from_json).fields.admin_bcrypt | default('') | length > 0

- name: "secrets | Generate fresh admin password + bcrypt hash on controller"
  ansible.builtin.command:
    cmd: >-
      python3 -c "import bcrypt,secrets,string,json,sys;
      a=string.ascii_letters+string.digits;
      pw=''.join(secrets.choice(a) for _ in range(22));
      h=bcrypt.hashpw(pw.encode(),bcrypt.gensalt(rounds=10)).decode();
      print(json.dumps({'password':pw,'bcrypt':h}))"
  delegate_to: localhost
  become: false
  run_once: true
  register: adguard_gen
  changed_when: true
  no_log: true
  when: not (adguard_admin_bcrypt is defined and adguard_admin_bcrypt | length > 0)

- name: "secrets | Set generated admin bcrypt fact"
  ansible.builtin.set_fact:
    adguard_admin_bcrypt: "{{ (adguard_gen.stdout | from_json).bcrypt }}"
  no_log: true
  run_once: true
  when: adguard_gen is defined and adguard_gen is not skipped

- name: "secrets | Persist freshly generated secret JSON to controller (mode 0600)"
  ansible.builtin.copy:
    dest: "{{ adguard_secret }}"
    mode: "0600"
    content: >-
      {{
        {
          'fields': {
            'host': adguard_ip,
            'admin_user': adguard_admin_user,
            'admin_password': (adguard_gen.stdout | from_json).password,
            'admin_bcrypt': (adguard_gen.stdout | from_json).bcrypt,
            'port_admin': 3000,
            'port_doh': 443,
            'port_dot': 853,
            'port_doq': 853
          }
        } | to_nice_json
      }}
  delegate_to: localhost
  become: false
  run_once: true
  no_log: true
  when: adguard_gen is defined and adguard_gen is not skipped
