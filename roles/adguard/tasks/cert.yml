---
# The certificate (issue once, renew by systemd timer) — roles/lego_cert.
- name: "cert | Wildcard certificate via roles/lego_cert"
  ansible.builtin.include_role:
    name: lego_cert
  vars:
    lego_cert_id: adguard
    lego_cert_email: "{{ adguard_acme_email }}"
    lego_cert_domains: ["*.{{ adguard_domain }}", "{{ adguard_domain }}"]
    lego_cert_cf_token: "{{ adguard_cf_token }}"
    lego_cert_renew_days: "{{ adguard_renew_days }}"
    lego_cert_renew_hook: "systemctl reload-or-restart AdGuardHome"
    lego_cert_on_calendar: "*-*-* 03:17:00"
    lego_cert_legacy_cron: lego-renew-adguard
    lego_cert_legacy_script: /etc/lego/renew-adguard.sh
