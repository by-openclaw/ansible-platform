---
# ==============================================================================
# Role: adguard — certificate renewal automation (cron + script + logfile)
# Mirrors setup-adguard-tls.sh steps 4.
# ==============================================================================

- name: "renew | Deploy renewal script /etc/lego/renew-adguard.sh"
  ansible.builtin.template:
    src: renew-adguard.sh.j2
    dest: /etc/lego/renew-adguard.sh
    owner: root
    group: root
    mode: "0755"

- name: "renew | Ensure renewal logfile exists (0640)"
  ansible.builtin.file:
    path: /var/log/lego-renew.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: "renew | Install daily renewal cron (03:17)"
  ansible.builtin.cron:
    name: "lego-renew-adguard"
    cron_file: lego-renew-adguard
    user: root
    minute: "17"
    hour: "3"
    job: "/etc/lego/renew-adguard.sh >> /var/log/lego-renew.log 2>&1"
