---
# ==============================================================================
# Role: adguard — the host side: :53 free for AdGuard (the container binds it on the host
# network). What this host resolves with is roles/resolver's (hardening): it points a host
# that runs AdGuard at the firewall, through systemd-resolved's uplink list — no second
# writer of /etc/resolv.conf here. The container: container.yml.
# ==============================================================================
# ------------------------------------------------------------------------------
# Free :53 for AdGuard. debian-12-cloud runs systemd-resolved with a stub
# listener on 127.0.0.53:53; AdGuard binds 0.0.0.0:53 and would fail EADDRINUSE.
# ------------------------------------------------------------------------------
- name: "host | Disable systemd-resolved stub listener (frees :53)"
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-adguard.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: adguard_resolved_stub
  notify: Restart systemd-resolved

# The stub must be gone before AdGuard binds :53 — flush the handler now, not at the play's end.
- name: "host | Apply the resolver change before AdGuard binds :53"
  ansible.builtin.meta: flush_handlers
