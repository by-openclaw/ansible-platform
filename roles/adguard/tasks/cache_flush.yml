---
# ==============================================================================
# Role: adguard — cache_flush.yml: drop AdGuard's resolver cache (a restart is the only
# flush the daemon offers without its API). A firewall rebuild answers NXDOMAIN for internal names
# until the Unbound host overrides land; AdGuard caches that negative answer for the zone's
# negative TTL (1800 s), which stalls every Vault-backed step that follows (2026-09-21 drill).
# ==============================================================================
- name: "cache_flush | Restart AdGuardHome so cached negative answers are gone"
  community.docker.docker_container:
    name: "{{ adguard_container }}"
    state: started
    restart: true
  changed_when: true
  when: not ansible_check_mode

- name: "cache_flush | The resolver answers again"
  ansible.builtin.wait_for:
    port: 53
    host: "{{ adguard_bind_host | default('127.0.0.1') }}"
    timeout: 30
