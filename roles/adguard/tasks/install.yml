---
# ==============================================================================
# Role: adguard — install AdGuardHome + lego ACME client + dependencies
# Idempotent: guarded by stat/creates; only fetches when absent.
# ==============================================================================

- name: "install | Ensure base dependencies present"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
      # cron is absent on the minimal debian-12-cloud image; the renewal task
      # (renew.yml) uses ansible.builtin.cron, which needs the crontab binary.
      - cron
    state: present
    update_cache: true
    cache_valid_time: 3600

# ------------------------------------------------------------------------------
# Free :53 for AdGuard. debian-12-cloud runs systemd-resolved with a stub
# listener on 127.0.0.53:53; AdGuard binds 0.0.0.0:53 and would fail EADDRINUSE.
# Disable the stub, then pin a static resolv.conf to the FW Unbound (SVC gateway)
# so the host keeps working DNS once the stub is gone. The pin is declared state (idempotent
# copy), not a one-off tied to the stub change.
# ------------------------------------------------------------------------------
- name: "install | Disable systemd-resolved stub listener (frees :53)"
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-adguard.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: adguard_resolved_stub
  notify: Restart systemd-resolved

# The stub must be gone before AdGuard binds :53 — flush the handler now, not at the play's end.
- name: "install | Apply the resolver change before AdGuard binds :53"
  ansible.builtin.meta: flush_handlers

- name: "install | Pin static resolv.conf to the FW Unbound (SVC gateway)"
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by ansible (adguard role) — host resolves via the FW Unbound chain.
      nameserver {{ adguard_upstreams[0] | regex_replace(':.*$', '') }}
      options edns0 trust-ad
    owner: root
    group: root
    mode: "0644"
    follow: false

# ------------------------------------------------------------------------------
# AdGuardHome — download tarball, unpack, register systemd service
# ------------------------------------------------------------------------------
- name: "install | Check whether AdGuardHome binary exists"
  ansible.builtin.stat:
    path: "{{ adguard_home_dir }}/AdGuardHome"
  register: adguard_bin

# Install-if-absent alone means a version bump in git never reaches the host —
# the variable would simply stop matching reality. Compare what is installed
# against what is declared, and treat a mismatch as an upgrade.
- name: "install | Detect installed AdGuardHome version"
  ansible.builtin.command:
    cmd: "{{ adguard_home_dir }}/AdGuardHome --version"
  register: adguard_installed_raw
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe: must run under --check too
  when: adguard_bin.stat.exists

- name: "install | Decide whether an install or upgrade is needed"
  ansible.builtin.set_fact:
    adguard_installed_version: >-
      {{ ((adguard_installed_raw.stdout | default('', true)
           | regex_search('v([0-9]+\.[0-9]+\.[0-9]+)', '\1')) or ['none']) | first }}

- name: "install | Report the version decision"
  ansible.builtin.debug:
    msg: >-
      AdGuardHome installed={{ adguard_installed_version }},
      declared={{ adguard_version }} →
      {{ 'up to date' if adguard_installed_version == adguard_version else 'will install/upgrade' }}

- name: "install | Stop AdGuardHome before replacing the binary"
  ansible.builtin.systemd_service:
    name: AdGuardHome
    state: stopped
  when:
    - adguard_bin.stat.exists
    - adguard_installed_version != adguard_version
    - not ansible_check_mode

- name: "install | Download AdGuardHome release tarball"
  ansible.builtin.get_url:
    url: "{{ adguard_release_url }}"
    dest: "/tmp/AdGuardHome_{{ adguard_version }}_linux_amd64.tar.gz"
    mode: "0644"
  when: adguard_installed_version != adguard_version

- name: "install | Unpack AdGuardHome to {{ adguard_install_dir }}"
  ansible.builtin.unarchive:
    src: "/tmp/AdGuardHome_{{ adguard_version }}_linux_amd64.tar.gz"
    dest: "{{ adguard_install_dir }}"
    remote_src: true
    owner: root
    group: root
  when:
    - adguard_installed_version != adguard_version
    - not ansible_check_mode

- name: "install | Start AdGuardHome again after an upgrade"
  ansible.builtin.systemd_service:
    name: AdGuardHome
    state: started
  when:
    - adguard_bin.stat.exists
    - adguard_installed_version != adguard_version
    - not ansible_check_mode

- name: "install | Render the AdGuardHome systemd unit (WorkingDirectory pinned to the install dir)"
  ansible.builtin.template:
    src: AdGuardHome.service.j2
    dest: /etc/systemd/system/AdGuardHome.service
    owner: root
    group: root
    mode: "0644"
  register: adguard_unit_file
  notify:
    - Reload systemd
    - Restart AdGuardHome

- name: "install | AdGuardHome enabled + running"
  ansible.builtin.systemd:
    name: AdGuardHome
    enabled: true
    state: started

# ------------------------------------------------------------------------------
# lego — ACME client (Debian package too old for the Cloudflare DNS provider)
# ------------------------------------------------------------------------------
- name: "install | Detect installed lego version"
  ansible.builtin.command: /usr/local/bin/lego --version
  check_mode: false   # read-only probe: must run under --check too
  register: adguard_lego_check
  changed_when: false
  failed_when: false

- name: "install | Determine whether the pinned lego version needs (re)install"
  ansible.builtin.set_fact:
    # Idempotent: (re)install only when lego is absent or not the pinned version.
    adguard_lego_needs_install: >-
      {{ adguard_lego_check.rc != 0
         or adguard_lego_version not in adguard_lego_check.stdout }}

- name: "install | Download lego release tarball"
  ansible.builtin.get_url:
    url: "{{ adguard_lego_url }}"
    dest: /tmp/lego_linux_amd64.tar.gz
    mode: "0644"
  when: adguard_lego_needs_install | bool

- name: "install | Extract lego binary to /usr/local/bin"
  ansible.builtin.unarchive:
    src: /tmp/lego_linux_amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - lego
    owner: root
    group: root
    mode: "0755"
  when: adguard_lego_needs_install | bool
