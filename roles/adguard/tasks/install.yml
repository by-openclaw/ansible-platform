---
# ==============================================================================
# Role: adguard — install AdGuardHome + lego ACME client + dependencies
# Idempotent: guarded by stat/creates; only fetches when absent.
# ==============================================================================

- name: "install | Ensure base dependencies present"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
      # cron is absent on the minimal debian-12-cloud image; the renewal task
      # (renew.yml) uses ansible.builtin.cron, which needs the crontab binary.
      - cron
    state: present
    update_cache: true
    cache_valid_time: 3600

# ------------------------------------------------------------------------------
# Free :53 for AdGuard. debian-12-cloud runs systemd-resolved with a stub
# listener on 127.0.0.53:53; AdGuard binds 0.0.0.0:53 and would fail EADDRINUSE.
# Disable the stub, then pin a static resolv.conf to the FW Unbound (SVC gateway)
# so the host keeps working DNS once the stub is gone.
# ------------------------------------------------------------------------------
- name: "install | Disable systemd-resolved stub listener (frees :53)"
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/99-adguard.conf
    content: |
      [Resolve]
      DNSStubListener=no
    owner: root
    group: root
    mode: "0644"
  register: adguard_resolved_stub

- name: "install | Restart systemd-resolved to release :53"
  ansible.builtin.systemd_service:
    name: systemd-resolved
    state: restarted
  when: adguard_resolved_stub is changed

- name: "install | Pin static resolv.conf to the FW Unbound (SVC gateway)"
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by ansible (adguard role) — host resolves via the FW Unbound chain.
      nameserver {{ adguard_upstreams[0] | regex_replace(':.*$', '') }}
      options edns0 trust-ad
    owner: root
    group: root
    mode: "0644"
    follow: false
  when: adguard_resolved_stub is changed

# ------------------------------------------------------------------------------
# AdGuardHome — download tarball, unpack, register systemd service
# ------------------------------------------------------------------------------
- name: "install | Check whether AdGuardHome binary exists"
  ansible.builtin.stat:
    path: "{{ adguard_home_dir }}/AdGuardHome"
  register: adguard_bin

- name: "install | Download AdGuardHome release tarball"
  ansible.builtin.get_url:
    url: "{{ adguard_release_url }}"
    dest: /tmp/AdGuardHome_linux_amd64.tar.gz
    mode: "0644"
  when: not adguard_bin.stat.exists

- name: "install | Unpack AdGuardHome to {{ adguard_install_dir }}"
  ansible.builtin.unarchive:
    src: /tmp/AdGuardHome_linux_amd64.tar.gz
    dest: "{{ adguard_install_dir }}"
    remote_src: true
    creates: "{{ adguard_home_dir }}/AdGuardHome"
    owner: root
    group: root
  when: not adguard_bin.stat.exists

- name: "install | Check whether AdGuardHome systemd unit is registered"
  ansible.builtin.stat:
    path: /etc/systemd/system/AdGuardHome.service
  register: adguard_unit

- name: "install | Register AdGuardHome systemd service"
  ansible.builtin.command:
    cmd: "{{ adguard_home_dir }}/AdGuardHome -s install"
    creates: /etc/systemd/system/AdGuardHome.service
  when: not adguard_unit.stat.exists

# ------------------------------------------------------------------------------
# lego — ACME client (Debian package too old for the Cloudflare DNS provider)
# ------------------------------------------------------------------------------
- name: "install | Detect installed lego version"
  ansible.builtin.command: /usr/local/bin/lego --version
  register: adguard_lego_check
  changed_when: false
  failed_when: false

- name: "install | Determine whether the pinned lego version needs (re)install"
  ansible.builtin.set_fact:
    # Idempotent: (re)install only when lego is absent or not the pinned version.
    adguard_lego_needs_install: >-
      {{ adguard_lego_check.rc != 0
         or adguard_lego_version not in adguard_lego_check.stdout }}

- name: "install | Download lego release tarball"
  ansible.builtin.get_url:
    url: "{{ adguard_lego_url }}"
    dest: /tmp/lego_linux_amd64.tar.gz
    mode: "0644"
  when: adguard_lego_needs_install | bool

- name: "install | Extract lego binary to /usr/local/bin"
  ansible.builtin.unarchive:
    src: /tmp/lego_linux_amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - lego
    owner: root
    group: root
    mode: "0755"
  when: adguard_lego_needs_install | bool
