---
# ==============================================================================
# Role: adguard — main task dispatcher (AdGuardHome, a container)
#   static-only IPv6 -> the host side (:53 free, resolv.conf) -> Vault secrets
#   -> wildcard certificate (roles/lego_cert) -> AdGuardHome.yaml (before the start)
#   -> the container -> host firewall
# ==============================================================================

- name: Static-only IPv6 (disable RA/SLAAC)
  ansible.builtin.import_tasks: network_ra.yml
  tags: [adguard, network, ipv6]

- name: The host side of the resolver (:53 free, resolv.conf)
  ansible.builtin.import_tasks: host.yml
  tags: [adguard, host]

- name: Resolve controller-side secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [always]   # every tagged phase (cert, config) needs the Vault facts

- name: Issue/renew wildcard TLS certificate
  ansible.builtin.import_tasks: cert.yml
  tags: [adguard, cert]

- name: Render AdGuardHome configuration
  ansible.builtin.import_tasks: config.yml
  tags: [adguard, config]

- name: Run AdGuardHome as a container
  ansible.builtin.import_tasks: container.yml
  tags: [adguard, container]

- name: "AdGuard | Host firewall rules for the listeners (host network; when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ adguard_firewall_rules }}"
  tags: [adguard, firewall]
