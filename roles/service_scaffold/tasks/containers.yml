---
# The container half of the contract. A container service used to be N hand-written
# copies of "pull the pinned image / run it / wait for health" — diagrams was 79%
# that, step-ca 75%. It is data now, so adding a container is a list entry rather
# than three more tasks that can drift from their neighbours.
- name: "Scaffold | Private network for {{ service_scaffold_def.name }}"
  community.docker.docker_network:
    name: "{{ service_scaffold_def.network }}"
    state: present
  when: (service_scaffold_def.network | default('')) | length > 0

- name: "Scaffold | Pull the pinned images"
  community.docker.docker_image:
    name: "{{ scaffold_ctr.image }}"
    source: pull
    force_source: false
  loop: "{{ service_scaffold_def.containers | default([]) }}"
  loop_control:
    loop_var: scaffold_ctr
    label: "{{ scaffold_ctr.image }}"

- name: "Scaffold | Run the containers"
  community.docker.docker_container:
    name: "{{ scaffold_ctr.name }}"
    image: "{{ scaffold_ctr.image }}"
    state: "{{ scaffold_ctr.state | default('started') }}"   # absent: e.g. a host opted out
    restart_policy: "{{ scaffold_ctr.restart_policy | default('unless-stopped') }}"
    networks: >-
      {{ [{'name': service_scaffold_def.network} | combine({'aliases': scaffold_ctr.aliases} if scaffold_ctr.aliases is defined else {})]
         if (service_scaffold_def.network | default('')) | length > 0 else omit }}
    network_mode: "{{ scaffold_ctr.network_mode | default(service_scaffold_def.network | default(omit, true)) }}"
    published_ports: "{{ scaffold_ctr.published | default([]) }}"
    volumes: "{{ scaffold_ctr.volumes | default([]) }}"
    env: "{{ scaffold_ctr.env | default({}) }}"
    entrypoint: "{{ scaffold_ctr.entrypoint | default(omit) }}"
    command: "{{ scaffold_ctr.command | default(omit) }}"
    user: "{{ scaffold_ctr.user | default(omit) }}"
    log_driver: "{{ scaffold_ctr.log_driver | default(omit) }}"
    healthcheck: "{{ scaffold_ctr.healthcheck | default(omit) }}"
    restart: "{{ scaffold_ctr.restart | default(omit) }}"   # e.g. a config the app does not hot-reload changed
    recreate: "{{ scaffold_ctr.recreate | default(omit) }}"
    security_opts: "{{ scaffold_ctr.security_opts | default(omit) }}"
    hostname: "{{ scaffold_ctr.hostname | default(omit) }}"
    shm_size: "{{ scaffold_ctr.shm_size | default(omit) }}"
    ulimits: "{{ scaffold_ctr.ulimits | default(omit) }}"
    etc_hosts: "{{ scaffold_ctr.etc_hosts | default(omit) }}"
    env_file: "{{ scaffold_ctr.env_file | default(omit) }}"
    comparisons: "{{ scaffold_ctr.comparisons | default(omit) }}"
  loop: "{{ service_scaffold_def.containers | default([]) }}"
  loop_control:
    loop_var: scaffold_ctr
    label: "{{ scaffold_ctr.name }}"
  # env carries credentials (admin passwords, OIDC client secrets, DB URIs): a changed
  # or failed result would print them. The container names are in the task above.
  no_log: true

# A dry-run never started these, so it cannot test them: it skips rather than
# reporting a failure it caused itself.
- name: "Scaffold | Wait for each container that declares a health URL"
  ansible.builtin.uri:
    url: "{{ scaffold_ctr.health }}"
    status_code: "{{ scaffold_ctr.health_status | default([200]) }}"
  register: scaffold_health
  retries: "{{ scaffold_ctr.health_retries | default(30) }}"
  delay: "{{ scaffold_ctr.health_delay | default(4) }}"
  until: scaffold_health.status | default(0) in (scaffold_ctr.health_status | default([200]))
  loop: "{{ service_scaffold_def.containers | default([]) | selectattr('health', 'defined') | list }}"
  loop_control:
    loop_var: scaffold_ctr
    label: "{{ scaffold_ctr.name }}"
  when: not ansible_check_mode
