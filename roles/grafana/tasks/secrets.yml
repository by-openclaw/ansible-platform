---
# Break-glass admin password (generated once, persisted on the controller) + the
# Authentik OIDC client (written by the authentik role). All facts no_log.
- name: "Grafana | Stat the admin secret on the controller"
  ansible.builtin.stat:
    path: "{{ grafana_secret_dir | expanduser }}/{{ grafana_admin_secret_file }}"
  delegate_to: localhost
  become: false
  register: grafana_admin_stat

- name: "Grafana | Generate + persist the admin password (0600)"
  ansible.builtin.copy:
    dest: "{{ grafana_secret_dir | expanduser }}/{{ grafana_admin_secret_file }}"
    mode: "0600"
    content: |
      {{ {'fields': {
           'admin_user': grafana_admin_user,
           'admin_password': lookup('community.general.random_string', length=28, special=false),
           'note': 'Grafana break-glass local admin (SSO via Authentik is the norm)'
         }} | to_nice_json }}
  delegate_to: localhost
  become: false
  no_log: true
  when: not grafana_admin_stat.stat.exists

- name: "Grafana | Load the admin password"
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ (lookup('file', (grafana_secret_dir | expanduser) + '/' + grafana_admin_secret_file) | from_json).fields.admin_password }}"
  no_log: true

- name: "Grafana | Load the Postgres password"
  ansible.builtin.set_fact:
    grafana_pg_password: "{{ (lookup('file', (grafana_secret_dir | expanduser) + '/' + grafana_pg_secret_file) | from_json).fields.password }}"
  no_log: true
  when: grafana_db_enabled | bool

- name: "Grafana | Stat the OIDC client secret on the controller"
  ansible.builtin.stat:
    path: "{{ grafana_secret_dir | expanduser }}/{{ grafana_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: grafana_oidc_stat

- name: "Grafana | Load the Authentik OIDC client + mark configured"
  ansible.builtin.set_fact:
    grafana_oidc: "{{ (lookup('file', (grafana_secret_dir | expanduser) + '/' + grafana_oidc_secret_file) | from_json).fields }}"
    grafana_oidc_configured: true
  no_log: true
  when:
    - grafana_oidc_enabled | bool
    - grafana_oidc_stat.stat.exists
