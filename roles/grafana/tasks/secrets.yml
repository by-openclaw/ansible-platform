---
# The break-glass admin password, the Postgres password and the Authentik OIDC
# client — all from Vault; nothing read from or written to the controller (#377).
# All facts no_log.

# Get-or-create: absent in Vault -> minted once and stored; present -> read. Same
# behaviour the stat-then-persist-then-read sequence had, with Vault holding the
# state instead of a 0600 file on one machine. The path exists, so the live
# password is READ — this is the break-glass account, so re-minting it would
# silently invalidate the way in when SSO is what is broken.
- name: "Grafana | The break-glass admin password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ grafana_admin_vault_path }}"
    vault_secret_init:
      admin_user: "{{ grafana_admin_user }}"
      admin_password: "{{ lookup('community.general.random_string', length=28, special=false) }}"
      note: "Grafana break-glass local admin (SSO via Authentik is the norm)"

- name: "Grafana | Bind it"
  ansible.builtin.set_fact:
    grafana_admin_password: "{{ vault_secret_result.admin_password }}"
  no_log: true

- name: "Grafana | The Postgres password (minted by postgres_db)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ grafana_pg_vault_path }}"
  when: grafana_db_enabled | bool

- name: "Grafana | Bind it"
  ansible.builtin.set_fact:
    grafana_pg_password: "{{ vault_secret_result.password }}"
  no_log: true
  when: grafana_db_enabled | bool

# Read-if-present: roles/authentik mints these, and Grafana can be installed
# before SSO is wired. grafana_oidc_configured gates the SSO block in
# grafana.ini.j2, and it now means "the client secret is held" rather than "a file
# sits on one machine" — which is the thing the template actually depends on.
- name: "Grafana | The Authentik OIDC client, if it exists yet"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ grafana_oidc_vault_path }}"
    vault_secret_optional: true
  when: grafana_oidc_enabled | bool

- name: "Grafana | Bind it, and whether SSO can be configured"
  ansible.builtin.set_fact:
    grafana_oidc: "{{ vault_secret_result | default({}) }}"
    grafana_oidc_configured: >-
      {{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}
  no_log: true
  when: grafana_oidc_enabled | bool
