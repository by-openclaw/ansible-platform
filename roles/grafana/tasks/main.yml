---
# ==============================================================================
# Role: grafana — dashboards on lxc-monitoring-01, SSO via Authentik, Prometheus
# (+ optional Loki) datasource, behind Traefik (VPN-only).
# ==============================================================================
- name: "Grafana | Create the cluster Postgres database + role"
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    # The same path the role reads back in secrets.yml, so the provisioning and
    # consuming sides agree by construction rather than by a filename matching.
    postgres_db_vault_path: "{{ grafana_pg_vault_path }}"
    postgres_db_name: "{{ grafana_pg_name }}"
    postgres_db_user: "{{ grafana_pg_user }}"
  when: grafana_db_enabled | bool
  tags: [db]

- name: "Grafana | Service account group"
  ansible.builtin.group:
    name: "{{ grafana_account }}"
    system: true
  tags: [install]

- name: "Grafana | Service account (owns the data dir; the container runs as it)"
  ansible.builtin.user:
    name: "{{ grafana_account }}"
    group: "{{ grafana_account }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: grafana_account_user
  tags: [install]

- name: "Grafana | Config, provisioning, data and log directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ grafana_account }}"
    mode: "0755"
  loop:
    - {path: "{{ grafana_config_dir }}", owner: root}
    - {path: "{{ grafana_config_dir }}/provisioning/datasources", owner: root}
    - {path: "{{ grafana_data_dir }}", owner: "{{ grafana_account }}"}
    - {path: "{{ grafana_log_dir }}", owner: "{{ grafana_account }}"}
  loop_control:
    label: "{{ item.path }}"
  tags: [install]

- name: "Grafana | Secrets (admin password + OIDC client)"
  ansible.builtin.import_tasks: secrets.yml
  tags: [config, sso]

- name: "Grafana | Provisioned datasources (Prometheus + optional Loki)"
  ansible.builtin.template:
    src: datasources.yaml.j2
    dest: "{{ grafana_config_dir }}/provisioning/datasources/datasources.yaml"
    owner: root
    group: "{{ grafana_account }}"
    mode: "0640"
  register: grafana_datasources_file
  tags: [config]

- name: "Grafana | grafana.ini (server + security + OIDC)"
  ansible.builtin.template:
    src: grafana.ini.j2
    dest: "{{ grafana_config_dir }}/grafana.ini"
    owner: root
    group: "{{ grafana_account }}"
    mode: "0640"
  no_log: true   # contains admin password + OIDC secret
  register: grafana_ini_file
  tags: [config, sso]

- name: "Grafana | The native unit stops (retired; it holds :{{ grafana_port }})"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ grafana_native }}"
  tags: [config]

- name: "Grafana | The container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: grafana
      containers:
        - name: "{{ grafana_container }}"
          image: "{{ grafana_image }}"
          network_mode: host
          log_driver: journald   # container log -> journal -> promtail -> Loki (INF-27)
          user: "{{ grafana_account_user.uid | default(0) }}:{{ grafana_account_user.group | default(0) }}"
          # Read-only root filesystem: data, logs and configuration are host directories; the
          # plugin loader unpacks and RUNS its helpers from /tmp, hence the exec flag.
          read_only: true
          tmpfs: ["/tmp:rw,exec,size=256m"]
          cap_drop: [ALL]
          security_opts: ["no-new-privileges:true"]
          volumes:
            - "{{ grafana_config_dir }}:{{ grafana_config_dir }}:ro"
            - "{{ grafana_data_dir }}:{{ grafana_data_dir }}"
            - "{{ grafana_log_dir }}:{{ grafana_log_dir }}"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"   # verify-full to Postgres (grafana_pg_ca) + OIDC: the host's store
          restart: "{{ grafana_datasources_file is changed or grafana_ini_file is changed }}"
  tags: [config]

- name: "Grafana | Healthy (read-only)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ grafana_port }}/api/health"
    status_code: [200]
  register: grafana_health
  until: grafana_health.status == 200
  retries: 30
  delay: 5
  when: not ansible_check_mode
  tags: [config]

- name: "Grafana | The native install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ grafana_native }}"
  tags: [config]

- name: "Grafana | Publish via Traefik (internal / VPN-only)"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: grafana
    traefik_route_fqdn: "{{ grafana_fqdn }}"
    traefik_route_backend_url: "http://{{ hostvars[inventory_hostname].ansible_host }}:{{ grafana_port }}"
    traefik_route_internal_only: true
    # internal_cidrs (LAN + VPN + loopback) now come from the role default — the
    # VPN overlay is canonical for every internal service (was a per-role override).
  when: grafana_traefik_enabled | default(true) | bool
  tags: [route]

- name: "Grafana | Host firewall rules for the native listeners (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ grafana_firewall_rules }}"
  tags: [grafana, firewall]
