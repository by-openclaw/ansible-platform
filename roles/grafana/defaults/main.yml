---
# Grafana — dashboards on lxc-monitoring-01. Official APT repo (pinned channel),
# systemd. SSO via Authentik OIDC (generic_oauth); datasource = local Prometheus
# (+ Loki when it exists). Behind Traefik (grafana.{{ platform_domain }}, VPN-only).
grafana_fqdn: "grafana.{{ platform_domain }}"
grafana_port: 3000
grafana_listen: "0.0.0.0"          # Traefik (DMZ) reaches it; route is VPN-gated
grafana_secret_dir: "~/.openclaw/workspace/infra/secrets"

# --- APT repo (grafana.com) ---------------------------------------------------
grafana_apt_key_url: "https://apt.grafana.com/gpg.key"
grafana_apt_repo: "deb [signed-by=/usr/share/keyrings/grafana.gpg] https://apt.grafana.com stable main"

# --- local break-glass admin (generated + stored if absent) -------------------
grafana_admin_user: "admin"
grafana_admin_secret_file: "fabric/app-grafana-admin.json"

# --- Authentik OIDC -----------------------------------------------------------
grafana_oidc_enabled: true
grafana_oidc_secret_file: "fabric/app-oidc-grafana.json"   # written by the authentik role
grafana_authentik_base: "https://authentik.{{ platform_domain }}"
grafana_oidc_slug: "grafana"
grafana_admin_group: "{{ platform_service_groups.monitoring.admin }}"   # members -> Grafana Admin (role_attribute_path)

# --- datasources --------------------------------------------------------------
grafana_prometheus_url: "http://localhost:9090"
grafana_loki_url: "http://localhost:3100"   # Loki is co-located on this host
grafana_alertmanager_url: "http://127.0.0.1:9093"   # Alertmanager (role alertmanager), same host

# --- database: cluster Postgres (NOT local sqlite) ----------------------------
# Keeps Grafana's state (dashboards/users) off the LXC disk, on the shared PG.
grafana_db_enabled: true
grafana_pg_host: "lxc-pgsql-01.{{ platform_domain }}"
grafana_pg_port: 5432
grafana_pg_name: "grafana"
grafana_pg_user: "grafana"
grafana_pg_secret_file: "fabric/db-pgsql-grafana.json"   # written by postgres_db
grafana_pg_ca: "/etc/ssl/certs/ca-certificates.crt"

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
grafana_firewall_rules:
  - { port: "{{ grafana_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "Grafana (Traefik)" }
