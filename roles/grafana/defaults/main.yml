---
# Grafana — dashboards on lxc-monitoring-01. A container (the pinned official image,
# host network). SSO via Authentik OIDC (generic_oauth); datasource = local Prometheus
# (+ Loki when it exists). Behind Traefik (grafana.{{ platform_domain }}, VPN-only).
grafana_fqdn: "{{ platform_service_fqdns.monitoring }}"
grafana_port: 3000
grafana_listen: "0.0.0.0"          # Traefik (DMZ) reaches it; route is VPN-gated
# Vault KV paths (security/0001 secret/{env}/{service}/{key}) — no controller files.

# --- The container ------------------------------------------------------------------
# The image's default paths are the Debian package's (config /etc/grafana, data
# /var/lib/grafana, logs /var/log/grafana, provisioning /etc/grafana/provisioning).
# renovate: datasource=docker depName=grafana/grafana
grafana_version: "13.2.3"   # 2026-09-29 security release (three CVEs)
grafana_image: "grafana/grafana:{{ grafana_version }}"
grafana_container: grafana
grafana_config_dir: /etc/grafana
grafana_data_dir: /var/lib/grafana
grafana_log_dir: /var/log/grafana
# The account it runs as (owns the data dir; grafana.ini is readable by its group).
grafana_account: grafana
grafana_native:
  units: [grafana-server]
  packages: [grafana]
  files: [/etc/default/grafana-server]

# --- local break-glass admin (generated + stored if absent) -------------------
grafana_admin_user: "admin"
grafana_admin_vault_path: "{{ platform_env }}/grafana/admin"       # break-glass admin

# --- Authentik OIDC -----------------------------------------------------------
grafana_oidc_enabled: true
grafana_oidc_vault_path: "{{ platform_env }}/grafana/oidc"         # minted by roles/authentik
grafana_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
grafana_oidc_slug: "grafana"
grafana_admin_group: "{{ platform_service_groups.monitoring.admin }}"   # members -> Grafana Admin (role_attribute_path)

# --- datasources --------------------------------------------------------------
grafana_prometheus_url: "http://localhost:9090"
grafana_loki_url: "http://localhost:3100"   # Loki is co-located on this host
grafana_alertmanager_url: "http://127.0.0.1:9093"   # Alertmanager (role alertmanager), same host

# --- database: cluster Postgres (NOT local sqlite) ----------------------------
# Keeps Grafana's state (dashboards/users) off the LXC disk, on the shared PG.
grafana_db_enabled: true
grafana_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"
grafana_pg_port: 5432
grafana_pg_name: "grafana"
grafana_pg_user: "grafana"
grafana_pg_vault_path: "{{ platform_env }}/grafana/db-pgsql"       # minted by postgres_db
grafana_pg_ca: "/etc/ssl/certs/ca-certificates.crt"

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
grafana_firewall_rules:
  - { port: "{{ grafana_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "Grafana (Traefik)" }
