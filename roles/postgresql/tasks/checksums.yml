---
# Data checksums on an EXISTING cluster (pg_data_checksums). `pg_checksums --enable` only works on
# a cleanly stopped cluster, so the conversion is: stop the container (SIGINT = fast shutdown),
# prove the control file says "shut down", convert with the SAME pinned image on the SAME volume,
# and let the container step start the server again. Runs once; afterwards the probe reads `on`.
- name: "checksums | Current setting (absent container = a new cluster, initialised with checksums)"
  ansible.builtin.command:
    argv: [docker, exec, "{{ pg_container_name }}", psql, -U, postgres, -Atc, "show data_checksums"]
  register: pg_checksums_now
  changed_when: false
  failed_when: false
  check_mode: false   # read-only probe

- name: "checksums | Convert the stopped cluster (one restart of the database)"
  when:
    - pg_data_checksums | bool
    - pg_checksums_now.rc == 0
    - pg_checksums_now.stdout | trim == 'off'
  block:
    - name: "checksums | Stop PostgreSQL cleanly"
      ansible.builtin.command:
        argv: [docker, stop, --time, "{{ pg_stop_timeout | string }}", "{{ pg_container_name }}"]
      changed_when: true

    - name: "checksums | The control file reports a clean shutdown"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - postgres
          - --volume
          - "{{ pg_data_volume }}:/var/lib/postgresql/data"
          - "{{ pg_image }}"
          - pg_controldata
          - /var/lib/postgresql/data/pgdata
      register: pg_checksums_control
      changed_when: false
      failed_when: >-
        pg_checksums_control.rc != 0 or
        (pg_checksums_control.stdout_lines | select('match', '^Database cluster state:') | first | default('')
         | regex_search('shut down$')) is none

    - name: "checksums | pg_checksums --enable (same image, same volume)"
      ansible.builtin.command:
        argv:
          - docker
          - run
          - --rm
          - --user
          - postgres
          - --volume
          - "{{ pg_data_volume }}:/var/lib/postgresql/data"
          - "{{ pg_image }}"
          - pg_checksums
          - --enable
          - --pgdata
          - /var/lib/postgresql/data/pgdata
      register: pg_checksums_run
      changed_when: true

    - name: "checksums | Conversion result"
      ansible.builtin.debug:
        msg: "{{ pg_checksums_run.stdout_lines | default([]) | select('match', '^(Checksum operation|Files written|Blocks written|Data checksum|Checksums enabled)') | list }}"
