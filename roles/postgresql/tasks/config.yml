---
- name: "config | Ensure the config dir exists (mounted into the container)"
  ansible.builtin.file:
    path: "{{ pg_conf_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "config | Render pg_hba.conf (scram-sha-256, hostssl SVC only)"
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: "{{ pg_conf_host_dir }}/pg_hba.conf"
    owner: "{{ pg_uid }}"
    group: "{{ pg_uid }}"
    mode: "0640"
  notify: Restart postgres
