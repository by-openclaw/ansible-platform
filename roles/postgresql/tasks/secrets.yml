---
# Superuser password: reuse the controller secret if present, else generate.
- name: "secrets | Stat superuser secret on controller"
  ansible.builtin.stat:
    path: "{{ pg_secret_dir }}/{{ pg_superuser_secret }}"
  delegate_to: localhost
  become: false
  register: pg_super_stat

- name: "secrets | Load existing superuser password"
  ansible.builtin.set_fact:
    pg_superuser_password: "{{ (lookup('file', pg_secret_dir + '/' + pg_superuser_secret) | from_json).fields.password }}"
  no_log: true
  when: pg_super_stat.stat.exists

- name: "secrets | Generate superuser password"
  ansible.builtin.set_fact:
    pg_superuser_password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  no_log: true
  when: not pg_super_stat.stat.exists

- name: "secrets | Persist superuser secret (0600)"
  ansible.builtin.copy:
    dest: "{{ pg_secret_dir }}/{{ pg_superuser_secret }}"
    mode: "0600"
    content: "{{ {'fields': {'host': pg_listen_ip, 'port': pg_port, 'user': 'postgres', 'password': pg_superuser_password}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not pg_super_stat.stat.exists
