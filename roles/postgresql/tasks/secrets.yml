---
# The superuser password, from Vault (get-or-create). The path exists, so the live
# password is READ — re-minting it would lock out every database administrator.
- name: "secrets | PostgreSQL superuser password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pg_superuser_vault_path }}"
    vault_secret_init:
      host: "{{ pg_listen_ip }}"
      port: "{{ pg_port }}"
      user: postgres
      password: "{{ lookup('community.general.random_string', length=32, special=false) }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pg_superuser_password: "{{ vault_secret_result.password }}"
  no_log: true

# Streaming replication login: the password every member presents to the leader.
- name: "secrets | Replication password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pg_replication_vault_path }}"
    vault_secret_init:
      user: "{{ pg_replication_user }}"
      password: "{{ lookup('community.general.random_string', length=40, special=false) }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pg_replication_password: "{{ vault_secret_result.password }}"
  no_log: true

# Patroni's REST API: the write operations (restart, switchover, reinitialise) are authenticated.
- name: "secrets | Patroni REST API password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pg_patroni_api_vault_path }}"
    vault_secret_init:
      username: patroni
      password: "{{ lookup('community.general.random_string', length=40, special=false) }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pg_patroni_api_password: "{{ vault_secret_result.password }}"
  no_log: true

# The consensus store's client credential — written by roles/etcd, only read here.
- name: "secrets | etcd client password (read from Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pg_etcd_vault_path }}"
    vault_secret_action: read   # pragma: allowlist secret

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pg_etcd_password: "{{ vault_secret_result.password }}"
  no_log: true
