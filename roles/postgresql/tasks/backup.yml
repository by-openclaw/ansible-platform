---
- name: "backup | Ensure backup dir (host)"
  ansible.builtin.file:
    path: "{{ pg_backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "backup | Deploy pg-backup.sh (docker exec pg_dumpall)"
  ansible.builtin.template:
    src: pg-backup.sh.j2
    dest: /usr/local/bin/pg-backup.sh
    owner: root
    group: root
    mode: "0755"

- name: "backup | Daily pg_dumpall cron (root)"
  ansible.builtin.cron:
    name: "pg-backup"
    cron_file: pg-backup
    user: root
    minute: "0"
    hour: "2"
    job: "/usr/local/bin/pg-backup.sh >> /var/log/pg-backup.log 2>&1"
