---
# Create app roles + databases idempotently via `docker exec` (local socket =
# trust). Passwords are alphanumeric (random_string special=false) → SQL-safe.
- name: "databases | Check which app roles exist"
  ansible.builtin.command:
    cmd: docker exec {{ pg_container_name }} psql -tAU postgres -d postgres -c "SELECT 1 FROM pg_roles WHERE rolname = '{{ db.user }}'"
  loop: "{{ pg_databases }}"
  loop_control:
    loop_var: db
  register: pg_role_exists
  changed_when: false

- name: "databases | Create missing app roles"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ pg_container_name }} psql -U postgres -d postgres
      -c "CREATE ROLE {{ item.db.user }} LOGIN PASSWORD '{{ pg_app_passwords[item.db.name] }}'"
  loop: "{{ pg_role_exists.results }}"
  loop_control:
    label: "{{ item.db.user }}"
  when: item.stdout | trim != '1'
  no_log: true
  changed_when: true

- name: "databases | Check which databases already exist"
  ansible.builtin.command:
    cmd: docker exec {{ pg_container_name }} psql -tAU postgres -d postgres -c "SELECT 1 FROM pg_database WHERE datname = '{{ db.name }}'"
  loop: "{{ pg_databases }}"
  loop_control:
    loop_var: db
  register: pg_db_exists
  changed_when: false

- name: "databases | Create missing databases (UTF-8, owner = app role)"
  ansible.builtin.command:
    cmd: >-
      docker exec {{ pg_container_name }} createdb -U postgres -O {{ item.db.user }}
      -E UTF8 -T template0 --lc-collate=C.UTF-8 --lc-ctype=C.UTF-8 {{ item.db.name }}
  loop: "{{ pg_db_exists.results }}"
  loop_control:
    label: "{{ item.db.name }}"
  when: item.stdout | trim != '1'
  changed_when: true
