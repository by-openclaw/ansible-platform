---
# Cert/pg_hba changes only need a reload (SIGHUP) — Postgres re-reads
# ssl_cert_file + pg_hba.conf WITHOUT dropping connections (transparent).
- name: Reload postgres
  ansible.builtin.command:
    cmd: docker exec {{ pg_container_name }} psql -tAU postgres -c "SELECT pg_reload_conf()"
  changed_when: true
  listen: "tls_cert changed"

# Patroni re-reads patroni.yml on SIGHUP and applies what changed; PostgreSQL keeps running.
# A container that does not run yet (first run) reads the file when it starts.
- name: Reload patroni
  ansible.builtin.command:
    cmd: docker kill --signal HUP {{ pg_container_name }}
  register: pg_patroni_reload
  changed_when: pg_patroni_reload.rc == 0
  failed_when: false
