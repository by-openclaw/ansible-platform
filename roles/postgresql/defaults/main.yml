---
# ==============================================================================
# Role: postgresql — one member of the PostgreSQL 17 cluster, as a Docker container (SVC).
# All-Docker pivot (upgrade-by-tag, k8s-future). Internal-only TCP service.
# Three members under Patroni (services/0004): the leader is elected through etcd, the others
# stream from it; the first member ADOPTED the former standalone data directory unchanged.
# Data persists in a named volume across container re-creation.
# ==============================================================================
# Exact pin, never a stream tag: ":17" would silently roll forward to whatever
# 17.x is newest on any re-pull, changing the database version with no commit.
pg_image: "postgres:17.11"       # upgrade = bump this tag deliberately
pg_container_name: "postgres"

# Publish only on loopback + the SVC IP (apps connect over SVC). Dual-stack:
# also publish on the host's SVC IPv6 so v6-capable clients reach the DB (pg_hba
# already permits fd01:3::/64). Requires docker_ipv6 on this host (ip6tables).
pg_listen_ip: "{{ hostvars[inventory_hostname].ansible_host }}"   # each member publishes on its OWN address
pg_listen_ip6: "{{ hostvars[inventory_hostname].platform_host_v6 }}"
pg_port: 5432
pg_data_volume: "pgdata"
pg_uid: 999                       # postgres uid inside the official image

# Data checksums (INF-43, integrity at rest): every page carries a checksum, so silent disk
# corruption is detected on read instead of being served. A new cluster is initialised with them
# (POSTGRES_INITDB_ARGS); an existing cluster without them is converted ONCE by
# tasks/checksums.yml — `pg_checksums --enable` on the cleanly stopped cluster (a restart of the
# database: every consumer reconnects), then the role asserts `data_checksums = on` on every run.
pg_data_checksums: true
pg_stop_timeout: 120              # seconds for a clean shutdown before the offline conversion

# GitLab's schema loads in ONE transaction that acquires a lock per object; with
# 19.x's many partitioned tables it exceeds the default max_locks_per_transaction
# (64) → "out of shared memory / increase max_locks_per_transaction" on schema
# load. GitLab's own bundled PG raises this; the shared cluster PG must too. Also
# fine for every other consumer. Restart-required (postmaster) setting.
pg_max_locks_per_transaction: 256
# Connection ceiling. The image default (100) was hit twice on 2026-09-22 (09:22Z and
# 13:27Z, "remaining connection slots are reserved for SUPERUSER"): Authentik lost its
# pool → forwardAuth answered 500 on every route → one ProbeFailed per site. Every
# `db: shared-pg` service in platform_services shares this cluster (ten on
# 2026-09-28), each with its own pool; 200 leaves headroom
# (each backend costs a few MB, the host has 2 GiB). Restart-required setting.
pg_max_connections: 200
# Log every connection with role + database (Loki keeps them), so the next time the
# ceiling is approached the client that opened the connections is named — without it,
# only the victims' errors are visible. Restart-required setting.
pg_log_connections: true
# Audit trail of the cluster (SEC-23 / INF-29): session ends and every DDL statement in the server
# log (journald → Loki); DML stays out (volume, PII). Who connected = log_connections above.
pg_log_disconnections: true
pg_log_statement: "ddl"
# TLS: the server picks the cipher; no 3DES/RC4/MD5 suites offered (TLS 1.2 floor above).
pg_ssl_ciphers: "HIGH:!aNULL:!MD5:!3DES:!RC4"

# Host dirs bind-mounted into the container (same path inside).
pg_conf_host_dir: "/etc/postgres/conf"     # pg_hba.conf
pg_cert_host_dir: "/etc/postgres/certs"    # wildcard cert + key

# App networks allowed (scram-sha-256). Restricted further by the FW/host.
pg_app_cidrs:
  - "{{ platform_zones.svc.cidr4 }}"
  - "{{ platform_zones.svc.cidr6 }}"

# NOTE: app databases + roles are NOT created here. Each app's playbook creates
# its own DB+role via the reusable `postgres_db` role (separation of concerns).

# TLS — shared wildcard *.{{ platform_domain }} cert (distributed by tls_cert, mounted
# into the container). Remote app access forced over TLS (hostssl); clients
# connect sslmode=verify-full against the publicly-trusted LE chain.
pg_ssl: true
pg_ssl_min_version: "TLSv1.2"   # reject TLS < 1.2 at the server (every DB client inherits)
pg_ssl_cert: "{{ pg_cert_host_dir }}/wildcard.crt"
pg_ssl_key: "{{ pg_cert_host_dir }}/wildcard.key"
pg_app_hba_type: "hostssl"
# The metrics exporter (roles/postgres_exporter) reaches the cluster from this host; because
# PostgreSQL is containerised its client address is the docker bridge gateway. Scoped to the
# exporter's own role and the postgres database, TLS enforced. Empty user = line not rendered.
pg_exporter_hba_user: "postgres_exporter"
pg_exporter_hba_db: "postgres"
pg_exporter_hba_source: "{{ platform_docker_bridge_gw4 }}/32"

# Controller-side secret store.
pg_superuser_vault_path: "{{ platform_env }}/postgres/superuser"   # Vault KV — no controller file

# --- Cluster (Patroni) -----------------------------------------------------------------------
# The platform image = the pinned server image + Patroni from the image's OWN package
# repository (PGDG): same base, same glibc collations, same binaries — the data directory of
# the former standalone server is adopted as it is. Built on each member (the Verdaccio pattern).
pg_patroni_version: "4.1.5-2.pgdg13+1"    # exact apt pin; bump deliberately, then pg_platform_rev
pg_platform_rev: 1
pg_platform_image: "platform/postgres-patroni"
pg_platform_tag: "{{ pg_image.split(':')[1] }}-p{{ pg_platform_rev }}"
pg_build_dir: "/opt/postgres-build"

pg_cluster_scope: "{{ platform_pg_cluster_scope }}"
pg_cluster_members: "{{ platform_pg_members }}"       # inventory hosts
pg_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"
pg_patroni_port: 8008                                  # REST API: health for the endpoint, member-to-member checks
pg_patroni_conf_host_dir: "/etc/postgres/patroni"
pg_patroni_conf: "{{ pg_patroni_conf_host_dir }}/patroni.yml"
pg_patroni_dcs_file: "{{ pg_patroni_conf_host_dir }}/dcs.yml"
pg_ca_bundle: "/etc/ssl/certs/ca-certificates.crt"     # host CA store, mounted read-only
pg_etcd_client_port: 2379
pg_etcd_hosts: "{{ pg_cluster_members | map('regex_replace', '^(.*)$', '\\1.' ~ platform_domain ~ ':' ~ pg_etcd_client_port) | list }}"

# Streaming replication login (created through roles/postgres_db, REPLICATION attribute) and the
# REST API's write credential (restart / switchover / reinitialise are authenticated; the health
# endpoints are read-only and open to the members and the endpoint guest).
pg_replication_user: "replicator"
pg_replication_vault_path: "{{ platform_env }}/postgres/replication"
pg_patroni_api_vault_path: "{{ platform_env }}/postgres/patroni-api"
pg_etcd_vault_path: "{{ platform_etcd_vault_path }}"

# Failover behaviour — the DYNAMIC configuration, stored in etcd and identical on every member
# (templates/dcs.yml.j2). ttl = how long a leader key lives without renewal: a dead leader is
# replaced after at most ttl seconds.
pg_patroni_ttl: 30
pg_patroni_loop_wait: 10
pg_patroni_retry_timeout: 10
pg_patroni_maximum_lag_on_failover: 1048576
# A commit waits for ONE replica: a failover never loses an acknowledged transaction. Not
# strict: with no replica available the leader keeps accepting writes.
pg_synchronous_mode: true
# Restart the members that carry a pending restart (a postmaster-level parameter changed):
# replicas first, the leader last. Explicit, because it restarts the database.
pg_apply_pending_restart: false
# Seconds a replica may take to copy the leader's data when it first joins (pg_basebackup).
pg_replica_bootstrap_timeout: 3600

# Daily logical backup (pg_dumpall via docker exec).
pg_backup_dir: "/var/lib/postgresql/backups"
pg_backup_keep_days: 7
