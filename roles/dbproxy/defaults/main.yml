---
# ==============================================================================
# Role: dbproxy — the data endpoint (services/0004): ONE address every consumer connects to,
# routed to the PostgreSQL member Patroni reports as leader and to the Redis member that
# reports itself master. TCP routing only — no pooling, no
# TLS termination: the client's TLS session ends on PostgreSQL itself, whose wildcard
# certificate is valid for the endpoint's name (sslmode=verify-full unchanged).
# What it costs: PostgreSQL sees the endpoint's address as the client's; the connection log
# still names the role and the database, and every service has its own role.
# ==============================================================================
dbproxy_image: "haproxy:3.4.6"            # exact pin (LTS line), never a stream tag
dbproxy_container_name: "dbproxy"
dbproxy_uid: 99                            # haproxy user inside the official image
dbproxy_conf_host_dir: "/etc/dbproxy"
dbproxy_listen_ip: "{{ hostvars[inventory_hostname].ansible_host }}"
dbproxy_listen_ip6: "{{ hostvars[inventory_hostname].platform_host_v6 }}"
dbproxy_ca_bundle: "/etc/ssl/certs/ca-certificates.crt"   # host CA store, mounted read-only

# --- PostgreSQL ---------------------------------------------------------------------------
dbproxy_pg_port: 5432
dbproxy_pg_members: "{{ platform_pg_members }}"
dbproxy_patroni_port: 8008                 # GET /primary answers 200 on the leader only
# Leader detection: a member is out after 3 failed checks 3 s apart; its sessions are closed at
# once so a client reconnects to the new leader instead of talking to a demoted one.
dbproxy_check_interval: "1s"            # a dead member leaves and a new leader enters within 2 s
dbproxy_check_fall: 2
dbproxy_check_rise: 2
# Idle sessions are kept (application pools hold them for hours); TCP keep-alives detect a dead peer.
dbproxy_idle_timeout: "12h"
dbproxy_connect_timeout: "5s"
dbproxy_maxconn: 1000

# --- Redis ----------------------------------------------------------------------------------
# The member that answers `role:master`. The check logs in with its own login (it may run INFO
# and PING, nothing else). A member that returns still believing it is the primary must not be
# routed to before Sentinel has demoted it: it is taken out fast (2 checks) and taken back
# slowly (6 checks = 18 s, longer than Sentinel needs).
dbproxy_redis_members: "{{ platform_redis_members | default([]) }}"
dbproxy_redis_port: 6379
dbproxy_redis_check_user: "healthcheck"
dbproxy_redis_check_vault_path: "{{ platform_redis_users_vault_prefix | default('') }}/{{ dbproxy_redis_check_user }}"
dbproxy_redis_check_fall: 2
# One good answer is enough: a member is used only while it says master AND the Sentinels name
# it — the two already confirm each other (two answers cost a second of every failover).
dbproxy_redis_check_rise: 1
dbproxy_check_timeout: "2s"             # how long one check may take
# A reload starts a new worker; the former one keeps the sessions it holds and no longer checks
# the members — when a member dies nothing ends those sessions (2026-10-04: after the Redis
# primary was killed, clients held dead connections for up to a minute). After this long the
# former worker closes what it still holds and the clients reconnect to the worker that watches.
dbproxy_hard_stop_after: "30s"
# How long the role waits for former workers to end (above the previous line), and how often it looks.
dbproxy_former_worker_retries: 9
dbproxy_former_worker_delay: 5

# --- Metrics (HAProxy's built-in Prometheus exporter) -----------------------------------------
dbproxy_metrics_port: 8405
# Redis: a member receives traffic only while it reports itself master AND at least this many
# Sentinels name it as the primary. That replaces the 18 s wait (six checks) which kept a
# restarted old primary out of rotation until the Sentinels had demoted it: the Sentinels'
# own word is immediate and cannot be wrong about a stale master.
dbproxy_redis_sentinels: "{{ platform_redis_sentinel_hosts | default([]) }}"
dbproxy_redis_sentinel_port: 26379
dbproxy_redis_sentinel_quorum: 2
dbproxy_redis_master_name: "{{ platform_redis_master_name | default('') }}"
