---
# ==============================================================================
# Role: dbproxy (Docker) — the data endpoint
# ==============================================================================
- name: "dbproxy | Configuration directory (mounted into the container)"
  ansible.builtin.file:
    path: "{{ dbproxy_conf_host_dir }}"
    state: directory
    owner: root
    group: "{{ dbproxy_uid }}"
    mode: "0750"
  tags: [dbproxy, config]

# The Redis check's login (owner: roles/redis — one document per consumer login).
- name: "dbproxy | Redis check login (read from Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ dbproxy_redis_check_vault_path }}"
    vault_secret_action: read   # pragma: allowlist secret
  when: dbproxy_redis_members | length > 0
  tags: [dbproxy, config]

- name: "dbproxy | Bind it"
  ansible.builtin.set_fact:
    dbproxy_redis_check_password: "{{ vault_secret_result.password }}"
  no_log: true
  when: dbproxy_redis_members | length > 0
  tags: [dbproxy, config]

# Validated by the pinned image BEFORE it replaces the file: a configuration that does not parse
# never lands on disk (a file that only failed a later check would be loaded by the next
# restart of the container).
- name: "dbproxy | haproxy.cfg"
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: "{{ dbproxy_conf_host_dir }}/haproxy.cfg"
    owner: root
    group: "{{ dbproxy_uid }}"
    mode: "0640"
    validate: >-
      docker run --rm --user 0:0
      --volume %s:/tmp/haproxy.cfg:ro --volume {{ dbproxy_ca_bundle | dirname }}:{{ dbproxy_ca_bundle | dirname }}:ro
      {{ dbproxy_image }} haproxy -c -f /tmp/haproxy.cfg
  register: dbproxy_config_file
  no_log: true      # carries the Redis check's password
  notify: Reload dbproxy
  tags: [dbproxy, config]

# The image checks the file itself: a configuration that does not parse never reaches the
# running endpoint.
- name: "dbproxy | The configuration parses (haproxy -c, same pinned image)"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - --volume
      - "{{ dbproxy_conf_host_dir }}:/usr/local/etc/haproxy:ro"
      - --volume
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      - "{{ dbproxy_image }}"
      - haproxy
      - -c
      - -f
      - /usr/local/etc/haproxy/haproxy.cfg
  changed_when: false
  check_mode: false   # read-only probe
  tags: [dbproxy, config]

# The container through the scaffold's containers step (the one owner of "run a pinned
# container"). Read-only root filesystem, no capability: the listeners are above 1024.
- name: "dbproxy | Endpoint container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: dbproxy
      containers:
        - name: "{{ dbproxy_container_name }}"
          image: "{{ dbproxy_image }}"
          read_only: true
          tmpfs: ["/tmp:rw,size=16m", "/run:rw,size=16m"]
          cap_drop: [ALL]
          security_opts: ["no-new-privileges:true"]
          published:
            - "{{ dbproxy_listen_ip }}:{{ dbproxy_pg_port }}:{{ dbproxy_pg_port }}"
            - "[{{ dbproxy_listen_ip6 }}]:{{ dbproxy_pg_port }}:{{ dbproxy_pg_port }}"
            - "127.0.0.1:{{ dbproxy_pg_port }}:{{ dbproxy_pg_port }}"
            - "{{ dbproxy_listen_ip }}:{{ dbproxy_redis_port }}:{{ dbproxy_redis_port }}"
            - "[{{ dbproxy_listen_ip6 }}]:{{ dbproxy_redis_port }}:{{ dbproxy_redis_port }}"
            - "127.0.0.1:{{ dbproxy_redis_port }}:{{ dbproxy_redis_port }}"
            - "{{ dbproxy_listen_ip }}:{{ dbproxy_metrics_port }}:{{ dbproxy_metrics_port }}"
            - "127.0.0.1:{{ dbproxy_metrics_port }}:{{ dbproxy_metrics_port }}"
          volumes:
            - "{{ dbproxy_conf_host_dir }}:/usr/local/etc/haproxy:ro"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
  tags: [dbproxy, container]

- name: "dbproxy | Apply a changed configuration now (before the checks)"
  ansible.builtin.meta: flush_handlers
  tags: [dbproxy, config]

# After a reload the former worker serves the sessions it holds, without checking the members;
# hard-stop-after ends it. A worker started before that setting existed has no such bound: it
# is still there after the delay, and the endpoint is restarted once (every client reconnects).
# One haproxy process is the master, one the worker of the current configuration: any other is
# a former worker. After a reload it is given the time its bound allows, then the listing is
# read once — a listing that cannot be read fails the task (it must not pass unseen).
- name: "dbproxy | A reload leaves the former worker {{ dbproxy_hard_stop_after }} to end"
  ansible.builtin.wait_for:
    timeout: "{{ dbproxy_hard_stop_after_seconds | int + dbproxy_former_worker_margin_seconds | int }}"
  when:
    - dbproxy_config_file is changed
    - not ansible_check_mode
  tags: [dbproxy, config]

- name: "dbproxy | Processes of the endpoint"
  ansible.builtin.command:
    argv: [docker, top, "{{ dbproxy_container_name }}", -eo, "pid,comm"]
  register: dbproxy_processes
  changed_when: false
  check_mode: false   # read-only probe
  tags: [dbproxy, config]

- name: "dbproxy | Restart the endpoint once: a former worker without that bound still serves sessions the checks do not protect"
  ansible.builtin.command:
    argv: [docker, restart, "{{ dbproxy_container_name }}"]
  changed_when: true
  when:
    - not ansible_check_mode
    - dbproxy_processes.stdout_lines | select('search', ' haproxy$') | list | length > 2   # the master and one worker
  tags: [dbproxy, config]

# The endpoint's own view: exactly one PostgreSQL member is up behind it — the leader.
- name: "dbproxy | Exactly one member is routed to (the leader)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dbproxy_metrics_port }}/metrics"
    return_content: true
  register: dbproxy_metrics
  retries: 20
  delay: 3
  until: >-
    dbproxy_metrics.status | default(0) == 200 and
    (dbproxy_metrics.content | default('')
     | regex_findall('haproxy_server_status\{proxy="postgres",server="[^"]+",state="UP"\} 1') | length) == 1
  check_mode: false   # read-only probe
  when: not ansible_check_mode and dbproxy_pg_members | length > 0
  tags: [dbproxy, verify]

- name: "dbproxy | Exactly one Redis member is routed to (the primary)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dbproxy_metrics_port }}/metrics"
    return_content: true
  register: dbproxy_metrics_redis
  retries: 20
  delay: 3
  until: >-
    dbproxy_metrics_redis.status | default(0) == 200 and
    (dbproxy_metrics_redis.content | default('')
     | regex_findall('haproxy_server_status\{proxy="redis",server="[^"]+",state="UP"\} 1') | length) == 1
  check_mode: false   # read-only probe
  when: not ansible_check_mode and dbproxy_redis_members | length > 0
  tags: [dbproxy, verify]

# The route sends Redis traffic only to the member the Sentinels name: every Sentinel must be
# reachable from here, and they must agree on one member.
- name: "dbproxy | Every Sentinel names the same member (as the endpoint's checks see it)"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ dbproxy_metrics_port }}/metrics"
    return_content: true
  register: dbproxy_metrics_named
  retries: 20
  delay: 3
  until: >-
    dbproxy_metrics_named.status | default(0) == 200 and
    (dbproxy_metrics_named.content | default('')
     | regex_findall('haproxy_server_status\{proxy="redis_named_[^"]+",server="[^"]+",state="UP"\} 1') | length)
    == (dbproxy_redis_sentinels | length)
  check_mode: false   # read-only probe
  when: not ansible_check_mode and dbproxy_redis_members | length > 0
  tags: [dbproxy, verify]

- name: "dbproxy | Report"
  ansible.builtin.debug:
    msg: >-
      endpoint {{ inventory_hostname }}.{{ platform_domain }} ({{ dbproxy_image }}) —
      PostgreSQL :{{ dbproxy_pg_port }} routes to
      {{ dbproxy_metrics.content | default('')
         | regex_findall('haproxy_server_status\{proxy="postgres",server="([^"]+)",state="UP"\} 1') | join(',') | default('-', true) }};
      Redis :{{ dbproxy_redis_port }} routes to
      {{ dbproxy_metrics_redis.content | default('')
         | regex_findall('haproxy_server_status\{proxy="redis",server="([^"]+)",state="UP"\} 1') | join(',') | default('-', true) }}
  when: not ansible_check_mode
  tags: [dbproxy, verify]
