---
# --- the platform route (route.exe: the in-box tool as one argv command; the guest sits
# --- on the OOB /20 and reaches the 10.1.0.0/16 services via the firewall's OOB leg) ----
- name: "Win guest | Routes today"
  ansible.windows.win_command:
    argv: [route.exe, print, "-4"]
  register: windows_guest_routes_now
  changed_when: false
  check_mode: false

- name: "Win guest | The platform route, persistent (only when absent)"
  ansible.windows.win_command:
    argv: [route.exe, -p, add,
           "{{ item.destination | ansible.utils.ipaddr('network') }}",
           mask, "{{ item.destination | ansible.utils.ipaddr('netmask') }}",
           "{{ item.gateway }}"]
  loop: "{{ windows_guest_routes }}"
  loop_control:
    label: "{{ item.destination }} via {{ item.gateway }}"
  when: windows_guest_routes_now.stdout is not search(item.destination | ansible.utils.ipaddr('network') | regex_escape)
  changed_when: true

- name: "Win guest | The route carries the platform resolver (DNS answers through it)"
  ansible.windows.win_command:
    argv: [nslookup.exe, "{{ windows_guest_dns_probe_name }}"]
  register: windows_guest_dns
  changed_when: false
  check_mode: false


# --- time: the firewall's NTP, manual peers only ----------------------------------------
- name: "Win guest | Time service configuration today"
  ansible.windows.win_command:
    argv: [w32tm.exe, /query, /configuration]
  register: windows_guest_w32tm
  changed_when: false
  check_mode: false

- name: "Win guest | The platform's time source (only on drift)"
  ansible.windows.win_command:
    argv: [w32tm.exe, /config, "/manualpeerlist:{{ windows_guest_ntp_servers | join(' ') }}", /syncfromflags:manual, /update]
  register: windows_guest_w32tm_set
  when: windows_guest_w32tm.stdout is not search('NtpServer:\s*' ~ (windows_guest_ntp_servers | join(' ') | regex_escape))
  changed_when: true

- name: "Win guest | w32time starts with the system"
  ansible.windows.win_service:
    name: w32time
    start_mode: auto
    state: started

- name: "Win guest | Resync after a change"
  ansible.windows.win_command:
    argv: [w32tm.exe, /resync, /nowait]
  when: windows_guest_w32tm_set is changed
  changed_when: true

# --- power: a VM never sleeps -----------------------------------------------------------
- name: "Win guest | Power scheme today"
  ansible.windows.win_command:
    argv: [powercfg.exe, /getactivescheme]
  register: windows_guest_power
  changed_when: false
  check_mode: false

- name: "Win guest | High performance (only on drift)"
  ansible.windows.win_command:
    argv: [powercfg.exe, /setactive, "{{ windows_guest_power_scheme }}"]
  when: windows_guest_power.stdout is not search(windows_guest_power_scheme)
  changed_when: true

# The scheme's registry keys are system-protected (win_regedit cannot create them —
# seen live 2026-10-14): powercfg is the only writer. Query first, set on drift.
- name: "Win guest | AC timeouts today (standby, display)"
  ansible.windows.win_command:
    argv: [powercfg.exe, /query, "{{ windows_guest_power_scheme }}", "{{ item.sub }}", "{{ item.setting }}"]
  loop: "{{ windows_guest_power_timeouts }}"
  loop_control:
    label: "{{ item.label }}"
  register: windows_guest_timeouts
  changed_when: false
  check_mode: false

- name: "Win guest | No standby, no display timeout on AC (only on drift)"
  ansible.windows.win_command:
    argv: [powercfg.exe, /change, "{{ item.item.change }}", "0"]
  loop: "{{ windows_guest_timeouts.results }}"
  loop_control:
    label: "{{ item.item.label }}"
  when: item.stdout is not search('Current AC Power Setting Index:\s*0x00000000')
  changed_when: true

- name: "Win guest | Is there a hiberfil.sys?"
  ansible.windows.win_stat:
    path: C:\hiberfil.sys
  register: windows_guest_hiberfil

- name: "Win guest | Hibernation off (frees a RAM-sized file)"
  ansible.windows.win_command:
    argv: [powercfg.exe, /hibernate, off]
  when: windows_guest_hiberfil.stat.exists
  changed_when: true

# --- footprint: the shared feature/service lists, converged ------------------------------
- name: "Win guest | Optional features present on this edition"
  ansible.windows.win_command:
    argv: [Dism.exe, /Online, /Get-Features, /Format:Table]
  register: windows_guest_features
  changed_when: false
  check_mode: false

- name: "Win guest | Platform-removed optional features absent"
  ansible.windows.win_optional_feature:
    name: "{{ windows_guest_removed_features | select('in', windows_guest_features.stdout) | list }}"
    state: absent
  when: windows_guest_removed_features | select('in', windows_guest_features.stdout) | list | length > 0

- name: "Win guest | Platform-disabled services stay disabled"
  ansible.windows.win_service:
    name: "{{ item }}"
    start_mode: disabled
    state: stopped
  loop: "{{ windows_guest_disabled_services }}"
  failed_when: false   # a service absent from this edition is nothing to disable

# --- the owner's working session: RDP (noVNC has no clipboard and fights the layout) ----
- name: "Win guest | RDP allowed (registry switch)"
  ansible.windows.win_regedit:
    path: 'HKLM:\System\CurrentControlSet\Control\Terminal Server'
    name: fDenyTSConnections
    data: 0
    type: dword

# `set rule … enable=Yes` answers "Updated N rule(s)" even when nothing changed: query first,
# set only when a rule of the group is still disabled (idempotence, seen on every run).
- name: "Win guest | RDP firewall group today"
  ansible.windows.win_command:
    argv: [netsh.exe, advfirewall, firewall, show, rule, group=remote desktop]
  register: windows_guest_rdp_fw_now
  changed_when: false
  check_mode: false

- name: "Win guest | RDP firewall group open (only on drift)"
  ansible.windows.win_command:
    argv: [netsh.exe, advfirewall, firewall, set, rule, group=remote desktop, new, enable=Yes]
  when: windows_guest_rdp_fw_now.stdout is search('Enabled:\s+No')
  changed_when: true

# --- the platform timezone, also on guests cloned before the template carried it --------
- name: "Win guest | Brussels time"
  ansible.windows.win_timezone:
    timezone: "{{ windows_guest_timezone }}"

# --- the local Administrator password: Vault-held, get-or-create ------------------------
- name: "Win guest | The administrator password (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ windows_guest_admin_vault_path }}"
    vault_secret_init:
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"   # pragma: allowlist secret
    vault_secret_metadata_put:
      origin: "roles/windows_guest (local Administrator of {{ inventory_hostname }})"

- name: "Win guest | The account carries Vault's password (module payload, never argv)"
  ansible.windows.win_user:
    name: Administrator
    password: "{{ vault_secret_result.password }}"
    password_never_expires: true
    state: present
  no_log: true

# --- the OOB / break-glass local admin (identity/0004 §1): <org>, local, Vault-held -------
- name: "Win guest | The break-glass password of this tier (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ windows_guest_oob_vault_path }}"
    vault_secret_init:
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"   # pragma: allowlist secret
    vault_secret_metadata_put:
      origin: "break-glass OS account of the {{ windows_guest_env }} tier (roles/user-mgmt + roles/windows_guest)"

- name: "Win guest | The OOB admin account: {{ windows_guest_oob_user }} (local, Administrators)"
  ansible.windows.win_user:
    name: "{{ windows_guest_oob_user }}"
    fullname: "{{ windows_guest_oob_user }}"
    description: "Local break-glass admin - always local, never the IdP (identity/0004)"
    password: "{{ vault_secret_result.password }}"
    password_never_expires: true
    user_cannot_change_password: false
    groups: [Administrators]
    groups_action: add
    state: present
  no_log: true

- name: "Win guest | Its public key opens the SSH door too"
  community.windows.win_lineinfile:
    path: "{{ windows_guest_admin_keys_file }}"
    line: "{{ lookup('ansible.builtin.file', windows_guest_oob_pubkey_file) | trim }}"
    state: present
    newline: unix

# --- the "as user" account: <org>-user, Remote Desktop Users, Vault-held ---------------------
- name: "Win guest | The user-session password of this tier (Vault, created on first contact)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ windows_guest_user_vault_path }}"
    vault_secret_init:
      password: "{{ lookup('ansible.builtin.password', '/dev/null', length=24, chars=['ascii_letters', 'digits']) }}"   # pragma: allowlist secret
    vault_secret_metadata_put:
      origin: "user-session account of the {{ windows_guest_env }} tier (roles/windows_guest)"

- name: "Win guest | The user account: {{ windows_guest_user_account }} (local, Remote Desktop Users)"
  ansible.windows.win_user:
    name: "{{ windows_guest_user_account }}"
    fullname: "{{ windows_guest_user_account }}"
    description: "User session through the bastion - never an administrator"
    password: "{{ vault_secret_result.password }}"
    password_never_expires: true
    groups: ["Remote Desktop Users"]
    groups_action: replace
    state: present
  no_log: true

- name: "Win guest | Report"
  ansible.builtin.debug:
    msg: >-
      WIN_GUEST {{ inventory_hostname }} ready: route to
      {{ windows_guest_routes | map(attribute='destination') | join(', ') }},
      resolver answers, administrator password in Vault ({{ windows_guest_admin_vault_path }}), OOB admin {{ windows_guest_oob_user }} ({{ windows_guest_oob_vault_path }}), user {{ windows_guest_user_account }} ({{ windows_guest_user_vault_path }})
