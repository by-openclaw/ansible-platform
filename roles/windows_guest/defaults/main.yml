---
# ==============================================================================
# Windows guest baseline (dev tier, WS2025 clones on br-pmox-03).
# The clone arrives from the template with: static IP + DNS (cloudbase), hostname,
# the automation key in administrators_authorized_keys, sshd running. This role
# adds what the configdrive cannot carry:
#   - the platform route: the guests sit on the OOB /20; the internal 10.1.0.0/16
#     (Vault, AdGuard DNS, Loki) routes via the firewall's OOB leg, same as the node.
#   - the local Administrator password: Vault-held (get-or-create, never printed,
#     never on a command line - ansible.windows.win_user carries it in the module
#     payload over SSH).
# ==============================================================================
windows_guest_env: "{{ env | default(platform_env) }}"

# One doc per guest: <env>/windows/<host>/administrator {password}
windows_guest_admin_vault_path: "{{ windows_guest_env }}/windows/{{ inventory_hostname }}/administrator"

# The platform LAN, via the firewall's OOB leg (inventory values, no literals here).
windows_guest_routes:
  - destination: "{{ platform_internal_cidr4 }}"
    gateway: "{{ hostvars[groups['opnsense'] | first].ansible_host }}"

# The liveness proof of the route: the platform resolver answers through it.
windows_guest_dns_probe_name: "vault.{{ platform_domain }}"

# Windows' name for Europe/Brussels (CET/CEST), like the Linux guests' timezone.
windows_guest_timezone: "Romance Standard Time"

# --- the OOB / break-glass local admin (identity/0004 §1) --------------------------------
# The same account as on every Linux host and PVE node: `<org>`, always local, never the
# IdP, password Vault-held per tier (same doc as the Linux break-glass of that tier),
# the org's public key in administrators_authorized_keys for key SSH.
windows_guest_oob_user: "{{ platform_org }}"
windows_guest_oob_vault_path: "{{ windows_guest_env }}/break-glass/os"
windows_guest_oob_pubkey_file: "{{ playbook_dir }}/../roles/user-mgmt/files/keys/id_ed25519_{{ platform_org }}.pub"
windows_guest_admin_keys_file: 'C:\ProgramData\ssh\administrators_authorized_keys'
# The platform's time source: the firewall serves NTP on every zone and the OOB plane
# (roles/opnsense chrony); the Linux guests use their gateway the same way. Manual
# peers only — no time.windows.com.
windows_guest_ntp_servers:
  - "{{ hostvars[groups['opnsense'] | first].ansible_host }}"

# Shared with the template (group_vars/all/windows.yml): kept converged on live guests.
windows_guest_removed_features: "{{ platform_windows_removed_features | default([]) }}"
windows_guest_disabled_services: "{{ platform_windows_disabled_services | default([]) }}"
windows_guest_power_scheme: "8c5e7fda-e8bf-4a96-9a85-a6e23a8c635c"   # High performance
# powercfg's fixed GUIDs: sub-group / setting, and the /change alias of each
windows_guest_power_timeouts:
  - { label: standby, sub: 238c9fa8-0aad-41ed-83f4-97be242c8f20, setting: 29f6c1db-86da-48c5-9fdb-f2b67b1f44da, change: standby-timeout-ac }
  - { label: display, sub: 7516b95f-f776-4464-8c53-06167f40cc99, setting: 3c0bc021-c8a8-4e07-a973-6b14cbcb2b7e, change: monitor-timeout-ac }

# --- the "as user" account (owner 2026-10-14: "jump server to log as admin and as user") ---
# <org>-user: local, Remote Desktop Users only (never Administrators), password Vault-held
# per tier like the OOB admin's. The bastion brokers it under the users-level permission.
windows_guest_user_account: "{{ platform_org }}-user"
windows_guest_user_vault_path: "{{ windows_guest_env }}/break-glass/os-user"

# The in-box "Remote Desktop" firewall group's rules (en-US names; the UI language of the templates).
windows_guest_rdp_rules:
  - "Remote Desktop - User Mode (TCP-In)"
  - "Remote Desktop - User Mode (UDP-In)"
  - "Remote Desktop - Shadow (TCP-In)"

# --- session defaults (owner 2026-10-15: RDP session usable, no noise) --------------------
# Registry rows reconciled on every guest: the Server Manager console stays closed at logon
# (it asked for elevation at every RDP sign-in — UAC applied to the built-in Administrator is
# CIS 2.3.17.1 and stays), and the user-session proxy (WinINET, machine-wide) is the platform
# proxy — browsers and installers in an RDP session reach the internet through it, exactly
# like the system components do through WinHTTP (roles/windows_firewall).
windows_guest_session_registry:
  - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Server\ServerManager', name: DoNotOpenAtLogon, data: 1, type: dword }
  - { path: 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxySettingsPerUser, data: 0, type: dword }
  - { path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxyEnable, data: 1, type: dword }
  - { path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxyServer, data: "{{ platform_windows_proxy }}", type: string }
  - { path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Internet Settings', name: ProxyOverride, data: "{{ platform_windows_proxy_bypass }}", type: string }
