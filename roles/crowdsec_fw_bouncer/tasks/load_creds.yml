---
- name: "Load FW API + bouncer credentials"
  ansible.builtin.set_fact:
    crowdsec_fw_bouncer_api: "{{ (lookup('file', crowdsec_fw_bouncer_secret_dir + '/' + crowdsec_fw_bouncer_api_file) | from_json).fields }}"
    crowdsec_fw_bouncer_creds: "{{ (lookup('file', crowdsec_fw_bouncer_secret_dir + '/' + crowdsec_fw_bouncer_creds_file) | from_json).fields }}"
    crowdsec_fw_bouncer_key: "{{ (lookup('file', crowdsec_fw_bouncer_secret_dir + '/' + crowdsec_fw_bouncer_key_file) | from_json).fields }}"
    crowdsec_fw_bouncer_reg_token: "{{ (lookup('file', crowdsec_fw_bouncer_secret_dir + '/' + crowdsec_fw_bouncer_reg_token_file) | from_json).fields.token }}"
  no_log: true
