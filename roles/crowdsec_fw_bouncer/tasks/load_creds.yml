---
# The secrets come from Vault through the playbook pre-play (delegate_facts onto the firewall
# host). This file only refuses to run half-configured.
- name: "Creds | Require the Vault-sourced facts from the playbook pre-play"
  ansible.builtin.assert:
    that:
      - crowdsec_fw_bouncer_api is defined
      - crowdsec_fw_bouncer_api.key | default('') | length > 0
      - crowdsec_fw_bouncer_key is defined
      - crowdsec_fw_bouncer_key.api_key | default('') | length > 0
      - crowdsec_fw_bouncer_reg_token | default('') | length > 0
    fail_msg: >-
      crowdsec_fw_bouncer_* facts are missing — run playbooks/crowdsec-fw-bouncer.yml, whose
      pre-play reads Vault ({env}/opnsense/api, {env}/crowdsec/bouncer-opnsense,
      {env}/crowdsec/registration-token) and hands them over.
    quiet: true
  no_log: true
