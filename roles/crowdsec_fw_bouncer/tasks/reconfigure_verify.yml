---
- name: "Service | Reconfigure CrowdSec so the daemon reloads url + key"
  by_systems.opnsense.opnsense_crowdsec_service:
    host: "{{ crowdsec_fw_bouncer_api.host }}"
    key: "{{ crowdsec_fw_bouncer_api.key }}"
    secret: "{{ crowdsec_fw_bouncer_api.secret }}"
    verify_ssl: false
    state: reconfigured

- name: "Verify | List bouncers on the central LAPI"
  ansible.builtin.command: /usr/bin/cscli bouncers list -o json
  delegate_to: lxc-crowdsec-01
  changed_when: false  # lxc-crowdsec-01 connects as root; no become needed
  check_mode: false     # read-only; run even under --check so verify is real
  register: crowdsec_fw_bouncer_list_res

- name: "Verify | Report opnsense-firewall bouncer state"
  when: crowdsec_fw_bouncer_list_res.stdout is defined
  ansible.builtin.debug:
    msg: >-
      {{ (crowdsec_fw_bouncer_list_res.stdout | from_json
          | selectattr('name', 'equalto', 'opnsense-firewall') | list | first
          | default({'name': 'opnsense-firewall', 'last_pull': 'NOT FOUND'}))
         | dict2items
         | selectattr('key', 'in', ['name', 'type', 'version', 'last_pull', 'valid'])
         | items2dict }}
