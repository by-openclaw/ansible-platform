---
# API-driven plugin settings (local connection). firewall_bouncer_enabled turns
# the bouncer on; lapi_manual_configuration=0 lets the plugin's reconfigure
# rewrite the bouncer api_url from the listen address/port.
# The firewall becomes a full CrowdSec participant against the CENTRAL LAPI:
#   - agent_enabled=1: the FW runs its own agent, detecting events against itself
#     (SSH, etc.) and feeding them to the shared decision store. It is enrolled
#     to the remote LAPI in agent_enrol.yml.
#   - lapi_enabled=0: the FW does NOT run its own LAPI — lxc-crowdsec-01 is the
#     only LAPI.
#   - firewall_bouncer_enabled=1: the bouncer enforces decisions in pf.
#   - lapi_manual_configuration=0: the plugin's reconfigure rewrites both the
#     agent and bouncer URLs from the listen address/port below (get_new_url),
#     so pointing the listen address at the central LAPI points everything there.
- name: "Settings | Firewall as agent + bouncer for the central LAPI"
  by_systems.opnsense.opnsense_crowdsec_settings:
    host: "{{ crowdsec_fw_bouncer_api.host }}"
    key: "{{ crowdsec_fw_bouncer_api.key }}"
    secret: "{{ crowdsec_fw_bouncer_api.secret }}"
    verify_ssl: false
    agent_enabled: true
    lapi_enabled: false
    firewall_bouncer_enabled: true
    lapi_manual_configuration: false
    lapi_listen_address: "{{ crowdsec_fw_bouncer_lapi_host }}"
    lapi_listen_port: "{{ crowdsec_fw_bouncer_lapi_port }}"
  register: crowdsec_fw_bouncer_settings_res

- name: "Settings | Flag reconfigure if settings changed"
  ansible.builtin.set_fact:
    crowdsec_fw_bouncer_dirty: "{{ crowdsec_fw_bouncer_settings_res is changed }}"
