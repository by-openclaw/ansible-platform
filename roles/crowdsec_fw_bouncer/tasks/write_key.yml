---
# The single SSH+become task: write the bouncer api_key, which has no API.
- name: "Bouncer | Write the LAPI api_key into the bouncer config"
  ansible.builtin.lineinfile:
    path: "{{ crowdsec_fw_bouncer_config_path }}"
    regexp: '^api_key:'
    line: "api_key: {{ crowdsec_fw_bouncer_key.api_key }}"
    owner: root
    group: wheel
    mode: "0600"
    backup: true
  no_log: true
