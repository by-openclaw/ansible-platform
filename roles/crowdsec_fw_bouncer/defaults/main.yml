---
# ==============================================================================
# Role: crowdsec_fw_bouncer — point the OPNsense firewall bouncer at the central
# CrowdSec LAPI so decisions are ENFORCED at the edge (not just collected).
#
# The plugin settings + service are driven through the by_systems.opnsense API
# modules (lib-first). The one thing the API cannot express is the bouncer's
# api_key — it lives in a root-owned file on the firewall — so exactly one task
# writes it over SSH with become. Everything else is API.
# ==============================================================================

# Central LAPI (lxc-crowdsec-01, SVC).
crowdsec_fw_bouncer_lapi_host: "{{ hostvars[groups['crowdsec'] | first].ansible_host }}"
crowdsec_fw_bouncer_lapi_port: "8080"

# Secrets — Vault only (read by the playbook pre-play on the Vault host and handed over as
# facts; a connection:local play cannot delegate into the vault container):
#   {env}/opnsense/api                 -> crowdsec_fw_bouncer_api   {host, key, secret}
#   {env}/crowdsec/bouncer-opnsense    -> crowdsec_fw_bouncer_key   {api_key}
#   {env}/crowdsec/registration-token  -> crowdsec_fw_bouncer_reg_token
#   {env}/opnsense/svc-ansible-{env}   -> crowdsec_fw_bouncer_become_password (sudo 'ask password')
crowdsec_fw_bouncer_vault_api: "{{ platform_env | default('prod') }}/opnsense/api"
crowdsec_fw_bouncer_vault_key: "{{ platform_env | default('prod') }}/crowdsec/bouncer-opnsense"
crowdsec_fw_bouncer_vault_reg_token: "{{ platform_env | default('prod') }}/crowdsec/registration-token"
crowdsec_fw_bouncer_vault_become: "{{ platform_env | default('prod') }}/opnsense/svc-ansible-{{ platform_env | default('prod') }}"
# SSH identity for the one become task: the automation user the seed creates (key-only login,
# password = sudo 'ask password'; the firewall must carry sudo_allow_wheel=1 — seed-owned).
crowdsec_fw_bouncer_ssh_user: "svc-ansible-{{ platform_env | default('prod') }}"
crowdsec_fw_bouncer_ssh_key: "{{ lookup('env', 'HOME') }}/.ssh/id_ed25519_opnsense"
# The bouncer config file the plugin manages.
crowdsec_fw_bouncer_config_path: "/usr/local/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml"

# --- FW as a SENSOR (agent) too, not just a bouncer ---------------------------
# The firewall runs a CrowdSec agent enrolled to the CENTRAL LAPI (same as the
# 12 guests), so it detects events against itself (SSH, etc.) and feeds them to
# the shared decision store. It does NOT run its own LAPI — lxc-crowdsec-01 is
# the only LAPI. Reuses the guests' registration token (Vault, above); no new secret.
crowdsec_fw_bouncer_machine_name: "{{ groups['opnsense'] | first }}"
crowdsec_fw_bouncer_lapi_url: "http://{{ crowdsec_fw_bouncer_lapi_host }}:{{ crowdsec_fw_bouncer_lapi_port }}"
# Collections the FW detects for itself. sshd = brute-force against the FW.
crowdsec_fw_bouncer_collections:
  - crowdsecurity/sshd
  - crowdsecurity/linux
