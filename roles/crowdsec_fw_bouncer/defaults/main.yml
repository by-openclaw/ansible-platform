---
# ==============================================================================
# Role: crowdsec_fw_bouncer — point the OPNsense firewall bouncer at the central
# CrowdSec LAPI so decisions are ENFORCED at the edge (not just collected).
#
# The plugin settings + service are driven through the by_systems.opnsense API
# modules (lib-first). The one thing the API cannot express is the bouncer's
# api_key — it lives in a root-owned file on the firewall — so exactly one task
# writes it over SSH with become. Everything else is API.
# ==============================================================================

# Central LAPI (lxc-crowdsec-01, SVC).
crowdsec_fw_bouncer_lapi_host: "10.1.3.190"
crowdsec_fw_bouncer_lapi_port: "8080"

# Controller-side secrets.
crowdsec_fw_bouncer_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
# Bouncer api_key registered on the LXC LAPI (name 'opnsense-firewall').
crowdsec_fw_bouncer_key_file: "fabric/app-crowdsec-bouncer-opnsense.json"
# FW API + become credentials (canonical, corrected names).
crowdsec_fw_bouncer_creds_file: "fabric/net-opnsense-prod-vm-opns-01.json"
crowdsec_fw_bouncer_api_file: "fabric/net-opnsense-vm-opns-01-access.json"

# The bouncer config file the plugin manages.
crowdsec_fw_bouncer_config_path: "/usr/local/etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml"

# --- FW as a SENSOR (agent) too, not just a bouncer ---------------------------
# The firewall runs a CrowdSec agent enrolled to the CENTRAL LAPI (same as the
# 12 guests), so it detects events against itself (SSH, etc.) and feeds them to
# the shared decision store. It does NOT run its own LAPI — lxc-crowdsec-01 is
# the only LAPI. Reuses the guests' registration token; no new secret.
crowdsec_fw_bouncer_reg_token_file: "fabric/app-crowdsec-registration-token.json"
crowdsec_fw_bouncer_machine_name: "vm-opns-01"
crowdsec_fw_bouncer_lapi_url: "http://{{ crowdsec_fw_bouncer_lapi_host }}:{{ crowdsec_fw_bouncer_lapi_port }}"
# Collections the FW detects for itself. sshd = brute-force against the FW.
crowdsec_fw_bouncer_collections:
  - crowdsecurity/sshd
  - crowdsecurity/linux
