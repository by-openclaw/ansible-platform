---
# ==============================================================================
# Role: register — render the platform service register (docs/register.md) from data:
# the services catalog (group_vars/all/services.yml), the people file (owner), each role's
# pinned version, the service documentation pages present, and the tuning-pass ledger.
# Runs on the controller only; nothing is changed on any host.
# ==============================================================================
register_output: "{{ playbook_dir }}/../docs/register.md"
# "How do I get in" (docs/access.md): per service its address, how to sign in, the group that
# opens it and where its local login is read — from the catalog, the groups and the logins of
# the inventory. No real name in it: the repository is public.
register_access_output: "{{ playbook_dir }}/../docs/access.md"
register_access_sign_in:
  oidc: "single sign-on"
  forwardauth: "single sign-on, at the door"
  local: "local account"
  none: "—"
register_access_reach:
  public: "the Internet"
  private: "the office or the VPN"
  admin: "an administrator's desk"
register_docs_dir: "{{ playbook_dir }}/../docs/services"
# ADR compliance records (docs/audits/<service>-<date>.md): the register shows the latest one per service.
register_audits_dir: "{{ playbook_dir }}/../docs/audits"
register_roles_dir: "{{ playbook_dir }}/../roles"
# Tuning passes closed so far (service → part → PR/date). Extend as passes close (#512).
register_tuning_passes:
  authentik: {footprint: "2026-09-22 #513"}
  postgresql: {footprint: "2026-09-22 #507 (partial)"}
  monitoring: {integration: "2026-09-22 #506 (alerting)"}
