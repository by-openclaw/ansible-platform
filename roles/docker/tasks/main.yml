---
- name: "Docker | Install Docker engine + python SDK"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Docker | Ensure /etc/docker exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker | Enable IPv6 forwarding (persisted) for the v6 bridge"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: docker_ipv6 | bool

- name: "Docker | Configure log rotation + IPv6 (daemon.json)"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: "Docker | Ensure docker is enabled + running"
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
