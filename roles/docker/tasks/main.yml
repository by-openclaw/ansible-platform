---
- name: "Docker | Install Docker engine + python SDK"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Docker | Ensure /etc/docker exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker | Configure log rotation (daemon.json)"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: "Docker | Ensure docker is enabled + running"
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
