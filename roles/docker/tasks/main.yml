---
- name: "Docker | Install Docker engine + python SDK"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Docker | Ensure /etc/docker exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker | Enable IPv6 forwarding (persisted) for the v6 bridge"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: docker_ipv6 | bool

- name: "Docker | Configure logging (journald -> promtail -> Loki) + IPv6 (daemon.json)"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Debian installs the binary AS the CLI plugin (/usr/libexec/docker/cli-plugins/docker-compose)
# and symlinks /usr/bin/docker-compose to it: nothing else to wire.
- name: "Docker | Compose v2 (Debian package, v2 since trixie)"
  ansible.builtin.apt:
    name: docker-compose
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: docker_compose_from_debian | bool

- name: "Docker | Ensure docker is enabled + running"
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: "Docker | Host firewall: container networks may reach the host (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ docker_firewall_rules }}"
  tags: [docker, firewall]
