---
- name: "Docker | Install Docker engine + python SDK"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Docker | Ensure /etc/docker exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker | Enable IPv6 forwarding (persisted) for the v6 bridge"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: docker_ipv6 | bool

- name: "Docker | Configure logging (journald -> promtail -> Loki) + IPv6 (daemon.json)"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

- name: "Docker | Compose v2 (Debian package, v2 since trixie)"
  ansible.builtin.apt:
    name: docker-compose
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: docker_compose_from_debian | bool

- name: "Docker | CLI plugin directory"
  ansible.builtin.file:
    path: /usr/libexec/docker/cli-plugins
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_compose_from_debian | bool

- name: "Docker | `docker compose` = the Compose v2 binary (CLI plugin link)"
  ansible.builtin.file:
    src: /usr/bin/docker-compose
    dest: /usr/libexec/docker/cli-plugins/docker-compose
    state: link
    force: true
  when: docker_compose_from_debian | bool

- name: "Docker | Ensure docker is enabled + running"
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
