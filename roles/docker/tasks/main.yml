---
# The role reads facts (the CE repo's release, the DOCKER-USER uplink interface), and
# it also runs as a dependency of plays that skip fact gathering (certs-sync.yml
# includes postgresql/redis tls tasks, whose meta pulls this role in).
- name: "Docker | Facts this role reads (a play may skip fact gathering)"
  ansible.builtin.setup:
    gather_subset: ["!all", network]
  when: ansible_default_ipv4 is not defined or ansible_distribution_release is not defined

- name: "Docker | Docker CE apt repo (docker_engine=ce)"
  when: docker_engine == 'ce'
  block:
    - name: "Docker | Keyring directory"
      ansible.builtin.file:
        path: "{{ docker_ce_keyring | dirname }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: "Docker | Is the Docker CE signing key there?"
      ansible.builtin.stat:
        path: "{{ docker_ce_keyring }}"
      register: docker_ce_key_file

    # Fetched once: get_url under --check HEADs the URL and reports "changed" for an identical
    # file. A rotated upstream key is a deliberate change (remove the file), never a silent fetch.
    - name: "Docker | Docker CE signing key"
      ansible.builtin.get_url:
        url: "{{ docker_ce_key_url }}"
        dest: "{{ docker_ce_keyring }}"
        owner: root
        group: root
        mode: "0644"
      when: not docker_ce_key_file.stat.exists

    - name: "Docker | Docker CE apt repository"
      ansible.builtin.apt_repository:
        repo: "{{ docker_ce_repo }}"
        filename: docker
        state: present

    # Remove, never purge: images, containers and volumes under /var/lib/docker stay.
    - name: "Docker | Remove Debian packages that conflict with Docker CE"
      ansible.builtin.apt:
        name: "{{ docker_ce_conflicting_packages }}"
        state: absent
        purge: false

- name: "Docker | Install Docker engine + python SDK"
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  register: docker_engine_install

- name: "Docker | Ensure /etc/docker exists"
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "Docker | Enable IPv6 forwarding (persisted) for the v6 bridge"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: "1"
    sysctl_set: true
    state: present
    reload: true
  when: docker_ipv6 | bool

- name: "Docker | Configure logging (journald -> promtail -> Loki) + IPv6 (daemon.json)"
  ansible.builtin.template:
    src: daemon.json.j2
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Restart docker

# Debian installs the binary AS the CLI plugin (/usr/libexec/docker/cli-plugins/docker-compose)
# and symlinks /usr/bin/docker-compose to it: nothing else to wire.
- name: "Docker | Compose v2 (Debian package, v2 since trixie)"
  ansible.builtin.apt:
    name: docker-compose
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: docker_compose_from_debian | bool

# A dry-run of a first install only simulated the package: there is no docker unit yet.
- name: "Docker | Ensure docker is enabled + running"
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not (ansible_check_mode and docker_engine_install is changed)

- name: "Docker | Host firewall: container networks may reach the host (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ docker_firewall_rules }}"
  tags: [docker, firewall]

- name: "Docker | Published container ports on the host firewall (DOCKER-USER)"
  ansible.builtin.import_tasks: docker_user.yml
  tags: [docker, firewall]
