---
# DOCKER-USER rules for published container ports (see defaults). One managed block
# per family at the END of ufw's after*.rules — its own *filter … COMMIT section, the
# established ufw + Docker pattern. ufw reload applies it; Docker only jumps to the chain.
- name: "Docker | ufw present and active? (DOCKER-USER rules ride on its after.rules)"
  ansible.builtin.command: ufw status
  register: docker_user_ufw
  changed_when: false
  check_mode: false   # read-only

# The allow rules come from the inventory catalog (group_vars/all/docker_firewall.yml):
# the fleet-wide entries plus those of the services platform_services puts here.
- name: "Docker | This host's published-port rules, from the catalog"
  ansible.builtin.set_fact:
    docker_user_declared: >-
      {%- set out = [] -%}
      {%- for r in platform_docker_firewall_common -%}{%- set _ = out.append(r) -%}{%- endfor -%}
      {%- for s in platform_services | map(attribute='name') if inventory_hostname in platform_service_hosts[s] -%}
        {%- for r in platform_docker_firewall.get(s, []) -%}{%- set _ = out.append(r) -%}{%- endfor -%}
      {%- endfor -%}
      {{ out }}

- name: "Docker | Every source names something the inventory knows (a typo must fail, not allow nothing)"
  ansible.builtin.assert:
    that: >-
      item in ['any', 'trusted']
      or (item is match('^db:') and (platform_services | selectattr('db', 'equalto', item[3:]) | list | length) > 0)
      or (platform_services | selectattr('name', 'equalto', item) | list | length) > 0
    fail_msg: "docker_firewall source '{{ item }}' is not a service name, db:<value>, trusted or any"
    quiet: true
  loop: "{{ docker_user_declared | map(attribute='from') | flatten | unique }}"

# IPv4 = the source host itself; IPv6 = its zone (hosts source v6 from SLAAC, see the catalog).
# A clustered service resolves to every member (platform_service_hosts), not only its first host.
- name: "Docker | Resolve the sources to addresses"
  ansible.builtin.set_fact:
    docker_user_allow: >-
      {%- set out = [] -%}
      {%- for r in docker_user_declared -%}
        {%- set cidrs = [] -%}
        {%- for ref in r.from -%}
          {%- if ref == 'any' -%}
            {%- set _ = cidrs.extend(['0.0.0.0/0', '::/0']) -%}
          {%- elif ref == 'trusted' -%}
            {%- set _ = cidrs.extend(platform_trusted_cidrs) -%}
          {%- else -%}
            {%- set svcs = (platform_services | selectattr('db', 'equalto', ref[3:])) if ref.startswith('db:')
                           else (platform_services | selectattr('name', 'equalto', ref)) -%}
            {%- for h in svcs | map(attribute='name') | map('extract', platform_service_hosts) | flatten -%}
              {%- set a4 = hostvars[h].ansible_host -%}
              {%- set _ = cidrs.append(a4 ~ '/32') -%}
              {%- for z in platform_zones.values() if z.cidr6 is defined and (a4 | ansible.utils.ipaddr(z.cidr4)) -%}
                {%- set _ = cidrs.append(z.cidr6) -%}
              {%- endfor -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endfor -%}
        {%- set _ = out.append({'port': r.port, 'proto': r.proto | default('tcp'), 'from': cidrs | unique | list,
                                'comment': r.comment | default('')}) -%}
      {%- endfor -%}
      {{ out }}

# ufw rewrites after.rules / after6.rules line by line with the ASCII codec (`ufw default …`,
# backend_iptables.set_default_policy): a non-ASCII byte anywhere in them makes every ufw policy
# change fail with UnicodeEncodeError — the first markers carried an em-dash, and the hardening
# play's "default deny" task failed on every Docker host (2026-10-01). The markers are ASCII
# now; a block under the old marker is removed first, so the rules are never written twice.
- name: "Docker | DOCKER-USER block under the retired (non-ASCII) marker"
  ansible.builtin.blockinfile:
    path: "/etc/ufw/{{ item.file }}"
    marker: "# {mark} ANSIBLE MANAGED \u2014 DOCKER-USER (roles/docker)"
    state: absent
  loop:
    - { file: after.rules, family: 4 }
    - { file: after6.rules, family: 6 }
  loop_control:
    label: "{{ item.file }}"
  register: docker_user_rules_retired
  when: "'Status: active' in docker_user_ufw.stdout"

- name: "Docker | DOCKER-USER rules — {{ docker_user_firewall }} (IPv4 / IPv6)"
  ansible.builtin.blockinfile:
    path: "/etc/ufw/{{ item.file }}"
    marker: "# {mark} ANSIBLE MANAGED - DOCKER-USER (roles/docker)"
    insertafter: EOF
    block: "{{ lookup('ansible.builtin.template', 'docker-user.rules.j2', template_vars={'family': item.family}) }}"
    state: "{{ 'absent' if docker_user_firewall == 'off' else 'present' }}"
  loop:
    - { file: after.rules, family: 4 }
    - { file: after6.rules, family: 6 }
  loop_control:
    label: "{{ item.file }}"
  register: docker_user_rules
  when: "'Status: active' in docker_user_ufw.stdout"

- name: "Docker | Apply (ufw reload)"
  ansible.builtin.command: ufw reload
  when:
    - docker_user_rules is changed or docker_user_rules_retired is changed
    - not ansible_check_mode
  changed_when: true
