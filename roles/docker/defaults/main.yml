---
# ==============================================================================
# Role: docker — THE owner of the container engine on every Docker host.
# docker_engine (inventory) picks Debian's docker.io or Docker CE; nothing else
# installs docker*/containerd* packages. python3-docker = SDK for community.docker.
# Requires the LXC to have features.nesting=true (set in terraform).
# ==============================================================================
# Engine flavour — set per host/group in the INVENTORY, never in a service role
# (two owners of one engine is how vm-mailcow-01 ended on docker.io, 2026-09-19):
#   debian  Debian's docker.io (the service LXCs; pinned by the release)
#   ce      Docker CE from Docker's apt repo (mailcow requires >= 24)
docker_engine: "debian"
docker_engine_packages:
  debian: [docker.io]
  ce: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
docker_packages: "{{ docker_engine_packages[docker_engine] + ['python3-docker'] }}"   # python3-docker = SDK for community.docker
# Debian packages that conflict with Docker CE. Removed (never purged: /var/lib/docker,
# images and volumes stay) before Docker CE is installed.
docker_ce_conflicting_packages: [docker.io, docker-compose, containerd, runc]
docker_ce_key_url: "https://download.docker.com/linux/debian/gpg"
docker_ce_keyring: "/etc/apt/keyrings/docker.asc"
docker_ce_repo: "deb [arch=amd64 signed-by={{ docker_ce_keyring }}] https://download.docker.com/linux/debian {{ ansible_distribution_release }} stable"
# Compose v2: Debian 13's `docker-compose` package IS Compose v2 (2.26); exposing the
# binary as the CLI plugin makes `docker compose` and community.docker.docker_compose_v2
# work. Only where this role owns the engine (docker.io) — never next to docker-ce (#454).
docker_compose_from_debian: "{{ docker_engine == 'debian' and ansible_distribution_release | default('') in ['trixie', 'forky'] }}"

# json-file log rotation (containers default to unbounded logs otherwise).
# journald is the log driver now (caps live in hardening journald.conf.d)


# --- IPv6 dual-stack -----------------------------------------------------------
# Give containers a ULA bridge + ip6tables NAT so they can reach the platform's
# v6 (fd01::/16) — without this, a container resolving a FQDN to an AAAA gets
# "network unreachable" and falls back to v4. Docker 26.x needs experimental:true
# for ip6tables (GA in 27+). The bridge subnet is private and masqueraded to the
# host's real v6, so a single ULA is safe to share across hosts.
docker_ipv6: true
docker_fixed_cidr_v6: "{{ platform_docker_cidr6 }}"

# Container networks that may reach the HOST (hairpin to a published port — e.g. Vault's own
# AppRole login, Portainer agent checks — host DNS, node metrics): Docker's default address
# pools and the v6 bridge, both from the address plan (group_vars/all/network.yml). Declared on ufw by
# roles/host_firewall; without it every host→own-container connection dies once ufw is enabled.
docker_bridge_cidrs:
  - "{{ platform_docker_pools_cidr4 }}"
  - "{{ docker_fixed_cidr_v6 }}"
docker_firewall_rules:
  - { from: "{{ docker_bridge_cidrs }}", comment: "Docker container networks -> host (hairpin, DNS, metrics)" }

# --- Published container ports vs the host firewall ------------------------------
# Docker's published ports are DNAT'ed and FORWARDed: ufw's INPUT rules never see
# them (verified 2026-09-27: lxc-authentik-01:9000 reachable, no ufw rule). The
# DOCKER-USER chain is where the host can filter them. Rendered into ufw's
# after.rules / after6.rules so it survives ufw reloads, reboots and Docker restarts.
#   audit   = NEW connections from outside the host that match no allow rule are
#             LOGGED (prefix below) and still accepted — learn the real clients first
#   enforce = the same, then DROPPED
#   off     = no DOCKER-USER rules from Ansible
# Per host from the catalog: enforce for the hosts listed in platform_docker_firewall_enforce
# (group_vars/all/docker_firewall.yml), audit for the rest — rolled out host by host.
docker_user_firewall: "{{ 'enforce' if inventory_hostname in (platform_docker_firewall_enforce | default([])) else 'audit' }}"
# Kernel LOG prefix (max 29 chars): mode + host, because LXC guests all log into the
# hypervisor's journal (roles/pve_host netfilter_log.yml).
docker_user_log_prefix: "du-{{ docker_user_firewall }} {{ inventory_hostname | truncate(17, true, '') }} "
# Allowed sources per published (host-side) port: the inventory catalog
# platform_docker_firewall (group_vars/all/docker_firewall.yml), resolved per host in
# tasks/docker_user.yml. Nothing is declared here.
docker_user_uplink: "{{ ansible_default_ipv4.interface }}"   # from facts: the interface published ports arrive on

# --- Images of superseded versions (tasks/superseded_images.yml) -----------------
# Removed at each converge: an image no container uses, when another image of the same repository
# is in use by a container on the host. docker_superseded_images_keep = regular expressions of
# image names (repository:tag) that are never removed.
docker_superseded_images_remove: true
docker_superseded_images_keep: []
docker_image_tag_suffix: ':[^:/]+$'            # what follows the repository in repository:tag
docker_image_untagged_marker: "<none>"         # how Docker names an image without a tag
# Derived from what the task reads on the host: the images containers use (running or stopped),
# their repositories, the images to remove, and those Docker refused to remove.
docker_images_used_ids: "{{ docker_host_inventory.containers | default([]) | map(attribute='ImageID') | unique | list }}"
docker_image_repos_in_use: >-
  {{ docker_host_inventory.images | default([]) | selectattr('Id', 'in', docker_images_used_ids)
     | map(attribute='RepoTags') | map('default', [], true) | flatten
     | map('regex_replace', docker_image_tag_suffix, '') | unique | list }}
docker_superseded_images: >-
  {%- set out = [] -%}
  {%- for image in docker_host_inventory.images | default([]) if image.Id not in docker_images_used_ids -%}
    {%- for name in image.RepoTags | default([], true)
        if not name.startswith(docker_image_untagged_marker)
           and (name | regex_replace(docker_image_tag_suffix, '')) in docker_image_repos_in_use
           and (docker_superseded_images_keep | length == 0
                or name is not search(docker_superseded_images_keep | join('|'))) -%}
      {%- set _ = out.append(name) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ out | unique | sort }}
docker_superseded_refused: >-
  {{ docker_superseded_removed.results | default([]) | selectattr('msg', 'defined')
     | selectattr('failed', 'defined') | selectattr('failed') | map(attribute='item') | list }}
