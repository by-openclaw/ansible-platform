---
# Role: opnsense_token_rotation — SEC-09 schedule for the firewalls' Ansible API token.
# Runs ON THE CONTROLLER (hosts: localhost) as the user that runs the playbooks: one systemd USER
# timer per environment fires `opnsense-api-bootstrap.yml -e opnsense_api_bootstrap_force_rotate=true`
# (the previous token is revoked), re-renders the jobs that keep a copy of the token, and gates on
# `opnsense.yml --tags dns --check` being changed=0 with the new token. The controller
# user must linger (`loginctl enable-linger`) so the timer runs without a login session.
opnsense_token_rotation_repo: "{{ playbook_dir | dirname }}"
opnsense_token_rotation_bin_dir: "{{ lookup('env', 'HOME') }}/.local/bin"
opnsense_token_rotation_unit_dir: "{{ lookup('env', 'HOME') }}/.config/systemd/user"
opnsense_token_rotation_state_dir: "{{ lookup('env', 'HOME') }}/.local/state/fw-token-rotation"
opnsense_token_rotation_ansible_bin: "{{ lookup('env', 'HOME') }}/.local/bin"
# Quarterly ≈ every 90 days, 03:00 UTC on the 1st of Jan/Apr/Jul/Oct, ±1 h jitter, catches up after downtime.
opnsense_token_rotation_on_calendar: "*-01,04,07,10-01 03:00:00 UTC"
opnsense_token_rotation_randomized_delay: "1h"
# The check after a rotation: the catalog's part that is run in check mode with the new token,
# and the stock output format whose JSON the gate reads.
# The automation agent's socket (roles/controller): a user unit does not inherit it — the user
# manager's own SSH_AUTH_SOCK is the desktop's — and without it no play reaches a host
# (the run of 2026-10-01 ended "unreachable" for that reason).
opnsense_token_rotation_agent_socket: "{{ lookup('env', 'HOME') }}/.ssh/rune-agent.sock"
opnsense_token_rotation_check_tags: dns
opnsense_token_rotation_result_format: ansible.posix.json
# One timer instance per environment. `test` stays listed, disabled: its firewall is gone
# (2026-10) and the entry is what stops and disables its timer on the controller.
opnsense_token_rotation_envs:
  - {env: test, enabled: false}
  - {env: prod, enabled: true}
# A rotation revokes the previous token, so a job that keeps a COPY of it must get the new one
# before the check: these plays are run, in order, between the rotation and the check.
opnsense_token_rotation_consumer_playbooks:
  - playbooks/opnsense-config-backup.yml      # the firewall config backup job's credential (on the hypervisor)
