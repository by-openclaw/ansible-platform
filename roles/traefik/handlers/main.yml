---
# Traefik is a container: restarting it re-reads the static config. The file provider
# hot-reloads dynamic config on its own; a certificate refresh needs a restart.
- name: Restart traefik
  community.docker.docker_container:
    name: traefik
    state: started
    restart: true
  when: not ansible_check_mode
# A changed DYNAMIC file needs no restart: the file provider watches the directory
# (traefik.yml: providers.file.watch) and loads the change by itself. Until 2026-10-05 this
# handler restarted the container exactly like the one above, so every dynamic change cut
# every route for some seconds (2026-10-04 18:45 and 23:32 UTC, each seen by the probes).
# It now only confirms the edge still answers.
- name: Reload traefik
  ansible.builtin.wait_for:
    port: "{{ traefik_reload_check_port }}"
    timeout: "{{ traefik_reload_check_timeout }}"
  when: not ansible_check_mode
