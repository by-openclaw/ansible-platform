---
# ==============================================================================
# Role: traefik — defaults (PROD lxc-traefik-01, DMZ 10.1.2.110 / fd01:2::110)
# Single HTTPS ingress / reverse proxy for the platform cluster.
# Certs via ACME DNS-01 (Cloudflare) wildcard *.{{ platform_domain }} — reuses the
# lego flow from roles/adguard. Public exposure (Telenet WAN2 .222, dual-stack)
# is wired separately at WAN2 bring-up; this role is internal-complete.
# ==============================================================================

# Identity / addressing
traefik_domain: "{{ platform_domain }}"
traefik_ip: "10.1.2.110"
traefik_ip6: "fd01:2::110"
traefik_dashboard_host: "traefik.{{ traefik_domain }}"

# Internal networks allowed to reach the dashboard (split-horizon; never public).
# 100.64.0.0/10 = the NetBird overlay (CGNAT) range — VPN peers reach the dashboard
# over the tunnel and must pass this network gate; Authentik + traefik-admins then
# enforce identity. The admin LAN (10.6.0.0/16) is intentionally NOT here — admin
# access to internal-only surfaces is via the NetBird VPN, not a mgmt-LAN hole.
# Break-glass admin desks (OOB) appended to the dashboard allowlist — inventory group_vars/all/traefik.yml.
traefik_admin_cidrs: []
traefik_internal_cidrs:
  - "10.1.0.0/16"
  - "100.64.0.0/10"
  - "fd01::/16"
  - "127.0.0.1/32"
  - "::1/128"

# --- Authentik forwardAuth (gate the dashboard behind SSO via the embedded outpost)
# The dashboard (api@internal) cannot speak OIDC, so Authentik fronts it with a
# Proxy Provider (forward_single) served by the embedded outpost on the authentik
# server. Traefik's forwardAuth middleware calls /outpost.goauthentik.io/auth/traefik;
# the /outpost.goauthentik.io/ login-callback path is routed back to the same outpost.
# Access becomes: internal network AND Authentik SSO AND member of traefik-admins.
traefik_authentik_outpost_url: "http://10.1.3.130:9000"
traefik_authentik_auth_headers:
  - X-authentik-username
  - X-authentik-groups
  - X-authentik-email
  - X-authentik-name
  - X-authentik-uid
  - X-authentik-jwt
  - X-authentik-meta-jwks
  - X-authentik-meta-outpost
  - X-authentik-meta-provider
  - X-authentik-meta-app
  - X-authentik-meta-version

# HSTS (applied to every websecure response). 1 year ≥ the 15552000 NC minimum.
# includeSubdomains covers every *.{{ platform_domain }} app (all are HTTPS via Traefik).
# preload left OFF (submitting to the browser preload list is hard to reverse).
traefik_hsts_seconds: 31536000
traefik_hsts_include_subdomains: true
traefik_hsts_preload: false

# Traefik binary (PINNED — never :latest, per platform standard)
# renovate: datasource=github-releases depName=traefik/traefik
traefik_version: "v3.7.11"
traefik_arch: "amd64"
traefik_release_url: "https://github.com/traefik/traefik/releases/download/{{ traefik_version }}/traefik_{{ traefik_version }}_linux_{{ traefik_arch }}.tar.gz"
traefik_bin: "/usr/local/bin/traefik"

# Layout
traefik_conf_dir: "/etc/traefik"
traefik_dynamic_dir: "/etc/traefik/dynamic"
traefik_log_dir: "/var/log/traefik"

# lego ACME client (reuse roles/adguard pinned version + Cloudflare DNS-01)
# renovate: datasource=github-releases depName=go-acme/lego extractVersion=^v(?<version>.*)$
traefik_lego_version: "4.35.2"   # the same version as adguard/mailcow (aligned 2026-09-20)
traefik_lego_url: "https://github.com/go-acme/lego/releases/download/v{{ traefik_lego_version }}/lego_v{{ traefik_lego_version }}_linux_amd64.tar.gz"
traefik_renew_days: 30

# Cloudflare zone secret (token + ACME e-mail) — Vault, same path roles/adguard uses
traefik_cf_vault_path: "{{ platform_env | default('prod') }}/cloudflare/{{ platform_domain | replace('.', '-') }}"

# lego cert output (wildcard) — Traefik reads these via the file provider
traefik_cert_crt: "/etc/lego/cert/certificates/_.{{ traefik_domain }}.crt"
traefik_cert_key: "/etc/lego/cert/certificates/_.{{ traefik_domain }}.key"

# --- CrowdSec Traefik bouncer (Layer-7 IP remediation) --------------------------
# Blocks IPs with an active CrowdSec decision at the HTTP layer, before requests
# reach the web apps. Complements the OPNsense firewall bouncer (L3/4). Plugin:
# github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin (Yaegi, downloaded at
# startup). Applied globally via the websecure entrypoint, so every app is covered.
traefik_crowdsec_enabled: true
# renovate: datasource=github-releases depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
traefik_crowdsec_plugin_version: "v1.7.1"
# The plugin is VENDORED on the host (Traefik "localPlugins"): no download at start-up. Twice on
# 2026-09-21 a cold start could not fetch it from the plugin CDN, Traefik came up with "Plugins are
# disabled" and every router carrying the entrypoint bouncer middleware answered 404.
traefik_crowdsec_plugin_local: true
traefik_crowdsec_plugin_module: "github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
traefik_crowdsec_plugin_url: "https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/archive/refs/tags/{{ traefik_crowdsec_plugin_version }}.tar.gz"
traefik_crowdsec_plugin_sha256: "a50cdfe37d67c48be571417a26d8c5a2b28e4b91e5b1ed3b1ea2bcb0e6b4aa38"  # pragma: allowlist secret — release archive checksum, not a secret
traefik_plugins_dir: "{{ traefik_conf_dir }}/plugins-local"
traefik_crowdsec_lapi_scheme: "http"
traefik_crowdsec_lapi_host: "10.1.3.190:8080"        # central LAPI (lxc-crowdsec-01)
traefik_crowdsec_mode: "stream"                       # cache decisions locally; resilient
traefik_crowdsec_keyfile: "/etc/traefik/crowdsec-lapi.key"
traefik_crowdsec_secret: "~/.openclaw/workspace/infra/secrets/fabric/app-crowdsec-bouncer-traefik.json"
traefik_tls_min_version: "VersionTLS12"   # min TLS 1.2 on every service (SEC/TLS baseline)

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
traefik_firewall_rules:
  - { port: 80, proto: tcp, comment: "Traefik public entry (HTTP → HTTPS redirect)" }
  - { port: 443, proto: tcp, comment: "Traefik public entry (TLS)" }
