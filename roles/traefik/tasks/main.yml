---
# ==============================================================================
# Role: traefik — main dispatcher
#   install (directories) -> plugin (vendored) -> secrets (Cloudflare token)
#   -> cert (wildcard DNS-01) -> config (static + dynamic) -> container
# ==============================================================================

- name: Prerequisites and directories
  ansible.builtin.import_tasks: install.yml
  tags: [traefik, install]


- name: "Vendor the CrowdSec bouncer plugin (local, pinned — no download at start-up)"
  ansible.builtin.import_tasks: plugin.yml
  when: traefik_crowdsec_enabled | default(false) and traefik_crowdsec_plugin_local | default(false)
  tags: [traefik, install, plugin]

- name: Resolve controller-side secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [traefik, cert]

- name: Issue/renew wildcard TLS certificate
  ansible.builtin.import_tasks: cert.yml
  tags: [traefik, cert]

- name: Render Traefik static + dynamic configuration
  ansible.builtin.import_tasks: config.yml
  tags: [traefik, config]

- name: Traefik runs as a container (pinned image, host network)
  ansible.builtin.import_tasks: container.yml
  tags: [traefik, container]
- name: Rotate the edge logs (logrotate concern-role)
  ansible.builtin.include_role:
    name: logrotate
    apply:
      tags: [traefik, logs]
  vars:
    logrotate_entries:
      - name: traefik
        paths: ["/var/log/traefik/*.log"]
        rotate: 14
        postrotate: "docker kill -s USR1 traefik 2>/dev/null || true"   # Traefik reopens its logs on USR1
  tags: [traefik, logs]


- name: "Traefik | Host firewall rules for the native listeners (when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ traefik_firewall_rules }}"
  tags: [traefik, firewall]
