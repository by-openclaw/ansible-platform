---
# ==============================================================================
# Role: traefik — static + dynamic configuration
# ==============================================================================

# --- CrowdSec bouncer: LAPI key file (referenced by crowdsecLapiKeyFile) --------
- name: "config | The Traefik bouncer's LAPI key (Vault, read)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ traefik_crowdsec_vault_path }}"
  when: traefik_crowdsec_enabled | default(false) | bool

- name: "config | Write the CrowdSec LAPI key for the Traefik bouncer"
  ansible.builtin.copy:
    content: "{{ vault_secret_result.api_key }}\n"
    dest: "{{ traefik_crowdsec_keyfile }}"
    owner: "{{ traefik_user | default('root') }}"
    group: "{{ traefik_group | default('root') }}"
    mode: "0600"
  when: traefik_crowdsec_enabled | default(false) | bool
  no_log: true
  notify: Restart traefik

- name: "config | Render static config (traefik.yml)"
  ansible.builtin.template:
    src: traefik.yml.j2
    dest: "{{ traefik_conf_dir }}/traefik.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Restart traefik

- name: "config | Render dynamic config (TLS + dashboard router)"
  ansible.builtin.template:
    src: dynamic.yml.j2
    dest: "{{ traefik_dynamic_dir }}/dynamic.yml"
    owner: root
    group: root
    mode: "0644"
  notify: Reload traefik


# A route retired by renaming it `<name>.yml.retired-<date>` is ignored by Traefik but
# stays on disk forever. Its content is in git (the role renders every route); remove it.
- name: "Traefik | Retired route files"
  ansible.builtin.find:
    paths: "{{ traefik_dynamic_dir }}"
    patterns: "*.retired-*"
  register: traefik_retired_routes
  tags: [traefik, config]

- name: "Traefik | Remove them"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ traefik_retired_routes.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  tags: [traefik, config]
