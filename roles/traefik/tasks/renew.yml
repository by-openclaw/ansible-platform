---
# ==============================================================================
# Role: traefik — certificate renewal automation (cron + script + logfile)
# ==============================================================================

- name: "renew | Deploy renewal script /etc/lego/renew-traefik.sh"
  ansible.builtin.template:
    src: renew-traefik.sh.j2
    dest: /etc/lego/renew-traefik.sh
    owner: root
    group: root
    mode: "0755"

- name: "renew | Ensure renewal logfile exists (0640)"
  ansible.builtin.file:
    path: /var/log/lego-renew.log
    state: touch
    owner: root
    group: root
    mode: "0640"
    modification_time: preserve
    access_time: preserve

- name: "renew | Install daily renewal cron (03:23)"
  ansible.builtin.cron:
    name: "lego-renew-traefik"
    cron_file: lego-renew-traefik
    user: root
    minute: "23"
    hour: "3"
    job: "/etc/lego/renew-traefik.sh >> /var/log/lego-renew.log 2>&1"
