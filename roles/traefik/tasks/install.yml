---
# ==============================================================================
# Role: traefik — prerequisites and directories. Traefik itself runs as a container
# (tasks/container.yml); the certificate is roles/lego_cert (cert.yml).
# ==============================================================================

- name: "install | Ensure base dependencies present"
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - tar
      - cron
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "install | Create Traefik directories"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ traefik_conf_dir }}"
    - "{{ traefik_dynamic_dir }}"
    - "{{ traefik_log_dir }}"
