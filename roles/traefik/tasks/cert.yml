---
# The certificate (issue once, renew by systemd timer) — roles/lego_cert.
- name: "cert | Wildcard certificate via roles/lego_cert"
  ansible.builtin.include_role:
    name: lego_cert
  vars:
    lego_cert_id: traefik
    lego_cert_email: "{{ traefik_acme_email }}"
    lego_cert_domains: ["*.{{ traefik_domain }}", "{{ traefik_domain }}", "*.pages.{{ traefik_domain }}"]
    lego_cert_cf_token: "{{ traefik_cf_token }}"
    lego_cert_renew_days: "{{ traefik_renew_days }}"
    lego_cert_renew_hook: "docker restart traefik"
    lego_cert_on_calendar: "*-*-* 03:23:00"
    lego_cert_legacy_cron: lego-renew-traefik
    lego_cert_legacy_script: /etc/lego/renew-traefik.sh

# The other tiers' zone wildcards, for the devices that copy them (roles/tls_cert). Nothing on this
# host serves them, so a renewal restarts nothing here.
- name: "cert | Zone wildcard of another tier via roles/lego_cert"
  ansible.builtin.include_role:
    name: lego_cert
  vars:
    lego_cert_id: "zone-{{ traefik_zone }}"
    lego_cert_email: "{{ traefik_acme_email }}"
    lego_cert_domains: ["*.{{ traefik_zone }}.{{ traefik_domain }}"]
    lego_cert_cf_token: "{{ traefik_cf_token }}"
    lego_cert_renew_days: "{{ traefik_renew_days }}"
    lego_cert_key_type: "{{ traefik_zone_wildcard_key_type }}"
    lego_cert_pfx: true          # Windows devices import it into their machine store
    lego_cert_on_calendar: "*-*-* 03:29:00"
  loop: "{{ traefik_zone_wildcards }}"
  loop_control:
    loop_var: traefik_zone     # lego_cert loops with `item` itself
    label: "*.{{ traefik_zone }}.{{ traefik_domain }}"
