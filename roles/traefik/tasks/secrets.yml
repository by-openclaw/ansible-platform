---
# ==============================================================================
# Role: traefik — controller-side secret resolution (Cloudflare DNS-01)
# Reads the same app-cloudflare-by-research-be.json roles/adguard uses.
# All facts carry no_log to avoid echoing secret values.
# ==============================================================================

- name: "secrets | Assert Cloudflare secret file is present on controller"
  ansible.builtin.stat:
    path: "{{ traefik_cf_secret }}"
  delegate_to: localhost
  become: false
  run_once: true
  register: traefik_cf_secret_stat

- name: "secrets | Fail when Cloudflare secret missing"
  ansible.builtin.fail:
    msg: "Missing Cloudflare secret at {{ traefik_cf_secret }}"
  when: not traefik_cf_secret_stat.stat.exists
  run_once: true

- name: "secrets | Load Cloudflare token + ACME email from controller secret"
  ansible.builtin.set_fact:
    traefik_cf_token: "{{ (lookup('file', traefik_cf_secret) | from_json).fields.api_token }}"
    traefik_acme_email: "{{ (lookup('file', traefik_cf_secret) | from_json).fields.acme_email }}"
  no_log: true
  run_once: true
