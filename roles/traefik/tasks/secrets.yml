---
# ==============================================================================
# Role: traefik — controller-side secret resolution (Cloudflare DNS-01)
# Reads the same Vault zone secret roles/adguard uses ({env}/cloudflare/{zone}).
# All facts carry no_log to avoid echoing secret values.
# ==============================================================================

- name: "secrets | Read the Cloudflare zone secret from Vault (token + ACME e-mail)"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [always]
  vars:
    vault_secret_path: "{{ traefik_cf_vault_path }}"
    vault_secret_init: {}
  run_once: true

- name: "secrets | Adopt the Cloudflare token + ACME e-mail (no_log)"
  ansible.builtin.set_fact:
    traefik_cf_token: "{{ vault_secret_result.api_token }}"
    traefik_acme_email: "{{ vault_secret_result.acme_email }}"
  no_log: true
  run_once: true
