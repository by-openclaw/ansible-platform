---
# Defguard core secrets (SECRET_KEY + auth/gateway secrets + break-glass admin
# password): reuse the controller secret if present, else generate + persist. The
# DB password is loaded from its own postgres_db secret file. The Authentik OIDC
# client id/secret are loaded from a separate file IF it exists (created in a
# later SSO phase). All facts no_log.
- name: "secrets | Stat defguard core secret on controller"
  ansible.builtin.stat:
    path: "{{ defguard_secret_dir }}/{{ defguard_secret_file }}"
  delegate_to: localhost
  become: false
  register: defguard_secret_stat

- name: "secrets | Load existing defguard core secrets"
  ansible.builtin.set_fact:
    defguard_secrets: "{{ (lookup('file', defguard_secret_dir + '/' + defguard_secret_file) | from_json).fields }}"
  no_log: true
  when: defguard_secret_stat.stat.exists

- name: "secrets | Generate defguard core secrets"
  ansible.builtin.set_fact:
    defguard_secrets:
      # DEFGUARD_SECRET_KEY must be at least 64 characters.
      secret_key: "{{ lookup('community.general.random_string', length=128, special=false) }}"
      auth_secret: "{{ lookup('community.general.random_string', length=48, special=false) }}"
      gateway_secret: "{{ lookup('community.general.random_string', length=48, special=false) }}"
      yubibridge_secret: "{{ lookup('community.general.random_string', length=48, special=false) }}"
      admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
  no_log: true
  when: not defguard_secret_stat.stat.exists

- name: "secrets | Persist defguard core secret (0600)"
  ansible.builtin.copy:
    dest: "{{ defguard_secret_dir }}/{{ defguard_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (defguard_secrets | combine({'url': 'https://' + defguard_fqdn,
      'admin_user': defguard_admin_name, 'admin_email': defguard_admin_email}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not defguard_secret_stat.stat.exists

- name: "secrets | Load the postgresql password"
  ansible.builtin.set_fact:
    defguard_pg_password: "{{ (lookup('file', defguard_secret_dir + '/' + defguard_pg_secret_file) | from_json).fields.password }}"
  no_log: true

# Authentik OIDC client id/secret — consumed only when the separate SSO phase has
# created the Authentik app and written defguard-oidc.json. Absent = SSO stays off.
- name: "secrets | Stat the authentik oidc secret on controller"
  ansible.builtin.stat:
    path: "{{ defguard_secret_dir }}/{{ defguard_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: defguard_oidc_stat

- name: "secrets | Load the authentik oidc client id and secret"
  ansible.builtin.set_fact:
    defguard_oidc: "{{ (lookup('file', defguard_secret_dir + '/' + defguard_oidc_secret_file) | from_json).fields }}"
  no_log: true
  when: defguard_oidc_stat.stat.exists

- name: "secrets | Build the defguard core environment"
  ansible.builtin.set_fact:
    defguard_core_env:
      # PostgreSQL (verified TLS; libpq honors PGSSLROOTCERT for verify-full).
      DEFGUARD_DB_HOST: "{{ defguard_pg_host }}"
      DEFGUARD_DB_PORT: "{{ defguard_pg_port | string }}"
      DEFGUARD_DB_NAME: "{{ defguard_pg_name }}"
      DEFGUARD_DB_USER: "{{ defguard_pg_user }}"
      DEFGUARD_DB_PASSWORD: "{{ defguard_pg_password }}"
      PGSSLMODE: "{{ defguard_pg_sslmode }}"
      PGSSLROOTCERT: "{{ defguard_pg_sslrootcert }}"
      # Control-plane secrets.
      DEFGUARD_SECRET_KEY: "{{ defguard_secrets.secret_key }}"
      DEFGUARD_AUTH_SECRET: "{{ defguard_secrets.auth_secret }}"
      DEFGUARD_GATEWAY_SECRET: "{{ defguard_secrets.gateway_secret }}"
      DEFGUARD_YUBIBRIDGE_SECRET: "{{ defguard_secrets.yubibridge_secret }}"
      # Public URLs (Traefik terminates TLS; enrollment via the proxy).
      DEFGUARD_URL: "https://{{ defguard_fqdn }}"
      DEFGUARD_WEBAUTHN_RP_ID: "{{ defguard_fqdn }}"
      DEFGUARD_GRPC_PORT: "{{ defguard_core_grpc_port | string }}"
      DEFGUARD_HTTP_PORT: "{{ defguard_core_container_port | string }}"
      # Local break-glass admin (SSO via Authentik wired later).
      DEFGUARD_DEFAULT_ADMIN_PASSWORD: "{{ defguard_secrets.admin_password }}"
      RUST_LOG: "info"
  no_log: true

- name: "secrets | Build the authentik oidc client environment"
  ansible.builtin.set_fact:
    defguard_oidc_env:
      DEFGUARD_OPENID_ENABLED: "true"
      DEFGUARD_OPENID_CLIENT_ID: "{{ defguard_oidc.client_id }}"
      DEFGUARD_OPENID_CLIENT_SECRET: "{{ defguard_oidc.client_secret }}"
      DEFGUARD_OPENID_ISSUER: "{{ defguard_oidc_issuer }}"
  no_log: true
  when: defguard_oidc_enabled and defguard_oidc_stat.stat.exists

- name: "secrets | Merge the oidc client credentials into the core environment"
  ansible.builtin.set_fact:
    defguard_core_env: "{{ defguard_core_env | combine(defguard_oidc_env) }}"
  no_log: true
  when: defguard_oidc_enabled and defguard_oidc_stat.stat.exists

- name: "secrets | Build the defguard proxy environment"
  ansible.builtin.set_fact:
    defguard_proxy_env:
      DEFGUARD_PROXY_GRPC_PORT: "{{ defguard_proxy_grpc_port | string }}"
      DEFGUARD_PROXY_HTTP_PORT: "{{ defguard_proxy_container_port | string }}"
      RUST_LOG: "info"
  no_log: true

- name: "secrets | Build the defguard gateway environment"
  ansible.builtin.set_fact:
    defguard_gateway_env:
      DEFGUARD_GRPC_URL: "http://defguard-core:{{ defguard_core_grpc_port }}"
      DEFGUARD_TOKEN: "{{ defguard_secrets.gateway_secret }}"
      DEFGUARD_USERSPACE: "{{ '1' if defguard_userspace else '0' }}"
      DEFGUARD_IFNAME: "{{ defguard_wg_ifname }}"
      DEFGUARD_STATS_PERIOD: "60"
      RUST_LOG: "info"
  no_log: true
