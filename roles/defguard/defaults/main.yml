---
# ==============================================================================
# Role: defguard — WireGuard VPN + Authentik OIDC SSO + tunnel MFA (Docker) on
# lxc-defguard-01 (SVC 10.1.3.180). Three containers from pinned images:
#   defguard-core    — control plane + web/enrollment UI + OIDC client (8000) + gRPC (50055)
#   defguard-proxy   — enrollment/desktop-client proxy (8080 HTTP, 50051 gRPC)
#   defguard-gateway — WireGuard data plane (USERSPACE wireguard-go, udp 51820)
# Uses the shared cluster PostgreSQL (postgres_db: defguard) over verified TLS.
# Defguard core needs NO Redis. Fronted by Traefik (wildcard TLS, internal-only).
# Upgrade = bump defguard_*_image tags.
# ==============================================================================

# Primary NIC (netplan) — used to disable IPv6 RA/SLAAC so the host stays
# static-only (keeps fd01:3::180, drops the auto EUI-64 mngtmpaddr).
defguard_primary_iface: "eth0"

# Dual-stack: ULA v6 subnet for the defguard docker network (user-defined nets
# don't inherit the daemon fixed-cidr-v6). Masqueraded to the host's real v6.
defguard_network_v6_subnet: "fd00:d09::/64"

# Pinned images (never :latest). v2.0.1 = current stable across core/gw/proxy.
defguard_core_image: "ghcr.io/defguard/defguard:2.0.1"
defguard_proxy_image: "ghcr.io/defguard/defguard-proxy:2.0.1"
# Gateway: a DERIVED image is built on the host (stock gateway does NOT ship
# wireguard-go, which userspace mode requires). Base + derived tag below.
defguard_gateway_base_image: "ghcr.io/defguard/gateway:2.0.1"
defguard_gateway_image: "defguard-gateway-userspace:2.0.1"
# wireguard-go source (built into the derived image at deploy time).
defguard_wireguard_go_git: "https://git.zx2c4.com/wireguard-go"
defguard_go_builder_image: "golang:1.24.6-alpine"

defguard_fqdn: "defguard.by-research.be"
defguard_lxc_vmid: 550   # PVE vmid — referenced in the tun host-prereq message

# Web/enrollment HTTP backend (Traefik terminates TLS) — published on the SVC IP.
defguard_listen_ip: "10.1.3.180"
defguard_core_host_port: 8000        # core REST API + web UI
defguard_core_container_port: 8000
defguard_core_grpc_port: 50055       # core gRPC (gateway/proxy connect here)
defguard_proxy_host_port: 8080       # enrollment proxy HTTP
defguard_proxy_container_port: 8080
defguard_proxy_grpc_port: 50051      # enrollment proxy gRPC

# WireGuard data plane.
defguard_wg_udp_port: 51820          # WAN udp endpoint (alias port_wg, infra/0004 §8)
defguard_wg_ifname: "wg0"
# Userspace WireGuard — MUST be on (unprivileged+nesting LXC has no host wg
# kernel module; wireguard-go is bundled into the derived gateway image).
defguard_userspace: true

# Shared PostgreSQL (DB + role created by the postgres_db role).
defguard_pg_host: "lxc-pgsql-01.by-research.be"
defguard_pg_port: 5432
defguard_pg_name: "defguard"
defguard_pg_user: "defguard"
defguard_pg_sslmode: "verify-full"          # libpq verify-full (CA-by-default)
defguard_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Controller secret store.
defguard_secret_dir: "~/.openclaw/workspace/infra/secrets"
defguard_secret_file: "defguard-core.json"        # secret_key + auth/gw secrets + admin pw
defguard_oidc_secret_file: "defguard-oidc.json"   # Authentik client id/secret (separate phase)
defguard_pg_secret_file: "db-pgsql-defguard.json" # written by postgres_db

# Initial local break-glass admin (SSO via Authentik wired later).
defguard_admin_name: "admin"
defguard_admin_email: "admin@by-research.be"

# Authentik external OIDC provider. The Authentik-side app is created in a
# separate SSO phase; the client id/secret are consumed from the secret file
# above. The issuer below is Authentik's application slug endpoint.
# NOTE: external OpenID *login into defguard* is an enterprise/Business-only
# feature (configured via the admin UI, not env) — NOT available on this
# community image. Keep disabled. Defguard's own auth = username/pw + WireGuard MFA.
defguard_oidc_enabled: false
defguard_oidc_issuer: "https://authentik.by-research.be/application/o/defguard/"
