---
- name: "Discord | Bot token from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ discord_guild_vault_bot_path }}"

- name: "Discord | Bind the bot secret"
  ansible.builtin.set_fact:
    discord_guild_bot: "{{ vault_secret_result }}"
  no_log: true

- name: "Discord | Reconcile the guild (roles, categories, channels, overwrites, webhooks)"
  ansible.builtin.import_tasks: reconcile.yml

- name: "Discord | Report (webhook URLs never shown)"
  ansible.builtin.debug:
    msg: "{{ discord_guild_changes + ['changes=' ~ discord_guild_changes | length, 'webhooks=' ~ discord_guild_webhooks | length] }}"

- name: "Discord | Webhook URLs → Vault (get-or-create per webhook; secret stays in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ discord_guild_vault_webhook_prefix }}{{ item.key }}"
    vault_secret_init:
      webhook: "{{ item.value.url }}"
      id: "{{ item.value.id }}"
      channel: "{{ item.value.channel }}"
      _note: "Discord webhook (bot {{ discord_guild_bot_role }}, managed by roles/discord_guild) — consumed by gitlab_rbac_integrations / GitHub / Alertmanager"
  loop: "{{ discord_guild_webhooks | dict2items }}"
  loop_control:
    label: "{{ item.key }} -> #{{ item.value.channel }}"
  no_log: true
