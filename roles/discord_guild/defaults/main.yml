---
# ==============================================================================
# discord_guild — the platform's Discord server as code (chat-ops). Reconciles
# categories, channels, roles, permission overwrites and one webhook per
# notification channel through the Discord REST API (bot svc-chatops-prod,
# token in Vault prod/discord/bot). Webhook URLs are secrets: written to Vault
# (prod/discord/webhook-<name>), never printed, consumed by gitlab_rbac
# integrations / Alertmanager / GitHub. Idempotent: run twice → changed=0.
# ==============================================================================
discord_guild_vault_bot_path: "{{ platform_env }}/discord/bot"
discord_guild_vault_webhook_prefix: "{{ platform_env }}/discord/webhook-"
discord_guild_bot_role: "svc-chatops-{{ platform_env }}"       # the bot's managed role (created by Discord on invite)

# Roles mirror Authentik access groups (member sync = follow-up: discord_id per person)
discord_guild_roles:
  - { name: platform-admins, color: 15158332, hoist: true }    # red
  - { name: dev, color: 3447003, hoist: false }               # blue

# Categories → channels. `announce: true` = @everyone read-only, platform-admins + bot post.
# `webhook: <name>` = create/keep a webhook named gitlab-<name>/<name> and store its URL in Vault.
discord_guild_categories:
  - name: Announcements
    channels:
      - { name: announcements, topic: "Platform news — admins + chat-ops bot post here", announce: true }
      - { name: releases, topic: "Release notes from GitHub (release-please) — automated", announce: true, webhook: releases }
  - name: Platform
    channels:
      - { name: infra, topic: "GitLab platform/infra — pipelines, MRs, issues", webhook: gitlab-infra }
      - { name: apps, topic: "GitLab platform/apps — pipelines, MRs, issues", webhook: gitlab-apps }
      - { name: devops, topic: "GitLab platform/devops — pipelines, MRs, issues", webhook: gitlab-devops }
  - name: Support
    channels:
      - { name: helpdesk, topic: "Service Desk activity (platform/support/helpdesk) — summaries only", webhook: gitlab-helpdesk }
  - name: Ops
    channels:
      - { name: alerts, topic: "Alertmanager / Grafana alerts (parked until the alerting trio lands)", webhook: alerts }

discord_guild_post_ready_message: true            # one-line "chat-ops online" in #announcements on first creation
discord_guild_ready_channel: announcements
discord_guild_ready_message: "chat-ops online — server managed as code by **BOT** (ansible-platform `discord_guild`)."   # BOT = the bot's name

# --- the REST API (tasks/reconcile.yml) -----------------------------------------
discord_guild_api: "https://discord.com/api/v10"
discord_guild_webhook_url_base: "https://discord.com/api/webhooks"
discord_guild_user_agent: "{{ platform_org }}-chatops/1.0"
discord_guild_api_timeout: 30
discord_guild_api_retries: 5                      # a rate-limited call (HTTP 429) is tried again …
discord_guild_api_delay: 3                        # … after this many seconds
# Discord's object types
discord_guild_type_text: 0
discord_guild_type_category: 4
discord_guild_type_incoming_webhook: 1
# Permission bits of an announce channel (Discord: ADD_REACTIONS 64, VIEW_CHANNEL 1024,
# SEND_MESSAGES 2048, MANAGE_MESSAGES 8192, READ_MESSAGE_HISTORY 65536).
discord_guild_announce_everyone_allow: 66624      # VIEW_CHANNEL + READ_MESSAGE_HISTORY + ADD_REACTIONS
discord_guild_announce_everyone_deny: 2048        # SEND_MESSAGES
discord_guild_announce_poster_allow: 10240        # SEND_MESSAGES + MANAGE_MESSAGES
