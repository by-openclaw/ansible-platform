---
# Seed the unseal shares (ONCE, from the controller init file), deploy the local
# cold-start playbook; a one-shot container (an Ansible execution environment) runs it,
# started by the warden-coldstart timer.

- name: "Warden | Ensure the warden dir"
  ansible.builtin.file:
    path: "{{ warden_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Warden | Stat the local share file"
  ansible.builtin.stat:
    path: "{{ warden_share_file }}"
  register: warden_shares_stat

- name: "Warden | Seed the unseal shares (threshold only — once, 0600)"
  vars:
    warden_shares_doc:
      shares: "{{ (lookup('file', warden_controller_init) | from_json).fields.unseal_keys_b64[:warden_key_threshold] }}"  # pragma: allowlist secret
  ansible.builtin.copy:
    dest: "{{ warden_share_file }}"
    owner: root
    group: root
    mode: "0600"
    content: "{{ warden_shares_doc | to_json }}"
  when: not warden_shares_stat.stat.exists
  no_log: true

- name: "Warden | Deploy the local cold-start playbook"
  ansible.builtin.template:
    src: coldstart.yml.j2
    dest: "{{ warden_dir }}/coldstart.yml"
    owner: root
    group: root
    mode: "0600"
  notify: Restart warden-coldstart

# The engine: an execution-environment image (ansible-core + python), created here and never
# left running — each timer run is `docker start --attach`, which runs the local playbook once
# and exits. The image is pulled at install time, so a cold start needs no registry.
- name: "Warden | The cold-start container (roles/service_scaffold containers; created, not started)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: warden
      containers:
        - name: "{{ warden_container }}"
          image: "{{ warden_image }}"
          state: present            # created; the timer starts it
          restart_policy: "no"      # one run per start
          network_mode: host
          user: "0:0"               # reads the 0600 share file
          command: [ansible-playbook, -c, local, "{{ warden_dir }}/coldstart.yml"]
          volumes:
            - "{{ warden_dir }}:{{ warden_dir }}:ro"

# The cold-start watchdog is a roles/host_job job on a monotonic schedule: 30 s after
# boot, then every 5 min; a failed run retries every minute in place (Restart=), so it
# never reaches "failed" and OnFailure= could not fire — a mail per retry would be the
# wrong signal anyway. Its failure is a Vault that stays sealed: the /v1/sys/health
# probe (roles/prometheus) alerts on that.
- name: "Warden | Boot runs come from the timer (OnBootSec), not an enabled service"
  ansible.builtin.file:
    path: /etc/systemd/system/multi-user.target.wants/warden-coldstart.service
    state: absent

- name: "Warden | The cold-start watchdog (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: warden-coldstart
    host_job_description: "Warden platform cold-start reconciliation (vault unseal + verify)"
    host_job_exec:
      - "/usr/bin/docker start --attach {{ warden_container }}"   # the run's output goes to the journal
    host_job_on_calendar: ""
    host_job_on_boot_sec: "30"
    host_job_on_unit_active_sec: "5min"
    host_job_restart: on-failure
    host_job_restart_sec: "60"
    host_job_timeout: 30min
    host_job_wants_network: true
    host_job_on_failure: false        # retries in place; a sealed Vault is the alert (probe)

# One run in the container proves the engine before the native one goes: it unseals only a
# sealed Vault, so on a running platform it verifies and probes.
- name: "Warden | One cold-start run in the container (read-only on an unsealed Vault)"
  ansible.builtin.command:
    argv: [docker, start, --attach, "{{ warden_container }}"]
  register: warden_container_run
  changed_when: false
  when: not ansible_check_mode

- name: "Warden | The native engine (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ warden_native }}"
