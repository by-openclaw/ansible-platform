---
# Order matters once: the platform's rules exist BEFORE the default actions flip to block,
# so the Ansible SSH session (stateful) and the next one are never cut.
- name: "Win firewall | The platform's rules (exact, per application)"
  community.windows.win_firewall_rule:
    name: "{{ item.name }}"
    direction: "{{ item.direction }}"
    action: "{{ item.action }}"
    protocol: "{{ item.protocol }}"
    localport: "{{ item.localport | default(omit) }}"
    remoteport: "{{ item.remoteport | default(omit) }}"
    # A YAML list here fails the module's COM call ("Value does not fall within the
    # expected range", every rule, 2026-10-15); the comma-joined string is what works.
    remoteip: "{{ (item.remoteip | join(',')) if item.remoteip is defined else omit }}"
    program: "{{ item.program | default(omit) }}"
    service: "{{ item.service | default(omit) }}"
    icmp_type_code: "{{ item.icmp_type_code | default(omit) }}"
    profiles: "{{ windows_firewall_profiles | map('lower') | list }}"
    enabled: true
    state: present
  loop: "{{ windows_firewall_rules }}"
  loop_control:
    label: "{{ item.name }}"

- name: "Win firewall | All profiles on, inbound block, outbound {{ windows_firewall_outbound_action }} (declared posture)"
  ansible.windows.win_firewall:
    profiles: "{{ windows_firewall_profiles }}"
    state: enabled
    inbound_action: block
    outbound_action: "{{ windows_firewall_outbound_action }}"

# netsh writes the EFFECTIVE store (the policy registry keys only reach it after a policy
# refresh and never showed in `netsh advfirewall show`, seen 2026-10-15): query, set on drift.
- name: "Win firewall | Logging settings today"
  ansible.windows.win_command:
    argv: [netsh.exe, advfirewall, show, allprofiles, logging]
  register: windows_firewall_logging_now
  changed_when: false
  check_mode: false

- name: "Win firewall | Dropped and allowed connections logged, {{ windows_firewall_log_size_kb }} KB per profile (only on drift)"
  ansible.windows.win_command:
    argv: [netsh.exe, advfirewall, set, allprofiles, logging, "{{ item.key }}", "{{ item.value }}"]
  loop:
    - { key: droppedconnections, value: enable }
    - { key: allowedconnections, value: enable }
    - { key: maxfilesize, value: "{{ windows_firewall_log_size_kb }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"
  when: >-
    (windows_firewall_logging_now.stdout | regex_findall({'droppedconnections': 'LogDroppedConnections\\s+(\\S+)',
                                                           'allowedconnections': 'LogAllowedConnections\\s+(\\S+)',
                                                           'maxfilesize': 'MaxFileSize\\s+(\\S+)'}[item.key])
     | map('lower') | unique | list) != [item.value | string | lower]
  changed_when: true

- name: "Win firewall | WinHTTP proxy today"
  ansible.windows.win_command:
    argv: [netsh.exe, winhttp, show, proxy]
  register: windows_firewall_winhttp
  changed_when: false
  check_mode: false

- name: "Win firewall | Internet egress through the platform proxy only (only on drift)"
  ansible.windows.win_command:
    argv: [netsh.exe, winhttp, set, proxy, "proxy-server={{ windows_firewall_winhttp_proxy }}", "bypass-list={{ windows_firewall_winhttp_bypass }}"]
  when:
    - not (windows_firewall_egress_open | bool)
    - windows_firewall_winhttp.stdout is not search(windows_firewall_winhttp_proxy | regex_escape)
  changed_when: true

- name: "Win firewall | Direct system egress while the posture is open (only on drift)"
  ansible.windows.win_command:
    argv: [netsh.exe, winhttp, reset, proxy]
  when:
    - windows_firewall_egress_open | bool
    - windows_firewall_winhttp.stdout is not search('Direct access')
  changed_when: true

- name: "Win firewall | Report"
  ansible.builtin.debug:
    msg: >-
      WIN_FIREWALL {{ inventory_hostname }}: {{ windows_firewall_rules | selectattr('direction', 'equalto', 'in') | list | length }} inbound +
      {{ windows_firewall_rules | selectattr('direction', 'equalto', 'out') | list | length }} outbound rules, inbound block,
      outbound {{ windows_firewall_outbound_action }}, logging on,
      egress {{ 'direct (declared open posture)' if (windows_firewall_egress_open | bool) else 'via ' ~ windows_firewall_winhttp_proxy }}
