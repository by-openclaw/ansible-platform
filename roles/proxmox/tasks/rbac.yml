---
# Map the Authentik admin group → a PVE group with an admin role, so OIDC users land
# WITH permissions. The realm sets groups-claim=groups, so on login PVE syncs each
# user's Authentik groups into matching PVE groups; this ACL'd group is the one that
# grants access. Mirrors by-rune (svc-rune@pve = Administrator on /), but group-based.
- name: "proxmox-rbac | Load PVE admin token (controller)"
  ansible.builtin.set_fact:
    _pve: "{{ (lookup('file', proxmox_secret_dir + '/' + proxmox_admin_token_file) | from_json).fields }}"
  no_log: true

- name: "proxmox-rbac | Get existing PVE groups"
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json/access/groups"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ _pve.admin_token_id }}={{ _pve.admin_token_secret }}"
    validate_certs: false
    status_code: [200]
  register: pve_groups
  changed_when: false        # read-only
  no_log: true

- name: "proxmox-rbac | Create the admin PVE group (absent)"
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json/access/groups"
    method: POST
    headers:
      Authorization: "PVEAPIToken={{ _pve.admin_token_id }}={{ _pve.admin_token_secret }}"
    body_format: form-urlencoded
    body:
      groupid: "{{ proxmox_admin_group }}"
      comment: "Authentik {{ proxmox_admin_group }} — synced via the OIDC groups claim"
    validate_certs: false
    status_code: [200]
  when: proxmox_admin_group not in (pve_groups.json.data | map(attribute='groupid') | list)
  no_log: true

- name: "proxmox-rbac | Grant the admin PVE group its role on the ACL path"
  ansible.builtin.uri:
    url: "https://{{ proxmox_api_host }}:{{ proxmox_api_port }}/api2/json/access/acl"
    method: PUT
    headers:
      Authorization: "PVEAPIToken={{ _pve.admin_token_id }}={{ _pve.admin_token_secret }}"
    body_format: form-urlencoded
    body:
      path: "{{ proxmox_admin_acl_path }}"
      groups: "{{ proxmox_admin_group }}"
      roles: "{{ proxmox_admin_role }}"
      propagate: "{{ proxmox_admin_acl_propagate }}"
    validate_certs: false
    status_code: [200]
  no_log: true

- name: "proxmox-rbac | Summary"
  ansible.builtin.debug:
    msg: >-
      PVE group '{{ proxmox_admin_group }}' → role '{{ proxmox_admin_role }}' on
      '{{ proxmox_admin_acl_path }}' (propagate={{ proxmox_admin_acl_propagate }}).
      Authentik users in '{{ proxmox_admin_group }}' are synced into it on login and
      inherit the role. Existing OIDC users must log out + back in to re-sync.
