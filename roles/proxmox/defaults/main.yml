---
# ==============================================================================
# Role: proxmox — configure Proxmox VE via the PVE API (Ansible-only).
#
# Node SSH is closed on the PVE hosts, so everything here goes through the PVE
# REST API using a high-priv admin API token (uri module — no pveum shell, no
# helper script). First concern: the Authentik OIDC realm (SSO web login).
# ==============================================================================
proxmox_api_host: "10.6.224.105"          # srv-proxmox-poc-01 (OOB/mgmt) — the live platform node
proxmox_api_port: 8006
proxmox_secret_dir: "~/.openclaw/workspace/infra/secrets"
# fields.admin_token_id / fields.admin_token_secret (PVEAPIToken= user@realm!tokenid = secret)
proxmox_admin_token_file: "infra-proxmox-poc.json"

# --- Authentik OIDC realm -------------------------------------------------------
# client_id/secret come from the SAME app-oidc-proxmox.json the authentik blueprint
# uses, so both sides stay in sync (run the authentik role first — it generates the
# file + creates the provider).
proxmox_oidc_enabled: true
proxmox_oidc_realm: "authentik"
proxmox_oidc_app_secret_file: "app-oidc-proxmox.json"
proxmox_oidc_issuer_url: "https://authentik.by-research.be/application/o/proxmox/"
# Provider sub_mode is user_email → the user's identity claim is the email.
proxmox_oidc_username_claim: "email"
# Request the `groups` scope so Authentik emits the user's group names, and tell PVE
# which claim carries them → PVE syncs OIDC users into matching PVE groups on login.
proxmox_oidc_scopes: "openid profile email groups"
proxmox_oidc_groups_claim: "groups"
# Re-apply the claimed groups on EVERY login (not just first autocreate). Without this,
# PVE only sets groups when it first creates the user; an existing user whose groups
# changed in Authentik (or who was created before the groups-claim was configured)
# never re-syncs → lands with no permissions. With overwrite, PVE sets the user's PVE
# groups to exactly the claimed groups that EXIST in PVE (autocreate stays off, so only
# proxmox-admins — the one we ACL — is synced; the user's other Authentik groups are
# ignored). Authentik is the source of truth for membership. Verified: this is the knob
# that was missing (groups scope WAS granted + in the id_token, but PVE didn't re-sync).
proxmox_oidc_groups_overwrite: 1
proxmox_oidc_autocreate: 1                # auto-create the PVE user on first login
proxmox_oidc_default: 0                    # not the default realm (PAM stays default)
proxmox_oidc_comment: "Authentik SSO"

# --- RBAC: map the Authentik admin group → a PVE group with an admin role ---------
# OIDC users land with no permissions until their synced PVE group is ACL'd. Mirrors
# by-rune (svc-rune@pve = Administrator on /), but group-based + reproducible.
#
# IMPORTANT PVE quirk (pve-access-control OpenId.pm): on login PVE renames every
# claimed group to "<group>-<realm>" and only adds the user to a PVE group of THAT
# name that already exists (groups-autocreate stays off so we don't pollute PVE with
# every Authentik group). So the Authentik group "proxmox-admins" is synced into the
# PVE group "proxmox-admins-authentik" — that suffixed name is what we must create +
# ACL. Getting this wrong = overwrite removes the user from all groups and adds none.
proxmox_rbac_enabled: true
proxmox_admin_group: "proxmox-admins"      # the Authentik group name (= the claim value)
# The PVE group PVE actually syncs into: <claim group>-<realm>. This is what we ACL.
proxmox_admin_pve_group: "{{ proxmox_admin_group }}-{{ proxmox_oidc_realm }}"
proxmox_admin_role: "Administrator"        # role for SSO human admins (PVEAdmin = safer)

# RBAC is applied as a 3-layer flow — roles → groups → ACL — the same model as the
# svc-rune / svc-opus automation accounts, just data-driven + reproducible here.
# principal-type → PVE /access/acl body key:
proxmox_acl_principal_key: { user: users, group: groups, token: tokens }

# 1. ROLES. Custom roles only — built-ins (Administrator, PVEAdmin, PVEAuditor, …) are
#    PVE-provided and not declared. TerraformRole = infra-automation role used by the
#    svc-rune!terraform token: full VM/storage/SDN lifecycle + Sys.Audit/Modify, but NO
#    permission/realm/user modify (that stays with Administrator). Privs captured live.
proxmox_roles:
  - roleid: TerraformRole
    privs: "Datastore.Allocate,Datastore.AllocateSpace,Datastore.AllocateTemplate,Datastore.Audit,SDN.Allocate,SDN.Audit,SDN.Use,Sys.Audit,Sys.Modify,VM.Allocate,VM.Audit,VM.Clone,VM.Config.CDROM,VM.Config.CPU,VM.Config.Cloudinit,VM.Config.Disk,VM.Config.HWType,VM.Config.Memory,VM.Config.Network,VM.Config.Options,VM.GuestAgent.Audit,VM.GuestAgent.Unrestricted,VM.Migrate,VM.PowerMgmt"

# 2. GROUPS. The SSO group-sync target (PVE renames the Authentik claim to <group>-<realm>).
proxmox_groups:
  - groupid: "{{ proxmox_admin_pve_group }}"
    comment: "Authentik '{{ proxmox_admin_group }}' (realm {{ proxmox_oidc_realm }}) — OIDC group sync target"

# 3. ACL. principal (user|group|token) → role on a path. Codifies the whole live authz
#    layer: the SSO admin group + the svc-* automation accounts/tokens. The svc users and
#    their API tokens are NOT created here (their secrets are managed out-of-band) — only
#    their role bindings, so this never rotates a token secret.
proxmox_acls:
  - { path: "/", type: group, id: "{{ proxmox_admin_pve_group }}", role: "{{ proxmox_admin_role }}", propagate: 1 }
  - { path: "/", type: user,  id: "svc-rune@pve",          role: "Administrator", propagate: 1 }
  - { path: "/", type: token, id: "svc-rune@pve!admin",     role: "Administrator", propagate: 1 }
  - { path: "/", type: token, id: "svc-rune@pve!terraform", role: "TerraformRole", propagate: 1 }
  - { path: "/", type: token, id: "svc-opus@pve!audit",     role: "PVEAdmin",      propagate: 1 }
