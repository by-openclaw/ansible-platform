---
# ==============================================================================
# Role: proxmox — configure Proxmox VE via the PVE API (Ansible-only).
#
# Node SSH is closed on the PVE hosts, so everything here goes through the PVE
# REST API using a high-priv admin API token (uri module — no pveum shell, no
# helper script). First concern: the Authentik OIDC realm (SSO web login).
# ==============================================================================
proxmox_api_host: "10.6.224.105"          # srv-proxmox-poc-01 (OOB/mgmt) — the live platform node
proxmox_api_port: 8006
proxmox_secret_dir: "~/.openclaw/workspace/infra/secrets"
# fields.admin_token_id / fields.admin_token_secret (PVEAPIToken= user@realm!tokenid = secret)
proxmox_admin_token_file: "infra-proxmox-poc.json"

# --- Authentik OIDC realm -------------------------------------------------------
# client_id/secret come from the SAME app-oidc-proxmox.json the authentik blueprint
# uses, so both sides stay in sync (run the authentik role first — it generates the
# file + creates the provider).
proxmox_oidc_enabled: true
proxmox_oidc_realm: "authentik"
proxmox_oidc_app_secret_file: "app-oidc-proxmox.json"
proxmox_oidc_issuer_url: "https://authentik.by-research.be/application/o/proxmox/"
# Provider sub_mode is user_email → the user's identity claim is the email.
proxmox_oidc_username_claim: "email"
# Request the `groups` scope so Authentik emits the user's group names, and tell PVE
# which claim carries them → PVE syncs OIDC users into matching PVE groups on login.
proxmox_oidc_scopes: "openid profile email groups"
proxmox_oidc_groups_claim: "groups"
proxmox_oidc_autocreate: 1                # auto-create the PVE user on first login
proxmox_oidc_default: 0                    # not the default realm (PAM stays default)
proxmox_oidc_comment: "Authentik SSO"

# --- RBAC: map the Authentik admin group → a PVE group with an admin role ---------
# OIDC users land with no permissions until their synced PVE group is ACL'd. Mirrors
# by-rune (svc-rune@pve = Administrator on /), but group-based + reproducible.
proxmox_rbac_enabled: true
proxmox_admin_group: "proxmox-admins"      # must match the Authentik group name exactly
proxmox_admin_role: "Administrator"        # same role by-rune has; PVEAdmin = slightly safer
proxmox_admin_acl_path: "/"
proxmox_admin_acl_propagate: 1
