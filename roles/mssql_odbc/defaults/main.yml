---
# ==============================================================================
# Role: mssql_odbc — Microsoft ODBC Driver for SQL Server on a Windows client host.
#
# The EVS Cerebrum servers reach their SQL instance through ODBC (EVS manual §3.3); Cerebrum's own
# SQL tester looks the driver up by name and its list stops at 17 ("ODBC Driver 17, 13, 11, Native
# Client", seen on vm-winapp-01, 2026-11-03), so the client is Driver 17, the latest of that line.
# The MSI comes from Microsoft's download centre, pinned by sha256; an upgrade inside the line is a
# new pin (the MSI upgrades in place).
# ==============================================================================
mssql_odbc_download_dir: 'C:\ProgramData\platform\installers'
mssql_odbc_version: "17.11.1.1"                 # newest 17.x (Microsoft release notes, 2026-04-30)
mssql_odbc_msi_url: ""                          # REQUIRED — msodbcsql.msi, x64 (inventory)
mssql_odbc_msi_sha256: ""                       # REQUIRED
mssql_odbc_driver_name: "ODBC Driver 17 for SQL Server"
