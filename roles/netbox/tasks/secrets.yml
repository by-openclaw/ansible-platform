---
# NetBox's own secrets and the three it borrows, all from Vault — nothing is read
# off the controller's disk and nothing is written there (#377). All facts no_log.
#
# Its OWN secret is get-or-create: absent in Vault -> minted once and stored;
# present -> read. That is the same behaviour the old stat-or-generate-then-persist
# had, with Vault holding the state instead of a 0600 file on one machine.
- name: "secrets | NetBox's own secrets (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_vault_path }}"
    vault_secret_init:
      secret_key: "{{ lookup('community.general.random_string', length=60, special=false) }}"
      superuser_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
      superuser_api_token: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      url: "https://{{ netbox_fqdn }}"
      user: "{{ netbox_superuser_name }}"
      email: "{{ netbox_superuser_email }}"

- name: "secrets | Bind them"
  ansible.builtin.set_fact:
    netbox_secrets: "{{ vault_secret_result }}"
  no_log: true

# One include for all three borrowed secrets, not three. Each vault_secret call
# costs a fresh AppRole login (~4.5s, vault_login caches nothing), so reading them
# separately is three logins for one dependency step.
- name: "secrets | The secrets NetBox borrows (Postgres, Redis, SMTP)"
  ansible.builtin.include_role:
    name: vault_secret
    tasks_from: many
  vars:
    vault_secret_paths:
      - "{{ netbox_pg_vault_path }}"
      - "{{ netbox_redis_vault_path }}"
      - "{{ netbox_smtp_vault_path }}"

- name: "secrets | Bind the borrowed secrets"
  ansible.builtin.set_fact:
    netbox_pg_password: "{{ vault_secret_results[netbox_pg_vault_path].password }}"
    netbox_redis_password: "{{ vault_secret_results[netbox_redis_vault_path].password }}"
    netbox_resend: "{{ vault_secret_results[netbox_smtp_vault_path] }}"
  no_log: true

- name: "secrets | Build the NetBox environment"
  ansible.builtin.set_fact:
    netbox_env:
      # PostgreSQL (verified TLS; libpq honors PGSSLROOTCERT for verify-full).
      DB_HOST: "{{ netbox_pg_host }}"
      DB_PORT: "{{ netbox_pg_port | string }}"
      DB_NAME: "{{ netbox_pg_name }}"
      DB_USER: "{{ netbox_pg_user }}"
      DB_PASSWORD: "{{ netbox_pg_password }}"
      DB_SSLMODE: "{{ netbox_pg_sslmode }}"
      PGSSLROOTCERT: "{{ netbox_pg_sslrootcert }}"
      # Redis — tasks queue (DB 0) over TLS.
      REDIS_HOST: "{{ netbox_redis_host }}"
      REDIS_PORT: "{{ netbox_redis_port | string }}"
      REDIS_PASSWORD: "{{ netbox_redis_password }}"
      REDIS_DATABASE: "{{ netbox_redis_tasks_db | string }}"
      REDIS_SSL: "true"
      # Redis — cache (DB 1) over TLS.
      REDIS_CACHE_HOST: "{{ netbox_redis_host }}"
      REDIS_CACHE_PORT: "{{ netbox_redis_port | string }}"
      REDIS_CACHE_PASSWORD: "{{ netbox_redis_password }}"
      REDIS_CACHE_DATABASE: "{{ netbox_redis_cache_db | string }}"
      REDIS_CACHE_SSL: "true"
      # Application.
      SECRET_KEY: "{{ netbox_secrets.secret_key }}"
      ALLOWED_HOSTS: "{{ netbox_fqdn }}"
      # Local break-glass superuser (SSO via Authentik wired later).
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: "{{ netbox_superuser_name }}"
      SUPERUSER_EMAIL: "{{ netbox_superuser_email }}"
      SUPERUSER_PASSWORD: "{{ netbox_secrets.superuser_password }}"
      SUPERUSER_API_TOKEN: "{{ netbox_secrets.superuser_api_token }}"
      # Internal-only: skip internet-dependent features (dashboard newsfeed/release).
      ISOLATED_DEPLOYMENT: "{{ netbox_isolated_deployment | string | lower }}"
      # SMTP via Resend (env-only — no .py).
      EMAIL_SERVER: "{{ netbox_resend.smtp_host }}"
      EMAIL_PORT: "{{ netbox_resend.smtp_port | string }}"
      EMAIL_USERNAME: "{{ netbox_resend.smtp_username }}"
      EMAIL_PASSWORD: "{{ netbox_resend.smtp_api_key }}"
      EMAIL_USE_SSL: "{{ 'true' if (netbox_resend.smtp_port | string) == '465' else 'false' }}"
      EMAIL_USE_TLS: "{{ 'true' if (netbox_resend.smtp_port | string) != '465' else 'false' }}"
      EMAIL_FROM: "{{ netbox_resend.from_address }}"
  no_log: true

# --- Authentik OIDC SSO env (only when the client secret file exists) -----------
# Read-if-present: the authentik role mints this app's client credentials, and
# NetBox can be installed before SSO is wired. vault_secret_optional yields an
# empty result instead of failing, which is what the stat gate expressed.
- name: "secrets | The Authentik OIDC client credentials, if they exist yet"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_oidc_vault_path }}"
    vault_secret_optional: true

- name: "secrets | Bind them, and whether SSO can be configured at all"
  ansible.builtin.set_fact:
    netbox_oidc: "{{ vault_secret_result | default({}) }}"
    netbox_oidc_held: "{{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}"
  no_log: true

- name: "secrets | Merge the Authentik OIDC env into the NetBox environment"
  ansible.builtin.set_fact:
    netbox_env: "{{ netbox_env | combine(netbox_oidc_env) }}"
  vars:
    netbox_oidc_env:
      # python-social-auth OpenID Connect against the Authentik per-app issuer.
      REMOTE_AUTH_ENABLED: "true"
      REMOTE_AUTH_BACKEND: "social_core.backends.open_id_connect.OpenIdConnectAuth"
      SOCIAL_AUTH_OIDC_OIDC_ENDPOINT: "{{ netbox_authentik_base }}/application/o/{{ netbox_oidc_app_slug }}/"
      SOCIAL_AUTH_OIDC_KEY: "{{ netbox_oidc.client_id }}"
      SOCIAL_AUTH_OIDC_SECRET: "{{ netbox_oidc.client_secret }}"
      # Auto-provision SSO users; sync groups from the `groups` claim so the
      # netbox-admins group maps to NetBox superuser. IdP policy gates who can
      # reach the app at all (RBAC), so auto-create is safe.
      REMOTE_AUTH_AUTO_CREATE_USER: "true"
  no_log: true
  when: netbox_oidc_held | bool

- name: "secrets | Ensure the netbox config dir exists on the host"
  ansible.builtin.file:
    path: "{{ netbox_oidc_extra_host_path | dirname }}"
    state: directory
    mode: "0755"
  when: netbox_oidc_held | bool

- name: "secrets | Render the OIDC group->role pipeline config (NetBox Python config)"
  ansible.builtin.template:
    src: extra.py.j2
    dest: "{{ netbox_oidc_extra_host_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: "Restart netbox"   # bind-mounted file → containers must restart to reload
  when: netbox_oidc_held | bool

- name: "secrets | Bind-mount the OIDC config into the containers (when SSO is wired)"
  ansible.builtin.set_fact:
    netbox_extra_mounts: "{{ [netbox_oidc_extra_host_path ~ ':/etc/netbox/config/extra.py:ro'] if netbox_oidc_held | bool else [] }}"
