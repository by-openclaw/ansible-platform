---
# NetBox's own secrets and the three it borrows, all from Vault — nothing is read
# off the controller's disk and nothing is written there (#377). All facts no_log.
#
# Its OWN secret is get-or-create: absent in Vault -> minted once and stored;
# present -> read. That is the same behaviour the old stat-or-generate-then-persist
# had, with Vault holding the state instead of a 0600 file on one machine.
- name: "secrets | NetBox's own secrets (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_vault_path }}"
    vault_secret_init:
      secret_key: "{{ lookup('community.general.random_string', length=60, special=false) }}"
      superuser_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
      superuser_api_token: "{{ lookup('community.general.random_string', length=40, special=false) }}"
      api_token_pepper: "{{ lookup('community.general.random_string', length=64, special=false) }}"   # NetBox 4.7+: v2 (hashed) API tokens need a pepper   # pragma: allowlist secret
      url: "https://{{ netbox_fqdn }}"
      user: "{{ netbox_superuser_name }}"
      email: "{{ netbox_superuser_email }}"

- name: "secrets | Bind them"
  ansible.builtin.set_fact:
    netbox_secrets: "{{ vault_secret_result }}"
  no_log: true

# A document minted before 4.7 has no pepper: add one (written once; never rotated by the role — a
# rotated pepper invalidates every v2 token).
- name: "secrets | A fresh pepper for an older document (minted once, below)"
  ansible.builtin.set_fact:
    netbox_api_token_pepper_new: "{{ lookup('community.general.random_string', length=64, special=false) }}"   # pragma: allowlist secret
  no_log: true
  when: (netbox_secrets.api_token_pepper | default('')) | length == 0

- name: "secrets | Add the API token pepper to an older document (once)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_vault_path }}"
    vault_secret_init: { api_token_pepper: "{{ netbox_api_token_pepper_new }}" }   # pragma: allowlist secret
    vault_secret_force_fields: { api_token_pepper: "{{ netbox_api_token_pepper_new }}" }   # pragma: allowlist secret
  when: (netbox_secrets.api_token_pepper | default('')) | length == 0

- name: "secrets | Re-bind after the pepper was added (the document plus the new field)"
  ansible.builtin.set_fact:
    netbox_secrets: "{{ netbox_secrets | combine({'api_token_pepper': netbox_api_token_pepper_new}) }}"   # pragma: allowlist secret
  no_log: true
  when: (netbox_secrets.api_token_pepper | default('')) | length == 0

- name: "secrets | The Redis password NetBox borrows"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_redis_vault_path }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    netbox_redis_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "secrets | The service mailbox (minted by the scaffold's mailbox step; absent on a first run)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_mail_vault_path }}"
    vault_secret_optional: true

- name: "secrets | Bind it, and whether outbound mail can be configured"
  ansible.builtin.set_fact:
    netbox_mail: "{{ vault_secret_result | default({}) }}"
    netbox_mail_configured: "{{ (vault_secret_result | default({})).password | default('') | length > 0 }}"
  no_log: true

- name: "secrets | The Authentik OIDC client credentials, if they exist yet"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_oidc_vault_path }}"
    vault_secret_optional: true

- name: "secrets | Bind them, and whether SSO can be configured at all"
  ansible.builtin.set_fact:
    netbox_oidc: "{{ vault_secret_result | default({}) }}"
    netbox_oidc_held: "{{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}"
  no_log: true

- name: "secrets | Ensure the netbox config dir exists on the host"
  ansible.builtin.file:
    path: "{{ netbox_oidc_extra_host_path | dirname }}"
    state: directory
    mode: "0755"
  when: netbox_oidc_held | bool

- name: "secrets | Render the OIDC group->role pipeline config (NetBox Python config)"
  ansible.builtin.template:
    src: extra.py.j2
    dest: "{{ netbox_oidc_extra_host_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: "Restart netbox"   # bind-mounted file → containers must restart to reload
  when: netbox_oidc_held | bool
