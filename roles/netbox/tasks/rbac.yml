---
# ==============================================================================
# netbox | rbac — two invariants NetBox cannot keep by itself:
#   * the break-glass API token: the image applies SUPERUSER_API_TOKEN only when it creates
#     the superuser (first start), so the Vault field was dead on this instance. The token
#     held in Vault is validated against the local admin's tokens; when none validates, a new
#     one is minted by NetBox (v2, hashed) and its plaintext written back to Vault.
#   * superusers: the login pipeline (extra.py) only touches the user who logs in; a flag set
#     earlier stays. Superuser = active members of the admin group (people.yml) + the local admin.
# Runs through NetBox's own shell (docker exec), never touches the database directly.
# ==============================================================================
- name: "rbac | The reconcile script (NetBox shell)"
  ansible.builtin.copy:
    dest: "{{ netbox_scripts_dir }}/rbac.py"
    owner: root
    group: root
    mode: "0640"
    content: |
      import json, os
      from users.models import Token, User
      out = {"changed": [], "token": ""}
      admin = User.objects.get(username=os.environ["U"])
      held = os.environ.get("T", "")
      valid = any(t.validate(held) for t in admin.tokens.all()) if held else False
      if not valid:
          t = Token(user=admin, description="break-glass token (Vault netbox/admin, roles/netbox)", write_enabled=True)
          t.save()
          out["token"] = t.token
          out["changed"].append("token")
      allowed = set(filter(None, os.environ.get("ADMINS", "").split(","))) | {admin.username}
      for u in User.objects.all():
          want = u.username in allowed
          if u.is_superuser != want:
              u.is_superuser = want
              u.save()
              out["changed"].append("superuser:" + u.username + "=" + str(want))
      print("RBAC " + json.dumps(out))

- name: "rbac | Validate the break-glass token and reconcile the superusers"
  ansible.builtin.shell: |
    set -o pipefail
    docker exec -i -e T="$T" -e U="$U" -e ADMINS="$ADMINS" netbox \
      /opt/netbox/venv/bin/python /opt/netbox/netbox/manage.py shell < {{ netbox_scripts_dir }}/rbac.py | grep -E '^RBAC '
  args:
    executable: /bin/bash
  environment:
    T: "{{ netbox_secrets.superuser_api_token | default('') }}"
    U: "{{ netbox_superuser_name }}"
    ADMINS: "{{ netbox_superusers | join(',') }}"
  register: netbox_rbac_out
  changed_when: (netbox_rbac_out.stdout | regex_replace('^RBAC ', '') | from_json).changed | length > 0
  no_log: true
  when: not ansible_check_mode

- name: "rbac | Keep the result"
  ansible.builtin.set_fact:
    netbox_rbac: "{{ netbox_rbac_out.stdout | regex_replace('^RBAC ', '') | from_json }}"
  no_log: true
  when: not ansible_check_mode

- name: "rbac | A freshly minted token goes to Vault (overwrite the dead field)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ netbox_vault_path }}"
    vault_secret_init: { superuser_api_token: "{{ netbox_rbac.token }}" }
    vault_secret_force_fields: { superuser_api_token: "{{ netbox_rbac.token }}" }
  when:
    - not ansible_check_mode
    - netbox_rbac.token | default('') | length > 0

- name: "rbac | Summary (no secrets)"
  ansible.builtin.debug:
    msg: "superusers = {{ netbox_superusers + [netbox_superuser_name] }}; changes this run: {{ netbox_rbac.changed | default(['(dry-run)']) }}"
