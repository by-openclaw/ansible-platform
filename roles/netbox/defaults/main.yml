---
# ==============================================================================
# Role: netbox — IPAM / source-of-truth (Docker) on lxc-nbox-01 (SVC)
# web + worker + housekeeping containers (same image). Uses the shared cluster
# PostgreSQL (postgres_db: netbox) + Redis, both over verified TLS. Fronted by
# Traefik (wildcard TLS). Upgrade = bump netbox_image tag.
# ==============================================================================
netbox_image: "netboxcommunity/netbox:v4.6.8"   # exact pin — bump deliberately

netbox_fqdn: "{{ platform_service_fqdns.netbox }}"

# Web HTTP backend (Traefik terminates TLS) — published on the SVC IP.
netbox_listen_ip: "{{ hostvars[groups['netbox'] | first].ansible_host }}"
netbox_host_port: 8080
netbox_container_port: 8080

# Shared PostgreSQL (DB + role created by the postgres_db role).
netbox_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"
netbox_pg_port: 5432
netbox_pg_name: "netbox"
netbox_pg_user: "netbox"
netbox_pg_sslmode: "verify-full"          # falls back to "require" only if reported
netbox_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Shared Redis (TLS, two logical DBs: tasks=0, cache=1).
netbox_redis_host: "{{ groups['redis'] | first }}.{{ platform_domain }}"
netbox_redis_port: 6379
netbox_redis_tasks_db: 0
netbox_redis_cache_db: 1

# Controller secret store.
# Vault KV paths (security/0001 secret/{env}/{service}/{key}). No controller files:
# the disk copy was a second source that nothing kept in step (#377).
netbox_vault_path: "{{ platform_env | default('prod') }}/netbox/admin"        # secret_key + superuser + token
netbox_pg_vault_path: "{{ platform_env | default('prod') }}/netbox/db-pgsql"  # minted by postgres_db
netbox_redis_vault_path: "{{ platform_env | default('prod') }}/redis/admin"
netbox_smtp_vault_path: "{{ platform_env | default('prod') }}/resend/{{ platform_org }}"   # SMTP, env-only

# Internal-only deployment toggle. NOTE: disabling the newsfeed did NOT fix the
# slow dashboard render, so the RSS feed is left ENABLED (false) per request.
netbox_isolated_deployment: false

# Initial local break-glass admin (kept alongside SSO as the break-glass login).
netbox_superuser_name: "admin"
netbox_superuser_email: "admin@{{ platform_domain }}"

# --- Authentik OIDC SSO (wired only when the client secret file exists) ---------
# python-social-auth OIDC backend. The Authentik app/provider/group are declared
# in the authentik role (authentik_oidc_apps: netbox). Access = netbox-admins.
netbox_oidc_vault_path: "{{ platform_env | default('prod') }}/netbox/oidc"   # minted by roles/authentik
netbox_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
netbox_oidc_app_slug: "netbox"
# Members of this Authentik group become NetBox superusers (group sync from the
# OIDC `groups` claim). Login restriction to the group is enforced IdP-side
# (authentik application policy binding, restrict_to_group).
netbox_oidc_superuser_group: "{{ platform_service_groups.netbox.admin }}"
# NetBox config (Python) for the OIDC group->role pipeline — rendered by Ansible
# and bind-mounted into /etc/netbox/config/extra.py (netbox-docker loads it).
netbox_oidc_extra_host_path: "/etc/netbox/extra.py"

# Persistent volume (uploaded files / images).
netbox_media_volume: "netbox-media"
