---
# ==============================================================================
# Role: netbox — IPAM / source-of-truth (Docker) on lxc-nbox-01 (SVC)
# web + worker + housekeeping containers (same image). Uses the shared cluster
# PostgreSQL (postgres_db: netbox) + Redis, both over verified TLS. Fronted by
# Traefik (wildcard TLS). Upgrade = bump netbox_image tag.
# ==============================================================================
netbox_image: "netboxcommunity/netbox:v4.7.2"   # exact pin — bump deliberately (4.7 needs PostgreSQL 15+, the ltree extension, Redis 6+)
# --- Metrics (INF-33): NetBox's own /metrics (django-prometheus) on the app port; the monitoring host
# is admitted by the DOCKER-USER catalog and must be an allowed Host (ALLOWED_HOSTS carries the SVC address).
netbox_metrics_enabled: true

netbox_fqdn: "{{ platform_service_fqdns.netbox }}"

# Web HTTP backend (Traefik terminates TLS) — published on the SVC IP.
netbox_listen_ip: "{{ hostvars[groups['netbox'] | first].ansible_host }}"
netbox_host_port: 8080
netbox_container_port: 8080

# Shared PostgreSQL (DB + role created by the postgres_db role).
netbox_pg_host: "{{ platform_pg_host }}"
netbox_pg_port: 5432
netbox_pg_name: "netbox"
netbox_pg_user: "netbox"
netbox_pg_sslmode: "verify-full"          # falls back to "require" only if reported
netbox_pg_sslrootcert: "/etc/ssl/certs/ca-certificates.crt"

# Shared Redis (TLS, two logical DBs: tasks=0, cache=1).
netbox_redis_host: "{{ platform_redis_host }}"
netbox_redis_user: "netbox"                     # its own login (platform_redis_users)
netbox_redis_port: 6379
netbox_redis_tasks_db: "{{ platform_redis_databases['netbox-tasks'] }}"   # group_vars/all/redis.yml — one allocation table
netbox_redis_cache_db: "{{ platform_redis_databases['netbox-cache'] }}"

# Controller secret store.
# Vault KV paths (security/0001 secret/{env}/{service}/{key}). No controller files:
# the disk copy was a second source that nothing kept in step (#377).
netbox_vault_path: "{{ platform_env }}/netbox/admin"        # secret_key + superuser + token
netbox_redis_vault_path: "{{ platform_redis_users_vault_prefix }}/{{ netbox_redis_user }}"   # owner: roles/redis
# Outbound mail = the service's own mailbox on the platform mail server (roles/mailbox through
# the scaffold: {env}/mail/netbox → address, smtp_host, smtp_port, password), like alertmanager
# and every other service. The Resend relay it used is retired. Read-if-present: on a fresh
# platform the scaffold mints the box on this same run, the next run wires it.
netbox_mail_vault_path: "{{ platform_env }}/mail/netbox"

# Internal-only deployment toggle. NOTE: disabling the newsfeed did NOT fix the
# slow dashboard render, so the RSS feed is left ENABLED (false) per request.
netbox_isolated_deployment: false

# Initial local break-glass admin (kept alongside SSO as the break-glass login).
netbox_superuser_name: "admin"
netbox_superuser_email: "admin@{{ platform_domain }}"

# --- Authentik OIDC SSO (wired only when the client secret file exists) ---------
# python-social-auth OIDC backend. The Authentik app/provider/group are declared
# in group_vars/all/sso.yml (authentik_oidc_apps: netbox). Access = netbox-admins.
netbox_oidc_vault_path: "{{ platform_env }}/netbox/oidc"   # minted by roles/authentik
netbox_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
netbox_oidc_app_slug: "netbox"
# Members of this Authentik group become NetBox superusers (group sync from the
# OIDC `groups` claim). Login restriction to the group is enforced IdP-side
# (authentik application policy binding, restrict_to_group).
netbox_oidc_superuser_group: "{{ platform_service_groups.netbox.admin }}"
# Superusers = the active members of that group (people.yml) + the local break-glass account.
# tasks/rbac.yml reconciles the flag on every run (the login pipeline only touches the user logging in).
netbox_superusers: >-
  {{ platform_people | selectattr('state', 'equalto', 'active')
     | selectattr('groups', 'contains', netbox_oidc_superuser_group)
     | map(attribute='username') | list }}
# NetBox config (Python) for the OIDC group->role pipeline — rendered by Ansible
# and bind-mounted into /etc/netbox/config/extra.py (netbox-docker loads it).
netbox_oidc_extra_host_path: "/etc/netbox/extra.py"
netbox_scripts_dir: "/etc/netbox"              # where the former reconcile script was staged (tasks/rbac.yml removes it)
# --- Access rights through NetBox's REST API (tasks/rbac.yml) ---------------------------------
netbox_api_url: "http://{{ netbox_listen_ip }}:{{ netbox_host_port }}"
netbox_token_description: "break-glass token (Vault netbox/admin, roles/netbox)"
netbox_token_v2_prefix: "nbt_"                 # a v2 token authenticates as Bearer, a v1 token as Token
# Derived: the token Vault holds, whether NetBox accepts it, the token to work with (the one just
# provisioned, else the held one) and who must be superuser.
netbox_token_held: "{{ netbox_secrets.superuser_api_token | default('') }}"   # pragma: allowlist secret
netbox_token_scheme_held: "{{ 'Bearer' if netbox_token_held.startswith(netbox_token_v2_prefix) else 'Token' }}"
netbox_token_valid: "{{ (netbox_token_check.status | default(0)) == 200 }}"
# What NetBox returns for a provisioned token: a v2 token is a key (public id) and a token (the
# secret); the credential that authenticates is `nbt_<key>.<token>`, sent as Bearer. That whole
# string is what Vault holds. (Until 2026-10-06 only the secret half was stored: it could not
# authenticate by itself.) A v1 token is its key alone, sent as Token.
netbox_token_minted_credential: >-
  {{ (netbox_token_v2_prefix ~ netbox_token_minted.json.key ~ '.' ~ netbox_token_minted.json.token)
     if (netbox_token_minted.json.version | default(1) | int) == 2
     else (netbox_token_minted.json.key | default('')) }}
netbox_token_now: >-
  {{ netbox_token_minted_credential if (netbox_token_minted is changed)
     else (netbox_token_held if (netbox_token_valid | bool) else '') }}
netbox_token_key_now: "{{ netbox_token_now | regex_replace('^' ~ netbox_token_v2_prefix, '') | regex_replace('[.].*$', '') }}"
# Earlier break-glass tokens (same description, another key): stray credentials, removed.
netbox_tokens_stale: >-
  {{ netbox_tokens.json.results | default([]) | selectattr('description', 'eq', netbox_token_description)
     | rejectattr('key', 'eq', netbox_token_key_now) | list }}
netbox_token_scheme_now: "{{ 'Bearer' if netbox_token_now.startswith(netbox_token_v2_prefix) else 'Token' }}"
netbox_superusers_wanted: "{{ (netbox_superusers + [netbox_superuser_name]) | unique }}"
# --- The superuser flag, in NetBox's database (tasks/rbac.yml) --------------------------------
# psql as roles/postgres_db calls it on the leader, on NetBox's database; the usernames reach it
# as a psql variable, which psql quotes itself (:'wanted'). A row of the read = `username=true|false`
# (the value the flag must take).
netbox_user_table: "users_user"                # NetBox >= 4.0
netbox_superuser_psql: >-
  {{ postgres_db_psql + ['-d', netbox_pg_name, '-q', '-v', 'wanted=' ~ (netbox_superusers_wanted | join(','))] }}
netbox_superuser_sql_wanted: "(username = ANY (string_to_array(:'wanted', ',')))"
netbox_superuser_sql_read: >-
  SELECT username || '=' || {{ netbox_superuser_sql_wanted }}::text FROM {{ netbox_user_table }}
  WHERE is_superuser IS DISTINCT FROM {{ netbox_superuser_sql_wanted }} ORDER BY username;
netbox_superuser_sql_write: >-
  UPDATE {{ netbox_user_table }} SET is_superuser = {{ netbox_superuser_sql_wanted }}
  WHERE is_superuser IS DISTINCT FROM {{ netbox_superuser_sql_wanted }};
netbox_superuser_drift: "{{ netbox_superuser_read.stdout_lines | default([]) | map('trim') | select | list }}"

# The declared environment (vars/main.yml: netbox_env) is the WHOLE environment of the three
# containers: a variable removed there leaves the container at the next run. The scaffold's
# default only requires the declared variables to be present, so a removed one would stay.
netbox_container_comparisons:
  env: strict

# Persistent volume (uploaded files / images).
netbox_media_volume: "netbox-media"
