---
# ==============================================================================
# Role: host_job — ONE way to run a scheduled job on a host: a oneshot systemd
# service + timer rendered by Ansible. No script is ever deployed and no shell is
# handed a program (infra/0010 §4): each step is one ExecStart line — a command and its
# arguments — and they run in order. What a shell used to be asked for is a setting here:
# today's date (host_job_stamp), a value from a file (host_job_environment_file and
# `${NAME}` in an argument), where the output goes (host_job_stdout), whether the run
# happens at all (host_job_exec_condition), the mode of what it writes (host_job_umask).
# Retention is systemd-tmpfiles (age), never `find -delete`. A failed run reaches
# the alert mail through OnFailure= (roles/systemd_failure_alert).
# ==============================================================================
host_job_name: ""                    # REQUIRED — unit name: <name>.service / <name>.timer
host_job_description: ""
host_job_exec: []                    # REQUIRED — ExecStart lines, in order
# Commands that decide whether this run happens at all (ExecCondition=): one that exits 1-254 skips
# the run without marking the job failed — e.g. a job that only the active member of a cluster does.
host_job_exec_condition: []
host_job_on_calendar: "*-*-* 02:00:00"   # "" for a job on the monotonic schedule below only
# Monotonic schedule (a watchdog): after boot, then every interval since the last run.
host_job_on_boot_sec: ""             # e.g. "30"
host_job_on_unit_active_sec: ""      # e.g. "5min"
# Retry a failed run in place (Restart= on the oneshot). A job that retries never reaches
# "failed", so OnFailure= cannot fire: its failure must show somewhere else (a probe).
host_job_restart: ""                 # e.g. "on-failure"
host_job_restart_sec: "60"
host_job_wants_network: false       # After= + Wants=network-online.target (a job that talks to the network at boot)
host_job_randomized_delay: "0"
host_job_persistent: true            # catch up a run missed while the host was down
host_job_workdir: "/"
host_job_environment_file: ""        # e.g. a 0600 env file the caller renders
host_job_environment: {}             # plain (non-secret) Environment= pairs: {NAME: value}
host_job_timeout: "1h"
host_job_on_failure: true            # OnFailure=systemd-failure-alert@%n.service (installs the notifier)
host_job_runtime_directory: ""       # private /run/<name> for temp files, removed after each run
# The day of the run, without a shell: a companion unit (<name>-stamp.service) writes it just
# before each run and the job reads it as its environment, so `${HOST_JOB_DATE}` (YYYY-MM-DD)
# and `${HOST_JOB_DAY}` (DD) can be used in any ExecStart argument.
host_job_stamp: false
host_job_stamp_format: "HOST_JOB_DATE=%F%nHOST_JOB_DAY=%d"   # `date` format; %n = a new line
host_job_stamp_file: "/run/{{ host_job_name }}.stamp"
host_job_stdout: ""                  # e.g. "truncate:/var/backups/x/dump.sql" — the commands' output, instead of the journal
# A job in two steps, where a shell would have used a pipe: the step whose output is a file is
# one job (host_job_stdout; a unit that captures its output can only have ONE command — the file
# is opened anew, and emptied, for each), and what follows is another job that the first starts
# when it ends well. The second has no timer of its own.
# Three facts of systemd this is built for (measured on 2026-10-09): a first job that is SKIPPED
# by its host_job_exec_condition still starts its OnSuccess unit; its output file is still
# created, empty; and a command's ERROR output follows its output unless told otherwise — so the
# role sends error output to the journal whenever host_job_stdout is set (a message of the
# condition, or a warning of the command, must never end up in the file), and the second job
# states what it needs: a file that is not empty.
host_job_on_success: ""              # OnSuccess=: the unit to start when this run ends, e.g. "x-pack.service"
host_job_timer: true                 # false = started by another unit only: no timer, no schedule needed
host_job_condition_file_not_empty: ""   # ConditionFileNotEmpty=: the run is skipped, quietly, unless that file holds something
host_job_umask: ""                   # e.g. "0077" for a job whose files are private
host_job_requires_mounts_for: ""     # e.g. an NFS backup target
# systemd-tmpfiles age rules: [{path: /var/backups/x, age: 7d}] → files older are removed
host_job_retention: []
# The cron job + script this replaces: cron removed, script archived beside it.
host_job_legacy_cron: ""
host_job_legacy_script: ""
