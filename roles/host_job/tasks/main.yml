---
- name: "host_job | Required inputs"
  ansible.builtin.assert:
    that:
      - host_job_name | length > 0
      - host_job_exec | length > 0
      - >-
        not (host_job_timer | bool)
        or (host_job_on_calendar | length > 0) or (host_job_on_boot_sec | length > 0) or (host_job_on_unit_active_sec | length > 0)
      - not (host_job_stdout | length > 0 and host_job_exec | length > 1)
    fail_msg: >-
      host_job needs host_job_name, host_job_exec and — unless host_job_timer is false — a schedule
      (OnCalendar or a monotonic one); with host_job_stdout it takes exactly one command
    quiet: true

- name: "host_job | The failure notifier (OnFailure= target)"
  ansible.builtin.include_role:
    name: systemd_failure_alert
  when: host_job_on_failure | bool

# OnFailure now lives in the unit itself; a drop-in from the old attach step would repeat it.
- name: "host_job | Old OnFailure drop-in (superseded)"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ host_job_name }}.service.d/onfailure.conf"
    state: absent
  register: host_job_old_dropin

- name: "host_job | Service + timer — {{ host_job_name }}"
  ansible.builtin.template:
    src: "job.{{ item }}.j2"
    dest: "/etc/systemd/system/{{ host_job_name }}.{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['service', 'timer'] if host_job_timer | bool else ['service'] }}"
  register: host_job_units

- name: "host_job | No timer for a unit another one starts — {{ host_job_name }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ host_job_name }}.timer"
    state: absent
  register: host_job_timer_gone
  when: not (host_job_timer | bool)

# The companion unit that tells the job the day of its run (host_job_stamp); gone where a job
# does not ask for it.
- name: "host_job | Date of the run — {{ host_job_name }}"
  ansible.builtin.template:
    src: stamp.service.j2
    dest: "/etc/systemd/system/{{ host_job_name }}-stamp.service"
    owner: root
    group: root
    mode: "0644"
  register: host_job_stamp_unit
  when: host_job_stamp | bool

- name: "host_job | No date unit where the job asks for none — {{ host_job_name }}"
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ host_job_name }}-stamp.service"
    state: absent
  register: host_job_stamp_gone
  when: not (host_job_stamp | bool)

- name: "host_job | Retention (systemd-tmpfiles) — {{ host_job_name }}"
  ansible.builtin.template:
    src: tmpfiles.conf.j2
    dest: "/etc/tmpfiles.d/{{ host_job_name }}.conf"
    owner: root
    group: root
    mode: "0644"
  when: host_job_retention | length > 0

- name: "host_job | Reload systemd"
  ansible.builtin.systemd_service:
    daemon_reload: true
  when: >-
    (host_job_units is changed) or (host_job_old_dropin is changed)
    or (host_job_stamp_unit is changed) or (host_job_stamp_gone is changed)
    or (host_job_timer_gone is changed)

- name: "host_job | Timer enabled + running — {{ host_job_name }}"
  ansible.builtin.systemd_service:
    name: "{{ host_job_name }}.timer"
    enabled: true
    state: started
  # --check never wrote a NEW unit, so there is nothing to start yet.
  when:
    - host_job_timer | bool
    - not ansible_check_mode or (host_job_units is not changed)

- name: "host_job | Remove the old cron job"
  ansible.builtin.cron:
    name: "{{ host_job_legacy_cron }}"
    cron_file: "{{ host_job_legacy_cron }}"
    state: absent
  when: host_job_legacy_cron | length > 0

# The unit's inline command replaced it; git holds its history — no copy stays.
- name: "host_job | The old script (and the copy an earlier run archived)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ host_job_legacy_script }}"
    - "{{ host_job_legacy_script }}.retired"
  when: host_job_legacy_script | length > 0
