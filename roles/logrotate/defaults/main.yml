---
# ==============================================================================
# Role: logrotate — generic log-rotation concern-role (present/absent).
# One entry = one /etc/logrotate.d/<name> file. Compose from any service role:
#
#   - include_role: {name: logrotate}
#     vars:
#       logrotate_entries:
#         - name: myservice
#           paths: ["/var/log/myservice/*.log"]
#           rotate: 14            # keep N rotations (default 14)
#           frequency: daily      # daily|weekly|monthly (default daily)
#           copytruncate: false   # true when the daemon can't reopen its log
#           postrotate: ""        # e.g. "systemctl kill -s USR1 svc.service"
#           state: present        # absent -> remove the file
# ==============================================================================
logrotate_entries: []
