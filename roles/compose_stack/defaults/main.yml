---
# ==============================================================================
# Role: compose_stack — bring ONE vendor-shipped Compose project up, the same way
# everywhere. For real multi-service stacks the vendor ships as compose (Harbor,
# Jitsi, ONLYOFFICE, the Nextcloud collab backends); one or two containers use
# community.docker.docker_container directly instead.
#
# The engine and the Compose v2 CLI are NOT installed here: roles/docker owns them
# (docker_engine from the inventory). The service's own readiness check stays in
# the service role — what "healthy" means differs per stack.
# ==============================================================================
compose_stack_dir: ""                 # REQUIRED — directory holding docker-compose.yml
compose_stack_pull: "missing"         # images are pinned in the compose file: pull only what is absent
compose_stack_remove_orphans: true
compose_stack_env_files: []           # e.g. mailcow-style interpolation files
compose_stack_state: present          # absent = stop the project: containers go, volumes stay
compose_stack_environment: {}         # environment for the compose CLI (e.g. COMPOSE_HTTP_TIMEOUT)
compose_stack_recreate: auto          # always = recreate even when Compose sees no change (a bind-mounted file changed)

# The repair of a container left without a network: the label that ties a container to its
# project, what is read of each running container, and the network modes that have no
# network of their own by design.
compose_stack_project_label: "com.docker.compose.project.working_dir"
compose_stack_inspect_format: "{% raw %}{{ index .Config.Labels \"com.docker.compose.service\" }} {{ .HostConfig.NetworkMode }} {{ len .NetworkSettings.Networks }}{% endraw %}"
compose_stack_no_network_modes: ["host", "none"]
