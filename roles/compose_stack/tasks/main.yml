---
- name: "Compose stack | A project directory is required"
  ansible.builtin.assert:
    that: compose_stack_dir | length > 0
    fail_msg: "compose_stack needs compose_stack_dir (the directory with docker-compose.yml)"
    quiet: true

# docker_compose_v2 reports changed only when a container was created, started or
# recreated — no guessing from the CLI's stderr text.
- name: "Compose stack | Up — {{ compose_stack_dir }}"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_stack_dir }}"
    state: present
    pull: "{{ compose_stack_pull }}"
    remove_orphans: "{{ compose_stack_remove_orphans | bool }}"
    env_files: "{{ compose_stack_env_files if compose_stack_env_files | length > 0 else omit }}"
    recreate: "{{ compose_stack_recreate }}"
  environment: "{{ compose_stack_environment }}"
  register: compose_stack_result
  when: compose_stack_state == 'present'

# A container whose port could not be published once (the port was taken) is left by Docker
# WITHOUT a network: a later start brings it "Up" but detached — no address, no published port
# (2026-10-03: mailcow's Postfix after a host daemon had held port 25). Compose sees no change and
# does not repair it, so the stack owner does: a running container of this project whose network
# mode names a network but which is attached to none is recreated.
- name: "Compose stack | Running containers of the project without a network attachment — {{ compose_stack_dir }}"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -o pipefail
      ids=$(docker ps -q --filter "label=com.docker.compose.project.working_dir={{ compose_stack_dir }}")
      [ -z "$ids" ] && exit 0
      docker inspect $ids --format '{{ "{{" }} index .Config.Labels "com.docker.compose.service" {{ "}}" }} {{ "{{" }} .HostConfig.NetworkMode {{ "}}" }} {{ "{{" }} len .NetworkSettings.Networks {{ "}}" }}' \
        | awk '$3 == 0 && $2 != "host" && $2 != "none" && $2 !~ /^(container|service):/ {print $1}'
  register: compose_stack_detached
  changed_when: false
  check_mode: false   # read-only probe
  when: compose_stack_state == 'present'

- name: "Compose stack | Recreate the detached containers — {{ compose_stack_dir }}"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_stack_dir }}"
    state: present
    services: "{{ compose_stack_detached.stdout_lines }}"
    recreate: always
    env_files: "{{ compose_stack_env_files if compose_stack_env_files | length > 0 else omit }}"
  environment: "{{ compose_stack_environment }}"
  when:
    - compose_stack_state == 'present'
    - compose_stack_detached.stdout_lines | default([]) | length > 0

# Absent: stop the project if there is one. Volumes stay (archive-before-destroy);
# a directory without a compose file means there is nothing left to stop.
- name: "Compose stack | Is there a project? — {{ compose_stack_dir }}"
  ansible.builtin.stat:
    path: "{{ compose_stack_dir }}/docker-compose.yml"
  register: compose_stack_file
  when: compose_stack_state == 'absent'

- name: "Compose stack | Down, volumes kept — {{ compose_stack_dir }}"
  community.docker.docker_compose_v2:
    project_src: "{{ compose_stack_dir }}"
    state: absent
  when:
    - compose_stack_state == 'absent'
    - compose_stack_file.stat.exists
