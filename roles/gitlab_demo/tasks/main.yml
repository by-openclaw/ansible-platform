---
# ==============================================================================
# gitlab_demo | create the demo project + seed its files (idempotent).
# ==============================================================================
- name: "Demo | The pre-container staging paths (retired)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop: [/opt/gitlab-demo, /opt/gitlab-demo-seed.rb]

- name: "Demo | Stage the demo app files on the GitLab host"
  ansible.builtin.copy:
    src: demo/
    dest: "{{ gitlab_scripts_dir }}/demo/"   # mounted into the GitLab container
    owner: root
    group: root
    mode: "0644"
    directory_mode: "0755"

- name: "Demo | Stage the seeder"
  ansible.builtin.copy:
    src: seed.rb
    dest: "{{ gitlab_scripts_dir }}/demo-seed.rb"
    owner: root
    group: root
    mode: "0644"

- name: "Demo | Create the project + commit files (triggers the pipeline)"
  ansible.builtin.command:
    argv: >-
      {{ gitlab_exec + ['-e', 'PLATFORM_DOMAIN', gitlab_container, 'gitlab-rails', 'runner',
         gitlab_scripts_dir ~ '/demo-seed.rb', gitlab_scripts_dir ~ '/demo', gitlab_demo_path, gitlab_demo_name] }}
  environment:
    PLATFORM_DOMAIN: "{{ platform_domain }}"
  register: gitlab_demo_run
  changed_when: >-
    gitlab_demo_run.stdout is search('(commit|project|deploytoken|variable)[+~]')
  failed_when: "'DEMO_DONE' not in gitlab_demo_run.stdout"

- name: "Demo | Result"
  ansible.builtin.debug:
    msg: "{{ gitlab_demo_run.stdout_lines }}"
