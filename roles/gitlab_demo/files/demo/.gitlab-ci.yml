# BY-SYSTEMS demo pipeline: build an image with Kaniko (rootless, no privileged
# daemon) → push to THIS project's container registry using the CI job token, then
# publish a GitLab Pages site. Runs on the linux+kaniko runner (VM-isolated).
# Platform CI templates (platform/infra/ci-templates, pushed by roles/gitlab_rbac):
# security-scan = Semgrep SAST + Syft SBOM + Trivy fs (vuln/secret/misconfig), artifacts kept.
include:
  - project: platform/infra/ci-templates
    ref: main
    file: security-scan.gitlab-ci.yml

stages:
  - security
  - build
  - deploy
  - pages

# --- Build + push a container image with Kaniko -------------------------------
kaniko-build:
  stage: build
  tags: [kaniko]
  image:
    # gcr.io (not Docker Hub) → no Docker Hub rate limit for the executor itself.
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script:
    # Kaniko authenticates to the GitLab registry with the per-job token — no
    # shared/long-lived credential is ever stored (CI_JOB_TOKEN, scoped to this job).
    - mkdir -p /kaniko/.docker
    - auth=$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')
    - printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$auth" > /kaniko/.docker/config.json
  script:
    - /kaniko/executor
      --context "$CI_PROJECT_DIR"
      --dockerfile "$CI_PROJECT_DIR/Dockerfile"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# --- Publish the static docs site (dokuwiki-style) via GitLab Pages -----------
pages:
  stage: pages
  tags: [linux]
  image: alpine:3.24
  script:
    - echo "Publishing GitLab Pages from public/"
    - ls -la public
  artifacts:
    paths:
      - public

# Deploy to the k3s application platform (roles/k3s): namespace-scoped kubeconfig from the
# project variable KUBECONFIG_B64, image pulled with the k3s-pull deploy token, published as
# demo.<domain> through the platform Traefik (TLS + SSO).
deploy-k3s:
  stage: deploy
  tags: [linux]
  image:
    name: alpine/k8s:1.37.0     # kubectl + helm on alpine (bitnami tags are no longer published); minor matches the k3s server
    entrypoint: [""]
  variables:
    APP_HOST: demo.$PLATFORM_DOMAIN
  before_script:
    - mkdir -p ~/.kube && echo "$KUBECONFIG_B64" | base64 -d > ~/.kube/config && chmod 600 ~/.kube/config
  script:
    - >-
      kubectl create secret docker-registry gitlab-registry --docker-server="$CI_REGISTRY"
      --docker-username="$K8S_PULL_USER" --docker-password="$K8S_PULL_TOKEN" --dry-run=client -o yaml
      | kubectl apply -f -
    - sed -i "s|IMAGE_PLACEHOLDER|$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA|; s|HOST_PLACEHOLDER|$APP_HOST|" k8s/deployment.yaml k8s/ingress.yaml
    - kubectl apply -k k8s/
    - kubectl rollout status deployment/demo --timeout=120s
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
