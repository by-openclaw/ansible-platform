---
# ==============================================================================
# Role: vault_tidy — one document per secret.
# A document, or a field of a document, that nothing reads any more is retired here, by data:
#   - a retired DOCUMENT is archived (copied under archive/, the copy read back, then the
#     original removed — the routine of roles/service_decommission);
#   - a retired FIELD is removed from its document (the previous version of the document stays
#     in the store's own version history).
# Each entry may name where the SAME value lives now (`same_as`): the run then refuses to retire
# anything whose value differs from that owner — the last copy of a secret is never removed.
# Declared per environment in the inventory. A run with nothing left to retire changes nothing.
# ==============================================================================
vault_tidy_env: "{{ platform_env }}"
vault_tidy_host: "{{ platform_vault_host | default(groups['vault'] | first) }}"
vault_tidy_kv_url: "{{ platform_vault_addr }}/v1/{{ vault_kv_path | default('secret') }}"
vault_tidy_timeout: "{{ vault_api_timeout | default(15) }}"

# [{path: "<service>/<document>", reason: "...", same_as: [{field: f, path: "<service>/<document>", field_there: g}]}]
vault_tidy_retired_documents: "{{ platform_vault_retired_documents | default([]) }}"
# [{path: "<service>/<document>", fields: [f, ...], reason: "...", same_as: [{field: f, path: "...", field_there: g}]}]
vault_tidy_retired_fields: "{{ platform_vault_retired_fields | default([]) }}"
# [{path: "<service>/<document>", reason: "..."}] — brought back from archive/ to its live place
# (a document must not be listed both here and among the retired ones).
vault_tidy_restored_documents: "{{ platform_vault_restored_documents | default([]) }}"
# [{from: "<service>/<document>", to: "<service>/<document>", reason: "..."}] — first half of a
# rename: `to` is written from `from` when absent (both must be equal when both exist). The old
# path is then listed among the retired documents, with `same_as` pointing to the new one.
vault_tidy_copied_documents: "{{ platform_vault_copied_documents | default([]) }}"
