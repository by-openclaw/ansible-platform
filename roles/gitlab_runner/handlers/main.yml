---
- name: Restart gitlab-runner
  ansible.builtin.systemd_service:
    name: gitlab-runner
    state: restarted

- name: Update grub
  ansible.builtin.command: update-grub
  changed_when: true

- name: Reload sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Flush journald
  ansible.builtin.command: journalctl --flush
  changed_when: true
