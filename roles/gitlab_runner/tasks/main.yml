---
# ==============================================================================
# GitLab CI runner (Docker executor) — install + register to lxc-gitlab-01.
# Idempotent: the auth token is minted ONCE on the GitLab server and reused;
# config.toml is templated declaratively (no repeated `gitlab-runner register`).
# ==============================================================================

# --- 1. Runner authentication token (GitLab 17+ instance runner) — Vault store --
- name: "Runner | The auth token from Vault (optional: absent until first minted)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_runner_token_vault_path }}"
    vault_secret_optional: true

- name: "Runner | Stored token (empty = mint one)"
  ansible.builtin.set_fact:
    gitlab_runner_token_stored: "{{ vault_secret_result.token | default('') }}"
  no_log: true

- name: "Runner | Mint an instance runner + token on the GitLab server (first run)"
  ansible.builtin.command:
    # gitlab-rails in the GitLab container (gitlab_exec, group_vars/all/gitlab.yml); the Ruby is
    # one argv element, so no shell parses it.
    argv: "{{ gitlab_exec + [gitlab_container, 'gitlab-rails', 'runner', gitlab_runner_mint_rb] }}"
  vars:
    gitlab_runner_mint_rb: >-
      r = Ci::Runner.create!(runner_type: 'instance_type',
      description: '{{ gitlab_runner_description }}',
      tag_list: %w[{{ gitlab_runner_tags | join(' ') }}],
      run_untagged: {{ gitlab_runner_run_untagged | lower }});
      puts r.token
  delegate_to: "{{ gitlab_runner_gitlab_host }}"
  become: true
  register: gitlab_runner_mint
  changed_when: true
  no_log: true
  when: gitlab_runner_token_stored | length == 0

- name: "Runner | Store the minted auth token in Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ gitlab_runner_token_vault_path }}"
    vault_secret_init: { token: "{{ gitlab_runner_mint.stdout_lines | select('match', '^glrt') | first }}" }
  when: gitlab_runner_token_stored | length == 0 and gitlab_runner_mint.stdout_lines is defined

- name: "Runner | Resolve the auth token (Vault)"
  ansible.builtin.set_fact:
    gitlab_runner_token: >-
      {{ gitlab_runner_token_stored
         if (gitlab_runner_token_stored | length > 0)
         else (gitlab_runner_mint.stdout_lines | default([]) | select('match', '^glrt') | first | default('')) }}
  no_log: true

# --- 2. The runner is a container (the platform runs services as containers) ----
# The engine is roles/docker, composed by playbooks/gitlab-runner.yml. The native
# package of the first install stops first: two runners with the same token would both
# take jobs. Its config dir and system id stay — the container mounts them, so GitLab
# sees the same runner.
- name: "Runner | Services on this host"
  ansible.builtin.service_facts:

- name: "Runner | The native gitlab-runner service stops (retired)"
  ansible.builtin.systemd_service:
    name: gitlab-runner
    state: stopped
    enabled: false
  when: "'gitlab-runner.service' in ansible_facts.services"

- name: "Runner | The native package and its apt source (retired)"
  ansible.builtin.apt:
    name: gitlab-runner
    state: absent

- name: "Runner | Its apt source and signing key (retired)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/gitlab-runner.list
    - /etc/apt/keyrings/gitlab-runner.asc

- name: "Runner | Config directory"
  ansible.builtin.file:
    path: /etc/gitlab-runner
    state: directory
    owner: root
    group: root
    mode: "0700"

# --- 3. config.toml (declarative; no repeated register) -----------------------
- name: "Runner | Render /etc/gitlab-runner/config.toml"
  ansible.builtin.template:
    src: config.toml.j2
    dest: /etc/gitlab-runner/config.toml
    owner: root
    group: root
    mode: "0600"
  register: gitlab_runner_config

# --- 4. The runner container + verify it registered/online ---------------------
- name: "Runner | The runner container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: gitlab-runner
      containers:
        - name: gitlab-runner
          image: "{{ gitlab_runner_image }}"
          published:
            - "{{ hostvars[inventory_hostname].ansible_host }}:{{ gitlab_runner_metrics_port }}:{{ gitlab_runner_metrics_port }}"   # /metrics (INF-33)
          log_driver: journald   # container log -> journal -> promtail -> Loki (INF-27); job traces live in GitLab
          volumes:
            - /etc/gitlab-runner:/etc/gitlab-runner
            - /var/run/docker.sock:/var/run/docker.sock   # the docker executor runs jobs on this host's engine
          restart: "{{ gitlab_runner_config.changed | default(false) }}"   # the runner re-reads config.toml, a restart is certain

- name: "Runner | Verify the runner is registered/verified against GitLab"
  ansible.builtin.command: docker exec gitlab-runner gitlab-runner verify
  register: gitlab_runner_verify
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when:
    - "'is alive' not in gitlab_runner_verify.stdout and 'Verifying' not in gitlab_runner_verify.stdout and gitlab_runner_verify.rc != 0"
    # a dry-run of the switch-over: the container it would create does not exist yet
    - not (ansible_check_mode and 'No such container' in (gitlab_runner_verify.stderr | default('')))

# --- 5. Image hygiene (roles/host_job) ------------------------------------------
- name: "Runner | Weekly prune of unused job images (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: docker-image-prune
    host_job_description: "Prune job images unused for {{ gitlab_runner_image_prune_age }} (the executor pulls every run)"
    host_job_exec:
      - "/usr/bin/docker image prune -af --filter until={{ gitlab_runner_image_prune_age }}"
    host_job_on_calendar: "{{ gitlab_runner_image_prune_on_calendar }}"
    host_job_timeout: 30m
  when: gitlab_runner_image_prune_enabled | bool
