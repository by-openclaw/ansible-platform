---
# ==============================================================================
# Role: gitlab_runner — a GitLab CI runner (Docker executor) on an isolated VM.
# CI runs untrusted code → VM isolation (never an LXC). Images are built with
# Kaniko (rootless, no privileged daemon); jobs run in clean containers.
#
# Registration uses the GitLab 17+ model: an INSTANCE runner is created on the
# GitLab server's API (roles/gitlab_api) which mints an authentication token (glrt-…); the
# runner registers with that token. The token is persisted to the controller
# secret store so re-runs are idempotent (no duplicate runners).
# ==============================================================================

# --- GitLab target ------------------------------------------------------------
gitlab_runner_gitlab_url: "https://{{ platform_service_fqdns.gitlab }}"
gitlab_runner_gitlab_host: "{{ groups['gitlab'] | first }}"          # inventory host to mint the token on
gitlab_runner_description: "linux-kaniko"
gitlab_runner_tags: ["linux", "docker", "kaniko"]
gitlab_runner_run_untagged: true                     # also pick up untagged jobs (the default lane)

# Auth token (glrt-…). Minted once on the GitLab server, stored in Vault, reused
# after (no local file). Vault IS the store.
gitlab_runner_token_vault_path: "{{ platform_env }}/gitlab/runner-token"

# --- Version pins (NEVER unpinned / :latest) ----------------------------------
# renovate: datasource=docker depName=gitlab/gitlab-runner
gitlab_runner_image: "gitlab/gitlab-runner:v19.4.1"   # exact pin; tracks the GitLab minor (19.4.x)
# --- Metrics (INF-33): the runner's Prometheus listener, published on the SVC address for the
# monitoring host (catalog metrics_port; DOCKER-USER rule from `monitoring`).
gitlab_runner_metrics_port: 9252
# --- Image hygiene: the executor pulls job images every run (pull_policy always) and never removes
# them; a weekly prune of images unused for this long keeps the disk from filling (roles/host_job).
gitlab_runner_image_prune_enabled: true
gitlab_runner_image_prune_age: "168h"
gitlab_runner_image_prune_on_calendar: "Sun *-*-* 04:00:00"

# --- Executor / config.toml ---------------------------------------------------
gitlab_runner_concurrent: 4
gitlab_runner_executor: "docker"
# Default job image + the image Kaniko runs as (executor pulls via Dependency Proxy).
gitlab_runner_default_image: "debian:12-slim"
# Kaniko does NOT need privileged mode (that's the whole point vs dind). Keep false.
gitlab_runner_docker_privileged: false
gitlab_runner_docker_volumes:
  - "/certs/client"                                  # noop w/o dind; harmless
  - "/cache"
gitlab_runner_docker_network_mtu: 0

# Pull-through for Docker Hub base images (avoids rate limits; no Docker Hub creds).
# Kaniko/jobs reference the GitLab Dependency Proxy instead of docker.io.
gitlab_runner_dependency_proxy: "{{ platform_service_fqdns.gitlab_registry }}"
