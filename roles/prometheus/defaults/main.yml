---
# Prometheus — metrics TSDB + scraper on lxc-monitoring-01. A container (the pinned
# official image, host network, loopback listen), config in /etc/prometheus, the TSDB in
# /var/lib/prometheus/metrics2 — the Debian package's layout, kept.
# renovate: datasource=docker depName=prom/prometheus
prometheus_version: "v3.13.4"   # the 3.13 LTS line (2.53 LTS ended); the 2.x TSDB is read as is, the config and rules are unchanged
prometheus_image: "prom/prometheus:{{ prometheus_version }}"
prometheus_container: prometheus
prometheus_config_dir: /etc/prometheus
prometheus_data_dir: /var/lib/prometheus/metrics2
# The account prometheus, alertmanager and blackbox run as (owns the TSDB; the configs are
# readable by its group). This role creates it; the other two read it.
prometheus_account: prometheus
# The retired native install (removed once the container answers; never purged — the
# package's purge deletes the TSDB).
prometheus_native:
  units: [prometheus]
  packages: [prometheus]
  files: [/etc/default/prometheus]
prometheus_port: 9090
# Local TSDB kept small (metrics TSDB must be local — POSIX/locking, not S3/NFS).
# Long-term/S3 metrics = a future Thanos/Mimir sidecar (remote-write). 15d is plenty
# for operational dashboards + keeps the LXC disk light.
prometheus_retention: "15d"
prometheus_scrape_interval: "30s"
prometheus_node_exporter_port: 9100
# Inventory groups whose hosts run node-exporter (scraped on :9100). Deduped.
prometheus_node_groups:
  - cluster
  - adguard
  - mailcow
  - pbs
  - monitoring
  - gitlab_runner          # the CI runner VM (not in cluster)
  - proxmox_nodes          # the hypervisor (roles/pve_host opens 9100 to the monitoring hosts)
# Per-container metrics (roles/cadvisor) on every Docker host
prometheus_cadvisor_group: docker_hosts
prometheus_cadvisor_port: 9180
# Application metrics (INF-33): every catalog row with `metrics` in its monitoring list and a
# metrics_port is scraped as job <name> on its host — the catalog is the one list.
prometheus_app_metrics: "{{ platform_services | selectattr('metrics_port', 'defined') | list }}"

# --- The pacemaker rule (owner direction 2026-10-03) --------------------------------------------
# Prometheus keeps the series that say whether the platform is alive and why not — not everything
# an exporter can emit. On 2026-10-03 the TSDB held 244,000 series, 94 % of them from three jobs
# (node 53 %, gitlab 24 %, cadvisor 16 %) while the alert rules read ten families and no
# dashboard read the rest. A job named here KEEPS the families listed (anchored on the metric
# name) and drops everything else at scrape time; a job not named keeps what it scrapes.
# A rule or a dashboard that needs another family adds it here in the same change.
prometheus_keep:
  node:
    - "node_(uname|os|exporter_build)_info"
    - "node_(boot_time|time)_seconds"
    - "node_load(1|5|15)"
    - "node_memory_(MemTotal|MemAvailable|MemFree|Buffers|Cached|SwapTotal|SwapFree)_bytes"
    - "node_cpu_seconds_total"
    - "node_filesystem_(avail_bytes|size_bytes|free_bytes|files|files_free|readonly|device_error)"
    - "node_network_(receive|transmit)_(bytes|errs|drop)_total"
    - "node_network_up"
    - "node_disk_(read_bytes|written_bytes|io_time_seconds)_total"
    - "node_systemd_unit_state"            # failed units only — see prometheus_drop
    - "node_zfs_zpool_state"               # the ZfsPoolNotOnline rule
    - "node_pressure_.*"
    - "node_vmstat_oom_kill"
    - "node_nf_conntrack_entries(_limit)?"
    - "node_filefd_(allocated|maximum)"
    - "node_procs_(running|blocked)"
    - "node_timex_(offset_seconds|sync_status)"
    - "node_hwmon_temp_celsius"
    - "node_textfile_.*"
    - "platform_backup_.*"                 # the backup signal the node writes (roles/pve_host) — the Backup* rules
  cadvisor:
    - "container_(start_time_seconds|last_seen)"
    - "container_memory_(working_set|usage)_bytes"
    - "container_spec_memory_limit_bytes"
    - "container_cpu_usage_seconds_total"
    - "container_network_(receive|transmit)_bytes_total"
    - "container_oom_events_total"
    - "cadvisor_version_info"
    - "machine_(cpu_cores|memory_bytes)"
  gitlab:
    - "gitlab_(build|version)_info"
    - "puma_(workers|running|max_threads|pool_capacity|active_connections|queued_connections)"
    - "sidekiq_(running_jobs|concurrency|queue_size|queue_latency_seconds)"
    - "gitlab_database_connection_pool_(size|busy|dead|waiting)"
    - "gitlab_ci_pending_builds"
    - "process_(start_time_seconds|resident_memory_bytes)"
  dbproxy:                                 # the data endpoint: is exactly one member routed to?
    - "haproxy_backend_active_servers"
    - "haproxy_server_status"
    - "haproxy_process_build_info"
  monitoring:
    - ".*_build_info"
    - "alertmanager_alerts"
    - "alertmanager_notifications(_failed)?_total"
    - "alertmanager_config_last_reload_successful"
    - "loki_ingester_memory_streams"
    - "loki_distributor_(bytes|lines)_received_total"
    - "grafana_stat_.*"
    - "process_(start_time_seconds|resident_memory_bytes)"
# Label-level drops applied after the keep (source labels joined by ';').
prometheus_drop:
  node:
    - {labels: [__name__, state], regex: "node_systemd_unit_state;(activating|active|deactivating|inactive)"}
# Shared PostgreSQL metrics (roles/postgres_exporter on the database host): saturation of the
# cluster every service depends on. 2026-09-22 showed the symptom (500s everywhere) long before
# anyone could see the cause.
prometheus_postgres_exporter_port: 9187
prometheus_postgres_exporter_hosts: "{{ platform_pg_members | default(groups['postgresql'] | default([])) }}"
# The Backup* rules (platform-backup group). A guest is backed up nightly by each job, so
# its newest backup is at most a day old plus the length of the job: older = a missed night.
prometheus_backup_max_age_hours: 30
# The container that replicates the object store to the offsite bucket (the third copy).
prometheus_offsite_replica_container: "{{ seaweedfs_backup_container }}"
prometheus_seaweedfs_hosts: "{{ groups['seaweedfs'] | default([]) }}"
prometheus_seaweedfs_metrics_port: "{{ platform_seaweedfs_metrics_port }}"
# Bind to localhost only — Grafana is co-located and Traefik/edge (if any) fronts it.
prometheus_listen: "127.0.0.1"

# --- Alerting + synthetic probes (blackbox_exporter role on the same host) --------------
prometheus_alertmanager_url: "127.0.0.1:9093"
prometheus_rules_dir: "/etc/prometheus/rules"
prometheus_blackbox_url: "127.0.0.1:9115"
# HTTPS targets FOLLOW THE ROUTES: the live Traefik host list is read at play time
# (every Host() rule under the dynamic dir) so a new service is probed the moment
# it is published. Deep health paths and exclusions are declared here.
prometheus_traefik_host: "{{ groups['traefik'] | first }}"
prometheus_traefik_dynamic_dir: "/etc/traefik/dynamic"
# Names that cannot be probed from inside: ca.<domain> has no internal record (VPN-only name)
# and vpn.<domain> resolves to the WAN address (no NAT reflection). Their daemons are probed
# on TCP below; external reachability is the status page's job.
prometheus_blackbox_http_exclude:
  - "{{ platform_service_fqdns.netbird }}"
  - "{{ platform_service_fqdns['step-ca'] }}"        # no page at /, the API answers 404; its /health is probed explicitly below
# Per-host URL override when the internal path differs from the public one (split-DNS sends
# mail.<domain> straight to the mail server, which serves HTTPS on 8443, not 443).
# (a list, not a dict: Ansible does not template dict KEYS, so "mail.{{ domain }}" as a key never matched)
prometheus_blackbox_http_overrides:
  - { host: "{{ platform_service_fqdns.mailcow }}", url: "https://{{ platform_service_fqdns.mailcow }}:8443/" }
  # 503 while sealed; the UI at / answers 200 either way. A Vault that stays sealed is how
  # the warden watchdog (roles/warden) failing shows.
  - { host: "{{ platform_service_fqdns.vault }}", url: "https://{{ platform_service_fqdns.vault }}/v1/sys/health" }
prometheus_blackbox_http_extra:
  - "https://{{ platform_service_fqdns.nextcloud }}/status.php"
  - "https://{{ platform_service_fqdns.nextcloud }}/standalone-signaling/api/v1/welcome"
  - "https://{{ platform_service_fqdns.nextcloud }}/recording/api/v1/welcome"
  - "https://{{ platform_service_fqdns.collab }}/healthcheck"
  - "https://{{ platform_service_fqdns['step-ca'] }}/health"
# Every member of a clustered service on its own address (the route only says that ONE member
# answers): a Vault node answers 200 here when it is unsealed, active or standby.
prometheus_blackbox_http_members: >-
  {{ platform_vault_members | default([]) | map('regex_replace', '$', '.' ~ platform_domain ~ ':8200/v1/sys/health?standbyok=true&perfstandbyok=true')
     | map('regex_replace', '^', 'https://') | list }}
# The platform resolver on both families (the 2026-09-18 outage, #424)
prometheus_resolver_host: "{{ groups['adguard'] | first }}"
prometheus_blackbox_dns_v4: ["{{ hostvars[prometheus_resolver_host].ansible_host }}:53"]
prometheus_blackbox_dns_v6: ["[{{ hostvars[prometheus_resolver_host].platform_host_v6 }}]:53"]
# Plain TCP listeners (Talk TURN on the collab host)
# Each entry is the host's inventory GROUP and the port — the address comes from the
# inventory, so a rebuilt or readdressed service stays monitored without editing this list.
prometheus_blackbox_tcp_targets:
  - {group: k3s,      port: 6443,  what: "k3s API server (application platform)"}
  - {group: collab,   port: 3478,  what: "Talk TURN listener"}
  - {group: step_ca,  port: 9000,  what: "step-ca (HTTPS probe once its root is trusted, A.4)"}
  - {group: netbird,  port: 33073, what: "NetBird management (public name is WAN-only from inside)"}
prometheus_blackbox_tcp: >-
  {%- set out = [] -%}
  {%- for t in prometheus_blackbox_tcp_targets -%}
    {%- for h in groups.get(t.group, []) -%}
      {%- set _ = out.append(hostvars[h].ansible_host ~ ':' ~ t.port) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# TLS listeners — also yields the certificate expiry (mail-port wildcard expired unseen on 2026-09-17)
prometheus_blackbox_tcp_tls: ["{{ groups['mailcow'] | first }}.{{ platform_domain }}:993"]
prometheus_blackbox_smtp_starttls:
  - "{{ groups['mailcow'] | first }}.{{ platform_domain }}:587"
  - "{{ groups['mailcow'] | first }}.{{ platform_domain }}:25"
# ICMP: gateways + the resolver
# The two zone gateways and the resolver — all three from their own source, never typed.
prometheus_blackbox_icmp:
  - "{{ platform_zones.svc.gw4 }}"
  - "{{ platform_zones.dmz.gw4 }}"
  - "{{ hostvars[prometheus_resolver_host].ansible_host }}"
# Alert thresholds
prometheus_alert_probe_for: "2m"
prometheus_alert_resolver_for: "1m"
prometheus_alert_cert_warn_days: 14
prometheus_alert_cert_crit_days: 5
prometheus_alert_disk_free_ratio: 0.10
# SeaweedFS writes fail (HTTP 500) once no volume slot is free — 2026-09-28 cost 9
# guests' PBS backups while the disk still had 76 GB free.
prometheus_alert_seaweedfs_free_slots: 30
prometheus_alert_mem_free_ratio: 0.05
prometheus_alert_pg_conn_warn_ratio: 0.80    # backends / max_connections
prometheus_alert_pg_conn_crit_ratio: 0.95

# --- The stack's own metrics (INF-33 for the monitoring service): every component serves
# /metrics on its loopback listener on this host; scraped as job `monitoring`.
prometheus_self_targets:
  - name: alertmanager
    target: "127.0.0.1:9093"
  - name: loki
    target: "127.0.0.1:3100"
  - name: grafana
    target: "127.0.0.1:3000"
  - name: blackbox_exporter
    target: "127.0.0.1:9115"
