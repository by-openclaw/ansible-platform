---
# Prometheus — metrics TSDB + scraper on lxc-monitoring-01. Debian package
# (systemd), config in /etc/prometheus, ARGS in /etc/default/prometheus.
prometheus_port: 9090
# Local TSDB kept small (metrics TSDB must be local — POSIX/locking, not S3/NFS).
# Long-term/S3 metrics = a future Thanos/Mimir sidecar (remote-write). 15d is plenty
# for operational dashboards + keeps the LXC disk light.
prometheus_retention: "15d"
prometheus_scrape_interval: "30s"
prometheus_node_exporter_port: 9100
# Inventory groups whose hosts run node-exporter (scraped on :9100). Deduped.
prometheus_node_groups:
  - cluster
  - adguard
  - mailcow
  - pbs
  - monitoring
  - gitlab_runner          # the CI runner VM (not in cluster)
  - proxmox_nodes          # the hypervisor (roles/pve_host opens 9100 to the monitoring hosts)
# Per-container metrics (roles/cadvisor) on every Docker host
prometheus_cadvisor_group: docker_hosts
prometheus_cadvisor_port: 9180
# Shared PostgreSQL metrics (roles/postgres_exporter on the database host): saturation of the
# cluster every service depends on. 2026-09-22 showed the symptom (500s everywhere) long before
# anyone could see the cause.
prometheus_postgres_exporter_port: 9187
prometheus_postgres_exporter_hosts: "{{ groups['postgresql'] | default([]) }}"
# Bind to localhost only — Grafana is co-located and Traefik/edge (if any) fronts it.
prometheus_listen: "127.0.0.1"

# --- Alerting + synthetic probes (blackbox_exporter role on the same host) --------------
prometheus_alertmanager_url: "127.0.0.1:9093"
prometheus_rules_dir: "/etc/prometheus/rules"
prometheus_blackbox_url: "127.0.0.1:9115"
# HTTPS targets FOLLOW THE ROUTES: the live Traefik host list is read at play time
# (every Host() rule under the dynamic dir) so a new service is probed the moment
# it is published. Deep health paths and exclusions are declared here.
prometheus_traefik_host: "{{ groups['traefik'] | first }}"
prometheus_traefik_dynamic_dir: "/etc/traefik/dynamic"
# Names that cannot be probed from inside: ca.<domain> has no internal record (VPN-only name)
# and vpn.<domain> resolves to the WAN address (no NAT reflection). Their daemons are probed
# on TCP below; external reachability is the status page's job.
prometheus_blackbox_http_exclude:
  - "{{ platform_service_fqdns.netbird }}"
  - "{{ platform_service_fqdns['step-ca'] }}"        # no page at /, the API answers 404; its /health is probed explicitly below
# Per-host URL override when the internal path differs from the public one (split-DNS sends
# mail.<domain> straight to the mail server, which serves HTTPS on 8443, not 443).
# (a list, not a dict: Ansible does not template dict KEYS, so "mail.{{ domain }}" as a key never matched)
prometheus_blackbox_http_overrides:
  - { host: "{{ platform_service_fqdns.mailcow }}", url: "https://{{ platform_service_fqdns.mailcow }}:8443/" }
prometheus_blackbox_http_extra:
  - "https://{{ platform_service_fqdns.nextcloud }}/status.php"
  - "https://{{ platform_service_fqdns.nextcloud }}/standalone-signaling/api/v1/welcome"
  - "https://{{ platform_service_fqdns.nextcloud }}/recording/api/v1/welcome"
  - "https://{{ platform_service_fqdns.collab }}/healthcheck"
  - "https://{{ platform_service_fqdns['step-ca'] }}/health"
# The platform resolver on both families (the 2026-09-18 outage, #424)
prometheus_resolver_host: "{{ groups['adguard'] | first }}"
prometheus_blackbox_dns_v4: ["{{ hostvars[prometheus_resolver_host].ansible_host }}:53"]
prometheus_blackbox_dns_v6: ["[{{ hostvars[prometheus_resolver_host].platform_host_v6 }}]:53"]
# Plain TCP listeners (Talk TURN on the collab host)
# Each entry is the host's inventory GROUP and the port — the address comes from the
# inventory, so a rebuilt or readdressed service stays monitored without editing this list.
prometheus_blackbox_tcp_targets:
  - {group: k3s,      port: 6443,  what: "k3s API server (application platform)"}
  - {group: collab,   port: 3478,  what: "Talk TURN listener"}
  - {group: step_ca,  port: 9000,  what: "step-ca (HTTPS probe once its root is trusted, A.4)"}
  - {group: netbird,  port: 33073, what: "NetBird management (public name is WAN-only from inside)"}
prometheus_blackbox_tcp: >-
  {%- set out = [] -%}
  {%- for t in prometheus_blackbox_tcp_targets -%}
    {%- for h in groups.get(t.group, []) -%}
      {%- set _ = out.append(hostvars[h].ansible_host ~ ':' ~ t.port) -%}
    {%- endfor -%}
  {%- endfor -%}
  {{ out }}
# TLS listeners — also yields the certificate expiry (mail-port wildcard expired unseen on 2026-09-17)
prometheus_blackbox_tcp_tls: ["{{ groups['mailcow'] | first }}.{{ platform_domain }}:993"]
prometheus_blackbox_smtp_starttls:
  - "{{ groups['mailcow'] | first }}.{{ platform_domain }}:587"
  - "{{ groups['mailcow'] | first }}.{{ platform_domain }}:25"
# ICMP: gateways + the resolver
# The two zone gateways and the resolver — all three from their own source, never typed.
prometheus_blackbox_icmp:
  - "{{ platform_zones.svc.gw4 }}"
  - "{{ platform_zones.dmz.gw4 }}"
  - "{{ hostvars[prometheus_resolver_host].ansible_host }}"
# Alert thresholds
prometheus_alert_probe_for: "2m"
prometheus_alert_resolver_for: "1m"
prometheus_alert_cert_warn_days: 14
prometheus_alert_cert_crit_days: 5
prometheus_alert_disk_free_ratio: 0.10
prometheus_alert_mem_free_ratio: 0.05
prometheus_alert_pg_conn_warn_ratio: 0.80    # backends / max_connections
prometheus_alert_pg_conn_crit_ratio: 0.95
