---
# Prometheus server on lxc-monitoring-01 (Debian package).
- name: "Prometheus | Install prometheus"
  ansible.builtin.apt:
    name: prometheus
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: "Prometheus | Live Traefik host names — HTTPS probe targets follow the routes (read-only)"
  ansible.builtin.command:
    cmd: grep -rhoP 'Host\(`\K[^`]+' {{ prometheus_traefik_dynamic_dir }} --include=*.yml
  delegate_to: "{{ prometheus_traefik_host }}"
  register: prometheus_traefik_hosts
  changed_when: false
  check_mode: false

- name: "Prometheus | HTTPS probe target list (routes minus exclusions, plus deep health paths)"
  ansible.builtin.set_fact:
    prometheus_blackbox_http_targets: >-
      {{ ((prometheus_traefik_hosts.stdout_lines | map('trim') | unique | sort | difference(prometheus_blackbox_http_exclude)
             | difference(prometheus_blackbox_http_overrides.keys() | list))
          | map('regex_replace', '^', 'https://') | map('regex_replace', '$', '/') | list
          + (prometheus_blackbox_http_overrides.values() | list)
          + prometheus_blackbox_http_extra) | unique | sort }}

- name: "Prometheus | Rules directory"
  ansible.builtin.file:
    path: "{{ prometheus_rules_dir }}"
    state: directory
    owner: root
    group: prometheus
    mode: "0750"

- name: "Prometheus | Alert rules ({{ prometheus_rules_dir }}/platform.yml)"
  ansible.builtin.template:
    src: platform.rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/platform.yml"
    owner: root
    group: prometheus
    mode: "0640"
    validate: "promtool check rules %s"
  notify: Restart prometheus

- name: "Prometheus | Scrape config (/etc/prometheus/prometheus.yml)"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: /etc/prometheus/prometheus.yml
    owner: root
    group: root
    mode: "0644"
    validate: "promtool check config %s"
  notify: Restart prometheus

- name: "Prometheus | Runtime args (retention + listen) — /etc/default/prometheus"
  ansible.builtin.copy:
    dest: /etc/default/prometheus
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible (role: prometheus)
      ARGS="--web.listen-address={{ prometheus_listen }}:{{ prometheus_port }} --storage.tsdb.retention.time={{ prometheus_retention }}"
  notify: Restart prometheus

- name: "Prometheus | Enabled + running"
  ansible.builtin.systemd_service:
    name: prometheus
    enabled: true
    state: started
  when: not ansible_check_mode
