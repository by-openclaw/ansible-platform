---
# ==============================================================================
# Prometheus — a container (the pinned official image on the host network, loopback
# listen), the Debian package's layout kept: config in /etc/prometheus, the TSDB in
# /var/lib/prometheus/metrics2, run as the prometheus account that owns it.
# Config first (validated with the image's promtool), then the container; a config
# change restarts it once. The native package goes once the container is ready.
# ==============================================================================
- name: "Prometheus | Service account (owns the TSDB; alertmanager and blackbox run as it too)"
  ansible.builtin.user:
    name: "{{ prometheus_account }}"
    system: true
    create_home: false
    shell: /usr/sbin/nologin
  register: prometheus_account_user

- name: "Prometheus | Config, rules and TSDB directories"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
  loop:
    - {path: "{{ prometheus_config_dir }}", owner: root, group: root, mode: "0755"}
    - {path: "{{ prometheus_rules_dir }}", owner: root, group: "{{ prometheus_account }}", mode: "0750"}
    - {path: "{{ prometheus_data_dir }}", owner: "{{ prometheus_account }}", group: "{{ prometheus_account }}", mode: "0755"}
  loop_control:
    label: "{{ item.path }}"

- name: "Prometheus | Live Traefik host names — HTTPS probe targets follow the routes (read-only)"
  ansible.builtin.command:
    cmd: grep -rhoP 'Host\(`\K[^`]+' {{ prometheus_traefik_dynamic_dir }} --include=*.yml
  delegate_to: "{{ prometheus_traefik_host }}"
  register: prometheus_traefik_hosts
  changed_when: false
  check_mode: false

- name: "Prometheus | HTTPS probe target list (routes minus exclusions, plus deep health paths)"
  ansible.builtin.set_fact:
    prometheus_blackbox_http_targets: >-
      {{ ((prometheus_traefik_hosts.stdout_lines | map('trim') | unique | sort | difference(prometheus_blackbox_http_exclude)
             | difference(prometheus_blackbox_http_overrides | map(attribute='host') | list))
          | map('regex_replace', '^', 'https://') | map('regex_replace', '$', '/') | list
          + (prometheus_blackbox_http_overrides | map(attribute='url') | list)
          + prometheus_blackbox_http_extra) | unique | sort }}

# promtool comes with the image now: the candidate file is checked in a throwaway
# container (no network, as root so it can read the 0600 temp file). Under --check a
# fresh host has no engine yet, so the check is left out there.
- name: "Prometheus | Alert rules (platform.yml) in {{ prometheus_rules_dir }}"
  ansible.builtin.template:
    src: platform.rules.yml.j2
    dest: "{{ prometheus_rules_dir }}/platform.yml"
    owner: root
    group: "{{ prometheus_account }}"
    mode: "0640"
    validate: >-
      {{ omit if ansible_check_mode else
         'docker run --rm --network none --user 0 -v %s:/check.yml:ro --entrypoint promtool '
         ~ prometheus_image ~ ' check rules /check.yml' }}
  register: prometheus_rules_file

- name: "Prometheus | Scrape config (prometheus.yml) in {{ prometheus_config_dir }}"
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: root
    group: root
    mode: "0644"
    validate: >-
      {{ omit if ansible_check_mode else
         'docker run --rm --network none --user 0 -v ' ~ prometheus_config_dir ~ ':' ~ prometheus_config_dir ~ ':ro'
         ~ ' -v %s:/check.yml:ro --entrypoint promtool ' ~ prometheus_image ~ ' check config /check.yml' }}
  register: prometheus_config_file

- name: "Prometheus | The native unit stops (retired; it holds :{{ prometheus_port }})"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ prometheus_native }}"

- name: "Prometheus | The container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: prometheus
      containers:
        - name: "{{ prometheus_container }}"
          image: "{{ prometheus_image }}"
          network_mode: host
          log_driver: journald   # container log -> journal -> promtail -> Loki (INF-27)
          user: "{{ prometheus_account_user.uid | default(0) }}:{{ prometheus_account_user.group | default(0) }}"
          command:
            - "--config.file={{ prometheus_config_dir }}/prometheus.yml"
            - "--storage.tsdb.path={{ prometheus_data_dir }}"
            - "--storage.tsdb.retention.time={{ prometheus_retention }}"
            - "--web.listen-address={{ prometheus_listen }}:{{ prometheus_port }}"
          volumes:
            - "{{ prometheus_config_dir }}:{{ prometheus_config_dir }}:ro"
            - "{{ prometheus_data_dir }}:{{ prometheus_data_dir }}"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"   # the host's trust store (incl. the platform CA)
          restart: "{{ prometheus_rules_file is changed or prometheus_config_file is changed }}"

# The TSDB's WAL replays at start: give it minutes, not seconds.
- name: "Prometheus | Ready (read-only)"
  ansible.builtin.uri:
    url: "http://{{ prometheus_listen }}:{{ prometheus_port }}/-/ready"
    status_code: [200]
  register: prometheus_ready
  until: prometheus_ready.status == 200
  retries: 60
  delay: 5
  when: not ansible_check_mode

- name: "Prometheus | The native install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ prometheus_native }}"
