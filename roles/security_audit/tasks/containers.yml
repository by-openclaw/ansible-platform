---
# Container layer: Trivy scans every RUNNING image (the real service CVE surface;
# host apt cannot see inside containers). Trivy DB cached in a named volume.
# The helper this role used to stage here is superseded by the tasks below (git holds its history).
- name: "SecAudit | The staged Trivy summariser is gone"
  ansible.builtin.file:
    path: "{{ security_audit_helper_dir }}/trivy_summarize.py"
    state: absent
  become: true

- name: "SecAudit | Running images on this host"
  ansible.builtin.command:
    argv: [docker, ps, --format, "{{ security_audit_image_format }}"]
  register: security_audit_images
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false

# Trivy prints one line per finding: its severity. A scan that fails prints none (counted as zero).
- name: "SecAudit | Trivy scan each running image (HIGH/CRITICAL counts)"
  ansible.builtin.command:
    argv:
      - docker
      - run
      - --rm
      - -v
      - "{{ security_audit_trivy_cache_volume }}:/root/.cache/"
      - -v
      - "{{ security_audit_docker_socket }}:{{ security_audit_docker_socket }}"
      - "{{ security_audit_trivy_image }}"
      - image
      - --quiet
      - --scanners
      - vuln
      - --severity
      - "{{ security_audit_trivy_severity }}"
      - --format
      - template
      - --template
      - "{{ security_audit_trivy_template }}"
      - "{{ item }}"
  loop: "{{ security_audit_images.stdout_lines | unique | sort }}"
  loop_control: { label: "{{ item }}" }
  register: security_audit_trivy
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false

- name: "SecAudit | Aggregate container findings"
  ansible.builtin.set_fact:
    security_audit_containers: >-
      {%- set out = [] -%}
      {%- for r in security_audit_trivy.results -%}
        {%- set severities = r.stdout_lines | default([]) | map('trim') | list -%}
        {%- set _ = out.append({'image': r.item,
                                'critical': severities | select('eq', 'CRITICAL') | list | length,
                                'high': severities | select('eq', 'HIGH') | list | length}) -%}
      {%- endfor -%}
      {{ out }}
