---
# ==============================================================================
# Role: diagrams — shared diagram-rendering services on lxc-diagrams-01.
#   - Kroki (diagrams-as-code API): PlantUML/Graphviz/Ditaa/etc. built in;
#     Mermaid via a companion container on a private docker network.
#   - drawio (diagrams.net): visual editor + embed.
# Stateless; fronted by Traefik. Used platform-wide (GitLab, docs, NetBox, portal).
# Images pinned (never :latest).
# ==============================================================================
diagrams_docker_network: "diagrams"

# --- Kroki -------------------------------------------------------------------
diagrams_kroki_image: "yuzutech/kroki:0.28.0"
diagrams_kroki_mermaid_image: "yuzutech/kroki-mermaid:0.28.0"
diagrams_kroki_container: "kroki"
diagrams_kroki_mermaid_container: "kroki-mermaid"
diagrams_kroki_port: 8000            # host port Traefik targets → container 8000
diagrams_kroki_mermaid_port: 8002    # companion, internal to the docker network

# --- PlantUML (standalone) ---------------------------------------------------
# Kroki's built-in PlantUML is a GraalVM native-image built for Haswell+ (needs
# AVX2/BMI/FMA) and won't run on this old Sandy Bridge Xeon. The standalone
# plantuml-server is a regular JVM servlet app (JITs to the actual CPU) → works,
# and is a shared endpoint GitLab's PlantUML integration points at directly.
diagrams_plantuml_image: "plantuml/plantuml-server:jetty-v1.2024.8"
diagrams_plantuml_container: "plantuml"
diagrams_plantuml_port: 8004         # host port Traefik targets → container 8080

# --- drawio ------------------------------------------------------------------
diagrams_drawio_image: "jgraph/drawio:24.7.17"
diagrams_drawio_container: "drawio"
diagrams_drawio_port: 8080           # host port Traefik targets → container 8080

# Both directions are the contract (services/0007 §7.1): absent removes the containers,
# the private network and the three routes. Nothing here holds data, so there is nothing
# to archive first.
diagrams_state: present
