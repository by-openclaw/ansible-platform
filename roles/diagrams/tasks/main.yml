---
# ==============================================================================
# diagrams | Kroki (+ Mermaid companion), PlantUML and drawio on a private
# docker network.
#
# This role used to be 114 lines that were 79% the same four shapes: create a
# network, pull a pinned image, run a container, poll it until it answers. That
# is a description of the service, not logic, so it is a contract now and
# roles/service_scaffold does the work — the same role every other service uses.
# What is left here is the part that is genuinely about THIS service: which
# images, which ports, and that Kroki has to be told where its Mermaid companion
# lives.
# ==============================================================================
- name: "Diagrams | The service, from one contract"
  ansible.builtin.include_role:
    name: service_scaffold
  vars:
    service_scaffold_def:
      name: diagrams
      state: "{{ diagrams_state }}"
      exposure: internal
      mailbox: false
      network: "{{ diagrams_docker_network }}"
      containers:
        # The companion first: Kroki calls it by name on the private network.
        - name: "{{ diagrams_kroki_mermaid_container }}"
          image: "{{ diagrams_kroki_mermaid_image }}"
        - name: "{{ diagrams_kroki_container }}"
          image: "{{ diagrams_kroki_image }}"
          published: ["{{ diagrams_kroki_port }}:8000"]
          env:
            KROKI_MERMAID_HOST: "{{ diagrams_kroki_mermaid_container }}"
            KROKI_MERMAID_PORT: "{{ diagrams_kroki_mermaid_port | string }}"
          health: "http://127.0.0.1:{{ diagrams_kroki_port }}/health"
        - name: "{{ diagrams_plantuml_container }}"
          image: "{{ diagrams_plantuml_image }}"
          published: ["{{ diagrams_plantuml_port }}:8080"]
          health: "http://127.0.0.1:{{ diagrams_plantuml_port }}/"
        - name: "{{ diagrams_drawio_container }}"
          image: "{{ diagrams_drawio_image }}"
          published: ["{{ diagrams_drawio_port }}:8080"]
          health: "http://127.0.0.1:{{ diagrams_drawio_port }}/"
      routes:
        - name: kroki
          fqdn: "kroki.{{ platform_domain }}"
          backend_url: "http://{{ inventory_hostname }}.{{ platform_domain }}:{{ diagrams_kroki_port }}"
        - name: plantuml
          fqdn: "plantuml.{{ platform_domain }}"
          backend_url: "http://{{ inventory_hostname }}.{{ platform_domain }}:{{ diagrams_plantuml_port }}"
        # NO forwardAuth on drawio: it is consumed as an IFRAME EMBED by GitLab
        # (editing .drawio) and by Nextcloud's drawio app. An OAuth redirect
        # inside the iframe cannot complete, so the editor would never load.
        - name: drawio
          fqdn: "drawio.{{ platform_domain }}"
          backend_url: "http://{{ inventory_hostname }}.{{ platform_domain }}:{{ diagrams_drawio_port }}"
          forward_auth: false
