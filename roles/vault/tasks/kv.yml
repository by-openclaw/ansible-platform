---
# Enable the KV v2 secrets engine so the platform can store keys in Vault.
# Idempotent: only enable when the mount is absent.
- name: "kv | Load root token (controller secret)"
  # ROOT REQUIRED: enabling a mount / auth method is a root-only op and runs
  # ONLY on a fresh Vault deploy (idempotent-skipped once configured). After
  # root revocation (SEC-06), regenerate root from the unseal keys before a
  # Vault rebuild: vault operator generate-root. Not used in steady-state deploys.
  ansible.builtin.set_fact:
    vault_root_token: "{{ (lookup('file', vault_secret_dir + '/' + vault_init_secret) | from_json).fields.root_token }}"
  no_log: true

# Vault's HTTP API on this member: the token travels in the module call, never on a command line.
- name: "kv | List secrets engines"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/mounts"
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    timeout: "{{ vault_api_timeout }}"
  register: vault_secrets_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "kv | Enable KV v2 at the secret path"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/mounts/{{ vault_kv_path }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_root_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      type: kv
      options:
        version: "2"
    status_code: [200, 204]
  when: (vault_kv_path + '/') not in vault_secrets_list.json.data
  no_log: true
  changed_when: true
