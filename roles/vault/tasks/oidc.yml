---
# Wire Vault login to Authentik OIDC (SSO). Group `vault-admins` (from the
# Authentik blueprint) → Vault `admins` policy via an external identity group.
# Vault reaches Authentik's discovery URL over TLS (LE chain in /etc/ssl/certs,
# resolves via Unbound split-horizon → Traefik). All facts no_log (creds).
#
# Runs with the ansible-deploy AppRole (vault_login) — root is retired (SEC-06).
# The deploy policy grants auth/oidc/*, identity/group*, identity/group-alias*
# and sys/auth/oidc (roles/vault_deploy_identity/templates/deploy-policy.hcl.j2).
- name: "oidc | Vault login (ansible-deploy AppRole)"
  ansible.builtin.include_role:
    name: vault_login

- name: "oidc | Load the OIDC client creds"
  ansible.builtin.set_fact:
    vault_oidc: "{{ (lookup('file', vault_secret_dir + '/' + vault_oidc_secret_file) | from_json).fields }}"
  no_log: true

# Vault's HTTP API on this member: the token and the client secret travel in the module call,
# never on a command line.
- name: "oidc | The admins policy as Vault holds it"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/policies/acl/{{ vault_admin_policy_name }}"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    status_code: [200, 404]
  register: vault_admin_policy_current
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Write the admins policy (on drift)"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/policies/acl/{{ vault_admin_policy_name }}"
    method: PUT
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      policy: "{{ lookup('template', 'admins-policy.hcl.j2') }}"
    status_code: [200, 204]
  when: (vault_admin_policy_current.json.data.policy | default('') | trim) != (lookup('template', 'admins-policy.hcl.j2') | trim)
  no_log: true
  changed_when: true

- name: "oidc | List auth methods"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/auth"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
  register: vault_auth_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Enable the OIDC auth method"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/auth/{{ vault_oidc_mount }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      type: oidc
    status_code: [200, 204]
  when: (vault_oidc_mount ~ '/') not in vault_auth_list.json.data
  no_log: true
  changed_when: true

- name: "oidc | Capture the OIDC mount accessor"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/auth"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
  register: vault_auth_list2
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Set accessor fact"
  ansible.builtin.set_fact:
    vault_oidc_accessor: "{{ vault_auth_list2.json.data[vault_oidc_mount ~ '/'].accessor }}"
  no_log: true

# The three writes below are sent only on a difference. Vault never gives the client secret back, so
# what was applied is remembered as a short hash in the metadata of the admin group: a rotated
# client secret is seen as a difference like any other field.
- name: "oidc | The OIDC configuration as Vault holds it"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/auth/{{ vault_oidc_mount }}/config"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    status_code: [200, 404]
  register: vault_oidc_config_now
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | The default role as Vault holds it"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/auth/{{ vault_oidc_mount }}/role/{{ vault_oidc_default_role }}"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    status_code: [200, 404]
  register: vault_oidc_role_now
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | The admin group as Vault holds it"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/identity/group/name/{{ vault_oidc_admin_group }}"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    status_code: [200, 404]
  register: vault_oidc_group_now
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Configure auth/oidc (Authentik discovery + client)"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/auth/{{ vault_oidc_mount }}/config"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      oidc_discovery_url: "{{ vault_oidc_discovery_url }}"
      oidc_client_id: "{{ vault_oidc.client_id }}"
      oidc_client_secret: "{{ vault_oidc.client_secret }}"
      default_role: "{{ vault_oidc_default_role }}"
    status_code: [200, 204]
  when: vault_oidc_config_drift | bool
  no_log: true
  changed_when: true

- name: "oidc | Configure the default OIDC role"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/auth/{{ vault_oidc_mount }}/role/{{ vault_oidc_default_role }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      user_claim: "{{ vault_oidc_user_claim }}"
      groups_claim: "{{ vault_oidc_groups_claim }}"
      token_policies: "{{ vault_oidc_token_policies }}"
      token_ttl: "{{ vault_oidc_token_ttl }}"
      oidc_scopes: "{{ vault_oidc_scopes }}"
      allowed_redirect_uris: "{{ vault_oidc.redirect_uris }}"
    status_code: [200, 204]
  when: vault_oidc_role_drift | bool
  no_log: true
  changed_when: true

- name: "oidc | Create/update the external admin identity group"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/identity/group"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      name: "{{ vault_oidc_admin_group }}"
      type: external
      policies: ["{{ vault_admin_policy_name }}"]
      metadata:
        oidc_client_mark: "{{ vault_oidc_client_mark }}"   # a short hash of the client secret that was applied, never the value
    status_code: [200, 204]
  when: vault_oidc_group_drift | bool
  no_log: true
  changed_when: true

- name: "oidc | Read the admin group (id + current alias)"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/identity/group/name/{{ vault_oidc_admin_group }}"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
  register: vault_group_read
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true

- name: "oidc | Map the Authentik group → Vault group (alias, once)"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/identity/group-alias"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      name: "{{ vault_oidc_admin_group }}"
      mount_accessor: "{{ vault_oidc_accessor }}"
      canonical_id: "{{ vault_group_read.json.data.id }}"
    status_code: [200, 204]
  when: not (vault_group_read.json.data.alias | default({}))
  no_log: true
  changed_when: true
