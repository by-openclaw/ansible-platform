---
- name: "config | Ensure config + data dirs exist (owned by the vault uid)"
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ vault_uid }}"
    group: "{{ vault_uid }}"
    mode: "0750"
  loop:
    - "{{ vault_config_host_dir }}"
    - "{{ vault_data_host_dir }}"

- name: "config | Render vault.hcl"
  ansible.builtin.template:
    src: vault.hcl.j2
    dest: "{{ vault_config_host_dir }}/vault.hcl"
    owner: "{{ vault_uid }}"
    group: "{{ vault_uid }}"
    mode: "0640"
  register: vault_hcl
  # vault.hcl is read at start only. A change restarts this member's container (it comes back
  # sealed and tasks/init.yml unseals it); the play runs one member at a time, so the two
  # others keep the quorum and one of them is active meanwhile.
