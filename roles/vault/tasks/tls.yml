---
# Install the shared wildcard cert for the container (vault uid 100 owns the key).
- name: "tls | Distribute the wildcard cert (owned by the container vault uid)"
  ansible.builtin.include_role:
    name: tls_cert
  vars:
    tls_cert_dir: "{{ vault_cert_host_dir }}"
    tls_cert_crt: "{{ vault_tls_cert }}"
    tls_cert_key: "{{ vault_tls_key }}"
    tls_cert_owner: "{{ vault_uid }}"
    tls_cert_group: "{{ vault_uid }}"
    tls_cert_key_mode: "0600"
    tls_cert_crt_mode: "0644"
