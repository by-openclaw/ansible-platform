---
# SEC-07: Vault audit logging (file device -> /vault/logs/audit.log, bind-mounted
# to /var/log/vault on the host, shipped to Loki by promtail). Enabling an audit
# device needs sys/audit — granted to the ansible-deploy policy (see
# vault_deploy_identity); NOT a root operation anymore.
- name: "audit | Login (AppRole via vault_login)"
  ansible.builtin.include_role:
    name: vault_login

- name: "audit | List audit devices"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_ADDR={{ vault_api_addr }}
      -e VAULT_TOKEN={{ vault_deploy_token }} {{ vault_container_name }}
      vault audit list -format=json
  register: vault_audit_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  no_log: true

- name: "audit | Enable the file audit device (idempotent)"
  ansible.builtin.command:
    cmd: >-
      docker exec -e VAULT_ADDR={{ vault_api_addr }}
      -e VAULT_TOKEN={{ vault_deploy_token }} {{ vault_container_name }}
      vault audit enable file file_path=/vault/logs/audit.log mode=0640
  when: "'file/' not in (vault_audit_list.stdout | default(''))"
  register: vault_audit_enable
  changed_when: vault_audit_enable is not skipped

- name: "audit | Rotate the audit log (copytruncate — the device keeps its fd)"
  ansible.builtin.include_role:
    name: logrotate
  vars:
    logrotate_entries:
      - name: vault-audit
        paths: ["/var/log/vault/audit.log"]
        rotate: 30
        copytruncate: true
