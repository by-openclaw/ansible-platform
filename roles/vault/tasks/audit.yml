---
# SEC-07: Vault audit logging (file device -> /vault/logs/audit.log, bind-mounted
# to /var/log/vault on the host, shipped to Loki by promtail). Enabling an audit
# device needs sys/audit — granted to the ansible-deploy policy (see
# vault_deploy_identity); NOT a root operation anymore.
# The audit device is cluster configuration (replicated): enabled once, on the first member.
# Every member writes its own file (same path, its own bind-mount), rotated on each.
- name: "audit | Login (AppRole via vault_login)"
  ansible.builtin.include_role:
    name: vault_login
  when: inventory_hostname == vault_first_member

# Vault's HTTP API on this member: the token travels in the module call, never on a command line.
- name: "audit | List audit devices"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/audit"
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
  register: vault_audit_list
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  no_log: true
  when: inventory_hostname == vault_first_member

- name: "audit | Enable the file audit device (idempotent)"
  ansible.builtin.uri:
    url: "{{ vault_api_addr }}/v1/sys/audit/{{ vault_audit_device }}"
    method: POST
    headers:
      X-Vault-Token: "{{ vault_deploy_token }}"
    timeout: "{{ vault_api_timeout }}"
    body_format: json
    body:
      type: file
      options:
        file_path: "{{ vault_audit_file_path }}"
        mode: "{{ vault_audit_file_mode }}"
    status_code: [200, 204]
  when:
    - inventory_hostname == vault_first_member
    - (vault_audit_device ~ '/') not in vault_audit_list.json.data
  no_log: true
  changed_when: true

- name: "audit | Rotate the audit log (copytruncate — the device keeps its fd)"
  ansible.builtin.include_role:
    name: logrotate
  vars:
    logrotate_entries:
      - name: vault-audit
        paths: ["/var/log/vault/audit.log"]
        rotate: 30
        copytruncate: true
