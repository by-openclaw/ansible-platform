---
# ==============================================================================
# Role: vault — dispatcher
# ==============================================================================
- name: Distribute the shared wildcard cert (TLS)
  ansible.builtin.import_tasks: tls.yml
  tags: [vault, tls]

- name: Render Vault config
  ansible.builtin.import_tasks: config.yml
  tags: [vault, config]

- name: Run the Vault container
  ansible.builtin.import_tasks: container.yml
  tags: [vault, container]

- name: Initialise / unseal Vault
  ansible.builtin.import_tasks: init.yml
  tags: [vault, init]

# GENESIS-ONLY (root required; root is REVOKED in steady state — SEC-06).
# Run with -e vault_genesis=true after `vault operator generate-root` during a
# rebuild. Normal deploys skip: the mount/auth already exist.
- name: Enable the KV v2 secrets engine (genesis only)
  ansible.builtin.import_tasks: kv.yml
  tags: [vault, kv]
  when: vault_genesis | default(false) | bool

- name: Enable audit logging (SEC-07)
  ansible.builtin.import_tasks: audit.yml
  tags: [vault, audit]

- name: Wire Vault login to Authentik OIDC (SSO) (genesis only)
  ansible.builtin.import_tasks: oidc.yml
  tags: [vault, oidc, sso]
  when: vault_genesis | default(false) | bool

- name: Publish Vault via Traefik (internal-only)
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]   # include_role tags do not propagate; --tags route must reach the render
  vars:
    traefik_route_name: vault
    traefik_route_fqdn: "{{ vault_fqdn }}"
    # Vault speaks HTTPS — backend by node hostname so Traefik verifies the
    # wildcard cert (resolves via Unbound override to 10.1.3.150).
    traefik_route_backend_url: "https://{{ vault_node_fqdn }}:{{ vault_port }}"
    traefik_route_internal_only: true
  tags: [vault, route]
