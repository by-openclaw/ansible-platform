---
- name: "container | Pull the pinned Vault image"
  community.docker.docker_image:
    name: "{{ vault_image }}"
    source: pull
    state: present

- name: "container | Audit log directory on the host (SEC-07)"
  ansible.builtin.file:
    path: /var/log/vault
    state: directory
    owner: "100"          # vault user uid in the container
    group: adm            # promtail reads via group adm (hardening standard)
    mode: "0750"

# The audit file's owner/group are the CONTAINER's uid/gid (host-mapped) — an
# ACL gives promtail read regardless; the default ACL covers re-created files.
- name: "container | ACL tooling present"
  ansible.builtin.apt:
    name: acl
    state: present

- name: "container | Promtail read ACL on the audit dir (default, inherited)"
  ansible.posix.acl:
    path: /var/log/vault
    entity: promtail
    etype: user
    permissions: rX
    default: "{{ item }}"
    state: present
  loop: [true, false]

- name: "container | Run Vault"
  community.docker.docker_container:
    name: "{{ vault_container_name }}"
    image: "{{ vault_image }}"
    command: server
    state: started
    restart_policy: unless-stopped
    pull: false
    published_ports:
      - "{{ vault_listen_ip }}:{{ vault_port }}:8200"
      - "127.0.0.1:{{ vault_port }}:8200"
    volumes:
      - "{{ vault_data_host_dir }}:/vault/data"
      - "/var/log/vault:/vault/logs"        # SEC-07: file audit device, shipped by promtail
      - "{{ vault_config_host_dir }}:/vault/config:ro"
      - "{{ vault_cert_host_dir }}:{{ vault_cert_host_dir }}:ro"
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
    env:
      # In-container CLI (init/unseal/status via docker exec) uses the FQDN so
      # the wildcard cert VERIFIES (CA bundle is the mounted /etc/ssl/certs).
      VAULT_ADDR: "{{ vault_api_addr }}"

- name: "container | Wait for Vault to respond"
  ansible.builtin.command:
    cmd: "docker exec {{ vault_container_name }} vault status -format=json"
  register: vault_status_wait
  retries: 20
  delay: 3
  # rc 0 = unsealed, 2 = sealed (both mean Vault is up). Non-0/2 = not ready yet.
  until: vault_status_wait.rc in [0, 2]
  changed_when: false
  failed_when: false
