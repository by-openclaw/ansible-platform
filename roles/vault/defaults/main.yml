---
# ==============================================================================
# Role: vault — HashiCorp Vault (Docker) on lxc-vault-01 (SVC 10.1.3.150)
# Secrets backend, integrated raft storage, TLS via the shared wildcard cert,
# fronted by Traefik (internal-only). Upgrade = bump vault_image tag (raft data
# persists in the named volume). Three raft voters (quorum 2).
# ==============================================================================
vault_image: "hashicorp/vault:2.1.1"   # exact pin. NOTE: recreating this container RE-SEALS Vault
vault_container_name: "vault"

vault_fqdn: "{{ platform_service_fqdns.vault }}"            # external (Traefik) name
# The cluster: three raft voters (platform_vault_members). Every member runs this role; the
# first one is where the cluster was initialised (init, engines, audit device, SSO, the edge
# route are cluster-wide and run there only) — the others JOIN it and are unsealed with the
# same keys. A member never initialises a second cluster (tasks/init.yml).
vault_members: "{{ platform_vault_members | default([inventory_hostname]) }}"
vault_first_member: "{{ groups['vault'] | first }}"
vault_node_id: "{{ inventory_hostname | regex_replace('^lxc-', '') }}"   # lxc-vault-01 → vault-01 (node 1 keeps its id)
vault_node_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"       # the node's own address

# Published on the SVC IP + loopback.
vault_listen_ip: "{{ ansible_host }}"
vault_port: 8200
vault_cluster_port: 8201
vault_uid: 100                          # vault uid inside the official image

# Host dirs bind-mounted into the container (raft data dir must be owned by the
# vault uid — a root-owned named volume makes raft fail with permission denied).
vault_data_host_dir: "/var/lib/vault/data"
vault_config_host_dir: "/etc/vault/config"
vault_cert_host_dir: "/etc/vault/certs"
vault_tls_cert: "{{ vault_cert_host_dir }}/wildcard.crt"
vault_tls_key: "{{ vault_cert_host_dir }}/wildcard.key"

# Controller secret store — unseal keys + root token written here (CRITICAL).
vault_secret_dir: "~/.openclaw/workspace/infra/secrets"
vault_init_secret: "vault-init.json"
vault_key_shares: 5
vault_key_threshold: 3

# --- KV secrets engine (store platform keys here) + OIDC SSO (Authentik) --------
vault_kv_path: "secret"                       # KV v2 mount → store keys under secret/
vault_admin_policy_name: "admins"
vault_oidc_secret_file: "fabric/app-oidc-vault.json" # client_id/secret/redirect_uris (shared with the Authentik blueprint)
vault_oidc_default_role: "default"
vault_oidc_admin_group: "{{ platform_service_groups.vault.admin }}"        # Authentik group → Vault admins policy
vault_oidc_discovery_url: "https://{{ platform_service_fqdns.authentik }}/application/o/vault/"

# Verified-TLS API address (FQDN matches the wildcard cert; skip-verify banned).
vault_api_addr: "https://{{ vault_node_fqdn }}:{{ vault_port }}"   # the in-container CLI talks to its own node
