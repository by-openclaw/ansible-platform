---
# ==============================================================================
# Role: vault — HashiCorp Vault (Docker) on lxc-vault-01 (SVC 10.1.3.150)
# Secrets backend, integrated raft storage, TLS via the shared wildcard cert,
# fronted by Traefik (internal-only). Upgrade = bump vault_image tag (raft data
# persists in the named volume). Three raft voters (quorum 2).
# ==============================================================================
vault_image: "hashicorp/vault:2.1.1"   # exact pin. NOTE: recreating this container RE-SEALS Vault
vault_container_name: "vault"

vault_fqdn: "{{ platform_service_fqdns.vault }}"            # external (Traefik) name
# The cluster: three raft voters (platform_vault_members). Every member runs this role; the
# first one is where the cluster was initialised (init, engines, audit device, SSO, the edge
# route are cluster-wide and run there only) — the others JOIN it and are unsealed with the
# same keys. A member never initialises a second cluster (tasks/init.yml).
vault_members: "{{ platform_vault_members | default([inventory_hostname]) }}"
vault_first_member: "{{ groups['vault'] | first }}"
# Raft timing. Vault's default multiplier (5) is meant for small test machines: a dead active
# node is replaced after about 5 s. 1 is the production value (about 1 s); raise it again if
# the active node changes without a member having died (CPU starvation of a guest).
vault_raft_performance_multiplier: 1
vault_node_id: "{{ inventory_hostname | regex_replace('^lxc-', '') }}"   # lxc-vault-01 → vault-01 (node 1 keeps its id)
vault_node_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"       # the node's own address

# Published on the SVC IP + loopback.
vault_listen_ip: "{{ ansible_host }}"
vault_port: 8200
vault_cluster_port: 8201
vault_uid: 100                          # vault uid inside the official image

# Host dirs bind-mounted into the container (raft data dir must be owned by the
# vault uid — a root-owned named volume makes raft fail with permission denied).
vault_data_host_dir: "/var/lib/vault/data"
vault_config_host_dir: "/etc/vault/config"
vault_cert_host_dir: "/etc/vault/certs"
vault_tls_cert: "{{ vault_cert_host_dir }}/wildcard.crt"
vault_tls_key: "{{ vault_cert_host_dir }}/wildcard.key"

# Controller secret store — unseal keys + root token written here (CRITICAL).
vault_secret_dir: "~/.openclaw/workspace/infra/secrets"
vault_init_secret: "vault-init.json"
vault_key_shares: 5
vault_key_threshold: 3

# --- KV secrets engine (store platform keys here) + OIDC SSO (Authentik) --------
vault_kv_path: "secret"                       # KV v2 mount → store keys under secret/
vault_admin_policy_name: "admins"
vault_oidc_secret_file: "fabric/app-oidc-vault.json" # client_id/secret/redirect_uris (shared with the Authentik blueprint)
vault_oidc_default_role: "default"
vault_oidc_admin_group: "{{ platform_service_groups.vault.admin }}"        # Authentik group → Vault admins policy
vault_oidc_discovery_url: "https://{{ platform_service_fqdns.authentik }}/application/o/vault/"

# Verified-TLS API address (FQDN matches the wildcard cert; skip-verify banned).
vault_api_addr: "https://{{ vault_node_fqdn }}:{{ vault_port }}"   # the in-container CLI talks to its own node
vault_api_timeout: 15                 # seconds a call to the API may take
# The audit device (SEC-07): its name, the file inside the container and the file's mode.
vault_audit_device: "file"
vault_audit_file_path: "/vault/logs/audit.log"
vault_audit_file_mode: "0640"
# The OIDC login: its mount and what the default role asks of the identity provider.
vault_oidc_mount: "oidc"
# The person's alias on the sign-in method is their USERNAME: the per-person area is named after
# it (person-policy.hcl.j2). A person cannot change their own username at the identity provider
# (roles/authentik pins that setting); only the inventory names people.
vault_oidc_user_claim: "preferred_username"
vault_oidc_groups_claim: "groups"
vault_oidc_token_policies: ["default", "{{ vault_people_person_policy }}"]
vault_oidc_token_ttl: "1h"
vault_oidc_scopes: ["openid", "profile", "email", "groups"]
# Derived from what tasks/oidc.yml reads: does Vault hold what is wanted? The client secret is
# compared through a short hash kept in the admin group's metadata (Vault does not return it).
vault_oidc_client_mark: "{{ (vault_oidc.client_secret | hash('sha256'))[:16] }}"
vault_oidc_client_mark_applied: "{{ vault_oidc_group_now.json.data.metadata.oidc_client_mark | default('') }}"
vault_oidc_config_drift: >-
  {{ (vault_oidc_config_now.json.data.oidc_discovery_url | default('')) != vault_oidc_discovery_url
     or (vault_oidc_config_now.json.data.oidc_client_id | default('')) != vault_oidc.client_id
     or (vault_oidc_config_now.json.data.default_role | default('')) != vault_oidc_default_role
     or vault_oidc_client_mark_applied != vault_oidc_client_mark }}
vault_oidc_role_drift: >-
  {{ (vault_oidc_role_now.status | default(404)) != 200
     or (vault_oidc_role_now.json.data.user_claim | default('')) != vault_oidc_user_claim
     or (vault_oidc_role_now.json.data.groups_claim | default('')) != vault_oidc_groups_claim
     or (vault_oidc_role_now.json.data.token_policies | default([]) | sort) != (vault_oidc_token_policies | sort)
     or (vault_oidc_role_now.json.data.token_ttl | default(0) | int) != (vault_oidc_token_ttl | community.general.to_seconds | int)
     or (vault_oidc_role_now.json.data.oidc_scopes | default([]) | sort) != (vault_oidc_scopes | sort)
     or (vault_oidc_role_now.json.data.allowed_redirect_uris | default([]) | sort) != (vault_oidc.redirect_uris | sort) }}
vault_oidc_group_drift: >-
  {{ (vault_oidc_group_now.status | default(404)) != 200
     or (vault_oidc_group_now.json.data.type | default('')) != 'external'
     or (vault_oidc_group_now.json.data.policies | default([]) | sort) != [vault_admin_policy_name]
     or vault_oidc_client_mark_applied != vault_oidc_client_mark }}

# --- People reading in Vault (security/0001 §People reading in Vault) -------------------------
# One read-only policy and one external group per administrators' group that has a login to
# read. The documents come from the inventory (platform_service_logins), the group from
# platform_service_groups; nothing here lets a person write.
vault_people_policy_prefix: "people-"
vault_people_access: >-
  {%- set acc = {} -%}
  {%- for svc, paths in (platform_service_logins | default({})).items() -%}
  {%- set g = (platform_service_groups[svc] | default({})).admin | default('') -%}
  {%- if g -%}{%- set _ = acc.update({g: (acc.get(g, []) + paths) | unique | sort}) -%}{%- endif -%}
  {%- endfor -%}
  {{ acc | dict2items(key_name='group', value_name='paths') }}
vault_people_logins_without_group: >-
  {{ (platform_service_logins | default({})).keys()
     | reject('in', platform_service_groups | dict2items | selectattr('value.admin', 'defined') | map(attribute='key') | list)
     | list }}
# The proof after these rights are applied: a login that carries ONE group's policy and nothing
# else is asked what it may do — `read` on that group's documents, nothing on another document.
# No document is read for it. The login exists for the length of the proof.
vault_people_verify: true
vault_people_probe_role: "people-probe"
vault_people_probe_ttl: "60s"
vault_people_probe_refused: "{{ platform_env }}/vault/oidc"   # a document no people policy opens
vault_approle_mount: "approle"
# The per-person area: secret/<env>/users/<username>/… — readable by that person only.
vault_people_area: "users"
vault_people_person_policy: "person"
# Its proof, for a plain person and for an administrator: an entity that exists for the length
# of the proof, known to the sign-in method under a name nobody has and to AppRole under a proof
# login. Each reads its own area and is refused another person's.
vault_people_base_policies:
  - {name: "{{ vault_people_person_policy }}", template: "person-policy.hcl.j2"}
  - {name: "{{ vault_admin_policy_name }}", template: "admins-policy.hcl.j2"}
vault_people_probes:
  - {name: "people-probe-person", policies: ["{{ vault_people_person_policy }}"]}
  - {name: "people-probe-admin", policies: ["{{ vault_people_person_policy }}", "{{ vault_admin_policy_name }}"]}
vault_people_probe_other: "people-probe-other"
