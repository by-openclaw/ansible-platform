---
# step-ca — internal certificate authority (smallstep). security/0001 PKI.
#
# SCOPE (USER 2026-09-03): Let's Encrypt is FIRST — LE wildcard stays the issuer
# for ALL public/edge + platform service TLS (Traefik, Vault, Postgres, apps…).
# step-ca is ONLY for INTERNAL DEVICE certificates: 802.1X wired/wireless NAC
# (Arista PoE campus + UniFi → Authentik/RADIUS), mTLS between infra devices,
# and machine identity. step-ca does NOT issue web-facing service certs and does
# NOT replace LE.
step_ca_image: "smallstep/step-ca:0.30.2"     # pinned, never :latest (2026-09: 0.30 line)
# The CA state volume on the host (the image runs as `step`, uid/gid 1000): the key password
# copied there by the image's first-boot init must not be world-readable.
step_ca_volume_name: "step-ca-data"
step_ca_uid: 1000
step_ca_listen_ip: "{{ hostvars[groups['step_ca'] | first].ansible_host }}"
step_ca_port: 9000
step_ca_fqdn: "{{ platform_service_fqdns['step-ca'] }}"
step_ca_build_dir: "/opt/step-ca"
# Where roles/platform_ca installs the internal root on every host (the Traefik host included)
step_ca_root_ca_file: "/usr/local/share/ca-certificates/{{ (platform_domain) | regex_replace('\\.', '-') }}-internal-ca.crt"
step_ca_env: "{{ platform_env }}"
step_ca_domain: "{{ platform_domain }}"
# CA root/intermediate key password — Vault get-or-create (never on disk long-term).
step_ca_vault_path: "{{ step_ca_env }}/step-ca/ca-password"
# CA identity — DERIVED from the platform domain (never hard-code the org; this
# platform is by-research.be, not by-systems). by-research.be -> BY-RESEARCH.
step_ca_name: "{{ (platform_domain) | regex_replace('\\.[a-z]+$', '') | upper }} Internal CA"
step_ca_provisioner: "admin@{{ platform_domain }}"
# DNS names the CA answers on (SAN of the CA cert).
step_ca_dns_names: "{{ platform_service_fqdns['step-ca'] }},{{ groups['step_ca'] | first }}.{{ platform_domain }},{{ hostvars[groups['step_ca'] | first].ansible_host }},127.0.0.1"
