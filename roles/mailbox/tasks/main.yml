---
# See defaults/main.yml for the contract. This file resolves identity, reads the
# current state, and dispatches to present/suspended/absent.
- name: "Mailbox | Validate input"
  ansible.builtin.assert:
    that:
      - mailbox_address | length > 0
      - "'@' in mailbox_address"
      - mailbox_state in ['present', 'suspended', 'absent']
      - mailbox_credential in ['vault', 'sso']
    fail_msg: >-
      mailbox needs a full address (mailbox_service or mailbox_address),
      state present|suspended|absent and credential vault|sso —
      got address='{{ mailbox_address }}' state='{{ mailbox_state }}'
      credential='{{ mailbox_credential }}'
    quiet: true

- name: "Mailbox | Address facts"
  ansible.builtin.set_fact:
    mailbox_local: "{{ mailbox_address.split('@')[0] }}"
    mailbox_at_domain: "{{ mailbox_address.split('@')[1] }}"

# --- the API key, from Vault (never a file on the controller) ------------------
# Read ONCE per play, not once per mailbox. A play provisioning 25 service
# mailboxes includes this role 25 times, and an unguarded read meant 25 Vault
# logins plus 25 kv gets — around 9 seconds of the ~20 per mailbox, enough to push
# the run past a quarter of an hour. The key cannot change mid-run, so the bound
# fact is reused. (A play that had to talk to a second mailcow would need to clear
# mailbox_api_hdr between them; nothing does.)
- name: "Mailbox | Read the Mailcow API key from Vault (first mailbox only)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailbox_api_vault_path }}"
    vault_secret_init: {}
  when: mailbox_api_hdr is not defined

- name: "Mailbox | Bind the API endpoint and header"
  ansible.builtin.set_fact:
    mailbox_api: "https://{{ mailbox_listen_ip }}:{{ mailbox_https_port }}/api/v1"
    mailbox_api_hdr:
      X-API-Key: "{{ vault_secret_result.api_key }}"
      Content-Type: "application/json"
  no_log: true
  when: mailbox_api_hdr is not defined

# Read here, not inside the export: the tasks there run delegated to the mailcow
# host, and vault_secret must not be delegated with them.
- name: "Mailbox | Read the export bucket's S3 key from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ mailbox_export_bucket_vault_path }}"
    vault_secret_init: {}
  when:
    - mailbox_state == 'suspended'
    - mailbox_export_s3 | bool

- name: "Mailbox | Bind the S3 key"
  ansible.builtin.set_fact:
    mailbox_s3: "{{ vault_secret_result }}"
  no_log: true
  when:
    - mailbox_state == 'suspended'
    - mailbox_export_s3 | bool

# --- read before write --------------------------------------------------------
# Read-only, so it is valid under --check and must run there: every decision below
# depends on it, and a skipped read registers a bare dict that reads as "absent".
- name: "Mailbox | Current state — {{ mailbox_address }}"
  ansible.builtin.uri:
    url: "{{ mailbox_api }}/get/mailbox/{{ mailbox_address }}"
    headers: "{{ mailbox_api_hdr }}"
    validate_certs: false
    status_code: [200]
    return_content: true
  delegate_to: "{{ mailbox_mailcow_host }}"
  become: true
  register: mailbox_cur
  changed_when: false
  check_mode: false
  no_log: true

- name: "Mailbox | Existence and current attributes"
  ansible.builtin.set_fact:
    mailbox_exists: "{{ mailbox_cur.json is mapping and (mailbox_cur.json.username | default('')) == mailbox_address }}"
    mailbox_want_active: "{{ {'present': 1, 'suspended': 2, 'absent': 0}[mailbox_state] }}"

- name: "Mailbox | Attribute drift"
  ansible.builtin.set_fact:
    # Only these are reconciled. A quota is reported in bytes, active as an int.
    mailbox_drift: >-
      {{ mailbox_exists and (
           (mailbox_cur.json.name | default('')) != mailbox_display_name
        or (mailbox_cur.json.quota | default(0) | int) != (mailbox_quota_mb | int) * 1048576
        or (mailbox_cur.json.active_int | default(mailbox_cur.json.active) | default(0) | int) != (mailbox_want_active | int)
        or (mailbox_cur.json.authsource | default('')) != mailbox_authsource
      ) }}

- name: "Mailbox | Provision (state=present)"
  ansible.builtin.include_tasks: present.yml
  when: mailbox_state == 'present'

- name: "Mailbox | Suspend (state=suspended — receives, cannot log in)"
  ansible.builtin.include_tasks: suspended.yml
  when: mailbox_state == 'suspended'

- name: "Mailbox | Decommission (state=absent)"
  ansible.builtin.include_tasks: absent.yml
  when: mailbox_state == 'absent'

- name: "Mailbox | Summary"
  ansible.builtin.debug:
    msg: >-
      mailbox {{ mailbox_address }} state={{ mailbox_state }}
      credential={{ mailbox_credential }} existed={{ mailbox_exists }}
      aliases={{ mailbox_aliases | length }} delegates={{ mailbox_delegates | length }}
      (plus-addressing {{ mailbox_local }}+tag@{{ mailbox_at_domain }} is active
      platform-wide — postfix recipient_delimiter, nothing per-mailbox{{
      '; creds in Vault ' ~ mailbox_env ~ '/mail/' ~ mailbox_service
      if mailbox_credential == 'vault' else '; SSO-bound, no password stored' }})
