---
# ==============================================================================
# Role: mailbox — the ONLY writer of Mailcow mailbox state (SVC-16, SVC-15).
# Every mailbox on the platform is made here: a service's (netbird@, alerts@) and
# a person's. They differ in policy, not in mechanism, and the policy is these
# variables — two roles making mailboxes is how the two drifted apart.
#
# STATES (SVC-47) — all three are meaningful for a service and for a person:
#   present    active=1. Reachable, can log in.
#   suspended  active=2. Still RECEIVES mail, cannot log in. What a leaver means
#              for a mailbox, and what a retired service should be before it is
#              torn down. Adds the optional forward + auto-reply sieve and the
#              one-time maildir export.
#   absent     active=0 and the aliases/bcc/sender_acl grants removed. The mail
#              itself is never deleted (archive-before-destroy).
#
# CREDENTIAL:
#   vault  get-or-create secret/{env}/mail/{service} and set that password — a
#          service needs it to authenticate for SMTP submission.
#   sso    mint a throwaway, store nothing, set the OIDC authsource. The password
#          is never used: the person logs in through Authentik.
#
# Every attribute is read before it is written, so a converged run reports no
# change. Without that a real change stops being visible in the noise.
# ==============================================================================

# --- identity -----------------------------------------------------------------
mailbox_service: ""                          # local part, e.g. netbird (a service box)
mailbox_domain: "{{ platform_domain }}"
# Full address. Defaults to {{ service }}@{{ domain }}; a person passes their own
# (their local part is not a service name and may sit in another domain).
mailbox_address: "{{ mailbox_service }}@{{ mailbox_domain }}"

mailbox_env: "{{ platform_env | default('prod') }}"
mailbox_state: present                       # present | suspended | absent
mailbox_credential: vault                    # vault | sso
mailbox_display_name: "{{ mailbox_service }} service"
mailbox_quota_mb: 1024
# "" leaves Mailcow's own authentication; generic-oidc binds the box to Authentik.
mailbox_authsource: ""

mailbox_aliases: []                          # extra local-parts -> this box
mailbox_delegates: []                        # full addresses (adm_x@...): rx copy + send-as

# --- suspended extras ---------------------------------------------------------
mailbox_forward_to: ""                       # sieve redirect :copy — keeps a copy in the box
mailbox_autoreply: ""                        # sieve vacation body
mailbox_autoreply_days: 7                    # vacation :days (repeat interval)
mailbox_sieve_name: "leaver"                 # script_desc in mailcow's sieve_filters
# One-time export of the maildir to S3 before the box goes quiet. The export is
# keyed on the local part, so it happens once and a re-run finds it already there.
mailbox_export_s3: false
mailbox_export_bucket_vault_path: "{{ mailbox_env }}/mailcow/s3"
mailbox_export_prefix: "leavers"
mailbox_export_dir: "/var/backups/mailcow/leavers"        # staging, removed after upload
mailbox_vmail_dir: "/var/lib/docker/volumes/mailcowdockerized_vmail-vol-1/_data"

# --- Mailcow API --------------------------------------------------------------
mailbox_mailcow_host: "{{ groups['mailcow'] | first }}"
mailbox_listen_ip: "{{ mailcow_listen_ip | default(hostvars[groups['mailcow'] | first].ansible_host) }}"
mailbox_https_port: "{{ mailcow_https_port | default(8443) }}"
# The API key comes from Vault, not a file on the controller. It is the secret
# that can create and read every mailbox on the platform.
mailbox_api_vault_path: "{{ mailbox_env }}/mailcow/admin"      # api_key
mailbox_mysql_container: "mailcowdockerized-mysql-mailcow-1"

# The delegate list is the WHOLE set: grants for anyone not listed are revoked.
# A caller that only ADDS grants (a person's mailbox — people.yml does not model
# delegation) sets this false, so the reconcile does not delete what nothing declares.
mailbox_delegates_declarative: true
