---
# Harbor's own secret and the three it borrows, all from Vault — nothing read from
# or written to the controller's disk (#377).
#
# The admin password is get-or-create: absent in Vault -> minted once and stored;
# present -> read. Same behaviour the stat-or-generate-then-persist had, with Vault
# holding the state instead of a 0600 file on one machine. The path exists, so the
# live password is READ — re-minting it would lock the admin account out of the
# registry every service pulls from.
- name: "Secrets | Harbor's admin password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ harbor_vault_path }}"
    vault_secret_init:
      url: "https://{{ harbor_fqdn }}"
      username: admin
      admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"  # pragma: allowlist secret

- name: "Secrets | Bind it"
  ansible.builtin.set_fact:
    harbor_admin_password: "{{ vault_secret_result.admin_password }}"
  no_log: true

# --- Load dependency creds (written by postgres_db / seaweedfs_bucket / authentik) ---
- name: "Secrets | The Postgres password (minted by postgres_db)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ harbor_pg_vault_path }}"

- name: "Secrets | Bind it"
  ansible.builtin.set_fact:
    harbor_pg_password: "{{ vault_secret_result.password }}"
  no_log: true

- name: "Secrets | The S3 credentials (minted by seaweedfs_bucket)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ harbor_s3_vault_path }}"

- name: "Secrets | Bind them"
  ansible.builtin.set_fact:
    harbor_s3_creds: "{{ vault_secret_result }}"
  no_log: true

# Read-if-present: roles/authentik mints these, and Harbor can be installed before
# SSO is wired. The gate becomes "is the client secret held" rather than "does a
# file sit on one machine", which is what was actually being asked.
- name: "Secrets | The Authentik OIDC client credentials, if they exist yet"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ harbor_oidc_vault_path }}"
    vault_secret_optional: true
  when: harbor_oidc_enabled | bool

- name: "Secrets | Bind them, and whether SSO can be configured"
  ansible.builtin.set_fact:
    harbor_oidc: "{{ vault_secret_result | default({}) }}"
    harbor_oidc_held: "{{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}"
  no_log: true
  when: harbor_oidc_enabled | bool
