---
# Harbor's OWN secret (admin password) — stat → load-or-generate → persist (fabric).
# Then load back the creds the dependency roles already wrote (DB / S3 / OIDC / Redis).
- name: "Secrets | Stat the harbor secret on the controller"
  ansible.builtin.stat:
    path: "{{ harbor_secret_dir }}/{{ harbor_secret_file }}"
  delegate_to: localhost
  become: false
  register: harbor_secret_stat

- name: "Secrets | Load the existing harbor admin password"
  ansible.builtin.set_fact:
    harbor_admin_password: "{{ (lookup('file', harbor_secret_dir + '/' + harbor_secret_file) | from_json).fields.admin_password }}"
  no_log: true
  when: harbor_secret_stat.stat.exists

- name: "Secrets | Generate the harbor admin password"
  ansible.builtin.set_fact:
    harbor_admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
  no_log: true
  when: not harbor_secret_stat.stat.exists

- name: "Secrets | Persist the harbor secret (0600)"
  vars:
    harbor_secret_record:
      fields:
        url: "https://{{ harbor_fqdn }}"
        username: admin
        admin_password: "{{ harbor_admin_password }}"  # pragma: allowlist secret
  ansible.builtin.copy:
    dest: "{{ harbor_secret_dir }}/{{ harbor_secret_file }}"
    mode: "0600"
    content: "{{ harbor_secret_record | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not harbor_secret_stat.stat.exists

# --- Load dependency creds (written by postgres_db / seaweedfs_bucket / authentik) ---
- name: "Secrets | Load the Postgres password"
  ansible.builtin.set_fact:
    harbor_pg_password: "{{ (lookup('file', harbor_secret_dir + '/' + harbor_pg_secret_file) | from_json).fields.password }}"
  no_log: true

- name: "Secrets | Load the SeaweedFS S3 credentials"
  ansible.builtin.set_fact:
    harbor_s3_creds: "{{ (lookup('file', harbor_secret_dir + '/' + harbor_s3_secret_file) | from_json).fields }}"
  no_log: true

- name: "Secrets | Stat + load the Authentik OIDC client creds"
  ansible.builtin.stat:
    path: "{{ harbor_secret_dir }}/{{ harbor_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: harbor_oidc_stat
  when: harbor_oidc_enabled | bool

- name: "Secrets | Load the OIDC client id + secret"
  ansible.builtin.set_fact:
    harbor_oidc: "{{ (lookup('file', harbor_secret_dir + '/' + harbor_oidc_secret_file) | from_json).fields }}"
  no_log: true
  when:
    - harbor_oidc_enabled | bool
    - harbor_oidc_stat.stat.exists | default(false)
