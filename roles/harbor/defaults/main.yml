---
# ==============================================================================
# Role: harbor — OCI container registry (Docker/Swarm/k3s images + Helm charts)
# on lxc-harbor-01 (SVC 10.1.3.240). Docker-compose stack via Harbor's installer.
# Stateless-ish: blobs -> SeaweedFS S3, metadata -> cluster Postgres, sessions ->
# cluster Redis. Fronted by Traefik (TLS terminated at the edge) + Authentik OIDC.
# Trivy scanning on. Secrets follow the fabric-file house pattern; mirror to Vault
# with playbooks/secrets-to-vault.yml (same follow-up as every other service).
# ==============================================================================

# Identity / addressing
harbor_fqdn: "harbor.{{ platform_domain }}"
harbor_listen_ip: "{{ hostvars[groups['harbor'] | first].ansible_host }}"
harbor_host_port: 8080                 # Harbor portal/registry HTTP (Traefik does HTTPS)

# Harbor release (PINNED — never :latest, per platform standard)
# renovate: datasource=github-releases depName=goharbor/harbor
harbor_version: "v2.15.2"              # ladder target; move through playbooks/harbor-upgrade.yml
harbor_installer_url: "https://github.com/goharbor/harbor/releases/download/{{ harbor_version }}/harbor-online-installer-{{ harbor_version }}.tgz"
harbor_install_dir: "/opt/harbor"
harbor_data_dir: "/data/harbor"        # Harbor's local /data (logs, trivy cache) — blobs are on S3

# --- Secrets (controller fabric store; Vault mirror = follow-up) ---------------
# Vault KV paths (security/0001 secret/{env}/{service}/{key}) — no controller files.
harbor_vault_path: "{{ platform_env | default('prod') }}/harbor/admin"         # admin password  # pragma: allowlist secret

# --- Cluster Postgres (roles/postgres_db creates the DB + role) ----------------
harbor_pg_name: "harbor"
harbor_pg_user: "harbor"
harbor_pg_host: "{{ groups['postgresql'] | first }}.{{ platform_domain }}"            # FQDN so verify-full matches the cert
harbor_pg_port: 5432
harbor_pg_sslmode: "verify-full"
# Bound the metadata DB pool. Harbor's own default (max_open_conns 0) is UNLIMITED: on a shared
# cluster one busy job burst (scans, GC, replication) could take every slot from every other
# service. 20 open / 5 idle covers core + jobservice (10 job workers) with margin.
harbor_pg_max_open_conns: 20
harbor_pg_max_idle_conns: 5
harbor_pg_vault_path: "{{ platform_env | default('prod') }}/harbor/db-pgsql"    # minted by postgres_db

# Redis: Harbor uses its own bundled instance (internal job-queue/cache), so no
# cluster-Redis wiring here — see the comment in templates/harbor.yml.j2.

# --- SeaweedFS S3 (roles/seaweedfs_bucket provisions bucket + scoped identity) --
harbor_s3_identity: "harbor"
harbor_s3_bucket: "harbor-registry"
harbor_s3_region: "us-east-1"
harbor_s3_endpoint: "https://{{ platform_service_fqdns.seaweedfs }}"           # Traefik route (reused, no new split-DNS)
harbor_s3_vault_path: "{{ platform_env | default('prod') }}/harbor/s3"          # minted by seaweedfs_bucket

# --- Authentik OIDC (app declared in roles/authentik authentik_oidc_apps) -------
harbor_oidc_enabled: true
harbor_oidc_vault_path: "{{ platform_env | default('prod') }}/harbor/oidc"      # minted by roles/authentik
harbor_authentik_base: "https://authentik.{{ platform_domain }}"
harbor_oidc_slug: "harbor"
harbor_oidc_endpoint: "{{ harbor_authentik_base }}/application/o/{{ harbor_oidc_slug }}/"
harbor_oidc_scope: "openid,email,profile,groups"
harbor_oidc_groups_claim: "groups"
harbor_oidc_admin_group: "{{ platform_service_groups.harbor.admin }}"                  # members become Harbor admins
harbor_oidc_auto_onboard: true

# --- Trivy vulnerability scanner ----------------------------------------------
harbor_trivy_enabled: true

# --- Pull-through proxy caches (replace Docker Hub etc.) -----------------------
# A proxy-cache project mirrors an upstream registry: the first pull fetches +
# caches it, later pulls are served locally — beats Docker Hub rate limits, keeps
# images on-net, and lets Trivy scan them. Pull as harbor.{{ platform_domain }}/<project>/<image>
# e.g. harbor.{{ platform_domain }}/dockerhub/library/nginx:latest. Point nodes' container
# runtime at Harbor as a registry mirror for docker.io to make it transparent.
harbor_proxy_caches:
  - { project: "dockerhub", name: "docker-hub", type: "docker-hub", url: "https://hub.docker.com" }
  # - { project: "ghcr",   name: "ghcr",   type: "github-ce", url: "https://ghcr.io" }
  # - { project: "quay",   name: "quay",   type: "quay",      url: "https://quay.io" }

# --- GitLab CI push target: private project + scoped system robot (topic 2a) ----
# CI pipelines docker-login as this robot and push private images to <ci_project>,
# and pull base images through the dockerhub proxy-cache. The robot secret is
# returned by Harbor ONCE at creation → captured to fabric (+ Vault). Least
# privilege: push/pull on the CI project, pull-only on the cache. The matching
# GitLab CI/CD variables (HARBOR_HOST/USER/TOKEN) are set on the GitLab side
# (gitlab-ce repo) from this same fabric secret.
harbor_ci_enabled: true
harbor_ci_project: "gitlab"                               # private project images land in
harbor_ci_robot_name: "gitlab-ci"                         # system robot -> login name robot$gitlab-ci
harbor_ci_robot_duration: -1                              # days; -1 = non-expiring
# STILL A FILE, deliberately: the GitLab CI robot token is written and read by
# tasks/gitlab-ci.yml, and playbooks/harbor-gitlab-ci.yml cannot run at all today
# (#551 — it assumes root SSH on :22 through the retired jump path). Converting code
# whose play cannot be dry-run would be shipping an unverified change; it follows
# once #551 is fixed. Vault already holds the value at harbor/robot-gitlab.
harbor_secret_dir: "~/.openclaw/workspace/infra/secrets"
harbor_ci_robot_secret_file: "fabric/harbor-robot-gitlab.json"  # pragma: allowlist secret
harbor_ci_pull_cache_project: "dockerhub"                 # proxy-cache the robot may pull from
