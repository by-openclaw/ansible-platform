---
# The running version of the service: one command or one file, read on the target host.
- name: "Upgrade_path | Read the running version of {{ upgrade_path_service }} (command)"
  ansible.builtin.command:
    argv: "{{ upgrade_path_current.argv }}"
  register: upgrade_path_current_out
  changed_when: false
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  when: upgrade_path_current.argv is defined

- name: "Upgrade_path | Read the running version of {{ upgrade_path_service }} (file)"
  ansible.builtin.slurp:
    src: "{{ upgrade_path_current.file }}"
  register: upgrade_path_current_file
  check_mode: false  # read-only probe
  when: upgrade_path_current.file is defined

- name: "Upgrade_path | A version was read"
  ansible.builtin.assert:
    that: upgrade_path_current_version | trim | length > 0
    fail_msg: >-
      No version could be read for {{ upgrade_path_service }}: upgrade_path_current needs argv or
      file, and its regex must match what was read.
    quiet: true

- name: "Upgrade_path | Keep it"
  ansible.builtin.set_fact:
    upgrade_path_version_now: "{{ upgrade_path_current_version | trim }}"
