---
# Items name their guest (the inventory hostname); its VMID comes from the node itself
# — Terraform owns VMIDs, so no copy of one is kept in this repo (the same lookup
# playbooks/pbs-pve-storage.yml does with qm list).
- name: "PVE ZFS | Guests on this node (VMID by name)"
  ansible.builtin.command:
    cmd: pct list
  register: pve_zfs_mount_pct
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false

- name: "PVE ZFS | Resolve each item's VMID from its guest name"
  ansible.builtin.set_fact:
    pve_zfs_mount_on_node: >-
      {%- set ids = {} -%}
      {%- for line in pve_zfs_mount_pct.stdout_lines[1:] -%}
        {%- set f = line.split() -%}{%- set _ = ids.update({f[-1]: f[0]}) -%}
      {%- endfor -%}
      {%- set out = [] -%}
      {%- for i in pve_zfs_mount_items -%}
        {%- set _ = out.append(i | combine({'vmid': ids.get(i.guest, '')})) -%}
      {%- endfor -%}
      {{ out }}

# A play runs on every Proxmox node; each node serves the items whose guest it carries, and a
# guest that no node carries (a misspelt name) still fails the play.
- name: "PVE ZFS | The items whose guest runs on this node"
  ansible.builtin.set_fact:
    pve_zfs_mount_resolved: "{{ pve_zfs_mount_on_node | rejectattr('vmid', 'equalto', '') | list }}"

- name: "PVE ZFS | Every guest runs on one of the nodes"
  ansible.builtin.assert:
    that: _missing | length == 0
    fail_msg: "no node of this play carries: {{ _missing }}"
    quiet: true
  vars:
    _found: "{{ ansible_play_hosts | map('extract', hostvars, 'pve_zfs_mount_resolved') | flatten | map(attribute='guest') | list }}"
    _missing: "{{ pve_zfs_mount_items | map(attribute='guest') | reject('in', _found) | unique | list }}"
  run_once: true

- name: "PVE ZFS | Nothing to mount on this node"
  ansible.builtin.meta: end_host
  when: pve_zfs_mount_resolved | length == 0

- name: "PVE ZFS | Check which datasets already exist"
  ansible.builtin.command:
    cmd: "zfs list -H -o name {{ item.dataset }}"
  register: pve_zfs_mount_exists
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  failed_when: false
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "{{ item.dataset }}"

- name: "PVE ZFS | Create dataset when absent (with quota)"
  ansible.builtin.command:
    cmd: "zfs create -p -o quota={{ item.quota }} {{ item.dataset }}"
  changed_when: true
  when: pve_zfs_mount_exists.results[idx].rc != 0
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "{{ item.dataset }}"
    index_var: idx

- name: "PVE ZFS | Enforce quota (declared value; no-op if unchanged)"
  ansible.builtin.command:
    cmd: "zfs set quota={{ item.quota }} {{ item.dataset }}"
  changed_when: false
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "{{ item.dataset }}"

- name: "PVE ZFS | Resolve each dataset mountpoint"
  ansible.builtin.command:
    cmd: "zfs get -H -o value mountpoint {{ item.dataset }}"
  register: pve_zfs_mount_mp
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "{{ item.dataset }}"

# Only on first creation: hand the empty mount to the container's root (unpriv map
# = host 100000) so the guest can chown it to its service user. NOT enforced on
# re-runs, or it would fight the in-container ownership set by the app role.
- name: "PVE ZFS | Seed ownership for the container (first create only)"
  ansible.builtin.file:
    path: "{{ pve_zfs_mount_mp.results[idx].stdout }}"
    state: directory
    owner: "{{ item.uid | default(100000) }}"
    group: "{{ item.gid | default(100000) }}"
    mode: "0750"
  when: pve_zfs_mount_exists.results[idx].rc != 0
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "{{ item.dataset }}"
    index_var: idx

- name: "PVE ZFS | Read current container configs"
  ansible.builtin.command:
    cmd: "pct config {{ item.vmid }}"
  register: pve_zfs_mount_cfg
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "ct {{ item.vmid }}"

- name: "PVE ZFS | Attach the bind-mount to the container (if absent)"
  ansible.builtin.command:
    cmd: "pct set {{ item.vmid }} -mp{{ item.mp_index | default(0) }} {{ pve_zfs_mount_mp.results[idx].stdout }},mp={{ item.mount_path }},backup=0"
  register: pve_zfs_mount_set
  changed_when: pve_zfs_mount_set.rc == 0
  when: "('mp=' ~ item.mount_path) not in pve_zfs_mount_cfg.results[idx].stdout"
  loop: "{{ pve_zfs_mount_resolved }}"
  loop_control:
    label: "ct {{ item.vmid }} -> {{ item.mount_path }}"
    index_var: idx
  notify: PVE ZFS restart cts

- name: "PVE ZFS | Flush handlers (apply mounts now)"
  ansible.builtin.meta: flush_handlers
