---
# ==============================================================================
# SeaweedFS — containers of the pinned official image (host network), run as the
# seaweedfs account that owns /data: the combined server (master+volume+filer+S3), the
# admin console and the offsite backup. Config first, then the containers; a config
# change restarts the container that reads it, once. The native units, unit files and
# binary go once the S3 gateway answers from the container.
# ==============================================================================
- name: "SeaweedFS | Create system group"
  ansible.builtin.group:
    name: "{{ seaweedfs_group }}"
    system: true

- name: "SeaweedFS | Create system user (owns /data; the containers run as it)"
  ansible.builtin.user:
    name: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    system: true
    shell: /usr/sbin/nologin
    home: /nonexistent
    create_home: false
  register: seaweedfs_account

- name: "SeaweedFS | Own the data dir (persistent ZFS bind-mount)"
  ansible.builtin.file:
    path: "{{ seaweedfs_data_dir }}"
    state: directory
    owner: "{{ seaweedfs_user }}"
    group: "{{ seaweedfs_group }}"
    mode: "0750"

- name: "SeaweedFS | Ensure config dir"
  ansible.builtin.file:
    path: "{{ seaweedfs_config_dir }}"
    state: directory
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0750"

- name: "SeaweedFS | S3 admin identity and encryption key, from Vault"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ seaweedfs_vault_path }}"

- name: "SeaweedFS | Bind them"
  ansible.builtin.set_fact:
    seaweedfs_creds: "{{ vault_secret_result }}"
  no_log: true

- name: "SeaweedFS | Render S3 identities config"
  ansible.builtin.template:
    src: s3.json.j2
    dest: "{{ seaweedfs_config_dir }}/s3.json"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0640"
  no_log: true
  register: seaweedfs_cfg_s3

- name: "SeaweedFS | Render master.toml (volume growth per collection)"
  ansible.builtin.template:
    src: master.toml.j2
    dest: "{{ seaweedfs_config_dir }}/master.toml"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0644"
  register: seaweedfs_cfg_master

- name: "SeaweedFS | Render SSE-S3 security.toml (encryption at rest)"
  ansible.builtin.template:
    src: security.toml.j2
    dest: "{{ seaweedfs_config_dir }}/security.toml"
    owner: root
    group: "{{ seaweedfs_group }}"
    mode: "0640"
  no_log: true
  when: seaweedfs_sse_enabled | bool
  register: seaweedfs_cfg_security

- name: "SeaweedFS | Admin dashboard: data dir and console login"
  when: seaweedfs_admin_enabled | bool
  block:
    - name: "SeaweedFS | Admin data dir"
      ansible.builtin.file:
        path: "{{ seaweedfs_admin_data_dir }}"
        state: directory
        owner: "{{ seaweedfs_user }}"
        group: "{{ seaweedfs_group }}"
        mode: "0750"

    - name: "SeaweedFS | Admin console credential (get-or-create in Vault)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ seaweedfs_console_vault_path }}"
        vault_secret_init:
          username: "{{ seaweedfs_admin_user }}"
          password: "{{ lookup('community.general.random_string', length=32, special=false) }}"
          _note: "SeaweedFS admin console local login (roles/seaweedfs) — behind Authentik forwardAuth; required since 4.47 to bind the SVC address"

    - name: "SeaweedFS | Bind it"
      ansible.builtin.set_fact:
        seaweedfs_console: "{{ vault_secret_result }}"
      no_log: true

- name: "SeaweedFS | Offsite backup to Contabo: credentials and replication.toml"
  when: seaweedfs_offsite_enabled | bool
  block:
    - name: "SeaweedFS | Offsite (Contabo) credentials, from Vault"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ seaweedfs_offsite_vault_path }}"

    - name: "SeaweedFS | Bind them"
      ansible.builtin.set_fact:
        seaweedfs_offsite: "{{ vault_secret_result }}"
      no_log: true

    - name: "SeaweedFS | Render replication.toml (S3 sink)"
      ansible.builtin.template:
        src: replication.toml.j2
        dest: "{{ seaweedfs_config_dir }}/replication.toml"
        owner: root
        group: "{{ seaweedfs_group }}"
        mode: "0640"
      no_log: true
      register: seaweedfs_cfg_replication

# The volume index format depends on the build: a `large_disk` image (5-byte offsets) must
# never open data written with 4-byte ones. The pinned image's own `weed version` decides,
# before anything stops (this also pulls the image: the gap is the start, not the pull).
- name: "SeaweedFS | The image's build matches the data (volume offset size + version)"
  ansible.builtin.command:
    argv: [docker, run, --rm, --network, none, --entrypoint, "{{ seaweedfs_bin }}", "{{ seaweedfs_image }}", version]
  register: seaweedfs_image_build
  changed_when: false
  check_mode: false   # read-only: under --check too, the switch-over must not be planned on a wrong image
  failed_when: >-
    seaweedfs_image_build.rc != 0
    or (seaweedfs_offset_build ~ ' ' ~ seaweedfs_version) not in seaweedfs_image_build.stdout
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine

- name: "SeaweedFS | The native units stop (retired; they hold the ports)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_stop
  vars:
    service_scaffold_native: "{{ seaweedfs_native }}"

- name: "SeaweedFS | The account the containers run as"
  ansible.builtin.set_fact:
    seaweedfs_run_as: "{{ seaweedfs_account.uid | default(0) }}:{{ seaweedfs_account.group | default(0) }}"

- name: "SeaweedFS | The containers to run: server, admin console, offsite backup"
  ansible.builtin.set_fact:
    seaweedfs_server_ctr:
      name: "{{ seaweedfs_container }}"
      image: "{{ seaweedfs_image }}"
      read_only: true                 # SEC-22: data and configuration are host directories
      tmpfs: ["/tmp:rw,size=256m"]     # weed's sockets and its own log files (about 1 MB a day)
      network_mode: host
      user: "{{ seaweedfs_run_as }}"
      entrypoint: ["{{ seaweedfs_bin }}"]
      command:
        - server
        - "-dir={{ seaweedfs_data_dir }}"
        - "-ip={{ seaweedfs_ip }}"
        - "-ip.bind={{ seaweedfs_bind }}"
        - "-master.port={{ seaweedfs_master_port }}"
        - "-volume.port={{ seaweedfs_volume_port }}"
        - "-filer"
        - "-filer.port={{ seaweedfs_filer_port }}"
        - "-s3"
        - "-s3.port={{ seaweedfs_s3_port }}"
        - "-s3.config={{ seaweedfs_config_dir }}/s3.json"
        - "-master.volumeSizeLimitMB={{ seaweedfs_volume_size_mb }}"
        - "-volume.max={{ seaweedfs_volume_max }}"
        - "-metricsPort={{ seaweedfs_metrics_port }}"
      volumes:
        - "{{ seaweedfs_data_dir }}:{{ seaweedfs_data_dir }}"
        - "{{ seaweedfs_config_dir }}:{{ seaweedfs_config_dir }}:ro"   # master.toml, security.toml: weed's config search path
      ulimits: ["nofile:65536:65536"]
      restart: >-
        {{ seaweedfs_cfg_s3 is changed or seaweedfs_cfg_master is changed or seaweedfs_cfg_security is changed }}
    seaweedfs_admin_ctr:
      name: "{{ seaweedfs_admin_container }}"
      image: "{{ seaweedfs_image }}"
      read_only: true                 # SEC-22: data and configuration are host directories
      tmpfs: ["/tmp:rw,size=256m"]     # weed's sockets and its own log files (about 1 MB a day)
      network_mode: host
      user: "{{ seaweedfs_run_as }}"
      entrypoint: ["{{ seaweedfs_bin }}"]
      command:
        - admin
        - "-ip={{ seaweedfs_ip }}"
        - "-port={{ seaweedfs_admin_port }}"
        - "-master=localhost:{{ seaweedfs_master_port }}"
        - "-dataDir={{ seaweedfs_admin_data_dir }}"
      # The console login reaches the process through its environment (WEED_ADMIN_USER /
      # WEED_ADMIN_PASSWORD, supported since 4.48) — never as an argument: an argument is
      # visible in `docker inspect` and in every process list (SEC-17).
      env:
        WEED_ADMIN_USER: "{{ (seaweedfs_console | default({})).username | default('') }}"
        WEED_ADMIN_PASSWORD: "{{ (seaweedfs_console | default({})).password | default('') }}"
      volumes:
        - "{{ seaweedfs_admin_data_dir }}:{{ seaweedfs_admin_data_dir }}"
        - "{{ seaweedfs_config_dir }}:{{ seaweedfs_config_dir }}:ro"
    seaweedfs_backup_ctr:
      name: "{{ seaweedfs_backup_container }}"
      image: "{{ seaweedfs_image }}"
      read_only: true                 # SEC-22: data and configuration are host directories
      tmpfs: ["/tmp:rw,size=256m"]     # weed's sockets and its own log files (about 1 MB a day)
      network_mode: host
      user: "{{ seaweedfs_run_as }}"
      # filer.backup reads its checkpoint from the filer at start; when the filer does not answer
      # yet it starts from 1970 and replays the whole metadata log (4.47, and upstream master on
      # 2026-10-01 — this replayed a month to Contabo at the switch-over). Docker starts every
      # container at once on a reboot, so the wait is in the container: the backup starts only
      # once the filer's gRPC port answers.
      entrypoint: [/bin/sh, -c]
      command:
        - >-
          until nc -z 127.0.0.1 {{ seaweedfs_filer_port | int + seaweedfs_grpc_offset | int }}; do sleep 2; done;
          exec {{ seaweedfs_bin }} filer.backup -filer=localhost:{{ seaweedfs_filer_port }}
          -filerPath={{ seaweedfs_offsite_filer_path }}{{ (' -timeAgo=' ~ seaweedfs_backup_time_ago) if seaweedfs_backup_time_ago | length > 0 else '' }}
      volumes:
        - "{{ seaweedfs_config_dir }}:{{ seaweedfs_config_dir }}:ro"   # replication.toml (the Contabo sink), security.toml
        - "/etc/ssl/certs:/etc/ssl/certs:ro"
      restart: "{{ seaweedfs_cfg_replication is changed or seaweedfs_cfg_security is changed }}"
  no_log: true   # the admin console's login is part of its command

- name: "SeaweedFS | The containers (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  when: not (ansible_check_mode and (docker_engine_install | default({})) is changed)   # a first-install dry-run has no engine
  vars:
    service_scaffold_def:
      name: seaweedfs
      containers: >-
        {{ [seaweedfs_server_ctr]
           + ([seaweedfs_admin_ctr] if seaweedfs_admin_enabled | bool else [])
           + ([seaweedfs_backup_ctr] if seaweedfs_offsite_enabled | bool else []) }}

- name: "SeaweedFS | Wait for the S3 gateway to answer"
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ seaweedfs_s3_port }}/"
    status_code: [200, 403]
  register: seaweedfs_s3_ready
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  until: seaweedfs_s3_ready.status in [200, 403]
  retries: 40
  delay: 3

- name: "SeaweedFS | External bucket mirrors (seaweedfs_mirrors)"
  ansible.builtin.include_tasks: mirrors.yml
  when: seaweedfs_mirrors | length > 0

- name: "SeaweedFS | Wait for the admin dashboard to answer"
  ansible.builtin.uri:
    url: "http://{{ seaweedfs_ip }}:{{ seaweedfs_admin_port }}/"   # bound to the SVC address since 4.47 (login redirect = 307)
    status_code: [200, 302, 307, 401, 403]
  register: seaweedfs_admin_ready
  check_mode: false  # read-only GET: must run under --check too (a later task reads its result)
  until: seaweedfs_admin_ready.status in [200, 302, 307, 401, 403]
  retries: 15
  delay: 3
  when: seaweedfs_admin_enabled | bool

- name: "SeaweedFS | The native install (retired)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: native_retire
  vars:
    service_scaffold_native: "{{ seaweedfs_native }}"

- name: "SeaweedFS | Publish the S3 API via Traefik (internal-only)"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: seaweedfs-s3
    traefik_route_fqdn: "{{ seaweedfs_fqdn }}"
    traefik_route_backend_url: "http://{{ seaweedfs_ip }}:{{ seaweedfs_s3_port }}"
    traefik_route_internal_only: true
  tags: [seaweedfs, route]

- name: "SeaweedFS | Publish the admin UI via Traefik (Authentik SSO + internal)"
  ansible.builtin.include_role:
    name: traefik_route
    apply:
      tags: [route]
  vars:
    traefik_route_name: seaweedfs-admin
    traefik_route_fqdn: "{{ seaweedfs_admin_fqdn }}"
    traefik_route_backend_url: "http://{{ seaweedfs_ip }}:{{ seaweedfs_admin_port }}"
    traefik_route_internal_only: true
    traefik_route_forward_auth: true
  when: seaweedfs_admin_enabled | bool
  tags: [seaweedfs, route]

- name: "SeaweedFS | Host firewall rules for the listeners (host network; when ufw is active)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules: "{{ seaweedfs_firewall_rules }}"
  tags: [seaweedfs, firewall]
