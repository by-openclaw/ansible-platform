---
# One object written into a scratch bucket reads back; the bucket is removed again.
# BEFORE a rotation it runs WITHOUT the SSE header (seaweedfs_sse_proof_with_header: false): it
# proves the tooling works while writing nothing that is bound to the key about to be replaced
# (the offsite replication would have to decrypt such an object with a key it no longer has).
# AFTER the rotation it runs WITH the header: it proves the gateway uses the key that is in Vault.
- name: "SSE proof | A scratch bucket"
  amazon.aws.s3_bucket:
    endpoint_url: "{{ seaweedfs_s3_local_url }}"
    access_key: "{{ seaweedfs_creds.admin_access_key }}"
    secret_key: "{{ seaweedfs_creds.admin_secret_key }}"
    region: "{{ seaweedfs_s3_region }}"
    name: "{{ seaweedfs_sse_check_bucket }}"
    state: present
  no_log: true

- name: "SSE proof | Write, read back and remove an object"
  block:
    - name: "SSE proof | Write it (server-side encryption asked for: {{ seaweedfs_sse_proof_with_header | bool }})"
      amazon.aws.s3_object:
        endpoint_url: "{{ seaweedfs_s3_local_url }}"
        access_key: "{{ seaweedfs_creds.admin_access_key }}"
        secret_key: "{{ seaweedfs_creds.admin_secret_key }}"
        region: "{{ seaweedfs_s3_region }}"
        bucket: "{{ seaweedfs_sse_check_bucket }}"
        object: "{{ seaweedfs_sse_check_object }}"
        content: "{{ seaweedfs_sse_check_content }}"
        mode: put
        encrypt: "{{ seaweedfs_sse_proof_with_header | bool }}"
        encryption_mode: AES256
        permission: []
      no_log: true

    - name: "SSE proof | Read it back"
      amazon.aws.s3_object:
        endpoint_url: "{{ seaweedfs_s3_local_url }}"
        access_key: "{{ seaweedfs_creds.admin_access_key }}"
        secret_key: "{{ seaweedfs_creds.admin_secret_key }}"
        region: "{{ seaweedfs_s3_region }}"
        bucket: "{{ seaweedfs_sse_check_bucket }}"
        object: "{{ seaweedfs_sse_check_object }}"
        mode: getstr
      register: seaweedfs_sse_readback
      changed_when: false
      no_log: true

    - name: "SSE proof | It is the content that was written"
      ansible.builtin.assert:
        that: seaweedfs_sse_readback.contents == seaweedfs_sse_check_content
        fail_msg: "the object written into the scratch bucket does not read back"
        quiet: true
  always:
    - name: "SSE proof | Remove the scratch bucket and its object"
      amazon.aws.s3_bucket:
        endpoint_url: "{{ seaweedfs_s3_local_url }}"
        access_key: "{{ seaweedfs_creds.admin_access_key }}"
        secret_key: "{{ seaweedfs_creds.admin_secret_key }}"
        region: "{{ seaweedfs_s3_region }}"
        name: "{{ seaweedfs_sse_check_bucket }}"
        state: absent
        force: true
      no_log: true
