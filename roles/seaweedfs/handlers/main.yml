---
- name: Restart seaweedfs
  ansible.builtin.systemd_service:
    name: seaweedfs
    state: restarted
    daemon_reload: true

- name: Restart seaweedfs-admin
  ansible.builtin.systemd_service:
    name: seaweedfs-admin
    state: restarted
    daemon_reload: true

- name: Restart seaweedfs-backup
  ansible.builtin.systemd_service:
    name: seaweedfs-backup
    state: restarted
    daemon_reload: true
