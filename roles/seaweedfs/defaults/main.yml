---
# ==============================================================================
# Role: seaweedfs — S3 object-storage backend (replaces EOL MinIO), on
# lxc-seaweedfs-01 (SVC). Native `weed` binary + systemd, combined server
# (master+volume+filer+S3) with data on the persistent ZFS bind-mount /data.
# Backend infra: apps authenticate with S3 access keys (no SSO). Upgrade = bump
# seaweedfs_version. Data survives LXC rebuild (ZFS dataset tank/data/seaweedfs).
# ==============================================================================
# renovate: datasource=docker depName=chrislusf/seaweedfs
seaweedfs_version: "4.47"                # pinned (never latest)
seaweedfs_url: "https://github.com/seaweedfs/seaweedfs/releases/download/{{ seaweedfs_version }}/linux_amd64_full.tar.gz"
seaweedfs_bin: "/usr/local/bin/weed"

seaweedfs_user: "seaweedfs"
seaweedfs_group: "seaweedfs"
seaweedfs_data_dir: "/data"              # the persistent ZFS bind-mount
seaweedfs_config_dir: "/etc/seaweedfs"

# Addressing / ports. Bind v4 (Traefik reaches the S3 gateway over v4; the public
# name {{ platform_service_fqdns.seaweedfs }} is dual-stack at Traefik). Ports >1024 → non-root weed.
seaweedfs_ip: "{{ hostvars[groups['seaweedfs'] | first].ansible_host }}"
seaweedfs_bind: "0.0.0.0"
seaweedfs_master_port: 9333
seaweedfs_volume_port: 8080
seaweedfs_filer_port: 8888
seaweedfs_s3_port: 8333
seaweedfs_fqdn: "{{ platform_service_fqdns.seaweedfs }}"          # S3 API endpoint (engine-agnostic name; via Traefik, internal-only)
# --- weed admin — management dashboard (buckets, S3 identities, volumes) ---------
# Native SeaweedFS admin UI with built-in login (adminUser/adminPassword from the
# secret). VPN-only via Traefik. This is the "console" for browsing/managing storage.
seaweedfs_admin_enabled: true
seaweedfs_admin_port: 23646
seaweedfs_admin_data_dir: "/data/admin"
seaweedfs_admin_fqdn: "seaweedfs.{{ platform_domain }}"
seaweedfs_admin_group: "{{ platform_service_groups.seaweedfs.admin }}"   # Authentik access group (forwardAuth)
# SeaweedFS ≥ 4.47 binds `weed admin` to loopback unless a local admin credential is set
# (or -allowInsecureBind, which is refused here: no unauthenticated admin API on the network).
# The credential is minted once in Vault and handed to the unit through a root-only
# environment file; Authentik forwardAuth stays in front, the local login is the second door.
seaweedfs_admin_user: "{{ platform_org }}"
seaweedfs_console_vault_path: "{{ platform_env | default('prod') }}/seaweedfs/console"   # the console login; {env}/seaweedfs/admin is the S3 admin identity
seaweedfs_admin_env_file: "/etc/seaweedfs/admin.env"
seaweedfs_metrics_port: 9327             # Prometheus → Grafana (parked monitoring stack)

# Volume sizing: one SeaweedFS "collection" per S3 bucket, each needing writable
# volumes. Small volumes + auto-max (0 = free disk / volume size) so every bucket
# can grow independently within the 250G /data quota (default 30G volumes exhausted
# the slots after the first bucket → "No writable volumes").
seaweedfs_volume_size_mb: 1024
seaweedfs_volume_max: 0

# Controller-side secret store (S3 identities: access/secret keys).
seaweedfs_secret_dir: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets"
seaweedfs_secret_file: "fabric/infra-seaweedfs.json"

# NOTE: app buckets + scoped access keys are NOT created here (separation of
# concerns, same as the postgresql role). Each consuming app (GitLab, backups)
# provisions its OWN bucket + scoped S3 identity at install time via the reusable
# `seaweedfs_bucket` role (weed shell: s3.bucket.create + s3.configure -apply,
# dynamic, no restart). This role only stands up the S3 service + an admin identity.

# --- Tier 3: offsite backup to Contabo S3 (weed filer.backup, one-way) -----------
# Local ZFS stays authoritative; a continuous incremental copy of /buckets is
# pushed to Contabo (survives site loss). NOT tiering — remote is never in the
# read/write path. Synology (tier 2) is added once SVC->NAS routing exists.
seaweedfs_offsite_enabled: true
seaweedfs_offsite_secret_file: "fabric/infra-seaweedfs-offsite.json"
seaweedfs_offsite_filer_path: "/buckets"
seaweedfs_offsite_is_incremental: false

# --- Encryption at rest (SSE-S3) ------------------------------------------------
# SeaweedFS honours S3 SSE-S3 (x-amz-server-side-encryption: AES256) using a KEK
# (envelope encryption). Required for multipart uploads when clients request SSE
# (amazon.aws.s3_object sends encrypt=true by default). KEK from the secret store.
seaweedfs_sse_enabled: true

# Host firewall (ufw) rules for this role's native listeners — applied by roles/host_firewall when ufw is active
seaweedfs_grpc_offset: 10000               # SeaweedFS gRPC = port + 10000
seaweedfs_firewall_rules:
  - { port: "{{ seaweedfs_master_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS master" }
  - { port: "{{ seaweedfs_master_port + seaweedfs_grpc_offset }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS master gRPC" }
  - { port: "{{ seaweedfs_volume_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS volume" }
  - { port: "{{ seaweedfs_volume_port + seaweedfs_grpc_offset }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS volume gRPC" }
  - { port: "{{ seaweedfs_filer_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS filer" }
  - { port: "{{ seaweedfs_filer_port + seaweedfs_grpc_offset }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS filer gRPC" }
  - { port: "{{ seaweedfs_s3_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS S3 (Traefik, PBS, Harbor, Nextcloud)" }
  - { port: "{{ seaweedfs_s3_port + seaweedfs_grpc_offset }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS S3 gRPC" }
  - { port: "{{ seaweedfs_admin_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS admin UI (Traefik)" }
  - { port: "{{ seaweedfs_metrics_port }}", proto: tcp, from: "{{ platform_trusted_cidrs }}", comment: "SeaweedFS metrics" }
