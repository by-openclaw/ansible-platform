---
# Firewall aliases — catalog-driven, idempotent, lib-first.
#
# Data comes from the CATALOG (`opn_aliases` in group_vars/opnsense.yml), the single
# source of truth for every alias (naming/0003). Every catalog item declares its
# contract module in `ref.ansible_module`; for aliases that is
# by_systems.opnsense.opnsense_fw_alias (lib-opnsense FwAliasManager underneath),
# which — unlike the previous ansibleguy path — handles network GROUPS (members
# referenced by name), empty host aliases (e.g. host_internet_request, filled by
# the IBR service) and check mode without server-side member validation. The lib
# applies `firewall/alias/reconfigure` itself after a change, so no extra reload.
#
# Content: the catalog may give a string or a list; OPNsense stores one entry per
# line, so lists are joined with "\n". Order in the catalog = apply order (groups
# are listed after their members).
#
# Scope a single concern with:
#   -e '{"opn_fw_only": ["port_crowdsec_lapi", "host4_crowdsec"]}'
# Empty (default) = converge the entire catalog (gated by opn_fw_confirm_full in main.yml).

- name: "Aliases | Select the aliases in scope"
  ansible.builtin.set_fact:
    opnsense_aliases_scoped: >-
      {{ opn_aliases
         if not (opn_fw_only | default([]))
         else (opn_aliases | selectattr('name', 'in', opn_fw_only) | list) }}
  delegate_to: localhost
  become: false
  tags: [firewall, aliases]

- name: "Aliases | Report scope"
  ansible.builtin.debug:
    msg: >-
      {{ ('FULL catalog: ' ~ (opnsense_aliases_scoped | length) ~ ' aliases')
         if not (opn_fw_only | default([]))
         else ('SCOPED: ' ~ (opnsense_aliases_scoped | map(attribute='name') | join(', ')
               if opnsense_aliases_scoped else 'nothing matched ' ~ (opn_fw_only | join(', ')))) }}
  delegate_to: localhost
  become: false
  tags: [firewall, aliases]

- name: "Aliases | Ensure firewall aliases match the catalog (by_systems.opnsense / lib-opnsense)"
  by_systems.opnsense.opnsense_fw_alias:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    content: "{{ (item.content | join('\n')) if (item.content is sequence and item.content is not string) else (item.content | default('')) }}"
    description: "{{ item.description | default(omit) }}"
    enabled: "{{ item.enabled | default(true) | bool }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opnsense_aliases_scoped }}"
  loop_control:
    label: "{{ item.name }}"
  register: opnsense_alias_apply
  delegate_to: localhost
  become: false
  tags: [firewall, aliases]
