---
# Firewall aliases — all rules reference aliases, never hardcoded IPs/ports
# Alias definitions are the source of truth (ADR-0015)

- name: Ensure network aliases exist
  puzzle.opnsense.firewall_aliases:
    name: "{{ item.name }}"
    type: "{{ item.type }}"
    content: "{{ item.content }}"
    description: "{{ item.description }}"
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present
  loop:
    - name: "alias_net_mgmt"
      type: "network"
      content: "10.1.1.0/24"
      description: "MGMT zone — VLAN 310"
    - name: "alias_net_dmz"
      type: "network"
      content: "10.1.2.0/24"
      description: "DMZ zone — VLAN 320"
    - name: "alias_net_svc"
      type: "network"
      content: "10.1.3.0/24"
      description: "SVC zone — VLAN 330"
    - name: "alias_net_vpn"
      type: "network"
      content: "10.99.0.0/24"
      description: "WireGuard tunnel peers"
    - name: "alias_port_wireguard"
      type: "port"
      content: "51820"
      description: "WireGuard UDP"
    - name: "alias_port_https"
      type: "port"
      content: "443"
      description: "HTTPS"
    - name: "alias_port_http"
      type: "port"
      content: "80"
      description: "HTTP"
  loop_control:
    label: "{{ item.name }}"
