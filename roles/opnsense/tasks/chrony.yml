---
# Chrony (os-chrony) — THE time sync; the base ntpd is retired (see tasks/_archive/ntp.yml).
# Contract: by_systems.opnsense modules (lib-opnsense underneath). Chrony REPLACES ntpd:
# we enable chrony, then stop the legacy daemon so the two don't both bind :123.
# Serves NTP to opnsense_chrony_allowed_networks (empty list = client-only).

- name: Chrony | Ensure chronyd settings match the catalog (peers, served networks)
  by_systems.opnsense.opnsense_chrony_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: true
    # NTP serving port — MUST be 123 (standard) to serve clients. OPNsense's field
    # defaults to 323 (chrony's cmdport) which only listens locally.
    ntp_port: "123"
    nts_client: false
    nts_nocert: false
    peers: "{{ opnsense_chrony_peers }}"
    fallback_peers: ""
    allowed_networks: "{{ opnsense_chrony_allowed_networks | default([]) }}"
  delegate_to: localhost
  become: false
  tags: [ntp, chrony]

- name: Chrony | Ensure chronyd is running
  by_systems.opnsense.opnsense_chrony_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: running
  delegate_to: localhost
  become: false
  tags: [ntp, chrony]

- name: Chrony | Stop legacy ntpd (chrony owns time sync now)
  # core/service has no lib manager yet (CoreServiceManager — ansible-platform #301 / lib #97);
  # a stop is idempotent on an already-stopped daemon.
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/core/service/stop/ntpd"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 400, 404]
  failed_when: false
  changed_when: false
  delegate_to: localhost
  become: false
  tags: [ntp, chrony]
