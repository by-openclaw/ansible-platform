---
# NTP: OPNsense as NTP server for all VMs, upstream = pool.ntp.org

- name: Ensure NTP servers configured
  puzzle.opnsense.ntp:
    servers: "{{ opnsense_ntp_servers }}"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
