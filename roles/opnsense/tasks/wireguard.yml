---
# WireGuard — server + peers (issue #88)
# Instance: wg-byresearch-01 | Subnet: 10.100.0.0/24 | Port: 51820
# Server keys: vault_opnsense_wg_byresearch01_server_{priv,pub}key
# Peer pubkeys: vault_opnsense_wg_peer_{desk03,mobile,rune}_pubkey
# All tasks idempotent via puzzle.opnsense collection (state: present)

- name: WireGuard | Ensure server instance configured ({{ opnsense_wireguard_instance_name }})
  puzzle.opnsense.wireguard_server:
    name: "{{ opnsense_wireguard_instance_name }}"
    tunnel_address: "{{ opnsense_wireguard_server_ip }}/24"
    port: "{{ opnsense_wireguard_port }}"
    private_key: "{{ opnsense_wireguard_private_key }}"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present
  tags: [wireguard, wireguard-server]

- name: WireGuard | Ensure peers configured
  puzzle.opnsense.wireguard_peer:
    name: "{{ item.name }}"
    public_key: "{{ item.public_key }}"
    allowed_ips: "{{ item.tunnel_ip }}"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present
  loop: "{{ opnsense_wireguard_peers }}"
  loop_control:
    label: "{{ item.name }}"
  tags: [wireguard, wireguard-peers]

- name: WireGuard | Ensure WAN firewall rule allows UDP {{ opnsense_wireguard_port }}
  puzzle.opnsense.firewall_rule:
    interface: "wan"
    direction: "in"
    action: "pass"
    protocol: "udp"
    destination_port: "{{ opnsense_wireguard_port }}"
    description: "WireGuard VPN inbound ({{ opnsense_wireguard_instance_name }})"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present
  tags: [wireguard, wireguard-firewall]

- name: WireGuard | Apply OPNsense reconfigure
  puzzle.opnsense.opnsense_command:
    command: "wireguardservice restart"
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
  tags: [wireguard, wireguard-apply]

- name: WireGuard | Generate client configs from template
  ansible.builtin.template:
    src: wireguard-client.conf.j2
    dest: "{{ playbook_dir }}/files/client-configs/{{ opnsense_wireguard_instance_name }}-{{ item.name }}.conf"
    mode: "0600"
  loop: "{{ opnsense_wireguard_peers }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  tags: [wireguard, wireguard-client-configs]
