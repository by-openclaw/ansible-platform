---
# WireGuard: server + peers
# Server private key from vault (vault_opnsense_wireguard_private_key)
# Peer public keys from vault (vault_wg_peer_*_pubkey)
# Per-device peers — one keypair per device, private key never leaves the device

- name: Ensure WireGuard server instance configured
  puzzle.opnsense.wireguard_server:
    name: "wg-server"
    tunnel_address: "{{ opnsense_wireguard_server_ip }}/24"
    port: "{{ opnsense_wireguard_port }}"
    private_key: "{{ opnsense_wireguard_private_key }}"
    dns_servers: "{{ opnsense_host }}"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present

- name: Ensure WireGuard peers configured
  puzzle.opnsense.wireguard_peer:
    name: "{{ item.name }}"
    public_key: "{{ item.public_key }}"
    allowed_ips: "{{ item.tunnel_ip }}"
    enabled: true
    api_host: "{{ opnsense_host }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ not opnsense_verify_ssl }}"
    state: present
  loop: "{{ opnsense_wireguard_peers }}"
  loop_control:
    label: "{{ item.name }}"
