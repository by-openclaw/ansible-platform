---
# Monit (os-monit) — process-down alerts by e-mail through OUR mail relay.
# Contract: by_systems.opnsense monit modules (lib-opnsense MonitSettings/Alert/Test/Service
# managers underneath); each module applies (monit reconfigure) on change, and the daemon task
# at the end keeps Monit RUNNING — the plugin's reconfigure regenerates monitrc, syntax-tests it
# and only then (re)starts; a refused config answers HTTP 200 `status: failed` (lib #107 raises).
# The SMTP settings come from Vault via the playbook's pre-play (opnsense_monitchk_smtp).

- name: Monit | Require the SMTP settings (set by the vault pre-play)
  ansible.builtin.assert:
    that: opnsense_monitchk_smtp is defined
    fail_msg: >-
      opnsense_monitchk_smtp not set — run playbooks/opnsense.yml (its vault
      pre-play reads prod/mail/opnsense), not the role in isolation.
    quiet: true
  tags: [services, monit]

- name: Monit | Ensure general settings (SMTP via our relay + enable)
  by_systems.opnsense.opnsense_monit_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: true
    interval: "{{ opnsense_monit_interval | string }}"
    startdelay: "{{ opnsense_monit_startdelay | string }}"
    mailserver: "{{ opnsense_monitchk_smtp.smtp_host }}"
    smtp_port: "{{ opnsense_monitchk_smtp.smtp_port | string }}"
    username: "{{ opnsense_monitchk_smtp.smtp_username }}"
    password: "{{ opnsense_monitchk_smtp.smtp_password }}"
    ssl: true                       # 587 STARTTLS (monit negotiates TLS; SVC-12 no plaintext)
    sslversion: auto
    sslverify: true
    httpd_enabled: false
    httpd_port: "2812"
    mmonit_timeout: "5"
    mmonit_register_credentials: true
  no_log: true
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure the alert recipient (verified from-domain, hostname in the subject)
  by_systems.opnsense.opnsense_monit_alert:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    recipient: "{{ opnsense_monitchk_smtp.to_address }}"
    enabled: true
    noton: false
    events: ""
    reminder: "0"
    format: |-
      from: {{ opnsense_monitchk_smtp.from_address }}
      subject: [{{ inventory_hostname }}] $SERVICE $EVENT
      message: Monit on $HOST: $SERVICE $EVENT at $DATE -- $DESCRIPTION
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure the 'ProcessDown' test exists
  by_systems.opnsense.opnsense_monit_test:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: ProcessDown
    type: Custom          # free-form condition → Custom (Existence would coerce and never converge)
    condition: does not exist
    action: alert
  register: opnsense_monit_processdown_res
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Resolve the ProcessDown test uuid (read-only lookup)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchTest?searchPhrase=ProcessDown"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_tests
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure a process-down check per critical service
  by_systems.opnsense.opnsense_monit_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    enabled: true
    type: process
    pidfile: "{{ item.pidfile }}"
    match: ""
    tests: "{{ (opnsense_monitchk_tests.json.rows | selectattr('name', 'equalto', 'ProcessDown') | map(attribute='uuid') | first) | default('') }}"
  loop: "{{ opnsense_monit_processes }}"
  loop_control:
    label: "{{ item.name }}"
  register: opnsense_monit_processes_res
  delegate_to: localhost
  become: false
  tags: [services, monit]

# --- remote-host probes (SVC daemons reachable from the FW, e.g. the resolver) ------------
- name: Monit | Ensure the remote-host tests exist
  by_systems.opnsense.opnsense_monit_test:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    type: "{{ item.type | default('Custom') }}"   # must equal the type OPNsense derives from the condition
    condition: "{{ item.condition }}"
    action: "{{ item.action | default('alert') }}"
  loop: "{{ opnsense_monit_host_tests }}"
  loop_control:
    label: "{{ item.name }}"
  register: opnsense_monit_host_tests_res
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Resolve the test uuids (read-only lookup)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchTest?searchPhrase="
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_all_tests
  check_mode: false   # read-only GET — must also run under --check
  when: opnsense_monit_hosts | length > 0
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure a remote-host check per probed daemon
  by_systems.opnsense.opnsense_monit_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    description: "{{ item.description | default('') }}"
    enabled: true
    type: host
    address: "{{ item.address }}"
    tests: "{{ (opnsense_monitchk_all_tests.json.rows | selectattr('name', 'equalto', item.test) | map(attribute='uuid') | first) | default('') }}"
  loop: "{{ opnsense_monit_hosts }}"
  loop_control:
    label: "{{ item.name }} ({{ item.address }})"
  register: opnsense_monit_hosts_res
  delegate_to: localhost
  become: false
  tags: [services, monit]

# A created/changed check reaches the running daemon only through a STOP + START:
# "reconfigured" regenerates and syntax-checks monitrc but the daemon keeps its old
# config, and a reload does not pick up new checks either (verified 2026-09-19: the
# resolver probes were stored, rendered, and not monitored until a restart).
# -e opn_monit_restart=true forces it once.
- name: Monit | Stop the daemon when checks changed (part 1 of the restart)
  by_systems.opnsense.opnsense_monit_daemon:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: stopped
  when: >-
    (opnsense_monit_processdown_res is changed) or (opnsense_monit_processes_res is changed)
    or (opnsense_monit_host_tests_res is changed) or (opnsense_monit_hosts_res is changed)
    or (opn_monit_restart | default(false) | bool)
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure the Monit daemon is running (config regenerated + syntax-tested by the plugin)
  by_systems.opnsense.opnsense_monit_daemon:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: running
  delegate_to: localhost
  become: false
  tags: [services, monit]

# Deliberate test mail: Monit mails an "Monit instance changed" alert to every recipient when the
# daemon STARTS (a reload does not). `-e opn_monit_test_mail=true` stops and starts the daemon on
# purpose; never idempotent by design, never part of a plain converge.
- name: Monit | Test alert — stop the daemon (-e opn_monit_test_mail=true)
  by_systems.opnsense.opnsense_monit_daemon:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: stopped
  when: opn_monit_test_mail | default(false) | bool
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Test alert — start the daemon again (mails 'Monit instance changed')
  by_systems.opnsense.opnsense_monit_daemon:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: running
  when: opn_monit_test_mail | default(false) | bool
  delegate_to: localhost
  become: false
  tags: [services, monit]
