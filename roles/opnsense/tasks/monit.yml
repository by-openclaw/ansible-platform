---
# Monit (os-monit) — process-down alerts by e-mail through OUR mail relay.
# Contract: by_systems.opnsense monit modules (lib-opnsense MonitSettings/Alert/Test/Service
# managers underneath); each module applies (monit reconfigure) on change. The SMTP settings
# come from Vault via the playbook's pre-play (opnsense_monitchk_smtp).

- name: Monit | Require the SMTP settings (set by the vault pre-play)
  ansible.builtin.assert:
    that: opnsense_monitchk_smtp is defined
    fail_msg: >-
      opnsense_monitchk_smtp not set — run playbooks/opnsense.yml (its vault
      pre-play reads prod/mail/opnsense), not the role in isolation.
    quiet: true
  tags: [services, monit]

- name: Monit | Ensure general settings (SMTP via our relay + enable)
  by_systems.opnsense.opnsense_monit_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: true
    interval: "{{ opnsense_monit_interval | string }}"
    startdelay: "{{ opnsense_monit_startdelay | string }}"
    mailserver: "{{ opnsense_monitchk_smtp.smtp_host }}"
    smtp_port: "{{ opnsense_monitchk_smtp.smtp_port | string }}"
    username: "{{ opnsense_monitchk_smtp.smtp_username }}"
    password: "{{ opnsense_monitchk_smtp.smtp_password }}"
    ssl: true                       # 587 STARTTLS (monit negotiates TLS; SVC-12 no plaintext)
    sslversion: auto
    sslverify: true
    httpd_enabled: false
    httpd_port: "2812"
    mmonit_timeout: "5"
    mmonit_register_credentials: true
  no_log: true
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure the alert recipient (verified from-domain, hostname in the subject)
  by_systems.opnsense.opnsense_monit_alert:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    recipient: "{{ opnsense_monitchk_smtp.to_address }}"
    enabled: true
    noton: false
    events: ""
    reminder: "0"
    format: |-
      from: {{ opnsense_monitchk_smtp.from_address }}
      subject: [{{ inventory_hostname }}] $SERVICE $EVENT
      message: Monit on $HOST: $SERVICE $EVENT at $DATE -- $DESCRIPTION
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure the 'ProcessDown' test exists
  by_systems.opnsense.opnsense_monit_test:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: ProcessDown
    type: Custom          # free-form condition → Custom (Existence would coerce and never converge)
    condition: does not exist
    action: alert
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Resolve the ProcessDown test uuid (read-only lookup)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchTest?searchPhrase=ProcessDown"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_tests
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure a process-down check per critical service
  by_systems.opnsense.opnsense_monit_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    enabled: true
    type: process
    pidfile: "{{ item.pidfile }}"
    match: ""
    tests: "{{ (opnsense_monitchk_tests.json.rows | selectattr('name', 'equalto', 'ProcessDown') | map(attribute='uuid') | first) | default('') }}"
  loop: "{{ opnsense_monit_processes }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  tags: [services, monit]
