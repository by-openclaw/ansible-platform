---
# Monit — system/service monitoring with email alerts via OUR Mailcow (same
# flow as every service: opnsense@{domain} submits on 587/STARTTLS, alerts go
# to the central alerts@ sink). Resend is retired from this path (its creds
# stay in Vault under resend/by-research for other uses).
# Idempotent via OPNsense REST API (root SSH blocked → API only).
#
# SMTP creds = the opnsense service mailbox, read from Vault at apply time
# (prod/mail/opnsense, written by the mailbox concern-role — SVC-11).

# opnsense_monitchk_smtp is assembled by the pre-play in playbooks/opnsense.yml
# (hosts: vault) — the Configure play runs connection:local, which overrides
# delegation transport, so Vault reads cannot happen from inside this play.
- name: Monit | Require the SMTP settings (set by the vault pre-play)
  ansible.builtin.assert:
    that: opnsense_monitchk_smtp is defined
    fail_msg: >-
      opnsense_monitchk_smtp not set — run playbooks/opnsense.yml (its vault
      pre-play reads prod/mail/opnsense), not the role in isolation.
    quiet: true
  tags: [services, monit]

- name: Monit | Configure general (SMTP via our Mailcow + enable)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/set"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      monit:
        general:
          enabled: "1"
          interval: "{{ opnsense_monit_interval | string }}"
          startdelay: "{{ opnsense_monit_startdelay | string }}"
          mailserver: "{{ opnsense_monitchk_smtp.smtp_host }}"
          port: "{{ opnsense_monitchk_smtp.smtp_port }}"
          username: "{{ opnsense_monitchk_smtp.smtp_username }}"
          password: "{{ opnsense_monitchk_smtp.smtp_password }}"
          ssl: "1"                       # 587 STARTTLS (monit negotiates TLS; SVC-12 no plaintext)
          sslversion: "auto"
          sslverify: "1"
          httpdEnabled: "0"
          httpdPort: "2812"
          mmonitTimeout: "5"
          mmonitRegisterCredentials: "1"
    status_code: [200, 400]
  no_log: true
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Fetch existing alerts
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchAlert"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_alerts
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure alert is enabled with recipient + verified from-domain
  ansible.builtin.uri:
    url: >-
      {{ opnsense_api_url }}/api/monit/settings/{{
        ('setAlert/' ~ (opnsense_monitchk_alerts.json.rows | first).uuid)
        if opnsense_monitchk_alerts.json.rows | length > 0 else 'addAlert' }}
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      alert:
        enabled: "1"
        recipient: "{{ opnsense_monitchk_smtp.to_address }}"
        noton: "0"
        events: ""
        reminder: "0"
        # Literal block = LF newlines only. CR (\r) breaks Monit's parser.
        format: |-
          from: {{ opnsense_monitchk_smtp.from_address }}
          subject: [{{ opnsense_hostname }}] $SERVICE $EVENT
          message: Monit on $HOST: $SERVICE $EVENT at $DATE -- $DESCRIPTION
    status_code: [200, 400]
  when: >-
    opnsense_monitchk_alerts.json.rows | length == 0 or
    (opnsense_monitchk_alerts.json.rows | selectattr('recipient', 'equalto', opnsense_monitchk_smtp.to_address)
       | selectattr('enabled', 'equalto', '1') | list | length == 0)
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Fetch existing tests
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchTest"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_tests
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure 'ProcessDown' test exists
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/addTest"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      test: {name: "ProcessDown", condition: "does not exist", action: "alert"}
    status_code: [200, 400]
  when: opnsense_monitchk_tests.json.rows | selectattr('name', 'equalto', 'ProcessDown') | list | length == 0
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Re-fetch tests (resolve ProcessDown uuid)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchTest"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_tests2
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Fetch existing services
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/searchService"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_monitchk_services
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Ensure process-down check per critical service
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/settings/addService"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      service:
        enabled: "1"
        name: "{{ item.name }}"
        type: "process"
        pidfile: "{{ item.pidfile }}"
        match: ""
        tests: "{{ (opnsense_monitchk_tests2.json.rows | selectattr('name', 'equalto', 'ProcessDown') | first).uuid }}"
    status_code: [200, 400]
  loop: "{{ opnsense_monit_processes }}"
  loop_control:
    label: "{{ item.name }}"
  when: opnsense_monitchk_services.json.rows | selectattr('name', 'equalto', item.name) | list | length == 0
  register: opnsense_monitchk_svc_added
  delegate_to: localhost
  become: false
  tags: [services, monit]

- name: Monit | Reconfigure (apply + validate)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/monit/service/reconfigure"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 400]
  delegate_to: localhost
  become: false
  tags: [services, monit]
