---
# Hypervisor snapshot of the firewall VM: the rollback of a firmware update. Taken automatically
# before an update is applied; on request with -e opnsense_firmware_snapshot=present|absent
# (absent removes every pre_fw_* snapshot once the update is accepted). Runs on the node that
# hosts the VM (root key, like the other node plays); a firewall that is not a VM of the
# platform node (no opn_pve_vm_name) is skipped.
# Plain `qm` calls on the node; what they print is read here (no shell).
- name: "Firmware | On the hypervisor, as its root"
  delegate_to: "{{ groups['proxmox_nodes'] | first }}"
  become: false
  vars:
    ansible_connection: ssh
    ansible_user: "{{ platform_pve_root_user }}"
    ansible_ssh_private_key_file: "{{ platform_pve_root_key }}"
    ansible_become: false
  block:
    - name: "Firmware | The VMs of the node"
      ansible.builtin.command:
        argv: [qm, list]
      register: opnsense_fw_qm_list
      changed_when: false
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)

    - name: "Firmware | The firewall is a VM of this node"
      ansible.builtin.assert:
        that: opnsense_fw_vmid | length > 0
        fail_msg: "no VM named {{ opn_pve_vm_name }} on this node"
        quiet: true

    - name: "Firmware | Its snapshots"
      ansible.builtin.command:
        argv: [qm, listsnapshot, "{{ opnsense_fw_vmid }}"]
      register: opnsense_fw_qm_snaps
      changed_when: false
      check_mode: false  # read-only probe: must run under --check too (a later task reads its result)

    - name: "Firmware | Snapshot of the firewall VM before the update ({{ opnsense_fw_snapshot_name }})"
      ansible.builtin.command:
        argv:
          - qm
          - snapshot
          - "{{ opnsense_fw_vmid }}"
          - "{{ opnsense_fw_snapshot_name }}"
          - --description
          - "before the firmware update to {{ opnsense_firmware_target | default('the pending release', true) }} (roles/opnsense)"
      changed_when: true
      when:
        - opnsense_fw_snapshot_state != 'absent'
        - opnsense_fw_snapshot_name not in opnsense_fw_snapshots

    - name: "Firmware | Remove the pre-update snapshots (the update is accepted)"
      ansible.builtin.command:
        argv: [qm, delsnapshot, "{{ opnsense_fw_vmid }}", "{{ item }}"]
      loop: "{{ opnsense_fw_snapshots | select('match', opnsense_fw_snapshot_prefix) | list }}"
      changed_when: true
      when: opnsense_fw_snapshot_state == 'absent'
