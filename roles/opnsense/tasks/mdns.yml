---
# mDNS repeater (os-mdns-repeater) — the ADR infra/0004 exception: Bonjour/Avahi discovery between
# the catalog's interfaces (MGMT ↔ media/gaming), nothing else. Contract: by_systems.opnsense modules
# driven by opn_mdns; the plugin itself comes from opnsense_plugins (firmware.yml).

- name: MDNS | Ensure the repeater settings match the catalog (interfaces)
  by_systems.opnsense.opnsense_mdnsrepeater_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: "{{ opn_mdns.enabled | default(true) | bool }}"
    interfaces: "{{ opn_mdns.interfaces | map('extract', opnsense_iface_lookup) | list }}"
    enablecarp: false
  delegate_to: localhost
  become: false
  tags: [mdns]

- name: MDNS | Ensure the repeater is {{ 'running' if (opn_mdns.enabled | default(true) | bool) else 'stopped' }}
  by_systems.opnsense.opnsense_mdnsrepeater_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: "{{ 'running' if (opn_mdns.enabled | default(true) | bool) else 'stopped' }}"
  delegate_to: localhost
  become: false
  tags: [mdns]
