---
# LLDP (os-lldpd) — contract: by_systems.opnsense modules (lib-opnsense underneath).
# LLDP only, announced on INTERNAL interfaces (OOB + LAN_TRUNK + VLANs) — never the
# WAN uplinks, so we don't leak topology to the ISPs. Other discovery protocols
# (CDP/FDP/EDP/SONMP) stay off unless the catalog flips them.

- name: LLDP | Ensure lldpd settings match the catalog (LLDP only, internal interfaces, no WAN)
  by_systems.opnsense.opnsense_lldpd_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: true
    cdp: "{{ opnsense_lldpd_cdp | default(false) | bool }}"
    fdp: "{{ opnsense_lldpd_fdp | default(false) | bool }}"
    edp: "{{ opnsense_lldpd_edp | default(false) | bool }}"
    sonmp: "{{ opnsense_lldpd_sonmp | default(false) | bool }}"
    agentx: false
    interfaces: "{{ opnsense_lldpd_interfaces }}"
  delegate_to: localhost
  become: false
  tags: [services, lldpd]

- name: LLDP | Ensure lldpd is running
  by_systems.opnsense.opnsense_lldpd_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: running
  delegate_to: localhost
  become: false
  tags: [services, lldpd]
