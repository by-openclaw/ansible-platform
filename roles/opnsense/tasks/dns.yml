---
# DNS — Unbound as the FW resolver in the prod chain:
#   AdGuard (clients) -> Unbound (:53) -> dnscrypt-proxy (loopback :53531) -> upstream
#
# Contract: by_systems.opnsense modules (lib-opnsense underneath); the only raw
# call left is a read-only lookup of the DoT list to purge.
#
# Unbound forwards EVERYTHING as PLAINTEXT to the local dnscrypt-proxy listener,
# which does the encrypted upstream (DoH/DoT). Unbound itself must NOT do DoT —
# a DoT (TLS) entry pointed at the plaintext dnscrypt port causes
# "ssl handshake failed: channel closed" and is purged here.
#
# A freshly seeded FW ships with the resolver DISABLED (general.enabled=0): the
# seed owns topology, Ansible owns services — the settings task below is what
# turns Unbound on. Every module applies (reconfigure) on change itself.

- name: DNS | Ensure Unbound general settings match the catalog (enable, port, listeners)
  by_systems.opnsense.opnsense_ub_settings:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    enabled: "{{ opnsense_unbound_enabled | bool }}"
    listen_port: "{{ opnsense_unbound_port | string }}"
    active_interface: "{{ opnsense_unbound_active_interfaces }}"
    dnssec: "{{ opnsense_unbound_dnssec | bool }}"
    stats: "{{ opnsense_unbound_stats | bool }}"
    # NAM-06/08: the asset FQDN is an explicit host override (A/AAAA + PTR from the template); the
    # plugin's own registration of the hostname on EVERY interface (28 addresses on prod, WAN
    # public IPs included) is switched off in the catalog with opnsense_unbound_noregrecords.
    noregrecords: "{{ opnsense_unbound_noregrecords | bool }}"
  delegate_to: localhost
  become: false
  tags: [dns, unbound]

# ── Plaintext forward to dnscrypt-proxy ──────────────────────────────────────
# Same model as DoT on the API (type selects it): type=forward is a PLAINTEXT
# query forward. domain "" = catch-all root forward.
- name: DNS | Ensure plaintext forward(s) to dnscrypt-proxy exist
  by_systems.opnsense.opnsense_ub_forward:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    domain: ""
    server: "{{ item }}"
    type: forward
    forward_port: "{{ opnsense_unbound_dnscrypt_port | string }}"
    enabled: true
    description: "Unbound -> dnscrypt-proxy loopback"
    state: present
  loop: "{{ opnsense_unbound_dnscrypt_servers }}"
  loop_control:
    label: "{{ item }}:{{ opnsense_unbound_dnscrypt_port }}"
  delegate_to: localhost
  become: false
  tags: [dns, unbound]

# ── Purge any DoT (TLS) entries — the chain encrypts at dnscrypt, not unbound ──
- name: DNS | Fetch existing Unbound DoT entries (read-only lookup)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/unbound/settings/searchDot"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_unbound_dots
  delegate_to: localhost
  become: false
  check_mode: false  # read-only GET; must run under --check so .json is populated
  tags: [dns, unbound]

- name: DNS | Remove DoT entries (unbound must not do TLS in the dnscrypt chain)
  by_systems.opnsense.opnsense_ub_dot:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    server: "{{ item.server }}"
    dot_port: "{{ item.port | string }}"
    state: absent
  loop: "{{ (opnsense_unbound_dots.json | default({})).rows | default([]) }}"
  loop_control:
    label: "DoT {{ item.server }}:{{ item.port }}"
  delegate_to: localhost
  become: false
  tags: [dns, unbound]

# ── Daemon state ──────────────────────────────────────────────────────────────
- name: DNS | Ensure the Unbound daemon is {{ 'running' if (opnsense_unbound_enabled | bool) else 'stopped' }}
  by_systems.opnsense.opnsense_ub_service:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: "{{ 'running' if (opnsense_unbound_enabled | bool) else 'stopped' }}"
  delegate_to: localhost
  become: false
  tags: [dns, unbound]
