---
# WAN gateway monitoring — Proximus dynamic gateways (PPPoE + DHCP6-PD).
# Per ADR services/0008: gateways are API-managed (ansible MVC), not the seed.
# The Proximus PPPoE peer does not reliably answer ICMP, so we monitor external
# hosts (matches pfSense01, which monitored 1.1.1.1). Verified live: 0% loss on
# all four gateways. Telenet gateways live in wan2.yml.

- name: Gateways | Fetch interface overview
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/interfaces/overview/interfacesInfo"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_gw_overview
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Resolve WAN_PROXIMUS identifier (pppoe0)
  ansible.builtin.set_fact:
    opnsense_wan1_ident: >-
      {{ (opnsense_gw_overview.json | dict2items
          | selectattr('value.device', 'eq', 'pppoe0')
          | selectattr('value.identifier', 'defined')
          | selectattr('value.identifier', 'ne', '')
          | map(attribute='key') | list | first) | default('') }}
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Proximus IPv4 monitor (WAN_PROXIMUS_PPPOE → {{ opnsense_proximus_monitor_v4 }})
  ansibleguy.opnsense.gateway:
    name: WAN_PROXIMUS_PPPOE
    interface: "{{ opnsense_wan1_ident }}"
    gateway: dynamic
    ip_protocol: inet
    default_gw: false
    monitor_disable: false
    monitor: "{{ opnsense_proximus_monitor_v4 }}"
    description: "ISP PROXIMUS FTTH 500/500"
    enabled: true
    state: present
    firewall: "{{ opnsense_host }}"
    api_port: "{{ opnsense_port }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_verify_ssl | bool }}"
  delegate_to: localhost
  become: false
  when: opnsense_wan1_ident | length > 0
  tags: [gateway, network]

- name: Gateways | Proximus IPv6 monitor (WAN_PROXIMUS_DHCP6 → {{ opnsense_proximus_monitor_v6 }})
  ansibleguy.opnsense.gateway:
    name: WAN_PROXIMUS_DHCP6
    interface: "{{ opnsense_wan1_ident }}"
    gateway: dynamic
    ip_protocol: inet6
    default_gw: false
    monitor_disable: false
    monitor: "{{ opnsense_proximus_monitor_v6 }}"
    description: "ISP PROXIMUS FTTH 500/500 (IPv6-PD /56)"
    enabled: true
    state: present
    firewall: "{{ opnsense_host }}"
    api_port: "{{ opnsense_port }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: "{{ opnsense_verify_ssl | bool }}"
  delegate_to: localhost
  become: false
  when: opnsense_wan1_ident | length > 0
  tags: [gateway, network]
