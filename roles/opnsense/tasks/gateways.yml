---
# WAN gateway monitoring — Proximus DYNAMIC gateways (PPPoE v4 + DHCP6-PD v6).
# Per ADR services/0008: gateways are API-managed, not the seed.
#
# These are dynamic gateways, so neither collection module can manage them:
#   - ansibleguy.opnsense.gateway rejects `gateway: dynamic`
#   - by_systems.opnsense.opnsense_rt_gateway (lib RtGatewayManager) rejects the
#     DHCP6 gateway's empty `gateway` field (lib gap — tracked separately)
# So we use the uri get->set pattern (same as rules.yml). Only `interface` and
# `ipprotocol` are enum dicts to flatten; everything else is a plain string. The
# set runs ONLY when the live monitor differs (idempotent).
#
# Why a custom monitor: the Proximus PPPoE/DHCP6 peers don't answer ICMP, so we
# monitor an external host. The v6 monitor MUST be reachable over Proximus v6 —
# Quad9 v6 (2620:fe::fe) does NOT route from Proximus (100% loss) -> false
# gateway-down -> LAN v6 drops (issue #138). Google v6 is reachable.

- name: Gateways | Fetch routing gateways (uuid + current monitor)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/routing/settings/searchGateway"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_rt_gw_search
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Desired monitors + name->uuid map
  ansible.builtin.set_fact:
    opnsense_proximus_gateways:
      - {name: "WAN_PROXIMUS_PPPOE", monitor: "{{ opnsense_proximus_monitor_v4 }}"}
      - {name: "WAN_PROXIMUS_DHCP6", monitor: "{{ opnsense_proximus_monitor_v6 }}"}
    opnsense_rt_gw_uuid: >-
      {{ dict(opnsense_rt_gw_search.json.rows | map(attribute='name')
              | zip(opnsense_rt_gw_search.json.rows | map(attribute='uuid'))) }}
  tags: [gateway, network]

- name: Gateways | Read each Proximus dynamic gateway (full item)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/routing/settings/getGateway/{{ opnsense_rt_gw_uuid[item.name] }}"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_rt_gw_items
  loop: "{{ opnsense_proximus_gateways }}"
  loop_control:
    label: "{{ item.name }}"
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Set Proximus gateway monitor when it differs
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/routing/settings/setGateway/{{ opnsense_rt_gw_uuid[item.item.name] }}"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      gateway_item: >-
        {{ item.json.gateway_item | combine({
             'interface': (item.json.gateway_item.interface | dict2items | selectattr('value.selected') | map(attribute='key') | first),
             'ipprotocol': (item.json.gateway_item.ipprotocol | dict2items | selectattr('value.selected') | map(attribute='key') | first),
             'monitor': item.item.monitor
           }) }}
    status_code: 200
  loop: "{{ opnsense_rt_gw_items.results }}"
  loop_control:
    label: "{{ item.item.name }} -> {{ item.item.monitor }}"
  when: item.json.gateway_item.monitor != item.item.monitor
  register: opnsense_rt_gw_set
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Apply routing changes (reconfigure)  # noqa: no-handler
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/routing/settings/reconfigure"
    method: POST
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: 200
  when: opnsense_rt_gw_set is changed
  delegate_to: localhost
  become: false
  tags: [gateway, network]
