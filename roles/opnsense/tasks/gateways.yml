---
# WAN gateway monitoring — Proximus DYNAMIC gateways (PPPoE v4 + DHCP6-PD v6).
# Per ADR services/0008: gateways are API-managed, not the seed.
#
# Contract: by_systems.opnsense.opnsense_rt_gateway (lib RtGatewayManager — dynamic gateways
# carry no static address and are matched by NAME; `gateway` is omitted). A dynamic gateway
# only exists while its session is up (the test FW keeps Proximus administratively down), so
# a read-only lookup filters the ones the firewall has and the interface/ipprotocol come from
# that row — never guessed.
#
# Why a custom monitor: the Proximus PPPoE/DHCP6 peers don't answer ICMP, so we monitor an
# external host. The v6 monitor MUST be reachable over Proximus v6 — Quad9 v6 (2620:fe::fe)
# does NOT route from Proximus (100% loss) -> false gateway-down -> LAN v6 drops (issue #138).
# Google v6 is reachable.

- name: Gateways | Fetch routing gateways (read-only lookup — which dynamic ones exist)
  ansible.builtin.uri:
    url: "{{ opnsense_api_url }}/api/routing/settings/searchGateway"
    method: GET
    url_username: "{{ opnsense_api_key }}"
    url_password: "{{ opnsense_api_secret }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  register: opnsense_rt_gw_search
  check_mode: false   # read-only GET — must also run under --check
  delegate_to: localhost
  become: false
  tags: [gateway, network]

- name: Gateways | Desired monitors for the Proximus dynamic gateways
  ansible.builtin.set_fact:
    opnsense_proximus_monitors:
      WAN_PROXIMUS_PPPOE: "{{ opnsense_proximus_monitor_v4 }}"
      WAN_PROXIMUS_DHCP6: "{{ opnsense_proximus_monitor_v6 }}"
  tags: [gateway, network]

- name: Gateways | Pin the monitor of each Proximus dynamic gateway the firewall has
  by_systems.opnsense.opnsense_rt_gateway:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item.name }}"
    interface: "{{ item.interface }}"
    ipprotocol: "{{ item.ipprotocol }}"
    monitor: "{{ opnsense_proximus_monitors[item.name] }}"
    state: present
  loop: "{{ opnsense_rt_gw_search.json.rows | selectattr('name', 'in', opnsense_proximus_monitors.keys() | list) | list }}"
  loop_control:
    label: "{{ item.name }} -> {{ opnsense_proximus_monitors[item.name] }}"
  delegate_to: localhost
  become: false
  tags: [gateway, network]
