---
# Firewall rules — idempotent via ansibleguy.opnsense collection.
# Authoritative source: ADR services/0001-opnsense §Phase 2 (Ansible owns
# everything; collection ansibleguy.opnsense; role ansible-platform/roles/opnsense).
# Naming: ADR naming/0003-firewall.
#
# Data comes from the CATALOG (`opn_filter_rules` in group_vars/opnsense.yml).
# Previously this file drove the raw `uri` module against the OPNsense REST API
# and looped a stale six-rule list in role defaults; both are replaced here so
# the ADR-mandated collection owns the rules and the catalog is the only truth.
#
# `description` is the match key (rule identity), matching how the catalog and
# lib-opnsense FwFilterManager both identify rules.
#
# Scope a single concern with:
#   -e '{"opn_fw_only": ["PASS DMZ Traefik→SVC CrowdSec LAPI (agent)"]}'
# Empty (default) = converge the entire catalog.

# --- Catalog guards (platform rules): every net/port field must be an alias
# (or the keywords any / (self)); ipprotocol must be inet | inet6 | inet46.
- name: "Rules | Catalog guard — aliases mandatory, ipprotocol valid"
  ansible.builtin.assert:
    that:
      - (item.source_net | default('any')) in _alias_names
      - (item.destination_net | default('any')) in _alias_names
      - (item.destination_port | default('any')) in _alias_names
      - (item.source_port | default('any')) in _alias_names
      - (item.ipprotocol | default('inet')) in ['inet', 'inet6', 'inet46']
    fail_msg: >-
      Catalog violation in rule '{{ item.description }}': net/port fields must be
      aliases (or any/(self)) and ipprotocol inet|inet6|inet46 —
      src={{ item.source_net | default('any') }} dst={{ item.destination_net | default('any') }}
      dport={{ item.destination_port | default('any') }} proto={{ item.ipprotocol | default('inet') }}
    quiet: true
  vars:
    _alias_names: "{{ (opn_aliases | map(attribute='name') | list) + ['any', '(self)'] }}"
  loop: "{{ opn_filter_rules }}"
  loop_control:
    label: "{{ item.description }}"
  tags: [firewall, rules]

- name: "Rules | Select the rules in scope"
  ansible.builtin.set_fact:
    opnsense_rules_scoped: >-
      {{ opn_filter_rules
         if not (opn_fw_only | default([]))
         else (opn_filter_rules | selectattr('description', 'in', opn_fw_only) | list) }}
  delegate_to: localhost
  become: false
  tags: [firewall, rules]

- name: "Rules | Report scope"
  ansible.builtin.debug:
    msg: >-
      {{ ('FULL catalog: ' ~ (opnsense_rules_scoped | length) ~ ' rules')
         if not (opn_fw_only | default([]))
         else ('SCOPED: ' ~ (opnsense_rules_scoped | map(attribute='description') | join(' | ')
               if opnsense_rules_scoped else 'nothing matched ' ~ (opn_fw_only | join(', ')))) }}
  delegate_to: localhost
  become: false
  tags: [firewall, rules]

# Interface names in the catalog are logical zone names (dmz, svc, ...); OPNsense
# addresses them by slot (opt3, opt4, ...). opn_interface_map is the translation,
# the same one the catalog's own tooling applies.
- name: "Rules | Ensure firewall rules match the catalog"
  ansibleguy.opnsense.rule:
    firewall: "{{ opnsense_firewall }}"
    api_port: "{{ opnsense_api_port }}"
    api_key: "{{ opnsense_api_key }}"
    api_secret: "{{ opnsense_api_secret }}"
    ssl_verify: false
    description: "{{ item.description }}"
    match_fields: ['description']
    sequence: "{{ item.sequence | default(1) }}"
    action: "{{ item.action | default('pass') }}"
    interface: "{{ [opn_interface_map[item.interface] | default(item.interface)] }}"
    direction: "{{ item.direction | default('in') }}"
    ip_protocol: "{{ item.ipprotocol | default('inet') }}"
    protocol: "{{ 'any' if (item.protocol | default('any')) == 'any' else (item.protocol | upper) }}"
    source_net: "{{ item.source_net | default('any') }}"
    source_port: "{{ item.source_port | default(omit) }}"
    destination_net: "{{ item.destination_net | default('any') }}"
    destination_port: "{{ item.destination_port | default(omit) }}"
    enabled: "{{ item.enabled | default(true) | bool }}"
    log: "{{ item.log | default(false) | bool }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opnsense_rules_scoped }}"
  loop_control:
    label: "{{ item.description }}"
  delegate_to: localhost
  become: false
  tags: [firewall, rules]
