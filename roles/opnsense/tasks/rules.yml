---
# Firewall rules — catalog-driven, idempotent, lib-first.
#
# Data comes from the CATALOG (`opn_filter_rules` in group_vars/opnsense.yml), the
# single source of truth for every rule (naming/0003). Every catalog item declares
# its contract module in `ref.ansible_module`; for rules that is
# by_systems.opnsense.opnsense_fw_filter (lib-opnsense FwFilterManager underneath),
# matched by `description`. The lib applies the filter after a change, so no
# separate reload step is needed.
#
# Interface names in the catalog are logical zone names (mgmt, dmz, svc, ...);
# OPNsense addresses them by slot (opt2, opt3, ...). opn_interface_map is the
# translation; a comma-separated list (multi-interface rule) is mapped per element.
#
# Scope a single concern with:
#   -e '{"opn_fw_only": ["<rule description>", ...]}'
# Empty (default) = converge the entire catalog (gated by opn_fw_confirm_full in main.yml).

- name: "Rules | Dump the catalog for the lint"
  ansible.builtin.copy:
    content: "{{ {'aliases': opn_aliases, 'rules': opn_filter_rules, 'single_family_interfaces': opn_single_family_interfaces | default([])} | to_json }}"
    dest: "/tmp/opnsense-catalog-{{ inventory_hostname }}.json"
    mode: "0600"
  delegate_to: localhost
  become: false
  changed_when: false
  tags: [firewall, rules]

- name: "Rules | Catalog guard (naming/0003)"
  ansible.builtin.command:
    argv:
      - python3
      - "{{ role_path }}/files/catalog_lint.py"
      - "/tmp/opnsense-catalog-{{ inventory_hostname }}.json"
  delegate_to: localhost
  become: false
  changed_when: false
  register: opnsense_catalog_lint
  failed_when: opnsense_catalog_lint.rc != 0
  tags: [firewall, rules]

- name: "Rules | Select the rules in scope"
  ansible.builtin.set_fact:
    opnsense_rules_scoped: >-
      {{ opn_filter_rules
         if not (opn_fw_only | default([]))
         else (opn_filter_rules | selectattr('description', 'in', opn_fw_only) | list) }}
  delegate_to: localhost
  become: false
  tags: [firewall, rules]

- name: "Rules | Report scope"
  ansible.builtin.debug:
    msg: >-
      {{ ('FULL catalog: ' ~ (opnsense_rules_scoped | length) ~ ' rules')
         if not (opn_fw_only | default([]))
         else ('SCOPED: ' ~ (opnsense_rules_scoped | map(attribute='description') | join(' | ')
               if opnsense_rules_scoped else 'nothing matched ' ~ (opn_fw_only | join(', ')))) }}
  delegate_to: localhost
  become: false
  tags: [firewall, rules]

- name: "Rules | Ensure firewall rules match the catalog (by_systems.opnsense / lib-opnsense)"
  by_systems.opnsense.opnsense_fw_filter:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    description: "{{ item.description }}"
    action: "{{ item.action | default('pass') }}"
    interface: "{{ item.interface | string | split(',') | map('trim') | map('extract', opnsense_iface_lookup) | join(',') }}"
    direction: "{{ item.direction | default('in') }}"
    ipprotocol: "{{ item.ipprotocol | default('inet') }}"
    protocol: "{{ 'any' if (item.protocol | default('any')) == 'any' else (item.protocol | upper) }}"
    source_net: "{{ item.source_net | default('any') }}"
    source_port: "{{ item.source_port | default(omit) }}"
    destination_net: "{{ item.destination_net | default('any') }}"
    destination_port: "{{ item.destination_port | default(omit) }}"
    enabled: "{{ item.enabled | default(true) | bool }}"
    log: "{{ item.log | default(false) | bool }}"
    quick: "{{ (item.quick | bool) if (item.quick is defined) else omit }}"
    sequence: "{{ item.sequence | default(omit) }}"
    source_not: "{{ (item.source_not | bool) if (item.source_not is defined) else omit }}"
    destination_not: "{{ (item.destination_not | bool) if (item.destination_not is defined) else omit }}"
    gateway: "{{ item.gateway | default(omit) }}"
    state: "{{ item.state | default('present') }}"
  loop: "{{ opnsense_rules_scoped }}"
  loop_control:
    label: "{{ item.description }}"
  register: opnsense_rules_apply
  delegate_to: localhost
  become: false
  tags: [firewall, rules]
