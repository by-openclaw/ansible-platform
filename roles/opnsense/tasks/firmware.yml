---
# Firmware + plugins — contract: by_systems.opnsense modules (lib-opnsense FirmwareManager /
# PluginManager.ensure underneath). Per ADR services/0008 the firmware API is the reproducible
# mechanism, not an ad-hoc curl.
#
# Updates/upgrades REBOOT the firewall and are a deliberate per-env window: the check always
# runs (so the play reports what is pending), the apply only when opnsense_firmware_upgrade is
# flipped, and then the play waits for the FW to come back INTO opnsense_firmware_target.
# Plugins: install only what is missing; the module reads the job log — the backend reports
# "done" even when it REFUSED (a fresh 26.7.0 nano needs the point update first) and the module
# fails loudly with the reason instead of silently continuing.

- name: "Firmware | Check pending updates (report only — no reboot)"
  by_systems.opnsense.opnsense_firmware:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: updated
    check_timeout: 120
  check_mode: true
  changed_when: false   # report only: a pending package must not make the converge non-idempotent
  register: opnsense_fw_pending
  delegate_to: localhost
  become: false
  tags: [firmware]

- name: "Firmware | Report what is pending and whether the window is open"
  ansible.builtin.debug:
    msg: >-
      status={{ opnsense_fw_pending.diff.before.status | default('?') }}
      product_version={{ opnsense_fw_pending.diff.before.product_version | default('?') }}
      target={{ opnsense_firmware_target | default('') or 'none' }}
      apply={{ opnsense_firmware_upgrade | bool }}
  tags: [firmware]

- name: "Firmware | Apply the pending update/upgrade and wait for the reboot INTO {{ opnsense_firmware_target | default('') or 'any version' }}"
  by_systems.opnsense.opnsense_firmware:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    state: "{{ 'upgraded' if (opnsense_fw_pending.diff.before.status | default('') == 'upgrade') else 'updated' }}"
    target: "{{ opnsense_firmware_target | default('') or omit }}"
    check_timeout: 120
    wait_timeout: 1500
  when:
    - opnsense_firmware_upgrade | bool
    - opnsense_fw_pending.diff.before.status | default('') in ['update', 'upgrade']
  delegate_to: localhost
  become: false
  tags: [firmware]

# --- Plugins (idempotent: the module reads the installed state itself) ---
- name: "Firmware | Ensure catalog plugins are installed"
  by_systems.opnsense.opnsense_plugin:
    host: "{{ opn_host }}"
    port: "{{ opn_port | default(443) }}"
    key: "{{ opnsense_api_key }}"
    secret: "{{ opnsense_api_secret }}"
    verify_ssl: false
    name: "{{ item }}"
    state: present
    wait: true
    timeout: 300
  loop: "{{ opnsense_plugins }}"
  delegate_to: localhost
  become: false
  tags: [firmware, plugins]
