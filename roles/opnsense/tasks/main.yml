---
# OPNsense role — entry point
# Collection: ansibleguy.opnsense (v1.2.16)
# No shell/command tasks. Every task is idempotent (state: present/absent).
# API credentials come from vault via group_vars/opnsense.yml.
# NOTE: include_tasks (not import_tasks) — allows tag-filtered partial runs

- name: Install and enable QEMU guest agent
  ansible.builtin.include_tasks: qemu-agent.yml
  tags: [bootstrap, qemu-agent]
  when: opnsense_install_qemu_agent | default(true) | bool

- name: Include system tasks
  ansible.builtin.include_tasks: system.yml
  tags: [system]

- name: Include interface tasks
  ansible.builtin.include_tasks: interfaces.yml
  tags: [interfaces, network]

- name: Include DNS (Unbound) tasks
  ansible.builtin.include_tasks: dns.yml
  tags: [dns, unbound]

- name: Include DHCP tasks
  ansible.builtin.include_tasks: dhcp.yml
  tags: [dhcp]

- name: Include NTP tasks
  ansible.builtin.include_tasks: ntp.yml
  tags: [ntp]

- name: Include firewall alias tasks
  ansible.builtin.include_tasks: aliases.yml
  tags: [firewall, aliases]

- name: Include firewall rule tasks
  ansible.builtin.include_tasks: rules.yml
  tags: [firewall, rules]

- name: Include WireGuard tasks
  ansible.builtin.include_tasks: wireguard.yml
  tags: [wireguard, vpn]
  when: opnsense_wireguard_enabled | default(true) | bool
