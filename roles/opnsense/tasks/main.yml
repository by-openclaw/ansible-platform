---
# OPNsense role — entry point
# Collections: ansibleguy.opnsense (rules/aliases — ADR-mandated) + by_systems.opnsense
# (lib-opnsense MVC: NAT, syslog, ...). L2/L3 topology, system identity, interface settings
# and gateways are SEED-owned (infra-terraform-proxmox modules/vm-opnsense/seed) — see
# tasks/_archive/README.md for what was retired on 2026-09-07.
# No shell/command tasks. Every task is idempotent (state: present/absent).
# API credentials come from vault via group_vars/opnsense.yml.
# NOTE: include_tasks (not import_tasks) — allows tag-filtered partial runs

- name: Include firmware (upgrade + plugins) tasks
  ansible.builtin.include_tasks: firmware.yml
  tags: [firmware, plugins]
  when: opnsense_manage_firmware | default(true) | bool

- name: Include WAN gateway monitoring tasks
  ansible.builtin.include_tasks: gateways.yml
  tags: [gateway, network]

- name: Include dnscrypt-proxy tasks (encrypted upstream of the Unbound chain — catalog opn_dnscrypt_proxy)
  ansible.builtin.include_tasks: dnscrypt.yml
  tags: [dns, dnscrypt]
  when: opn_dnscrypt_proxy is defined

- name: Include DNS (Unbound) tasks
  ansible.builtin.include_tasks: dns.yml
  tags: [dns, unbound]

- name: Include Dynamic DNS (os-ddclient) tasks
  ansible.builtin.include_tasks: dyndns.yml
  tags: [dyndns, dns]
  when: opnsense_dyndns_accounts | default([]) | length > 0

- name: Include chrony tasks (os-chrony is THE time sync; base ntpd is archived)
  ansible.builtin.include_tasks: chrony.yml
  tags: [ntp, chrony]

- name: Include LLDP tasks
  ansible.builtin.include_tasks: lldpd.yml
  tags: [services, lldpd]
  when: opnsense_lldpd_enabled | default(true) | bool

# An unscoped run converges the ENTIRE catalog (96 aliases / 119 rules), which
# on a live firewall means creating everything the catalog declares and that the
# FW does not yet have. That is legitimate for a deliberate full converge and
# dangerous as an accident, so it has to be asked for explicitly.
- name: "Firewall | Refuse an unscoped catalog converge unless confirmed"
  ansible.builtin.fail:
    msg: >-
      Refusing to converge the ENTIRE firewall catalog against a live firewall.
      Scope the change with -e '{"opn_fw_only": ["<alias or rule description>", ...]}',
      or, if a full converge is genuinely intended, re-run with
      -e opn_fw_confirm_full=true after inspecting `--check --diff`.
  when:
    - (opnsense_manage_aliases | default(true) | bool) or (opnsense_manage_rules | default(true) | bool) or (opnsense_manage_nat | default(true) | bool)
    - not (opn_fw_only | default([]))
    - not (opn_fw_confirm_full | default(false) | bool)
  tags: [firewall, aliases, rules, nat]

- name: Include firewall alias tasks
  ansible.builtin.include_tasks: aliases.yml
  tags: [firewall, aliases]
  # Catalog-driven since #161: aliases.yml now loops opn_aliases (the single
  # source of truth), not the stale 3-zone list that caused this to be gated OFF
  # under issue #51. Scope one concern with -e opn_fw_only=[...]; an unscoped run
  # converges the WHOLE catalog, so check --diff first.
  when: opnsense_manage_aliases | default(true) | bool

- name: Include firewall rule tasks
  ansible.builtin.include_tasks: rules.yml
  tags: [firewall, rules]
  # Catalog-driven since #161: rules.yml now loops opn_filter_rules through the
  # ADR-mandated ansibleguy.opnsense collection, replacing both the stale 3-zone
  # list and the raw uri calls. Scope with -e opn_fw_only=[...]; an unscoped run
  # converges the WHOLE catalog, so check --diff first.
  when: opnsense_manage_rules | default(true) | bool

- name: Include NAT (DNAT / source NAT) tasks
  ansible.builtin.include_tasks: nat.yml
  tags: [firewall, nat, dnat, snat]
  # Catalog-driven (opn_dnat_rules / opn_snat_rules) through by_systems.opnsense
  # (lib-opnsense FwDnat/FwSourceNat managers). Same scoping + confirm gate as rules.
  when: opnsense_manage_nat | default(true) | bool

- name: Include service activation tasks
  ansible.builtin.include_tasks: services.yml
  tags: [services]

- name: Include Monit monitoring tasks
  ansible.builtin.include_tasks: monit.yml
  tags: [services, monit]
  when: opnsense_monit_enabled | default(true) | bool

# --- remote syslog (Loki) ------------------------------------------------------
- name: "Syslog | Remote destinations (Loki / promtail)"
  ansible.builtin.include_tasks: syslog.yml
  tags: [syslog, logging]
