---
# OPNsense role — entry point
# Collection: ansibleguy.opnsense (v1.2.16)
# No shell/command tasks. Every task is idempotent (state: present/absent).
# API credentials come from vault via group_vars/opnsense.yml.
# NOTE: include_tasks (not import_tasks) — allows tag-filtered partial runs

- name: Install and enable QEMU guest agent
  ansible.builtin.include_tasks: qemu-agent.yml
  tags: [bootstrap, qemu-agent]
  when: opnsense_install_qemu_agent | default(true) | bool

- name: Include system tasks
  ansible.builtin.include_tasks: system.yml
  tags: [system]
  # hostname/domain/timezone are SEED-owned (build-seed.py renders config.xml from
  # net-internal-domain.json) — same ownership principle as L2/L3 and firewall
  # objects. system.yml also uses puzzle.opnsense.system_settings_general, which
  # rejects this playbook's inline api_* creds (needs an httpapi connection) and
  # fails the whole untagged run at task 1. Gated OFF by default — issue #51.
  when: opnsense_manage_system | default(false) | bool

- name: Include firmware (upgrade + plugins) tasks
  ansible.builtin.include_tasks: firmware.yml
  tags: [firmware, plugins]
  when: opnsense_manage_firmware | default(true) | bool

- name: Include interface tasks
  ansible.builtin.include_tasks: interfaces.yml
  tags: [interfaces, network]

- name: Include WAN2 (Telenet) tasks
  ansible.builtin.include_tasks: wan2.yml
  tags: [wan2, network]
  when: opnsense_wan2 is defined

- name: Include WAN gateway monitoring tasks
  ansible.builtin.include_tasks: gateways.yml
  tags: [gateway, network]

- name: Include DNS (Unbound) tasks
  ansible.builtin.include_tasks: dns.yml
  tags: [dns, unbound]

- name: Include Dynamic DNS (os-ddclient) tasks
  ansible.builtin.include_tasks: dyndns.yml
  tags: [dyndns, dns]
  when: opnsense_dyndns_accounts | default([]) | length > 0

- name: Include DHCP tasks
  ansible.builtin.include_tasks: dhcp.yml
  tags: [dhcp]
  # STALE old-3-zone model (puzzle DHCP on opt1). Prod DHCP = catalog opn_kea via
  # the lib path. Gated OFF so an untagged run can't drift prod — see issue #51.
  when: opnsense_manage_dhcp | default(false) | bool

- name: Include NTP tasks (base ntpd) — only when chrony is NOT used
  ansible.builtin.include_tasks: ntp.yml
  tags: [ntp]
  when: not (opnsense_use_chrony | default(true) | bool)

- name: Include chrony tasks (replaces base ntpd)
  ansible.builtin.include_tasks: chrony.yml
  tags: [ntp, chrony]
  when: opnsense_use_chrony | default(true) | bool

- name: Include LLDP tasks
  ansible.builtin.include_tasks: lldpd.yml
  tags: [services, lldpd]
  when: opnsense_lldpd_enabled | default(true) | bool

- name: Include firewall alias tasks
  ansible.builtin.include_tasks: aliases.yml
  tags: [firewall, aliases]
  # STALE old-3-zone aliases (net_mgmt/dmz/svc on 10.1.x). Prod aliases = catalog
  # opn_aliases (net4_/net6_ dual-stack) via the lib path. Gated OFF — issue #51.
  when: opnsense_manage_aliases | default(false) | bool

- name: Include firewall rule tasks
  ansible.builtin.include_tasks: rules.yml
  tags: [firewall, rules]
  # STALE old-3-zone rules (opt1/2/3 outbound). Prod rules = catalog opn_filter_rules
  # via the lib path. Gated OFF so an untagged run can't drift prod — issue #51.
  when: opnsense_manage_rules | default(false) | bool

- name: Include service activation tasks
  ansible.builtin.include_tasks: services.yml
  tags: [services]

- name: Include Monit monitoring tasks
  ansible.builtin.include_tasks: monit.yml
  tags: [services, monit]
  when: opnsense_monit_enabled | default(true) | bool

- name: Include WireGuard tasks
  ansible.builtin.include_tasks: wireguard.yml
  tags: [wireguard, vpn]
  # OFF by default — keys come from unprovisioned vault + not in prod catalog (#51).
  when: opnsense_wireguard_enabled | default(false) | bool
