---
# OPNsense connection (override in group_vars or vault)
opnsense_host: "10.1.1.1"
opnsense_port: 443
opnsense_verify_ssl: false   # intentional — no cert infra yet (ADR-0014 / decided 2026-03-30)
opnsense_timeout: 60

# API URL — used by uri-based tasks (non-collection fallback)
# During bootstrap: set to https://127.0.0.1:8443 via SSH tunnel through Proxmox (see playbooks/opnsense.yml)
# Post-MGMT-VLAN: set to https://10.1.1.1:443
opnsense_api_url: "https://{{ opnsense_host }}:{{ opnsense_port }}"

# ansibleguy.opnsense collection connection args
# Overridden in playbook vars: firewall=127.0.0.1, api_port=8443 (SSH tunnel)
opnsense_firewall: "{{ opnsense_host }}"
opnsense_api_port: "{{ opnsense_port }}"

# Ansible connection — all collection tasks run locally (API calls, not SSH)
ansible_python_interpreter: /usr/bin/python3

# System
opnsense_hostname: "vm-opnsense-01"
# Search domain — never hardcode a real domain (no-real-domains rule).
# Real value lives in vault (vault_opnsense_domain) / infra secret net-internal-domain.json.
opnsense_domain: "{{ vault_opnsense_domain | default('example.local') }}"
opnsense_timezone: "Europe/Brussels"

# ── L2/L3 ownership ───────────────────────────────────────────────────────────
# The SEED (config.xml) owns interface assignment + VLANs (no OPNsense API for
# assignment — ADR services/0008). Leave VLAN management OFF so re-runs don't
# spawn unassigned orphan VLANs (the live FW had 310/320/330 orphans from this).
# Only flip true to bootstrap a fresh FW that has NO seed.
opnsense_manage_vlans: false

# ── Firewall-object ownership (aliases / rules / DHCP) ────────────────────────
# These objects are owned by the CATALOG (inventories/<env>/group_vars/opnsense.yml
# → opn_aliases / opn_filter_rules / opn_kea) and applied via the by_systems.opnsense
# lib path (scripts/fw_apply_direct.py — services/0001 "Pass 1"). The role tasks
# below (aliases.yml / rules.yml / dhcp.yml) still carry the OLD test-era 3-zone
# model (net_mgmt/dmz/svc on 10.1.x, opt1/2/3, puzzle DHCP on opt1) and are NOT
# wired to the catalog. Running them against prod would push the wrong model and
# drift the FW (issue #51). They are therefore GATED OFF by default — same pattern
# as opnsense_manage_vlans. A full untagged `ansible-playbook opnsense-prod.yml`
# run is now safe: the stale tasks skip, the catalog stays the single source of
# truth. Only flip these true to bootstrap a fresh FW with NO catalog/lib apply,
# and migrate the data to the catalog model first.
opnsense_manage_aliases: false
opnsense_manage_rules: false
opnsense_manage_dhcp: false
# hostname/domain/timezone are SEED-owned (build-seed.py from net-internal-domain.json).
# system.yml also uses the puzzle collection (httpapi connection) which is incompatible
# with the prod playbook's inline api_* creds and fails outright. Gated OFF — issue #51.
opnsense_manage_system: false

# ── Time sync ─────────────────────────────────────────────────────────────────
# chrony (os-chrony) replaces the base ntpd. chrony.yml enables it and stops ntpd.
opnsense_use_chrony: true
# Belgian NTP pool — geographically close stratum servers (FW is in Brussels TZ).
opnsense_chrony_peers:
  - "0.be.pool.ntp.org"
  - "1.be.pool.ntp.org"
  - "2.be.pool.ntp.org"
  - "3.be.pool.ntp.org"
# Networks chrony serves NTP to (empty list = client-only, no :123 listener).
# Internal VLANs (v4+v6 dual-stack) + OOB management plane.
opnsense_chrony_allowed_networks:
  - "10.1.0.0/16"
  - "fd01::/32"
  - "10.6.224.0/20"

# ── LLDP (os-lldpd) ───────────────────────────────────────────────────────────
# LLDP only, announced on INTERNAL interfaces (OOB + LAN_TRUNK + VLANs) — never
# the WAN uplinks. Interface idents match the seed assignment order.
opnsense_lldpd_enabled: true
# Extra discovery protocols — keep OFF; LLDP (standard) is enough.
# Flip opnsense_lldpd_cdp only if you add Cisco gear that requires CDP.
opnsense_lldpd_cdp: false
opnsense_lldpd_fdp: false
opnsense_lldpd_edp: false
opnsense_lldpd_sonmp: false
opnsense_lldpd_interfaces:
  - "lan"     # OOB
  - "opt1"    # LAN_TRUNK
  - "opt2"    # MGMT
  - "opt3"    # DMZ
  - "opt4"    # SVC
  - "opt5"    # VPN
  - "opt6"    # IoT
  - "opt7"    # VoIP
  - "opt8"    # Storage
  - "opt9"    # Media
  - "opt10"   # GAMING
  - "opt11"   # CCTV

# WAN
opnsense_wan_interface: "vtnet0"
opnsense_wan_ip: "10.6.224.106"
opnsense_wan_prefix: "20"
opnsense_wan_gateway: "10.6.224.1"

# VLAN interfaces on vtnet1 (trunk)
opnsense_vlans:
  - id: 310
    name: "mgmt"
    parent: "vtnet1"
    ip: "10.1.1.1"
    prefix: "24"
  - id: 320
    name: "dmz"
    parent: "vtnet1"
    ip: "10.1.2.1"
    prefix: "24"
  - id: 330
    name: "svc"
    parent: "vtnet1"
    ip: "10.1.3.1"
    prefix: "24"

# DHCP (MGMT only)
opnsense_dhcp_mgmt_enabled: true
opnsense_dhcp_mgmt_range_start: "10.1.1.100"
opnsense_dhcp_mgmt_range_end: "10.1.1.199"

# DNS — Unbound in the prod chain: AdGuard -> Unbound(:53) -> dnscrypt-proxy(:53531)
# Unbound forwards PLAINTEXT to the local dnscrypt-proxy listener (which does the
# encrypted upstream). Unbound itself does NO DoT — see dns.yml. The old
# DoT-direct model (1.1.1.1/9.9.9.9:853) is removed; it caused TLS handshake
# failures when pointed at the plaintext dnscrypt port.
opnsense_unbound_enabled: true
# dnscrypt-proxy binds BOTH loopbacks (127.0.0.1:53531 + [::1]:53531). Forward to
# both for dual-stack loopback transport + failover (the loopback family does not
# limit record resolution — A and AAAA both resolve over either).
opnsense_unbound_dnscrypt_servers:
  - "::1"
  - "127.0.0.1"
opnsense_unbound_dnscrypt_port: 53531

# NTP
opnsense_ntp_servers:
  - "0.pool.ntp.org"
  - "1.pool.ntp.org"

# ── Monit (os-monit) — monitoring + email alerts via Resend SMTP relay ────────
# SMTP creds read from the secret file at apply time (never committed). The
# from-address MUST be on a Resend-verified domain (e.g. resend.by-systems.be).
opnsense_monit_enabled: true
opnsense_monit_interval: 120
opnsense_monit_startdelay: 120
opnsense_monit_smtp_secret_path: "/home/by-systems/.openclaw/workspace/infra/secrets/monit-smtp-resend.json"
# Process-down checks — pidfiles verified on vm-opns-01. ntpd is intentionally
# NOT here (chrony replaced it). Gateways are covered by dpinger, not Monit.
opnsense_monit_processes:
  - {name: "unbound", pidfile: "/var/run/unbound.pid"}
  - {name: "dnscrypt-proxy", pidfile: "/var/run/dnscrypt-proxy.pid"}
  - {name: "crowdsec", pidfile: "/var/run/crowdsec.pid"}
  - {name: "chronyd", pidfile: "/var/run/chrony/chronyd.pid"}
  - {name: "flowd_aggregate", pidfile: "/var/run/flowd_aggregate.pid"}
  - {name: "kea-dhcp4", pidfile: "/var/run/kea/kea-dhcp4.kea-dhcp4.pid"}
  - {name: "kea-dhcp6", pidfile: "/var/run/kea/kea-dhcp6.kea-dhcp6.pid"}

# Firewall aliases — source of truth for all firewall rules (ADR-0015)
# content MUST be a list — ansibleguy.opnsense collection iterates it
# Names are explicit by context (firewall alias) — no alias_ prefix needed
opnsense_aliases:
  - name: "net_mgmt"
    type: "network"
    content: ["10.1.1.0/24"]
    description: "MGMT zone — VLAN 310"
  - name: "net_dmz"
    type: "network"
    content: ["10.1.2.0/24"]
    description: "DMZ zone — VLAN 320"
  - name: "net_svc"
    type: "network"
    content: ["10.1.3.0/24"]
    description: "SVC zone — VLAN 330"
  - name: "net_vpn"
    type: "network"
    content: ["10.99.0.0/24"]
    description: "WireGuard VPN tunnel peers"
  - name: "port_wireguard"
    type: "port"
    content: ["51820"]
    description: "WireGuard UDP"
  - name: "port_https"
    type: "port"
    content: ["443"]
    description: "HTTPS"
  - name: "port_http"
    type: "port"
    content: ["80"]
    description: "HTTP"
  - name: "port_ssh"
    type: "port"
    content: ["22"]
    description: "SSH"

# Firewall rules — evaluated in order, first match wins
# interface values: wan, lan, opt1 (mgmt), opt2 (dmz), opt3 (svc)
# Use OPNsense interface IDs — check Interfaces > Assignments for actual names
opnsense_firewall_rules:
  # MGMT zone — full outbound (internet access for management)
  - description: "MGMT outbound — any"
    action: "pass"
    interface: "opt1"
    direction: "in"
    source: "net_mgmt"
    destination: "any"
    protocol: "any"

  # DMZ zone — outbound HTTP/HTTPS only
  - description: "DMZ outbound — HTTP"
    action: "pass"
    interface: "opt2"
    direction: "in"
    source: "net_dmz"
    destination: "any"
    destination_port: "port_http"
    protocol: "TCP"
  - description: "DMZ outbound — HTTPS"
    action: "pass"
    interface: "opt2"
    direction: "in"
    source: "net_dmz"
    destination: "any"
    destination_port: "port_https"
    protocol: "TCP"

  # SVC zone — outbound HTTP/HTTPS only
  - description: "SVC outbound — HTTP"
    action: "pass"
    interface: "opt3"
    direction: "in"
    source: "net_svc"
    destination: "any"
    destination_port: "port_http"
    protocol: "TCP"
  - description: "SVC outbound — HTTPS"
    action: "pass"
    interface: "opt3"
    direction: "in"
    source: "net_svc"
    destination: "any"
    destination_port: "port_https"
    protocol: "TCP"

  # WAN — WireGuard inbound
  - description: "WireGuard VPN inbound (wg-byresearch-01)"
    action: "pass"
    interface: "wan"
    direction: "in"
    protocol: "UDP"
    destination_port: "port_wireguard"

# WireGuard — tunnel wg-byresearch-01 (issue #88)
# OFF by default: the peer/server keys below resolve from vault (vault_opnsense_wg_*)
# which is NOT yet provisioned, and WireGuard is not in the prod catalog. An untagged
# run with this on would fail on the missing vault keys. Flip true (and provide the
# vault keys) only on a FW where WireGuard is actually catalogued. See issue #51.
opnsense_wireguard_enabled: false
opnsense_wireguard_instance_name: "wg-byresearch-01"
opnsense_wireguard_port: 51820
opnsense_wireguard_tunnel_network: "10.99.0.0/24"
opnsense_wireguard_server_ip: "10.99.0.1"
# Server keys — set in vault (never in plaintext)
opnsense_wireguard_private_key: "{{ vault_opnsense_wg_byresearch01_server_privkey }}"
opnsense_wireguard_public_key: "{{ vault_opnsense_wg_byresearch01_server_pubkey }}"

opnsense_wireguard_peers:
  - name: "peer-yboujraf-desk03"
    tunnel_ip: "10.99.0.2/32"
    public_key: "{{ vault_opnsense_wg_peer_desk03_pubkey }}"
  - name: "peer-yboujraf-mobile"
    tunnel_ip: "10.99.0.3/32"
    public_key: "{{ vault_opnsense_wg_peer_mobile_pubkey }}"
  - name: "peer-rune-vm"
    tunnel_ip: "10.99.0.4/32"
    public_key: "{{ vault_opnsense_wg_peer_rune_pubkey }}"

# WAN gateway monitor IPs (Proximus PPPoE peer doesn't answer ICMP — monitor
# external hosts, like pfSense01 did with 1.1.1.1). Telenet monitors its own gw.
# v6 monitor MUST be reachable over Proximus v6: Quad9 v6 (2620:fe::fe) does NOT
# route from Proximus (100% loss) → false gateway-down → LAN v6 drops. Google v6
# (2001:4860:4860::8888) is reachable (verified 4.9 ms). Quad9 v4 (9.9.9.9) is fine.
opnsense_proximus_monitor_v4: "9.9.9.9"
opnsense_proximus_monitor_v6: "2001:4860:4860::8888"
# Firmware upgrade + plugins (reproducible via roles/opnsense/tasks/firmware.yml,
# NOT ad-hoc API). 26.1.8+ is required for the MVC gateway/firmware endpoints.
opnsense_firmware_target: "26.1.9"
opnsense_firmware_upgrade: true
opnsense_plugins:
  - os-acme-client
  - os-chrony
  - os-crowdsec
  - os-ddclient        # Dynamic DNS (current plugin; keeps the DynDNS MVC API /api/dyndns)
  - os-dnscrypt-proxy
  - os-lldpd
  - os-qemu-guest-agent

# --- Dynamic DNS (os-ddclient) -------------------------------------------------
# Apex-anchor model (failover-ready, no ISP identity exposed — ISO 27001 A.5.7 /
# NIS2 attack-surface minimisation):
#   * by-research.be (apex) A/AAAA holds the ACTIVE WAN public IP — DynDNS updates
#     ONLY this record. Service names (vpn, nextcloud, …) are CNAME -> apex
#     (managed separately via Cloudflare-CRUD), so they all follow automatically.
#   * checkip=cloudflare is a WEB method = the active-default-route egress IP, so on
#     a gateway failover the apex swings to the surviving WAN. NOT interface-pinned.
#   * Ingress (DNAT + pass) is already applied on BOTH WANs and reply-to is on, so
#     whichever WAN the apex points to, Traefik + VPN answer symmetrically.
#   * Never touches the existing Telenet records — only writes the one apex record.
# Consumes by_systems.opnsense.opnsense_ddns_account (wraps lib DdnsAccountManager).
# The Cloudflare API token is NEVER stored here — read at runtime from the controller
# secret store (roles/opnsense/tasks/dyndns.yml, no_log). Cloudflare auth: username
# empty (no '@') => Bearer-token mode (scoped token).
opnsense_cf_secret: "{{ lookup('env', 'HOME') }}/.openclaw/workspace/infra/secrets/app-cloudflare-by-research-be.json"
# Placeholder seed for the anchor record on first create (RFC 5737 TEST-NET). The
# record is created with this value only when absent; os-ddclient overwrites it with
# the live active-WAN IP on its first push (we restart the daemon to make that immediate).
opnsense_dyndns_seed_ip: "192.0.2.1"
opnsense_dyndns_seed_ip6: "2001:db8::1"   # RFC 3849 doc range; ddclient overwrites

opnsense_dyndns_accounts:
  # Proximus DYNAMIC anchor = `dyn.by-research.be` (neutral name, no ISP identity).
  # Telenet is the static default anchor (the apex by-research.be, NOT DynDNS).
  # Only services explicitly bound to Proximus CNAME to `dyn` (+ outbound PBR).
  # Dual-stack: one account per family (os-ddclient resolves ONE address each;
  # record type follows the checkip family).
  #   checkip 'if'  = Interface [IPv4] -> A   ;  'if6' = Interface [IPv6] -> AAAA (GUA)
  # Local interface read = reliable (no external HTTP); pins to opt12 (Proximus).
  # record_type drives the Cloudflare anchor pre-create only.
  - description: "cloudflare-dyn-proximus"
    service: cloudflare
    username: ""                     # empty (no '@') => Cloudflare Bearer-token auth
    zone: "by-research.be"
    hostnames: "dyn.by-research.be"  # Proximus dynamic anchor
    checkip: "if"
    interface: "opt12"               # Proximus pppoe0
    record_type: "A"
    ttl: 60
    force_ssl: true
    enabled: true
    state: present
  - description: "cloudflare-dyn-proximus-v6"
    service: cloudflare
    username: ""
    zone: "by-research.be"
    hostnames: "dyn.by-research.be"
    checkip: "if6"                    # Interface [IPv6] -> Proximus GUA on opt12
    interface: "opt12"
    record_type: "AAAA"
    ttl: 60
    force_ssl: true
    enabled: true
    state: present
