---
# OPNsense connection (override in group_vars or vault)
opnsense_host: "10.1.1.1"
opnsense_port: 443
opnsense_verify_ssl: false   # intentional — no cert infra yet (ADR-0014 / decided 2026-03-30)
opnsense_timeout: 60

# API URL — used by uri-based tasks (non-collection fallback)
# During bootstrap: set to https://127.0.0.1:8443 via SSH tunnel through Proxmox (see playbooks/opnsense.yml)
# Post-MGMT-VLAN: set to https://10.1.1.1:443
opnsense_api_url: "https://{{ opnsense_host }}:{{ opnsense_port }}"

# API connection args (by_systems.opnsense modules — lib-opnsense underneath)
# Overridden in playbook vars: firewall=127.0.0.1, api_port=8443 (SSH tunnel)
opnsense_firewall: "{{ opnsense_host }}"
opnsense_api_port: "{{ opnsense_port }}"

# Ansible connection — all collection tasks run locally (API calls, not SSH)
ansible_python_interpreter: /usr/bin/python3

# ── Firewall-object ownership (aliases / rules / DHCP) ────────────────────────
# These objects are owned by the CATALOG (inventories/<env>/group_vars/opnsense.yml
# → opn_aliases / opn_filter_rules / opn_kea).
#
# aliases.yml and rules.yml now READ that catalog and apply it through the
# by_systems.opnsense collection (lib-opnsense managers; services/0001 §Phase 2: "Ansible
# owns everything" — the ADR text still names ansibleguy, see doc-platform-core #58). They previously carried the old test-era 3-zone model
# (net_mgmt/dmz/svc, opt1/2/3) and were gated OFF under issue #51 so an untagged
# run could not drift prod — that migration is done, so they are ON.
#
# An UNSCOPED run converges the ENTIRE catalog. Scope a single concern with
#   -e '{"opn_fw_only": ["<alias name or rule description>", ...]}'
# and always inspect `--check --diff` before applying.
# Interface reference resolution for catalog rules: logical zone names (mgmt, dmz, …)
# come from opn_interface_map; raw slot identifiers (lan, wan, optN) pass through.
opnsense_iface_identity:
  lan: lan
  wan: wan
  opt1: opt1
  opt2: opt2
  opt3: opt3
  opt4: opt4
  opt5: opt5
  opt6: opt6
  opt7: opt7
  opt8: opt8
  opt9: opt9
  opt10: opt10
  opt11: opt11
  opt12: opt12
  opt13: opt13
  opt14: opt14
  opt15: opt15
  opt16: opt16
  opt17: opt17
  opt18: opt18
  opt19: opt19
  opt20: opt20
opnsense_iface_lookup: "{{ opnsense_iface_identity | combine(opn_interface_map | default({})) }}"

opnsense_manage_aliases: true
opnsense_manage_rules: true
opnsense_manage_nat: true      # nat.yml — catalog opn_dnat_rules / opn_snat_rules via by_systems.opnsense

# ── Time sync (os-chrony — base ntpd retired, see tasks/_archive) ─────────────────────────────────────────────────────────────────
# Belgian NTP pool — geographically close stratum servers (FW is in Brussels TZ).
opnsense_chrony_peers:
  - "0.be.pool.ntp.org"
  - "1.be.pool.ntp.org"
  - "2.be.pool.ntp.org"
  - "3.be.pool.ntp.org"
# Networks chrony serves NTP to (empty list = client-only, no :123 listener).
# Internal VLANs (v4+v6 dual-stack) + OOB management plane.
opnsense_chrony_allowed_networks:
  - "{{ platform_internal_cidr4 }}"
  - "fd01::/32"
  - "10.6.224.0/20"

# ── LLDP (os-lldpd) ───────────────────────────────────────────────────────────
# LLDP only, announced on INTERNAL interfaces (OOB + LAN_TRUNK + VLANs) — never
# the WAN uplinks. Interface idents match the seed assignment order.
opnsense_lldpd_enabled: true
# Extra discovery protocols — keep OFF; LLDP (standard) is enough.
# Flip opnsense_lldpd_cdp only if you add Cisco gear that requires CDP.
opnsense_lldpd_cdp: false
opnsense_lldpd_fdp: false
opnsense_lldpd_edp: false
opnsense_lldpd_sonmp: false
opnsense_lldpd_interfaces:
  - "lan"     # OOB
  - "opt1"    # LAN_TRUNK
  - "opt2"    # MGMT
  - "opt3"    # DMZ
  - "opt4"    # SVC
  - "opt5"    # VPN
  - "opt6"    # IoT
  - "opt7"    # VoIP
  - "opt8"    # Storage
  - "opt9"    # Media
  - "opt10"   # GAMING
  - "opt11"   # CCTV

# WAN
opnsense_wan_interface: "vtnet0"
# DNS — Unbound in the prod chain: AdGuard -> Unbound(:53) -> dnscrypt-proxy(:53531)
# Unbound forwards PLAINTEXT to the local dnscrypt-proxy listener (which does the
# encrypted upstream). Unbound itself does NO DoT — see dns.yml. The old
# DoT-direct model (1.1.1.1/9.9.9.9:853) is removed; it caused TLS handshake
# failures when pointed at the plaintext dnscrypt port.
opnsense_unbound_enabled: true
# General block (unbound/settings general) — values match prod 2026-09-07 so prod is a noop;
# a freshly seeded FW ships enabled=0 and gets these on the first apply.
opnsense_unbound_port: 53
opnsense_unbound_active_interfaces: []   # [] = listen on all interfaces (slot ids otherwise)
opnsense_unbound_dnssec: true
opnsense_unbound_stats: true
opnsense_unbound_noregrecords: false   # true = do NOT register the FW hostname on every interface (catalog overrides carry the asset records)
# dnscrypt-proxy binds BOTH loopbacks (127.0.0.1:53531 + [::1]:53531). Forward to
# both for dual-stack loopback transport + failover (the loopback family does not
# limit record resolution — A and AAAA both resolve over either).
opnsense_unbound_dnscrypt_servers:
  - "::1"
  - "127.0.0.1"
opnsense_unbound_dnscrypt_port: 53531

# ── Monit (os-monit) — monitoring + email alerts via OUR Mailcow ──────────────
# Sender = the opnsense service mailbox (Vault prod/mail/opnsense, mailbox
# concern-role); recipient = the central alerts@ sink. Resend retired from this
# path (creds remain in Vault: resend/by-research).
opnsense_monit_enabled: true
opnsense_monit_interval: 120
opnsense_monit_startdelay: 120
opnsense_monit_alert_to: "alerts@{{ platform_domain }}"
# Process-down checks — pidfiles verified on vm-opns-01. ntpd is intentionally
# NOT here (chrony replaced it). Gateways are covered by dpinger, not Monit.
opnsense_monit_processes:
  - {name: "unbound", pidfile: "/var/run/unbound.pid"}
  - {name: "dnscrypt-proxy", pidfile: "/var/run/dnscrypt-proxy.pid"}
  - {name: "crowdsec", pidfile: "/var/run/crowdsec.pid"}
  - {name: "chronyd", pidfile: "/var/run/chrony/chronyd.pid"}
  - {name: "flowd_aggregate", pidfile: "/var/run/flowd_aggregate.pid"}
  - {name: "kea-dhcp4", pidfile: "/var/run/kea/kea-dhcp4.kea-dhcp4.pid"}
  - {name: "kea-dhcp6", pidfile: "/var/run/kea/kea-dhcp6.kea-dhcp6.pid"}

# Remote-host probes (type=host): declared per inventory (prod: the platform resolver on
# v4 + v6, see group_vars/opnsense.yml). Empty here so the tasks are no-ops elsewhere.
opnsense_monit_host_tests: []
opnsense_monit_hosts: []

# Prune (SVC-47): firewall-family objects the catalog no longer declares are always REPORTED at the
# end of an unscoped run; deletion is opt-in per run with the extra-var `-e opn_prune=true`
# (a catalog-side switch like the other opn_* keys, so it is not a role default) — tasks/prune.yml.

# Firewall aliases — source of truth for all firewall rules (ADR-0015)
# content MUST be a list — the alias module iterates it
# Names are explicit by context (firewall alias) — no alias_ prefix needed
opnsense_aliases:
  - name: "net_mgmt"
    type: "network"
    content: ["{{ platform_zones.mgmt.cidr4 }}"]
    description: "MGMT zone — VLAN 310"
  - name: "net_dmz"
    type: "network"
    content: ["{{ platform_zones.dmz.cidr4 }}"]
    description: "DMZ zone — VLAN 320"
  - name: "net_svc"
    type: "network"
    content: ["{{ platform_zones.svc.cidr4 }}"]
    description: "SVC zone — VLAN 330"
  - name: "port_https"
    type: "port"
    content: ["443"]
    description: "HTTPS"
  - name: "port_http"
    type: "port"
    content: ["80"]
    description: "HTTP"
  - name: "port_ssh"
    type: "port"
    content: ["22"]
    description: "SSH"

# Firewall rules — evaluated in order, first match wins
# interface values: wan, lan, opt1 (mgmt), opt2 (dmz), opt3 (svc)
# Use OPNsense interface IDs — check Interfaces > Assignments for actual names
opnsense_firewall_rules:
  # MGMT zone — full outbound (internet access for management)
  - description: "MGMT outbound — any"
    action: "pass"
    interface: "opt1"
    direction: "in"
    source: "net_mgmt"
    destination: "any"
    protocol: "any"

  # DMZ zone — outbound HTTP/HTTPS only
  - description: "DMZ outbound — HTTP"
    action: "pass"
    interface: "opt2"
    direction: "in"
    source: "net_dmz"
    destination: "any"
    destination_port: "port_http"
    protocol: "TCP"
  - description: "DMZ outbound — HTTPS"
    action: "pass"
    interface: "opt2"
    direction: "in"
    source: "net_dmz"
    destination: "any"
    destination_port: "port_https"
    protocol: "TCP"

  # SVC zone — outbound HTTP/HTTPS only
  - description: "SVC outbound — HTTP"
    action: "pass"
    interface: "opt3"
    direction: "in"
    source: "net_svc"
    destination: "any"
    destination_port: "port_http"
    protocol: "TCP"
  - description: "SVC outbound — HTTPS"
    action: "pass"
    interface: "opt3"
    direction: "in"
    source: "net_svc"
    destination: "any"
    destination_port: "port_https"
    protocol: "TCP"

# WAN gateway monitor IPs (Proximus PPPoE peer doesn't answer ICMP — monitor
# external hosts, like pfSense01 did with 1.1.1.1). Telenet monitors its own gw.
# v6 monitor MUST be reachable over Proximus v6: Quad9 v6 (2620:fe::fe) does NOT
# route from Proximus (100% loss) → false gateway-down → LAN v6 drops. Google v6
# (2001:4860:4860::8888) is reachable (verified 4.9 ms). Quad9 v4 (9.9.9.9) is fine.
opnsense_proximus_monitor_v4: "9.9.9.9"
opnsense_proximus_monitor_v6: "2001:4860:4860::8888"
# Firmware upgrade + plugins (reproducible via roles/opnsense/tasks/firmware.yml,
# NOT ad-hoc API). 26.1.8+ is required for the MVC gateway/firmware endpoints.
# Target OPNsense version is PER ENV (catalog: inventories/<env>/group_vars/opnsense.yml —
# prod 26.1.9, test 26.7). Empty here = no version-gated reboot wait.
opnsense_firmware_target: ""
# Applying pending updates/upgrades (reboots the FW) is a DELIBERATE per-env decision
# (catalog); never on by default. 26.7.0 -> 26.7.x on the ZFS lab VM lost its console after
# the reboot (2026-09-07) — understand that before enabling anywhere.
opnsense_firmware_upgrade: false
opnsense_plugins:
  - os-acme-client
  - os-chrony
  - os-crowdsec
  - os-ddclient        # Dynamic DNS (current plugin; keeps the DynDNS MVC API /api/dyndns)
  - os-dnscrypt-proxy
  - os-lldpd
  # os-mdns-repeater is deliberately NOT installed. A repeater re-broadcasts EVERY mDNS
  # service between the interfaces it serves — it cannot filter by service type — so it
  # publishes a live inventory of device and service names across those zones. The catalog
  # served mgmt, which is the administration plane and the zone least worth making
  # discoverable from gaming. It also cited infra/0004#§1-zone-taxonomy-mdns-exception,
  # and that ADR has no mDNS section at all — the exception was claimed, never written or
  # approved. Off until the ADR says otherwise (USER decision 2026-09-09).
  # - os-mdns-repeater
  - os-qemu-guest-agent

# --- Dynamic DNS (os-ddclient) -------------------------------------------------
# Apex-anchor model (failover-ready, no ISP identity exposed — ISO 27001 A.5.7 /
# NIS2 attack-surface minimisation):
#   * {{ platform_domain }} (apex) A/AAAA holds the ACTIVE WAN public IP — DynDNS updates
#     ONLY this record. Service names (vpn, nextcloud, …) are CNAME -> apex
#     (managed separately via Cloudflare-CRUD), so they all follow automatically.
#   * checkip=cloudflare is a WEB method = the active-default-route egress IP, so on
#     a gateway failover the apex swings to the surviving WAN. NOT interface-pinned.
#   * Ingress (DNAT + pass) is already applied on BOTH WANs and reply-to is on, so
#     whichever WAN the apex points to, Traefik + VPN answer symmetrically.
#   * Never touches the existing Telenet records — only writes the one apex record.
# Consumes by_systems.opnsense.opnsense_ddns_account (wraps lib DdnsAccountManager).
# The Cloudflare API token is NEVER stored here — the playbook pre-play reads Vault
# {env}/cloudflare/{zone} and hands it over as `opnsense_cf_zone` (dyndns.yml, no_log).
# Cloudflare auth: username empty (no '@') => Bearer-token mode (scoped token).
# Placeholder seed for the anchor record on first create (RFC 5737 TEST-NET). The
# record is created with this value only when absent; os-ddclient overwrites it with
# the live active-WAN IP on its first push (we restart the daemon to make that immediate).
opnsense_dyndns_seed_ip: "192.0.2.1"
opnsense_dyndns_seed_ip6: "2001:db8::1"   # RFC 3849 doc range; ddclient overwrites

# DynDNS accounts are PER ENV (public DNS = prod only): defined in
# inventories/prod/group_vars/opnsense.yml. Empty here = dyndns.yml skipped.
opnsense_dyndns_accounts: []

# --- Prune: what counts as an automatic object -------------------------------------------------
# Objects a firewall creates for itself and recreates on a reseed. They are excluded from the
# `unmanaged` rebuild-risk report (#358) so it stays signal. NOT used by the deletion path, which
# is gated on the catalog naming marker instead.
# Patterns verified against the live prod firewall 2026-09-12 — each one matched a real automatic
# object. Deliberately NOT here: "Default allow LAN to any rule", the factory OOB rule whose silent
# loss in the 26.7 rebuild is the reason this report exists.
opnsense_prune_builtin_alias_re: '^(__|bogons|bogonsv6|sshlockout|virusprot|crowdsec)'
# Kept as a list and joined into one alternation in the task: a single long regex trips the
# line-length lint, and both folded and continued YAML scalars silently inserted a space inside
# an alternative (it broke "block all targeting port 0" exactly that way).
opnsense_prune_builtin_rule_patterns:
  - 'Auto created rule'
  - 'anti-lockout'
  - 'CrowdSec'
  - 'RFC ?4890'
  - 'IPsec'
  - 'OpenVPN'
  - 'WireGuard'
  - 'Default deny'
  - 'block all targeting port 0'
  - 'sshlockout'
  - 'virusprot'
  - 'state violation'
  # Generated by OPNsense from the interface settings the SEED provides (blockpriv, blockbogons,
  # dhcp6) and from its own egress handling — a reseed recreates every one of them. Verified
  # against the live prod firewall 2026-09-12; without these the report is 15 lines of noise.
  - 'Block bogon'
  - 'Block private networks'
  - 'allow dhcpv6 client'
  - 'let out anything from firewall host'

# Family selection by VARIABLE (a playbook that imports opnsense.yml cannot pass --tags). Keys =
# the task-file names under roles/opnsense/tasks: firmware auth gateways routes dnscrypt dns dyndns
# chrony dhcp ids mdns acme lldpd aliases rules nat services monit syslog prune. The Vault pre-plays
# of playbooks/opnsense.yml honour the same lists (auth, monit, acme+dyndns).
opn_skip_families: []    # noqa: var-naming[no-role-prefix] (catalog contract name) — families NOT to run
opn_only_families: []    # noqa: var-naming[no-role-prefix] (catalog contract name) — when set, ONLY these run
