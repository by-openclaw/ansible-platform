---
# Install automated Vault raft snapshots on the vault host. The timer runs with a
# low-privilege, self-renewing periodic token (snapshot-read only), never root.
- name: "vault_backup | Authenticate to Vault (ansible-deploy AppRole; root fallback)"
  ansible.builtin.include_role:
    name: vault_login

- name: "vault_backup | Use the deploy token"
  ansible.builtin.set_fact:
    vault_root_token: "{{ vault_deploy_token }}"
  no_log: true

- name: "vault_backup | Write the snapshot policy (raft snapshot read only)"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-i"
      - "-e"
      - "VAULT_TOKEN={{ vault_root_token }}"
      - "{{ vault_container_name }}"
      - vault
      - policy
      - write
      - "{{ vault_backup_policy_name }}"
      - "-"
    stdin: |
      path "sys/storage/raft/snapshot" {
        capabilities = ["read"]
      }
  changed_when: true
  no_log: true

- name: "vault_backup | Existing snapshot token on the host?"
  ansible.builtin.stat:
    path: "{{ vault_backup_token_file }}"
  register: _tok_stat

- name: "vault_backup | Validate the existing token"
  ansible.builtin.shell:
    cmd: >-
      docker exec -e VAULT_TOKEN="$(cat {{ vault_backup_token_file }})"
      {{ vault_container_name }} vault token lookup >/dev/null 2>&1 && echo valid || echo invalid
  register: _tok_valid
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  changed_when: false
  when: _tok_stat.stat.exists
  no_log: true

- name: "vault_backup | Create a periodic snapshot token (absent or invalid)"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "-e"
      - "VAULT_TOKEN={{ vault_root_token }}"
      - "{{ vault_container_name }}"
      - vault
      - token
      - create
      - "-policy={{ vault_backup_policy_name }}"
      - "-period={{ vault_backup_token_period }}"
      - "-orphan"
      - "-format=json"
  register: _newtok
  changed_when: true
  no_log: true
  when: (not _tok_stat.stat.exists) or ((_tok_valid.stdout | default('invalid')) == 'invalid')

- name: "vault_backup | Token dir (0700)"
  ansible.builtin.file:
    path: "{{ vault_backup_token_file | dirname }}"
    state: directory
    mode: "0700"

- name: "vault_backup | Store the snapshot token (0600)"
  ansible.builtin.copy:
    dest: "{{ vault_backup_token_file }}"
    content: "{{ (_newtok.stdout | from_json).auth.client_token }}"
    mode: "0600"
  when: _newtok is defined and (_newtok is not skipped)
  no_log: true

- name: "vault_backup | Snapshot dir (0700)"
  ansible.builtin.file:
    path: "{{ vault_backup_dir }}"
    state: directory
    mode: "0700"

# The daily raft snapshot (roles/host_job: systemd service + timer, no script). Steps
# run in order; the token is read from its 0600 file at run time. `-` = a failed
# renew is tolerated (as before); `%%`/`$$` are systemd's escapes for % and $.
- name: "vault_backup | Daily raft snapshot (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: vault-snapshot
    host_job_description: "Vault raft snapshot"
    host_job_on_calendar: "{{ vault_backup_schedule }}"
    host_job_exec:
      - >-
        -/bin/bash -c 'docker exec -e VAULT_TOKEN="$$(cat {{ vault_backup_token_file }})"
        {{ vault_container_name }} vault token renew >/dev/null'
      - >-
        /bin/bash -c 'docker exec -e VAULT_TOKEN="$$(cat {{ vault_backup_token_file }})"
        {{ vault_container_name }} vault operator raft snapshot save /tmp/vault.snap'
      - >-
        /bin/bash -c 'docker cp {{ vault_container_name }}:/tmp/vault.snap
        {{ vault_backup_dir }}/vault-$$(date -u +%%Y%%m%%dT%%H%%M%%SZ).snap'
      - "/usr/bin/docker exec {{ vault_container_name }} rm -f /tmp/vault.snap"
      - >-
        /bin/bash -c 'chmod 600 {{ vault_backup_dir }}/vault-*.snap;
        test -s "$$(ls -1t {{ vault_backup_dir }}/vault-*.snap | head -1)"'
    # vault_backup_keep daily snapshots = that many days of age.
    host_job_retention:
      - { path: "{{ vault_backup_dir }}", age: "{{ vault_backup_keep }}d" }
    host_job_legacy_script: /usr/local/bin/vault-snapshot.sh

- name: "vault_backup | Take a snapshot now (verify the chain works)"
  ansible.builtin.systemd_service:
    name: vault-snapshot.service
    state: started
  when: not ansible_check_mode
