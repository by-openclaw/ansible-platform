---
# The `root` user's password, from Vault (get-or-create). An existing path is READ: re-minting
# it would lock Patroni out of the store on every member. Its own file, imported with
# `tags: [always]`: the cluster phase authenticates with it, and a tagged run
# (`--tags container,cluster`, 2026-10-27) failed "Every member is healthy" on a healthy store
# because the password had never been fetched. (Not named *secret*.yml: .gitignore drops such
# files — #1038 shipped the import without the file.)
- name: "root_password | etcd root password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ etcd_vault_path }}"
    vault_secret_init:
      username: root
      password: "{{ lookup('community.general.random_string', length=32, special=false) }}"

- name: "root_password | Bind it"
  ansible.builtin.set_fact:
    etcd_root_password: "{{ vault_secret_result.password }}"
  no_log: true
