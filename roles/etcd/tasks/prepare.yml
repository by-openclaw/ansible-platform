---
- name: "Prepare | The wildcard cert (tls.yml — playbooks/certs-sync.yml runs it alone after a renewal)"
  ansible.builtin.import_tasks: tls.yml

- name: "prepare | Data directory (owned by the member's uid, nobody else reads it)"
  ansible.builtin.file:
    path: "{{ etcd_data_host_dir }}"
    state: directory
    owner: "{{ etcd_uid }}"
    group: "{{ etcd_uid }}"
    mode: "0700"
