---
# ==============================================================================
# Role: wazuh_agent — the Wazuh agent on every guest (FIM, log collection, syscheck,
# vulnerability inventory), enrolled with the Vault-held password against the manager.
# Pinned to the manager's version (an agent must never be newer than its manager).
# ==============================================================================
wazuh_agent_version: "4.14.7-1"
wazuh_agent_apt_key_url: "https://packages.wazuh.com/key/GPG-KEY-WAZUH"
wazuh_agent_apt_repo: "deb [signed-by=/usr/share/keyrings/wazuh.gpg] https://packages.wazuh.com/4.x/apt/ stable main"
wazuh_agent_manager: "{{ hostvars[groups['wazuh'][0]].ansible_host }}"
wazuh_agent_port: 1514
wazuh_agent_enrol_port: 1515
wazuh_agent_vault_enrol: "{{ platform_env | default('prod') }}/wazuh/agent-enrol"   # password (roles/wazuh)
wazuh_agent_group: "{{ 'docker' if inventory_hostname in groups['docker_hosts'] | default([]) else 'default' }}"
