---
# The PGADMIN_SERVER_JSON_FILE env only imports on first init. For an existing
# pgAdmin (persisted data volume) load the connection explicitly. Idempotent:
# only (re)load when the server is absent or its host/port has drifted, so a
# no-change run reports changed=0 (and never creates a duplicate).
- name: "servers | Wait for pgAdmin to be ready"
  ansible.builtin.uri:
    url: "http://{{ pgadmin_listen_ip }}:{{ pgadmin_host_port }}/login"
    status_code: 200
  register: pgadmin_ready
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  retries: 20
  delay: 3
  until: pgadmin_ready.status == 200
  changed_when: false

# pgAdmin runs a server's PasswordExecCommand ONLY for that server's OWNER, so a
# single SHARED server can never connect passwordless for non-owner SSO users
# (they get a "Connect to Server" password prompt / HTTP 428, sharedserverbad).
# Provision a PER-USER server (owned by each pgAdmin user) with passexec instead.
# pg_provision.py is idempotent — matches by (user_id, name), converges on drift,
# and un-shares any legacy shared copy of the same name.
- name: "servers | Stage the per-user provisioner config"
  ansible.builtin.copy:
    dest: /tmp/pg_provision.json
    mode: "0644"
    content: >-
      {{ {'name': pgadmin_pg_server_name, 'host': pgadmin_pg_host, 'port': pgadmin_pg_port,
          'maintenance_db': pgadmin_pg_maintenance_db, 'username': pgadmin_pg_username,
          'sslmode': pgadmin_pg_sslmode, 'passexec': pgadmin_pg_passexec_cmd,
          'comment': 'Per-user server (pgadmin role) — passexec, passwordless connect.'} | to_json }}

- name: "servers | Stage the provisioner script"
  ansible.builtin.copy:
    src: pg_provision.py
    dest: /tmp/pg_provision.py
    mode: "0644"

- name: "servers | Copy provisioner + config into the container"
  ansible.builtin.command:
    cmd: "docker cp {{ item }} pgadmin:{{ item }}"
  loop:
    - /tmp/pg_provision.json
    - /tmp/pg_provision.py
  changed_when: false

- name: "servers | Provision a per-user passexec server for every pgAdmin user"
  community.docker.docker_container_exec:
    container: pgadmin
    command: /venv/bin/python3 /tmp/pg_provision.py
  register: pgadmin_provision
  changed_when: "'CHANGED=0' not in pgadmin_provision.stdout"

# --- Passexec connect flow: no password prompt, survives container recreate ------
# pgAdmin runs PasswordExecCommand (cat the passfile) at connect. The passfile is put INTO the
# persistent data volume from the DBA login's secret, and the server row points at the passexec
# command. That makes it durable: an old live-only edit was lost whenever the container was
# recreated; here every deploy re-asserts it. One module task: it compares content, owner and
# mode with what the container holds and writes only on a difference — through the Docker API,
# so the password is on no command line, and byte for byte (no trailing newline: `cat` must
# return the exact password).
- name: "servers | The DBA passfile in the container (content, owner, mode)"
  community.docker.docker_container_copy_into:
    container: pgadmin
    container_path: "{{ pgadmin_pg_passfile_container }}"
    content: "{{ pgadmin_pg_dba_password }}"
    owner_id: "{{ pgadmin_container_uid }}"
    group_id: "{{ pgadmin_container_gid }}"
    mode: "{{ pgadmin_pg_passfile_mode }}"
    mode_parse: octal_string_only
  diff: false   # the content is a password
  no_log: true
  when: pgadmin_pg_dba_password is defined

# (passexec_cmd is set per-user by pg_provision.py above — no separate task needed.)
