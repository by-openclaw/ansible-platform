---
# The admin password, the Authentik OIDC client and the PG superuser password —
# all from Vault; nothing read from or written to the controller (#377). no_log.

# Get-or-create: the path exists, so the live password is READ. Re-minting it
# would lock the local admin out of pgAdmin.
- name: "secrets | The pgAdmin admin password (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pgadmin_vault_path }}"
    vault_secret_init:
      url: "https://{{ pgadmin_fqdn }}"
      email: "{{ pgadmin_default_email }}"
      password: "{{ lookup('community.general.random_string', length=24, special=false) }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pgadmin_admin_password: "{{ vault_secret_result.password }}"
  no_log: true

# Read-if-present: roles/authentik mints it; pgAdmin can be installed before SSO.
- name: "secrets | The Authentik OIDC client, if it exists yet"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ pgadmin_oidc_vault_path }}"
    vault_secret_optional: true

- name: "secrets | Bind it, and whether SSO can be configured"
  ansible.builtin.set_fact:
    pgadmin_oidc: "{{ vault_secret_result | default({}) }}"
    pgadmin_oidc_held: "{{ (vault_secret_result | default({})).client_secret | default('') | length > 0 }}"
  no_log: true

- name: "secrets | Build the base pgAdmin environment"
  ansible.builtin.set_fact:
    pgadmin_env:
      PGADMIN_DEFAULT_EMAIL: "{{ pgadmin_default_email }}"
      PGADMIN_DEFAULT_PASSWORD: "{{ pgadmin_admin_password }}"
      PGADMIN_LISTEN_PORT: "{{ pgadmin_container_port | string }}"
      # Honor Traefik's X-Forwarded-* so pgAdmin builds correct https URLs.
      PGADMIN_CONFIG_PROXY_X_FOR_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PROTO_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_HOST_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PORT_COUNT: "1"
      PGADMIN_CONFIG_PROXY_X_PREFIX_COUNT: "1"
      # No per-user master password: the shared server's password is supplied by a
      # PasswordExecCommand (see below), not stored/encrypted in a pgAdmin profile.
      # Avoids the master-password prompt AND the master-key-decrypt fragility.
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      # Allow servers to source their password from a command (PasswordExecCommand).
      # Off by default in pgAdmin; required for the passexec connect flow.
      PGADMIN_CONFIG_ENABLE_SERVER_PASS_EXEC_CMD: "True"
      # Disable pgAdmin's OWN MFA — Authentik provides MFA for the SSO login, so
      # pgAdmin's internal MFA would force a redundant second authenticator.
      PGADMIN_CONFIG_MFA_ENABLED: "False"
  no_log: true

- name: "secrets | Merge the Authentik OIDC env into the pgAdmin environment"
  ansible.builtin.set_fact:
    pgadmin_env: "{{ pgadmin_env | combine(pgadmin_oauth_env) }}"
  vars:
    # ENHANCED_COOKIE_PROTECTION must be off behind a reverse proxy or the OAuth2
    # round-trip drops the session and pgAdmin reports 'CSRF token is missing'.
    pgadmin_oauth_env:
      PGADMIN_CONFIG_AUTHENTICATION_SOURCES: "['oauth2', 'internal']"
      PGADMIN_CONFIG_OAUTH2_AUTO_CREATE_USER: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      # Restrict pgAdmin login to members of the pgadmin-admins group — without
      # this, ANY Authentik user could log in and see the shared server.
      PGADMIN_CONFIG_OAUTH2_ADDITIONAL_CLAIMS: "{'groups': ['{{ pgadmin_oidc_access_group }}']}"
      PGADMIN_CONFIG_OAUTH2_CONFIG: >-
        [{'OAUTH2_NAME': 'authentik',
        'OAUTH2_DISPLAY_NAME': '{{ pgadmin_oidc_display_name }}',
        'OAUTH2_CLIENT_ID': '{{ pgadmin_oidc.client_id }}',
        'OAUTH2_CLIENT_SECRET': '{{ pgadmin_oidc.client_secret }}',
        'OAUTH2_TOKEN_URL': '{{ pgadmin_authentik_base }}/application/o/token/',
        'OAUTH2_AUTHORIZATION_URL': '{{ pgadmin_authentik_base }}/application/o/authorize/',
        'OAUTH2_API_BASE_URL': '{{ pgadmin_authentik_base }}/',
        'OAUTH2_USERINFO_ENDPOINT': '{{ pgadmin_authentik_base }}/application/o/userinfo/',
        'OAUTH2_SERVER_METADATA_URL': '{{ pgadmin_authentik_base }}/application/o/{{ pgadmin_oidc_app_slug }}/.well-known/openid-configuration',
        'OAUTH2_SCOPE': 'openid email profile groups',
        'OAUTH2_USERNAME_CLAIM': 'email',
        'OAUTH2_ICON': 'fa-key',
        'OAUTH2_BUTTON_COLOR': '#fd4b2d'}]
  no_log: true
  when: pgadmin_oidc_held | bool

# --- Volumes + servers.json import (shared Postgres connection) ------------------
- name: "secrets | Build the pgAdmin volume list"
  ansible.builtin.set_fact:
    pgadmin_volumes:
      - "{{ pgadmin_data_volume }}:/var/lib/pgadmin"
      # Host CA store — verify TLS (pgAdmin → Postgres verify-full) via the LE chain.
      - "/etc/ssl/certs:/etc/ssl/certs:ro"
      # libpq's verify-full reads the CA from ~/.postgresql/root.crt — mount the
      # system bundle there so the Postgres connection validates without errors.
      - "/etc/ssl/certs/ca-certificates.crt:{{ pgadmin_pg_root_cert_path }}:ro"

- name: "secrets | Wire the shared servers.json import (Postgres connection)"
  ansible.builtin.set_fact:
    pgadmin_volumes: "{{ pgadmin_volumes + [pgadmin_servers_host_path ~ ':/pgadmin4/servers.json:ro'] }}"
    pgadmin_env: "{{ pgadmin_env | combine({'PGADMIN_SERVER_JSON_FILE': '/pgadmin4/servers.json'}) }}"
  when: pgadmin_register_pg_server | bool

# --- PG superuser password (feeds the passexec file; never enters servers.json) --
# tags: [servers] on the include AND apply: — an include_role's own tags do not
# reach the role's tasks, so without apply `--tags servers` would skip the read and
# the passfile task would find no password.
- name: "secrets | The PG superuser password, if it exists"
  ansible.builtin.include_role:
    name: vault_secret
    apply:
      tags: [servers]
  vars:
    vault_secret_path: "{{ pgadmin_pg_superuser_vault_path }}"
    vault_secret_optional: true
  when: pgadmin_register_pg_server | bool
  tags: [servers]

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    pgadmin_pg_superuser_password: "{{ vault_secret_result.password }}"
  no_log: true
  when:
    - pgadmin_register_pg_server | bool
    - (vault_secret_result | default({})).password | default('') | length > 0
  tags: [servers]
