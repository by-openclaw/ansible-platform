---
# Resolve the pgAdmin admin password: reuse the controller secret file if
# present, else generate a strong password and persist it (0600). no_log.
- name: "secrets | Stat pgadmin secret on controller"
  ansible.builtin.stat:
    path: "{{ pgadmin_secret_dir }}/{{ pgadmin_secret_file }}"
  delegate_to: localhost
  become: false
  register: pgadmin_secret_stat

- name: "secrets | Load existing admin password"
  ansible.builtin.set_fact:
    pgadmin_admin_password: "{{ (lookup('file', pgadmin_secret_dir + '/' + pgadmin_secret_file) | from_json).fields.password }}"
  no_log: true
  when: pgadmin_secret_stat.stat.exists

- name: "secrets | Generate admin password"
  ansible.builtin.set_fact:
    pgadmin_admin_password: "{{ lookup('community.general.random_string', length=24, special=false) }}"
  no_log: true
  when: not pgadmin_secret_stat.stat.exists

- name: "secrets | Persist pgadmin secret (0600)"
  ansible.builtin.copy:
    dest: "{{ pgadmin_secret_dir }}/{{ pgadmin_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': {'url': 'https://' + pgadmin_fqdn, 'email': pgadmin_default_email, 'password': pgadmin_admin_password}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not pgadmin_secret_stat.stat.exists
