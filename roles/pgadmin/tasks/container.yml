---
- name: "container | Pull the pinned pgAdmin image"
  community.docker.docker_image:
    name: "{{ pgadmin_image }}"
    source: pull
    state: present

- name: "container | Run pgAdmin"
  community.docker.docker_container:
    name: pgadmin
    image: "{{ pgadmin_image }}"
    state: started
    restart_policy: unless-stopped
    pull: false
    published_ports:
      - "{{ pgadmin_listen_ip }}:{{ pgadmin_host_port }}:{{ pgadmin_container_port }}"
    # Volume list (incl. the shared servers.json when enabled) — built in secrets.yml.
    volumes: "{{ pgadmin_volumes }}"
    # Base env + Authentik OIDC SSO env + servers.json import — built in secrets.yml.
    env: "{{ pgadmin_env }}"
  no_log: true
