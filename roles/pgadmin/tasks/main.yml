---
# ==============================================================================
# Role: pgadmin — dispatcher
# ==============================================================================
- name: Resolve / generate the admin password
  ansible.builtin.import_tasks: secrets.yml
  tags: [pgadmin, secrets]

- name: Run the pgAdmin container
  ansible.builtin.import_tasks: container.yml
  tags: [pgadmin, container]

- name: Publish pgAdmin via Traefik (internal-only)
  ansible.builtin.include_role:
    name: traefik_route
    # apply tags to the INCLUDED tasks too — without this, `--tags route` runs
    # the include but skips the route's file-write (dynamic include_role does not
    # propagate tags to inner tasks), so the route is never re-rendered.
    apply:
      tags: [pgadmin, route]
  vars:
    traefik_route_name: pgadmin
    traefik_route_fqdn: "{{ pgadmin_fqdn }}"
    traefik_route_backend_url: "{{ pgadmin_traefik_backend }}"
    traefik_route_internal_only: true
  tags: [pgadmin, route]
