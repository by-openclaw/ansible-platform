---
# ==============================================================================
# Role: pgadmin — pgAdmin 4 (Docker) on lxc-pgadmin-01 (SVC 10.1.3.140)
# Internal-only DB admin UI, fronted by Traefik (wildcard TLS + ipAllowList).
# Connects to Postgres over TLS (sslmode=verify-full, public LE CA).
# ==============================================================================
pgadmin_image: "dpage/pgadmin4:9.18"   # exact pin — bump deliberately (2026-09-17)

pgadmin_fqdn: "{{ platform_service_fqdns.pgadmin }}"

# Bind the container to the SVC IP so Traefik (on the DMZ host) can reach it.
pgadmin_listen_ip: "{{ hostvars[groups['pgadmin'] | first].ansible_host }}"
pgadmin_host_port: 8080
pgadmin_container_port: 80
pgadmin_traefik_backend: "http://{{ pgadmin_listen_ip }}:{{ pgadmin_host_port }}"

# Initial admin login (password generated once + stored in the controller store).
pgadmin_default_email: "admin@{{ platform_domain }}"
# Vault KV paths (security/0001) — no controller files.
pgadmin_vault_path: "{{ platform_env }}/pgadmin/admin"

# Persistent data (server list, prefs) across container re-creation.
pgadmin_data_volume: "pgadmin-data"

# --- Authentik OIDC SSO (optional) ---------------------------------------------
# Wired only when the OIDC client secret file exists (created by the SSO phase).
# The Authentik app/provider is declared in group_vars/all/sso.yml (authentik_oidc_apps).
pgadmin_oidc_vault_path: "{{ platform_env }}/pgadmin/oidc"   # minted by roles/authentik
pgadmin_authentik_base: "https://{{ platform_service_fqdns.authentik }}"
pgadmin_oidc_app_slug: "pgadmin"
pgadmin_oidc_display_name: "{{ platform_org | upper }} SSO"
# Only members of this Authentik group may log into pgAdmin (group-based access).
pgadmin_oidc_access_group: "{{ platform_service_groups.pgadmin.admin }}"

# --- Pre-provisioned PostgreSQL connection (shared servers.json) ----------------
# Registers the platform Postgres as a SHARED server visible to all SSO users.
# Password is NOT stored — entered on connect (sourced from Vault later).
pgadmin_register_pg_server: true
pgadmin_pg_server_name: "{{ platform_org | upper }} PostgreSQL"
pgadmin_pg_host: "{{ platform_pg_host }}"   # FQDN so verify-full matches the cert
pgadmin_pg_port: 5432
pgadmin_pg_maintenance_db: "postgres"
# The login pgAdmin connects with: a dedicated DBA role (least privilege, services/0004 SVC-29/31) —
# read everything, monitor, maintain (VACUUM/ANALYZE/REINDEX), signal backends; NOT the superuser,
# whose credential stays break-glass in Vault (psql, audited, rotated after use).
pgadmin_pg_username: "{{ pgadmin_dba_user }}"
pgadmin_dba_user: "{{ platform_pg_dba_logins.pgadmin }}"   # group_vars/all/postgresql.yml — the single source (postgres_db grants it CONNECT everywhere)
pgadmin_dba_vault_path: "{{ platform_env }}/pgadmin/dba"   # minted by the role (get-or-create)  # pragma: allowlist secret
pgadmin_dba_memberships: [pg_read_all_data, pg_monitor, pg_maintain, pg_signal_backend]   # PostgreSQL 17 predefined roles
# Shared servers expose shared_username (not username) to non-owner SSO users —
# must be set or pgAdmin shows "Username must be specified".
pgadmin_pg_shared_username: "{{ pgadmin_dba_user }}"
pgadmin_pg_sslmode: "verify-full"
pgadmin_servers_host_path: "/etc/pgadmin/servers.json"
# The shared server connects WITHOUT prompting for the postgres password: pgAdmin
# runs a "password exec command" at connect time that cats a file in the (persistent)
# data volume. That file is populated at deploy from the DBA login's secret — so the
# password is never baked into servers.json and is re-asserted after any container
# recreate (which is what made the old live-only fix regress on restart).
# Source of truth for the superuser password (fabric secret; Vault migration = TODO,
# tracked platform-wide for ALL db-pgsql-*.json, not just pgAdmin).
# ({env}/postgres/superuser is no longer read by this role — SVC-31: the superuser is break-glass only)
pgadmin_pg_passfile_container: "/var/lib/pgadmin/.pgpass-pg"   # in the persistent volume
pgadmin_pg_passfile_mode: "0600"
pgadmin_container_uid: 5050   # the image's `pgadmin` user, who runs the passexec command …
pgadmin_container_gid: 0      # … and its group (root), as the image creates its files
pgadmin_pg_passexec_cmd: "/bin/cat {{ pgadmin_pg_passfile_container }}"
# libpq (used by pgAdmin to reach Postgres) looks for the verify-full CA at
# ~/.postgresql/root.crt by default. The container HOME is /home/pgadmin; point
# that path at the system bundle (ISRG Root X1 → trusts the LE server cert).
pgadmin_pg_root_cert_path: "/home/pgadmin/.postgresql/root.crt"

# pgAdmin's OWN state (users, servers, preferences) on the shared PostgreSQL
# (services/0004), provisioned by the scaffold's db step under the naming convention
# (database + owner = the service name, password at {env}/pgadmin/db-pgsql).
pgadmin_state_db: "pgadmin"
pgadmin_state_user: "pgadmin"
pgadmin_state_vault_path: "{{ platform_env }}/pgadmin/db-pgsql"
# The per-user server rows are written on that database from the cluster's leader, through
# the PostgreSQL container's local socket (no password travels).
pgadmin_state_pg_container: "postgres"   # the shared cluster's container on the database host
pgadmin_state_pg_delegate: "{{ platform_pg_leader | default(groups['postgresql'] | first) }}"   # the leader (the task asks postgres_db/leader first)
pgadmin_state_psql: [psql, -U, postgres, -d, "{{ pgadmin_state_db }}", -X, -At, -v, ON_ERROR_STOP=1]
pgadmin_pg_server_comment: "Per-user server (pgadmin role) — passexec, passwordless connect."
pgadmin_pg_server_group: "Servers"       # the group created for a user who has none
pgadmin_per_user_server_psql_vars:
  - -v
  - "p_name={{ pgadmin_pg_server_name }}"
  - -v
  - "p_host={{ pgadmin_pg_host }}"
  - -v
  - "p_port={{ pgadmin_pg_port }}"
  - -v
  - "p_maintenance_db={{ pgadmin_pg_maintenance_db }}"
  - -v
  - "p_username={{ pgadmin_pg_username }}"
  - -v
  - "p_connection_params={{ {'sslmode': pgadmin_pg_sslmode} | to_json }}"
  - -v
  - "p_passexec={{ pgadmin_pg_passexec_cmd }}"
  - -v
  - "p_comment={{ pgadmin_pg_server_comment }}"
  - -v
  - "p_group={{ pgadmin_pg_server_group }}"
pgadmin_retired_provisioner_files: [/tmp/pg_provision.py, /tmp/pg_provision.json]   # staged by the retired program
