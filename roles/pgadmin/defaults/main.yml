---
# ==============================================================================
# Role: pgadmin — pgAdmin 4 (Docker) on lxc-pgadmin-01 (SVC 10.1.3.140)
# Internal-only DB admin UI, fronted by Traefik (wildcard TLS + ipAllowList).
# Connects to Postgres over TLS (sslmode=verify-full, public LE CA).
# ==============================================================================
pgadmin_image: "dpage/pgadmin4:9.17"   # exact pin — bump deliberately

pgadmin_fqdn: "pgadmin.by-research.be"

# Bind the container to the SVC IP so Traefik (on the DMZ host) can reach it.
pgadmin_listen_ip: "10.1.3.140"
pgadmin_host_port: 8080
pgadmin_container_port: 80
pgadmin_traefik_backend: "http://{{ pgadmin_listen_ip }}:{{ pgadmin_host_port }}"

# Initial admin login (password generated once + stored in the controller store).
pgadmin_default_email: "admin@by-research.be"
pgadmin_secret_dir: "~/.openclaw/workspace/infra/secrets"
pgadmin_secret_file: "pgadmin-admin.json"

# Persistent data (server list, prefs) across container re-creation.
pgadmin_data_volume: "pgadmin-data"

# --- Authentik OIDC SSO (optional) ---------------------------------------------
# Wired only when the OIDC client secret file exists (created by the SSO phase).
# The Authentik app/provider is declared in the authentik role (authentik_oidc_apps).
pgadmin_oidc_secret_file: "app-oidc-pgadmin.json"
pgadmin_authentik_base: "https://authentik.by-research.be"
pgadmin_oidc_app_slug: "pgadmin"
pgadmin_oidc_display_name: "BY-RESEARCH SSO"
# Only members of this Authentik group may log into pgAdmin (group-based access).
pgadmin_oidc_access_group: "pgadmin-admins"

# --- Pre-provisioned PostgreSQL connection (shared servers.json) ----------------
# Registers the platform Postgres as a SHARED server visible to all SSO users.
# Password is NOT stored — entered on connect (sourced from Vault later).
pgadmin_register_pg_server: true
pgadmin_pg_server_name: "BY-RESEARCH PostgreSQL"
pgadmin_pg_host: "lxc-pgsql-01.by-research.be"   # FQDN so verify-full matches the cert
pgadmin_pg_port: 5432
pgadmin_pg_maintenance_db: "postgres"
pgadmin_pg_username: "postgres"                   # superuser → sees all service DBs
# Shared servers expose shared_username (not username) to non-owner SSO users —
# must be set or pgAdmin shows "Username must be specified".
pgadmin_pg_shared_username: "postgres"
pgadmin_pg_sslmode: "verify-full"
pgadmin_servers_host_path: "/etc/pgadmin/servers.json"
# libpq (used by pgAdmin to reach Postgres) looks for the verify-full CA at
# ~/.postgresql/root.crt by default. The container HOME is /home/pgadmin; point
# that path at the system bundle (ISRG Root X1 → trusts the LE server cert).
pgadmin_pg_root_cert_path: "/home/pgadmin/.postgresql/root.crt"
