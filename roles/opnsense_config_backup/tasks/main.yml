---
- name: "FW backup | FW API credentials from Vault (roles/opnsense_api_creds, PR 17c)"
  ansible.builtin.include_role:
    name: opnsense_api_creds

- name: "FW backup | age (encryption)"
  ansible.builtin.apt:
    name: age
    state: present

# NO check_mode here: this creates key material, and it is only used when Vault holds none.
- name: "FW backup | Generate a candidate age keypair (used only if Vault has none)"
  ansible.builtin.command: age-keygen
  register: opnsense_config_backup_keygen
  changed_when: false
  no_log: true

# NO check_mode here: this creates key material, and it is only used when Vault holds none.
- name: "FW backup | Get-or-create the age keypair in Vault (private key lives ONLY there)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ opnsense_config_backup_vault_path }}"
    vault_secret_init:
      public_key: "{{ opnsense_config_backup_keygen.stdout | regex_search('age1[0-9a-z]+') }}"
      private_key: "{{ opnsense_config_backup_keygen.stdout | regex_search('AGE-SECRET-KEY-1[0-9A-Z]+') }}"

- name: "FW backup | Bind the recipient + FW API creds (from the opnsense group vars)"
  ansible.builtin.set_fact:
    opnsense_config_backup_age_public: "{{ vault_secret_result.public_key }}"
    opnsense_config_backup_fw_key: "{{ opn_key }}"
    opnsense_config_backup_fw_secret: "{{ opn_secret }}"
  no_log: true

- name: "FW backup | Environment file (root 0600)"
  ansible.builtin.template:
    src: env.j2
    dest: "{{ opnsense_config_backup_env_file }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true

# The nightly export (roles/host_job: systemd service + timer, no script). Steps run
# in order: download → verify it is an OPNsense config → age-encrypt into daily/ →
# on the 1st keep a monthly copy. Credentials come from the 0600 environment file
# (${VAR} = systemd substitution; `$$`/`%%` = literal $ and % for bash/date).
# Retention: daily by age; monthly by age (keep_monthly months).
- name: "FW backup | Nightly export (roles/host_job)"
  ansible.builtin.include_role:
    name: host_job
  vars:
    host_job_name: opnsense-config-backup
    host_job_description: "OPNsense config export (age-encrypted) to NFS"
    host_job_on_calendar: "{{ opnsense_config_backup_schedule }}"
    host_job_randomized_delay: "300"
    host_job_environment_file: "{{ opnsense_config_backup_env_file }}"
    host_job_requires_mounts_for: "{{ opnsense_config_backup_dest }}"
    host_job_runtime_directory: opnsense-config-backup
    host_job_exec:
      - >-
        /usr/bin/curl -fsS --max-time 60 --resolve ${FW_RESOLVE} -u ${FW_KEY}:${FW_SECRET}
        ${FW_URL}/api/core/backup/download/this -o /run/opnsense-config-backup/config.xml
      - "/usr/bin/grep -q <opnsense> /run/opnsense-config-backup/config.xml"
      - >-
        /bin/bash -c 'umask 077; mkdir -p {{ opnsense_config_backup_dest }}/daily {{ opnsense_config_backup_dest }}/monthly;
        age -r "$$AGE_RECIPIENT" -o {{ opnsense_config_backup_dest }}/daily/fw-config-$$(date +%%F).xml.age
        /run/opnsense-config-backup/config.xml'
      - >-
        /bin/bash -c '[ "$$(date +%%d)" != 01 ] || cp -p {{ opnsense_config_backup_dest }}/daily/fw-config-$$(date +%%F).xml.age
        {{ opnsense_config_backup_dest }}/monthly/'
    host_job_retention:
      - { path: "{{ opnsense_config_backup_dest }}/daily", age: "{{ opnsense_config_backup_keep_daily }}d" }
      - { path: "{{ opnsense_config_backup_dest }}/monthly", age: "{{ (opnsense_config_backup_keep_monthly | int) * 31 }}d" }
    host_job_legacy_script: "{{ opnsense_config_backup_script }}"
