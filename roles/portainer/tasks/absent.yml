---
# Decommission (-e portainer_state=absent): the console holds no platform data, so
# nothing is archived; the guest itself is removed by Terraform. Agents are removed
# by the agent play with the same flag. Vault paths are left in place (archive rule).
- name: "Portainer | Remove the server container"
  community.docker.docker_container:
    name: portainer
    state: absent

- name: "Portainer | Remove its data volume (console state only; rebuilt from Vault + inventory)"
  community.docker.docker_volume:
    name: portainer-data
    state: absent

- name: "Portainer | Remove the layout directory"
  ansible.builtin.file:
    path: "{{ portainer_dir }}"
    state: absent
