---
# Native SSO: Portainer authenticates against Authentik itself (OAuth/OIDC), so the
# console knows WHO acted, not just that someone passed the proxy. Applied through the
# API because Portainer keeps settings in its own database. Idempotent: the settings
# are read first and written only when they differ.
- name: "Portainer | OIDC client credentials (Vault, minted by roles/authentik)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ portainer_oidc_vault_path }}"
    vault_secret_init: {}

- name: "Portainer | Bind the OIDC client"
  ansible.builtin.set_fact:
    portainer_oidc: "{{ vault_secret_result }}"
  no_log: true

- name: "Portainer | API session (admin from Vault)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/api/auth"
    method: POST
    body_format: json
    body: { username: "{{ portainer_admin_user }}", password: "{{ portainer_admin_password }}" }
    headers: { Host: "{{ portainer_fqdn }}" }
    status_code: [200]
  register: portainer_sso_auth
  no_log: true
  check_mode: false

- name: "Portainer | Settings today"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/api/settings"
    headers:
      Host: "{{ portainer_fqdn }}"
      Authorization: "Bearer {{ portainer_sso_auth.json.jwt }}"
    return_content: true
    status_code: [200]
  register: portainer_settings
  no_log: true
  changed_when: false
  check_mode: false

- name: "Portainer | Desired OAuth settings (Authentik)"
  ansible.builtin.set_fact:
    portainer_oauth_desired:
      ClientID: "{{ portainer_oidc.client_id }}"
      ClientSecret: "{{ portainer_oidc.client_secret }}"
      AuthorizationURI: "{{ portainer_authentik_base }}/application/o/authorize/"
      AccessTokenURI: "{{ portainer_authentik_base }}/application/o/token/"
      ResourceURI: "{{ portainer_authentik_base }}/application/o/userinfo/"
      LogoutURI: "{{ portainer_authentik_base }}/application/o/{{ portainer_oidc_slug }}/end-session/"
      RedirectURI: "https://{{ portainer_fqdn }}/"
      UserIdentifier: "preferred_username"
      Scopes: "openid profile email"
      OAuthAutoCreateUsers: true
      SSO: true
      HideInternalAuth: false      # the local admin stays reachable as break-glass
  no_log: true

- name: "Portainer | Point the console at Authentik (only on drift)"
  ansible.builtin.uri:
    url: "{{ portainer_api_base }}/api/settings"
    method: PUT
    body_format: json
    body:
      AuthenticationMethod: 3       # 1=internal, 2=LDAP, 3=OAuth
      OAuthSettings: "{{ portainer_oauth_desired }}"
    headers:
      Host: "{{ portainer_fqdn }}"
      Authorization: "Bearer {{ portainer_sso_auth.json.jwt }}"
    status_code: [200]
  when: >-
    (portainer_settings.json.AuthenticationMethod | default(1)) != 3
    or (portainer_settings.json.OAuthSettings.ClientID | default('')) != portainer_oidc.client_id
    or (portainer_settings.json.OAuthSettings.AuthorizationURI | default('')) != portainer_oauth_desired.AuthorizationURI
  changed_when: true
  no_log: true
