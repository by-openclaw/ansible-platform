---
# Docker agent on every docker_hosts member.
- name: "Portainer agent | This host must run Docker (docker_hosts is asserted, not assumed)"
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: portainer_docker_sock

- name: "Portainer agent | Fail loudly on inventory drift"
  ansible.builtin.assert:
    that: portainer_docker_sock.stat.exists
    fail_msg: "{{ inventory_hostname }} is in docker_hosts but has no Docker socket"
    quiet: true

- name: "Portainer agent | Opted out on this host: no agent, and any earlier agent is removed"
  when: not (portainer_agent | bool)
  block:
    - name: "Portainer agent | Remove the agent container (opt-out)"
      community.docker.docker_container:
        name: "{{ item }}"
        state: absent
      loop: [portainer-agent, portainer-agent_agent_1]

    - name: "Portainer agent | Remove the first version's compose layout (opt-out)"
      ansible.builtin.file:
        path: /opt/portainer-agent
        state: absent

- name: "Portainer agent | Install"
  when: portainer_agent | bool
  block:
    # The key is the same everywhere: read it ONCE (a read per host opened twenty SSH
    # sessions to the Vault host at once and some were refused, 2026-09-19).
    - name: "Portainer agent | Shared key (read once for the whole fleet)"
      ansible.builtin.include_role:
        name: vault_secret
      vars:
        vault_secret_path: "{{ portainer_agent_vault_path }}"
        vault_secret_init: {}
      run_once: true

    - name: "Portainer agent | Bind the key on every host"
      ansible.builtin.set_fact:
        portainer_agent_secret: "{{ hostvars[ansible_play_hosts_all[0]].vault_secret_result.secret }}"
      no_log: true

    # One container, managed directly (community.docker): no compose file, no extra
    # package. The first version installed Debian's docker-compose, which pulled Debian's
    # docker.io engine onto the two docker-ce VMs and killed their stacks (2026-09-19).
    - name: "Portainer agent | Retire the compose-managed container of the first version"
      community.docker.docker_container:
        name: portainer-agent_agent_1
        state: absent

    - name: "Portainer agent | Retire the compose layout of the first version"
      ansible.builtin.file:
        path: /opt/portainer-agent
        state: absent

    - name: "Portainer agent | Pull the pinned image"
      community.docker.docker_image:
        name: "{{ portainer_agent_image }}"
        source: pull

    - name: "Portainer agent | Run the agent (this host's daemon, SVC address only)"
      community.docker.docker_container:
        name: portainer-agent
        image: "{{ portainer_agent_image }}"
        state: started
        restart_policy: unless-stopped
        pull: false
        published_ports:
          - "{{ hostvars[inventory_hostname].ansible_host }}:{{ portainer_agent_port }}:9001"
        env:
          AGENT_SECRET: "{{ portainer_agent_secret }}"
          LOG_LEVEL: "INFO"
        volumes:
          - /var/run/docker.sock:/var/run/docker.sock
          - /var/lib/docker/volumes:/var/lib/docker/volumes
        log_driver: journald
      no_log: true

    - name: "Portainer agent | Reachable from the console host only (ufw)"
      community.general.ufw:
        rule: allow
        port: "{{ portainer_agent_port | string }}"
        proto: tcp
        from_ip: "{{ item }}"
        comment: "Portainer agent (console on lxc-portainer-01)"
      loop: "{{ groups['portainer'] | map('extract', hostvars, 'ansible_host') | list }}"
      failed_when: false
