---
# Docker agent on every docker_hosts member (portainer_agent: false on a host removes it).
- name: "Portainer agent | This host must run Docker (docker_hosts is asserted, not assumed)"
  ansible.builtin.stat:
    path: /var/run/docker.sock
  register: portainer_docker_sock

- name: "Portainer agent | Fail loudly on inventory drift"
  ansible.builtin.assert:
    that: portainer_docker_sock.stat.exists
    fail_msg: "{{ inventory_hostname }} is in docker_hosts but has no Docker socket"
    quiet: true

# The key is the same everywhere: read it ONCE (a read per host opened twenty SSH
# sessions to the Vault host at once and some were refused, 2026-09-19).
- name: "Portainer agent | Shared key (read once for the whole fleet)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ portainer_agent_vault_path }}"
    vault_secret_init: {}
  run_once: true
  when: portainer_agent | bool

- name: "Portainer agent | Bind the key on every host"
  ansible.builtin.set_fact:
    portainer_agent_secret: "{{ hostvars[ansible_play_hosts_all[0]].vault_secret_result.secret }}"
  no_log: true
  when: portainer_agent | bool

# One container, through the scaffold's containers step (the one owner of "run a pinned
# container"): this host's daemon, published on its SVC address only.
- name: "Portainer agent | The agent container (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: portainer-agent
      containers:
        - name: portainer-agent
          image: "{{ portainer_agent_image }}"
          state: "{{ 'started' if portainer_agent | bool else 'absent' }}"
          recreate: "{{ portainer_agent_reset | bool }}"
          published:
            - "{{ hostvars[inventory_hostname].ansible_host }}:{{ portainer_agent_port }}:9001"
          env:
            AGENT_SECRET: "{{ portainer_agent_secret if portainer_agent | bool else '' }}"
            LOG_LEVEL: "{{ portainer_agent_log_level }}"
          volumes:
            - /var/run/docker.sock:/var/run/docker.sock
            - /var/lib/docker/volumes:/var/lib/docker/volumes
          log_driver: journald

- name: "Portainer agent | Admit the console host only (roles/host_firewall owns every ufw rule)"
  ansible.builtin.include_role:
    name: host_firewall
  vars:
    host_firewall_rules:
      - port: "{{ portainer_agent_port | string }}"
        proto: tcp
        from: "{{ groups['portainer'] | map('extract', hostvars, 'ansible_host') | list }}"
        comment: "Portainer agent (console only)"
  when: portainer_agent | bool
