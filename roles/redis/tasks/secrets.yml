---
# The Redis requirepass, from Vault (get-or-create). The path exists, so the live
# password is READ — re-minting it would lock out every service that uses Redis.
# The old persist task also wrote `'host': '{{ hostvars[...] }}'` — a template
# nested inside a template string, so the file got the literal braces, not the host.
- name: "secrets | Redis requirepass (get-or-create in Vault)"
  ansible.builtin.include_role:
    name: vault_secret
  vars:
    vault_secret_path: "{{ redis_vault_path }}"
    vault_secret_init:
      host: "{{ hostvars[groups['redis'] | first].ansible_host }}"
      port: "{{ redis_tls_port }}"
      tls: "{{ redis_tls }}"
      password: "{{ lookup('community.general.random_string', length=32, special=false) }}"

- name: "secrets | Bind it"
  ansible.builtin.set_fact:
    redis_requirepass: "{{ vault_secret_result.password }}"
  no_log: true
