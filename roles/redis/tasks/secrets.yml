---
# Resolve the Redis requirepass: reuse the controller secret file if present,
# else generate a strong password and persist it (0600). no_log throughout.
- name: "secrets | Stat redis secret on controller"
  ansible.builtin.stat:
    path: "{{ redis_secret_dir }}/{{ redis_secret_file }}"
  delegate_to: localhost
  become: false
  register: redis_secret_stat

- name: "secrets | Load existing requirepass"
  ansible.builtin.set_fact:
    redis_requirepass: "{{ (lookup('file', redis_secret_dir + '/' + redis_secret_file) | from_json).fields.password }}"
  no_log: true
  when: redis_secret_stat.stat.exists

- name: "secrets | Generate requirepass"
  ansible.builtin.set_fact:
    redis_requirepass: "{{ lookup('community.general.random_string', length=32, special=false) }}"
  no_log: true
  when: not redis_secret_stat.stat.exists

- name: "secrets | Persist redis secret (0600)"
  ansible.builtin.copy:
    dest: "{{ redis_secret_dir }}/{{ redis_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': {'host': '{{ hostvars[groups['redis'] | first].ansible_host }}', 'port': redis_tls_port, 'tls': redis_tls, 'password': redis_requirepass}} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not redis_secret_stat.stat.exists
