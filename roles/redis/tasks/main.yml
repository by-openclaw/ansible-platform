---
# ==============================================================================
# Role: redis (Docker) — dispatcher
# ==============================================================================
- name: Retire any native Redis install
  ansible.builtin.import_tasks: migrate.yml
  tags: [redis, migrate]

- name: Distribute the shared wildcard cert (TLS)
  ansible.builtin.import_tasks: tls.yml
  tags: [redis, tls]

- name: Resolve / generate the requirepass secret
  ansible.builtin.import_tasks: secrets.yml
  tags: [redis, secrets]

- name: Render config (TLS, auth, persistence)
  ansible.builtin.import_tasks: config.yml
  tags: [redis, config]

- name: Run the Redis container
  ansible.builtin.import_tasks: container.yml
  tags: [redis, container]
