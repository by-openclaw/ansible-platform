---
# The container through the scaffold's containers step (the one owner of "run a pinned
# container"); Redis has no HTTP route, so only that step of the contract applies.
# Runs as the redis uid from the start (the data volume and the certificate are already owned
# by it): read-only root filesystem, no capability.
- name: "container | Redis member (roles/service_scaffold containers)"
  ansible.builtin.include_role:
    name: service_scaffold
    tasks_from: containers
  vars:
    service_scaffold_def:
      name: redis
      containers:
        - name: "{{ redis_container_name }}"
          image: "{{ redis_image }}"
          user: "{{ redis_uid }}:{{ redis_uid }}"
          command: ["redis-server", "{{ redis_runtime_file }}"]
          restart: "{{ 'newer' in (redis_conf_age.stdout | default('')) }}"   # config.yml: the file is newer than the process
          read_only: true
          tmpfs: ["/tmp:rw,size=16m"]
          cap_drop: [ALL]
          security_opts: ["no-new-privileges:true"]
          published:
            - "{{ redis_listen_ip }}:{{ redis_port }}:6379"
            - "[{{ redis_listen_ip6 }}]:{{ redis_port }}:6379"
            - "127.0.0.1:{{ redis_port }}:6379"
            - "[::1]:{{ redis_port }}:6379"
          volumes:
            - "{{ redis_data_volume }}:/data"
            - "{{ redis_conf_host_dir }}:{{ redis_conf_host_dir }}:ro"
            - "{{ redis_runtime_host_dir }}:{{ redis_runtime_host_dir }}"
            - "{{ redis_cert_host_dir }}:{{ redis_cert_host_dir }}:ro"
            # Host CA store (base installs ca-certificates) — the stock redis image
            # ships none, so this lets the in-container redis-cli verify with --cacert
            # (not just --insecure) and backs tls-ca-cert-dir.
            - "/etc/ssl/certs:/etc/ssl/certs:ro"

- name: "container | Wait for Redis to accept verified TLS connections"
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - -e
      - REDISCLI_AUTH
      - "{{ redis_container_name }}"
      - redis-cli
      - --tls
      - --cacert
      - "{{ redis_ca_bundle }}"
      - -h
      - "{{ redis_fqdn }}"
      - -p
      - "{{ redis_tls_port | string }}"
      - ping
  environment:
    REDISCLI_AUTH: "{{ redis_requirepass }}"
  register: redis_ping
  check_mode: false  # read-only probe: must run under --check too (a later task reads its result)
  retries: 15
  delay: 2
  until: redis_ping.rc == 0 and 'PONG' in redis_ping.stdout
  changed_when: false
  no_log: true

# A member that starts for the first time and is not the initial primary follows it: the
# Sentinels only manage the replicas they have seen attached to the primary. Afterwards the
# role never sets who replicates from whom.
- name: "container | A new member follows the initial primary (first start only)"
  ansible.builtin.command:
    argv: "{{ redis_cli + ['REPLICAOF', redis_initial_primary ~ '.' ~ platform_domain, redis_tls_port | string] }}"
  environment:
    REDISCLI_AUTH: "{{ redis_requirepass }}"
  register: redis_first_follow
  changed_when: true
  failed_when: "'OK' not in redis_first_follow.stdout"
  no_log: true
  when:
    - redis_first_start | bool
    - inventory_hostname != redis_initial_primary
    - not ansible_check_mode

# A changed ACL file is loaded without a restart (all or nothing: a file Redis cannot read
# leaves the logins as they are and fails here).
- name: "container | Load the changed ACL file"
  ansible.builtin.command:
    argv: "{{ redis_cli + ['ACL', 'LOAD'] }}"
  environment:
    REDISCLI_AUTH: "{{ redis_requirepass }}"
  register: redis_acl_load
  changed_when: true
  failed_when: "'OK' not in redis_acl_load.stdout"
  no_log: true
  when:
    - redis_acl_rendered is changed
    - not ansible_check_mode

# What the member really holds: every declared login, and the default user.
- name: "container | Logins the member holds"
  ansible.builtin.command:
    argv: "{{ redis_cli + ['ACL', 'USERS'] }}"
  environment:
    REDISCLI_AUTH: "{{ redis_requirepass }}"
  register: redis_acl_users
  changed_when: false
  check_mode: false   # read-only probe
  failed_when: >-
    redis_acl_users.rc != 0 or
    ((redis_users | map(attribute='name') | list + ['default']) | difference(redis_acl_users.stdout_lines) | length > 0)
  when: not ansible_check_mode

# A replica is only useful when its link to the primary is up. A member that has just started
# claims to be a master until the Sentinels make it a replica again: it is given time for
# that. The task reports what it finds and does not fail on it — a primary whose replica is
# down must not stop the run that repairs the replica.
- name: "container | Role and replication link"
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -uo pipefail
      info=""
      for attempt in $(seq 1 {{ redis_settle_retries }}); do
        info=$({{ redis_cli | map('quote') | join(' ') }} info replication 2>/dev/null || true)
        if grep -q 'master_link_status:up' <<<"$info"; then break; fi
        if grep -q 'role:master' <<<"$info" && ! grep -q 'connected_slaves:0' <<<"$info"; then break; fi
      {% if redis_members | length == 1 or (redis_first_start | default(false) | bool) %}
        if grep -q 'role:master' <<<"$info"; then break; fi
      {% endif %}
        sleep {{ redis_settle_delay }}
      done
      echo "$info"
  environment:
    REDISCLI_AUTH: "{{ redis_requirepass }}"
  register: redis_role_after
  check_mode: false   # read-only probe
  changed_when: false
  failed_when: "'role:' not in redis_role_after.stdout"
  no_log: true

- name: "container | Report"
  ansible.builtin.debug:
    msg: >-
      {{ inventory_hostname }}: {{ 'primary, ' ~ (redis_role_after.stdout | regex_search('connected_slaves:(\d+)', '\1') | first) ~ ' replica(s) attached'
         if 'role:master' in redis_role_after.stdout
         else 'replica of ' ~ (redis_role_after.stdout | regex_search('master_host:(\S+)', '\1') | first | regex_replace('\.' ~ (platform_domain | regex_escape) ~ '$', '')) ~ ', link ' ~ (redis_role_after.stdout | regex_search('master_link_status:(\w+)', '\1') | default(['unknown'], true) | first) }}
