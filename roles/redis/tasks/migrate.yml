---
# The container is the Redis. The native package of the first install was stopped and
# masked long ago (the cache/broker held no data); it goes now, so there is one Redis
# on the host. Remove, not purge: its config and data directories stay on disk.
- name: "migrate | The native redis-server package (retired)"
  ansible.builtin.apt:
    name: redis-server
    state: absent
