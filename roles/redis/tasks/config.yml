---
- name: "config | Ensure the config dir exists (mounted into the container)"
  ansible.builtin.file:
    path: "{{ redis_conf_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "config | Render redis.conf (TLS, auth, persistence, replication, consumer logins)"
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_file }}"
    owner: "{{ redis_uid }}"
    group: "{{ redis_uid }}"
    mode: "0640"
  no_log: true

# ACLs do not replicate: every member renders the same file. A change is loaded live (ACL LOAD,
# tasks/container.yml) — no restart for a login.
- name: "config | Render the ACL file (the default user and one login per consumer, passwords hashed)"
  ansible.builtin.template:
    src: users.acl.j2
    dest: "{{ redis_acl_file }}"
    owner: "{{ redis_uid }}"
    group: "{{ redis_uid }}"
    mode: "0640"
    # Loaded by a throwaway Redis of the same image BEFORE it replaces the file: Redis exits at
    # once on a file it cannot read, and still runs after {{ redis_acl_validate_seconds }} s on one it accepts.
    validate: >-
      docker run --rm --user 0:0 --network none --volume %s:/tmp/users.acl:ro {{ redis_image }}
      sh -c "timeout {{ redis_acl_validate_seconds }} redis-server --port 6399 --save '' --appendonly no --aclfile /tmp/users.acl >/dev/null; test $? -eq 124"
  register: redis_acl_rendered
  no_log: true

# Redis reads redis.conf only when it starts. The member is restarted (container step) when the
# file is NEWER than the running process — not "when this run changed it": a run interrupted
# after the render would otherwise leave a process on the old settings for good, and a
# readiness check that needs the new settings could never pass (rehearsal 2026-10-04).
- name: "config | Is redis.conf newer than the running member?"
  ansible.builtin.shell: |
    started=$(docker inspect --format '{{ '{{' }}.State.StartedAt{{ '}}' }}' {{ redis_container_name }} 2>/dev/null) || exit 0
    [ "$(stat -c %Y {{ redis_conf_file }})" -gt "$(date -d "$started" +%s)" ] && echo newer || echo current
  register: redis_conf_age
  changed_when: false
  check_mode: false   # read-only probe

# --- The start file: static, and not writable by Redis ------------------------------------------
# When the Sentinels change a member's role they also ask it to rewrite the file it started
# with. Redis then copies what it runs with into that file — and the image's start script
# loads its bundled modules itself on every start, so the rewritten file loaded each of them a
# second time and the member aborted ("Can't load module … server aborting"): a member that
# had been through a failover could not restart (kill drill of 2026-10-04; the logins were a
# second copy of the same kind, see the ACL file above). So Redis gets a file it cannot
# rewrite: the directory and the file are root's. The rewrite fails, the role change itself is
# applied, and WHO IS PRIMARY is the Sentinels' word alone: a member that restarts comes up
# claiming to be a master and the Sentinels make it a replica again within seconds — the
# endpoint sends nothing to a member the Sentinels do not name.
- name: "config | First start of this member? (it has no container yet)"
  ansible.builtin.set_fact:
    redis_first_start: "{{ (redis_conf_age.stdout | default('') | trim) | length == 0 }}"

- name: "config | Start-file directory (root's: Redis cannot rewrite the file in it)"
  ansible.builtin.file:
    path: "{{ redis_runtime_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "config | Start file = one include of redis.conf (static, read-only)"
  ansible.builtin.copy:
    dest: "{{ redis_runtime_file }}"
    owner: root
    group: root
    mode: "0444"
    content: |
      # Managed by Ansible (roles/redis). Static: Redis cannot rewrite this file (it is root's).
      # Settings live in {{ redis_conf_file }}; the member's role is the Sentinels' decision.
      include {{ redis_conf_file }}
