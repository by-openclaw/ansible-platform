---
- name: "config | Ensure the config dir exists (mounted into the container)"
  ansible.builtin.file:
    path: "{{ redis_conf_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: "config | Render redis.conf (TLS, auth, persistence)"
  ansible.builtin.template:
    src: redis.conf.j2
    dest: "{{ redis_conf_file }}"
    owner: "{{ redis_uid }}"
    group: "{{ redis_uid }}"
    mode: "0640"
  no_log: true
  notify: Restart redis
