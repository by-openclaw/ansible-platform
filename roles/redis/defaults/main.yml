---
# ==============================================================================
# Role: redis — one member of the Redis pair, as a Docker container (SVC).
# All-Docker pivot (upgrade-by-tag, k8s-future). Internal-only cache/broker.
# A primary and a replica (services/0004); roles/redis_sentinel decides which member is the
# primary. Data persists in a named volume across container re-creation.
# ==============================================================================
# Exact pin, never a stream tag: ":8.6" would silently drift within 8.6.x on any
# re-pull, and was also why this host could never reach 8.10 at all.
redis_image: "redis:8.10.2"       # upgrade = bump this tag deliberately (2026-09: 8.10 patch line)
redis_container_name: "redis"

# Publish on loopback + the SVC IP (v4 and v6 — dual-stack data svc, reached
# directly over TCP/TLS, not via Traefik). The v6 publish needs docker_ipv6
# (ip6tables) on this host; pg_hba/clients already permit fd01:3::/64.
redis_listen_ip: "{{ hostvars[inventory_hostname].ansible_host }}"   # each member publishes on its OWN address
redis_listen_ip6: "{{ hostvars[inventory_hostname].platform_host_v6 }}"
redis_port: 6379
redis_data_volume: "redis-data"
redis_uid: 999                    # redis uid inside the official image

# Host dirs bind-mounted into the container (same path inside).
redis_conf_host_dir: "/etc/redis/conf"
redis_conf_file: "{{ redis_conf_host_dir }}/redis.conf"     # the settings: Ansible's file, read-only in the container

# --- Cluster ---------------------------------------------------------------------------------
redis_members: "{{ platform_redis_members }}"
redis_fqdn: "{{ inventory_hostname }}.{{ platform_domain }}"
# Who the others replicate from when a member starts for the FIRST time. Afterwards Sentinel
# decides; the member's current role is read live on every run and written to the start file.
redis_initial_primary: "{{ redis_members | first }}"
# The file Redis starts with: one include of redis.conf plus, on a replica, its `replicaof` line.
# Redis rewrites this file itself when Sentinel changes its role (so a restart keeps the role);
# the role normalises it back to those two lines on every run — a rewrite copies every setting
# into it, and a copy left there would silently override a later change of redis.conf.
redis_runtime_host_dir: "/var/lib/redis-runtime"
redis_runtime_file: "{{ redis_runtime_host_dir }}/runtime.conf"

# Per-consumer logins (ACL users), the same on every member.
redis_users: "{{ platform_redis_users }}"
redis_user_default_rules: "{{ platform_redis_user_default_rules }}"
redis_users_vault_prefix: "{{ platform_redis_users_vault_prefix }}"
redis_cert_host_dir: "/etc/redis/certs"

# TLS — shared wildcard cert (tls_cert), mounted into the container. Plaintext
# disabled (port 0); clients connect rediss://.
redis_tls: true
redis_tls_port: 6379
redis_tls_cert: "{{ redis_cert_host_dir }}/wildcard.crt"
redis_tls_key: "{{ redis_cert_host_dir }}/wildcard.key"

# Auth: requirepass generated once + stored in the controller secret store.
redis_vault_path: "{{ platform_env }}/redis/admin"   # Vault KV (security/0001) — no controller file

# Durability — AOF so a future replica/Sentinel can attach (HA-adoptable).
redis_appendonly: "yes"
redis_maxmemory: "0"
redis_maxmemory_policy: "noeviction"
