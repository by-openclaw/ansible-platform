---
# ==============================================================================
# Role: vaultwarden — dispatcher
# ==============================================================================
- name: Provision the Vaultwarden database
  ansible.builtin.include_role:
    name: postgres_db
  vars:
    postgres_db_name: "{{ vaultwarden_pg_name }}"
    postgres_db_user: "{{ vaultwarden_pg_user }}"
  tags: [vaultwarden, database]

- name: Resolve / generate Vaultwarden secrets
  ansible.builtin.import_tasks: secrets.yml
  tags: [vaultwarden, secrets]

- name: Run the Vaultwarden container
  ansible.builtin.import_tasks: containers.yml
  tags: [vaultwarden, container]

- name: Publish Vaultwarden via Traefik (internal-only)
  ansible.builtin.include_role:
    name: traefik_route
  vars:
    traefik_route_name: vaultwarden
    traefik_route_fqdn: "{{ vaultwarden_fqdn }}"
    traefik_route_backend_url: "http://{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}"
    traefik_route_internal_only: true
  tags: [vaultwarden, route]
