---
# ==============================================================================
# Role: vaultwarden — what is specific to Vaultwarden. The platform concerns are
# declared to roles/service_scaffold: database (postgres_db), mailbox, the
# container, the public Traefik route, and the SSO registration it asserts.
# ==============================================================================
- name: "Secrets for Vaultwarden (admin token, OIDC client)"
  ansible.builtin.import_tasks: secrets.yml
  tags: [vaultwarden, secrets]

- name: "Platform concerns of Vaultwarden (roles/service_scaffold)"
  ansible.builtin.include_role:
    name: service_scaffold
    apply:
      tags: [vaultwarden, database, container, route]
  vars:
    service_scaffold_def:
      name: vaultwarden
      fqdn: "{{ vaultwarden_fqdn }}"
      backend_url: "http://{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}"
      exposure: public
      db: postgres               # vaultwarden / vaultwarden / {env}/vaultwarden/db-pgsql — the live DB
      mailbox: true
      sso_slug: "{{ vaultwarden_oidc_app_slug }}"
      # /admin is the break-glass panel (ADMIN_TOKEN): internal + admin sources only, the app stays public
      endpoints:
        - {name: admin, path_prefixes: ["/admin"], backend_url: "http://{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}", priority: 90, admin_only: true}
        - {name: app, backend_url: "http://{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}", priority: 1}
      containers:
        - name: "{{ vaultwarden_container_name }}"
          image: "{{ vaultwarden_image }}"
          # Read-only root filesystem: everything it writes is on the data volume.
          read_only: true
          tmpfs: ["/tmp:rw,size=64m"]
          security_opts: ["no-new-privileges:true"]
          published: ["{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}:80"]
          volumes:
            - "{{ vaultwarden_data_volume }}:/data"
            - "/etc/ssl/certs:/etc/ssl/certs:ro"
          env: "{{ vaultwarden_env }}"   # vars/main.yml; reads postgres_db_password set by the db step
          # First start runs the DB migrations before /alive answers: retry generously.
          health: "http://{{ vaultwarden_listen_ip }}:{{ vaultwarden_host_port }}/alive"
          health_retries: 30
          health_delay: 5
  tags: [vaultwarden, database, container, route]
