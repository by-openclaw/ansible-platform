---
# Vaultwarden admin token: reuse the controller secret if present, else generate
# + persist. The DB password is loaded from its own secret file (written by
# postgres_db). All facts no_log.
#
# Vaultwarden ADMIN_TOKEN accepts a plain token (with a startup warning) or an
# Argon2 PHC hash. We store + use a strong 48-char random token (the Argon2
# `/vaultwarden hash` preset is interactive — keep it simple). The token gates
# the /admin break-glass panel; SSO is a later phase.
- name: "secrets | Stat vaultwarden secret on controller"
  ansible.builtin.stat:
    path: "{{ vaultwarden_secret_dir }}/{{ vaultwarden_secret_file }}"
  delegate_to: localhost
  become: false
  register: vaultwarden_secret_stat

- name: "secrets | Load existing vaultwarden secrets"
  ansible.builtin.set_fact:
    vaultwarden_secrets: "{{ (lookup('file', vaultwarden_secret_dir + '/' + vaultwarden_secret_file) | from_json).fields }}"
  no_log: true
  when: vaultwarden_secret_stat.stat.exists

- name: "secrets | Generate vaultwarden secrets"
  ansible.builtin.set_fact:
    vaultwarden_secrets:
      admin_token: "{{ lookup('community.general.random_string', length=48, special=false) }}"
  no_log: true
  when: not vaultwarden_secret_stat.stat.exists

- name: "secrets | Persist vaultwarden secret (0600)"
  ansible.builtin.copy:
    dest: "{{ vaultwarden_secret_dir }}/{{ vaultwarden_secret_file }}"
    mode: "0600"
    content: "{{ {'fields': (vaultwarden_secrets | combine({'url': 'https://' + vaultwarden_fqdn}))} | to_nice_json }}"
  delegate_to: localhost
  become: false
  no_log: true
  when: not vaultwarden_secret_stat.stat.exists

- name: "secrets | Load the PostgreSQL password"
  ansible.builtin.set_fact:
    vaultwarden_pg_password: "{{ (lookup('file', vaultwarden_secret_dir + '/' + vaultwarden_pg_secret_file) | from_json).fields.password }}"
  no_log: true

# verify-full forces the client to validate the server cert chain (LE wildcard)
# AND that the hostname matches lxc-pgsql-01.by-research.be (covered by the
# wildcard). The CA bundle is mounted into the container at /etc/ssl/certs.
- name: "secrets | Build the Vaultwarden environment"
  ansible.builtin.set_fact:
    vaultwarden_env:
      DOMAIN: "https://{{ vaultwarden_fqdn }}"
      DATABASE_URL: >-
        postgresql://{{ vaultwarden_pg_user }}:{{ vaultwarden_pg_password }}@{{ vaultwarden_pg_host }}:{{ vaultwarden_pg_port }}/{{
        vaultwarden_pg_name }}?sslmode=verify-full&sslrootcert=/etc/ssl/certs/ca-certificates.crt
      SIGNUPS_ALLOWED: "false"
      ADMIN_TOKEN: "{{ vaultwarden_secrets.admin_token }}"
      ROCKET_PORT: "80"
  no_log: true

# --- Authentik OIDC SSO env (only when the client secret file exists) -----------
- name: "secrets | Stat the vaultwarden OIDC secret on controller"
  ansible.builtin.stat:
    path: "{{ vaultwarden_secret_dir }}/{{ vaultwarden_oidc_secret_file }}"
  delegate_to: localhost
  become: false
  register: vaultwarden_oidc_stat

- name: "secrets | Load the vaultwarden OIDC client id and secret"
  ansible.builtin.set_fact:
    vaultwarden_oidc: "{{ (lookup('file', vaultwarden_secret_dir + '/' + vaultwarden_oidc_secret_file) | from_json).fields }}"
  no_log: true
  when: vaultwarden_oidc_stat.stat.exists

- name: "secrets | Merge the Authentik SSO env into the Vaultwarden environment"
  ansible.builtin.set_fact:
    vaultwarden_env: "{{ vaultwarden_env | combine(vaultwarden_sso_env) }}"
  vars:
    vaultwarden_sso_env:
      # Built-in OIDC SSO — values per the official Authentik integration guide.
      # SSO_AUTHORITY is the Authentik per-app issuer WITH a trailing slash
      # (authentik's issuer has one; discovery = SSO_AUTHORITY/.well-known/...).
      # Access is gated IdP-side by the vaultwarden-admins group (restrict_to_group).
      SSO_ENABLED: "true"
      SSO_AUTHORITY: "{{ vaultwarden_authentik_base }}/application/o/{{ vaultwarden_oidc_app_slug }}/"
      SSO_CLIENT_ID: "{{ vaultwarden_oidc.client_id }}"
      SSO_CLIENT_SECRET: "{{ vaultwarden_oidc.client_secret }}"
      SSO_SCOPES: "email profile offline_access"
      # The FW blocks outbound SMTP from SVC, so vaultwarden cannot send its own
      # email verification. Authentik is the trusted verifier and already gates
      # access via the vaultwarden-admins group, so accept its verified email
      # instead of requiring a (never-delivered) confirmation mail.
      SSO_ALLOW_UNKNOWN_EMAIL_VERIFICATION: "true"
      SSO_CLIENT_CACHE_EXPIRATION: "0"
      SSO_ONLY: "false"
      SSO_SIGNUPS_MATCH_EMAIL: "true"
  no_log: true
  when: vaultwarden_oidc_stat.stat.exists

# --- SMTP via Resend (so email verification / hints actually send) --------------
- name: "secrets | Stat the Resend SMTP secret on controller"
  ansible.builtin.stat:
    path: "{{ vaultwarden_secret_dir }}/{{ vaultwarden_resend_secret_file }}"
  delegate_to: localhost
  become: false
  register: vaultwarden_resend_stat

- name: "secrets | Load the Resend SMTP creds"
  ansible.builtin.set_fact:
    vaultwarden_resend: "{{ (lookup('file', vaultwarden_secret_dir + '/' + vaultwarden_resend_secret_file) | from_json).fields }}"
  no_log: true
  when: vaultwarden_resend_stat.stat.exists

- name: "secrets | Merge the SMTP env into the Vaultwarden environment"
  ansible.builtin.set_fact:
    vaultwarden_env: "{{ vaultwarden_env | combine(vaultwarden_smtp_env) }}"
  vars:
    vaultwarden_smtp_env:
      SMTP_HOST: "{{ vaultwarden_resend.smtp_host }}"
      SMTP_PORT: "{{ vaultwarden_resend.smtp_port | string }}"
      SMTP_SECURITY: "{{ 'force_tls' if (vaultwarden_resend.smtp_port | string) == '465' else 'starttls' }}"
      SMTP_FROM: "{{ vaultwarden_resend.from_address }}"
      SMTP_FROM_NAME: "{{ vaultwarden_resend.from_name | default('Vaultwarden') }}"
      SMTP_USERNAME: "{{ vaultwarden_resend.smtp_username }}"
      SMTP_PASSWORD: "{{ vaultwarden_resend.smtp_api_key }}"
  no_log: true
  when: vaultwarden_resend_stat.stat.exists
