---
# Global defaults — override per group or host as needed

# Environment tier (ADR-0012 — always explicit, always per-host)
# IMPORTANT: env is per-VM/LXC. inventories/poc/ = hosts on node srv-proxmox-poc-01 (node name — not env tier).
# All current hosts on this node = prod. Override in host_vars/{hostname}/vars.yml.
# Never set env based on inventory folder name or Proxmox node name.
env: prod

# SSH
hardening_ssh_port: 22222

# Email relay — disabled by default, enable per host/group
hardening_email_relay_enabled: false
