---
# ==============================================================================
# cerebrum_server — the Cerebrum server application (roles/cerebrum_server). Installers on the
# platform object store, pinned by sha256; empty values stop the role.
# ==============================================================================
cerebrum_server_version: "2.9.3"
cerebrum_server_installer_url: "https://s3.{{ platform_domain }}/installers/cerebrum/Cerebrum_2.9.3_Installer.exe"
cerebrum_server_installer_sha256: ""        # to fill when the file is on the store (the lab's C:\Cerebrum Packs holds it)
cerebrum_server_webview2_url: "https://s3.{{ platform_domain }}/installers/cerebrum/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
cerebrum_server_webview2_sha256: ""
cerebrum_server_components: [cerebrum, cerebrum_watchdog]
cerebrum_server_sentinel: skip              # demo key on the lab; `install` with a hardware key
cerebrum_server_device_cidrs: []            # the device ranges (ACP, traps) once the media zones are declared

# --- the ODBC driver Cerebrum's SQL tester looks for (roles/mssql_odbc), Microsoft's download centre ---
mssql_odbc_version: "17.11.1.1"
mssql_odbc_msi_url: "https://download.microsoft.com/download/d99fcd4f-548f-46e6-83d5-b9eb62b373d5/amd64/1033/msodbcsql.msi"
mssql_odbc_msi_sha256: "0f6428706ac1fa4863d10e515135b587de88011813131c0a43f70cd70dc0bd4e"   # pragma: allowlist secret (a checksum)
