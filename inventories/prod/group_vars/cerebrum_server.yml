---
# ==============================================================================
# cerebrum_server — the Cerebrum server application (roles/cerebrum_server). Installers on the
# platform object store, pinned by sha256; empty values stop the role.
# ==============================================================================
cerebrum_server_version: "2.9.5"              # 2.9.5 (2026-11-03): the web client fix of 2.9.4's CS142320
# The installer store (group_vars/all/windows.yml) until the object store admits the dev guests; the URL then.
cerebrum_server_installer_src: "{{ platform_installer_store }}/cerebrum/{{ cerebrum_server_version }}/Cerebrum_{{ cerebrum_server_version }}_Installer.exe"
cerebrum_server_installer_url: "https://s3.{{ platform_domain }}/installers/cerebrum/Cerebrum_{{ cerebrum_server_version }}_Installer.exe"
cerebrum_server_installer_sha256: "55848c31862691284c2e86338d8f883d44c060a7269809099e226cec55c0b209"   # pragma: allowlist secret (a checksum; EVS's 2.9.5 as delivered 2026-11-04)
cerebrum_server_webview2_url: "https://s3.{{ platform_domain }}/installers/cerebrum/MicrosoftEdgeWebView2RuntimeInstallerX64.exe"
cerebrum_server_webview2_sha256: ""
# The components installed with EVS (2026-11-03), as the installer records them ("Inno Setup: Selected
# Components", identical on both servers); gilze_clfs = "EVS Media Infrastructure Device UI's". Not installed:
# cerebrum_witness, cerebrum_database_mirror_creator, cerebrum_sdn.
cerebrum_server_components: ['cerebrum', 'cerebrum\cerebrum_watchdog', 'cerebrum_designer', 'cerebrum_client', 'cerebrum_service_manager', 'cerebrum_federation', 'gilze_clfs']
cerebrum_server_sentinel: install           # Sentinel driver 7.6.1 is installed (the owner: no demo licence without it)

# EVS manual §3.5 "UAC: Never Notify" (owner 2026-11-04: "follow EVS user manual"): roles/cerebrum_server
# (tasks/windows.yml) sets these two; roles/windows_hardening leaves them on this group. UAC itself stays on.
windows_hardening_registry_vendor_owned:
  - path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: ConsentPromptBehaviorAdmin
    why: "EVS §3.5 UAC Never Notify (0); CIS 2.3.17.2"
  - path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
    name: PromptOnSecureDesktop
    why: "EVS §3.5 UAC Never Notify (0); CIS 2.3.17.7"
cerebrum_server_device_cidrs: []            # the device ranges (ACP, traps) once the media zones are declared

# --- the ODBC driver Cerebrum's SQL tester looks for (roles/mssql_odbc), Microsoft's download centre ---
mssql_odbc_version: "17.11.1.1"
mssql_odbc_msi_url: "https://download.microsoft.com/download/d99fcd4f-548f-46e6-83d5-b9eb62b373d5/amd64/1033/msodbcsql.msi"
mssql_odbc_msi_sha256: "0f6428706ac1fa4863d10e515135b587de88011813131c0a43f70cd70dc0bd4e"   # pragma: allowlist secret (a checksum)

# --- Cerebrum's settings rows (roles/cerebrum_server tasks/config.yml), the owner's walk of the
#     Configuration dialog (2026-11-03). Kept for later, not declared yet: SNMP, Email/Base SMTP, Alarm
#     log, Audit, syslog (Logging), web client + RCP TLS (Hosting/Security), C-Link multicast. ---------
cerebrum_server_config_dirs: ['C:\Backup\Cerebrum']
cerebrum_server_config:
  # General
  "CORTEX/ALLOW_VIRTUALISE": 1                  # Allow virtualisation of devices
  "GUI/DEMO_MODE_LOGON": 1                      # Enable Trial License Mode (restart)
  # Tally & Router > View Settings and Behaviour (Default Mnemonic = 0, IO Mnemonic = 4294967295)
  "GUI/TALLYRTR_RM_MNE_MODE": 4294967295
  "GUI/TALLYRTR_CAT_MNE_MODE": 0
  "GUI/TALLYRTR_JOYSTICKS_MNE_MODE": 4294967295
  "GUI/TALLYRTR_CABLE_TALLY_MNE_MODE": 4294967295
  "GUI/TALLYRTR_UMDS_MNE_MODE": 4294967295
  "GUI/TALLYRTR_SALVO_MNE_MODE": 0
  "GUI/TALLYRTR_SALVO_ACTIONS": 0
  "TALLY_ROUTER/CLEAR_UMDS_ON_DEACT": 0
  "TALLY_ROUTER/SAVE_LOAD_UMD_STATE": 0
  "GUI/RECALL_RTR_GRID_ENABLE": 0
  "GUI/RECALL_TALLY_GRID_ENABLE": 0
  "GUI/PREVENT_RESERVED_CHARS": 1
  # Tally & Router > Backup and Import/Export: the .ccf backup, daily 02:30 (hours, minutes, seconds
  # packed: 0x021E0000), 30 files, outside Program Files next to the SQL backups
  "TALLY_ROUTER/AUTO_BACKUP": 2
  "TALLY_ROUTER/BACKUP_PERIOD": 24
  "TALLY_ROUTER/BACKUP_TIME": 35520512
  "TALLY_ROUTER/BACKUP_LIMIT": 1
  "TALLY_ROUTER/BACKUP_SIZE": 30
  "TALLY_ROUTER/BACKUP_DIRECTORY": 'C:\Backup\Cerebrum'
  "TALLY_ROUTER/ALLOW_ROUTE_IMPORTS": 0
  # Tally & Router > IPConfig
  "IP_RTR/INCLUDE_DEVICE_IN_LABEL": 1
  "IP_RTR/DEFAULT_BBM": 0
  "IP_RTR/DEFAULT_AUDIO_CHANNEL_COUNT": 16
  "IP_RTR/DYNAMIC_AUDIO_BW": 1
  "IP_RTR/DYNAMIC_VIDEO_BW": 1
  "IP_RTR/DEFAULT_VIDEO_BW": 3075
  "IP_RTR/DEFAULT_AUDIO_BW": 25
  "IP_RTR/DEFAULT_DATA_BW": 10
  "IP_RTR/DEFAULT_VIDEO_BW_OVERHEAD": 10
  "IP_RTR/DEFAULT_AUDIO_BW_OVERHEAD": 10
  "IP_RTR/IGNORE_DISCONNECT_INTERVAL": 30
  "IP_RTR/ROUTER_SELF_HEAL_SWITCH": 1
  "IP_RTR/FORWARD_SDP_CHANGE": 1
  "IP_RTR/ADD_SENDER_LABEL_TO_SDP": 1
  # Tally & Router > Routemaster
  "RC/ROUTEMASTER_REASSERT": 0
  "RC/ROUTEMASTER_UPDATE_INTERVAL": 500
  "RC/ROUTEMASTER_BLOCK_PART_ROUTE": 0
  "RC/ROUTEMASTER_USE_PENDING": 0
  "RC/ROUTEMASTER_DEVICE_LOCK_SYNCHRONISATION": 0
  "RC/ROUTEMASTER_REQUIRE_EXACT_TAG_MATCH": 0
  # Hosting: RCP on (plain for now; TLS with the instance certificate later)
  "RCP/ENABLE_RCP": 1
