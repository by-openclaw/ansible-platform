---
# ==============================================================================
# PostgreSQL cluster — platform-level facts the concern role (roles/postgres_db) and the
# services consume. The cluster itself is roles/postgresql; each service's database and owner
# role come from roles/postgres_db (one owner per concern).
# ==============================================================================
# Logins that may CONNECT to every service database: cluster tooling with the predefined
# read/monitor roles, never a superuser. The owning service creates the login (roles/postgres_db
# in role-only mode); every database roles/postgres_db creates grants them CONNECT, reconciled
# on every run. key = service, value = the login name.
platform_pg_dba_logins:
  pgadmin: pgadmin_dba
