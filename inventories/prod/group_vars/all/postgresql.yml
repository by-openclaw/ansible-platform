---
# ==============================================================================
# PostgreSQL cluster — platform-level facts the concern role (roles/postgres_db) and the
# services consume. The cluster itself is roles/postgresql; each service's database and owner
# role come from roles/postgres_db (one owner per concern).
# ==============================================================================
# Logins that may CONNECT to every service database: cluster tooling with the predefined
# read/monitor roles, never a superuser. The owning service creates the login (roles/postgres_db
# in role-only mode); every database roles/postgres_db creates grants them CONNECT, reconciled
# on every run. key = service, value = the login name.
platform_pg_dba_logins:
  pgadmin: pgadmin_dba

# --- The cluster (services/0004) -----------------------------------------------------------
# Three members (group `patroni`) elect a leader through etcd; ONE endpoint guest follows the
# leader (TCP routing, no pooling). A consumer connects to the endpoint name — the shared
# wildcard certificate is valid for it, so sslmode=verify-full is unchanged.
platform_pg_cluster_scope: "platform-pg"
platform_pg_members: "{{ groups['patroni'] }}"
platform_pg_endpoint_host: "{{ groups['pg_endpoint'] | first }}"
platform_pg_endpoint_fqdn: "{{ platform_pg_endpoint_host }}.{{ platform_domain }}"
# What every consumer's <service>_pg_host defaults to. One line to point the platform somewhere
# else (a member directly, while the endpoint guest is rebuilt).
platform_pg_host: "{{ platform_pg_endpoint_fqdn }}"
# The consensus store's client credential (etcd `root`), shared by roles/etcd and Patroni.
platform_etcd_vault_path: "{{ platform_env }}/etcd/root"
