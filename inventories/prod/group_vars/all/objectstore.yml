---
# External object storage the platform still depends on — ONE definition. Consumers:
# roles/nextcloud (its primary storage lives there until the move on-prem) and roles/seaweedfs
# (the on-prem mirror job that gives those files a second copy — audit nextcloud gap 1).
platform_external_s3:
  contabo:
    host: eu2.contabostorage.com
    endpoint: "https://eu2.contabostorage.com"
    region: eu2
    path_style: true                                     # Contabo requires path-style addressing
    vault_path: "{{ platform_env }}/backup/s3-contabo"   # access_key + secret_key
platform_nextcloud_bucket: nextcloud-data                 # Nextcloud's primary-storage bucket at contabo
