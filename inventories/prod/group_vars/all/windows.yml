---
# ==============================================================================
# Windows guests — the values both roles share (roles/windows_template bakes them
# into the image, roles/windows_guest reconciles them on running guests). One
# source, like deployment.yml for the Linux side.
# ==============================================================================
# Optional features removed from the image (footprint + CIS: no legacy engines).
# A name absent from a given edition is skipped, never an error.
platform_windows_removed_features:
  - MicrosoftWindowsPowerShellV2Root     # PowerShell 2.0 engine: no script logging, CIS removes it
  - MicrosoftWindowsPowerShellV2
  - Printing-XPSServices-Features
  - Printing-PrintToPDFServices-Features
  - WindowsMediaPlayer
  - SMB1Protocol
  - TelnetClient
  - TFTP

# Services an app/database host never needs — off in the image and kept off.
platform_windows_disabled_services: [Spooler, WSearch, DiagTrack, MapsBroker]

# The resolver the guests are provisioned with (Terraform environments/dev: the firewall's
# services-zone interface forwards to AdGuard). The firewall rule set allows DNS there only.
platform_windows_resolvers:
  - "10.1.3.1"

# The platform's egress proxy as every Windows component sees it: system (WinHTTP) and
# user sessions (WinINET: browsers, installers) alike — the guests' only way out.
platform_windows_proxy: "{{ hostvars[groups['pkgcache'] | first].ansible_host }}:{{ pkgcache_acng_port | default(3142) }}"
platform_windows_proxy_bypass: "<local>;10.*"

# --- egress posture of the Windows guests (owner 2026-10-15) ------------------------------
# The platform's hosts have had open internet since the beginning; the Windows guests were
# the first with a locked egress (default-deny outbound, the package cache as the only door)
# and that broke their work (no plain HTTP, CRL/OCSP checks failing, portals unreachable).
# Until the egress proxy + the "internet by request" portal exist (services/0012), the
# Windows guests get the SAME posture as every other host: outbound open, direct, logged,
# inbound still denied. One flag, one PR to flip back when the service lands.
platform_windows_egress_open: true

# --- administrators_authorized_keys of every Windows guest (declared, exclusive) ------------
# roles/windows_guest writes exactly: the automation's connection key, the org break-glass key,
# and what is listed here — the owner's workstation key, which Terraform's first-boot list
# seeded on the first guests and which a converged guest keeps. Nothing else stays in that file.
platform_windows_admin_keys_extra:
  - "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFJ8rXlV8+/e20imHW/hTry2DbqQ9bIpwslC4MIINlJW by-systems@ws-win11-ref"
