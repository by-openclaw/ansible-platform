---
# ==============================================================================
# The SSO registry — every application the IdP (Authentik) publishes, ONE list each:
#   authentik_oidc_apps          native OIDC clients (slug, launch_url, group, Vault path, redirects)
#   authentik_proxy_apps         forwardAuth-gated apps (no native OIDC): Traefik asks the outpost
#   authentik_proxy_apps_retired proxy apps that must go (blueprints only add)
# Inventory data, not role defaults: roles/authentik renders the blueprints from it, and
# roles/service_scaffold asserts a service's sso_slug is registered here — in the service's
# own play, which never loads the authentik role's defaults (the assertion never fired).
# A new service with a human UI = one entry here (docs/new-service.md §3).
# ==============================================================================
# Each entry → one OIDC app. client_id/client_secret live in Vault at vault_path
# (get-or-create in secrets.yml: a new app is minted, an existing one is read).
# Add a service here to wire its SSO — same pattern for every svc.
authentik_oidc_apps:
  - slug: vault
    launch_url: "https://{{ platform_service_fqdns.vault }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/hashicorp-vault.svg"
    name: "Vault"
    group: "{{ platform_service_groups.vault.admin }}"             # ACCESS group — only members may SSO into Vault
    vault_path: "{{ platform_env }}/vault/oidc"
    restrict_to_group: true         # IdP-enforced: only vault-admins can log in (Vault maps the same group to `admins`)
    redirect_uris:
      - "https://{{ platform_service_fqdns.vault }}/ui/vault/auth/oidc/oidc/callback"
      - "http://localhost:8250/oidc/callback"
  - slug: headlamp
    launch_url: "https://{{ platform_service_fqdns.headlamp }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/headlamp.svg"
    name: "Headlamp (k3s)"
    group: "{{ platform_admins_group }}"      # the Kubernetes API maps the same group to cluster-admin (roles/k3s)
    vault_path: "{{ platform_env }}/k3s/headlamp-oidc"
    restrict_to_group: true         # IdP-enforced: only platform admins get a token the cluster accepts
    redirect_uris:
      - "https://{{ platform_service_fqdns.headlamp }}/oidc-callback"
  - slug: pgadmin
    launch_url: "https://{{ platform_service_fqdns.pgadmin }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/pgadmin.svg"
    name: "pgAdmin"
    group: "{{ platform_service_groups.pgadmin.admin }}"
    vault_path: "{{ platform_env }}/pgadmin/oidc"
    redirect_uris:
      - "https://{{ platform_service_fqdns.pgadmin }}/oauth2/authorize"
  - slug: netbox
    launch_url: "https://{{ platform_service_fqdns.netbox }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/netbox.svg"
    name: "NetBox"
    group: "{{ platform_service_groups.netbox.admin }}"
    vault_path: "{{ platform_env }}/netbox/oidc"
    restrict_to_group: true     # IdP-enforced: only netbox-admins can log in
    redirect_uris:
      - "https://{{ platform_service_fqdns.netbox }}/oauth/complete/oidc/"
  - slug: vaultwarden
    launch_url: "https://{{ platform_service_fqdns.vaultwarden }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/vaultwarden.svg"
    name: "Vaultwarden"
    group: "{{ platform_service_groups.vaultwarden.admin }}"
    vault_path: "{{ platform_env }}/vaultwarden/oidc"
    restrict_to_group: true     # IdP-enforced: only vaultwarden-admins can log in
    force_email_verified: true  # vaultwarden rejects email_verified=False (authentik default)
    offline_access: true        # vaultwarden requests offline_access → needs refresh_token
    redirect_uris:
      - "https://{{ platform_service_fqdns.vaultwarden }}/identity/connect/oidc-signin"
  - slug: nextcloud
    launch_url: "https://{{ platform_service_fqdns.nextcloud }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/nextcloud.svg"
    name: "Nextcloud"
    group: "{{ platform_service_groups.nextcloud.access }}"    # ACCESS group — any member may log into Nextcloud
    admin_source_group: "{{ platform_service_groups.nextcloud.admin }}"  # members of THIS group also get NC admin
    vault_path: "{{ platform_env }}/nextcloud/oidc"   # Vault-native client creds (like GitLab); roles/nextcloud reads the same path
    restrict_to_group: true     # IdP-enforced: only nextcloud-users can log in
    admin_group_alias: "admin"  # admin_source_group members → NC "admin" group
    redirect_uris:
      - "https://{{ platform_service_fqdns.nextcloud }}/apps/user_oidc/code"
    logout_uris:                                # post_logout_redirect_uri (type=logout)
      - "https://{{ platform_service_fqdns.nextcloud }}/"
  - slug: netbird
    launch_url: "https://{{ platform_service_fqdns.netbird }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/netbird.svg"
    name: "NetBird"
    group: "{{ platform_service_groups.netbird.access }}"        # ACCESS group — only members may authenticate
    vault_path: "{{ platform_env }}/netbird/oidc"
    restrict_to_group: true       # IdP-enforced: only netbird-users can log in
    # Multi-container NetBird logs in against Authentik DIRECTLY (no Dex), per the
    # goauthentik.io NetBird guide. The dashboard is a PUBLIC SPA doing PKCE; the
    # CLI/mobile use the device-code grant; the IdP manager uses client_credentials.
    client_type: public
    extra_grant_types:
      - client_credentials
      - "urn:ietf:params:oauth:grant-type:device_code"
    offline_access: true          # refresh tokens (NetBird requests offline_access)
    entitlements: true            # per the guide's Selected Scopes
    api_access: true              # goauthentik.io/api — IdP-manager directory reads
    # PKCE loopback (CLI/mobile) + the dashboard's /auth and /silent-auth callbacks as STRICT
    # entries: authentik derives the CORS allow-origin for the OIDC endpoints from the strict
    # redirect URIs, and the dashboard fetches /.well-known/openid-configuration cross-origin.
    # With only the regex below, no Access-Control-Allow-Origin was sent and the SPA died with
    # "Error: Unauthenticated" before ever reaching the authorize endpoint (2026-09-16).
    redirect_uris:
      - "http://localhost:53000"
      - "https://{{ platform_service_fqdns.netbird }}/auth"
      - "https://{{ platform_service_fqdns.netbird }}/silent-auth"
    redirect_uris_regex:
      - "https://vpn\\.{{ platform_domain | replace('.', '\\.') }}/.*"
  - slug: mailcow
    launch_url: "https://{{ platform_service_fqdns.mailcow }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/mailcow.svg"
    name: "Mailcow"
    group: "{{ platform_service_groups.mailcow.access }}"          # ACCESS group — only members may log into mail
    vault_path: "{{ platform_env }}/mailcow/oidc"
    restrict_to_group: true         # IdP-enforced: only mailcow-users can log in
    # mailcow's native Generic-OIDC. On first login it reads the `mailcow_template`
    # claim and auto-provisions the mailbox from that template (the 5 GB "default").
    # The Authentik email IS already <user>@{{ platform_domain }} (matches the hosted
    # domain), so the mailbox address = the email claim — no domain rewrite needed.
    mailcow_template: true          # emit the static mailcow_template="default" scope
    redirect_uris:
      - "https://{{ platform_service_fqdns.mailcow }}/"
      - "https://{{ platform_service_fqdns.mailcow }}"
    redirect_uris_regex:
      - "https://mail\\.{{ platform_domain | replace('.', '\\.') }}/.*"
  - slug: pbs
    launch_url: "https://{{ platform_service_fqdns.pbs }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/proxmox.svg"
    name: "Proxmox Backup Server"
    group: "{{ platform_service_groups.pbs.admin }}"             # ACCESS group — only members may SSO into PBS
    vault_path: "{{ platform_env }}/pbs/oidc"
    restrict_to_group: true         # IdP-enforced: only pbs-admins can log in
    # PBS (proxmox-backup-manager openid) redirects to its own web root after auth.
    redirect_uris:
      - "https://{{ platform_service_fqdns.pbs }}"
    redirect_uris_regex:
      - "https://pbs\\.{{ platform_domain | replace('.', '\\.') }}/.*"
  - slug: portainer
    launch_url: "https://{{ platform_service_fqdns.portainer }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/portainer.svg"
    name: "Portainer (containers)"
    group: "{{ platform_admins_group }}"            # ACCESS group — the console can restart and exec into containers
    vault_path: "{{ platform_env }}/portainer/oidc"   # Vault-native client creds; roles/portainer configures Portainer with them
    restrict_to_group: true             # IdP-enforced: only platform-admins may sign in
    redirect_uris:
      - "https://{{ platform_service_fqdns.portainer }}/"
    logout_uris:
      - "https://{{ platform_service_fqdns.portainer }}/"
  - slug: wazuh
    launch_url: "https://{{ platform_service_fqdns.wazuh }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/wazuh.svg"
    name: "Wazuh (security monitoring)"
    group: "{{ platform_admins_group }}"            # ACCESS group — the dashboard shows every host's security state
    vault_path: "{{ platform_env }}/wazuh/oidc"       # Vault-native client creds; roles/wazuh renders the dashboard + indexer config
    restrict_to_group: true
    redirect_uris:
      - "https://{{ platform_service_fqdns.wazuh }}/auth/openid/login"
    logout_uris:
      - "https://{{ platform_service_fqdns.wazuh }}/"
  - slug: proxmox
    launch_url: "https://{{ platform_service_fqdns.proxmox }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/proxmox.svg"
    name: "Proxmox VE (hypervisor)"
    group: "{{ platform_service_groups.proxmox.admin }}"             # ACCESS group; PVE maps it to proxmox-admins-authentik → Administrator (roles/pve_host)
    vault_path: "{{ platform_env }}/pve/oidc"         # roles/pve_host reads it for the OIDC realm
    restrict_to_group: true
    redirect_uris:
      - "https://{{ platform_service_fqdns.proxmox }}"
    logout_uris:
      - "https://{{ platform_service_fqdns.proxmox }}/"
  - slug: grafana
    launch_url: "https://{{ platform_service_fqdns.monitoring }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/grafana.svg"
    name: "Grafana"
    group: "{{ platform_service_groups.monitoring.admin }}"         # ACCESS group — only members may SSO into Grafana
    vault_path: "{{ platform_env }}/grafana/oidc"
    restrict_to_group: true         # IdP-enforced: only grafana-admins can log in
    # Grafana generic_oauth callback. role_attribute_path maps the groups claim.
    redirect_uris:
      - "https://{{ platform_service_fqdns.monitoring }}/login/generic_oauth"
  - slug: gitlab
    launch_url: "https://{{ platform_service_fqdns.gitlab }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/gitlab.svg"
    name: "GitLab"
    group: "{{ platform_service_groups.gitlab.access }}"           # ACCESS group — only members may authenticate
    # Vault-native (GitLab chain): client creds read from Vault, not a local file.
    vault_path: "{{ platform_env }}/gitlab/oidc"   # post-migration KV convention (security/0001)
    restrict_to_group: true         # IdP-enforced: only gitlab-users can log in
    offline_access: true            # GitLab omniauth requests refresh tokens
    # GitLab CE reads the `groups` claim natively (emitted by scope-groups-<slug>):
    #   required_groups=[gitlab-users] gates login, admin_groups=[gitlab-admins]
    #   grants admin — configured on the GitLab side (roles/gitlab). gitlab-admins
    #   members MUST also be in gitlab-users to pass this IdP access policy.
    redirect_uris:
      - "https://{{ platform_service_fqdns.gitlab }}/users/auth/openid_connect/callback"
  - slug: jumpserver
    launch_url: "https://{{ platform_service_fqdns.jumpserver }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/jumpserver.svg"
    name: "JumpServer"
    group: "{{ platform_service_groups.jumpserver.access }}"        # ACCESS group — only members may SSO into the bastion
    vault_path: "{{ platform_env }}/jumpserver/oidc"   # Vault-native client creds (like GitLab)
    restrict_to_group: true          # IdP-enforced: only jumpserver-users can log in
    offline_access: true             # JumpServer requests refresh tokens
    # JumpServer's OIDC backend (apps/authentication/backends/oidc) does NOT
    # auto-discover Authentik; the role feeds it the explicit Authentik endpoints.
    # Callback is /core/auth/openid/callback/ (confirmed from the running core).
    redirect_uris:
      - "https://{{ platform_service_fqdns.jumpserver }}/core/auth/openid/callback/"

  - slug: verdaccio
    launch_url: "https://{{ platform_service_fqdns.verdaccio }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/verdaccio.svg"
    name: "npm registry (Verdaccio)"
    group: "{{ platform_service_groups.verdaccio.access }}"         # ACCESS group — only members may SSO into the registry
    vault_path: "{{ platform_env }}/verdaccio/oidc"   # Vault-native client creds (like GitLab)
    restrict_to_group: true          # IdP-enforced; verdaccio-openid also checks authorized-groups
    # verdaccio-openid callbacks: web UI, WebAuthn (npm >=9 `npm login`), CLI fallback.
    redirect_uris:
      - "https://{{ platform_service_fqdns.verdaccio }}/-/oauth/callback"
      - "https://{{ platform_service_fqdns.verdaccio }}/-/oauth/callback/authn"
      - "https://{{ platform_service_fqdns.verdaccio }}/-/oauth/callback/cli"
  - slug: harbor
    launch_url: "https://{{ platform_service_fqdns.harbor }}"
    icon: "https://cdn.jsdelivr.net/gh/selfhst/icons/svg/harbor.svg"
    name: "Harbor"
    group: "{{ platform_service_groups.harbor.access }}"           # ACCESS group — who may log in; harbor-admins (subset) become Harbor admins (oidc_admin_group)
    vault_path: "{{ platform_env }}/harbor/oidc"
    restrict_to_group: true         # IdP-enforced: only harbor-users can log in
    # Harbor's OIDC callback path.
    redirect_uris:
      - "https://{{ platform_service_fqdns.harbor }}/c/oidc/callback"

  - slug: grc
    launch_url: "https://{{ platform_service_fqdns.grc }}"
    name: "CISO Assistant"
    group: "{{ platform_service_groups.grc.access }}"      # ACCESS group — the app's JIT provisioning trusts the IdP
    vault_path: "{{ platform_env }}/grc/oidc"               # roles/ciso_assistant binds the same client (sso_bind)
    restrict_to_group: true     # IdP-enforced: only grc-users can log in
    redirect_uris:
      - "https://{{ platform_service_fqdns.grc }}/api/accounts/oidc/authentik/login/callback/"
# --- forwardAuth (proxy) blueprints — gate NO-AUTH apps behind Authentik SSO ------
# For apps that can't speak OIDC themselves (e.g. the Traefik dashboard, api@internal),
# Authentik fronts them with a Proxy Provider in `forward_single` mode, served by the
# built-in EMBEDDED OUTPOST (runs inside the authentik server at :9000, path
# /outpost.goauthentik.io/). Traefik calls it via forwardAuth: unauthenticated →
# redirect to Authentik; authenticated but not in `group` → 403. Add an app here to
# gate it — same "one list entry" pattern as authentik_oidc_apps.
# Proxy (forwardAuth) apps that were declared once and must go: blueprints only add, so a
# retired proxy provider stays and — sharing the name — blocks the OIDC provider of the same
# service (Portainer, 2026-09-19: "Redirect URI Error"). Explicit list, never implicit pruning.
authentik_proxy_apps_retired:
  - portainer            # replaced by the native OIDC app (authentik_oidc_apps)
authentik_proxy_apps:
  - slug: jitsi
    name: "Jitsi Meet"
    group: "{{ platform_service_groups.jitsi.access }}"                          # only members may open the conferencing app (forwardAuth)
    external_host: "https://{{ platform_service_fqdns.jitsi }}"
  - slug: demo-apps
    name: "Demo app (k3s)"
    group: "{{ platform_service_groups.nextcloud.access }}"                      # every platform user (forwardAuth on the demo route)
    external_host: "https://{{ platform_service_fqdns.k3s_demo }}"
  - slug: traefik-dashboard
    name: "Traefik Dashboard"
    group: "{{ platform_service_groups.traefik.admin }}"                       # only this group passes forwardAuth
    external_host: "https://{{ platform_service_fqdns.traefik }}"
  - slug: seaweedfs
    name: "SeaweedFS Admin"
    group: "{{ platform_service_groups.seaweedfs.admin }}"                     # only this group passes forwardAuth
    external_host: "https://{{ platform_service_fqdns.seaweedfs_admin }}"
  # NOTE: drawio is intentionally NOT SSO-gated — it's consumed as an iframe embed
  # by GitLab/Nextcloud (forwardAuth-in-iframe breaks), and is a stateless editor.
  # Kept internal via VPN + FW instead. (A dormant drawio proxy app + diagrams-users
  # group may exist in live Authentik from an earlier pass; harmless, can be pruned.)

# --- RADIUS (administrator logins on network devices, roles/authentik) ---------------------------
# Named here because more than one reader needs them: the DOCKER-USER catalog (port), the role
# (port, container), roles/prometheus (RadiusOutpostDown) and the log shipping (audit class).
platform_radius_port: 1812
platform_radius_container: "authentik-radius"

# --- Authentik behind the edge: which path decides that an instance receives traffic --------------
# The LIVENESS path: answered by the instance's web stack without opening a database connection.
# The readiness path forces a NEW database connection on every call (TLS + login): asked every
# 2 s by the edge's two services on both instances it was most of 4.7 new PostgreSQL sessions
# per second, and under load its answer passed the health timeout on both instances at once —
# the edge then had no instance for a moment (2026-10-04 21:27 UTC). Two instances share one
# database: when it is away both are equally unready and nothing is gained by removing them.
platform_authentik_lb_health_path: "/-/health/live/"
