---
# ==============================================================================
# Identity cutover vars (identity/0004) — used by hosts flipped to the
# svc-ansible-{env} access model (ansible_user/port set per host). The become
# password comes from the controller fabric working copy (mirrored to Vault at
# secret/{env}/svc-ansible/os — security/0001).
# ==============================================================================
# --- SSH baseline (security/0001, identity/0004 §9) — ONE source for every host ---------------
# roles/hardening + roles/sshd-hardening template sshd_config from it on VMs/LXCs/the PVE node;
# the OPNsense appliance (no API for its sshd) receives it through the seed (opnsense_provision
# feeds ssh_port/ssh_interfaces from here). Never edit an sshd config by hand.
platform_ssh_port: 22222
_os_svc_ansible_secret: "~/.openclaw/workspace/infra/secrets/fabric/os-svc-ansible-{{ platform_env | default('prod') }}.json"
ansible_become_password: >-
  {{ ((lookup('file', _os_svc_ansible_secret, errors='ignore') or '{"fields":{}}')
      | from_json).fields.password | default(omit) }}

# --- Platform jump path (single source — was hardcoded 20x in hosts.yml) ------
# SVC/DMZ guests are reached through the prod FW. During the by-rune ->
# svc-ansible-prod migration (naming/0002 §3) flip ONLY these two vars.
platform_jump_user: "svc-ansible-prod"
# extra ssh options for the hop (legacy keyed jump; emptied when the
# svc-ansible agent key takes over)
platform_jump_identity: ""
platform_jump_host: "10.6.239.196"
# The appliance's sshd follows the hardening baseline since the #379 re-seed (seed ssh_port =
# platform_ssh_port): the hop must name the port, or every SVC/DMZ host is UNREACHABLE.
platform_jump_port: "{{ platform_ssh_port }}"
platform_jump_args: >-
  -o ProxyCommand="ssh -W %h:%p -p {{ platform_jump_port }} {{ platform_jump_identity }}
  -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
  {{ platform_jump_user }}@{{ platform_jump_host }}"
  -o StrictHostKeyChecking=no
  -o UserKnownHostsFile=/dev/null

# --- Access groups — ONE source (identity/0004, naming/0002) -------------------------------------
# A group name was being written in three places: the Authentik registry that creates it, the role
# that gates on it, and people.yml membership. The role's copy is the one that drifts, so roles now
# read the name from here and never type it.
#
# Diffing this against the live identity provider on 2026-09-24 found four groups that existed only
# by hand — diagrams-users, grafana-admins, ldap-search, proxmox-admins. A blueprint rebuild would
# have deleted all four and with them the gates they enforce. They are declared here now.
#
# `access` = who may sign in at all. `admin` = the subset that additionally administers the service.
# The key is the platform service name; the value is the group's real name, never derived — several
# do not follow the service (monitoring is served by grafana-admins, proxmox by proxmox-admins).
platform_service_groups:
  diagrams:    {access: diagrams-users}
  gitlab:      {access: gitlab-users,     admin: gitlab-admins}
  harbor:      {access: harbor-users,     admin: harbor-admins}
  grc:         {access: grc-users,        admin: grc-admins}       # compliance registry (PR #526)
  jitsi:       {access: jitsi-users}
  jumpserver:  {access: jumpserver-users}
  mailcow:     {access: mailcow-users}
  monitoring:  {admin: grafana-admins}
  netbird:     {access: netbird-users,    admin: netbird-admins}
  netbox:      {admin: netbox-admins}
  nextcloud:   {access: nextcloud-users,  admin: nextcloud-admins}
  pbs:         {admin: pbs-admins}
  pgadmin:     {admin: pgadmin-admins}
  proxmox:     {admin: proxmox-admins}
  seaweedfs:   {admin: seaweedfs-admins}
  traefik:     {admin: traefik-admins}
  vault:       {admin: vault-admins}
  vaultwarden: {admin: vaultwarden-admins}
  verdaccio:   {access: verdaccio-users}

# Groups that gate no single service. Named individually so a role references the name rather than
# an index into a list.
platform_admins_group: "platform-admins"        # Authentik superusers; also the Wazuh/Portainer gate
platform_infra_admins_group: "infra-admins"
platform_ldap_search_group: "ldap-search"       # the LDAP outpost's search account
platform_dev_group: "dev"
platform_standalone_groups:
  - "{{ platform_admins_group }}"
  - "{{ platform_infra_admins_group }}"
  - "{{ platform_ldap_search_group }}"
  - "{{ platform_dev_group }}"

# The admin identity every service mailbox delegates to: it receives a copy of all
# incoming mail (bcc map) and may send as the service address (sender_acl), so a
# human can answer as netbird@ or alerts@ without anyone sharing those passwords.
# Derived, never typed: the platform owner's adm_ account (naming/0002 §2). A
# playbook that spells the address out is a second place a person can be renamed.
platform_service_mail_delegates:
  - "{{ (platform_people
         | selectattr('username', 'equalto', 'adm_' ~ (platform_people
             | selectattr('platform_owner', 'defined') | selectattr('platform_owner')
             | first).username)
         | first).email }}"
