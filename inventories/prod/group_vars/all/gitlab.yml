---
# GitLab runs in a container on the gitlab group's host (roles/gitlab). Every role and play that
# runs an Omnibus command there (gitlab-rails, gitlab-ctl, gitlab-rake, gitlab-backup) goes
# through this — ONE definition. A caller appends `-e NAME` flags (the value comes from the
# task's environment, never argv), then gitlab_container, then the command.
gitlab_container: gitlab
gitlab_exec: [docker, exec, -i]
# What callers stage for `gitlab-rails runner` (scripts, desired-state files): a host directory
# mounted read-only into the container at the same path.
gitlab_scripts_dir: /opt/gitlab-scripts
# The S3 buckets (SeaweedFS), ONE list: playbooks/gitlab.yml provisions them (one scoped key for
# all), roles/gitlab configures them (consolidated object storage + registry + backups).
gitlab_s3_buckets:
  artifacts: "gitlab-artifacts"
  external_diffs: "gitlab-external-diffs"
  lfs: "gitlab-lfs"
  uploads: "gitlab-uploads"
  packages: "gitlab-packages"
  dependency_proxy: "gitlab-dependency-proxy"
  terraform_state: "gitlab-terraform-state"
  ci_secure_files: "gitlab-ci-secure-files"
  ci_catalog_bundles: "gitlab-ci-catalog-bundles"   # GitLab 19.x: warns without one
  pages: "gitlab-pages"
gitlab_registry_bucket: "gitlab-registry"
gitlab_backup_bucket: "gitlab-backups"
