---
# Vault documents and fields that nothing reads any more (applied by playbooks/vault-tidy.yml,
# roles/vault_tidy). Paths are under secret/<env>/. `same_as` names where the same value lives
# now: the run refuses to retire a value that differs from it. An entry stays here after it has
# been applied — it is the record of what was retired and why, and a later run changes nothing.
platform_vault_retired_documents:
  - path: "gitlab/smtp"
    reason: "replaced by the service mailbox document mail/gitlab (roles/mailbox); roles/gitlab no longer reads it"
    same_as:
      - {field: smtp_password, path: "mail/gitlab", field_there: password}
  - path: "jumpserver/smtp"
    reason: "replaced by the service mailbox document mail/jumpserver (roles/mailbox); nothing reads it"
    same_as:
      - {field: smtp_password, path: "mail/jumpserver", field_there: password}
  # --- 2026-10-11: documents nothing reads (owner's go) -------------------------------------------
  - path: "crowdsec/console"
    reason: "the console enrolment key is also in crowdsec/console-enroll (kept, with its account and URL)"
    same_as:
      - {field: console_enroll_key, path: "crowdsec/console-enroll", field_there: enroll_key}
  - path: "monit/smtp-resend"
    reason: "the external mail relay is no longer used: each service mails through its own mailbox"
  - path: "opnsense-test/oob-admin"
    reason: "the test firewall no longer exists"
  - path: "opnsense-test/vm-opns-test-01"
    reason: "the test firewall no longer exists"
  - path: "opnsense-lab/svc-ansible"
    reason: "the lab firewall no longer exists on the platform's hypervisor"
  - path: "opnsense-lab/vm-opns-lab-01"
    reason: "the lab firewall no longer exists on the platform's hypervisor"
  - path: "proxmox/oidc"
    reason: "an earlier sign-in client of the hypervisor; the one in use is pve/oidc (roles/pve_host)"
  - path: "pgadmin/admin-poc"
    reason: "the administrator login of an earlier installation; the one in use is pgadmin/admin"
  - path: "net/isp-telenet-test"
    reason: "the line details of the test firewall, which no longer exists (the live ones are net/isp-telenet)"
  - path: "authentik/user-yboujraf-example"
    reason: "an example account document; no role reads authentik/user-* documents"
  # --- 2026-10-11: the two leftovers of the first firewall set-up (checked on the live firewall) --
  - path: "opnsense/vm-opns-01-access"
    reason: "an API key of the retired by-rune account: the firewall refuses it and the account no longer exists"
  - path: "opnsense/vm-opns-01"
    reason: "a record of root's factory default password (replaced since, roles/opnsense auth) and of the retired by-rune account"

platform_vault_retired_fields:
  - path: "mailcow/admin"
    fields: [gitlab_password, jumpserver_password, alerts_password]
    reason: "copies of three service mailbox passwords, each owned by mail/<service>; no role reads them here"
    same_as:
      - {field: gitlab_password, path: "mail/gitlab", field_there: password}
      - {field: jumpserver_password, path: "mail/jumpserver", field_there: password}
      - {field: alerts_password, path: "mail/alerts", field_there: password}

# Brought back from the archive.
platform_vault_restored_documents:
  - path: "resend/by-research"
    reason: "owner, 2026-10-11: the external mail relay must keep working, it is only not used now (archived by mistake the same night)"
