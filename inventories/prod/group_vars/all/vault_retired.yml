---
# Vault documents and fields that nothing reads any more (applied by playbooks/vault-tidy.yml,
# roles/vault_tidy). Paths are under secret/<env>/. `same_as` names where the same value lives
# now: the run refuses to retire a value that differs from it. An entry stays here after it has
# been applied — it is the record of what was retired and why, and a later run changes nothing.
platform_vault_retired_documents:
  - path: "gitlab/smtp"
    reason: "replaced by the service mailbox document mail/gitlab (roles/mailbox); roles/gitlab no longer reads it"
    same_as:
      - {field: smtp_password, path: "mail/gitlab", field_there: password}
  - path: "jumpserver/smtp"
    reason: "replaced by the service mailbox document mail/jumpserver (roles/mailbox); nothing reads it"
    same_as:
      - {field: smtp_password, path: "mail/jumpserver", field_there: password}
  # --- 2026-10-11: documents nothing reads (owner's go) -------------------------------------------
  - path: "crowdsec/console"
    reason: "the console enrolment key is also in crowdsec/console-enroll (kept, with its account and URL)"
    same_as:
      - {field: console_enroll_key, path: "crowdsec/console-enroll", field_there: enroll_key}
  - path: "monit/smtp-resend"
    reason: "the external mail relay is no longer used: each service mails through its own mailbox"
  - path: "opnsense-test/oob-admin"
    reason: "the test firewall no longer exists"
  - path: "opnsense-test/vm-opns-test-01"
    reason: "the test firewall no longer exists"
  - path: "opnsense-lab/svc-ansible"
    reason: "the lab firewall no longer exists on the platform's hypervisor"
  - path: "opnsense-lab/vm-opns-lab-01"
    reason: "the lab firewall no longer exists on the platform's hypervisor"
  - path: "proxmox/oidc"
    reason: "an earlier sign-in client of the hypervisor; the one in use is pve/oidc (roles/pve_host)"
  - path: "pgadmin/admin-poc"
    reason: "the administrator login of an earlier installation; the one in use is pgadmin/admin"
  - path: "net/isp-telenet-test"
    reason: "the line details of the test firewall, which no longer exists (the live ones are net/isp-telenet)"
  # --- 2026-10-11: the two leftovers of the first firewall set-up (checked on the live firewall) --
  - path: "opnsense/vm-opns-01-access"
    reason: "an API key of the retired by-rune account: the firewall refuses it and the account no longer exists"
  - path: "opnsense/vm-opns-01"
    reason: "a record of root's factory default password (replaced since, roles/opnsense auth) and of the retired by-rune account"
  # --- 2026-10-11: the off-site storage keys, held twice -------------------------------------------
  - path: "offsite/s3"
    reason: "repeated the keys of backup/s3-contabo; roles/seaweedfs now reads that one document and declares its own bucket"
    same_as:
      - {field: access_key, path: "backup/s3-contabo", field_there: access_key}
      - {field: secret_key, path: "backup/s3-contabo", field_there: secret_key}
  # --- 2026-10-11: the database service's documents moved under its name (postgresql/) -------------
  - path: "postgres/superuser"
    reason: "moved to postgresql/superuser (the service's name); roles/postgresql reads the new path"
    same_as:
      - {field: password, path: "postgresql/superuser", field_there: password}
  - path: "postgres/replication"
    reason: "moved to postgresql/replication"
    same_as:
      - {field: password, path: "postgresql/replication", field_there: password}
  - path: "postgres/patroni-api"
    reason: "moved to postgresql/patroni-api"
    same_as:
      - {field: password, path: "postgresql/patroni-api", field_there: password}
  - path: "postgres/admin"
    reason: "the administrator record of an earlier, single-server installation; nothing reads it"
  # --- 2026-10-11: audit pass — every document checked against every local repository -------------
  - path: "vault/login-yboujraf"
    reason: "an old sign-in token of the secrets store itself; the store refuses it (expired); nothing reads the document"
  - path: "opnsense/seed-bootstrap"
    reason: "the store's older copy of the firewall seed's bootstrap values (retired by-rune fields, the factory default's root hash); the build reads the controller's file, kept right by fw-offline-cache.yml"
  - path: "backup/nfs"
    reason: "a record of an NFS export (no secret) from the first installation; nothing reads it"
  - path: "net/lxc-break-glass"
    reason: "the login of an earlier emergency account (oob-admin) for the containers: no host has that account, and the password matches no account (checked on the 39 hosts); the emergency password is break-glass/os"

platform_vault_retired_fields:
  - path: "mailcow/admin"
    fields: [gitlab_password, jumpserver_password, alerts_password]
    reason: "copies of three service mailbox passwords, each owned by mail/<service>; no role reads them here"
    same_as:
      - {field: gitlab_password, path: "mail/gitlab", field_there: password}
      - {field: jumpserver_password, path: "mail/jumpserver", field_there: password}
      - {field: alerts_password, path: "mail/alerts", field_there: password}
  - path: "mailcow/admin"
    fields: [user_local_part, user_password, adm_user_local_part, adm_user_password, example_user_password, example_adm_password]
    reason: "passwords of people's mailboxes from before the identity-provider sign-in: those mailboxes have no password of their own any more (sign-in source generic-oidc); no role reads these fields"
  # --- 2026-10-11: documents split in two — the machine-only values now live in <service>/app ---
  - path: "netbox/admin"
    fields: [secret_key, api_token_pepper, superuser_api_token]
    reason: "machine-only values, read from netbox/app since the split; this document is the local administrator's login, read in Vault by the service's administrators (security/0001)"
    same_as:
      - {field: secret_key, path: "netbox/app", field_there: secret_key}
      - {field: api_token_pepper, path: "netbox/app", field_there: api_token_pepper}
      - {field: superuser_api_token, path: "netbox/app", field_there: superuser_api_token}
  - path: "gitlab/secrets"
    fields: [initial_root_password_file]
    reason: "the local administrator's login, read from gitlab/admin since the split; this document is the machine's (security/0001)"
    same_as:
      - {field: initial_root_password_file, path: "gitlab/admin", field_there: initial_root_password_file}

# Brought back from the archive.
platform_vault_restored_documents:
  - path: "resend/by-research"
    reason: "owner, 2026-10-11: the external mail relay must keep working, it is only not used now (archived by mistake the same night)"
  - path: "authentik/user-yboujraf-example"
    reason: "archived by mistake on 2026-10-11 (#919): roles/authentik reads authentik/user-<username> for every person of the inventory (a path built from the username, which the search for readers missed) — its play failed at the secrets step until this came back"

# Renames: a document made available under another path (the old path is retired above once
# nothing reads it). The database service is called `postgresql` everywhere — catalog, role,
# playbook, inventory group — its documents sat under the shorter `postgres/`.
platform_vault_copied_documents:
  - {from: "postgres/superuser", to: "postgresql/superuser", reason: "the service's name is postgresql"}
  - {from: "postgres/replication", to: "postgresql/replication", reason: "the service's name is postgresql"}
  - {from: "postgres/patroni-api", to: "postgresql/patroni-api", reason: "the service's name is postgresql"}
  # A document split in two (security/0001 §People reading in Vault): the local administrator's
  # login stays at <service>/admin, which the service's administrators read; what only the machine
  # needs moves to <service>/app (`fields`), and is retired from the first document above.
  - from: "netbox/admin"
    to: "netbox/app"
    fields: [secret_key, api_token_pepper, superuser_api_token]
    reason: "machine-only values leave the document the administrators' group reads"
  # The other way round: the document is the machine's (the service's own secrets file); the
  # local administrator's login leaves it for <service>/admin.
  - from: "gitlab/secrets"
    to: "gitlab/admin"
    fields: [initial_root_password_file]
    reason: "the local administrator's login gets its own document, read by the service's administrators"

# What stays out of the store. playbooks/secrets-to-vault.yml never writes one of these back
# from a file left on the controller (a restored document is a live one again).
platform_vault_retired_paths: >-
  {{ platform_vault_retired_documents | map(attribute='path')
     | difference(platform_vault_restored_documents | map(attribute='path')) | list }}
