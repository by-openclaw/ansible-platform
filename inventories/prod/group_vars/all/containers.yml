---
# ==============================================================================
# Containers — what every container of the platform has in common.
# ==============================================================================
# `always`, not `unless-stopped`: at a guest shutdown a process that exits before the Docker
# daemon stops is recorded as stopped, and `unless-stopped` then leaves it down at the next
# boot (a PostgreSQL member did not come back after its guest restarted, 2026-10-04).
# Nothing is stopped by hand: a play that wants a container down removes it.
# Consumed by roles/service_scaffold and by the roles that render a compose file.
platform_container_restart_policy: always
