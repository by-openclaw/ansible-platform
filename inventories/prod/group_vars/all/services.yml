  - {name: opnsense,      role: opnsense,         playbook: opnsense.yml,     host: vm-opns-01,         fqdn: null,      exposure: admin,   sso: local,       db: none,      pin: opnsense_firmware_target, pin_source: inventory, backup: [pbs, config-export], monitoring: [probe],              vendor: {name: OPNsense,         docs: https://docs.opnsense.org/}}
