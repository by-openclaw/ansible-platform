  - {name: crowdsec,      role: crowdsec,         playbook: crowdsec.yml,     host: lxc-crowdsec-01,    fqdn: null,      exposure: admin,   sso: none,        db: none,      pin: null,        backup: [pbs],             monitoring: [node],                  vendor: {name: CrowdSec,         docs: https://docs.crowdsec.net/}}
