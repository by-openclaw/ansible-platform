  - {name: diagrams,      role: diagrams,         playbook: diagrams.yml,     host: lxc-diagrams-01,    fqdn: diagrams,  exposure: private, sso: forwardauth, db: none,      pin: diagrams_kroki_image,    backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: Kroki,            docs: https://docs.kroki.io/}}
  - {name: pgadmin,       role: pgadmin,          playbook: pgadmin.yml,      host: lxc-pgadmin-01,     fqdn: pgadmin,   exposure: private, sso: oidc,        db: shared-pg, pin: pgadmin_image,           backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: pgAdmin,          docs: https://www.pgadmin.org/docs/}}
  - {name: jumpserver,    role: jumpserver,       playbook: jumpserver.yml,   host: lxc-jumpserver-01,  fqdn: jumpserver, exposure: private, sso: oidc,       db: own,       pin: jumpserver_version,      backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: JumpServer CE,    docs: https://docs.jumpserver.org/}}
  - {name: proxmox,       role: pve_host,         playbook: pve-host.yml,     host: srv-proxmox-poc-01, fqdn: proxmox,   exposure: admin,   sso: oidc,        db: none,      pin: null,                    backup: [config-export],   monitoring: [node],                  vendor: {name: Proxmox VE,       docs: https://pve.proxmox.com/pve-docs/}}
