---
# ==============================================================================
# Platform services catalog — ONE entry per service (data, not code). The register
# (playbooks/register.yml) renders docs/register.md from it; roles read their own row for
# exposure and ownership. Owner defaults to the person carrying `platform_owner: true` in
# people.yml; set `owner: <handle>` only when a service has another accountable person.
#
#   exposure: public  = internet without VPN (SSO, CrowdSec, rate limits in front)
#             private = LAN, or VPN when remote (SSO, restricted to access_groups)
#             admin   = JumpServer only for interactive access; web consoles on a private
#                       route restricted to platform-admins until the applet host exists
#   pin:      the role variable that carries the version = live (register reads it);
#             pin_source: inventory = the variable lives in the host's group_vars instead
#             (null = version managed by the OS package manager or not applicable)
#   sso:      oidc | forwardauth | local | none      db: shared-pg | own | none
#   backup:   classes of infra/0008 (pbs = guest backup by the node job)
#   vendor:   the official documentation the audit points to
# ==============================================================================
platform_services:
  - {name: authentik,     role: authentik,        playbook: authentik.yml,    host: lxc-authentik-01,   fqdn: authentik, exposure: public,  sso: oidc,        db: shared-pg, pin: authentik_version,      backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: authentik,        docs: https://docs.goauthentik.io/}}
  - {name: nextcloud,     role: nextcloud,        playbook: nextcloud.yml,    host: lxc-nextcloud-01,   fqdn: nextcloud, exposure: public,  sso: oidc,        db: shared-pg, pin: nextcloud_image,         backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: Nextcloud,        docs: https://docs.nextcloud.com/}}
  - {name: collab,        role: nextcloud_collab, playbook: collab.yml,       host: lxc-collab-01,      fqdn: office,    exposure: public,  sso: forwardauth, db: none,      pin: nextcloud_collab_talk_image,        backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: ONLYOFFICE / Nextcloud Talk, docs: https://helpcenter.onlyoffice.com/}}
  - {name: jitsi,         role: jitsi,            playbook: jitsi.yml,        host: lxc-jitsi-01,       fqdn: meet,      exposure: public,  sso: forwardauth, db: none,      pin: jitsi_image_tag,           backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: Jitsi Meet,       docs: https://jitsi.github.io/handbook/}}
  - {name: vaultwarden,   role: vaultwarden,      playbook: vaultwarden.yml,  host: lxc-vaultwarden-01, fqdn: vaultwarden, exposure: public, sso: oidc,      db: shared-pg, pin: vaultwarden_image,       backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: Vaultwarden,      docs: https://github.com/dani-garcia/vaultwarden/wiki}}
  - {name: mailcow,       role: mailcow,          playbook: mailcow.yml,      host: vm-mailcow-01,      fqdn: mail,      exposure: public,  sso: oidc,        db: own,       pin: mailcow_git_version,         backup: [pbs, app-native], monitoring: [node, probe],           vendor: {name: mailcow,          docs: https://docs.mailcow.email/}}
  - {name: netbird,       role: netbird,          playbook: netbird.yml,      host: lxc-netbird-01,     fqdn: vpn,       exposure: public,  sso: oidc,        db: shared-pg, pin: netbird_dashboard_image, backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: NetBird,          docs: https://docs.netbird.io/}}
  - {name: gitlab,        role: gitlab,           playbook: gitlab.yml,       host: lxc-gitlab-01,      fqdn: gitlab,    exposure: private, sso: oidc,        db: shared-pg, pin: gitlab_version,          backup: [pbs, app-native], monitoring: [node, probe],           vendor: {name: GitLab CE,        docs: https://docs.gitlab.com/}}
  - {name: gitlab-runner, role: gitlab_runner,    playbook: gitlab-runner.yml, host: vm-gitlab-runner-01, fqdn: null,    exposure: admin,   sso: none,        db: none,      pin: null,   backup: [pbs],             monitoring: [node],                  vendor: {name: GitLab Runner,    docs: https://docs.gitlab.com/runner/}}
  - {name: harbor,        role: harbor,           playbook: harbor.yml,       host: lxc-harbor-01,      fqdn: harbor,    exposure: private, sso: oidc,        db: shared-pg, pin: harbor_version,          backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: Harbor,           docs: https://goharbor.io/docs/}}
  - {name: verdaccio,     role: verdaccio,        playbook: verdaccio.yml,    host: lxc-verdaccio-01,   fqdn: npm,       exposure: private, sso: oidc,        db: none,      pin: verdaccio_image,         backup: [pbs],             monitoring: [node, cadvisor, probe], vendor: {name: Verdaccio,        docs: https://verdaccio.org/docs/}}
  - {name: netbox,        role: netbox,           playbook: netbox.yml,       host: lxc-nbox-01,        fqdn: netbox,    exposure: private, sso: oidc,        db: shared-pg, pin: netbox_image,            backup: [pbs, app-native], monitoring: [node, cadvisor, probe], vendor: {name: NetBox,           docs: https://docs.netbox.dev/}}
  - {name: monitoring,    role: grafana,          playbook: monitoring.yml,   host: lxc-monitoring-01,  fqdn: grafana,   exposure: private, sso: oidc,        db: shared-pg, pin: null,         backup: [pbs],             monitoring: [node, probe],           vendor: {name: Grafana / Prometheus / Loki / Alertmanager, docs: https://grafana.com/docs/}}
