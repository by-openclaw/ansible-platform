---
# ==============================================================================
# platform_people — THE single source of who exists on the platform. One entry
# provisions the whole account bundle (identity/0004):
#   - Authentik user + group memberships  (roles/authentik blueprint)
#   - Authentik HR/contact attributes     (identity_orchestrator → attributes)
#   - GitLab SSH + GPG keys                (gitlab_rbac reconciler, from ssh_keys/gpg_keys)
#   - confirmation email with the bundle   (identity_orchestrator)
# Consumed by roles/authentik, playbooks/identity-provision.yml and gitlab_rbac.
#
# Schema (per person):
#   username   : login (Authentik + apps). REQUIRED.
#   name       : display name. REQUIRED.
#   email      : primary address. REQUIRED.
#   state      : active | disabled  (removal = disabled, NEVER delete — identity/0004 §1)
#   groups     : access groups (see the group rule below). REQUIRED.
#   attributes : optional HR/contact record → Authentik user.attributes
#                (title, phone, manager, department, start_date). No PII invented;
#                fill what is true. Surfaced in the confirmation email.
#   ssh_keys   : list of {label, key} — PUBLIC ed25519 keys, ONE per device
#                (never share a private key between devices). → GitLab (git + auth).
#   gpg_keys   : list of {label, key} — ASCII-armored PUBLIC GPG keys → GitLab
#                (Verified commits). Prefer SSH commit signing; GPG optional.
# Passwords / private keys NEVER live here (Vault / the person's own device / Vaultwarden).
#
# Group rule (EntraID-style): the daily-driver account holds *-users groups only;
# the adm_ account holds the *-admins groups AND the *-users groups an app needs
# to pass its access policy (e.g. gitlab-admins members must be in gitlab-users).
# ==============================================================================
platform_people:
  - username: yboujraf
    name: "Youssef Boujraf"
    email: "yboujraf@{{ platform_domain }}"
    state: active
    manage_keys: true         # roles/identity_keys generates+escrows an ed25519 SSH + GPG pair in Vault
    attributes:
      title: "Platform Owner"
    groups:
      - gitlab-users
      - harbor-users
      - verdaccio-users
      - jitsi-users
      - nextcloud-users
      - netbird-users
      - mailcow-users
      - vaultwarden-admins     # pre-existing grant (personal vault admin)
  - username: adm_yboujraf
    name: "Youssef Boujraf (admin)"
    email: "adm_yboujraf@{{ platform_domain }}"
    state: active
    manage_keys: true         # its OWN pair (never shared with the daily-driver account)
    attributes:
      title: "Platform Administrator (privileged)"
    groups:
      - platform-admins        # Authentik superuser
      - infra-admins
      - gitlab-users
      - gitlab-admins
      - harbor-users
      - harbor-admins
      - verdaccio-users
      - jitsi-users
      - jumpserver-users
      - nextcloud-users
      - nextcloud-admins
      - netbird-users
      - netbird-admins
      - vault-admins
      - vaultwarden-admins
      - pgadmin-admins
      - netbox-admins
      - traefik-admins
      - seaweedfs-admins
      - proxmox-admins
      - pbs-admins
      - grafana-admins
  - username: yboujraf_example
    name: "Youssef Boujraf (example.com)"
    email: "yboujraf@example.com"
    state: active
    groups:
      - mailcow-users          # second-domain mailbox identity only
