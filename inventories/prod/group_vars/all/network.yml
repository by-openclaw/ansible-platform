---
# ==============================================================================
# Platform network catalog — the zones of infra/0004 as DATA. Every role that needs a zone
# network, the internal aggregate or the VPN overlay reads it from here; no CIDR literal lives
# in a role (pre-commit: scripts/check_platform_literals.py). The firewall catalog's net4_*/net6_*
# aliases and the resolver's per-zone ACLs are rendered from the same entries.
# ==============================================================================
# Each zone's gateway is the firewall's interface in it: .1 and ::1, verified against the
# default route on a host in the zone. Declared once here so no role types a router address.
platform_zones:
  mgmt:    {cidr4: "10.1.1.0/24",  cidr6: "fd01:1::/64",  gw4: "10.1.1.1", gw6: "fd01:1::1",  description: "platform management"}
  dmz:     {cidr4: "10.1.2.0/24",  cidr6: "fd01:2::/64",  gw4: "10.1.2.1", gw6: "fd01:2::1",  description: "public-facing edge (Traefik, mail, TURN)"}
  svc:     {cidr4: "10.1.3.0/24",  cidr6: "fd01:3::/64",  gw4: "10.1.3.1", gw6: "fd01:3::1",  description: "internal services"}
  vpn:     {cidr4: "10.1.4.0/24",  cidr6: "fd01:4::/64",  gw4: "10.1.4.1", gw6: "fd01:4::1",  description: "VPN concentrator side"}
  iot:     {cidr4: "10.1.10.0/24",  cidr6: "fd01:10::/64",  gw4: "10.1.10.1", gw6: "fd01:10::1", description: "IoT"}
  voip:    {cidr4: "10.1.11.0/24",  cidr6: "fd01:11::/64",  gw4: "10.1.11.1", gw6: "fd01:11::1", description: "VoIP"}
  storage: {cidr4: "10.1.20.0/24",  cidr6: "fd01:20::/64",  gw4: "10.1.20.1", gw6: "fd01:20::1", description: "storage plane"}
  media:   {cidr4: "10.1.30.0/24",  cidr6: "fd01:30::/64",  gw4: "10.1.30.1", gw6: "fd01:30::1", description: "media"}
  gaming:  {cidr4: "10.1.32.0/24",  cidr6: "fd01:32::/64",  gw4: "10.1.32.1", gw6: "fd01:32::1", description: "gaming"}
  cctv:    {cidr4: "10.1.40.0/24",  cidr6: "fd01:40::/64",  gw4: "10.1.40.1", gw6: "fd01:40::1", description: "CCTV"}

# Aggregates (derived meaning, single definition)
platform_internal_cidr4: "10.1.0.0/16"     # every guest zone above (the platform LAN)
platform_internal_cidr6: "fd01::/16"
platform_core_cidr4: "10.1.0.0/20"         # the core zones (mgmt, dmz, svc, vpn) — WireGuard client AllowedIPs
platform_vpn_cidr: "100.64.0.0/10"         # NetBird overlay (CGNAT range): VPN peers
# Container-side ranges — part of the address plan: they must never overlap a platform
# network, so they live here, not in the roles that use them.
platform_docker_pools_cidr4: "172.16.0.0/12"      # Docker's default address pools (every Docker host)
platform_docker_bridge_cidr4: "172.17.0.0/16"     # the default bridge (docker0)
platform_docker_bridge_gw4: "172.17.0.1"          # docker0's host address
platform_docker_cidr6: "fd00:d0c::/64"            # the v6 bridge ULA (masqueraded to the host's v6)
platform_k3s_cluster_cidr4: "10.42.0.0/16"        # k3s pods
platform_k3s_service_cidr4: "10.43.0.0/16"        # k3s services
# The ISP /29 the platform egresses from and the firewalls sit on: office egress
# (.218), prod FW (.222), test FW (.220). A network fact, so it lives here rather
# than inline in whatever list happens to need it.
platform_isp_egress_cidr4: "213.214.47.216/29"

# The platform's OWN management networks — deliberately NOT in platform_zones.
# Every zone there is a VLAN the firewall serves with a gateway and a v6 prefix,
# and consumers iterate it on that assumption: roles/adguard builds one DNS client
# per zone from {cidr4, cidr6}. These two are neither — the OOB path carries no v6,
# and neither gateway is ours to declare (the node and the firewall own them). They
# were put in platform_zones first and broke that loop immediately, which is the
# argument for keeping them separate rather than teaching every consumer to filter.
#
# Before this they had NO owner at all, so five roles each spelled the CIDRs out and
# the inventory listed them seven more times. Note platform_zones.mgmt is
# 10.1.1.0/24 — the platform management VLAN — a different network from both of
# these; the name was already taken, which is part of why they were never factored out.
platform_mgmt_zones:
  oob:    {cidr4: "10.6.224.0/20", description: "out-of-band — Proxmox nodes and the firewall's management path (v4 only)"}
  fabric: {cidr4: "10.6.240.0/20", description: "switch fabric management, VLAN 600"}
