---
# ==============================================================================
# Published container ports and who may reach them — the DOCKER-USER catalog.
# Docker DNATs published ports ahead of ufw's INPUT chain, so ufw never filters
# them (verified 2026-09-27). roles/docker renders this catalog into the
# DOCKER-USER chain of every Docker host: the fleet-wide entries plus the entries
# of the services that platform_services places on that host.
#
#   port  the HOST side of the mapping (`docker ps`: left of ->)
#   proto tcp (default) or udp
#   from  a service name (-> that service's host, every member of a clustered one), db:<value> (every service
#         whose platform_services `db` is that value), trusted
#         (platform_trusted_cidrs) or any. A name that resolves to nothing fails
#         the run. IPv4 resolves to the host (/32), IPv6 to the host's zone (/64):
#         hosts source IPv6 from their SLAAC address, not the static one, so a
#         /128 misses them (every PostgreSQL and Redis client did, 2026-09-28).
#
# Mode per host: docker_user_firewall = audit (log what is not declared, accept
# it) or enforce (drop it). Entries come from the 2026-09-27/28 audit AND the
# service design (e.g. pgAdmin never connected in the window but is a db user).
# ==============================================================================
# Hosts whose DOCKER-USER chain DROPS what the catalog does not declare (the rest audit:
# log and accept). Rolled out in waves after the audit stayed at zero undeclared flows
# for 16 h across the nightly cycle (2026-09-29) and a synthetic undeclared connection
# was logged — so zero meant "complete", not "not logging". Rollback = remove the host.
platform_docker_firewall_enforce:
  # wave 1 — internal tools, Traefik-only or common ports
  - lxc-verdaccio-01
  - lxc-seaweedfs-01
  - lxc-portainer-01
  - lxc-diagrams-01
  - lxc-wazuh-01
  # wave 2 — web apps behind Traefik, and the CI runner (fleet-wide ports only)
  - lxc-grc-01
  - lxc-harbor-01
  - lxc-jumpserver-01
  - lxc-nbox-01
  - lxc-pgadmin-01
  - lxc-vaultwarden-01
  - vm-gitlab-runner-01
  # wave 3 — shared services, applied one host at a time
  - lxc-pgsql-01
  - lxc-redis-01
  - lxc-vault-01
  - lxc-stepca-01
  - lxc-authentik-01
  # wave 4 — public-facing (TURN, the video bridge, VPN, files, mail), one host at a time
  - lxc-nextcloud-01
  - lxc-netbird-01
  - lxc-collab-01
  - lxc-jitsi-01
  - vm-mailcow-01

platform_docker_firewall_common:
  - {port: 9001, from: [portainer], comment: "Portainer agent"}
  - {port: 9180, from: [monitoring], comment: "cAdvisor metrics"}

platform_docker_firewall:
  authentik:
    - {port: 9000, from: [traefik], comment: "Authentik web"}
    - {port: 636, from: [trusted], comment: "Authentik LDAP outpost (LDAPS)"}
    - {port: 9300, from: [monitoring], comment: "Authentik metrics (Prometheus)"}
  collab:
    - {port: 8000, from: [traefik], comment: "ONLYOFFICE"}
    - {port: 8081, from: [traefik], comment: "Talk signaling backend"}
    - {port: 1234, from: [traefik], comment: "Talk recording"}
    - {port: 3002, from: [traefik], comment: "Whiteboard"}
    - {port: 3478, proto: tcp, from: [any], comment: "Talk TURN"}
    - {port: 3478, proto: udp, from: [any], comment: "Talk TURN"}
  diagrams:
    - {port: 8000, from: [traefik], comment: "Kroki"}
    - {port: 8004, from: [traefik], comment: "PlantUML"}
    - {port: 8080, from: [traefik], comment: "draw.io"}
  gitlab-runner:
    - {port: 9252, from: [monitoring], comment: "GitLab Runner /metrics (Prometheus)"}
  grc:
    - {port: 3000, from: [traefik], comment: "CISO Assistant app"}
    - {port: 8000, from: [traefik], comment: "CISO Assistant API"}
  harbor:
    - {port: 8080, from: [traefik], comment: "Harbor"}
    - {port: 9090, from: [monitoring], comment: "Harbor /metrics (Prometheus)"}
  jitsi:
    - {port: 8000, from: [traefik], comment: "Jitsi web"}
    - {port: 10000, proto: udp, from: [any], comment: "Jitsi video bridge media"}
    - {port: 9222, from: [monitoring], comment: "Jitsi JVB metrics (Prometheus)"}
  jumpserver:
    - {port: 8090, from: [traefik], comment: "JumpServer web"}
  # Mail is reached from everywhere: MX senders, every host's relay (587), mail
  # clients. The OPNsense catalog decides what the internet may reach.
  mailcow:
    - {port: 25, from: [any], comment: "SMTP"}
    - {port: 465, from: [any], comment: "SMTPS"}
    - {port: 587, from: [any], comment: "Submission"}
    - {port: 110, from: [any], comment: "POP3"}
    - {port: 995, from: [any], comment: "POP3S"}
    - {port: 143, from: [any], comment: "IMAP"}
    - {port: 993, from: [any], comment: "IMAPS"}
    - {port: 4190, from: [any], comment: "ManageSieve"}
    - {port: 8080, from: [traefik], comment: "mailcow web"}
    - {port: 8443, from: [traefik, monitoring], comment: "mailcow web (TLS)"}
  netbird:
    - {port: 80, from: [traefik], comment: "NetBird dashboard"}
    - {port: 8081, from: [traefik], comment: "NetBird signal (HTTP)"}
    - {port: 10000, from: [traefik], comment: "NetBird signal"}
    - {port: 33073, from: [traefik, monitoring], comment: "NetBird management"}
    - {port: 33080, from: [traefik], comment: "NetBird relay"}
    - {port: 9224, from: [monitoring], comment: "NetBird management /metrics (Prometheus)"}
    - {port: 9225, from: [monitoring], comment: "NetBird signal /metrics (Prometheus)"}
    - {port: 9226, from: [monitoring], comment: "NetBird relay /metrics (Prometheus)"}
  netbox:
    - {port: 8080, from: [traefik, monitoring], comment: "NetBox (web; /metrics for Prometheus)"}
  nextcloud:
    - {port: 80, from: [traefik], comment: "Nextcloud"}
    - {port: 9205, from: [monitoring], comment: "Nextcloud exporter (Prometheus)"}
  pgadmin:
    - {port: 8080, from: [traefik], comment: "pgAdmin"}
  portainer:
    - {port: 9000, from: [traefik], comment: "Portainer"}
  postgresql:
    - {port: 5432, from: ["db:shared-pg", postgresql, dbproxy], comment: "PostgreSQL (consumers, replication between the members, the endpoint)"}
    - {port: 8008, from: [postgresql, dbproxy], comment: "Patroni REST API (member checks, the endpoint's leader check)"}
    - {port: 2379, from: [postgresql], comment: "etcd clients (Patroni on every member)"}
    - {port: 2380, from: [postgresql], comment: "etcd peers"}
  dbproxy:
    - {port: 5432, from: ["db:shared-pg"], comment: "PostgreSQL endpoint (routes to the leader)"}
    - {port: 6379, from: [gitlab, netbox, nextcloud], comment: "Redis endpoint (routes to the primary)"}
    - {port: 26379, from: [redis], comment: "Redis Sentinel (the third Sentinel)"}
    - {port: 8405, from: [monitoring], comment: "HAProxy metrics (Prometheus)"}
  redis:
    - {port: 6379, from: [gitlab, netbox, nextcloud, redis, dbproxy], comment: "Redis (consumers, replication between the members, the Sentinels, the endpoint)"}
    - {port: 26379, from: [redis, dbproxy], comment: "Redis Sentinel (the three Sentinels talk to each other)"}
  # Every host fetches the CA roots straight from step-ca (roles/platform_ca).
  step-ca:
    - {port: 9000, from: [trusted], comment: "step-ca"}
  vault:
    - {port: 8200, from: [traefik, warden, vault, monitoring], comment: "Vault API (the edge, the cold-start unsealer, the members: join and request forwarding, the per-member probe)"}
    - {port: 8201, from: [vault], comment: "Vault cluster port (raft between the members)"}
  vaultwarden:
    - {port: 80, from: [traefik], comment: "Vaultwarden"}
  verdaccio:
    - {port: 4873, from: [traefik], comment: "Verdaccio"}
  # Every platform host runs a Wazuh agent. Their connections are long-lived, so the
  # audit window saw one reconnect in 23 h (the manager publishes 1514-1515 as a range,
  # which the first port survey missed).
  wazuh:
    - {port: 5601, from: [traefik], comment: "Wazuh dashboard"}
    - {port: 1514, from: [trusted], comment: "Wazuh agents (events)"}
    - {port: 1515, from: [trusted], comment: "Wazuh agents (enrolment)"}
