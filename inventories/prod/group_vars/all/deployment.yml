---
# ==============================================================================
# Deployment manifest — the SINGLE source for org/domain/env (naming/0001 §9).
# Every role/playbook consumes these variables; the real domain is NEVER
# hardcoded anywhere else. Change the deployment => change ONLY this file.
# ==============================================================================
platform_org: "by-research"          # org short-name; also the break-glass account/group (naming/0002 §5.1)
platform_domain: "by-research.be"    # DNS zone of THIS deployment (env = subdomain zone, naming/0001 §8)
platform_env: "prod"                 # environment tier (infra/0005)

# --- Connection default -------------------------------------------------------
# Every host is reached over SSH. The FW (vm-opns-01) overrides this with a host
# var `ansible_connection: local` (API-only, no shell). Being explicit matters for
# delegation: a task delegated from a `connection: local` play to an SSH host
# inherited "local" and silently ran on the controller (2026-09-04 findings).
ansible_connection: ssh

# --- Public ingress addresses (Telenet static /29 + /48) — ONE source ----------------------------
# The FW catalog aliases host4_wan_pub / host6_wan_pub, the Cloudflare apex records and the Jitsi
# video bridge (advertised candidate for external peers) all mean this address.
platform_public_ipv4: "213.214.47.222"
platform_public_ipv6: "2a02:1802:21::5"
