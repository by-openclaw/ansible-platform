---
# ==============================================================================
# cerebrum_db — the SQL instance of the Cerebrum platform (roles/cerebrum_db). The installers
# live on the platform object store; their checksums are the pin. Empty values stop the role.
# ==============================================================================
cerebrum_db_version: "2019"
cerebrum_db_installer_url: "https://s3.{{ platform_domain }}/installers/mssql/SQLEXPR_x64_ENU_2019.exe"
cerebrum_db_installer_sha256: ""          # to fill when the file is on the store (owner uploads the vendor's SQL Express)
cerebrum_db_odbc_msi_url: "https://s3.{{ platform_domain }}/installers/mssql/msodbcsql_17.msi"
cerebrum_db_odbc_msi_sha256: ""
cerebrum_db_sqlcmd_msi_url: "https://s3.{{ platform_domain }}/installers/mssql/MsSqlCmdLnUtils_15.msi"
cerebrum_db_sqlcmd_msi_sha256: ""
cerebrum_db_database: Cortex              # what the lab's Cerebrum created; the server's ini names it
