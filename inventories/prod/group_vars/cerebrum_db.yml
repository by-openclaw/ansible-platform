---
# ==============================================================================
# cerebrum_db — the SQL instance of the Cerebrum platform (roles/cerebrum_db). Installers pinned by
# sha256; empty values stop the role.
# ==============================================================================
cerebrum_db_version: "2025"
cerebrum_db_instance: BY_CEREBRUM               # the owner's name (2026-11-03): letters, digits and _ only, 16 at most
# SQL Server 2025 Express (17.0.1000.7). Microsoft publishes it only through its web installer, so the
# media is the one that installer downloaded on vm-winsql-01 (2026-11-03); the object store will hold
# the same file under this name, and the staged copy then goes.
cerebrum_db_installer_url: "https://s3.{{ platform_domain }}/installers/mssql/SQLEXPR_x64_ENU_2025.exe"
cerebrum_db_installer_sha256: "74aa90c11202a5524e769b9bc22531baef22d91e9b2d2e8c3cb99e89a65c5297"   # pragma: allowlist secret (a checksum)
cerebrum_db_installer_staged_path: 'C:\Users\by-research\Downloads\SQLEXPR_x64_ENU.exe'
# Microsoft Command Line Utilities 17.0.4055.5 (sqlcmd, 2026-06-30), from Microsoft's download centre.
cerebrum_db_sqlcmd_msi_url: "https://download.microsoft.com/download/6f8fa386-26c0-4376-b779-66d2e22378e8/SqlCmdLnUtils17.0.4055.5/amd64/1033/MsSqlCmdLnUtils.msi"
cerebrum_db_sqlcmd_msi_sha256: "25c7208cd5ba98beae4f1a464625a78d3607498e990fdde40fe59e747f2b8bac"   # pragma: allowlist secret (a checksum)
# sa took the password the owner recorded at the manual install; that document is retired (#1092), so
# nothing is copied any more. Both Cerebrum instances sign in with their own login (2026-11-03): sa is
# disabled (CIS 2.14).
cerebrum_db_sa_vault_copy_from: ""
cerebrum_db_sa_enabled: false

# Connectivity checks (playbooks/net-check.yml, roles/net_check), on the SQL host: each Cerebrum instance's
# database ONLINE, its login not locked, live sessions from its server (Windows authentication, read-only).
# The names follow roles/cerebrum_db (cerebrum_db_database_prefix Cerebrum_, cerebrum_db_login_prefix cerebrum_).
net_checks:
  sql: >-
    {%- set out = [] -%}
    {%- for h in groups['cerebrum_server'] | default([]) -%}
    {%- set _ = out.append({'instance': cerebrum_db_instance, 'database': 'Cerebrum_' ~ hostvars[h].cerebrum_instance,
                            'login': 'cerebrum_' ~ hostvars[h].cerebrum_instance, 'from': hostvars[h].ansible_host}) -%}
    {%- endfor -%}
    {{ out }}

# The data disk D: (Terraform data_disk_size_gib, roles/windows_data_disk): the SQL native backups (roles/cerebrum_db).
windows_data_disk_folders:
  - 'D:\Backup\SQL'
