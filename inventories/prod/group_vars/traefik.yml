---
# Traefik edge logs → Loki (infra/0006: every log stream shipped).
promtail_extra_file_jobs:
  - { name: traefik_access, path: /var/log/traefik/access.log, audit: true }
  - { name: traefik_error, path: /var/log/traefik/traefik.log }

# CrowdSec agent on the edge: the nginx collection parses Traefik's access log format.
crowdsec_agent_extra_collections:
  - crowdsecurity/nginx

# The dev tier's zone wildcard *.dev.<domain>: the EVS Cerebrum servers terminate their own TLS (web
# client, RCP) and copy it (roles/tls_cert windows.yml, roles/cerebrum_server certificate.yml).
traefik_zone_wildcards: [dev]
