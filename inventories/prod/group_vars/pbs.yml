---
# ==============================================================================
# pbs — the backup server's API access log to Loki with the audit label (INF-27/29: who listed,
# restored, pruned or changed what); the task results already reach Loki through the journal.
# ==============================================================================
promtail_extra_file_jobs:
  - {name: pbs_access, path: "/var/log/proxmox-backup/api/access.log", audit: true}
promtail_acl_dirs:
  - /var/log/proxmox-backup/api
