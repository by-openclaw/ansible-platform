---
# k3s writes every pod's container log under /var/log/pods (containerd, not Docker):
# ship them to Loki next to the journal (roles/promtail extra file job).
promtail_extra_file_jobs:
  - { name: k3s_pods, path: "/var/log/pods/*/*/*.log" }
  - { name: k3s_audit, path: "/var/log/k3s/audit.log", audit: true }   # API audit log (who did what)
# The kubelet writes the tree root:root 0750; promtail reads it through an inherited ACL.
promtail_acl_dirs: ["/var/log/pods", "/var/log/k3s"]
