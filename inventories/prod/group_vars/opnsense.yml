# mailcow inbound mail — Telenet WAN (opt13). :25 = MX (mail from the world);
# 465/587/993/995 = client submission + retrieval for roaming users. Dual-stack,
# host_mailcow alias target. Matches the Telenet→Traefik/STUN ingress pattern.
- {description: 'PASS Telenet WAN → mailcow SMTP/MX (v4)',     action: pass, interface: opt13, direction: in, ipprotocol: inet,  protocol: TCP, source_net: any, destination_net: host4_mailcow, destination_port: port_smtp,        quick: '1', enabled: '1', state: present, ref: {adr: 'services/0007#mail-ingress', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}}
