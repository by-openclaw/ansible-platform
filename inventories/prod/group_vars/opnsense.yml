# Proximus (WAN1) dual-WAN ingress — dynamic interface address (opt12ip). IPv4 only
# until Proximus IPv6 (GUA) is confirmed; no v6 invented.
- {descr: 'DNAT Proximus→Traefik HTTP (v4)',  interface: opt12, protocol: TCP, ipprotocol: inet, destination: {network: opt12ip, port: port_http},  target: host4_traefik, local-port: port_http,  state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
- {descr: 'DNAT Proximus→Traefik HTTPS (v4)', interface: opt12, protocol: TCP, ipprotocol: inet, destination: {network: opt12ip, port: port_https}, target: host4_traefik, local-port: port_https, state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
- {descr: 'DNAT Proximus→NetBird STUN (v4)',  interface: opt12, protocol: UDP, ipprotocol: inet, destination: {network: opt12ip, port: port_stun}, target: host4_netbird, local-port: port_stun, state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
# mailcow inbound mail DNAT — Telenet WAN (opt13) public IP → mailcow (DMZ). One
# forward per port (WAN:port → mailcow:port). Dual-stack, host_mailcow alias target
# (no raw IP). The matching pass rules are in opn_filter_rules above. The matching
# SMTP-egress policy-route is the DMZ PBR rule. example.com stays internal-only (no
# WAN forward). Telenet only (mail egress/ingress is Telenet; Proximus blocks :25).
- {descr: 'DNAT Telenet→mailcow SMTP/MX (v4)',  interface: opt13, protocol: TCP, ipprotocol: inet,  destination: {network: host4_wan_pub, port: port_smtp},       target: host4_mailcow, local-port: port_smtp,       state: present, ref: {adr: 'services/0007#mail-ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
- {descr: 'DNAT Telenet→mailcow SMTP/MX (v6)',  interface: opt13, protocol: TCP, ipprotocol: inet6, destination: {network: host6_wan_pub, port: port_smtp},       target: host6_mailcow, local-port: port_smtp,       state: present, ref: {adr: 'services/0007#mail-ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
