opn_dnat_rules:
# Public ingress: Telenet WAN (opt13) :80/:443 → Traefik (dual-stack port-forward).
- {descr: 'DNAT Telenet→Traefik HTTP (v4)',  interface: opt13, protocol: TCP, ipprotocol: inet,  destination: {network: host4_wan_pub, port: port_http},  target: host4_traefik, local-port: port_http,  state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
