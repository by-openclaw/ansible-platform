  - {hostname: lxc-gitlab-01, domain: "{{ platform_domain }}", rr: A,    server: 10.1.3.210}
  - {hostname: lxc-gitlab-01, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:3::210'}
  # Service names → Traefik (internal split-horizon; GitLab web + container registry
  # via Traefik). VPN-only (no public Cloudflare record). Pages (*.pages) needs a
  # wildcard override + wildcard cert — follow-up, not here.
  - {hostname: gitlab, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: gitlab, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  - {hostname: registry, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: registry, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # Shared diagram services (lxc-diagrams-01) — backend host + service names →
  # Traefik (internal split-horizon, VPN-only). Kroki/PlantUML = render APIs
  # (server-to-server), drawio = editor. Used platform-wide, not just GitLab.
  - {hostname: lxc-diagrams-01, domain: "{{ platform_domain }}", rr: A,    server: 10.1.3.220}
  - {hostname: lxc-diagrams-01, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:3::220'}
  - {hostname: kroki, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
