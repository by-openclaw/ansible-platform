# ---------------------------------------------------------------------------
# Dnsmasq — OPNsense 26.1 default DNS/DHCP/RA daemon
# ---------------------------------------------------------------------------
# Currently STOPPED on the test FW (one-off via raw API earlier this session
# to unblock Kea v6 socket bind). This block re-introduces it under proper
# lib-opnsense managers (epic #65) but keeps enabled: false until we cut
# over from Kea on a deliberate change-window. See PR comment for the
# cutover playbook.
opn_dnsmasq:
  enabled: false              # flip to true after cutover review
  settings:
    enable: '0'               # service master switch — flip with cutover
    port: '53053'             # leave 53 to Unbound
    dns_port: '53053'
    strictbind: '1'            # CRITICAL: bind only to listed interfaces
    interface: [lan]           # OOB only until cutover
    dhcp: []
  hosts: []
  ranges: []
  domains: []
  options: []
  boots: []
  tags: []
  # service_state: stopped     # uncomment to enforce stopped (current state)

# ---------------------------------------------------------------------------
# radvd — IPv6 Router Advertisements per zone
# ---------------------------------------------------------------------------
# Required for dynamic IPv6 clients to learn the FW as default gateway and
# get a SLAAC prefix. Kea v6 does NOT emit RAs (per
# docs.opnsense.org/manual/kea.html), so this fills the gap.
#
# All entries are enabled: '0' until validated — the radvd daemon will not
# broadcast for disabled entries. Flip per-zone when ready.
opn_radvd:
  enabled: true               # cutover step 1: enable radvd entries (Kea v6 does NOT emit RAs)
  service_state: running      # start the radvd daemon after ensuring entries
  # Base6Interface: empty for static prefix on this interface (stateless mode).
  # Only set Base6Interface to a different slot when tracking a prefix delegated
  # from upstream (e.g. WAN); OPNsense rejects Base6Interface == interface.
  entries:
    - {interface: mgmt,    Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: dmz,     Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: svc,     Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: vpn,     Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: iot,     Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: voip,    Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: storage, Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: media,   Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: gaming,  Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: cctv,    Base6Interface: '', mode: unmanaged, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
  # service_state: stopped     # uncomment to start the daemon

# ---------------------------------------------------------------------------
# dnscrypt-proxy — encrypted upstream for the DNS chain
# ---------------------------------------------------------------------------
# Recipe: https://forums.serverbuilds.net/t/guide-adguard-home-unbound-dnscrypt-under-opnsense-part-2/13271
# Chain (target):  clients → AdGuard:53 → Unbound:53530 → dnscrypt-proxy:53531 → upstream (DoH/DoQ/DNSCrypt)
# Phase 1 (this PR): only Unbound:53 → dnscrypt-proxy:53531. AdGuard LXC is Phase 2.
#
# LIB GAP: No DnscryptProxyManager exists yet — see lib-opnsense#NN (to be filed
# alongside this PR). Until that lands, settings are applied via the one-off
# scripts/fw_chain_phase1_apply.py which POSTs to /api/dnscryptproxy/general/set
# and /api/dnscryptproxy/service/reconfigure directly. This catalog section is
# the **target shape** for the future manager — when it exists, fw_apply_direct.py
# dispatches this block and the one-off script can be deleted.
opn_dnscrypt_proxy:
  enabled: true
  service_state: running
  general:
    enabled: '1'
    listen_addresses:                        # loopback only (Unbound forwards here)
      - '127.0.0.1:53531'
      - '[::1]:53531'
    ipv4_servers: '1'
    ipv6_servers: '1'                        # was '0' default; we want dual-stack
    dnscrypt_servers: '1'
    doh_servers: '1'
    odoh_servers: '0'                        # ODoH adds latency; off until we need it
    require_dnssec: '1'                      # compliance: only DNSSEC-validating resolvers
    require_nolog: '1'
    require_nofilter: '0'                    # allow Quad9-with-filter (malware blocking)
    force_tcp: '0'
    cache: '1'                               # local resolver cache (separate from Unbound)
    cache_size: '4096'
    cache_min_ttl: '600'
    cache_max_ttl: '86400'
    cache_neg_min_ttl: '60'
    cache_neg_max_ttl: '600'
    fallback_resolver: '9.9.9.9:53'          # only used to bootstrap cert fetch
    timeout: '2500'
    keepalive: '30'
    cert_refresh_delay: '240'
    query_logs: '1'                          # NIS2/ISO27001 audit
    block_ipv6: '0'
  # Server names from the public-resolvers list (Cloudflare + Quad9 only — matches
  # the DoT entries we removed in Phase 1; Quad9 picks include both DoH and DNSCrypt
  # variants, filter-pri = malware blocking, primary).
  serverlist:
    - cloudflare
    - cloudflare-ipv6
    - quad9-doh-ip4-port443-filter-pri
    - quad9-doh-ip6-port443-filter-pri
    - quad9-dnscrypt-ip4-filter-pri
    - quad9-dnscrypt-ip6-filter-pri
  ref:
    adr: "infra/0004#dns-chain"
    lib_manager: "DnscryptProxyManager (TODO — lib-opnsense#NN)"
    ansible_module: "opn_dnscrypt_proxy_settings"

# ── WAN2 — Telenet (restored; lost in minimal-seed reseed; tracked in #32) ─────
