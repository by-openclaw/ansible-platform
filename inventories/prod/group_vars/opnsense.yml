# ---------------------------------------------------------------------------
# DNS enforcement — force all clients through FW Unbound (which DoT-forwards
# to Cloudflare + Quad9). Block any direct DNS (53) or DoT (853) leak from
# internal VLANs to non-FW destinations.
#
# Implementation: 4 floating-style rules (CSV interface list of all 10 zones)
# with `destination_not: '1'` so they fire when dst is NOT the FW gateway.
# `quick: 1` ensures these block-first matches stop further evaluation.
# disabled-by-default per `feedback_disabled_rules_for_testing` — flip via
# `firewall/filter/toggleRule/{uuid}` per zone (or all at once) after dry-run.
# ---------------------------------------------------------------------------
- description: 'BLOCK internal→non-FW port 53 (force plain DNS through Unbound) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host4_fw_gateways
  destination_not: '1'
  destination_port: port_dns
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 53 (force plain DNS through Unbound) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host6_fw_gateways
  destination_not: '1'
  destination_port: port_dns
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 853 (force DoT through Unbound) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host4_fw_gateways
  destination_not: '1'
  destination_port: port_dot
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 853 (force DoT through Unbound) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host6_fw_gateways
  destination_not: '1'
  destination_port: port_dot
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
# ---------------------------------------------------------------------------
# ADR-compliant replacement for the live "BLOCK: VLAN clients -> public DoH/DoT"
# drift rule (was test_internal_nets -> public_doh_doT_dns). Now group-based
# (grp_net_internal), alias-only, v4/v6 split, description per naming/0003 §4.
# The old "Allow Rune (OOB) -> AdGuard WebUI" drift rule is intentionally NOT
# re-encoded: admin access to AdGuard is already covered by the MGMT->SVC zone
# rule (naming/0003 §6 — zone rules, never per-person).
# ---------------------------------------------------------------------------
- description: 'BLOCK internal→public DoH resolvers (force local chain) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host_public_resolvers
  destination_port: port_https
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→public DoH resolvers (force local chain) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host_public_resolvers
  destination_port: port_https
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
# ---------------------------------------------------------------------------
# NTP enforcement (roadmap #3) — force every VLAN to the FW's own chrony.
# Mirrors the DNS non-FW blocks above: quick-block any internal client trying
# to reach NTP (123) on anything other than the FW gateways. Clients reach the
# FW chrony via the per-VLAN "PASS <vlan>→FW any" rules and learn it via DHCP
# option 42 (ntp_servers). Hardcoded external NTP is dropped, no bypass.
# ---------------------------------------------------------------------------
- description: 'BLOCK internal→non-FW port 123 (force chrony) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host4_fw_gateways
  destination_not: '1'
  destination_port: port_ntp
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#ntp-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 123 (force chrony) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host6_fw_gateways
  destination_not: '1'
  destination_port: port_ntp
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#ntp-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- {description: 'PASS Telenet WAN → Traefik web (v4)', action: pass, interface: opt13, direction: in, ipprotocol: inet,  protocol: TCP, source_net: any, destination_net: host4_traefik, destination_port: port_web, quick: '1', enabled: '1', state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}}
- {description: 'PASS Telenet WAN → Traefik web (v6)', action: pass, interface: opt13, direction: in, ipprotocol: inet6, protocol: TCP, source_net: any, destination_net: host6_traefik, destination_port: port_web, quick: '1', enabled: '1', state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}}
