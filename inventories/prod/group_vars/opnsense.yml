# ------------------------------------------------------------------------------
# DECIDED AGAINST (2026-08-20): public mail CLIENT ports on mailcow.
#
# port_smtps(465) / port_submission(587) / port_imaps(993) / port_pop3s(995) /
# port_mail_client, the two "Telenet WAN → mailcow client ports" filter rules and
# the eight matching DNAT entries were declared here but NEVER existed on the
# firewall — the catalog claimed an exposure the FW did not have.
#
# They are removed rather than left as dead declarations, because config-as-code
# that describes ports which are not open is worse than no declaration at all
# (NIS2: the record must match what is enforced). Full definitions remain in git
# history if this is ever revisited.
#
# Rationale: mailcow is reached over HTTPS through Traefik (mail.{{ platform_domain }})
# and receives mail on port 25; neither needs these. Opening 587/465 in
# particular means authenticated relay — a single cracked mailbox turns the
# server into a spam relay and gets the sending IP blacklisted. Today nothing
# would catch that early: the OPNsense CrowdSec bouncer has never pulled, and
# the agent on mailcow has no mail log source (postfix/dovecot log inside Docker,
# not to /var/log/mail.log), so its postfix collection is inert. Mail auth is
# guarded only by mailcow's own netfilter container.
#
# If native mail clients are ever needed, prefer widening the VPN routes to
# mailcow over re-exposing these ports to the internet.
#
# RESOLVED 2026-08-23: the catalog 'PASS Telenet WAN → mailcow SMTP/MX' (+ its
# DNAT) is now the single source of truth. The old manual stopgaps — a port-25
# PASS rule (seq 10) and a target=IP :25 DNAT — were deleted from vm-opns-01 after
# the catalog rules were applied, so there is no longer an overlapping port-25
# rule. Live WAN NAT/filter == this catalog (audited: no leaks/strays).
# ------------------------------------------------------------------------------
# Neutral firewall public WAN IP aliases (the Telenet /29 endpoint) — service-agnostic,
# shared by any WAN ingress port-forward (NetBird, etc.). NOT named after Traefik.
- {name: host4_wan_pub, type: host, content: ['213.214.47.222'], description: 'Firewall public WAN IPv4 (Telenet /29) - shared ingress', state: present, ref: {adr: 'naming/0003#§2-host-aliases', lib_manager: FwAliasManager, ansible_module: by_systems.opnsense.opnsense_fw_alias}}
- {name: host6_wan_pub, type: host, content: ['2a02:1802:21::5'], description: 'Firewall public WAN IPv6 GUA (Telenet) - shared ingress', state: present, ref: {adr: 'naming/0003#§2-host-aliases-v6', lib_manager: FwAliasManager, ansible_module: by_systems.opnsense.opnsense_fw_alias}}
