  - {hostname: drawio, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # JumpServer CE bastion/PAM (lxc-jumpserver-01) — backend host + service name →
  # Traefik (internal split-horizon, VPN-only). Browser SSH/RDP to infra; the web
  # front (:8090→80) is the only proxied port.
  - {hostname: lxc-jumpserver-01, domain: "{{ platform_domain }}", rr: A,    server: 10.1.3.221}
  - {hostname: lxc-jumpserver-01, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:3::221'}
  - {hostname: jumpserver, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: jumpserver, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # Internal SMTP submission target for fabric services (GitLab etc.): mailcow
  # DIRECT (not mail.{{ platform_domain }}, which points to the public WAN IP for external
  # clients). *.{{ platform_domain }} cert covers this name → STARTTLS verifies.
  - {hostname: vm-mailcow-01, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.120}
  - {hostname: vm-mailcow-01, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::120'}
  # GitLab Pages: apex (pages root) + wildcard (every <project>.pages…) → Traefik
  # (holds the *.pages wildcard cert + routes to the Pages backend). VPN-only.
  - {hostname: pages, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: pages, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  - {hostname: '*', domain: "pages.{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: '*', domain: "pages.{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # Harbor OCI registry — host A/AAAA + service name → Traefik (published via Traefik).
  - {hostname: harbor, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: harbor, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # npm registry (Verdaccio) — SVC consumers (gitlab-runner, CI) resolve it internally via Traefik.
  - {hostname: npm, domain: "{{ platform_domain }}", rr: A,    server: 10.1.2.110}
  - {hostname: npm, domain: "{{ platform_domain }}", rr: AAAA, server: 'fd01:2::110'}
  # (20 stale probe-fleet overrides pruned 2026-06-06 — never-built hosts.)
  # Query Forwarding — chain step: Unbound → dnscrypt-proxy on loopback.
  # Empty domain = catch-all → Unbound creates a `forward-zone "."` from these entries.
  #
  # CRITICAL: keep `unbound.forwarding.enabled=0`. Counter-intuitive but verified on
  # vm-opns-01 2026-05-25: with `enabled=1` OPNsense generates a forward-zone
  # that points at `<system><dnsserver>` (10.6.224.1 plain) and IGNORES these
  # entries — caught via `dumpInfra` showing 10.6.224.1@53 not 127.0.0.1@53531.
  # See memory: lib-opnsense/reference_unbound_forwarding_toggle.
  # The serverbuilds.net recipe's "enable Query Forwarding" is misleading for OPNsense.
  forwarders:
    - {domain: '', server: '127.0.0.1', port: '53531', type: forward, enabled: '1',
       description: 'Unbound → dnscrypt-proxy loopback v4',
       ref: {adr: "infra/0004", lib_manager: "UbForwardManager", ansible_module: "opn_ub_forward"}}
    - {domain: '', server: '::1',       port: '53531', type: forward, enabled: '1',
       description: 'Unbound → dnscrypt-proxy loopback v6',
       ref: {adr: "infra/0004", lib_manager: "UbForwardManager", ansible_module: "opn_ub_forward"}}

# ---------------------------------------------------------------------------
# Kea DHCP4 — service + per-VLAN subnets
# ---------------------------------------------------------------------------
# Pool .50–.99 per zone. LXCs are static at .100 → no clash.
# fwrules='0' — we manage all firewall rules in opn_filter_rules.
opn_kea_dhcp4:
  enabled: true
  general:
    enabled: '1'
    fwrules: '0'
    valid_lifetime: '4000'
    interfaces:        # friendly names → slots via opn_interface_map
      - mgmt
      - dmz
      - svc
      - vpn
      - iot
      - voip
      - storage
      - media
      - gaming
      - cctv
  # NOTE: each subnet declares ntp_servers (DHCP option 42 = its FW gateway) so
  # clients discover the FW chrony (roadmap #3). The FW filter blocks external
  # NTP regardless. ntp_servers is currently a no-op on UPDATE of existing
  # subnets — lib-opnsense ensure() does not yet diff nested option_data
  # (tracked: lib-opnsense#85). Kept here as declared desired-state; it applies
  # automatically once #85 lands (or on subnet (re)create).
  subnets:
    - subnet: 10.1.1.0/24
      pools: 10.1.1.50-10.1.1.99
      description: mgmt DHCPv4 pool
      option_data:
        routers: 10.1.1.1
        domain_name_servers: 10.1.1.1
        ntp_servers: 10.1.1.1
        domain_name: "{{ platform_domain }}"
      ref: {adr: "infra/0004", lib_manager: "Kea4SubnetManager", ansible_module: "opn_kea4_subnet"}
    - subnet: 10.1.2.0/24
      pools: 10.1.2.50-10.1.2.99
      description: dmz DHCPv4 pool
      option_data:
        routers: 10.1.2.1
        domain_name_servers: 10.1.2.1
        ntp_servers: 10.1.2.1
        domain_name: "{{ platform_domain }}"
      ref: {adr: "infra/0004", lib_manager: "Kea4SubnetManager", ansible_module: "opn_kea4_subnet"}
    - subnet: 10.1.3.0/24
      pools: 10.1.3.50-10.1.3.99
      description: svc DHCPv4 pool
      option_data:
        routers: 10.1.3.1
        domain_name_servers: 10.1.3.1
        ntp_servers: 10.1.3.1
        domain_name: "{{ platform_domain }}"
      ref: {adr: "infra/0004", lib_manager: "Kea4SubnetManager", ansible_module: "opn_kea4_subnet"}
    - subnet: 10.1.4.0/24
      pools: 10.1.4.50-10.1.4.99
      description: vpn DHCPv4 pool
      option_data:
        routers: 10.1.4.1
        domain_name_servers: 10.1.4.1
        ntp_servers: 10.1.4.1
        domain_name: "{{ platform_domain }}"
      ref: {adr: "infra/0004", lib_manager: "Kea4SubnetManager", ansible_module: "opn_kea4_subnet"}
    - subnet: 10.1.10.0/24
