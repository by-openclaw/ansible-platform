# NetBird STUN ingress (3478/udp) → netbird-server. Telenet uses the static /29 IP
# aliases; Proximus (WAN1, DYNAMIC IP) uses `opt12ip` = the live interface address.
- {descr: 'DNAT Telenet→NetBird STUN (v4)',  interface: opt13, protocol: UDP, ipprotocol: inet,  destination: {network: host4_wan_pub, port: port_stun}, target: host4_netbird, local-port: port_stun, state: present, ref: {adr: 'services/0007#ingress', lib_manager: FwDnatManager, ansible_module: by_systems.opnsense.opnsense_fw_dnat}}
