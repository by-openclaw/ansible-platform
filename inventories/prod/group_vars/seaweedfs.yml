---
# SeaweedFS's data volume on a ZFS dataset of the node, bind-mounted into the guest — it survives the
# guest's destroy/rebuild. Applied by the node play of playbooks/seaweedfs.yml
# (roles/pve_zfs_mount); the guest's VMID is read from the node, the idmap owner
# defaults to the unprivileged root (100000).
seaweedfs_zfs_mounts:
  - dataset: "tank/data/seaweedfs"
    quota: "500G"
    mp_index: 0
    mount_path: "/data"
