---
# AdGuard Home retention — a policy of this deployment, not of the role (the
# template used to carry both values as literals).
#
# The query log's ARCHIVE is Loki (shipped line by line below, audit class = 90 d, stored in
# the S3 bucket behind Loki): the file on the resolver is a short working copy. It was the only
# copy. Measured rates: ~55 MB/day (2026-09-28), ~320 MB/day (2026-10-11, 11.8 GB on the 20 GB
# disk), ~900 MB/day (2026-10-27: current file 5.2 GB + rotated 8.6 GB = disk FULL, Docker could
# not start after the 2026-10-24 reboot, the resolver was down and with it every FQDN on the
# platform for three days). AdGuard keeps the current file + one rotated: 24 h ≈ 2 × ~1 GB.
adguard_querylog_retention: "24h"      # 1 d on the resolver — maps to querylog.interval
adguard_statistics_retention: "24h"    # dashboard statistics — maps to statistics.interval

# Ship the query log to Loki (one JSON object per line; job adguard_querylog). Stats and
# searches span 90 d there, not on this disk.
promtail_extra_file_jobs:
  - {name: adguard_querylog, path: /opt/AdGuardHome/data/querylog.json, audit: true}
# AdGuard's data dir is root-only (0700): promtail traverses it through an ACL. The query log
# itself AdGuard creates 0600, which masks the inherited ACL entry to nothing (2026-10-27: Loki
# had never received a line) — the shipper reads it through CAP_DAC_READ_SEARCH instead.
promtail_acl_dirs: ["/opt/AdGuardHome/data"]
promtail_dac_read_search: true

# ------------------------------------------------------------------------------
# One address for two instances (ADR infra/0011): keepalived owns the virtual address on the
# instance with the highest priority whose own AdGuard answers; the first host of the group is
# the preferred owner and takes the address back when it is healthy again (keepalived.conf(5):
# preemption is the default). Advertisements go to the peers directly (unicast_peer), one
# instance per address family (native_ipv6). The health check is dig against the local
# AdGuard: exit 0 = an answer (even NXDOMAIN), 9 = no server — the priority then drops below
# the peer's and the address moves.
# ------------------------------------------------------------------------------
keepalived_scripts:
  - name: resolver_answers
    command: "/usr/bin/dig +time=1 +tries=1 +short @127.0.0.1 {{ groups['adguard'] | first }}.{{ platform_domain }} A"
    # keepalived's default interval (1 s): measured 2026-10-28 with interval 2, an instance that
    # stops answering kept the address ~6 s (fall 2 x 2 s + advertisement) and one lookup through
    # it failed; with 1 s the window is ~3 s. rise 2 keeps a flapping instance from taking it back.
    interval: 1
    timeout: 2
    fall: 2
    rise: 2
    weight: -60
keepalived_instances:
  - name: resolver_v4
    family: 4
    interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    virtual_router_id: 53
    priority: "{{ 150 if inventory_hostname == (groups['adguard'] | first) else 100 }}"
    unicast_src: "{{ ansible_host }}"
    unicast_peers: "{{ groups['adguard'] | difference([inventory_hostname]) | map('extract', hostvars, 'ansible_host') | list }}"
    virtual_ips: ["{{ platform_resolver_vip4 }}/{{ platform_zones.svc.cidr4 | ansible.utils.ipaddr('prefix') }}"]
    track_script: resolver_answers
  - name: resolver_v6
    family: 6
    interface: "{{ ansible_facts['default_ipv4']['interface'] | default('eth0') }}"
    virtual_router_id: 54
    priority: "{{ 150 if inventory_hostname == (groups['adguard'] | first) else 100 }}"
    unicast_src: "{{ platform_host_v6 }}"
    unicast_peers: "{{ groups['adguard'] | difference([inventory_hostname]) | map('extract', hostvars, 'platform_host_v6') | list }}"
    virtual_ips: ["{{ platform_resolver_vip6 }}/{{ platform_zones.svc.cidr6 | ansible.utils.ipaddr('prefix') }}"]
    track_script: resolver_answers
