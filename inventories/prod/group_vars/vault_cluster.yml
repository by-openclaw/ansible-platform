---
# Every member of the Vault cluster (NON-secret — secrets never live in inventory).
# SEC-07: promtail ships Vault's file audit device (bind-mount by roles/vault). The entries are
# written by the ACTIVE member, whichever it is: the three are shipped. Until 2026-10-11 this
# was set for the first member only, and nothing reached the log store while another one was
# active (38 hours when it was found).
promtail_vault_audit_log: "/var/log/vault/audit.log"
