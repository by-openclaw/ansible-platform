---
# The relay is not a client of itself. Every other host runs postfix as a satellite
# pointing at this one; this host runs mailcow's own postfix in containers (two
# listeners on :25 already) and has no host postfix at all. Installing one here
# would be a second MTA on the mail system's own machine.
#
# A group_var, not a host_var: "the mailcow group is not a mail satellite" is a
# property of the role the group plays, not an exception for one machine.
hardening_email_relay_enabled: false

# mailcow requires Docker CE >= 24; roles/docker installs the engine this says.
docker_engine: ce

# The stack is live in production: every run converges it (compose up is
# idempotent — unchanged containers are left alone).
mailcow_deploy_stack: true

# No host postfix here (see above), so no /usr/sbin/sendmail: the failure notifier
# (roles/systemd_failure_alert — lego-renew-mailcow, …) submits over SMTP to mailcow's
# own postfix on 127.0.0.1:25 with s-nail (installed by the hardening baseline).
systemd_failure_alert_submit: "/usr/bin/s-nail -Sv15-compat -Smta=smtp://127.0.0.1:25 -Ssmtp-auth=none -t"

# CrowdSec agent on the mail host: postfix + dovecot collections over the containers' stdout
# (mailcow's services log to Docker, never to /var/log/mail.log).
crowdsec_agent_extra_collections:
  - crowdsecurity/postfix
  - crowdsecurity/dovecot
crowdsec_agent_docker_sources:
  - {name: mailcow, containers: [mailcowdockerized-postfix-mailcow-1, mailcowdockerized-dovecot-mailcow-1], type: syslog}
