---
# The relay is not a client of itself. Every other host runs postfix as a satellite
# pointing at this one; this host runs mailcow's own postfix in containers (two
# listeners on :25 already) and has no host postfix at all. Installing one here
# would be a second MTA on the mail system's own machine.
#
# A group_var, not a host_var: "the mailcow group is not a mail satellite" is a
# property of the role the group plays, not an exception for one machine.
hardening_email_relay_enabled: false
