---
# GitLab's git-data on a ZFS dataset of the node, bind-mounted into the guest — it survives the
# guest's destroy/rebuild. Applied by the node play of playbooks/gitlab.yml
# (roles/pve_zfs_mount); the guest's VMID is read from the node, the idmap owner
# defaults to the unprivileged root (100000).
gitlab_zfs_mounts:
  - dataset: "tank/data/gitlab"
    quota: "100G"
    mp_index: 0
    mount_path: "/var/opt/gitlab/git-data"
