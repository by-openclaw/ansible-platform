---
# PROD inventory — vm-opns-01 FW on node srv-proxmox-poc-01.
# Addresses align to ADR infra/0004 §3 (prod VLAN assignment, 10.1.x / fd01:).

all:
  children:

    proxmox_nodes:
      hosts:
        srv-proxmox-poc-01:
          ansible_host: 10.6.224.105
          ansible_port: 22222
          # identity/0004 cutover DONE: svc-ansible via rune ssh-agent
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true

    opnsense:
      hosts:
        vm-opns-01:
          # OOB mgmt IP — Rune (10.6.239.103) reaches it directly on the OOB subnet.
          # SSH user/key match what the seed configures: by-rune + id_ed25519_opnsense.
          # by-rune is in wheel; /conf/config.xml is root-only, so become root via su.
          ansible_host: 10.6.239.196
          # Config goes through the OPNsense API (key/secret), which runs as root
          # internally — no root SSH (root is blocked by design). connection=local:
          # modules run on the controller and call the FW API directly.
          ansible_connection: local
          ansible_python_interpreter: /usr/bin/python3
          ansible_become: false
          # OPNsense MVC API endpoint (lib-opnsense / opnsense collection)
          opn_host: "10.6.239.196"
          opn_port: 443
          opn_verify_ssl: false

    adguard:
      hosts:
        vm-adguard-01:
          # PROD AdGuard Home on the SVC VLAN (10.1.3.0/24).
          # The controller has no direct route to SVC, so reach it through the
          # prod FW via ProxyJump ({{ platform_jump_user }}). This REQUIRES the FW to
          # permit OOB -> SVC forwarding (rune-routing) — see role README.
          ansible_host: 10.1.3.101
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          # Reach SVC via the prod FW: ProxyCommand jump as by-rune (FW key).
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    mailcow:
      hosts:
        vm-mailcow-01:
          # PROD mailcow mail server on the DMZ VLAN (10.1.2.0/24). Reached through
          # the prod FW via ProxyJump ({{ platform_jump_user }}), same as AdGuard.
          # VM (debian-12-cloud) login user = by-systems (cloud-init ci_user),
          # NOT root like the LXCs; passwordless sudo for become.
          ansible_host: 10.1.2.120
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    pbs:
      hosts:
        vm-pbs-01:
          # PROD Proxmox Backup Server 4 on the SVC VLAN (10.1.3.0/24). Reached
          # through the prod FW via ProxyJump ({{ platform_jump_user }}), same as
          # AdGuard/mailcow. VM (debian-13-cloud) login user = by-systems
          # (cloud-init ci_user); passwordless sudo for become.
          ansible_host: 10.1.3.222
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    # Proxmox VE hypervisor node — direct root SSH on the OOB plane (:22222).
    # Used to wire PBS as a PVE storage + the 2nd backup job (PBS lives ON this node).
    pve_nodes:
      hosts:
        srv-proxmox-poc-01:
          ansible_host: 10.6.224.105
          ansible_port: 22222
          # identity/0004 cutover DONE: svc-ansible via rune ssh-agent (root key-only
          # from OOB/MGMT carve-out remains for terraform + future cluster peers)
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          # PVE: root stays KEY-ONLY from OOB+MGMT (cluster join/migration are
          # hardcoded to root per official docs); no everywhere else.
          sshd_hardening_root_allowed_from: ["10.6.224.0/20", "10.6.240.0/20"]
          env: prod

    # Cluster services (DMZ/SVC) — all reached via OPNsense ProxyJump.
    cluster:
      children:
        traefik:
        postgresql:
        redis:
        pgadmin:
        warden:
        authentik:
        vault:
        netbox:
        vaultwarden:
        nextcloud:
        netbird:
        crowdsec:
        gitlab:
        diagrams:
        jumpserver:
        pbs:
        monitoring:

    monitoring:
      hosts:
        lxc-monitoring-01:
          # PROD Prometheus + Loki + Grafana on the SVC VLAN (10.1.3.0/24).
          ansible_host: 10.1.3.230
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    # Boot-time platform orchestrator (vault unseal + cold-start verify).
    warden:
      hosts:
        lxc-warden-01:
          ansible_host: 10.1.3.250
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod
        harbor:

    # Central CrowdSec LAPI/engine (Decision A, services/0006). Agents on every
    # other host ship events here; the OPNsense firewall bouncer enforces.
    crowdsec:
      hosts:
        lxc-crowdsec-01:
          ansible_host: 10.1.3.190
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    # Harbor OCI registry (SVC). Docker-in-LXC; reached via the FW ProxyJump.
    harbor:
      hosts:
        lxc-harbor-01:
          ansible_host: 10.1.3.240
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_ed25519_rune_nopass
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    traefik:
      hosts:
        lxc-traefik-01:
          # PROD Traefik ingress on the DMZ VLAN (10.1.2.0/24). Reached through
          # the prod FW via ProxyJump ({{ platform_jump_user }}), same as AdGuard.
          # LXC login user = root (debian-13-standard; BPG writes keys to
          # /root/.ssh/authorized_keys), unlike the AdGuard VM (by-systems).
          ansible_host: 10.1.2.110
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    postgresql:
      hosts:
        lxc-pgsql-01:
          ansible_host: 10.1.3.110
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    redis:
      hosts:
        lxc-redis-01:
          ansible_host: 10.1.3.117
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    # S3 object storage (services/0009)
    seaweedfs:
      hosts:
        lxc-seaweedfs-01:
          ansible_host: 10.1.3.200
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    pgadmin:
      hosts:
        lxc-pgadmin-01:
          ansible_host: 10.1.3.140
          # identity/0004 cutover DONE (canary): svc-ansible + 22222, root disabled
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          # key via the rune ssh-agent (playbooks/ssh-agent.yml — Vault-held passphrase)
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    authentik:
      hosts:
        lxc-authentik-01:
          ansible_host: 10.1.3.130
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    vault:
      hosts:
        lxc-vault-01:
          ansible_host: 10.1.3.150
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    netbox:
      hosts:
        lxc-nbox-01:
          ansible_host: 10.1.3.120
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    vaultwarden:
      hosts:
        lxc-vaultwarden-01:
          ansible_host: 10.1.3.160
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    nextcloud:
      hosts:
        lxc-nextcloud-01:
          ansible_host: 10.1.3.170
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    # Patch waves — blast-radius ordering for playbooks/updates.yml. Waves run
    # in sequence and the play stops at the first host that loses a service, so
    # a bad package can never march through the whole fleet. Wave 4 holds the
    # dependencies everything else needs (DB, IdP, secrets) and goes LAST.
    patch_canary:
      hosts:
        lxc-pgadmin-01:   # nothing depends on pgadmin — safe to break first
    patch_wave2:          # leaf services: user-facing, no internal dependents
      children:
        vaultwarden:
        nextcloud:
        netbox:
        crowdsec:
    patch_wave3:          # network/edge: dependents exist but recover on restart
      children:
        redis:
        netbird:
        traefik:
        adguard:
    patch_wave4:          # core: everything above depends on these
      children:
        postgresql:
        authentik:
        vault:
        mailcow:

    netbird:
      hosts:
        lxc-netbird-01:
          ansible_host: 10.1.3.181
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    gitlab_runner:
      hosts:
        vm-gitlab-runner-01:
          # CI runner VM (Linux + Docker + Kaniko) on the SVC VLAN. VM (debian-12-cloud,
          # login user = by-systems like mailcow/adguard, NOT root). Reached through the
          # prod FW via ProxyJump ({{ platform_jump_user }}).
          ansible_host: 10.1.3.211
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    diagrams:
      hosts:
        lxc-diagrams-01:
          # Shared Kroki + drawio diagram services (SVC VLAN). Docker-in-LXC,
          # reached through the prod FW via ProxyJump ({{ platform_jump_user }}), root.
          ansible_host: 10.1.3.220
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    jumpserver:
      hosts:
        lxc-jumpserver-01:
          # JumpServer CE bastion/PAM (SVC VLAN). Docker-in-LXC, reached through the
          # prod FW via ProxyJump ({{ platform_jump_user }}), root.
          ansible_host: 10.1.3.221
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod

    gitlab:
      hosts:
        lxc-gitlab-01:
          # PROD GitLab CE (Omnibus) on the SVC VLAN (10.1.3.0/24). Reached through
          # the prod FW via ProxyJump ({{ platform_jump_user }}), login=root, same as
          # the other cluster LXCs. Git repos on the ZFS bind-mount at
          # /var/opt/gitlab/git-data; assets on SeaweedFS; DB on lxc-pgsql-01.
          ansible_host: 10.1.3.210
          # identity/0004 cutover DONE: svc-ansible + 22222, key via rune ssh-agent
          ansible_port: 22222
          ansible_user: "svc-ansible-{{ platform_env | default('prod') }}"
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          env: prod
