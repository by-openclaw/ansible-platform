---
# br-pmox-03 — the fresh standalone node (dev tier). Same shape as the first node where the
# reason is the platform's, its own values where the hardware differs.

# A hypervisor's host firewall is the Proxmox firewall, not ufw (it is enabled by roles/pve_host
# in a later pass — never before the allow rules for the OOB path are proven on this node).
hardening_ufw_enabled: false

# No boot order yet: this node carries no platform guest. The group list describes the first
# node's guests and must not be converged here.
pve_host_boot_order: []

# This chassis' Smart Array tooling is confirmed on the first node only; probed before use here.
pve_host_smartarray_cli: false

# This node's OOB bridge kept its factory name (the first node's is vmbrOOB); the static route
# to the guest zones rides it — without that route the node cannot even resolve names (the
# platform resolver lives behind the firewall; found 2026-10-13 when apt lost DNS mid-onboarding).
pve_host_oob_bridge: vmbr0

# HP Gen8: POST + kernel boot exceed the 300 s default (same class as the first node).
updates_reboot_timeout: 900

# identity: this node's own Vault tier for its PVE identities and tokens (dev/proxmox/tokens/*,
# never prod's docs), and no OIDC realm — the owner keeps pve.dev out of Authentik for now (2026-10-14)
pve_host_env: dev
pve_host_oidc_enabled: false

# this node's local storage keeps PVE 9's import type and gains snippets (Terraform user-data)
pve_host_local_storage_content: [backup, import, iso, snippets, vztmpl]

# the three WS2025 guests: vCPU pin to the host NUMA node their memory is bound to
# (Terraform environments/dev svc-windows.tf: numa0 hostnodes 0/1/2, policy=bind)
pve_host_guest_affinity:
  201: "0-5"
  202: "6-11"
  203: "12-17"

# backup: the PBS copy only — no NAS storage on the dev tier (the signal lists pbs alone)
pve_host_nfs_backup_enabled: false
