---
# Host vars — vm-mailcow-01.

# --- Swap (roles/hardening) — the product's own requirement, not the OS table -------------------
# mailcow prerequisites: "Minimum 6 GiB + 1 GiB swap (default config)".
hardening_swapfile_mb: 1024

# --- Docker data root (roles/docker_data) — 3× the measured use, rounded to 4 GiB -----------
# 7.2 GB measured 2026-10-31; the mail store (vmail) is a Docker volume, so this holds the mail.
docker_data_size_gib: 48
