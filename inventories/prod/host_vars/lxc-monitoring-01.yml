---
# lxc-monitoring-01 — Loki/Prometheus/Grafana host.
# Syslog listener for the firewall (issue #12): OPNsense ships all logs over
# RFC5424/TCP to promtail here; only the FW's SVC addresses may connect.
promtail_syslog_listeners:
  - { name: opnsense, port: 1514, allow_from: ["10.1.3.1", "fd01:3::1"] }
# Log retention 90 days (GDPR Art.30 / ISO27001 A.8.16 — issue #12 minimum).
loki_retention: "2160h"
