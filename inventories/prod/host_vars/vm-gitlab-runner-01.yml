---
# Host vars — vm-gitlab-runner-01.

# --- Swap (roles/hardening) — the product's own requirement, not the OS table -------------------
# GitLab requirements: "Disable swap where possible. Swap can cause significant performance degradation under load."
hardening_swapfile_mb: 0

# --- Docker data root (roles/docker_data) — 3× the measured use, rounded to 4 GiB -----------
# 5.0 GB measured 2026-10-31 (layer cache; jobs are ephemeral).
docker_data_size_gib: 16
