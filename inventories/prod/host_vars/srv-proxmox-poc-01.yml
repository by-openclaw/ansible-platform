---
# TEMPORARY Lynis gate exception (set 2026-09-01): the PVE host sits at 77 —
# 11 Lynis vulnerable-package findings caused by the PARKED security updates
# (USER decision 2026-08-31: PVE update can wait; libzpool6linux pve-vs-debian
# question open). Restore the fleet gate of 80 as soon as the PVE patch run is
# approved and applied. Everything else on this host passes the baseline.
hardening_lynis_min_score: 75
# Install-time account of the node (no keys, no sudo, never used) — a foreign account like the cloud-init user
user_mgmt_purge_accounts:
  - "by-systems"
  - "admin"
# The Proxmox firewall (roles/pve_host) is the host firewall on nodes — ufw stays off here
hardening_ufw_enabled: false
# HP DL380p Gen8: POST + kernel boot exceed the 300 s default (2026-09-21: 333 s → the role reported a timeout although the reboot succeeded)
updates_reboot_timeout: 900
