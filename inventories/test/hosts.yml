---
# Test inventory — vm-opns-test-01 (.195) and 10 test LXCs (one per VLAN)
# All addresses align to ADR infra/0004 §4 (test VLAN assignment).

all:
  children:

    proxmox_nodes:
      hosts:
        srv-proxmox-poc-01:
          ansible_host: 10.6.224.105
          ansible_port: 22222
          ansible_user: by-systems
          ansible_become: true

    # The platform Vault is a single prod host serving both envs; the test-env
    # secrets live under secret/test/*. Pinned to the prod connection so the
    # opnsense_api_creds delegate (Vault read) resolves during test runs.
    vault:
      hosts:
        lxc-vault-01:
          ansible_host: 10.1.3.150
          ansible_port: 22222
          ansible_user: svc-ansible-prod
          ansible_become: true
          ansible_ssh_common_args: "{{ platform_jump_args }}"
          # lxc-vault-01 is a PROD host: become uses the PROD svc-ansible secret,
          # not the test one that group_vars would resolve via platform_env.
          ansible_become_password: >-
            {{ ((lookup('file', '~/.openclaw/workspace/infra/secrets/fabric/os-svc-ansible-prod.json', errors='ignore') or '{"fields":{}}') | from_json).fields.password | default(omit) }}
          env: prod

    opnsense:
      hosts:
        vm-opns-test-01:
          # OOB IP — reachable from MGMT until VLAN routing is up
          ansible_host: 10.6.239.195
          ansible_connection: local
          ansible_become: false        # connection:local API host — no sudo (ansible.cfg become=True is global)
          ansible_python_interpreter: /usr/bin/python3   # connection:local → modules run on the CONTROLLER
          # OPNsense MVC API endpoint used by lib-opnsense + by_systems.opnsense collection
          opn_host: "10.6.239.195"
          opn_port: 443
          opn_verify_ssl: false

    test_lxc:
      # One LXC per VLAN — VMID 1500..1509 (test/LXC range per infra/0004 §5)
      # Static IP = .100/24 (gateway = .1 = OPNsense)
      hosts:
        lxc-test-mgmt:
          vmid: 1500
          vlan_tag: 2010
          vlan_zone: mgmt
          ansible_host: 10.11.1.100
        lxc-test-dmz:
          vmid: 1501
          vlan_tag: 2020
          vlan_zone: dmz
          ansible_host: 10.11.2.100
        lxc-test-svc:
          vmid: 1502
          vlan_tag: 2030
          vlan_zone: svc
          ansible_host: 10.11.3.100
        lxc-test-vpn:
          vmid: 1503
          vlan_tag: 2040
          vlan_zone: vpn
          ansible_host: 10.11.4.100
        lxc-test-iot:
          vmid: 1504
          vlan_tag: 2100
          vlan_zone: iot
          ansible_host: 10.11.10.100
        lxc-test-voip:
          vmid: 1505
          vlan_tag: 2110
          vlan_zone: voip
          ansible_host: 10.11.11.100
        lxc-test-storage:
          vmid: 1506
          vlan_tag: 2200
          vlan_zone: storage
          ansible_host: 10.11.20.100
        lxc-test-media:
          vmid: 1507
          vlan_tag: 2300
          vlan_zone: media
          ansible_host: 10.11.30.100
        lxc-test-gaming:
          vmid: 1508
          vlan_tag: 2320
          vlan_zone: gaming
          ansible_host: 10.11.32.100
        lxc-test-cctv:
          vmid: 1509
          vlan_tag: 2400
          vlan_zone: cctv
          ansible_host: 10.11.40.100
