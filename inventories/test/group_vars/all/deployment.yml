---
# ==============================================================================
# Deployment manifest — the SINGLE source for org/domain/env (naming/0001 §9).
# Every role/playbook consumes these variables; the real domain is NEVER
# hardcoded anywhere else. Change the deployment => change ONLY this file.
# ==============================================================================
platform_org: "by-research"          # org short-name; also the break-glass account/group (naming/0002 §5.1)
platform_domain: "test.by-research.be"   # test zone = env subdomain of the org domain
platform_env: "test"

# Mail is a PROD service: there is one Mailcow (vm-mailcow-01.by-research.be) and one service mailbox per
# service (Vault secret/prod/mail/<svc>, roles/mailbox). Test-tier services send through it — the env is
# in the sender's subject/FQDN, never a second mailbox. Consumers: playbooks/opnsense.yml (Monit).
platform_mail_env: "prod"
platform_mail_domain: "by-research.be"
