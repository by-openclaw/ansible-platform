---
# ==============================================================================
# Deployment manifest — the SINGLE source for org/domain/env (naming/0001 §9).
# Every role/playbook consumes these variables; the real domain is NEVER
# hardcoded anywhere else. Change the deployment => change ONLY this file.
# ==============================================================================
platform_org: "by-research"          # org short-name; also the break-glass account/group (naming/0002 §5.1)
platform_domain: "test.by-research.be"   # test zone = env subdomain of the org domain
platform_env: "test"

# Mail is a PROD service: there is one Mailcow (vm-mailcow-01.by-research.be) and one service mailbox per
# service (Vault secret/prod/mail/<svc>, roles/mailbox). Test-tier services send through it — the env is
# in the sender's subject/FQDN, never a second mailbox. Consumers: playbooks/opnsense.yml (Monit).
platform_mail_env: "prod"
platform_mail_domain: "by-research.be"
# The alert mailbox is that prod mailbox too. Every role reads platform_alert_email (the ONE
# source); before it, only the Monit play used platform_mail_domain and every other consumer
# built alerts@<test zone> — a mailbox that does not exist.
platform_alert_email: "alerts@{{ platform_mail_domain }}"
# The Vault cluster (raft voters). Deploy plays read and write through the container of
# platform_vault_host: node 1 by default; a standby forwards to the active node, so
# `-e platform_vault_host=<another member>` keeps deploys working while node 1 is down.
platform_vault_members: "{{ groups['vault_cluster'] | default(groups['vault']) }}"
platform_vault_host: "{{ groups['vault'] | first }}"
platform_vault_addr: "https://{{ platform_vault_host }}.{{ platform_domain }}:8200"
# Same controller as prod: the Terraform repo and its state-backup Python.
platform_terraform_repo: "{{ lookup('env', 'HOME') }}/repos/infra-terraform-proxmox"
# The test tier runs on the prod node, so the node's credentials (the Terraform API
# token) are prod's — same token as its old terraform.tfvars held (verified 2026-09-28).
platform_proxmox_env: "prod"
platform_terraform_state_backup_python: "{{ lookup('env', 'HOME') }}/repos/lib-synology-dsm/.venv/bin/python"
# Same node as prod (srv-proxmox-poc-01), so the same NAS share and ops mailbox.
platform_ops_email: "tech-support@{{ platform_org_domain }}"
platform_nfs_backup_storage: "poc-backup"

# SSH baseline port (hardening/sshd roles + FW seed). Same as prod; was a role fallback.
platform_ssh_port: 22222
