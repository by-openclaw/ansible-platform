    - {interface: opt10, option6: '23', value: '[fd11:232::1]', description: 'gaming v6 DNS',  ref: {adr: 'infra/0004', lib_manager: 'DnsmasqOptionManager', ansible_module: 'opn_dnsmasq_option'}}
    - {interface: opt11, option6: '23', value: '[fd11:240::1]', description: 'cctv v6 DNS',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqOptionManager', ansible_module: 'opn_dnsmasq_option'}}
  hosts: []
  domains: []
  boots: []
  tags: []
  service_state: running        # bring Dnsmasq up after settings+ranges+options are in place

# ---------------------------------------------------------------------------
# radvd — IPv6 Router Advertisements per zone
# ---------------------------------------------------------------------------
# Required for dynamic IPv6 clients to learn the FW as default gateway and
# get a SLAAC prefix. Kea v6 does NOT emit RAs (per
# docs.opnsense.org/manual/kea.html), so this fills the gap.
#
# All entries are enabled: '0' until validated — the radvd daemon will not
# broadcast for disabled entries. Flip per-zone when ready.
opn_radvd:
  enabled: true               # cutover step 1: enable radvd entries (Kea v6 does NOT emit RAs)
  service_state: running      # start the radvd daemon after ensuring entries
  # Base6Interface: empty for static prefix on this interface (stateless mode).
  # Only set Base6Interface to a different slot when tracking a prefix delegated
  # from upstream (e.g. WAN); OPNsense rejects Base6Interface == interface.
  entries:
    - {interface: mgmt,    Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: dmz,     Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: svc,     Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: vpn,     Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: iot,     Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: voip,    Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: storage, Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: media,   Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: gaming,  Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
    - {interface: cctv,    Base6Interface: '', mode: stateless, enabled: '1', ref: {adr: "infra/0004", lib_manager: "RadvdEntryManager", ansible_module: "opn_radvd_entry"}}
