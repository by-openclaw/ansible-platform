# Credentials are FACTS published by roles/opnsense_api_creds (Vault secret/test/opnsense/api or the
# local fast-path file below) at the start of every FW play — never defined here (no duplicate source).
opn_host: 10.6.239.195
opn_port: 443
# --- Dynamic DNS (os-ddclient -> Cloudflare) — per env; see roles/opnsense/tasks/dyndns.yml ---
opnsense_dyndns_accounts: []   # no public zone for the test env — DynDNS is prod-only
# OPNsense version this FW is pinned to (firmware.yml waits for it after an update).
opnsense_firmware_upgrade: false   # apply pending updates (reboot) only when deliberately flipped for a window
opnsense_firmware_target: "26.7.3"   # proven by the 2026-09-07 window (26.7 nano → 26.7.3_11); plugins need it
opn_verify_ssl: false
opnsense_host: '{{ opn_host }}'
opnsense_port: '{{ opn_port }}'
opnsense_verify_ssl: '{{ opn_verify_ssl }}'
# Interface → OPNsense opt-slot map. MUST match the live FW assignment produced
# by recreate-and-seed.py + the complete-config seed (config.xml from the
# pre-reseed live state, addressing-rewritten to ADR). That layout is opt2–opt12
# for the 10 internal VLANs, opt1 for the LAN_TRUNK, lan for OOB_MGMT, wan for
# pppoe0. Verified live via /api/interfaces/overview/interfacesInfo on
# vm-opns-test-01 (vmid 199) on 2026-05-31.
#
# NOTE: the bare build-seed.py path (interfaces-only baseline.xml) produces
# opt4–opt13 instead because it numbers VLANs after lan/trunk/wan/wan2.
# If you ever reseed from that bare baseline, this map must be shifted -2.
opn_interface_map:
  mgmt: opt2
  dmz: opt3
  svc: opt4
  vpn: opt5
  iot: opt6
  voip: opt7
  storage: opt8
  media: opt9
  gaming: opt10
  cctv: opt11
  wan: opt13   # the seed assigns no 'wan' slot — the test FW's live uplink (Telenet); Proximus stays admin-down there
  lan: lan
# --- Static gateways + routes (catalog-owned, ADR services/0008: gateways are API-managed) ------
# The test FW reaches PROD-ONLY services through the prod FW's OOB address: Mailcow submission for
# Monit alerts (SVC-11 — one Mailcow, on prod; 587/465 are deliberately NOT public). One static
# gateway on the OOB slot + one /32 route here; the matching OOB→mailcow:587 PASS rule lives in
# the prod catalog (applied in the prod window, #307). Consumers: gateways.yml / routes.yml.
opn_gateways:
- name: OOB_FW_PROD
  interface: lan            # OOB slot on the seed (opn_interface_map.lan)
  gateway: 10.6.239.196     # prod FW OOB address
  ipprotocol: inet
  monitor_disable: true     # the prod FW OOB address is not an ICMP-monitored uplink
opn_routes:
- network: 10.1.2.120/32    # vm-mailcow-01 (prod DMZ)
  gateway: OOB_FW_PROD
  descr: 'prod mailcow (Monit SMTP submission) via prod FW OOB'

opn_ids:
  # ENABLED 2026-09-08 (ADR services/0006 §1 + services/0010 §1: Suricata alert-only on WAN as the
  # sensor feeding CrowdSec). Suricata 8.0.6 needs ~1.9 GiB RSS; on the 3 GiB nano it was OOM-killed
  # (#310). Sizing review per 0006 "resource budget is fixed at FW VM sizing time": the seed `vm`
  # block now carries 8192 MiB (infra-terraform-proxmox, applied with `recreate-and-seed.py --apply-hw`).
  enabled: true
  mode: alert
  interfaces:
  - wan
  rulesets:
    et_open: true
    abuse_ch_ssl: true
    pt_research: false
  home_net_alias: grp_net4_internal
  log_to_loki: true
  ref:
    adr: services/0006#§1-suricata-ids
opn_mdns:
  enabled: true
  interfaces:
  - mgmt
  - media
  - gaming
  ref:
    adr: infra/0004#§1-zone-taxonomy-mdns-exception
# --- ACME: the firewall's own TLS certificate (SEC-26/27/33) ------------------------------------
# Let's Encrypt via DNS-01 (Cloudflare scoped token from Vault prod/cloudflare/<zone>, read by the
# playbook's pre-play). Test FW = LE STAGING first (untrusted chain, no rate limits); flip to
# `environment: prod` once the chain is proven. Consumer: roles/opnsense/tasks/acme.yml.
# WebGUI binding = seed concern (pre-set refid; certRefId is read-only on the API) — #317.
opn_acme:
  enabled: true
  environment: stg              # LE staging on TEST; prod uses `prod`
  account: {name: letsencrypt-staging, ca: letsencrypt_test}
  validation: {name: cloudflare-dns, dns_sleep: "30"}
  action: {name: restart-webgui}
  certificates:
  - name: vm-opns-test-01.test.by-research.be
    key_length: key_ec256
    renew_interval: "30"
    description: 'WebGUI certificate (asset FQDN) — catalog'
  ref:
    adr: security/0004#certificate-strategy
    lib_manager: AcmeCertificateManager
    ansible_module: by_systems.opnsense.opnsense_acme_certificate

