# ---------------------------------------------------------------------------
# Kea DHCP4 — service + per-VLAN subnets
# ---------------------------------------------------------------------------
# Pool .50–.99 per zone. LXCs are static at .100 → no clash.
# fwrules='0' — we manage all firewall rules in opn_filter_rules.
opn_kea_dhcp4:
  enabled: true               # keep dispatching so Kea v4 gets disabled deterministically
  general:
    enabled: '0'              # cutover step 2: Kea v4 DISABLED, Dnsmasq takes over DHCPv4
    fwrules: '0'
    valid_lifetime: '4000'
    interfaces:        # friendly names → slots via opn_interface_map
      - mgmt
      - dmz
      - svc
      - vpn
      - iot
      - voip
      - storage
      - media
      - gaming
      - cctv
  subnets: []                # purged after cutover step 2 — Dnsmasq replaces Kea v4

# ---------------------------------------------------------------------------
# Kea DHCP6 — service + per-VLAN subnet declarations (SLAAC handles assignment)
# ---------------------------------------------------------------------------
# subnet+interface only. No stateful pool (LXCs static at ::100; SLAAC for the rest).
opn_kea_dhcp6:
  enabled: true               # keep dispatching so Kea v6 gets disabled deterministically
  general:
    enabled: '0'              # cutover step 2: Kea v6 DISABLED, radvd + SLAAC handle v6
    fwrules: '0'
    valid_lifetime: '4000'
    interfaces:
      - mgmt
      - dmz
      - svc
      - vpn
      - iot
      - voip
      - storage
      - media
      - gaming
      - cctv
  subnets: []                # purged after cutover step 2 — radvd + SLAAC handle v6

# ---------------------------------------------------------------------------
# Dnsmasq — OPNsense 26.1 default DNS/DHCP/RA daemon
# ---------------------------------------------------------------------------
# Currently STOPPED on the test FW (one-off via raw API earlier this session
# to unblock Kea v6 socket bind). This block re-introduces it under proper
# lib-opnsense managers (epic #65) but keeps enabled: false until we cut
# over from Kea on a deliberate change-window. See PR comment for the
# cutover playbook.
opn_dnsmasq:
  enabled: true                # cutover step 2: Dnsmasq replaces Kea as DHCPv4 provider
  settings:
    enable: '1'                # service master switch
    port: '53053'              # leave 53 to Unbound
    dns_port: '53053'
    strictbind: '1'            # CRITICAL: bind only to listed interfaces
    # Bind on the 10 test VLANs (slot ids, not friendly names — settings/set is not iface-mapped).
    # Do NOT include `lan` here; Unbound owns port 53 on LAN/OOB.
    interface: [opt2, opt3, opt4, opt5, opt6, opt7, opt8, opt9, opt10, opt11]
  # 10 DHCPv4 pools (mirror of Kea v4 .50-.99 per VLAN). interface uses slot ids.
  ranges:
    - {interface: opt2,  subnet_mask: '255.255.255.0', start_addr: '10.11.201.50', end_addr: '10.11.201.99', lease_time: '7200',    description: 'mgmt DHCPv4 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt3,  subnet_mask: '255.255.255.0', start_addr: '10.11.202.50', end_addr: '10.11.202.99', lease_time: '7200',     description: 'dmz DHCPv4 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt4,  subnet_mask: '255.255.255.0', start_addr: '10.11.203.50', end_addr: '10.11.203.99', lease_time: '7200',     description: 'svc DHCPv4 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt5,  subnet_mask: '255.255.255.0', start_addr: '10.11.204.50', end_addr: '10.11.204.99', lease_time: '7200',     description: 'vpn DHCPv4 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt6,  subnet_mask: '255.255.255.0', start_addr: '10.11.210.50', end_addr: '10.11.210.99', lease_time: '7200',     description: 'iot DHCPv4 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt7,  subnet_mask: '255.255.255.0', start_addr: '10.11.211.50', end_addr: '10.11.211.99', lease_time: '7200',    description: 'voip DHCPv4 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt8,  subnet_mask: '255.255.255.0', start_addr: '10.11.220.50', end_addr: '10.11.220.99', lease_time: '7200', description: 'storage DHCPv4 pool', ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt9,  subnet_mask: '255.255.255.0', start_addr: '10.11.230.50', end_addr: '10.11.230.99', lease_time: '7200',   description: 'media DHCPv4 pool',   ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt10, subnet_mask: '255.255.255.0', start_addr: '10.11.232.50', end_addr: '10.11.232.99', lease_time: '7200',  description: 'gaming DHCPv4 pool',  ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt11, subnet_mask: '255.255.255.0', start_addr: '10.11.240.50', end_addr: '10.11.240.99', lease_time: '7200',    description: 'cctv DHCPv4 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    # 10 DHCPv6 stateful pools — small range above the SLAAC static .100 so dynamic v6 clients also work.
    # `constructor` = interface providing the IPv6 prefix (same opt as the range's interface, since we use static GUA per VLAN).
    # Static LXCs at fdXX:XXX::100 are outside this pool — no conflict.
    - {interface: opt2,  constructor: opt2,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'mgmt DHCPv6 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt3,  constructor: opt3,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'dmz DHCPv6 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt4,  constructor: opt4,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'svc DHCPv6 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt5,  constructor: opt5,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'vpn DHCPv6 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt6,  constructor: opt6,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'iot DHCPv6 pool',     ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt7,  constructor: opt7,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'voip DHCPv6 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt8,  constructor: opt8,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'storage DHCPv6 pool', ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt9,  constructor: opt9,  prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'media DHCPv6 pool',   ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt10, constructor: opt10, prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'gaming DHCPv6 pool',  ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
    - {interface: opt11, constructor: opt11, prefix_len: '64', start_addr: '::1000', end_addr: '::1fff', lease_time: '7200', description: 'cctv DHCPv6 pool',    ref: {adr: 'infra/0004', lib_manager: 'DnsmasqRangeManager', ansible_module: 'opn_dnsmasq_range'}}
  # 20 DHCPv4 options + 10 DHCPv6 options (DNS-server only — clients use the FW's IPv6 GUA as DNS)
