# ---------------------------------------------------------------------------
# DNS enforcement — force all clients through FW Unbound (which DoT-forwards
# to Cloudflare + Quad9). Block any direct DNS (53) or DoT (853) leak from
# internal VLANs to non-FW destinations.
#
# Implementation: 4 floating-style rules (CSV interface list of all 10 zones)
# with `destination_not: '1'` so they fire when dst is NOT the FW gateway.
# `quick: 1` ensures these block-first matches stop further evaluation.
# disabled-by-default per `feedback_disabled_rules_for_testing` — flip via
# `firewall/filter/toggleRule/{uuid}` per zone (or all at once) after dry-run.
# ---------------------------------------------------------------------------
- description: 'BLOCK internal→non-FW port 53 (force plain DNS through Unbound) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host4_fw_gateways
  destination_not: '1'
  destination_port: port_dns
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 53 (force plain DNS through Unbound) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host6_fw_gateways
  destination_not: '1'
  destination_port: port_dns
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 853 (force DoT through Unbound) v4'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet
  protocol: TCP/UDP
  source_net: grp_net4_internal
  destination_net: host4_fw_gateways
  destination_not: '1'
  destination_port: port_dot
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
- description: 'BLOCK internal→non-FW port 853 (force DoT through Unbound) v6'
  action: block
  interface: 'opt2,opt3,opt4,opt5,opt6,opt7,opt8,opt9,opt10,opt11'
  direction: in
  ipprotocol: inet6
  protocol: TCP/UDP
  source_net: grp_net6_internal
  destination_net: host6_fw_gateways
  destination_not: '1'
  destination_port: port_dot
  quick: '1'
  enabled: '1'
  state: present
  ref: {adr: 'security/0001#dns-enforcement', lib_manager: FwFilterRuleManager, ansible_module: by_systems.opnsense.opnsense_fw_filter}
opn_snat_rules: []
opn_dnat_rules: []
opn_unbound:
  enabled: true
  domain: "{{ platform_domain }}"
  listen_acl_networks:
  - grp_net4_internal
  - grp_net6_internal
  host_overrides:
  # prod-only service the test FW must reach by its asset FQDN (Monit SMTP): same answer as the
  # prod split-DNS twin; the route to it is opn_routes (prod FW OOB next hop).
  - hostname: vm-mailcow-01
    domain: "{{ platform_mail_domain }}"
    rr: A
    server: 10.1.2.120
    description: 'prod mailcow — Monit SMTP submission (asset FQDN, prod split-DNS twin)'
  - hostname: lxc-mgmt-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.1.100
  - hostname: lxc-mgmt-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:1::100
  - hostname: lxc-dmz-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.2.100
  - hostname: lxc-dmz-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:2::100
  - hostname: lxc-svc-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.3.100
  - hostname: lxc-svc-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:3::100
  - hostname: lxc-vpn-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.4.100
  - hostname: lxc-vpn-deb13-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:4::100
  - hostname: lxc-iot-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.10.100
  - hostname: lxc-iot-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:10::100
  - hostname: lxc-voip-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.11.100
  - hostname: lxc-voip-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:11::100
  - hostname: lxc-storage-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.20.100
  - hostname: lxc-storage-ubu2404-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:20::100
  - hostname: lxc-media-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.30.100
  - hostname: lxc-media-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:30::100
  - hostname: lxc-gaming-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.32.100
  - hostname: lxc-gaming-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:32::100
  - hostname: lxc-cctv-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: A
    server: 10.11.40.100
  - hostname: lxc-cctv-rocky9-test-01
    domain: "{{ platform_domain }}"
    rr: AAAA
    server: fd11:40::100
  # Query Forwarding — chain step: Unbound → dnscrypt-proxy on loopback.
  # Empty domain = catch-all → Unbound creates a `forward-zone "."` from these entries.
  #
  # CRITICAL: keep `unbound.forwarding.enabled=0`. Counter-intuitive but verified on
  # vm-opns-test-01 2026-05-25: with `enabled=1` OPNsense generates a forward-zone
  # that points at `<system><dnsserver>` (10.6.224.1 plain) and IGNORES these
  # entries — caught via `dumpInfra` showing 10.6.224.1@53 not 127.0.0.1@53531.
  # See memory: lib-opnsense/reference_unbound_forwarding_toggle.
  # The serverbuilds.net recipe's "enable Query Forwarding" is misleading for OPNsense.
  forwarders:
    - {domain: '', server: '127.0.0.1', port: '53531', type: forward, enabled: '1',
       description: 'Unbound → dnscrypt-proxy loopback v4',
       ref: {adr: "infra/0004", lib_manager: "UbForwardManager", ansible_module: "opn_ub_forward"}}
    - {domain: '', server: '::1',       port: '53531', type: forward, enabled: '1',
       description: 'Unbound → dnscrypt-proxy loopback v6',
       ref: {adr: "infra/0004", lib_manager: "UbForwardManager", ansible_module: "opn_ub_forward"}}

# ---------------------------------------------------------------------------
# Kea DHCP4 — service + per-VLAN subnets
# ---------------------------------------------------------------------------
# Pool .50–.99 per zone. LXCs are static at .100 → no clash.
# fwrules='0' — we manage all firewall rules in opn_filter_rules.
opn_kea_dhcp4:
  enabled: true
  general:
    enabled: '1'
    fwrules: '0'
    valid_lifetime: '4000'
    interfaces:        # friendly names → slots via opn_interface_map
      - mgmt
      - dmz
      - svc
      - vpn
      - iot
      - voip
      - storage
      - media
      - gaming
      - cctv
  subnets:
    - subnet: 10.11.1.0/24
      pools: 10.11.1.50-10.11.1.99
      description: mgmt DHCPv4 pool
      option_data:
        routers: 10.11.1.1
        domain_name_servers: 10.11.1.1
