[defaults]
inventory          = inventories/poc/hosts.yml
roles_path         = roles
remote_user        = by-systems
private_key_file   = ~/.ssh/id_ed25519_rune
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
# vault_password_file is a [defaults] setting — under [privilege_escalation] it is
# ignored and surfaces as "Attempting to decrypt but no vault secrets found".
vault_password_file = .vault_pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root
