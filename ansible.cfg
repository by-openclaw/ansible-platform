[defaults]
inventory          = inventories/poc/hosts.yml
roles_path         = roles
remote_user        = by-research
private_key_file   = ~/.ssh/id_ed25519_rune
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = default
result_format      = yaml
callbacks_enabled  = timer, profile_tasks
# vault_password_file belongs under [defaults] — under [privilege_escalation]
# it is ignored and decryption fails with "no vault secrets found".
vault_password_file = .vault_pass

[privilege_escalation]
become        = True
become_method = sudo
become_user   = root

[ssh_connection]
# Every task used to open two fresh SSH handshakes through the jump host (~8 s each on
# 2026-09-19). Pipelining removes the per-task file transfer; the control socket keeps
# the connection to each host open between tasks. Hosts allow sudo without a tty.
pipelining       = True
ssh_args         = -o ControlMaster=auto -o ControlPersist=120s -o ServerAliveInterval=30
control_path_dir = ~/.ansible/cp
