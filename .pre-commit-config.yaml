repos:
  # Secret detection — blocks commits containing passwords, API tokens, private keys
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            \.secrets\.baseline|
            tests/integration/.*\.sh|
            \.env\.example
          )$

  # Image pins — no moving tags (:latest/:stable/:edge) and no untagged image
  # variable: a redeploy must never change the running software silently.
  - repo: local
    hooks:
      - id: image-pins
        name: image pins (no :latest, no untagged image)
        entry: scripts/check_image_pins.sh
        language: script
        pass_filenames: false
        files: ^(roles|playbooks|inventories)/.*
      - id: platform-literals
        name: platform identity literals (no domain/org literal or fallback in roles, playbooks)
        entry: scripts/check_platform_literals.py
        language: script
        pass_filenames: false
        files: ^(roles|playbooks)/.*
      - id: loop-on-skipped-register
        name: no loop over a register --check leaves empty (the loop runs before its when)
        entry: scripts/check_loop_on_skipped_register.py
        language: script
        pass_filenames: false
        files: ^(roles|playbooks)/.*

  # General hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-toml
      - id: check-json

  # Python linting + formatting (same as CI)
  # No ruff: this is an Ansible repo (CI uses ansible-lint, not ruff); the
  # utility scripts predate ruff and would block unrelated commits.
